both unfashioned and fashioned, uncreated in preexistence but created in having received this material composition.","xs":["This tabernacle would be Christ who is the power and the wisdom of God, who in his own nature was not made with hands, yet capable of being made when it became necessary for this tabernacle to be erected among us."]},{"skip":false,"v":531,"tp":10,"k":"r","note":"Aaron as the angel-brother","gi":535,"id":"b2-3","sec":"The Meeting with Aaron","book":"Book II","n":47,"p":5,"a":4,"at":1374.0,"x":"Then his brother brings him assistance and joins him, for the angel, who in a way is a brother to the rational and intellectual part of man's soul, appears, as I have said, and stands by us whenever we approach the Pharaoh.","para":"If, then, one should withdraw from those who seduce him to evil and by the use of his reason turn to the better, putting evil behind him, it is as if he places his own soul, like a mirror, face to face with the hope of good things, with the result that the images and impressions of virtue, as it is shown to him by God, are imprinted on the purity of his soul. Then his brother brings him assistance and joins him, for the angel, who in a way is a brother to the rational and intellectual part of man's soul, appears, as I have said, and stands by us whenever we approach the Pharaoh.","xs":["Then his brother brings him assistance and joins him, for the angel, who in a way is a brother to the rational and intellectual part of man's soul, appears, as I have said, and stands by us whenever we approach the Pharaoh."]},{"skip":false,"v":588,"tp":11,"k":"q","note":"","gi":530,"id":"b2-3","sec":"The Meeting with Aaron","book":"Book II","n":45,"p":3,"a":4,"at":1293.0,"x":"There is a doctrine (which derives its trustworthiness from the tradition of the fathers) which says that after our nature fell into sin God did not disregard our fall and withhold his providence.","para":"So as not to interpret the figures by our own figure, I shall set forth my understanding about this more plainly. There is a doctrine (which derives its trustworthiness from the tradition of the fathers) which says that after our nature fell into sin God did not disregard our fall and withhold his providence. No, on the one hand, he appointed an angel with an incorporeal nature to help in the life of each person and, on the other hand, he also appointed the corruptor who, by an evil and maleficent demon, afflicts the life of man and contrives against our nature.","xs":["There is a doctrine (which derives its trustworthiness from the tradition of the fathers) which says that after our nature fell into sin God did not disregard our fall and withhold his providence.","No, on the one hand, he appointed an angel with an incorporeal nature to help in the life of each person and, on the other hand, he also appointed the corruptor who, by an evil and maleficent demon, afflicts the life of man and contrives against our nature."]},{"skip":false,"v":800,"tp":16,"k":"q","note":"","gi":383,"id":"b2-1","sec":"Birth and Childhood","book":"Book II","n":2,"p":1,"a":3,"at":1043.9,"x":"For the material and passionate disposition to which human nature is carried when it falls is the female form of life, whose birth is favored by the tyrant.","para":"Everyone knows that anything placed in a world of change never remains the same but is always passing from one state to another, the alteration always bringing about something better or worse. The narrative is to be understood according to its real intention. For the material and passionate disposition to which human nature is carried when it falls is the female form of life, whose birth is favored by the tyrant. The austerity and intensity of virtue is the male birth, which is hostile to the tyrant and suspected of insurrection against his rule.","xs":["For the material and passionate disposition to which human nature is carried when it falls is the female form of life, whose birth is favored by the tyrant."]},{"skip":false,"v":899,"tp":18,"k":"q","note":"","gi":410,"id":"b2-1","sec":"Birth and Childhood","book":"Book II","n":10,"p":9,"a":3,"at":1722.0,"x":"Since the daughter of the king, being childless and barren (I think she is rightly perceived as profane philosophy), arranged to be called his mother by adopting the youngster, Scripture concedes that his relationship with her who was falsely called his mother should not be rejected until he had recognized his own immaturity.","para":"Since the daughter of the king, being childless and barren (I think she is rightly perceived as profane philosophy), arranged to be called his mother by adopting the youngster, Scripture concedes that his relationship with her who was falsely called his mother should not be rejected until he had recognized his own immaturity. But he who has already attained maturity, as we have learned about Moses, will be ashamed to be called the son of one who is barren by nature.","xs":["Since the daughter of the king, being childless and barren (I think she is rightly perceived as profane philosophy), arranged to be called his mother by adopting the youngster, Scripture concedes that his relationship with her who was falsely called his mother should not be rejected until he had recognized his own immaturity."]},{"skip":false,"v":899,"tp":18,"k":"q","note":"","gi":413,"id":"b2-1","sec":"Birth and Childhood","book":"Book II","n":11,"p":10,"a":3,"at":1765.0,"x":"For truly barren is profane education, which is always in labor but never gives birth.","para":"For truly barren is profane education, which is always in labor but never gives birth. For what fruit worthy of such pangs does philosophy show for being so long in labor? Do not all who are full of wind and never come to term miscarry before they come to the light of the knowledge of God, although they could as well become men if they were not altogether hidden in the womb of barren wisdom?","xs":["For truly barren is profane education, which is always in labor but never gives birth."]},{"skip":false,"v":961,"tp":19,"k":"q","note":"\"Womb of barren wisdom\"","gi":415,"id":"b2-1","sec":"Birth and Childhood","book":"Book II","n":11,"p":10,"a":3,"at":1776.0,"x":"Do not all who are full of wind and never come to term miscarry before they come to the light of the knowledge of God, although they could as well become men if they were not altogether hidden in the womb of barren wisdom?","para":"For truly barren is profane education, which is always in labor but never gives birth. For what fruit worthy of such pangs does philosophy show for being so long in labor? Do not all who are full of wind and never come to term miscarry before they come to the light of the knowledge of God, although they could as well become men if they were not altogether hidden in the womb of barren wisdom?","xs":["Do not all who are full of wind and never come to term miscarry before they come to the light of the knowledge of God, although they could as well become men if they were not altogether hidden in the womb of barren wisdom?"]},{"skip":false,"v":961,"tp":19,"k":"r","note":"The birth mother as the Church","gi":416,"id":"b2-1","sec":"Birth and Childhood","book":"Book II","n":12,"p":11,"a":3,"at":1795.6,"x":"Now after living with the princess of the Egyptians for such a long time that he seemed to share in their honors, he must return to his natural mother.","para":"Now after living with the princess of the Egyptians for such a long time that he seemed to share in their honors, he must return to his natural mother. Indeed he was not separated from her while he was being brought up by the princess but was nursed by his mother's milk, as the history states. This teaches, it seems to me, that if we should be involved with profane teachings during our education, we should not separate ourselves from the nourishment of the Church's milk, which would be her laws and customs. By these the soul is nourished and matured, thus being given the means of ascending the height.","xs":["Now after living with the princess of the Egyptians for such a long time that he seemed to share in their honors, he must return to his natural mother."]},{"skip":false,"v":1097,"tp":21,"k":"q","note":"","gi":429,"id":"b2-1","sec":"Birth and Childhood","book":"Book II","n":15,"p":14,"a":3,"at":2074.0,"x":"Moses teaches us by his own example to take our stand with virtue as with a kinsman and to kill virtue's adversary.","para":"Moses teaches us by his own example to take our stand with virtue as with a kinsman and to kill virtue's adversary. The victory of true religion is the death and destruction of idolatry. So also injustice is killed by righteousness and arrogance is slain by humility.","xs":["Moses teaches us by his own example to take our stand with virtue as with a kinsman and to kill virtue's adversary."]},{"skip":false,"v":1158,"tp":22,"k":"q","note":"","gi":1632,"id":"b2-27","sec":"Balaam and the Daughters of Moab","book":"Book II","n":299,"p":8,"a":12,"at":2665.0,"x":"It was only to be expected that some among them would be filled with lust for unlawful intercourse with foreigners.","para":"It was only to be expected that some among them would be filled with lust for unlawful intercourse with foreigners. But intimacy with evil meant estrangement from the assistance of the Good; immediately God began to war against them. The zealous Phineas, however, did not wait to have sin purged by heavenly decision; he himself became at once judge and jury.","xs":["It was only to be expected that some among them would be filled with lust for unlawful intercourse with foreigners."]},{"skip":false,"v":1188,"tp":23,"k":"q","note":"","gi":502,"id":"b2-2","sec":"The Burning Bush","book":"Book II","n":37,"p":20,"a":4,"at":967.0,"x":"The foreign wife will follow him, for there are certain things derived from profane education which should not be rejected when we propose to give birth to virtue.","para":"The foreign wife will follow him, for there are certain things derived from profane education which should not be rejected when we propose to give birth to virtue. Indeed moral and natural philosophy may become at certain times a comrade, friend, and companion of life to the higher way, provided that the offspring of this union introduce nothing of a foreign defilement.","xs":["The foreign wife will follow him, for there are certain things derived from profane education which should not be rejected when we propose to give birth to virtue."]},{"skip":false,"v":1249,"tp":24,"k":"q","note":"","gi":505,"id":"b2-2","sec":"The Burning Bush","book":"Book II","n":38,"p":21,"a":4,"at":1027.0,"x":"Since his son had not been circumcised so as to cut off completely everything hurtful and impure, the angel who met them brought the fear of death.","para":"Since his son had not been circumcised so as to cut off completely everything hurtful and impure, the angel who met them brought the fear of death. His wife appeased the angel when she presented her offspring as pure by completely removing that mark by which the foreigner was known.","xs":["Since his son had not been circumcised so as to cut off completely everything hurtful and impure, the angel who met them brought the fear of death."]},{"skip":false,"v":1322,"tp":25,"k":"q","note":"","gi":850,"id":"b2-11","sec":"Crossing the Red Sea","book":"Book II","n":126,"p":5,"a":7,"at":1420.0,"x":"Thus also he means here that after we have drowned the whole Egyptian person (that is every form of evil) in the saving baptism we emerge alone, dragging along nothing foreign in our subsequent life.","para":"Just as unleavened bread was eaten in the mystery of the Pasch (which is the name of the sacrificial victim whose blood prevents the death of the one using it), even so the Law now commands us to eat unleavened bread at the Pasch (unleavened would be unmixed with stale yeast). The Law gives us to understand by this that no remnant of evil should mix with the subsequent life. Rather we should make a totally new beginning in life after these things, breaking the continuity with evil by a radical change for the better. Thus also he means here that after we have drowned the whole Egyptian person (that is every form of evil) in the saving baptism we emerge alone, dragging along nothing foreign in our subsequent life. This is what we hear through the history, which says that in the same water the enemy and the friend are distinguished by death and life, the enemy being destroyed and the friend given life.","xs":["Thus also he means here that after we have drowned the whole Egyptian person (that is every form of evil) in the saving baptism we emerge alone, dragging along nothing foreign in our subsequent life."]},{"skip":false,"v":1374,"tp":26,"k":"q","note":"","gi":971,"id":"b2-15","sec":"The Mountain of Divine Knowledge","book":"Book II","n":156,"p":4,"a":8,"at":2145.0,"x":"That none of the irrational animals was allowed to appear on the mountain signifies, in my opinion, that in the contemplation of the intelligibles we surpass the knowledge which originates with the senses.","para":"When this had been accomplished and the herd of irrational animals had been driven as far from the mountain as possible, Moses then approached the ascent to lofty perceptions. That none of the irrational animals was allowed to appear on the mountain signifies, in my opinion, that in the contemplation of the intelligibles we surpass the knowledge which originates with the senses. For it is characteristic of the nature of irrational animals that they are governed by the senses alone divorced from understanding. Their sight and hearing often lead them to what stimulates their appetites. Also, all other things through which sense perception becomes active assume an important place in irrational animals.","xs":["That none of the irrational animals was allowed to appear on the mountain signifies, in my opinion, that in the contemplation of the intelligibles we surpass the knowledge which originates with the senses."]},{"skip":false,"v":1427,"tp":27,"k":"q","note":"","gi":452,"id":"b2-2","sec":"The Burning Bush","book":"Book II","n":22,"p":3,"a":4,"at":230.7,"x":"Sandaled feet cannot ascend that height where the light of truth is seen, but the dead and earthly covering of skins, which was placed around our nature at the beginning when we were found naked because of disobedience to the divine will, must be removed from the feet of the soul.","para":"That light teaches us what we must do to stand within the rays of the true light: Sandaled feet cannot ascend that height where the light of truth is seen, but the dead and earthly covering of skins, which was placed around our nature at the beginning when we were found naked because of disobedience to the divine will, must be removed from the feet of the soul.","xs":["Sandaled feet cannot ascend that height where the light of truth is seen, but the dead and earthly covering of skins, which was placed around our nature at the beginning when we were found naked because of disobedience to the divine will, must be removed from the feet of the soul."]},{"skip":false,"v":1427,"tp":27,"k":"r","note":"The bush was a thorn bush","gi":444,"id":"b2-2","sec":"The Burning Bush","book":"Book II","n":20,"p":1,"a":4,"at":129.0,"x":"And if the flame by which the soul of the prophet was illuminated was kindled from a thorny bush, even this fact will not be useless for our inquiry.","para":"And if the flame by which the soul of the prophet was illuminated was kindled from a thorny bush, even this fact will not be useless for our inquiry. For if truth is God and truth is light—the Gospel testifies by these sublime and divine names to the God who made himself visible to us in the flesh — such guidance of virtue leads us to know that light which has reached down even to human nature. Lest one think that the radiance did not come from a material substance, this light did not shine from some luminary among the stars but came from an earthly bush and surpassed the heavenly luminaries in brilliance.","xs":["And if the flame by which the soul of the prophet was illuminated was kindled from a thorny bush, even this fact will not be useless for our inquiry."]},{"skip":false,"v":1475,"tp":28,"k":"q","note":"","gi":467,"id":"b2-2","sec":"The Burning Bush","book":"Book II","n":26,"p":8,"a":4,"at":459.0,"x":"In the same way that Moses on that occasion attained to this knowledge, so now does everyone who, like him, divests himself of the earthly covering and looks to the light shining from the bramble bush, that is, to the Radiance which shines upon us through this thorny flesh and which is (as the Gospel says) the true light and the truth itself.","para":"In the same way that Moses on that occasion attained to this knowledge, so now does everyone who, like him, divests himself of the earthly covering and looks to the light shining from the bramble bush, that is, to the Radiance which shines upon us through this thorny flesh and which is (as the Gospel says) the true light and the truth itself. A person like this becomes able to help others to salvation, to destroy the tyranny which holds power wickedly, and to deliver to freedom everyone held in evil servitude.","xs":["In the same way that Moses on that occasion attained to this knowledge, so now does everyone who, like him, divests himself of the earthly covering and looks to the light shining from the bramble bush, that is, to the Radiance which shines upon us through this thorny flesh and which is (as the Gospel says) the true light and the truth itself."]},{"skip":false,"v":1594,"tp":30,"k":"q","note":"","gi":572,"id":"b2-4","sec":"Deliverance Announced","book":"Book II","n":59,"p":5,"a":4,"at":2051.0,"x":"For this demon who does men harm and corrupts them is intensely concerned that his subjects not look to heaven but that they stoop to earth and make bricks within themselves out of the clay.","para":"For this demon who does men harm and corrupts them is intensely concerned that his subjects not look to heaven but that they stoop to earth and make bricks within themselves out of the clay. It is clear to everyone that whatever belongs to material pleasure consists assuredly of earth or water, whether one is concerned with the pleasures of the stomach and the table or with the pleasures of wealth.","xs":["For this demon who does men harm and corrupts them is intensely concerned that his subjects not look to heaven but that they stoop to earth and make bricks within themselves out of the clay."]},{"skip":false,"v":1594,"tp":30,"k":"r","note":"The frogs","gi":607,"id":"b2-5","sec":"The Plagues on Egypt","book":"Book II","n":69,"p":6,"a":5,"at":635.0,"x":"The breed of frogs is obviously the destructive offspring of the evil which is brought to life from the sordid heart of men as though from some slimy mire.","para":"The breed of frogs is obviously the destructive offspring of the evil which is brought to life from the sordid heart of men as though from some slimy mire. These frogs overrun the houses of those who choose to live the Egyptian life, appearing on the tables, not even sparing the beds, and entering the very storerooms.","xs":["The breed of frogs is obviously the destructive offspring of the evil which is brought to life from the sordid heart of men as though from some slimy mire."]},{"skip":false,"v":1705,"tp":32,"k":"r","note":"The many stay below; Moses goes up","gi":983,"id":"b2-15","sec":"The Mountain of Divine Knowledge","book":"Book II","n":158,"p":6,"a":8,"at":2515.0,"x":"The knowledge of God is a mountain steep indeed and difficult to climb —the majority of people scarcely reach its base.","para":"The knowledge of God is a mountain steep indeed and difficult to climb —the majority of people scarcely reach its base. If one were a Moses, he would ascend higher and hear the sound of trumpets which, as the text of the history says, becomes louder as one advances. For the preaching of the divine nature is truly a trumpet blast, which strikes the hearing, being already loud at the beginning but becoming yet louder at the end.","xs":["The knowledge of God is a mountain steep indeed and difficult to climb —the majority of people scarcely reach its base."]},{"skip":false,"v":1757,"tp":33,"k":"r","note":"The true knowledge of Being","gi":459,"id":"b2-2","sec":"The Burning Bush","book":"Book II","n":23,"p":5,"a":4,"at":290.0,"x":"So, whoever applies himself in quietness to higher philosophical matters over a long period of time will barely apprehend what true Being is, that is, what possesses existence in its own nature, and what nonbeing is, that is, what is existence only in appearance, with no self-subsisting nature.","para":"In my view the definition of truth is this: not to have a mistaken apprehension of Being. Falsehood is a kind of impression which arises in the understanding about nonbeing: as though what does not exist does, in fact, exist. But truth is the sure apprehension of real Being. So, whoever applies himself in quietness to higher philosophical matters over a long period of time will barely apprehend what true Being is, that is, what possesses existence in its own nature, and what nonbeing is, that is, what is existence only in appearance, with no self-subsisting nature.","xs":["So, whoever applies himself in quietness to higher philosophical matters over a long period of time will barely apprehend what true Being is, that is, what possesses existence in its own nature, and what nonbeing is, that is, what is existence only in appearance, with no self-subsisting nature."]},{"skip":false,"v":1820,"tp":34,"k":"r","note":"Dependent beings and falsehood","gi":457,"id":"b2-2","sec":"The Burning Bush","book":"Book II","n":23,"p":5,"a":4,"at":274.0,"x":"Falsehood is a kind of impression which arises in the understanding about nonbeing: as though what does not exist does, in fact, exist.","para":"In my view the definition of truth is this: not to have a mistaken apprehension of Being. Falsehood is a kind of impression which arises in the understanding about nonbeing: as though what does not exist does, in fact, exist. But truth is the sure apprehension of real Being. So, whoever applies himself in quietness to higher philosophical matters over a long period of time will barely apprehend what true Being is, that is, what possesses existence in its own nature, and what nonbeing is, that is, what is existence only in appearance, with no self-subsisting nature.","xs":["Falsehood is a kind of impression which arises in the understanding about nonbeing: as though what does not exist does, in fact, exist."]},{"skip":false,"v":1892,"tp":35,"k":"q","note":"","gi":1002,"id":"b2-16","sec":"The Darkness","book":"Book II","n":162,"p":0,"a":9,"at":68.0,"x":"What does it mean that Moses entered the darkness and then saw God in it?","para":"What does it mean that Moses entered the darkness and then saw God in it? What is now recounted seems somehow to be contradictory to the first theophany, for then the Divine was beheld in light but now he is seen in darkness. Let us not think that this is at variance with the sequence of things we have contemplated spiritually. Scripture teaches by this that religious knowledge comes at first to those who receive it as light. Therefore what is perceived to be contrary to religion is darkness, and the escape from darkness comes about when one participates in light. But as the mind progresses and, through an ever greater and more perfect diligence, comes to apprehend reality, as it approaches more nearly to contemplation, it sees more clearly what of the divine nature is uncontemplated.","xs":["What does it mean that Moses entered the darkness and then saw God in it?"]},{"skip":false,"v":1934,"tp":36,"k":"q","note":"","gi":1007,"id":"b2-16","sec":"The Darkness","book":"Book II","n":162,"p":0,"a":9,"at":108.0,"x":"But as the mind progresses and, through an ever greater and more perfect diligence, comes to apprehend reality, as it approaches more nearly to contemplation, it sees more clearly what of the divine nature is uncontemplated.","para":"What does it mean that Moses entered the darkness and then saw God in it? What is now recounted seems somehow to be contradictory to the first theophany, for then the Divine was beheld in light but now he is seen in darkness. Let us not think that this is at variance with the sequence of things we have contemplated spiritually. Scripture teaches by this that religious knowledge comes at first to those who receive it as light. Therefore what is perceived to be contrary to religion is darkness, and the escape from darkness comes about when one participates in light. But as the mind progresses and, through an ever greater and more perfect diligence, comes to apprehend reality, as it approaches more nearly to contemplation, it sees more clearly what of the divine nature is uncontemplated.","xs":["But as the mind progresses and, through an ever greater and more perfect diligence, comes to apprehend reality, as it approaches more nearly to contemplation, it sees more clearly what of the divine nature is uncontemplated."]},{"skip":false,"v":1993,"tp":37,"k":"r","note":"The candlestick","gi":1093,"id":"b2-17","sec":"The Heavenly Tabernacle","book":"Book II","n":181,"p":11,"a":9,"at":2137.0,"x":"And if you should hear about lamps which have many branches coming out of one candlestick so that a full and brilliant light is cast all around, you would correctly conclude that they are the varied rays of the Spirit which shine brightly in this tabernacle.","para":"The ark of the covenant, covered by their wings, should not sound strange to your ears. For it is possible to read the same thing also in Isaiah, where the Prophet speaks in a figure about the wings. The same thing is called the ark of the covenant in one place and in the other place the Face; in the one the ark is covered by the wings, in the other the Face is. It is as though one thing is perceived in both, which suggests to me the incomprehensibility of contemplating the ineffable secrets. And if you should hear about lamps which have many branches coming out of one candlestick so that a full and brilliant light is cast all around, you would correctly conclude that they are the varied rays of the Spirit which shine brightly in this tabernacle. This is what Isaiah is speaking about when he divides the lights of the Spirit into seven.","xs":["And if you should hear about lamps which have many branches coming out of one candlestick so that a full and brilliant light is cast all around, you would correctly conclude that they are the varied rays of the Spirit which shine brightly in this tabernacle."]},{"skip":false,"v":1993,"tp":37,"k":"q","note":"Pillars and lights","gi":1108,"id":"b2-18","sec":"The Earthly Tabernacle","book":"Book II","n":184,"p":0,"a":9,"at":2317.0,"x":"For it is not only Peter and John and James who are pillars of the Church, nor was only John the Baptist a burning light, but all those who themselves support the Church and become lights through their own works are called \"pillars\" and \"lights.\" You are the light of the world, says the Lord to the Apostles.","para":"Whenever the prophet looks to the tabernacle above, he sees the heavenly realities through these symbols. But if one should look at the tabernacle below (since in many places the Church also is called Christ by Paul), it would be well to regard the names \"apostles, teachers, and prophets\" as referring to those servants of the divine mystery whom Scripture also calls pillars of the Church. For it is not only Peter and John and James who are pillars of the Church, nor was only John the Baptist a burning light, but all those who themselves support the Church and become lights through their own works are called \"pillars\" and \"lights.\" You are the light of the world, says the Lord to the Apostles. And again the divine Apostle bids others to be pillars, saying Be steadfast and unmovable. And he made Timothy into an excellent pillar, when he made him (as he says in his own words) a pillar and ground of truth.","xs":["For it is not only Peter and John and James who are pillars of the Church, nor was only John the Baptist a burning light, but all those who themselves support the Church and become lights through their own works are called \"pillars\" and \"lights.\" You are the light of the world, says the Lord to the Apostles."]},{"skip":false,"v":2039,"tp":38,"k":"q","note":"","gi":1101,"id":"b2-17","sec":"The Heavenly Tabernacle","book":"Book II","n":183,"p":13,"a":9,"at":2242.0,"x":"Even if one sees skin dyed red and hair woven, the sequence of contemplation is not broken in this way.","para":"Even if one sees skin dyed red and hair woven, the sequence of contemplation is not broken in this way. For the prophetic eye, attaining to a vision of divine things, will see the saving Passion there predetermined. It is signified in both of the elements mentioned: the redness pointing to blood and the hair to death. Hair on the body has no feeling; hence it is rightly a symbol of death.","xs":["Even if one sees skin dyed red and hair woven, the sequence of contemplation is not broken in this way."]},{"skip":false,"v":2094,"tp":39,"k":"q","note":"","gi":1104,"id":"b2-17","sec":"The Heavenly Tabernacle","book":"Book II","n":183,"p":13,"a":9,"at":2263.0,"x":"Hair on the body has no feeling; hence it is rightly a symbol of death.","para":"Even if one sees skin dyed red and hair woven, the sequence of contemplation is not broken in this way. For the prophetic eye, attaining to a vision of divine things, will see the saving Passion there predetermined. It is signified in both of the elements mentioned: the redness pointing to blood and the hair to death. Hair on the body has no feeling; hence it is rightly a symbol of death.","xs":["Hair on the body has no feeling; hence it is rightly a symbol of death."]},{"skip":false,"v":2150,"tp":40,"k":"r","note":"Arrogance as a \"downward ascent\"","gi":1544,"id":"b2-25","sec":"The True Priesthood","book":"Book II","n":280,"p":4,"a":12,"at":1317.0,"x":"The Scripture teaches in the history, I think, that when one arrogantly exalts himself he ends by falling even below the earth.","para":"The Scripture teaches in the history, I think, that when one arrogantly exalts himself he ends by falling even below the earth. And perhaps, if viewed through these events, arrogance might not unreasonably be defined as a downward ascent.","xs":["The Scripture teaches in the history, I think, that when one arrogantly exalts himself he ends by falling even below the earth."]},{"skip":false,"v":2150,"tp":40,"k":"r","note":"The false ascent to the priesthood","gi":1535,"id":"b2-25","sec":"The True Priesthood","book":"Book II","n":279,"p":2,"a":12,"at":1224.0,"x":"For when some individuals punish the passion of desire by living a disciplined life, they thrust themselves into the priesthood, and with human zeal and selfish ambition they arrogate to themselves God's ministry.","para":"It is possible even now to see this happening on many occasions. For when some individuals punish the passion of desire by living a disciplined life, they thrust themselves into the priesthood, and with human zeal and selfish ambition they arrogate to themselves God's ministry. He whom the history accuses of producing evil in men leads them to the subsequent sin.","xs":["For when some individuals punish the passion of desire by living a disciplined life, they thrust themselves into the priesthood, and with human zeal and selfish ambition they arrogate to themselves God's ministry."]}],"outline":[{"t":1,"h":"Why this book","s":"A first encounter with St. Gregory that kept connecting everything."},{"t":103,"h":"The pattern: a map of meaning","s":"Moses climbing the mountain is the same pattern as the Ladder of Divine Ascent."},{"t":261,"h":"Bottom of the mountain","s":"Garments of skin, the narthex, the \"feet of the soul\": appetite and passion."},{"t":318,"h":"Top of the mountain","s":"The intellect, the sanctuary, and the divine tabernacle, which is Christ."},{"t":430,"h":"Symbols point in a direction","s":"Nothing on the map is good or bad in itself; what matters is which way it moves."},{"t":531,"h":"Aaron: angel or corrupter","s":"The brother who counsels us can carry the angel or the demon."},{"t":702,"h":"Sponsor message","s":"A short book announcement; skip ahead to 12:34."},{"t":754,"h":"Back to the ladder icon","s":"Angels lift, demons pull; the question is which way we move."},{"t":800,"h":"The birth of Moses","s":"The tyrant favors the \"female\" birth of passion and kills the \"male\" birth of virtue."},{"t":899,"h":"Two mothers","s":"The barren princess (profane learning) and the birth mother (the Church)."},{"t":1027,"h":"The foreign","s":"Tyranny and seduction: slavery to what is added to our nature."},{"t":1097,"h":"Killing the Egyptian","s":"Take the side of virtue and kill its adversary; foreign women and idolatry."},{"t":1188,"h":"The foreign wife and circumcision","s":"Profane learning can become a companion; circumcision removes the foreign mark."},{"t":1322,"h":"The Red Sea as baptism","s":"Drowning the \"whole Egyptian person\" and emerging with nothing foreign."},{"t":1374,"h":"Removing the sandals","s":"No animals on the mountain; the dead skins must come off the feet of the soul."},{"t":1427,"h":"The thorn bush","s":"The light shines through thorny flesh: the Incarnation."},{"t":1531,"h":"Clay, bricks and frogs","s":"Chaos at the edge of being, where the center no longer holds."},{"t":1641,"h":"The ascent as divesting","s":"From the many at the base to the one at the summit."},{"t":1757,"h":"Toward Being itself","s":"Leaving dependent beings; darkness, then light and music."},{"t":1892,"h":"The divine darkness","s":"Why Moses first sees God in light and later in darkness."},{"t":1934,"h":"The pattern of the tabernacle","s":"The candlestick and the pillars: the saints and all of us as lights."},{"t":2039,"h":"Skins dyed red","s":"The removed skins return, transformed: the Passion of Christ."},{"t":2150,"h":"The false ascent of pride","s":"Taking the priesthood for oneself: a downward ascent."},{"t":2209,"h":"The whole map","s":"Every element with its light and dark side, gathered in the tabernacle."},{"t":2340,"h":"Seeing the pattern in icons","s":"The same structure in the icons, the Tower of Babel, and the Nativity cave."},{"t":2574,"h":"Closing","s":"Read St. Gregory and the Scriptures with this vision."}]}</script>
<script>
const BOOKS = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s), app = $('#app');
const LS = {get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
            set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const WPM = 230;
const mins = w => Math.max(1, Math.round(w / WPM));
const hm = m => m < 60 ? m + ' min' : Math.floor(m/60) + ' hr ' + (m%60 ? (m%60) + ' min' : '');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const HEART = 'M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1L12 21l7.7-7.6 1.1-1a5.5 5.5 0 0 0 0-7.8z';
const CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const CHEV = '<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';

// flat index of every section in reading order
const ALL = [], BYID = {}, BOOKBY = {};
BOOKS.forEach(b => { BOOKBY[b.id] = b; b.s.forEach((s, i) => { s.b = b; s.i = i; s.g = ALL.length; ALL.push(s); BYID[s.id] = s; }); });
const range = s => s.r ? (s.r[0] === s.r[1] ? '§' + s.r[0] : '§' + s.r[0] + '–' + s.r[1]) : '';

let done = LS.get('lom_done', {});        // {sectionId: timestamp}
let favs = LS.get('lom_favs', []);        // [{k, id, p, n, x, w}]
let last = LS.get('lom_last', null);      // {id, y}
const isDone = id => !!done[id];
function setDone(id, on){ if (on) done[id] = Date.now(); else delete done[id]; LS.set('lom_done', done); }
const fk = (id, p) => id + '/' + p;
const isFav = (id, p) => favs.some(f => f.k === fk(id, p));
const favCount = id => favs.filter(f => f.id === id).length;

/* ---------- theme + text settings ---------- */
const SUN='<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/>';
const MOON='<path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/>';
function applyTheme(t){ document.documentElement.setAttribute('data-theme', t);
  $('#ttsvg').innerHTML = t === 'dark' ? SUN : MOON;
  $('#tcolor').setAttribute('content', t === 'dark' ? '#1e1e1e' : '#f3f3f3'); }
let theme = LS.get('lom_theme', null);
if (!theme) theme = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
applyTheme(theme);
$('#tt').onclick = () => { theme = theme === 'dark' ? 'light' : 'dark'; LS.set('lom_theme', theme); applyTheme(theme); };

const SIZES = [17, 19, 21, 23, 25, 28, 31];
let fs = LS.get('lom_fs', 21), font = LS.get('lom_font', 'sans');
const SERIF = '"New York","Iowan Old Style",ui-serif,Georgia,"Times New Roman",serif';
const SANS = '-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",system-ui,sans-serif';
function applyText(){
  document.documentElement.style.setProperty('--fs', fs + 'px');
  document.documentElement.style.setProperty('--rf', font === 'serif' ? SERIF : SANS);
  $('#fsv').textContent = fs;
  document.querySelectorAll('[data-f]').forEach(b => b.classList.toggle('on', b.dataset.f === font));
}
applyText();
function sizeStep(d){
  let i = SIZES.indexOf(fs); if (i < 0) i = 2;
  i = Math.min(SIZES.length - 1, Math.max(0, i + d)); fs = SIZES[i]; LS.set('lom_fs', fs); applyText();
}
$('#fsm').onclick = () => sizeStep(-1);
$('#fsp').onclick = () => sizeStep(1);
document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { font = b.dataset.f; LS.set('lom_font', font); applyText(); });
let cmode = LS.get('lom_cm', 'show');
function applyCm(){ document.body.classList.toggle('skipc', cmode === 'skip');
  document.querySelectorAll('[data-cm]').forEach(b => b.classList.toggle('on', b.dataset.cm === cmode)); }
applyCm();
document.querySelectorAll('[data-cm]').forEach(b => b.onclick = () => { cmode = b.dataset.cm; LS.set('lom_cm', cmode); applyCm();
  toast(cmode === 'skip' ? 'Commentary hidden and skipped in audio' : 'Commentary shown and played'); });
const sheet = $('#sheet'), scrim = $('#scrim');
const sheetOpen = on => { sheet.classList.toggle('open', on); scrim.classList.toggle('open', on); };
$('#aa').onclick = () => sheetOpen(!sheet.classList.contains('open'));
scrim.onclick = () => sheetOpen(false);
$('#favbtn').onclick = () => location.hash = '#favs';
$('#srchbtn').onclick = () => location.hash = '#search';

let tt = null;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 1700); }

function setNav(backTo, label, brand){
  const b = $('#back');
  b.hidden = !backTo;
  if (backTo){ $('#backlab').textContent = label; b.onclick = () => location.hash = backTo; }
  $('#brand').textContent = brand;
}

/* ---------- stats ---------- */
function stats(list){
  const tot = list.length, fin = list.filter(s => isDone(s.id)).length;
  const wl = list.filter(s => !isDone(s.id)).reduce((a, s) => a + s.w, 0);
  const wt = list.reduce((a, s) => a + s.w, 0);
  const al = list.filter(s => !isDone(s.id)).reduce((a, s) => a + (s.dur || 0), 0);
  return {tot, fin, left: tot - fin, minLeft: wl ? mins(wl) : 0, audLeft: Math.round(al / 60), pct: wt ? Math.round(100 * (wt - wl) / wt) : 0};
}
function nextUp(){
  // the section you were last in if unfinished, else the next unfinished after it, else the first unfinished
  if (last && BYID[last.id] && !isDone(last.id)) return BYID[last.id];
  const from = last && BYID[last.id] ? BYID[last.id].g + 1 : 0;
  for (let i = 0; i < ALL.length; i++){ const s = ALL[(from + i) % ALL.length]; if (!isDone(s.id)) return s; }
  return null;
}

/* ---------- home ---------- */
function home(){
  setNav(null, '', 'The Life of Moses');
  const st = stats(ALL), nx = nextUp();
  let h = `<div class="hero"><div class="eyebrow">Gregory of Nyssa</div>
    <h1>The Life of Moses</h1><p>Concerning Perfection in Virtue</p>
    <button class="sfield" id="hs">${SICON}<span class="ph">Search any word or phrase</span></button></div>`;
  h += `<div class="prog">
    <div class="big">${st.left ? st.left + ' section' + (st.left === 1 ? '' : 's') + ' left' : 'All finished'}
      <small>${st.left ? 'About ' + hm(st.minLeft) + ' of reading, or ' + hm(st.audLeft) + ' of audio' : 'Every section is marked read'}</small></div>
    <div class="track"><div class="fill" style="width:${st.pct}%"></div></div>
    <div class="plab"><span>${st.fin} of ${st.tot} finished</span><span>${st.pct}% read</span></div></div>`;
  if (nx){
    const started = last && last.id === nx.id;
    h += `<button class="cont" data-go="${nx.id}"><div class="ct">
      <div class="ck">${started ? 'Continue reading' : (st.fin ? 'Up next' : 'Start reading')}</div>
      <div class="cn">${nx.b.n} &middot; ${esc(nx.t)}</div></div>${CHEV}</button>`;
  }
  const sv = LS.get('lom_pos', null);
  if (sv && BYID[sv.id]){
    const ls = BYID[sv.id], el = secElapsed(ls, [sv.a, sv.t]);
    h += `<button class="listen" data-go="${ls.id}"><div class="pi"><svg viewBox="0 0 24 24">${PLAY}</svg></div><div class="ct">
      <div class="ck">Continue listening${el != null ? ' &middot; ' + fmt(el) + ' in' : ''}</div><div class="cn">${ls.b.n} &middot; ${esc(ls.t)}</div></div>${CHEV}</button>`;
  }
  h += '<div class="sect">Books</div>';
  BOOKS.forEach(b => {
    const s = stats(b.s);
    h += `<button class="bk" data-b="${b.id}"><div class="bn">${b.n}</div><div class="bs">${esc(b.sub)}</div>
      <div class="bt"><div class="bf" style="width:${s.pct}%"></div></div>
      <div class="bp"><span>${s.fin} of ${s.tot} finished</span><span>${s.left ? hm(s.minLeft) + ' left' : 'Done'}</span></div></button>`;
  });
  h += `<div class="sect">Talks</div>
    <a class="nextc" style="margin-top:0" href="#talk"><div class="ct"><div class="cn">Divine Patterns in The Life of Moses</div>
    <div class="ck" style="text-transform:none;letter-spacing:0;font-weight:500;font-size:15px;margin-top:3px">Video &middot; 43 min &middot; linked to the passages it quotes</div></div>${CHEV}</a>`;
  const fc = favs.length;
  h += `<div class="sect">Favorites</div>
    <button class="nextc" style="margin-top:0" data-favs="1"><div class="ct"><div class="cn">${fc ? fc + ' saved passage' + (fc === 1 ? '' : 's') : 'No favorites yet'}</div>
    <div class="ck" style="text-transform:none;letter-spacing:0;font-weight:500;font-size:15px;margin-top:3px">Tap the heart beside any paragraph to save it</div></div>${CHEV}</button>`;
  h += `<div class="foot"><button id="reset">Reset reading progress</button></div>`;
  app.innerHTML = h;
  app.querySelectorAll('[data-go]').forEach(el => el.onclick = () => location.hash = '#s/' + el.dataset.go);
  app.querySelectorAll('[data-b]').forEach(el => el.onclick = () => location.hash = '#b/' + el.dataset.b);
  app.querySelector('[data-favs]').onclick = () => location.hash = '#favs';
  $('#hs').onclick = () => location.hash = '#search';
  $('#reset').onclick = () => {
    if (!confirm('Clear all finished marks? Favorites are kept.')) return;
    done = {}; LS.set('lom_done', done); last = null; LS.set('lom_last', null); home();
  };
}

/* ---------- book ---------- */
function rowHTML(s, cur){
  const fc = favCount(s.id);
  const meta = [range(s), mins(s.w) + ' min read', Math.round(s.dur / 60) + ' min audio'];
  return `<div class="row${isDone(s.id) ? ' done' : ''}" data-row="${s.id}">
    <button class="chk" data-chk="${s.id}" aria-label="${isDone(s.id) ? 'Mark unread' : 'Mark finished'}: ${esc(s.t)}"><i>${CHECK}</i></button>
    <button class="open" data-go="${s.id}"><div class="ot"><div class="on">${esc(s.t)}</div>
      <div class="om"><span>${meta.join(' &middot; ')}</span>${fc ? `<span class="h"><svg viewBox="0 0 24 24"><path d="${HEART}"/></svg>${fc}</span>` : ''}${cur ? '<span class="now">Reading</span>' : ''}</div></div>${CHEV}</button></div>`;
}
function book(id, flash){
  const b = BOOKBY[id]; if (!b) return home();
  setNav('#', 'Home', b.n);
  const st = stats(b.s);
  const todo = b.s.filter(s => !isDone(s.id));
  const fin = b.s.filter(s => isDone(s.id)).sort((a, c) => a.i - c.i);
  let h = `<div class="bhead"><div class="eyebrow">${b.n}</div><h1>${esc(b.sub)}</h1></div>
    <div class="prog" style="margin-top:16px">
      <div class="big">${st.left ? st.left + ' left' : 'All finished'}<small>${st.left ? 'About ' + hm(st.minLeft) + ' of reading to go' : 'Every section in this book is read'}</small></div>
      <div class="track"><div class="fill" style="width:${st.pct}%"></div></div>
      <div class="plab"><span>${st.fin} of ${st.tot} finished</span><span>${st.pct}%</span></div></div>`;
  h += `<div class="sect">To read (${todo.length})</div><div class="list">` +
       (todo.length ? todo.map(s => rowHTML(s, last && last.id === s.id)).join('') : '<div class="empty">Nothing left in this book.</div>') + '</div>';
  if (fin.length) h += `<div class="sect">Finished (${fin.length})</div><div class="list">` + fin.map(s => rowHTML(s, false)).join('') + '</div>';
  app.innerHTML = h;
  app.querySelectorAll('[data-go]').forEach(el => el.onclick = () => location.hash = '#s/' + el.dataset.go);
  app.querySelectorAll('[data-chk]').forEach(el => el.onclick = () => {
    const sid = el.dataset.chk, on = !isDone(sid);
    setDone(sid, on);
    const y = scrollY; book(id, sid); scrollTo(0, y);
    toast(on ? 'Marked finished' : 'Moved back to To read');
  });
  if (flash){ const r = app.querySelector(`[data-row="${flash}"]`); if (r) r.classList.add('flash'); }
}

/* ---------- audio ---------- */
const DKEY = "AIzaSyDAcn7073_w7l1O1j84wq5JJTb7XUIcxQo";
const PARTS = [["1ECbNMbawmMChO62sQlNLYZxfrquakPZ6", 2616.42], ["1H-1MW2Z35T51rHQGL3f84b15_iNfpj2j", 2914.12], ["12gZyT-CpzugglUG-PGf5WXzK-flHpfKd", 2361.31], ["1s1b89ncJZSAJdrxJ4kUN7Qv_cGgf0ZuJ", 2372.47], ["1guvSIr2-CrobIS4uq4B3wPzKoxzYYbfn", 2802.21], ["1HmiS4e4-oajIqEKBGo_JuxIDy4ymgl45", 3094.23], ["1v6nq29fy3Un_4FqCqgSKyXkpVt-VCUWi", 2588.16], ["1CttpiAWWKg5CwMSGt1X5wyoZXDIVqrmO", 3032.61], ["1CQnl1sQBdw_LgE16jVjAadFfeqDvs_wl", 3050.16], ["1M0HHzrY62YAa9ecPyc21DlAjDb-RYZPX", 2876.16], ["1Nakry-aPLDBAJ8gxUtdBq6EmLEtxIVTR", 2878.17], ["1fOhRGE9SSCN7_SZlhPiNnMYT6H9k8AJs", 2822.19], ["1jtL39Zav5i5vdpACkNf7gR1K7Ekn7LW4", 2366.12]];   // [driveId, durationSeconds]
const ROWS = [];           // every sentence and commentary block, in listening order
ALL.forEach(s => { s.x.forEach(r => { r.gi = ROWS.length; r.s = s; ROWS.push(r); }); });
const fmt = x => { x = Math.max(0, Math.round(x)); const h = Math.floor(x / 3600), m = Math.floor(x % 3600 / 60), s = x % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(s).padStart(2, '0'); };
const cmpPos = (a1, t1, a2, t2) => a1 !== a2 ? a1 - a2 : t1 - t2;
// audio stretches belonging to each section: [[part, from, to], ...]
ALL.forEach((s, i) => {
  const st = s.x[0], nx = ALL[i + 1] && ALL[i + 1].x[0];
  const end = nx ? [nx.a, nx.t] : [PARTS.length, PARTS[PARTS.length - 1][1]];
  const segs = [];
  for (let a = st.a; a <= end[0]; a++){
    const from = a === st.a ? st.t : 0, to = a === end[0] ? end[1] : PARTS[a - 1][1];
    if (to > from) segs.push([a, from, to]);
  }
  s.segs = segs; s.dur = segs.reduce((x, g) => x + g[2] - g[1], 0);
});
function rowAt(a, t){   // last row starting at or before (a, t)
  let lo = 0, hi = ROWS.length - 1, ans = 0;
  while (lo <= hi){ const m = (lo + hi) >> 1;
    if (cmpPos(ROWS[m].a, ROWS[m].t, a, t) <= 0){ ans = m; lo = m + 1; } else hi = m - 1; }
  return ROWS[ans];
}
const audio = new Audio(); audio.preload = 'none';
let curPart = null, pendingSeek = null, wantPlay = false, rate = LS.get('lom_rate', 1);
let follow = LS.get('lom_follow', true), activeGi = -1, userAt = 0, lastSave = 0;
const srcFor = a => 'https://www.googleapis.com/drive/v3/files/' + PARTS[a - 1][0] + '?alt=media&key=' + DKEY;
function loadAt(a, t, play){
  wantPlay = play;
  if (curPart !== a){
    curPart = a; pendingSeek = t;
    audio.src = srcFor(a); audio.load();
  } else {
    try { audio.currentTime = t; } catch(e){ pendingSeek = t; }
  }
  if (play) audio.play().catch(() => {});
  paintPlayer();
}
audio.addEventListener('loadedmetadata', () => {
  if (pendingSeek != null){ try { audio.currentTime = pendingSeek; } catch(e){} pendingSeek = null; }
  audio.playbackRate = rate;
  if (wantPlay) audio.play().catch(() => {});
});
audio.addEventListener('ended', () => { if (curPart < PARTS.length) loadAt(curPart + 1, 0, true); });
audio.addEventListener('play', () => { audio.playbackRate = rate; paintPlayer(); });
audio.addEventListener('pause', paintPlayer);
audio.addEventListener('waiting', paintPlayer);
audio.addEventListener('playing', paintPlayer);
audio.addEventListener('timeupdate', tick);
function curPos(){ return curPart ? [curPart, audio.currentTime || pendingSeek || 0] : null; }
function tick(){
  const p = curPos(); if (!p || audio.seeking || pendingSeek != null) return;
  const r = rowAt(p[0], p[1]);
  // skip mode: jump over commentary to the next line of the book
  if (cmode === 'skip' && r.k === 'c' && !audio.paused){
    let j = r.gi + 1; while (j < ROWS.length && ROWS[j].k === 'c') j++;
    if (j < ROWS.length){ loadAt(ROWS[j].a, ROWS[j].t, true); return; }
  }
  if (Date.now() - lastSave > 2500){ lastSave = Date.now(); LS.set('lom_pos', {a: p[0], t: Math.round(p[1]), id: r.s.id}); }
  // keep the page with the audio when it runs into the next section
  if (pageSec && r.s !== pageSec && r.s.g === pageSec.g + 1 && !audio.paused && !audio.seeking && follow && pageSec.x.some(x => x.gi === activeGi)){

const SICON = '<svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20 20"/></svg>';
const XICON = '<svg viewBox="0 0 24 24" style="stroke:var(--dim2);fill:none;stroke-width:2.4;stroke-linecap:round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
// same-length normalisation so match offsets line up with the original text
const norm = s => s.toLowerCase().replace(/[‘’ʼ]/g, "'").replace(/[“”]/g, '"').replace(/[‐-―]/g, '-');
function parseQ(q){

  r.sort((a, b) => a[0] - b[0]);

  r.forEach(x => { if (m.length && x[0] <= m[m.length - 1][1]) m[m.length - 1][1] = Math.max(m[m.length - 1][1], x[1]); else m.push(x.slice()); });

    a = Math.max(a, from); b = Math.min(b, to);

  });

}
function snippet(text, terms){

  let b = Math.min(text.length, a + W);
  if (b < text.length){ const sp = text.lastIndexOf(' ', b); if (sp > r[0][1]) b = sp; }

  hits.slice(0, shown).forEach(([s, pi]) => {
    const key = s.b.id;
    if (key !== grp){ grp = key; h += `<div class="rg">${s.b.n}</div>`; }
    const p = s.p[pi];
    h += `<button class="ri" data-hit="${s.id}|${pi}"><div class="rt">${esc(s.t)}${p[0] ? ' &middot; §' + p[0] : ''}</div>
      <div class="rs">${snippet(p[1], terms)}</div></button>`;
  });
  if (hits.length > shown) h += `<button class="more" id="more">Show more (${hits.length - shown} left)</button>`;
  if (ch.length){
    h += `<div class="rg">In the commentary (${ch.length})</div>` + ch.slice(0, 40).map(([r]) => {
      const txt = r.l.map(l => l[1]).join(' ');
      return `<button class="ri" data-cmt="${r.s.id}|${r.gi}"><div class="rt">${r.s.b.n} &middot; ${esc(r.s.t)}</div><div class="rs">${snippet(txt, terms)}</div></button>`; }).join('');
  }
  box.innerHTML = h;
  box.querySelectorAll('[data-hit]').forEach(el => el.onclick = () => {
    const [id, pi] = el.dataset.hit.split('|');
    location.hash = '#s/' + id + '/' + pi + '/q/' + encodeURIComponent(query.trim());
  });
  box.querySelectorAll('[data-sec]').forEach(el => el.onclick = () => location.hash = '#s/' + el.dataset.sec);
  box.querySelectorAll('[data-cmt]').forEach(el => el.onclick = () => { const [id, gi] = el.dataset.cmt.split('|');
    location.hash = '#s/' + id + '/r' + gi + '/q/' + encodeURIComponent(query.trim()); });
  const m = $('#more'); if (m) m.onclick = () => { const y = scrollY; shown += 100; drawResults(); scrollTo(0, y); };
}

/* ---------- talk (video) ---------- */
const TALK = JSON.parse(document.getElementById('talk').textContent);
const VIDEO = 'epMcQE9TaPQ';
let yt = null, ytReady = false, ytPending = null, ytApi = false, ktab = LS.get('dp_tab', 'outline');
let kSec = -1, kPara = -1, kTimer = null, kUser = 0, kLastSave = 0, returnTo = null;
const kfmt = x => { x = Math.max(0, Math.floor(x)); return Math.floor(x / 60) + ':' + String(x % 60).padStart(2, '0'); };
addEventListener('touchmove', () => kUser = Date.now(), {passive: true});
function ytLoad(){
  if (ytApi) return; ytApi = true;
  const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
}
window.onYouTubeIframeAPIReady = () => { if (document.getElementById('yt')) makeYT(); };
function makeYT(){
  ytReady = false;
  const vars = {playsinline: 1, rel: 0, modestbranding: 1};
  if (/^https?:/.test(location.protocol)) vars.origin = location.origin;
  yt = new YT.Player('yt', {videoId: VIDEO, playerVars: vars, events: {
    onReady: () => { ytReady = true;
      if (ytPending != null){ yt.seekTo(ytPending, true); yt.playVideo(); ytPending = null; }
      else { const t0 = LS.get('dp_t', 0); if (t0 > 5) yt.cueVideoById(VIDEO, t0); } },
    onStateChange: e => { if (e.data === 1 && !audio.paused){ wantPlay = false; audio.pause(); } }
  }});
}
const kNowT = () => (ytReady && yt && yt.getCurrentTime) ? (yt.getCurrentTime() || 0) : LS.get('dp_t', 0);
function kSeek(t){
  if (!audio.paused){ wantPlay = false; audio.pause(); }
  const v = $('#kvid'); if (v && v.classList.contains('k-small')) kHide(false);
  if (ytReady){ yt.seekTo(t, true); yt.playVideo(); } else ytPending = t;
  kPaint(t);
}
function kHide(h){ const v = $('#kvid'); if (!v) return; v.classList.toggle('k-small', h); $('#kmin').textContent = h ? 'Show video' : 'Hide video'; }
const kSecAt = t => { let k = 0; TALK.outline.forEach((o, i) => { if (t >= o.t) k = i; }); return k; };
const kParaAt = t => { let k = 0; TALK.paras.forEach((p, i) => { if (t >= p.t) k = i; }); return k; };
function kPaint(t){
  if (!$('#ktm')) return;
  $('#ktm').textContent = kfmt(t);
  const si = kSecAt(t); $('#ksec').textContent = TALK.outline[si].h;
  if (si !== kSec){ kSec = si; document.querySelectorAll('.k-oi').forEach(el => el.classList.toggle('on', +el.dataset.i === si)); }
  const pi = kParaAt(t);
  if (pi !== kPara){ kPara = pi;
    document.querySelectorAll('.k-tp').forEach(el => el.classList.toggle('on', +el.dataset.i === pi));
    const el = document.querySelector('.k-tp.on');
    const playing = ytReady && yt.getPlayerState && yt.getPlayerState() === 1;
    if (el && playing && ktab === 'transcript' && Date.now() - kUser > 5000){
      const top = $('#top').offsetHeight + $('#kvid').offsetHeight + 8;
      scrollTo({top: Math.max(0, scrollY + el.getBoundingClientRect().top - top - 8), behavior: 'smooth'}); }
  }
}
function kCard(r, i, showWhen){
  return `<div class="k-ref"><div class="k-rs">${r.k === 'q' ? 'He quotes' : 'He draws on'} &middot; <b>${r.book} §${r.n}</b> &middot; ${esc(r.sec)}</div>
    ${r.note ? `<div class="k-rn">${esc(r.note)}</div>` : ''}
    <div class="k-rq" data-kq="${i}">${esc(r.xs.join(' '))}</div>
    ${r.skip ? '<div class="k-rw">This paragraph is skipped in the recording, so Listen starts at §175, which carries the same thought.</div>' : ''}
    ${showWhen ? `<div class="k-rw">In the talk at ${kfmt(r.v)}</div>` : ''}
    <div class="k-rb"><button class="k-lis" data-kl="${i}"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>Listen in book</button>
      ${showWhen ? `<button class="k-wat" data-kg="${r.v}">Watch at ${kfmt(r.v)}</button>` : ''}
      <button class="k-full" data-kf="${i}">Full paragraph</button></div></div>`;
}
function kBody(){
  document.querySelectorAll('.k-tabs button').forEach(b => b.classList.toggle('on', b.dataset.kt === ktab));
  let h = '';
  if (ktab === 'outline'){
    h = TALK.outline.map((o, i) => {
      const end = TALK.outline[i + 1] ? TALK.outline[i + 1].t : 1e9;
      const n = TALK.refs.filter(r => r.v >= o.t && r.v < end).length;
      return `<button class="k-oi${/^Sponsor/.test(o.h) ? ' k-ad' : ''}" data-i="${i}" data-kg="${o.t}"><span class="k-ts">${kfmt(o.t)}</span><div>
        <div class="k-oh">${esc(o.h)}</div><div class="k-os">${esc(o.s)}</div>${n ? `<div class="k-oc">${n} book passage${n === 1 ? '' : 's'}</div>` : ''}</div></button>`;
    }).join('');
  } else if (ktab === 'transcript'){
    let si = -1;
    TALK.paras.forEach((p, i) => {
      const s = kSecAt(p.t);
      if (s !== si){ si = s; h += `<div class="k-sech">${esc(TALK.outline[s].h)}</div>`; }
      h += `<div class="k-tp${p.ad ? ' k-ad' : ''}" data-i="${i}"><button class="k-ts" data-kg="${p.t}">${kfmt(p.t)}</button>${p.ad ? '<span class="k-adl">Sponsor message</span>' : ''}
        <div class="k-tx">${esc(p.x)}</div></div>` + TALK.refs.map((r, j) => r.tp === i ? kCard(r, j, false) : '').join('');
    });
  } else {
    h = '<div class="k-note">Every passage from St. Gregory that he quotes or draws on, in the order he brings them up.</div><div class="k-list">' +
      TALK.refs.map((r, i) => kCard(r, i, true)).join('') + '</div>';
  }
  const pane = $('#kpane'); pane.innerHTML = h;
  kSec = -1; kPara = -1; kPaint(kNowT());
  pane.querySelectorAll('[data-kg]').forEach(el => el.onclick = () => kSeek(+el.dataset.kg));
  pane.querySelectorAll('[data-kl]').forEach(el => el.onclick = () => {
    const r = TALK.refs[+el.dataset.kl];
    if (ytReady && yt.pauseVideo) yt.pauseVideo();
    LS.set('dp_t', Math.floor(kNowT()));
    loadAt(r.a, r.at, true);          // start the reading right here, inside the tap
    returnTo = r.v;
    location.hash = '#s/' + r.id + '/' + r.p;
  });
  pane.querySelectorAll('[data-kf]').forEach(el => el.onclick = () => {
    const r = TALK.refs[+el.dataset.kf], q = pane.querySelector('[data-kq="' + el.dataset.kf + '"]');
    if (el.textContent !== 'Less'){ let x = esc(r.para); r.xs.forEach(s => { x = x.replace(esc(s), '<mark>' + esc(s) + '</mark>'); }); q.innerHTML = x; el.textContent = 'Less'; }
    else { q.innerHTML = esc(r.xs.join(' ')); el.textContent = 'Full paragraph'; }
  });
}
function talkView(at){
  setNav('#', 'Home', 'Talk');
  app.innerHTML = `<div class="k-hero"><div class="eyebrow">Talk &middot; 43 min</div>
      <h1>Divine Patterns in The Life of Moses</h1>
      <p>${TALK.refs.length} passages from St. Gregory, each linked to its place in the book and the reading.</p></div>
    <div class="k-vid" id="kvid"><div class="k-vbox"><div id="yt"></div></div>
      <div class="k-now"><span class="k-tm" id="ktm">0:00</span><b id="ksec"></b><button class="k-min" id="kmin">Hide video</button></div></div>
    <div class="k-tabs"><button data-kt="outline">Outline</button><button data-kt="transcript">Transcript</button><button data-kt="passages">Passages</button></div>
    <div id="kpane"></div>`;
  $('#kmin').onclick = () => kHide(!$('#kvid').classList.contains('k-small'));
  app.querySelectorAll('[data-kt]').forEach(b => b.onclick = () => { ktab = b.dataset.kt; LS.set('dp_tab', ktab); kBody(); });
  if (at != null) ytPending = at;
  if (window.YT && YT.Player) makeYT(); else ytLoad();
  kBody();
  clearInterval(kTimer);
  kTimer = setInterval(() => {
    if (!$('#ktm')){ clearInterval(kTimer); return; }
    if (!ytReady || !yt.getCurrentTime) return;
    const t = yt.getCurrentTime() || 0; kPaint(t);
    if (Date.now() - kLastSave > 3000 && t > 0){ kLastSave = Date.now(); LS.set('dp_t', Math.floor(t)); }
  }, 500);
}

/* ---------- routing ---------- */
function route(){
  const h = location.hash || '';
  onRead = null; sheetOpen(false); pageSec = null; $('#jumpb').hidden = true;
  window.scrollTo(0, 0);
  if (h.startsWith('#favs')){ favsView(); readBar(); return; }
  if (!h.startsWith('#talk')){ ytReady = false; yt = null; }
  if (h.startsWith('#search')){ returnTo = null; searchView(); readBar(); return; }
  const tk = h.match(/^#talk(?:\/(\d+))?/);
  if (tk){ returnTo = null; talkView(tk[1] != null ? +tk[1] : null); readBar(); return; }
  if (!h.startsWith('#s/')) returnTo = null;
  const s = h.match(/^#s\/([^/]+)(?:\/(r?\d+))?(?:\/q\/(.*))?/);
  if (s) return section(s[1], s[2] != null ? (s[2][0] === 'r' ? s[2] : +s[2]) : null, s[3] != null ? decodeURIComponent(s[3]) : null);
  const b = h.match(/^#b\/(.+)/);
  if (b){ book(b[1]); readBar(); return; }
  home(); readBar();
}
addEventListener('hashchange', route);
route();
</script></body></html>
