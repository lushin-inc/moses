<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1e1e1e" id="tcolor">
<title>The Life of Moses</title>
<style>
:root{
 --bg:#f3f3f3; --card:#e7e7e7; --card2:#d8d8d8;
 --fg:#1d1d1d; --dim:#5c5c5c; --dim2:#828282;
 --acb:#2f5ea8; --ac:#2a58a0; --acq:rgba(47,94,168,.11); --mk:rgba(47,94,168,.22);
 --ok:#2f5ea8; --okq:rgba(47,94,168,.11);
 --heart:#d6455a;
 --line:#d6d6d6; --sh:rgba(0,0,0,.1);
 --tile:#e7e7e7; --tileb:#d3d3d3; --gold:#2f5ea8; --tilefg:#1d1d1d; --tiledim:#5c5c5c; --tilet:#d3d3d3;
 --fs:21px; --rf:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",system-ui,sans-serif;
}
:root[data-theme="dark"]{
 --bg:#1e1e1e; --card:#272727; --card2:#323232;
 --fg:#ececec; --dim:#a6a6a6; --dim2:#7c7c7c;
 --acb:#3d69bb; --ac:#7da2e6; --acq:rgba(77,123,210,.17); --mk:rgba(92,138,222,.36);
 --ok:#3d69bb; --okq:rgba(77,123,210,.17);
 --heart:#ef6b7d;
 --line:#2f2f2f; --sh:rgba(0,0,0,.55);
 --tile:#272727; --tileb:#353535; --gold:#5f8ad8; --tilefg:#ececec; --tiledim:#a6a6a6; --tilet:#383838;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",system-ui,sans-serif;
 font-size:18px;line-height:1.5;overflow-x:clip;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:left}
a{color:inherit;text-decoration:none}
.wrap{max-width:720px;margin:0 auto;padding:0 18px calc(40px + env(safe-area-inset-bottom,0px))}

/* top bar */
.top{position:sticky;top:0;z-index:40;background:var(--bg);
 backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
 border-bottom:.5px solid var(--line);
 padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
.topin{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:6px;min-height:44px}
.back{display:flex;align-items:center;gap:2px;font-size:18px;color:var(--ac);min-height:44px;
 padding-right:6px;margin-left:-6px;flex:0 1 auto;min-width:0}
.back[hidden]{display:none}
.back span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.back svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.brand{font-size:17px;font-weight:600;letter-spacing:-.2px;color:var(--dim);flex:1;min-width:0;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.tt{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
.tt svg{width:22px;height:22px;stroke:var(--dim);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tt.aa{font-size:18px;font-weight:600;color:var(--dim);letter-spacing:-.5px}
.rbar{position:absolute;left:0;bottom:-1px;height:3px;background:var(--acb);width:0;transition:width .1s linear}

/* text settings sheet */
.sheet{position:fixed;left:0;right:0;z-index:60;top:calc(61px + env(safe-area-inset-top,0px));
 padding:0 14px;display:none}
.sheet.open{display:block}
.sheetin{max-width:420px;margin:0 0 0 auto;background:var(--card);border-radius:18px;padding:16px;
 box-shadow:0 14px 40px var(--sh),0 0 0 .5px var(--line)}
.srow{display:flex;align-items:center;gap:10px}
.srow + .srow{margin-top:12px}
.slab{font-size:15px;color:var(--dim);flex:1}
.step{width:52px;height:46px;border-radius:12px;background:var(--bg);font-size:22px;font-weight:600;
 display:grid;place-items:center;color:var(--fg)}
:root[data-theme="dark"] .step{background:var(--card2)}
.sval{min-width:44px;text-align:center;font-variant-numeric:tabular-nums;font-size:16px;font-weight:600}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px}
:root[data-theme="dark"] .seg{background:var(--card2)}
.seg button{padding:10px 16px;border-radius:9px;font-size:16px;color:var(--dim)}
.seg button.on{background:var(--card);color:var(--fg);font-weight:600;box-shadow:0 1px 3px var(--sh)}
:root[data-theme="dark"] .seg button.on{background:var(--bg)}
.scrim{position:fixed;inset:0;z-index:55;display:none}
.scrim.open{display:block}

/* home */
.hero{padding:28px 0 6px}
.eyebrow{font-size:14px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--dim2)}
.hero h1{margin:6px 0 4px;font-size:38px;line-height:1.1;font-weight:700;letter-spacing:-1px}
.hero p{margin:0;font-size:18px;color:var(--dim)}
.prog{background:var(--card);border-radius:18px;padding:18px 18px 16px;margin:22px 0 14px}
.big{font-size:30px;font-weight:700;letter-spacing:-.6px;line-height:1.15}
.big small{display:block;font-size:17px;font-weight:500;color:var(--dim);letter-spacing:0;margin-top:4px}
.track{height:10px;border-radius:6px;background:var(--card2);overflow:hidden;margin-top:14px}
.fill{height:100%;background:var(--acb);border-radius:6px;width:0;transition:width .3s ease}
.plab{display:flex;justify-content:space-between;font-size:15px;color:var(--dim);margin-top:8px;font-variant-numeric:tabular-nums}
.cont{display:flex;align-items:center;gap:14px;width:100%;background:var(--acb);color:#fff;
 border-radius:16px;padding:16px 18px;margin:0 0 26px;min-height:64px}
.cont .ct{flex:1;min-width:0}
.cont .ck{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.cont .cn{font-size:19px;font-weight:600;line-height:1.3;margin-top:2px}
.cont svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.sect{font-size:14px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--dim2);margin:26px 0 12px}
.bk{position:relative;display:block;width:100%;background:var(--tile);border:1px solid var(--tileb);
 border-radius:14px;padding:26px 20px 18px;margin-bottom:12px;color:var(--tilefg);
 box-shadow:0 2px 6px var(--sh);transition:transform .12s ease}
.bk:active{transform:scale(.985)}
.bk::after{content:'';position:absolute;top:13px;left:calc(50% - 16px);width:32px;height:1px;background:var(--gold)}
.bk .bn{font-size:26px;font-weight:600;letter-spacing:-.4px;text-align:center}
.bk .bs{font-size:15px;color:var(--tiledim);text-align:center;margin-top:2px}
.bk .bt{height:7px;border-radius:5px;background:var(--tilet);overflow:hidden;margin-top:16px}
.bk .bf{height:100%;background:var(--acb);border-radius:5px}
.bk .bp{display:flex;justify-content:space-between;font-size:14px;color:var(--tiledim);margin-top:8px;font-variant-numeric:tabular-nums}
.foot{margin-top:34px;text-align:center}
.foot button{font-size:15px;color:var(--dim2);padding:12px 16px}

/* book */
.bhead{padding:24px 0 4px}
.bhead h1{margin:4px 0 2px;font-size:34px;font-weight:700;letter-spacing:-.9px;line-height:1.15}
.bhead p{margin:0;font-size:18px;color:var(--dim)}
.list{margin:0}
.row{display:flex;align-items:center;gap:4px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.chk{flex:0 0 52px;height:64px;display:grid;place-items:center;margin-left:-8px}
.chk i{width:30px;height:30px;border-radius:50%;border:2px solid var(--dim2);display:grid;place-items:center;transition:all .15s ease}
.chk svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.row.done .chk i{background:var(--ok);border-color:var(--ok)}
.row.done .chk svg{opacity:1}
.open{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:14px 0;min-height:64px}
.open .ot{flex:1;min-width:0}
.open .on{font-size:20px;line-height:1.3;font-weight:500;letter-spacing:-.2px}
.open .om{font-size:15px;color:var(--dim2);margin-top:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.open .om .h{color:var(--heart);display:inline-flex;align-items:center;gap:3px}
.open .om .h svg{width:14px;height:14px;fill:currentColor}
.open .om .now{color:var(--ac);font-weight:600}
.open > svg{width:20px;height:20px;stroke:var(--dim2);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.row.done .on{color:var(--dim)}
.row.flash{animation:fl .7s ease}
@keyframes fl{from{background:var(--okq)}to{background:transparent}}
.empty{color:var(--dim);font-size:17px;padding:14px 0}

/* reading */
.rhead{padding:24px 0 6px}
.rhead h1{margin:6px 0 6px;font-size:32px;font-weight:700;letter-spacing:-.8px;line-height:1.15}
.rmeta{font-size:16px;color:var(--dim2);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:600;color:var(--ok);
 background:var(--okq);padding:4px 10px;border-radius:999px}
.pill svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.text{padding:14px 0 10px;overflow-wrap:anywhere}
.para{position:relative;font-family:var(--rf);font-size:var(--fs);line-height:1.62;letter-spacing:-.1px;
 margin:0 -10px 6px;padding:8px 10px;border-radius:12px;transition:background .3s ease}
.para .n{font-size:.62em;font-weight:700;color:var(--dim2);margin-right:7px;vertical-align:.15em;
 font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.para .fv{float:right;width:44px;height:44px;margin:-6px -8px 0 6px;display:grid;place-items:center;border-radius:50%;opacity:.35}
.para .fv svg{width:20px;height:20px;fill:none;stroke:var(--dim);stroke-width:2;stroke-linejoin:round}
.para.faved{background:color-mix(in srgb,var(--heart) 9%,transparent)}
.para.faved .fv{opacity:1}
.para.faved .fv svg{fill:var(--heart);stroke:var(--heart)}
.para.hl,.cm.hl{background:var(--acq)}
.done-box{margin:22px 0 10px}
.mark{width:100%;min-height:62px;border-radius:16px;background:var(--ok);color:#fff;font-size:20px;font-weight:600;
 display:flex;align-items:center;justify-content:center;gap:10px}
.mark svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.isdone{display:flex;align-items:center;justify-content:center;gap:10px;font-size:19px;font-weight:600;color:var(--ok);
 background:var(--okq);border-radius:16px;min-height:62px}
.isdone svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.undo{display:block;margin:6px auto 0;font-size:16px;color:var(--dim2);padding:12px 16px;text-align:center}
.nextc{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border-radius:16px;padding:16px 18px;margin-top:12px;min-height:64px}
.nextc .ct{flex:1;min-width:0}
.nextc .ck{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim2)}
.nextc .cn{font-size:19px;font-weight:600;line-height:1.3;margin-top:2px}
.nextc svg{width:22px;height:22px;stroke:var(--ac);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.pn{display:flex;flex-direction:column;gap:2px;margin-top:18px;border-top:1px solid var(--line);padding-top:8px}
.pn button{font-size:17px;color:var(--ac);padding:12px 0;min-height:44px}
.pn button span{color:var(--dim2);font-size:14px;display:block}

/* favorites */
.feed{padding:4px 0 30px}
.fcard{border-top:1px solid var(--line);padding:18px 0}
.fcard:first-child{border-top:0}
.fsrc{font-size:15px;color:var(--dim2);margin-bottom:8px;font-weight:500}
.ftx{font-family:var(--rf);font-size:calc(var(--fs) - 1px);line-height:1.6}
.frow{display:flex;align-items:center;gap:10px;margin-top:12px}
.fgo{font-size:16px;font-weight:600;color:var(--ac);background:var(--acq);padding:10px 16px;border-radius:10px;min-height:44px}
.fdel{font-size:16px;color:var(--dim2);padding:10px 14px;border-radius:10px;min-height:44px}

/* search */
.sfield{display:flex;align-items:center;gap:10px;width:100%;background:var(--card);border-radius:14px;
 padding:0 8px 0 14px;min-height:54px;margin:18px 0 0;border:1px solid transparent}
.sfield:focus-within{border-color:var(--acb)}
.sfield svg{width:21px;height:21px;stroke:var(--dim2);fill:none;stroke-width:2.2;stroke-linecap:round;flex:0 0 auto}
.sfield input{flex:1;min-width:0;font:inherit;font-size:19px;border:0;background:transparent;color:var(--fg);
 outline:none;padding:14px 0;-webkit-appearance:none;appearance:none}
.sfield input::placeholder{color:var(--dim2)}
.sfield input::-webkit-search-cancel-button,.sfield input::-webkit-search-decoration{-webkit-appearance:none;appearance:none;display:none}
.sfield .ph{flex:1;font-size:19px;color:var(--dim2);padding:14px 0}
.sclr{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
.sclr[hidden]{display:none}
.sclr svg{width:18px;height:18px}
.shead{padding:20px 0 0}
.shead h1{margin:0;font-size:32px;font-weight:700;letter-spacing:-.8px}
.scount{font-size:16px;color:var(--dim);padding:14px 0 4px}
.stips{font-size:16px;color:var(--dim2);line-height:1.6;padding:16px 0}
.stips b{color:var(--dim);font-weight:600}
.rg{font-size:14px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim2);margin:22px 0 4px}
.ri{display:block;width:100%;border-top:1px solid var(--line);padding:14px 0 15px}
.rg + .ri{border-top:0}
.ri .rt{font-size:15px;font-weight:600;color:var(--ac);margin-bottom:5px}
.ri .rs{font-family:var(--rf);font-size:calc(var(--fs) - 2px);line-height:1.55;color:var(--fg)}
.ri:active{background:var(--acq)}
mark{background:var(--mk);color:inherit;border-radius:4px;padding:0 2px;margin:0 -1px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.more{display:block;width:100%;text-align:center;font-size:17px;font-weight:600;color:var(--ac);background:var(--card);
 border-radius:14px;min-height:54px;margin-top:14px}
.qchip{display:flex;align-items:center;gap:10px;background:var(--acq);border-radius:12px;padding:6px 6px 6px 14px;margin-top:12px}
.qchip .qt{flex:1;min-width:0;font-size:16px;color:var(--fg)}
.qchip .qt b{font-weight:600}
.qchip button{font-size:15px;font-weight:600;color:var(--ac);padding:8px 12px;min-height:40px;border-radius:9px}

/* audio */
.player{position:sticky;top:calc(61px + env(safe-area-inset-top,0px));z-index:30;background:var(--card);
 border-radius:18px;padding:12px 14px 10px;margin:14px 0 6px;box-shadow:0 6px 18px var(--sh)}
.player::before{content:'';position:absolute;left:-16px;right:-16px;top:-16px;height:17px;background:var(--bg)}
.prow{display:flex;align-items:center;gap:12px}
.play{width:54px;height:54px;flex:0 0 54px;border-radius:50%;background:var(--acb);display:grid;place-items:center}
.play svg{width:22px;height:22px;fill:#fff}
.play.wait svg{opacity:.5}
.pmid{flex:1;min-width:0}
.ptime{display:flex;justify-content:space-between;font-size:14px;color:var(--dim);font-variant-numeric:tabular-nums;margin-top:2px}
.bar{height:30px;display:flex;align-items:center;cursor:pointer;touch-action:none}
.bartrack{width:100%;height:6px;border-radius:3px;background:var(--card2);position:relative}
.barfill{position:absolute;inset:0 auto 0 0;background:var(--acb);border-radius:3px;width:0}
.barknob{position:absolute;top:50%;width:16px;height:16px;border-radius:50%;background:#fff;
 transform:translate(-50%,-50%);left:0;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.ctrls{display:flex;gap:8px;margin-top:8px;justify-content:space-between}
.ctrls button{flex:1;font-size:15px;font-weight:600;color:var(--ac);padding:9px 4px;border-radius:10px;background:var(--bg);text-align:center;min-height:40px;white-space:nowrap}
:root[data-theme="dark"] .ctrls button{background:var(--card2)}
.ctrls button.off{color:var(--dim2);font-weight:500}
.elsewhere{font-size:14px;color:var(--dim);margin-top:8px;display:flex;gap:8px;align-items:center}
.elsewhere[hidden]{display:none}
.elsewhere button{color:var(--ac);font-weight:600;font-size:14px;padding:4px 0}
.sn{cursor:pointer;border-radius:5px;transition:background .2s ease;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.sn.on{background:var(--mk);color:var(--fg)}
.para.pcont{padding-top:2px}
.cm{margin:4px 0 14px;border-left:3px solid var(--line);padding:2px 0 2px 14px}
.cm.on{border-left-color:var(--acb)}
.cmh{display:flex;align-items:center;gap:8px;width:100%;font-size:14px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--dim2);padding:8px 0;min-height:40px}
.cmh svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s ease}
.cm.exp .cmh svg{transform:rotate(90deg)}
.cm.on .cmh{color:var(--ac)}
.cml{font-size:calc(var(--fs) - 3px);line-height:1.6;color:var(--dim);
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cm.exp .cml{display:block;-webkit-line-clamp:unset;overflow:visible}
.cl{cursor:pointer;border-radius:5px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.cl.on{background:var(--acq);color:var(--fg)}
.skipc .cm{display:none}
.jumpb{position:fixed;left:50%;transform:translateX(-50%);z-index:50;bottom:calc(20px + env(safe-area-inset-bottom,0px));
 background:var(--acb);color:#fff;font-size:16px;font-weight:600;padding:13px 20px;border-radius:999px;
 box-shadow:0 8px 24px rgba(0,0,0,.35)}
.jumpb[hidden]{display:none}
.listen{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border-radius:16px;padding:14px 16px;margin:-12px 0 26px;min-height:64px}
.listen .pi{width:42px;height:42px;border-radius:50%;background:var(--acb);display:grid;place-items:center;flex:0 0 auto}
.listen .pi svg{width:17px;height:17px;fill:#fff;margin-left:2px}
.listen .ct{flex:1;min-width:0}
.listen .ck{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim2)}
.listen > svg{width:22px;height:22px;stroke:var(--ac);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.listen .cn{font-size:18px;font-weight:600;line-height:1.3;margin-top:2px}

/* talk */
.k-hero{padding:22px 0 4px}
.k-hero h1{margin:6px 0 6px;font-size:32px;line-height:1.12;font-weight:700;letter-spacing:-.8px}
.k-hero p{margin:0;font-size:17px;color:var(--dim)}
.k-vid{position:sticky;top:calc(61px + env(safe-area-inset-top,0px));z-index:30;background:var(--bg);margin:16px -18px 0;padding:0 0 10px}
.k-vbox{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
@media(min-width:620px){.k-vid{margin:16px 0 0}.k-vbox{border-radius:14px}}
.k-vbox iframe,.k-vbox #yt{position:absolute;inset:0;width:100%;height:100%;border:0}
.k-now{display:flex;align-items:center;gap:10px;padding:10px 18px 0;font-size:15px;color:var(--dim);min-height:34px}
@media(min-width:620px){.k-now{padding:10px 0 0}}
.k-now b{color:var(--fg);font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-now .k-tm{font-variant-numeric:tabular-nums}
.k-min{font-size:14px;font-weight:600;color:var(--ac);padding:6px 0;white-space:nowrap}
.k-vid.k-small .k-vbox{display:none}
.k-tabs{display:flex;background:var(--card);border-radius:12px;padding:3px;margin:12px 0 6px}

<script type="application/json" id="data">[{"id":"b1","n":"Book I","sub":"The History","s":[{"t":"Prologue","p":[[1,"At horse races the spectators intent on victory shout to their favorites in the contest, even though the horses are eager to run. From the stands they participate in the race with their eyes, thinking to incite the charioteer to keener effort, at the same time urging the horses on while leaning forward and flailing the air with their outstretched hands instead of with a whip. They do this not because their actions themselves contribute anything to the victory; but in this way, by their good will, they eagerly show in voice and deed their concern for the contestants. I seem to be doing the same thing myself, most valued friend and brother. While you are competing admirably in the divine race along the course of virtue, lightfootedly leaping and straining constantly for the prize of the heavenly calling, I exhort, urge and encourage you vigorously to increase your speed. I do this, not moved to it by some unconsidered impulse, but to humor the delights of a beloved child."],[2,"Since the letter which you recently sent requested us to furnish you with some counsel concerning the perfect life, I thought it only proper to answer your request. Although there may be nothing useful for you in my words, perhaps this example of ready obedience will not be wholly unprofitable to you. For if we who have been appointed to the position of fathers over so many souls consider it proper here in our old age to accept a commission from youth, how much more suitable is it, inasmuch as we have taught you, a young man, to obey voluntarily, that the right action of ready obedience be confirmed in you."],[3,"So much for that. We must take up the task that lies before us, taking God as our guide in our treatise. You requested, dear friend, that we trace in outline for you what the perfect life is. Your intention clearly was to translate the grace disclosed by my word into your own life, if you should find in my treatise what you were seeking. I am at an equal loss about both things: It is beyond my power to encompass perfection in my treatise or to show in my life the insights of the treatise. And perhaps I am not alone in this. Many great men, even those who excel in virtue, will admit that for them such an accomplishment as this is unattainable."],[4,"As I would not seem, in the words of the Psalmist, there to tremble for fear, where no fear was, I shall set forth for you more clearly what I think."],[5,"The perfection of everything which can be measured by the senses is marked off by certain definite boundaries. Quantity, for example, admits of both continuity and limitation, for every quantitative measure is circumscribed by certain limits proper to itself. The person who looks at a cubit or at the number ten knows that its perfection consists in the fact that it has both a beginning and an end. But in the case of virtue we have learned from the Apostle that its one limit of perfection is the fact that it has no limit. For that divine Apostle, great and lofty in understanding, ever running the course of virtue, never ceased straining toward those things that are still to come. Coming to a stop in the race was not safe for him. Why? Because no Good has a limit in its own nature but is limited by the presence of its opposite, as life is limited by death and light by darkness. And every good thing generally ends with all those things which are perceived to be contrary to the good."],[6,"Just as the end of life is the beginning of death, so also stopping in the race of virtue marks the beginning of the race of evil. Thus our statement that grasping perfection with reference to virtue is impossible was not false, for it has been pointed out that what is marked off by boundaries is not virtue."],[0,"I said that it is also impossible for those who pursue the life of virtue to attain perfection. The meaning of this statement will be explained."],[7,"The Divine One is himself the Good (in the primary and proper sense of the word), whose very nature is goodness. This he is and he is so named, and is known by this nature. Since, then, it has not been demonstrated that there is any limit to virtue except evil, and since the Divine does not admit of an opposite, we hold the divine nature to be unlimited and infinite. Certainly whoever pursues true virtue participates in nothing other than God, because he is himself absolute virtue. Since, then, those who know what is good by nature desire participation in it, and since this good has no limit, the participant's desire itself necessarily has no stopping place but stretches out with the limitless."],[8,"It is therefore undoubtedly impossible to attain perfection, since, as I have said, perfection is not marked off by limits: The one limit of virtue is the absence of a limit. How then would one arrive at the sought-for boundary when he can find no boundary?"],[9,"Although on the whole my argument has shown that what is sought for is unattainable, one should not disregard the commandment of the Lord which says, Therefore be perfect, just as your heavenly father is perfect. For in the case of those things which are good by nature, even if men of understanding were not able to attain to everything, by attaining even a part they could yet gain a great deal."],[10,"We should show great diligence not to fall away from the perfection which is attainable but to acquire as much as is possible: To that extent let us make progress within the realm of what we seek. For the perfection of human nature consists perhaps in its very growth in goodness."],[11,"It seems good to me to make use of Scripture as a counselor in this matter. For the divine voice says somewhere in the prophecy of Isaiah, Consider Abraham your father, and Sarah who gave you birth. Scripture gives this admonition to those who wander outside virtue. Just as at sea those who are carried away from the direction of the harbor bring themselves back on course by a clear sign, upon seeing either a beacon light raised up high or some mountain peak coming into view, in the same way Scripture by the example of Abraham and Sarah may guide again to the harbor of the divine will those adrift on the sea of life with a pilotless mind."],[12,"Human nature is divided into male and female, and the free choice of virtue or of evil is set before both equally. For this reason the corresponding example of virtue for each sex has been exemplified by the divine voice, so that each, by observing the one to which he is akin (the men to Abraham and the women to Sarah), may be directed in the life of virtue by the appropriate examples."],[13,"Perhaps, then, the memory of anyone distinguished in life would be enough to fill our need for a beacon light and to show us how we can bring our soul to the sheltered harbor of virtue where it no longer has to pass the winter amid the storms of life or be shipwrecked in the deep water of evil by the successive billows of passion. It may be for this very reason that the daily life of those sublime individuals is recorded in detail, that by imitating those earlier examples of right action those who follow them may conduct their lives to the good."],[14,"What then? Some one will say, \"How shall I imitate them, since I am not a Chaldaean as I remember Abraham was, nor was I nourished by the daughter of the Egyptian as Scripture teaches about Moses, and in general I do not have in these matters anything in my life corresponding to anyone of the ancients? How shall I place myself in the same rank with one of them, when I do not know how to imitate anyone so far removed from me by the circumstances of his life?\" To him we reply that we do not consider being a Chaldaean a virtue or a vice, nor is anyone exiled from the life of virtue by living in Egypt or spending his life in Babylon, nor again has God been known to the esteemed individuals in Judaea only, nor is Zion, as people commonly think, the divine habitation. We need some subtlety of understanding and keenness of vision to discern from the history how, by removing ourselves from such Chaldaeans and Egyptians and by escaping from such a Babylonian captivity, we shall embark on the blessed life."],[15,"Let us put forth Moses as our example for life in our treatise. First we shall go through in outline his life as we have learned it from the divine Scriptures. Then we shall seek out the spiritual understanding which corresponds to the history in order to obtain suggestions of virtue. Through such understanding we may come to know the perfect life for men."]],"id":"b1-1","r":[1,15],"w":1544,"x":[{"k":"c","a":1,"t":1.0,"e":92.7,"l":[[1.0,"In the name of the Father and of the Son and of the Holy Spirit."],[3.0,"Amen."],[4.0,"Dear friends, welcome back to our weekly readings of the works of the Holy Fathers."],[10.0,"Today we will be beginning a new book."],[13.0,"We will be reading the Life of the Holy prophet Moses by St. Gregory of Nyssa."],[18.0,"Let us pray and we will begin."],[24.0,"O Heavenly King, comfort the Spirit of truth who art everywhere present and fillest all treasury of good things and giver of life, come and dwell in us, and cleanse us of all impurity and save our souls, O good one."],[49.0,"So some time ago I asked the viewers on the channel what book they would like to see us read next, and there was a request for The Life of St. Moses by St. Gregory of Nyssa."],[73.0,"So, Book 1, Prologue the Life of Moses or Concerning Perfection in Virtue Chapter one."]]},{"k":"s","p":0,"i":0,"a":1,"t":92.0,"x":"At horse races the spectators intent on victory shout to their favorites in the contest, even though the horses are eager to run."},{"k":"s","p":0,"i":1,"a":1,"t":101.0,"x":"From the stands they participate in the race with their eyes, thinking to incite the charioteer to keener effort, at the same time urging the horses on while leaning forward and flai of its opposite, as life is limited by death and light by darkness."},{"k":"s","p":4,"i":7,"a":1,"t":298.7,"x":"And every good thing generally ends with all those things which are perceived to be contrary to the good."},{"k":"s","p":5,"i":0,"a":1,"t":306.3,"x":"Just as the end of life is the beginning of death, so also stopping in the race of virtue marks the beginning of the race of evil."},{"k":"s","p":5,"i":1,"a":1,"t":315.0,"x":"Thus our statement that grasping perfection with reference to virtue is impossible was not false, for it has been pointed out that what is marked off by boundaries is not virtue."},{"k":"s","p":6,"i":0,"a":1,"t":327.0,"x":"I said that it is also impossible for those who pursue the life of virtue to attain perfection."},{"k":"s","p":6,"i":1,"a":1,"t":333.0,"x":"The meaning of this statement will be explained."},{"k":"c","a":1,"t":334.8,"e":508.6,"l":[[334.8,"examined."],[335.0,"Now, if we were to pause here for a moment."],[338.0,"Here for a moment."],[344.0,"However, he does say something that's very important, and that is he says that."],[353.0,"He says that stopping the life of virtue marks the end of its perfection, which basically means once you stop the life of virtue, you begin the life of sin."],[368.0,"And I think that very clearly reminds us of an."],[373.0,"Yes, I think we're much better now."],[376.0,"I do apologize for the technical hiccup."],[382.0,"Thus, what I think St. Gregory here is saying in a very interesting way is that the moment we stop striving for virtue, we start sort of falling into sin."],[397.0,"Now, if I were asked to give an example from Life, perhaps."],[402.0,"I would say, imagine something that's either floating on the water or better yet, a plane that flies but cannot glide through the air on its own, which is not a glider."],[422.0,"Such a plane has to be propelled at all times."],[425.0,"Basically, its engine has to be working on a regular basis, because the moment it stops working, it will start losing altitude."],[434.0,"Best case scenarios A lot of planes, of course, are built in such a way that they can at least glide part of the way."],[441.0,"But some flying machines, I guess, are built in such a way that if their engines stop, they just tumble to the ground."],[450.0,"And I think that in some way, perhaps depending on the state of our souls and sort of the place in our progression on the path of life, of virtue, if we stop exercising in virtue, well, maybe we glide a little bit, but then we definitely must pick up."],[473.0,"So in some cases a spiritual life is not a direct line from earth to heaven, but it might be a bit of a zigzag."],[482.0,"And in some cases, of course, when we stumble and we fall, we falter, so to speak, then we have to get up and pick up our pace."],[492.0,"But in this case, I think it's quite interesting that very early on, St. Gregory, speaking of the life of virtue, basically says that the moment you stop striving for virtue, the opposite begins."]]},{"k":"s","p":7,"i":0,"a":1,"t":507.4,"x":"The Divine One is himself the Good (in the primary and proper sense of the word), whose very nature is goodness."},{"k":"c","a":1,"t":510.0,"e":515.5,"l":[[510.0,"So in this particular case it's all capitalized, the Divine One and"]]},{"k":"s","p":7,"i":1,"a":1,"t":519.0,"x":"This he is and he is so named, and is known by this nature."},{"k":"s","p":7,"i":2,"a":1,"t":524.0,"x":"Since, then, it has not been demonstrated that there is any limit to virtue except evil, and since the Divine does not admit of an opposite, we hold the divine nature to be unlimited and infinite."},{"k":"s","p":7,"i":3,"a":1,"t":536.0,"x":"Certainly whoever pursues true virtue participates in nothing other than God, because he is himself absolute virtue."},{"k":"s","p":7,"i":4,"a":1,"t":544.0,"x":"Since, then, those who know what is good by nature desire participation in it, and since this good has no limit, the participant's desire itself necessarily has no stopping place but stretches out with the limitless."},{"k":"s","p":8,"i":0,"a":1,"t":559.4,"x":"It is therefore undoubtedly impossible to attain perfection, since, as I have said, perfection is not marked off by limits:"},{"k":"s","p":8,"i":1,"a":1,"t":568.0,"x":"The one limit of virtue is the absence of a limit."},{"k":"s","p":8,"i":2,"a":1,"t":571.0,"x":"How then would one arrive at the sought-for boundary when he can find no boundary?"},{"k":"s","p":9,"i":0,"a":1,"t":576.4,"x":"Although on the whole my argument has shown that what is sought for is unattainable, one should not disregard the commandment of the Lord which says, Therefore be perfect, just as your heavenly father is perfect."},{"k":"s","p":9,"i":1,"a":1,"t":590.0,"x":"For in the case of those things which are good by nature, even if men of understanding were not able to attain to everything, by attaining even a part they could yet gain a great deal."},{"k":"s","p":10,"i":0,"a":1,"t":603.3,"x":"We should show great diligence not to fall away from the perfection which is attainable but to acquire as much as is possible:"},{"k":"s","p":10,"i":1,"a":1,"t":608.5,"x":"To that extent let us make progress within the realm of what we seek."},{"k":"s","p":10,"i":2,"a":1,"t":609.1,"x":"For the perfection of human nature consists perhaps in its very growth in goodness."},{"k":"s","p":11,"i":0,"a":1,"t":609.1,"x":"It seems good to me to make use of Scripture as a counselor in this matter."},{"k":"s","p":11,"i":1,"a":1,"t":614.0,"x":"For the divine voice says somewhere in the prophecy of Isaiah, Consider Abraham your father, and Sarah who gave you birth."},{"k":"s","p":11,"i":2,"a":1,"t":621.0,"x":"Scripture gives this admonition to those who wander outside virtue."},{"k":"s","p":11,"i":3,"a":1,"t":624.3,"x":"Just as at sea those who are carried away from the direction of the harbor bring themselves back on course by a clear sign, upon seeing either a beacon light raised up high or some mountain peak coming into view, in the same way Scripture by the example of Abraham and Sarah may guide again to the harbor of the divine will those adrift on the sea of life with a pilotless mind."},{"k":"s","p":12,"i":0,"a":1,"t":649.3,"x":"Human nature is divided into male and female, and the free choice of virtue or of evil is set before both equally."},{"k":"s","p":12,"i":1,"a":1,"t":657.0,"x":"For this reason the corresponding example of virtue for each sex has been exemplified by the divine voice, so that each, by observing the one to which he is akin (the men to Abraham and the women to Sarah), may be directed in the life of virtue by the appropriate examples."},{"k":"s","p":13,"i":0,"a":1,"t":674.3,"x":"Perhaps, then, the memory of anyone distinguished in life would be enough to fill our need for a beacon light and to show us how we can bring our soul to the sheltered harbor of virtue where it no longer has to pass the winter amid the storms of life or be shipwrecked in the deep water of evil by the successive billows of passion."},{"k":"s","p":13,"i":1,"a":1,"t":697.0,"x":"It may be for this very reason that the daily life of those sublime individuals is recorded in detail, that by imitating those earlier examples of right action those who follow them may conduct their lives to the good."},{"k":"c","a":1,"t":714.0,"e":806.5,"l":[[714.0,"So now he's talking about Abraham and Sarah, and I imagine he will then proceed to Moses quite quickly, soon, soon after."],[726.0,"Speaking though of the limitless perfection, if I may, I would like to give you an example, one that I like very much, of two elders."],[736.0,"And I think it's Abba Joseph and Abba Lot."],[738.0,"And I can't remember which one came to which."],[740.0,"Abba Lot to Abba Joseph or Abba Joseph to Abba Lot."],[744.0,"But one of them comes to the other and says, father, you know I pray a little."],[749.0,"And most likely he was praying all the time."],[754.0,"I fast a little, which means, you know, he was eating very little."],[759.0,"You know I give alms, I do, you know, I do some songs."],[764.0,"What else can I do?"],[766.0,"And the other father looks at him and he says, if you wish, you can become all fire."],[771.0,"And he raises his hands up in the air and lights come out of his fingers and stretch all the way up toward heaven, lights like the light of Mount Tabor."],[783.0,"So we see that the desert fathers also realize that there is no end to perfection."],[790.0,"And even though they were not sort of as classically educated and theologically astute as St. Gregory of Nyssa, they still had the same spirit and of course, the same virtue."]]},{"k":"s","p":14,"i":0,"a":1,"t":805.0,"x":"What then? Some one will say, \"How shall I imitate them, since I am not a Chaldaean as I remember Abraham was, nor was I nourished by the daughter of the Egyptian as Scripture teaches about Moses, and in general I do not have in these matters anything in my life corresponding to anyone of the ancients?"},{"k":"s","p":14,"i":1,"a":1,"t":823.0,"x":"How shall I place myself in the same rank with one of them, when I do not know how to imitate anyone so far removed from me by the circumstances of his life?\" To him we reply that we do not consider being a Chaldaean a virtue or a vice, nor is anyone exiled from the life of virtue by living in Egypt or spending his life in Babylon, nor again has God been known to the esteemed individuals in Judaea only, nor is Zion, as people commonly think, the divine habitation."},{"k":"s","p":14,"i":2,"a":1,"t":852.0,"x":"We need some subtlety of understanding and keenness of vision to discern from the history how, by removing ourselves from such Chaldaeans and Egyptians and by escaping from such a Babylonian captivity, we shall embark on the blessed life."},{"k":"s","p":15,"i":0,"a":1,"t":867.4,"x":"Let us put forth Moses as our example for life in our treatise."},{"k":"s","p":15,"i":1,"a":1,"t":872.0,"x":"First we shall go through in outline his life as we have learned it from the divine Scriptures."},{"k":"s","p":15,"i":2,"a":1,"t":877.0,"x":"Then we shall seek out the spiritual understanding which corresponds to the history in order to obtain suggestions of virtue."},{"k":"s","p":15,"i":3,"a":1,"t":884.0,"x":"Through such understanding we may come to know the perfect life for men."},{"k":"c","a":1,"t":887.4,"e":959.3,"l":[[887.4,"of men."],[888.0,"Now I think I am quite grateful to the individual who requested that we read this book already for One reason, that St. Gregory should say, well, how shall I imitate the saints?"],[904.0,"Because I'm not a Chaldean, you know, I didn't grow up in Pharaoh's palace in, in Egypt or, you know, and so on."],[914.0,"This seems like a perfect parallel for those among us who today say, well, why should I bother reading the lives of the ancient saints from the times of persecutions or from, you know, the times of the peace in the church or ecumenical councils, or later times, even as, you know, maybe 100, 200 years ago."],[938.0,"How does that relate to me?"],[940.0,"It's quite easy to hear someone say that, and hopefully St. Gregory will give us a beautiful idea of how we should not strive to imitate the saints in the literal sense, but we should definitely imitate their virtues."],[957.0,"History of"]]}]},{"t":"Birth, Childhood, and the Burning Bush","p":[[16,"Moses is said to have been born when the tyrant's law sought to prevent the birth of male offspring. Yet in his outward grace he anticipated the whole contribution which he would make in time. Already appearing beautiful in swaddling clothes, he caused his parents to draw back from having such a child destroyed by death."],[17,"Thus, when the threat of the tyrant prevailed, he was not simply thrown into the Nile but was placed in a basket daubed along its joints with slime and pitch, and so was given to the current. (This was recounted by those who carefully gave a narrative concerning him.) Guided by some divine power, the basket moved to a certain place along the sloping bank where it was washed up naturally by the lapping of the waves. As the king's daughter happened to come to that grassy bank where the basket washed up, she discovered him when he gave a childlike cry in the ark. When she saw the outward grace evident in him, the princess out of her good will immediately adopted him and took him as her son. But when he instinctively refused a stranger's nourishment, he was nursed at his mother's breast through the contrivance of his close relatives."],[18,"After he had left childhood, and had been educated in pagan learning during his royal upbringing, he did not choose the things considered glorious by the pagans nor did he any longer recognize as his mother that wise woman by whom he had been adopted, but he returned to his natural mother and attached himself to his own kinsmen. During a fight between a Hebrew and an Egyptian he sided with his countryman and killed the foreigner. Then when two Hebrews fought with each other, he tried to restrain them, counseling them that because they were brothers they should make nature and not passion the arbiter of their disputes."],[19,"Having been rebuffed by the one in the wrong, he made this rejection the occasion for a greater philosophy. Separating himself from association with the people, he thereafter lived alone. He became the son-in-law of one of the foreigners, a man with insight into what is noble, and perceptive in judging the habits and lives of men. This man saw in one act—the attack on the shepherds —the virtue of the young man, how he fought on behalf of the right without looking for personal gain. Considering the right valuable in itself, Moses punished the wrong done by the shepherds, although they had done nothing against him. Honoring the young man Moses for these acts and judging his virtue in his manifest poverty more valuable than great riches, the man gave him his daughter in marriage and, in keeping with his authority, he permitted Moses to live as he wished. Moses lived alone in the mountains away from all the turmoil of the marketplace; there in the wilderness he cared for his sheep."],[20,"After he had passed some time in this kind of life, the history says an awe-inspiring theophany occurred. At high noon a light brighter than the sunlight dazzled his eyes. Astonished at the strange sight, he looked up at the mountain and saw a bush from which this light was flaming up like a fire. When he saw the branches of the bush sprouting up in flame as if they were in pure water, he said to himself, \"I will go and see this great sight.\" As soon as he said this, he no longer received the marvel of the light with his sight alone, but (which is most astounding of all) his hearing too was illuminated by the rays of light. The light's grace was distributed to both senses, illuminating the sight with flashing rays and lighting the way for the hearing with undefiled teachings. The voice from the light forbade Moses to approach the mountain burdened with lifeless sandals. He removed the sandals from his feet, and so stood on that ground on which the divine light was shining."],[21,"I think that the discussion should not dwell extensively on the bare history of the man. We should give attention to the matters we have proposed. After he was empowered by the theophany which he had seen, he was commanded to release his countrymen from Egyptian bondage. In order that he might learn more fully the strength implanted in him by God he tested the divine command by the things in his hands."],[0,"This was the test. When the rod fell from his hand, it became alive, a living creature (in fact it was a serpent); when he took it up again in his hand, it became what it had been before becoming an animal. When he withdrew his hand from his bosom, it looked as white as snow, but when he put it back in his bosom, it returned to its natural color."]],"id":"b1-2","r":[16,21],"w":815,"x":[{"k":"s","p":0,"i":0,"a":1,"t":958.4,"x":"Moses is said to have been born when the tyrant's law sought to prevent the birth of male offspring."},{"k":"s","p":0,"i":1,"a":1,"t":965.0,"x":"Yet in his outward grace he anticipated the whole contribution which he would make in time."},{"k":"s","p":0,"i":2,"a":1,"t":970.0,"x":"Already appearing beautiful in swaddling clothes, he caused his parents to draw back from having such a child destroyed by death."},{"k":"c","a":1,"t":977.0,"e":1021.0,"l":[[977.0,"Now, in this particular case, St. Gregory is referring to the fact that Pharaoh, who's afraid that the Israelites would outnumber the Egyptians and would take over their country, issued a decree that all the male children would be put to death upon birth."],[994.0,"And Moses, when he was born as an infant, was so beautiful that his parents felt something special."],[1002.0,"Now, okay, any parent sees his child, I would say perhaps, maybe 99% of the parents see their child regardless, saw that he was beautiful, perhaps, maybe in some way."],[1019.0,"17"]]},{"k":"s","p":1,"i":0,"a":1,"t":1019.3,"x":"Thus, when the threat of the tyrant prevailed, he was not simply thrown into the Nile but was placed in a basket daubed along its joints with slime and pitch, and so was given to the current."},{"k":"s","p":1,"i":1,"a":1,"t":1032.0,"x":"(This was recounted by those who carefully gave a narrative concerning him.) Guided by some divine power, the basket moved to a certain place along the sloping bank where it was washed up naturally by the lapping of the waves."},{"k":"c","a":1,"t":1036.0,"e":1047.7,"l":[[1036.0,"So basically it says that he wasn't just drowned in the river, but he was put in the basket, which was sealed from water leaking into it so that he would not drown."]]},{"k":"s","p":1,"i":2,"a":1,"t":1054.0,"x":"As the king's daughter happened to come to that grassy bank where the basket washed up, she discovered him when he gave a childlike cry in the ark."},{"k":"s","p":1,"i":3,"a":1,"t":1063.0,"x":"When she saw the outward grace evident in him, the princess out of her good will immediately adopted him and took him as her son."},{"k":"s","p":1,"i":4,"a":1,"t":1070.0,"x":"But when he instinctively refused a stranger's nourishment, he was nursed at his mother's breast through the contrivance of his close relatives."},{"k":"c","a":1,"t":1079.0,"e":1109.5,"l":[[1079.0,"We know from the book of Genesis, unless this is already in Exodus, do forgive me."],[1088.0,"But basically we know from the Holy Scriptures that, let's see, the sister of Moses went along the shore, and she essentially said to the Pharaoh's daughter, if you'd like, I can find you a nurse for this child."]]},{"k":"s","p":2,"i":0,"a":1,"t":1108.0,"x":"After he had left childhood, and had been educated in pagan learning during his royal upbringing, he did not choose the things considered glorious by the pagans nor did he any longer recognize as his mother that wise woman by whom he had been adopted, but he returned to his natural mother and attached himself to his own kinsmen."},{"k":"s","p":2,"i":1,"a":1,"t":1121.8,"x":"During a fight between a Hebrew and an Egyptian he sided with his countryman and killed the foreigner."},{"k":"s","p":2,"i":2,"a":1,"t":1123.0,"x":"Then when two Hebrews fought with each other, he tried to restrain them, counseling them that because they were brothers they should make nature and not passion the arbiter of their disputes."},{"k":"s","p":3,"i":0,"a":1,"t":1137.0,"x":"Having been rebuffed by the one in the wrong, he made this rejection the occasion for a greater philosophy."},{"k":"s","p":3,"i":1,"a":1,"t":1145.0,"x":"Separating himself from association with the people, he thereafter lived alone."},{"k":"s","p":3,"i":2,"a":1,"t":1150.6,"x":"He became the son-in-law of one of the foreigners, a man with insight into what is noble, and perceptive in judging the habits and lives of men."},{"k":"s","p":3,"i":3,"a":1,"t":1159.0,"x":"This man saw in one act—the attack on the shepherds —the virtue of the young man, how he fought on behalf of the right without looking for personal gain."},{"k":"s","p":3,"i":4,"a":1,"t":1169.0,"x":"Considering the right valuable in itself, Moses punished the wrong done by the shepherds, although they had done nothing against him."},{"k":"s","p":3,"i":5,"a":1,"t":1176.0,"x":"Honoring the young man Moses for these acts and judging his virtue in his manifest poverty more valuable than great riches, the man gave him his daughter in marriage and, in keeping with his authority, he permitted Moses to live as he wished."},{"k":"s","p":3,"i":6,"a":1,"t":1190.0,"x":"Moses lived alone in the mountains away from all the turmoil of the marketplace; there in the wilderness he cared for his sheep."},{"k":"c","a":1,"t":1198.0,"e":1316.0,"l":[[1198.0,"Now, here, St. Gregory refers to the event that happened."],[1204.0,"Well, prior to that."],[1206.0,"I suppose I should say St. Gregory describes in as much detail as does the Holy Scripture, that when Moses defended a Hebrew against an Egyptian, he killed the Egyptian when he tried to intervene because he considered that maybe he could help his people."],[1225.0,"Being the adopted king of the Pharaoh, I mean the adopted son of the Pharaoh's daughter, he thought that he could help his people."],[1233.0,"However, his people rejected him."],[1235.0,"Now, personally, recently reading the Old Testament, I was wondering about the fact that there's a parallel."],[1243.0,"The Lord came to save his people from their sins, and a large portion of those people rejected him."],[1252.0,"And a significant portion, the portion that actually managed to have him crucified."],[1257.0,"Now, Moses was not killed the way the Lord was."],[1261.0,"However, Moses was rejected by his people."],[1264.0,"One of them said, are you going to kill me just like you killed the Egyptian?"],[1267.0,"And when Moses realized that this murder was now common knowledge, he fled."],[1274.0,"He fled to Madium, sort of a nearby place in the desert."],[1280.0,"And there he defended Jethro's daughters who were mistreated by the shepherds who came to the well where Jethro's daughters, his father, future father in law's daughters, were also sort of watering, you know, getting water for their animals."],[1297.0,"And that is why St. Gregory says Jethro, the father of these young women, realized that Moses stood, stood up for what was right."],[1304.0,"Because the shepherds offended the young women."],[1308.0,"He defended them."],[1309.0,"And Jethro gave him his daughter as his wife."],[1314.0,"20"]]},{"k":"s","p":4,"i":0,"a":1,"t":1314.3,"x":"After he had passed some time in this kind of life, the history says an awe-inspiring theophany occurred."},{"k":"s","p":4,"i":1,"a":1,"t":1320.1,"x":"At high noon a light brighter than the sunlight dazzled his eyes."},{"k":"s","p":4,"i":2,"a":1,"t":1324.0,"x":"Astonished at the strange sight, he looked up at the mountain and saw a bush from which this light was flaming up like a fire."},{"k":"c","a":1,"t":1332.0,"e":1354.2,"l":[[1332.0,"Now we should do St. Moses justice and say that he lived in Egypt for 40 years."],[1341.0,"Then he fled from Madium, and he lived there for 40 years."],[1347.0,"And at the age of 80 he had this theophany, or right about 80,"]]},{"k":"s","p":4,"i":3,"a":1,"t":1352.6,"x":"When he saw the branches of the bush sprouting up in flame as if they were in pure water, he said to himself, \"I will go and see this great sight.\" As soon as he said this, he no longer received the marvel of the light with his sight alone, but (which is most astounding of all) his hearing too was illuminated by the rays of light."},{"k":"s","p":4,"i":4,"a":1,"t":1376.0,"x":"The light's grace was distributed to both senses, illuminating the sight with flashing rays and lighting the way for the hearing with undefiled teachings."},{"k":"s","p":4,"i":5,"a":1,"t":1386.0,"x":"The voice from the light forbade Moses to approach the mountain burdened with lifeless sandals."},{"k":"s","p":4,"i":6,"a":1,"t":1392.0,"x":"He removed the sandals from his feet, and so stood on that ground on which the divine light was shining."},{"k":"c","a":1,"t":1398.0,"e":1409.0,"l":[[1398.0,"God spoke to Moses from the bush and told him to remove his sandals because the ground upon which he was standing was holy."],[1407.0,"21"]]},{"k":"s","p":5,"i":0,"a":1,"t":1407.4,"x":"I think that the discussion should not dwell extensively on the bare history of the man."},{"k":"s","p":5,"i":1,"a":1,"t":1413.0,"x":"We should give attention to the matters we have proposed."},{"k":"s","p":5,"i":2,"a":1,"t":1415.9,"x":"After he was empowered by the theophany which he had seen, he was commanded to release his countrymen from Egyptian bondage."},{"k":"c","a":1,"t":1419.0,"e":1431.0,"l":[[1419.0,"Now the Greek word theophany means the manifestation of God."],[1425.0,"We should give attention to the matters we have proposed."],[1428.0,"After he was okay,"]]},{"k":"s","p":5,"i":3,"a":1,"t":1432.8,"x":"In order that he might learn more fully the strength implanted in him by God he tested the divine command by the things in his hands."},{"k":"s","p":6,"i":0,"a":1,"t":1441.0,"x":"This was the test. When the rod fell from his hand, it became alive, a living creature (in fact it was a serpent); when he took it up again in his hand, it became what it had been before becoming an animal."},{"k":"c","a":1,"t":1454.0,"e":1469.5,"l":[[1454.0,"So basically, God told him to throw his rod on the ground."],[1458.0,"It turned into a serpent."],[1459.0,"And when he picked the serpent up by the tail, it once again it became his rod."]]},{"k":"s","p":6,"i":1,"a":1,"t":1468.0,"x":"When he withdrew his hand from his bosom, it looked as white as snow, but when he put it back in his bosom, it returned to its natural color."},{"k":"c","a":1,"t":1479.5,"e":1506.0,"l":[[1479.5,"there."],[1480.0,"So if I can do this with my cassock, imagine Moses putting his hand in his garments, drawing it out, and it was covered with leprosy."],[1488.0,"It was completely white with leprosy."],[1490.0,"Then he put it back and it was perfectly normal again."],[1495.0,"So those were the two signs which God gave him in order to show to the Israelite people in Egypt."],[1504.0,"22"]]}]},{"t":"Aaron, Pharaoh, and the Plagues","p":[[22,"Moses went down to Egypt and he took with him his foreign wife and the children she had borne him. Scripture says that an angel encountered him and threatened death. His wife appeased the angel by the blood of the child's circumcision. Then he met Aaron, who had himself been brought by God to this meeting."],[23,"Later, the people in Egypt were gathered by Moses and Aaron into a general assembly and their release from bondage was announced all around to those who were already distressed by the hardships of their labors. Report of this came to the tyrant himself. When he heard it his anger at both the overseers of the work and the Israelites themselves was greater than ever. The levy of bricks to be made was increased and a harsher command was sent down, not only to those slaving with the clay but also to those laboriously gathering chaff and straw."],[24,"Pharaoh (for this was the Egyptian tyrant's name) attempted to counter the divine signs performed by Moses and Aaron with magical tricks performed by his sorcerers. When Moses again turned his own rod into an animal before the eyes of the Egyptians, they thought that the sorcery of the magicians could equally work miracles with their rods. This deceit was exposed when the serpent produced from the staff of Moses ate the sticks of sorcery—the snakes no less! The rods of the sorcerers had no means of defense nor any power of life, only the appearance which cleverly devised sorcery showed to the eyes of those easily deceived."],[25,"When Moses saw that all the subjects agreed with their leader in his evil, he laid a blow upon the whole Egyptian nation, sparing no one from the calamities. Like an army under orders, the very elements of the universe—earth, water, air, and fire which are seen to be in everything—cooperated with him in this attack on the Egyptians, and changed their natural operations to serve human purposes. For by the same power and at the same time and place the disorderly were punished and those free of wrong did not suffer."],[26,"At the command of Moses all the water in Egypt turned into blood. The fish were destroyed because the water thickened, but to the Hebrews alone the blood was water when they drew it. Found among the Hebrews this water provided an occasion for the magicians to use their art in making the water appear bloody."],[27,"Similarly frogs covered Egypt in large numbers. Their breeding in these numbers was not natural, but Moses' command changed the normal density of frogs. All the land was in a sorry state, for the Egyptians' houses were being overrun with these creatures, while the Hebrews were free of this hateful plague."],[28,"Likewise, there was no distinction between night and day to the Egyptians, who lived in unchanging gloom. To the Hebrews, however, nothing was out of the ordinary. It was the same with all the other things—the hail, the fire, the boils, the gadflies, the flies, the cloud of locusts: Each had its natural effect on the Egyptians. The Hebrews learned of the misfortune of their neighbors by report, since they experienced no similar attack themselves."],[0,"Then the death of the firstborn made the distinction between Egyptians and Hebrews still sharper. The Egyptians were dismayed, lamenting the loss of their dearest children, while the Hebrews continued to live in total serenity and safety. Salvation was assured to them by the shedding of the blood. At every entrance both the doorposts and the lintel joining them were marked with blood."]],"id":"b1-3","r":[22,28],"w":599,"x":[{"k":"s","p":0,"i":0,"a":1,"t":1504.3,"x":"Moses went down to Egypt and he took with him his foreign wife and the children she had borne him."},{"k":"s","p":0,"i":1,"a":1,"t":1511.0,"x":"Scripture says that an angel encountered him and threatened death."},{"k":"s","p":0,"i":2,"a":1,"t":1514.0,"x":"His wife appeased the angel by the blood of the child's circumcision."},{"k":"s","p":0,"i":3,"a":1,"t":1519.0,"x":"Then he met Aaron, who had himself been brought by God to this meeting."},{"k":"c","a":1,"t":1526.0,"e":1657.0,"l":[[1526.0,"because God told Moses that Aaron would be his spokesperson."],[1531.0,"Because Moses basically said, well, and this is something that's, I think already we should consider and draw something of an example from Moses in that Moses was exceedingly humble despite the fact that he was raised in Pharaoh's temple."],[1549.0,"Now imagine the magnitude of the knowledge of the ancient Egyptian civilization."],[1556.0,"On the one hand, because of the prejudice of the evolutionary thinking affecting modern day society, we tend to think that ancient people were sort of very simple."],[1570.0,"They worshiped the sun because they were silly."],[1571.0,"You know, they didn't know, they didn't understand."],[1574.0,"However, we know from scientists for example that they managed to build a temple in the side of the mountain where one time, one time in the entire year, I don't remember if it was the rising or the setting sun, basically penetrated all the way into the the building in the temple and illuminated sort of the far wall which was otherwise for 365 remaining days of the year, which was always in the shadow."],[1608.0,"So Moses, surely if he did not possess all that knowledge, he was certainly very well acquainted with it."],[1617.0,"Because I can't fathom that he would be raised as an adopted son to the Pharaoh's family and be left ignorant."],[1625.0,"Surely he knew quite a good bit."],[1629.0,"And one can imagine that he would have probably said, oh perfect, of course, God, sure, you know, I'll go and I'll set them free."],[1636.0,"I'm just the man for the job because I know everything about them."],[1640.0,"But he says, why send me?"],[1642.0,"I stutter, I can't speak."],[1645.0,"So he's trying to bow out."],[1647.0,"And yet God tells him no and I will let Aaron speak on your behalf."],[1652.0,"So that is why Aaron came to his meeting."],[1655.0,"23"]]},{"k":"s","p":1,"i":0,"a":1,"t":1655.3,"x":"Later, the people in Egypt were gathered by Moses and Aaron into a general assembly and their release from bondage was announced all around to those who were already distressed by the hardships of their labors."},{"k":"c","a":1,"t":1667.0,"e":1679.6,"l":[[1667.0,"Now we know from the scripture also it says that because of their sufferings they were praying urgently and they were begging for God to send them a savior."]]},{"k":"s","p":1,"i":1,"a":1,"t":1678.0,"x":"Report of this came to the tyrant himself."},{"k":"s","p":1,"i":2,"a":1,"t":1681.4,"x":"When he heard it his anger at both the overseers of the work and the Israelites themselves was greater than ever."},{"k":"s","p":1,"i":3,"a":1,"t":1689.0,"x":"The levy of bricks to be made was increased and a harsher command was sent down, not only to those slaving with the clay but also to those laboriously gathering chaff and straw."},{"k":"c","a":1,"t":1702.0,"e":1711.0,"l":[[1702.0,"So basically, Pharaoh."],[1706.0,"Okay, I won't comment because St. Gregory comments."],[1709.0,"24."]]},{"k":"s","p":2,"i":0,"a":1,"t":1710.0,"x":"Pharaoh (for this was the Egyptian tyrant's name) attempted to counter the divine signs performed by Moses and Aaron with magical tricks performed by his sorcerers."},{"k":"s","p":2,"i":1,"a":1,"t":1731.0,"x":"When Moses again turned his own rod into an animal before the eyes of the Egyptians, they thought that the sorcery of the magicians could equally work miracles with their rods."},{"k":"s","p":2,"i":2,"a":1,"t":1741.0,"x":"This deceit was exposed when the serpent produced from the staff of Moses ate the sticks of sorcery—the snakes no less!"},{"k":"s","p":2,"i":3,"a":1,"t":1748.0,"x":"The rods of the sorcerers had no means of defense nor any power of life, only the appearance which cleverly devised sorcery showed to the eyes of those easily deceived."},{"k":"c","a":1,"t":1760.0,"e":1846.0,"l":[[1760.0,"So here St. Gregory moved forward rather quickly."],[1766.0,"And because of that, if you will allow me, I will make a small comment about the fact that by increasing the levy of bricks and forcing the Israelites themselves to collect the straw for the bricks, because I guess they had assistance with that, he told them that from now on they're going to have to do that themselves."],[1786.0,"He was hoping to turn the Israelites against Moses and Aaron, because as their lives were becoming worse in quality, because they had to work even more, he was hoping they would basically tell Moses, you know what?"],[1801.0,"Leave us alone."],[1802.0,"We don't want you to deliver us from this slavery."],[1807.0,"And then when Moses threw his rod in front of the Pharaoh and it turned into a snake, it turned into a serpent."],[1814.0,"These two magicians did the same."],[1816.0,"However, Moses rod swallowed theirs, so his serpent swallowed theirs."],[1822.0,"Now, from the perspective of the ancients, the rod was also the symbol of power."],[1828.0,"And in this we clearly see that God's power given to Moses, because it was God who who told him to do that with his rod was far greater than the Egyptian sorcerers."],[1840.0,"Hence the rod of Moses swallowed theirs."],[1844.0,"25"]]},{"k":"s","p":3,"i":0,"a":1,"t":1844.4,"x":"When Moses saw that all the subjects agreed with their leader in his evil, he laid a blow upon the whole Egyptian nation, sparing no one from the calamities."},{"k":"s","p":3,"i":1,"a":1,"t":1855.0,"x":"Like an army under orders, the very elements of the universe—earth, water, air, and fire which are seen to be in everything—cooperated with him in this attack on the Egyptians, and changed their natural operations to serve human purposes."},{"k":"s","p":3,"i":2,"a":1,"t":1870.0,"x":"For by the same power and at the same time and place the disorderly were punished and those free of wrong did not suffer."},{"k":"s","p":4,"i":0,"a":1,"t":1881.4,"x":"At the command of Moses all the water in Egypt turned into blood."},{"k":"s","p":4,"i":1,"a":1,"t":1886.0,"x":"The fish were destroyed because the water thickened, but to the Hebrews alone the blood was water when they drew it."},{"k":"s","p":4,"i":2,"a":1,"t":1894.0,"x":"Found among the Hebrews this water provided an occasion for the magicians to use their art in making the water appear bloody."},{"k":"s","p":5,"i":0,"a":1,"t":1902.0,"x":"Similarly frogs covered Egypt in large numbers."},{"k":"s","p":5,"i":1,"a":1,"t":1907.0,"x":"Their breeding in these numbers was not natural, but Moses' command changed the normal density of frogs."},{"k":"s","p":5,"i":2,"a":1,"t":1913.0,"x":"All the land was in a sorry state, for the Egyptians' houses were being overrun with these creatures, while the Hebrews were free of this hateful plague."},{"k":"c","a":1,"t":1920.6,"e":1955.3,"l":[[1920.6,"from this hateful plague."],[1922.0,"So he's already talking about the second plague here, because the first one was that Moses turned all the water into blood for the Egyptians."],[1931.0,"However, when the Hebrews drew this water, it was a water for them."],[1936.0,"Now, quite interestingly, when recently I was rereading this portion of the Old Testament, I paid attention and was rather surprised that it was not Moses who put the rod in the water, but it was Aaron, because God commanded Aaron to"]]},{"k":"s","p":6,"i":0,"a":1,"t":1955.3,"x":"Likewise, there was no distinction between night and day to the Egyptians, who lived in unchanging gloom."},{"k":"s","p":6,"i":1,"a":1,"t":1961.0,"x":"To the Hebrews, however, nothing was out of the ordinary."},{"k":"s","p":6,"i":2,"a":1,"t":1964.0,"x":"It was the same with all the other things—the hail, the fire, the boils, the gadflies, the flies, the cloud of locusts:"},{"k":"s","p":6,"i":3,"a":1,"t":1972.0,"x":"Each had its natural effect on the Egyptians."},{"k":"s","p":6,"i":4,"a":1,"t":1975.0,"x":"The Hebrews learned of the misfortune of their neighbors by report, since they experienced no similar attack themselves."},{"k":"c","a":1,"t":1981.3,"e":1994.9,"l":[[1981.3,"on themselves."],[1982.0,"So all the punishments that God was sending on the Egyptians to force them to tell Pharaoh to let the Israelites go."],[1990.0,"These punishments did not affect the"]]},{"k":"s","p":7,"i":0,"a":1,"t":1994.0,"x":"Then the death of the firstborn made the distinction between Egyptians and Hebrews still sharper."},{"k":"s","p":7,"i":1,"a":1,"t":2000.0,"x":"The Egyptians were dismayed, lamenting the loss of their dearest children, while the Hebrews continued to live in total serenity and safety."},{"k":"s","p":7,"i":2,"a":1,"t":2007.0,"x":"Salvation was assured to them by the shedding of the blood."},{"k":"s","p":7,"i":3,"a":1,"t":2010.1,"x":"At every entrance both the doorposts and the lintel joining them were marked with blood."},{"k":"c","a":1,"t":2016.0,"e":2041.0,"l":[[2016.0,"So they had to celebrate the very first Passover."],[2023.0,"And the Passover lamb was sacrificed by the Israelites."],[2027.0,"And this lamb's blood was put on the doorposts and on the lintel, so you could almost draw the figure of the cross."],[2035.0,"Through this blood on the doors."],[2039.0,"29"]]}]},{"t":"The Exodus and the Red Sea","p":[[29,"While the Egyptians were downcast at the fate of their firstborn and each individual was lamenting his sufferings and those of everyone else, Moses led the exodus of the Israelites. He had previously prepared them to take away with themselves the wealth of the Egyptians on the pretext that it was a loan. The history goes on to say that when they were three days out of Egypt, the Egyptian was angry that Israel did not remain in slavery, and after mobilizing all his subjects for war, he pursued the people with his cavalry."],[0,"When they saw the deployment of the cavalry and infantry, they were panic-stricken since they were inexperienced in war and untrained in such sights, and they rose up against Moses. Then the history tells the most marvellous thing about Moses. He did two distinctly separate things at once: By spoken word he encouraged the Israelites and exhorted them not to abandon high hopes, but inwardly, in his thoughts, he pleaded with God on behalf of those who cowered in fear and he was directed by counsel from above how to escape the danger. God himself, the history says, gave ear to his voiceless cry."],[30,"By divine power a cloud led the people. This was no ordinary cloud, for it was not composed of the vapors or exhalations as normal clouds are. The winds did not press the vapors of the air into a misty composition; it was something beyond human comprehension. Scripture testifies that there was something amazing about that cloud. When the rays of the noonday sun shone with great heat, the cloud was a shelter for the people, shadowing those below it and moistening with a light dew the fiery heat of the atmosphere. During the night it became a fire, leading the Israelites as in a procession with its own light from sunset to sunrise."],[31,"Moses himself watched the cloud, and he taught the people to keep it in sight. When the cloud had guided them along their course, they came to the Red Sea, where the Egyptians coming from behind with their whole army surrounded the people. No way of escape from their terrors was open to the Israelites in any direction, because they were trapped between their enemies and the water. It was then that Moses, urged on by divine power, performed the most incredible deed of all. He approached the bank and struck the sea with his rod. The sea split at the blow, just as a crack in glass runs straight across to the edge when a break occurs at any point. The whole sea was split like that from the top by the rod, and the break in the waters reached to the opposite bank. At the place where the sea parted, Moses went down into the deep with all the people and they were in the deep without getting wet and their bodies were still in the sunlight. As they crossed the depths by foot on dry bottom, they were not alarmed at the water piled up so close to them on both sides, for the sea had been fixed like a wall on each side of them."],[32,"When Pharaoh and the Egyptians ran after them headlong into the sea along that newly cut path, the walls of water came together again and the sea rushed in upon itself to assume its previous form, becoming to the eye a single body of water. By that time the Israelites were already resting on the opposite bank from the long and strenuous march through the sea. Then they sang a victory song to God for raising a monument unstained with blood on their behalf since he destroyed in the water the whole army of the Egyptians—their horses, infantry, and chariots."]],"id":"b1-4","r":[29,32],"w":631,"x":[{"k":"s","p":0,"i":0,"a":1,"t":2039.4,"x":"While the Egyptians were downcast at the fate of their firstborn and each individual was lamenting his sufferings and those of everyone else, Moses led the exodus of the Israelites."},{"k":"s","p":0,"i":1,"a":1,"t":2051.0,"x":"He had previously prepared them to take away with themselves the wealth of the Egyptians on the pretext that it was a loan."},{"k":"s","p":0,"i":2,"a":1,"t":2058.0,"x":"The history goes on to say that when they were three days out of Egypt, the Egyptian was angry that Israel did not remain in slavery, and after mobilizing all his subjects for war, he pursued the people with his cavalry."},{"k":"s","p":1,"i":0,"a":1,"t":2072.0,"x":"When they saw the deployment of the cavalry and infantry, they were panic-stricken since they were inexperienced in war and untrained in such sights, and they rose up against Moses."},{"k":"s","p":1,"i":1,"a":1,"t":2083.1,"x":"Then the history tells the most marvellous thing about Moses."},{"k":"s","p":1,"i":2,"a":1,"t":2087.0,"x":"He did two distinctly separate things at once:"},{"k":"s","p":1,"i":3,"a":1,"t":2091.0,"x":"By spoken word he encouraged the Israelites and exhorted them not to abandon high hopes, but inwardly, in his thoughts, he pleaded with God on behalf of those who cowered in fear and he was directed by counsel from above how to escape the danger."},{"k":"s","p":1,"i":4,"a":1,"t":2107.0,"x":"God himself, the history says, gave ear to his voiceless cry."},{"k":"c","a":1,"t":2111.0,"e":2130.0,"l":[[2111.0,"So in this particular case, St. Gregory says that as Moses was talking to the people, he was at the same time directing his prayer to God."],[2120.0,"I. I personally think that's a very interesting idea that he brings to our attention here."],[2128.0,"30"]]},{"k":"s","p":2,"i":0,"a":1,"t":2128.3,"x":"By divine power a cloud led the people."},{"k":"s","p":2,"i":1,"a":1,"t":2131.0,"x":"This was no ordinary cloud, for it was not composed of the vapors or exhalations as normal clouds are."},{"k":"s","p":2,"i":2,"a":1,"t":2137.0,"x":"The winds did not press the vapors of the air into a misty composition; it was something beyond human comprehension."},{"k":"s","p":2,"i":3,"a":1,"t":2143.0,"x":"Scripture testifies that there was something amazing about that cloud."},{"k":"s","p":2,"i":4,"a":1,"t":2147.0,"x":"When the rays of the noonday sun shone with great heat, the cloud was a shelter for the people, shadowing those below it and moistening with a light dew the fiery heat of the atmosphere."},{"k":"s","p":2,"i":5,"a":1,"t":2158.0,"x":"During the night it became a fire, leading the Israelites as in a procession with its own light from sunset to sunrise."},{"k":"c","a":1,"t":2166.0,"e":2174.0,"l":[[2166.0,"So indeed, that was quite a great miracle for them in the desert."],[2172.0,"31"]]},{"k":"s","p":3,"i":0,"a":1,"t":2172.3,"x":"Moses himself watched the cloud, and he taught the people to keep it in sight."},{"k":"s","p":3,"i":1,"a":1,"t":2178.0,"x":"When the cloud had guided them along their course, they came to the Red Sea, where the Egyptians coming from behind with their whole army surrounded the people."},{"k":"s","p":3,"i":2,"a":1,"t":2187.0,"x":"No way of escape from their terrors was open to the Israelites in any direction, because they were trapped between their enemies and the water."},{"k":"s","p":3,"i":3,"a":1,"t":2195.0,"x":"It was then that Moses, urged on by divine power, performed the most incredible deed of all."},{"k":"s","p":3,"i":4,"a":1,"t":2202.0,"x":"He approached the bank and struck the sea with his rod."},{"k":"s","p":3,"i":5,"a":1,"t":2205.0,"x":"The sea split at the blow, just as a crack in glass runs straight across to the edge when a break occurs at any point."},{"k":"s","p":3,"i":6,"a":1,"t":2213.2,"x":"The whole sea was split like that from the top by the rod, and the break in the waters reached to the opposite bank."},{"k":"s","p":3,"i":7,"a":1,"t":2220.8,"x":"At the place where the sea parted, Moses went down into the deep with all the people and they were in the deep without getting wet and their bodies were still in the sunlight."},{"k":"s","p":3,"i":8,"a":1,"t":2230.3,"x":"As they crossed the depths by foot on dry bottom, they were not alarmed at the water piled up so close to them on both sides, for the sea had been fixed like a wall on each side of them."},{"k":"c","a":1,"t":2242.0,"e":2322.0,"l":[[2242.0,"Now this also is a great miracle, and in some way, perhaps, since St. Gregory isn't making this parallel, we could do it ourselves."],[2254.0,"Oftentimes in our lives, we are led by God into a situation where we are surrounded by the enemy, sort of against the bank of the Red Sea, you might say, completely, because Pharaoh cut them off, cut all the escape for the Israelites."],[2273.0,"We're surrounded and we are up against a wall, we are up against the sea or some other seemingly impenetrable barrier of escape."],[2287.0,"And yet, by the power of the cross, we are always capable of finding our salvation from the tribulation that follows us, as the Israelites did."],[2300.0,"And of course, a great miracle for them was the fact that as the sea parted, the bottom of the sea was dry."],[2307.0,"So when the Israelites crossed in great numbers, there were hundreds of thousands of people who crossed."],[2314.0,"They had the light, and they also were walking on dry ground, so they did not get stuck."],[2320.0,"32"]]},{"k":"s","p":4,"i":0,"a":1,"t":2320.3,"x":"When Pharaoh and the Egyptians ran after them headlong into the sea along that newly cut path, the walls of water came together again and the sea rushed in upon itself to assume its previous form, becoming to the eye a single body of water."},{"k":"s","p":4,"i":1,"a":1,"t":2336.0,"x":"By that time the Israelites were already resting on the opposite bank from the long and strenuous march through the sea."},{"k":"s","p":4,"i":2,"a":1,"t":2343.0,"x":"Then they sang a victory song to God for raising a monument unstained with blood on their behalf since he destroyed in the water the whole army of the Egyptians—their horses, infantry, and chariots."}]},{"t":"The Desert and the War with Amalek","p":[[33,"After that, Moses pushed on, but when he had traveled three days without water he was at a loss how to relieve the thirst of the army. They pitched camp near a pool of salty water, more bitter than the sea itself. While they were resting close to the water and were parched with thirst, Moses, acting on the counsel of God, found a piece of wood near that place and threw it into the water. Immediately it became drinkable, for the wood by its own power changed the nature of the water from bitter to sweet."],[34,"As the cloud moved forward, the Israelites followed their guide closely. They always rested from their march wherever the cloud indicated by stopping, and they departed again whenever the cloud led the way on. By following this g
