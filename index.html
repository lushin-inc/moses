 Reviling is a stone straight from the sling and the spirited impulse is the quivering spear point. The passion for pleasures is to be seen in the horses who themselves with irresistible drive pull the chariot."],[123,"In the chariot there are three drivers whom the history calls \"viziers.\" Since you were previously instructed in the mystery of the side posts and upper doorpost, you will perceive these three, who are completely carried along by the chariot, as the tripartite division of the soul, meaning the rational, the appetitive, and the spirited."],[124,"So all such things rush into the water with the Israelite who leads the way in the baleful passage. Then as the staff of faith leads on and the cloud provides light, the water gives life to those who find refuge in it but destroys their pursuers."],[125,"Moreover, the history teaches us by this what kind of people they should be who come through the water, bringing nothing of the opposing army along as they emerge from the water. For if the enemy came up out of the water with them, they would continue in slavery even after the water, since they would have brought up with themselves the tyrant, still alive, whom they did not drown in the deep. If anyone wishes to clarify the figure, this lays it bare: Those who pass through the mystical water in baptism must put to death in the water the whole phalanx of evil—such as covetousness, unbridled desire, rapacious thinking, the passion of conceit and arrogance, wild impulse, wrath, anger, malice, envy, and all such things. Since the passions naturally pursue our nature, we must put to death in the water both the base movements of the mind and the acts which issue from them."],[126,"Just as unleavened bread was eaten in the mystery of the Pasch (which is the name of the sacrificial victim whose blood prevents the death of the one using it), even so the Law now commands us to eat unleavened bread at the Pasch (unleavened would be unmixed with stale yeast). The Law gives us to understand by this that no remnant of evil should mix with the subsequent life. Rather we should make a totally new beginning in life after these things, breaking the continuity with evil by a radical change for the better. Thus also he means here that after we have drowned the whole Egyptian person (that is every form of evil) in the saving baptism we emerge alone, dragging along nothing foreign in our subsequent life. This is what we hear through the history, which says that in the same water the enemy and the friend are distinguished by death and life, the enemy being destroyed and the friend given life."],[127,"Many of those who receive the mystical baptism, in ignorance of the commandments of the Law, mix the bad leaven of the old life with the new life. Even after crossing the water they bring along the Egyptian army, which still lives with them in their doings."],[128,"Take for instance the one who became rich by robbery or injustice, or who acquired property through perjury, or lived with a woman in adultery, or undertook any of the other things against life which have been forbidden before the gift of baptism. Does he think that even after his washing he may continue to enjoy those evil things which have become attached to him and yet be freed from the bondage of sin, as though he cannot see that he is under the yoke of harsh masters?"],[129,"For uncontrolled passion is a fierce and raging master to the servile reasoning, tormenting it with pleasures as though they were scourges. Covetousness is another such master who provides no relief to the bondsman, but even if the one in bondage should slave in subservience to the commands of the master and acquire for him what he desires, the servant is always driven on to more. And all the other things which are performed by evil are so many tyrants and masters. If someone should still serve them, even if he should happen to have passed through the water, according to my thinking he has not at all touched the mystical water whose function is to destroy evil tyrants."]],"id":"b2-11","r":[122,129],"w":813,"x":[{"k":"s","p":0,"i":0,"a":7,"t":1036.0,"x":"No one who hears this should be ignorant of the mystery of the water."},{"k":"s","p":0,"i":1,"a":7,"t":1040.0,"x":"He who has gone down into it with the army of the enemy emerges alone, leaving the enemy's army drowning in the water."},{"k":"c","a":7,"t":1049.0,"e":1077.6,"l":[[1049.0,"So I'm assuming that in particular, in this particular case, since he clearly says he who has gone down into it, down into the water."],[1057.0,"So he's referring to baptism."],[1059.0,"When we are baptized, our enemies that follow us into the font are then drowned."],[1064.0,"The spiritual enemies are drowned in the water, and we emerge from the water of the font to baptism as free, liberated, and new creatures in Christ."]]},{"k":"s","p":1,"i":0,"a":7,"t":1076.0,"x":"For who does not know that the Egyptian army— those horses, chariots and their drivers, archers, slingers, heavily armed soldiers, and the rest of the crowd in the enemies' line of battle—are the various passions of the soul by which man is enslaved?"},{"k":"s","p":1,"i":1,"a":7,"t":1092.0,"x":"For the undisciplined intellectual drives and the sensual impulses to pleasure, sorrow, and covetousness are indistinguishable from the aforementioned army."},{"k":"s","p":1,"i":2,"a":7,"t":1102.0,"x":"Reviling is a stone straight from the sling and the spirited impulse is the quivering spear point."},{"k":"s","p":1,"i":3,"a":7,"t":1109.0,"x":"The passion for pleasures is to be seen in the horses who themselves with irresistible drive pull the chariot."},{"k":"s","p":2,"i":0,"a":7,"t":1118.0,"x":"In the chariot there are three drivers whom the history calls \"viziers.\" Since you were previously instructed in the mystery of the side posts and upper doorpost, you will perceive these three, who are completely carried along by the chariot, as the tripartite division of the soul, meaning the rational, the appetitive, and the spirited."},{"k":"s","p":3,"i":0,"a":7,"t":1143.0,"x":"So all such things rush into the water with the Israelite who leads the way in the baleful passage."},{"k":"s","p":3,"i":1,"a":7,"t":1150.0,"x":"Then as the staff of faith leads on and the cloud provides light, the water gives life to those who find refuge in it but destroys their pursuers."},{"k":"c","a":7,"t":1162.0,"e":1178.5,"l":[[1162.0,"That really, I find it difficult to comment on that because he is talking so beautifully about the parallel between the crossing of the Red Sea by the Israelites and of course, baptism."],[1175.0,"Paragraph 125."]]},{"k":"s","p":4,"i":0,"a":7,"t":1178.0,"x":"Moreover, the history teaches us by this what kind of people they should be who come through the water, bringing nothing of the opposing army along as they emerge from the water."},{"k":"s","p":4,"i":1,"a":7,"t":1188.0,"x":"For if the enemy came up out of the water with them, they would continue in slavery even after the water, since they would have brought up with themselves the tyrant, still alive, whom they did not drown in the deep."},{"k":"s","p":4,"i":2,"a":7,"t":1201.0,"x":"If anyone wishes to clarify the figure, this lays it bare:"},{"k":"s","p":4,"i":3,"a":7,"t":1204.9,"x":"Those who pass through the mystical water in baptism must put to death in the water the whole phalanx of evil—such as covetousness, unbridled desire, rapacious thinking, the passion of conceit and arrogance, wild impulse, wrath, anger, malice, envy, and all such things."},{"k":"s","p":4,"i":4,"a":7,"t":1222.0,"x":"Since the passions naturally pursue our nature, we must put to death in the water both the base movements of the mind and the acts which issue from them."},{"k":"c","a":7,"t":1236.0,"e":1389.0,"l":[[1236.0,"I think in this particular case, maybe the way that we can apply this to ourselves is to say that, well, if one is approaching the font of baptism, one has to have an unswerving determination to."],[1255.0,"To put to death those passions, to rid himself from them and to be separated from them."],[1261.0,"Of course, we all know that as we come up from the baptism, those passions no longer have a hold within us, but they can continue pursuing us in as much as we allow them."],[1275.0,"And so, if we are negligent, if we approach the holy font of baptism without the determination to be rid of sin, if we approach the holy font of baptism without a burning desire to declare war on the enemy, if we actually sort of conceal the enemy within ourselves, well, then, of course, yes, indeed, he will continue afflicting us even after the baptism."],[1306.0,"Baptism is a mystery."],[1309.0,"It isn't a thing of magic."],[1311.0,"Someone who is baptized isn't going to have all the passions sort of removed from his soul."],[1319.0,"They will continue appearing and tempting in order for that person continuously also to prove himself to be faithful to the very promise that he has made."],[1331.0,"Because while before we enter the font of baptism, we, or if we are children at the time our sponsors renounce Satan and."],[1346.0,"Unite ourselves to Christ."],[1349.0,"And so once that renunciation has been made, it should not be unmade post baptism."],[1356.0,"We should not be coming out of the Fontaine thinking, oh, well, you know, I can do a little bit of this and a little bit of that."],[1362.0,"What's the big deal?"],[1362.0,"Well, the big deal is, is that, yes, essentially the very sort of enemy that you wanted God to drown in the font of baptism."],[1371.0,"You're taking him into your soul, into your heart, into your mind."],[1376.0,"If you say, well, what harm will it be if I do it just a little, if I engage in these evil acts, Just a little."],[1385.0,"A little."],[1386.0,"Paragraph 126."]]},{"k":"s","p":5,"i":0,"a":7,"t":1388.0,"x":"Just as unleavened bread was eaten in the mystery of the Pasch (which is the name of the sacrificial victim whose blood prevents the death of the one using it), even so the Law now commands us to eat unleavened bread at the Pasch (unleavened would be unmixed with stale yeast)."},{"k":"s","p":5,"i":1,"a":7,"t":1405.0,"x":"The Law gives us to understand by this that no remnant of evil should mix with the subsequent life."},{"k":"s","p":5,"i":2,"a":7,"t":1411.0,"x":"Rather we should make a totally new beginning in life after these things, breaking the continuity with evil by a radical change for the better."},{"k":"s","p":5,"i":3,"a":7,"t":1420.0,"x":"Thus also he means here that after we have drowned the whole Egyptian person (that is every form of evil) in the saving baptism we emerge alone, dragging along nothing foreign in our subsequent life."},{"k":"s","p":5,"i":4,"a":7,"t":1433.0,"x":"This is what we hear through the history, which says that in the same water the enemy and the friend are distinguished by death and life, the enemy being destroyed and the friend given life."},{"k":"s","p":6,"i":0,"a":7,"t":1448.0,"x":"Many of those who receive the mystical baptism, in ignorance of the commandments of the Law, mix the bad leaven of the old life with the new life."},{"k":"s","p":6,"i":1,"a":7,"t":1456.0,"x":"Even after crossing the water they bring along the Egyptian army, which still lives with them in their doings."},{"k":"s","p":7,"i":0,"a":7,"t":1464.0,"x":"Take for instance the one who became rich by robbery or injustice, or who acquired property through perjury, or lived with a woman in adultery, or undertook any of the other things against life which have been forbidden before the gift of baptism."},{"k":"s","p":7,"i":1,"a":7,"t":1480.0,"x":"Does he think that even after his washing he may continue to enjoy those evil things which have become attached to him and yet be freed from the bondage of sin, as though he cannot see that he is under the yoke of harsh masters?"},{"k":"c","a":7,"t":1500.0,"e":1849.0,"l":[[1500.0,"Well, there's a question in the comments about one might struggle all the more with those sins which are foremost in our lives."],[1511.0,"I think that the distinction here in the drowning."],[1514.0,"And perhaps."],[1515.0,"Thank you so much for asking that question, because it is important to understand that being baptized doesn't mean the death of all temptation and of all assaults of evil, obviously, because then everybody baptized would need to go straight to heaven, because they'd be perfect and everything would be done for them."],[1536.0,"But I think what we're talking about here is that."],[1540.0,"And of course, as we go on and we learn about the Israelites going into the promised land, there will be new enemies pursuing them or, you know, sort of trying to bar their passage, that they would have to fight in order to come and to inherit the promised land."],[1557.0,"So for certain, the passions and the sins are not put to death in baptism in the sense that they cease to bother us."],[1571.0,"But I think that baptism becomes the crucial point in which the soul is rid of them, in the sense that baptism marks are sort of untangling from these passions where we realize that they are no longer something that we should be mixed with, engaged with."],[1596.0,"You know, the Israelites lived with the Egyptians in one country, in one land."],[1601.0,"And when they went into the desert in the Red Sea, essentially they."],[1605.0,"They were separated completely."],[1608.0,"Now they faced other enemies as they continued their journey on the other side."],[1613.0,"What happens with a Christian is before baptism, what the Father says, that the enemy is inside the person."],[1622.0,"He's inside the soul."],[1623.0,"He has access to the person from within."],[1626.0,"Because the person has sort of made it customary to live with the enemy."],[1631.0,"You know, like they're living in the same country."],[1633.0,"You know, they're sharing thoughts and ideas and so on."],[1638.0,"But in baptism, one pronounces one's battle against the enemy."],[1645.0,"And so the enemy is no longer granted access to within, except for that which is given by the person himself or herself after baptism."],[1656.0,"Thus, these temptations, these sins, most definitely will be a matter of struggle even after baptism."],[1664.0,"However, whereas the person considered them to be a part of himself before, now the person realizes that, no, I'm a new creature in Christ."],[1674.0,"Christ, and this is foreign to me, and I want nothing to do with it."],[1680.0,"Imagine it's as though you think that certain filthy sort of dirty, foul old clothing is part of you."],[1693.0,"And in baptism, you strip it all off."],[1696.0,"And when the enemy brings and starts to sort of offer that you put it back on, you say, no, I have no desire to do so."],[1705.0,"And then the enemy will throw these clothes at you, and so on and so forth."],[1709.0,"And sometimes, maybe foolishly, you even think that, well, it won't be any harm if I put it on for a little bit."],[1716.0,"But then, of course, all the foul stench and everything comes right back."],[1720.0,"So I think definitely St. Gregory here is not saying that."],[1725.0,"That in baptism all of our sins and all the passions are entirely put to death."],[1731.0,"And we lead sort of a sinless and completely dispassionate life."],[1737.0,"No, of course not."],[1739.0,"However, our positions change."],[1742.0,"And if we."],[1745.0,"From before that, you could say we saw eye to eye with the enemy."],[1749.0,"We had the same perspective."],[1751.0,"We."],[1751.0,"We looked at life maybe sort of sometimes even through the eyes of the enemy."],[1756.0,"You know, I want to get ahead."],[1757.0,"I want to have some fun."],[1758.0,"You know, I. I want to get some money, even if it means lying Cheating and stealing, you know, I want this, I want that, you know, what's wrong with that?"],[1766.0,"And then when we emerge from the font, the voice of our conscience becomes very loud and clear, you know, and you might say our compass starts working properly, whereas before, you know, it had."],[1783.0,"Like the sea voyagers in the past, if you wanted to sort of beguile the captain or the navigator of the ship, you would put a metal object underneath the compass carefully, and it would mess with the magnet in the compass, and the compass would show the wrong way."],[1799.0,"Well, imagine in baptism, that metal object is removed, and so the compass that was showing sporadically in all various directions now points to true north."],[1811.0,"And now the voyager has a proper direction."],[1815.0,"Is the enemy, you know, capable of new assaults and attacks?"],[1818.0,"Of course, however, one no longer considers the enemy his friend."],[1823.0,"One no longer mistakes the enemy for his friend."],[1826.0,"One realizes that, that the enemy is the one who seeks one's destruction, the destruction of one's soul, and is doing his best to sort of distance himself from the enemy and vanquish his."],[1841.0,"What would you call him?"],[1841.0,"Vanquish his sort of designs."],[1846.0,"Paragraph 129."]]},{"k":"s","p":8,"i":0,"a":7,"t":1848.0,"x":"For uncontrolled passion is a fierce and raging master to the servile reasoning, tormenting it with pleasures as though they were scourges."},{"k":"s","p":8,"i":1,"a":7,"t":1856.0,"x":"Covetousness is another such master who provides no relief to the bondsman, but even if the one in bondage should slave in subservience to the commands of the master and acquire for him what he desires, the servant is always driven on to more."},{"k":"s","p":8,"i":2,"a":7,"t":1874.0,"x":"And all the other things which are performed by evil are so many tyrants and masters."},{"k":"s","p":8,"i":3,"a":7,"t":1880.0,"x":"If someone should still serve them, even if he should happen to have passed through the water, according to my thinking he has not at all touched the mystical water whose function is to destroy evil tyrants."},{"k":"c","a":7,"t":1893.0,"e":2055.3,"l":[[1893.0,"Now, yes, I think that here he refers to sort of the mystical water."],[1902.0,"And I think that Professor Oysip of in his lectures also mentions something that is quite powerful and strong."],[1910.0,"And he says, if you do not believe, if you don't have a firm determination and resolution to enter baptism as a new beginning and as a way to serve God, well, men will baptize you, but the Holy Spirit will not."],[1926.0,"So if you look at baptism as just a ritual, as nothing, yes, it is possible for you to enter the font, to even be chrismated."],[1936.0,"And really, if you think about it this way, St. Paul says that Holy Communion, which is another great mystery of the Church, probably the greatest once we are baptized, for any Orthodox Christian because the Lord says, unless ye eat my body and drink my blood, ye have no life in you."],[1955.0,"You have no life in you."],[1956.0,"Well, think of it this way."],[1958.0,"Holy Communion does not work like some hocus pocus or, you know, sort of a magic remedy, a magic pill."],[1970.0,"If you receive the Holy Communion unworthily, without proper preparation, without proper trepidation of the soul, it can actually further harm you."],[1981.0,"And St. Paul says that some people have even."],[1983.0,"Even gotten sick and died because they received the Holy Communion unworthily."],[1989.0,"I think in the same way, you could say that many."],[1992.0,"For some people, even the font of baptism can be destructive."],[1999.0,"Because if you think about it spiritually, in the font, the enemy is destroyed."],[2006.0,"Because we know that the Egyptian army was swallowed by the Red Sea, was drowned by the Red Sea."],[2012.0,"Well, if you number yourself among the ranks of the Egyptians rather than the Israelites, as you enter the font of the baptism, you are actually entering your own drowning."],[2023.0,"You will not be coming up from the fountain to life eternal, but you will be drowning in the waters if you sort of enter into it with some guileful idea that, you know, or sort of of a deceitful idea that you can continue be friends with the enemy and."],[2040.0,"And so on."],[2041.0,"So I think that that's."],[2042.0,"That's something to keep in mind for sure."],[2045.0,"Paragraph 130."],[2047.0,"Let us proceed, and we're starting the new chapter, the first Stations in."],[2052.0,"In the Desert."]]}]},{"t":"The First Stations in the Desert","p":[[130,"Let us again proceed to the next point in the text. For the person who has crossed the sea and has seen this Egyptian dead in it, as we interpret it, no longer looks to Moses alone as the staff-bearer of virtue; but in keeping with the foregoing he believes in God, even as the Scripture says, and is obedient to his servant Moses. We see this happening even now with those who truly cross the water, who dedicate themselves to God and are obedient and submissive, as the Apostle says, to those who serve the Divine in the priesthood."],[131,"After they had crossed the sea, a three days' march ensued, during which they made camp at a place where they found water so bitter that they could not at first drink it. But wood placed in the water made the drink agreeable to those who were thirsty."],[132,"The history agrees with what now happens: for to the one who has left behind the Egyptian pleasures which he served before crossing the sea, life removed from these pleasures seems at first difficult and disagreeable. But if the wood be thrown into the water, that is, if one receives the mystery of the resurrection which had its beginning with the wood (you of course understand the \"cross\" when you hear \"wood\"), then the virtuous life, being sweetened by the hope of things to come, becomes sweeter and more pleasant than all the sweetness that tickles the senses with pleasure."],[133,"The next resting place on the journey, replete with palm trees and springs, refreshed the travelers. There were twelve springs of pure and very sweet water and seventy large, high-crested date palms which had grown tall with the years. What do we discover in these things as we follow the history? That the mystery of the wood through which the water of virtue became pleasant to those athirst leads us to the twelve springs and the seventy date palms, that is, to the teaching of the Gospel."],[134,"The springs are the Twelve Apostles whom the Lord chose for this service and through whom he caused his word to well up. One of the Prophets foretold the welling up of grace from the Apostles when he said: In the churches bless God the Lord, from the fountains of Israel. And the seventy date palms would be those apostles appointed in addition to the Twelve Disciples throughout the whole world; they were the same in number as the history says the palm trees were."],[135,"But I think it is fitting to speed our journey through the text, yet making the contemplation of the rest of the camps easier for those who are more studious by offering a few remarks. The campsites, where the person following the pillar of cloud is refreshed as he presses on, would be the virtues. Passing over the intermediate resting places with a mere mention, I shall call to mind the miracle of the rock, whose resistant and hard nature became drink to those who were thirsty when its hardness dissolved into the softness of water."],[136,"It is not difficult to harmonize the sequence of the history with spiritual contemplation. He who left the Egyptian behind dead in the water, was sweetened by the wood, was delighted in the apostolic springs, and was refreshed by the shade of the palm trees, is already capable of receiving God. For the rock, as the Apostle says, is Christ, who is moistureless and resistant to unbelievers, but if one should employ the rod of faith he becomes drink to those who are thirsty and flows into those who receive him, for he says, I and my Father shall come to him and make our home with him."]],"id":"b2-12","r":[130,136],"w":624,"x":[{"k":"s","p":0,"i":0,"a":7,"t":2054.0,"x":"Let us again proceed to the next point in the text."},{"k":"s","p":0,"i":1,"a":7,"t":2057.0,"x":"For the person who has crossed the sea and has seen this Egyptian dead in it, as we interpret it, no longer looks to Moses alone as the staff-bearer of virtue; but in keeping with the foregoing he believes in God, even as the Scripture says, and is obedient to his servant Moses."},{"k":"s","p":0,"i":2,"a":7,"t":2074.0,"x":"We see this happening even now with those who truly cross the water, who dedicate themselves to God and are obedient and submissive, as the Apostle says, to those who serve the Divine in the priesthood."},{"k":"c","a":7,"t":2086.0,"e":2142.5,"l":[[2086.0,"Now, I think that here, most appropriately, we should recall the words of the those who hear my words, those who receive me receive the Father who sent me."],[2102.0,"And those who will obey you will thus by extension, be obeying me."],[2108.0,"And those who disobey you will be disobeying me."],[2112.0,"So for sure, St. Gregory is absolutely right in saying that the true Israelite who crossed the Red Sea becomes very much aware of God's divine power for salvation."],[2125.0,"But he doesn't say, well, I'm just serving God and following God."],[2129.0,"Of course, he follows Moses because he recognizes Moses as the servant of God, who was appointed to lead Israel to salvation."],[2140.0,"Paragraph 131."]]},{"k":"s","p":1,"i":0,"a":7,"t":2141.0,"x":"After they had crossed the sea, a three days' march ensued, during which they made camp at a place where they found water so bitter that they could not at first drink it."},{"k":"s","p":1,"i":1,"a":7,"t":2150.0,"x":"But wood placed in the water made the drink agreeable to those who were thirsty."},{"k":"s","p":2,"i":0,"a":7,"t":2157.0,"x":"The history agrees with what now happens: for to the one who has left behind the Egyptian pleasures which he served before crossing the sea, life removed from these pleasures seems at first difficult and disagreeable."},{"k":"s","p":2,"i":1,"a":7,"t":2171.0,"x":"But if the wood be thrown into the water, that is, if one receives the mystery of the resurrection which had its beginning with the wood (you of course understand the \"cross\" when you hear \"wood\"), then the virtuous life, being sweetened by the hope of things to come, becomes sweeter and more pleasant than all the sweetness that tickles the senses with pleasure."},{"k":"c","a":7,"t":2190.7,"e":2297.1,"l":[[2190.7,"to the tickles, the sense with pleasure."],[2193.0,"So I think, you know, here quite beautifully, he is underlining the fact that just as the water was the water of Marah, actually bitter water was unpalatable for the Israelites after they crossed the Red Sea."],[2208.0,"And placing the wood in the water made it sweet."],[2212.0,"In a similar way, a life of a Christian after the font, after the baptism may appear bitter because all of a sudden there is a totally new alignment, you know, alignment toward virtue."],[2226.0,"And of course we hear that the Lord says, the kingdom of heaven suffereth violence and violent men take it by force."],[2233.0,"Well, what does that mean?"],[2234.0,"You know, maybe that's not the best sort of translation interpretation, but I think most importantly, what it means is that the kingdom of heaven has to be obtained by effort."],[2250.0,"It is a free gift."],[2251.0,"Yes, but this free gift must be claimed, so to speak, by effort."],[2257.0,"And of course, this effort has to do with cleansing oneself and ridding oneself of the passions that are attached."],[2264.0,"And this effort might seem bitter initially, just like the waters at their first stop, but once you sort of present the cross of Christ, you know, the wood into this effort."],[2278.0,"And actually, quite interestingly, recently I was given this as a gift by a very dear friend of mine."],[2287.0,"When the cross, the wood of the cross is presented into the struggle from bitter"]]},{"k":"s","p":3,"i":0,"a":7,"t":2299.0,"x":"The next resting place on the journey, replete with palm trees and springs, refreshed the travelers."},{"k":"s","p":3,"i":1,"a":7,"t":2307.0,"x":"There were twelve springs of pure and very sweet water and seventy large, high-crested date palms which had grown tall with the years."},{"k":"s","p":3,"i":2,"a":7,"t":2316.0,"x":"What do we discover in these things as we follow the history?"},{"k":"s","p":3,"i":3,"a":7,"t":2319.8,"x":"That the mystery of the wood through which the water of virtue became pleasant to those athirst leads us to the twelve springs and the seventy date palms, that is, to the teaching of the Gospel."},{"k":"c","a":7,"t":2333.0,"e":2356.5,"l":[[2333.0,"Now, to me it seems quite absolutely phenomenal, and I think he's talking about this in the very next paragraph."],[2340.0,"But I can't fail to say, well, the twelve great disciples, the twelve apostles and the seventy lesser apostles."],[2346.0,"Apostles whom the Lord had that is what they encountered."],[2350.0,"I forgotten that in the Old Testament, but it's very instructive."],[2354.0,"Paragraph 134."]]},{"k":"s","p":4,"i":0,"a":7,"t":2355.0,"x":"The springs are the Twelve Apostles whom the Lord chose for this service and through whom he caused his word to well up."},{"k":"s","p":4,"i":1,"a":7,"t":2362.0,"x":"One of the Prophets foretold the welling up of grace from the Apostles when he said:"},{"k":"s","p":4,"i":2,"a":7,"t":2366.6,"x":"In the churches bless God the Lord, from the fountains of Israel."},{"k":"s","p":4,"i":3,"a":7,"t":2370.0,"x":"And the seventy date palms would be those apostles appointed in addition to the Twelve Disciples throughout the whole world; they were the same in number as the history says the palm trees were."},{"k":"s","p":5,"i":0,"a":7,"t":2386.0,"x":"But I think it is fitting to speed our journey through the text, yet making the contemplation of the rest of the camps easier for those who are more studious by offering a few remarks."},{"k":"s","p":5,"i":1,"a":7,"t":2396.0,"x":"The campsites, where the person following the pillar of cloud is refreshed as he presses on, would be the virtues."},{"k":"s","p":5,"i":2,"a":7,"t":2403.8,"x":"Passing over the intermediate resting places with a mere mention, I shall call to mind the miracle of the rock, whose resistant and hard nature became drink to those who were thirsty when its hardness dissolved into the softness of water."},{"k":"c","a":7,"t":2418.0,"e":2434.5,"l":[[2418.0,"So we know that in one particular place Moses was commanded by God to strike the rock with his staff."],[2428.0,"And when he did so, water flowed forward."],[2432.0,"Paragraph 136."]]},{"k":"s","p":6,"i":0,"a":7,"t":2433.0,"x":"It is not difficult to harmonize the sequence of the history with spiritual contemplation."},{"k":"s","p":6,"i":1,"a":7,"t":2438.0,"x":"He who left the Egyptian behind dead in the water, was sweetened by the wood, was delighted in the apostolic springs, and was refreshed by the shade of the palm trees, is already capable of receiving God."},{"k":"s","p":6,"i":2,"a":7,"t":2451.0,"x":"For the rock, as the Apostle says, is Christ, who is moistureless and resistant to unbelievers, but if one should employ the rod of faith he becomes drink to those who are thirsty and flows into those who receive him, for he says, I and my Father shall come to him and make our home with him."},{"k":"c","a":7,"t":2470.0,"e":2589.6,"l":[[2470.0,"Well, I think perhaps maybe on this particular note, it would be a good stopping place, considering that Christ the living rock."],[2479.0,"And of course, yes, the Lord says, God has appointed a rock, and this rock will crush those upon which he falls."],[2491.0,"And also those who fall upon him will find themselves sort of broken."],[2497.0,"But to those who believe this rock is sort of the the head cornerstone, the one upon which the foundation of the entire church will be built."],[2508.0,"So with that in mind, I will say goodbye for tonight."],[2512.0,"I will ask all of you for prayers."],[2515.0,"Thank you all for your support."],[2517.0,"Thank you very much for the comments, especially those who clarify things for all of us."],[2523.0,"I find this reading to be very beneficial and very inspiring."],[2527.0,"I hope you do as well."],[2530.0,"Please pray for me."],[2531.0,"God willing, we will continue next week on Wednesday night as usual."],[2536.0,"I don't remember that there should be any reason that we would not the next week and God willing, we will see you."],[2544.0,"Please, please, please keep me in your prayers."],[2547.0,"Thank you so much for them."],[2549.0,"Thank you for your support, both spiritual and material, because there are quite a few who do."],[2556.0,"Let us sing a prayer to the Mother of God."],[2559.0,"Call it a night."],[2561.0,"It is truly me to bless thee that thou took Most ever blessed and most blameless and mother of our God, More honourable than the cherubim and beyond compare, more glorious than the seraphim who without corruption gave his birth to God the Word, the very theotokosadidu we magnify."],[2583.0,"God bless you."],[2583.0,"Have a wonderful week and hopefully we'll see you soon."]]}]},{"t":"The Manna","p":[[137,"There is another event which we must not rush over without contemplation. After the travelers in virtue had crossed the sea, after the water had been sweetened for them, after their refreshing rest by the springs and palms, and after their drinking from the rock, the supplies from Egypt ran completely Out. And thus when they had no more of the foreign food which they had laid by in Egypt, there flowed down from above food which was at the same time varied and uniform. In appearance the food was uniform, but in quality it was varied, for it conformed itself to each person's desire."],[138,"What then do we learn here? We learn by what purifications one should purify himself of Egypt and the foreign life so that he empties the sack of his soul of all evil nourishment prepared by the Egyptians. In this way he receives in himself with his pure soul the food which comes down from above, which was not produced for us by any sowing in cultivated soil. Coming down from above, the bread is found upon the earth already prepared without the wheat's having been sown or ripened."],[139,"You no doubt perceive the true food in the figure of the history: The bread which came from heaven is not some incorporeal thing. For how could something incorporeal be nourishment to a body? Neither ploughing nor sowing produced the body of this bread, but the earth which remained unchanged was found full of this divine food, of which the hungry partake. This miracle teaches in anticipation the mystery of the Virgin."],[140,"This bread, then, that does not come from the earth is the Word. He changes his power in diverse ways to suit those who eat. He knows not only to be bread but also to become milk and meat and greens and whatever else might be appropriate to and desired by the one who receives him. So teaches Paul the divine Apostle who spreads such a table as this for us—making his message strong meat for the more mature and greens for the weaker and milk for little children."],[141,"Whatever marvels the history ennumerates in connection with that food are teachings for the virtuous life. For it says that everyone shared in the food equally. The strength of those who gathered made no difference; they had neither more nor less than they needed. This is, according to my view at least, advice generally applicable: that those making their living from material things should not exceed the bounds of need but should understand well that the one natural measure for all in eating is to eat as much as can be enjoyed in one day."],[142,"Even if much more were prepared than is needed, it is not in the stomach's nature to exceed its proper measure or to be stretched by the insatiate desire for what is prepared. But, as the history says, neither did the one who took much have an abundance (for he had nowhere to store the excess) nor did he who took little lack any (for his requirements were lessened according to the amount which was found)."],[143,"In this account Scripture after a fashion cries out to the covetous that the insatiable greed of those always hoarding surplus is turned into worms. Everything beyond what they need encompassed by this covetous desire becomes on the next day—that is in the future life—a worm to the person who hoards it. He who hears \"worm\" certainly perceives the undying worm which is made alive by covetousness."],[144,"The fact that what is stored up continues to supply nourishment and experiences no corruption only on the Sabbath contains the following counsel: There is a time in the course of one's life when he must be grasping—at the time when what is gathered does not submit to corruption. Then, when we pass beyond the preparation of this life and come to the rest after death, it will become useful to us. The day before the Sabbath is named the Preparation for the Sabbath. This day would be the present life in which we prepare for ourselves the things of the life to come."],[145,"In that life none of the things we engage in now are undertaken—neither agriculture, nor trade, nor military service, nor any of the other things pursued here. But living in complete rest from such works, we acquire the fruits of the seeds which we now sow in life, some incorruptible, if the seeds of life be good, and some deadly and destructive, if the cultivation of this life produce such in us. For he who sows in the field of the spirit, Scripture says, will get from it a harvest of eternal life, but he who sows in the field of self-indulgence willget a harvest of corruption out of it."],[146,"The preparation for the better is alone properly called Preparation and is surely confirmed by the Law, and what is stored up during it is incorruptible. That which is perceived as belonging to the opposite is neither Preparation nor is so called, for no one would reasonably call privation of good Preparation, but rather a lack of preparation. Therefore, the history prescribes for men the Preparation for the better and leaves it to the intelligent to perceive the opposite by its omission."]],"id":"b2-13","r":[137,146],"w":889,"x":[{"k":"c","a":8,"t":3.0,"e":77.8,"l":[[3.0,"In the name of the Father and of the Son and of the Holy Spirit."],[5.0,"Amen."],[5.0,"Dear friends, welcome back to our regular readings of the various works of the saints."],[12.0,"And we are continuing to read the life of Moses as sort of retold and commented by St. Gregory of Nyssa."],[24.0,"Let us pray, and we will begin."],[29.0,"O heavenly King, comfort the spirit of truth, who art everywhere present and fillest all things, treasury of good things and giver of life, come and dwell in us, and cleanse us of all impurity and save our souls."],[46.0,"O good one."],[55.0,"So we are slowly but surely making headway in our reading, and of course, we are continuing on a new chapter today."],[65.0,"It's the chapter titled the Manna."],[70.0,"And so paragraph 137 is next."]]},{"k":"s","p":0,"i":0,"a":8,"t":77.0,"x":"There is another event which we must not rush over without contemplation."},{"k":"s","p":0,"i":1,"a":8,"t":81.0,"x":"After the travelers in virtue had crossed the sea, after the water had been sweetened for them, after their refreshing rest by the springs and palms, and after their drinking from the rock, the supplies from Egypt ran completely Out."},{"k":"s","p":0,"i":2,"a":8,"t":95.0,"x":"And thus when they had no more of the foreign food which they had laid by in Egypt, there flowed down from above food which was at the same time varied and uniform."},{"k":"s","p":0,"i":3,"a":8,"t":107.0,"x":"In appearance the food was uniform, but in quality it was varied, for it conformed itself to each person's desire."},{"k":"s","p":1,"i":0,"a":8,"t":119.0,"x":"What then do we learn here?"},{"k":"s","p":1,"i":1,"a":8,"t":121.0,"x":"We learn by what purifications one should purify himself of Egypt and the foreign life so that he empties the sack of his soul of all evil nourishment prepared by the Egyptians."},{"k":"s","p":1,"i":2,"a":8,"t":132.0,"x":"In this way he receives in himself with his pure soul the food which comes down from above, which was not produced for us by any sowing in cultivated soil."},{"k":"s","p":1,"i":3,"a":8,"t":142.0,"x":"Coming down from above, the bread is found upon the earth already prepared without the wheat's having been sown or ripened."},{"k":"s","p":2,"i":0,"a":8,"t":153.9,"x":"You no doubt perceive the true food in the figure of the history:"},{"k":"s","p":2,"i":1,"a":8,"t":159.4,"x":"The bread which came from heaven is not some incorporeal thing."},{"k":"s","p":2,"i":2,"a":8,"t":164.0,"x":"For how could something incorporeal be nourishment to a body?"},{"k":"s","p":2,"i":3,"a":8,"t":168.0,"x":"Neither ploughing nor sowing produced the body of this bread, but the earth which remained unchanged was found full of this divine food, of which the hungry partake."},{"k":"s","p":2,"i":4,"a":8,"t":178.0,"x":"This miracle teaches in anticipation the mystery of the Virgin."},{"k":"s","p":3,"i":0,"a":8,"t":184.0,"x":"This bread, then, that does not come from the earth is the Word."},{"k":"c","a":8,"t":189.0,"e":196.7,"l":[[189.0,"And the word here is with a capital W. So it's the word of God he's referring to."]]},{"k":"s","p":3,"i":1,"a":8,"t":195.0,"x":"He changes his power in diverse ways to suit those who eat."},{"k":"s","p":3,"i":2,"a":8,"t":199.0,"x":"He knows not only to be bread but also to become milk and meat and greens and whatever else might be appropriate to and desired by the one who receives him."},{"k":"s","p":3,"i":3,"a":8,"t":210.0,"x":"So teaches Paul the divine Apostle who spreads such a table as this for us—making his message strong meat for the more mature and greens for the weaker and milk for little children."},{"k":"c","a":8,"t":222.0,"e":304.0,"l":[[222.0,"I think in this particular case that is a very interesting parallel."],[227.0,"And you could say that when the little ones read the Gospel, they get the milk from it and it's enough for them to grow and then, you know, sort of as they progress."],[239.0,"And those who become more developed spiritually are able to partake of meat from the Gospel."],[249.0,"In other words, they're able to digest the more difficult and sort of things that are more difficult to chew."],[256.0,"Just like meat is harder than milk, obviously."],[259.0,"And so I think this is a very interesting comparison."],[262.0,"So he's saying manna had sort of a flavor and taste appropriate to each person's desire, whatever the people wanted it to be."],[271.0,"That's what sort of it reminded them of."],[273.0,"And in this particular case, yes, I think definitely the word of God, both as in the word of God, Christ, the word of God, and also actually the Holy Scripture, is to every person sort of have an appropriate taste and property for that person to partake and to be nourished."],[301.0,"Paragraph 141."]]},{"k":"s","p":4,"i":0,"a":8,"t":303.0,"x":"Whatever marvels the history ennumerates in connection with that food are teachings for the virtuous life."},{"k":"s","p":4,"i":1,"a":8,"t":308.0,"x":"For it says that everyone shared in the food equally."},{"k":"s","p":4,"i":2,"a":8,"t":311.0,"x":"The strength of those who gathered made no difference; they had neither more nor less than they needed."},{"k":"s","p":4,"i":3,"a":8,"t":317.0,"x":"This is, according to my view at least, advice generally applicable: that those making their living from material things should not exceed the bounds of need but should understand well that the one natural measure for all in eating is to eat as much as can be enjoyed in one day."},{"k":"s","p":5,"i":0,"a":8,"t":332.0,"x":"Even if much more were prepared than is needed, it is not in the stomach's nature to exceed its proper measure or to be stretched by the insatiate desire for what is prepared."},{"k":"s","p":5,"i":1,"a":8,"t":343.0,"x":"But, as the history says, neither did the one who took much have an abundance (for he had nowhere to store the excess) nor did he who took little lack any (for his requirements were lessened according to the amount which was found)."},{"k":"c","a":8,"t":353.7,"e":409.7,"l":[[353.7,"resisting."],[354.0,"Because we also know, for example, that if anyone tried to collect more manna, sort of so that he didn't have to work or collect the next day, it didn't stay, it perished."],[368.0,"It actually sort of, you know, there were worms, I think, found in it by, by next morning, by next day, six days a week, with the exception of the Sabbath."],[380.0,"So to me, that in itself is an interesting miracle."],[385.0,"You collected whatever you collected in one day."],[387.0,"You ate it, it was sufficient, and it was enough."],[390.0,"Sorry for the noise."],[392.0,"And then one day a week, you were actually able to collect extra for the Sabbath so that you didn't have to work on the Sabbath."],[404.0,"And it didn't perish."],[406.0,"It stayed."],[407.0,"So I think"]]},{"k":"s","p":6,"i":0,"a":8,"t":411.7,"x":"In this account Scripture after a fashion cries out to the covetous that the insatiable greed of those always hoarding surplus is turned into worms."},{"k":"s","p":6,"i":1,"a":8,"t":421.0,"x":"Everything beyond what they need encompassed by this covetous desire becomes on the next day—that is in the future life—a worm to the person who hoards it."},{"k":"s","p":6,"i":2,"a":8,"t":431.0,"x":"He who hears \"worm\" certainly perceives the undying worm which is made alive by covetousness."},{"k":"c","a":8,"t":437.1,"e":463.0,"l":[[437.1,"a covetousness."],[438.0,"So that's an interesting thought as well."],[439.0,"Basically, all the things that a person leaves behind, if they were in excess of what the person needs, well, you know, they will be eaten by worms in the life to come."],[450.0,"And also the person will probably suffer from."],[454.0,"From the worms in that life to come."],[458.0,"That's."],[458.0,"That's a very good thought."],[461.0,"Paragraph"]]},{"k":"s","p":7,"i":0,"a":8,"t":462.0,"x":"The fact that what is stored up continues to supply nourishment and experiences no corruption only on the Sabbath contains the following counsel:"},{"k":"s","p":7,"i":1,"a":8,"t":472.0,"x":"There is a time in the course of one's life when he must be grasping—at the time when what is gathered does not submit to corruption."},{"k":"s","p":7,"i":2,"a":8,"t":480.0,"x":"Then, when we pass beyond the preparation of this life and come to the rest after death, it will become useful to us."},{"k":"s","p":7,"i":3,"a":8,"t":488.0,"x":"The day before the Sabbath is named the Preparation for the Sabbath."},{"k":"s","p":7,"i":4,"a":8,"t":493.0,"x":"This day would be the present life in which we prepare for ourselves the things of the life to come."},{"k":"c","a":8,"t":497.8,"e":580.0,"l":[[497.8,"come."],[498.0,"Now, in this particular case, I could offer an example of the Father saying, make use of the time that you have now, because the time will come when you won't be able to do that which is necessary."],[515.0,"And that is, if you are young and healthy, labor with your body."],[521.0,"Now do the prostrations sort of fast more strictly perhaps, because a time will come when in your older age you will not be able to make prostrations because your knees will be weak or sore or, you know, sick."],[537.0,"And you won't be able to fast very well because your stomach may be weak and sick as well."],[542.0,"So you might need to have non fasting nourishment."],[546.0,"And at that time that which you have gathered earlier would."],[550.0,"Would come in quite handy, would be quite useful."],[553.0,"And that the Fathers referred even to this life."],[557.0,"Well, think of it?"],[558.0,"How much more in the life to come?"],[560.0,"If we collect enough virtue for the life to come now, here and now, then of course, it would definitely be very useful for us as we leave this earth, leave this temporal life, and go into the life eternal."],[578.0,"Paragraph"]]},{"k":"s","p":8,"i":0,"a":8,"t":580.0,"x":"In that life none of the things we engage in now are undertaken—neither agriculture, nor trade, nor military service, nor any of the other things pursued here."},{"k":"s","p":8,"i":1,"a":8,"t":589.5,"x":"But living in complete rest from such works, we acquire the fruits of the seeds which we now sow in life, some incorruptible, if the seeds of life be good, and some deadly and destructive, if the cultivation of this life produce such in us."},{"k":"s","p":8,"i":2,"a":8,"t":605.0,"x":"For he who sows in the field of the spirit, Scripture says, will get from it a harvest of eternal life, but he who sows in the field of self-indulgence willget a harvest of corruption out of it."},{"k":"c","a":8,"t":617.0,"e":752.4,"l":[[617.0,"So yes, indeed, in many cases."],[621.0,"And think of it this way, the field of athletics or study provide a perfect sort of allegory or an example of this, what we're talking about here, and what St. Gregory is saying in the athletics."],[637.0,"If an athlete knows that a competition is going to be held on a particular day, the athlete prepares for this competition."],[648.0,"He or she doesn't lie around and get fat, and so on and so on forth."],[653.0,"There is an intensive period of preparation, so that at the competition the athlete's body and mind really both are in peak performance, and that way the athlete can actually win a medal, or maybe more than one."],[671.0,"Similarly, a student, if he knows or she knows, that an exam is approaching, a proper student, a good student would prepare, would study for the exam in time, so that at the exam there's no, I don't know, you know, sort of there's no surprise."],[692.0,"And one is prepared, and in many other things in life as well."],[697.0,"If you know, for example, that you must pay your mortgage or your rent by a particular date, if it's debited from your account directly, while you make sure that the money is in the account, otherwise you're going to end up on the street if you don't pay, not maybe once, but if you if you do this on a regular basis."],[715.0,"So in a similar fashion, we must prepare for our departure from this life, we must make the necessary preparations, we must acquire the virtues, so that as we leave this world in which we can practice virtue, and we enter the world where virtue can no longer be practiced, but that which we have spoken stored up here will manifest itself there."],[741.0,"Well, then, obviously that could be detrimental to our well being in the life to come."],[750.0,"Paragraph 146"]]},{"k":"s","p":9,"i":0,"a":8,"t":750.9,"x":"The preparation for the better is alone properly called Preparation and is surely confirmed by the Law, and what is stored up during it is incorruptible."},{"k":"s","p":9,"i":1,"a":8,"t":762.0,"x":"That which is perceived as belonging to the opposite is neither Preparation nor is so called, for no one would reasonably call privation of good Preparation, but rather a lack of preparation."},{"k":"s","p":9,"i":2,"a":8,"t":774.0,"x":"Therefore, the history prescribes for men the Preparation for the better and leaves it to the intelligent to perceive the opposite by its omission."},{"k":"c","a":8,"t":785.0,"e":811.3,"l":[[785.0,"So basically, since there is nothing said about sort of the negative things, well, that is what is omitted."],[796.0,"The Scripture doesn't really give us that example in this particular case."],[800.0,"It only gives us the positive, the good example perhaps, maybe so that we're not distracted."],[806.0,"The next chapter the War with Amalek paragraph 147"]]}]},{"t":"The War with Amalek","p":[[147,"Just as in military conscription the commander of the army first supplies money and then gives the signal for battle, in the same way also the soldiers of virtue receive mystical money and move in battle against the enemy, being led into the conflict by Joshua, the successor of Moses."],[148,"Do you observe the sequence in which Scripture proceeds? As long as man is quite weak from maltreatment by wicked tyranny he does not ward off the enemy by himself, because he is not able. Someone else fights on behalf of the weak, battering the enemy with one blow after another. After he is set free from the bondage of his oppressors, is sweetened by the wood, is refreshed from his toil at the resting place among the palms, comes to know the mystery of the rock, and partakes of heavenly food, then he no longer wards off the enemy by another's hand. Now, since he has already outgrown the stature of a child and has laid hold of the vigor of youth, he fights with his opponents by himself, using as a general no longer Moses the servant of God, but God himself, whose servant Moses became. For the Law which from the beginning was given in type and shadow of things to come remains unfit for battle in the real conflicts. But the fulfiller of the Law and successor of Moses serves as general; he was announced beforehand by the name which he shared with that earlier general."],[149,"If the people saw the hands of their lawgiver lifted up, they prevailed over the enemy in battle; but if they saw them hanging limp, they fell back. Moses' holding his hands aloft signifies the contemplation of the Law with lofty insights; his letting them hang to earth signifies the mean and lowly literal exposition and observance of the Law."],[150,"The priest lifted the weary hands of Moses, using as a helper a member of his family. Nor is this outside the sequence of things contemplated. For the true priesthood, through the word of God joined with it, lifts high again the powers of the Law which fell to earth because of the heaviness of the Jewish understanding. The priesthood supports the falling Law at its base with a stone so that the Law, presenting a figure of outstretched hands, shows forth its own purpose to those who behold it."],[151,"For truly, to those who are able to see, the mystery of the cross is especially contemplated in the Law. Wherefore the Gospel says somewhere that not one dot, not one little stroke, shall disappear from the Law, signifying in these words the vertical and horizontal lines by which the form of the cross is drawn. That which was seen in Moses, who is perceived in the Law's place, is appointed as the cause and monument of victory to those who look at it."]],"id":"b2-14","r":[147,151],"w":484,"x":[{"k":"s","p":0,"i":0,"a":8,"t":809.7,"x":"Just as in military conscription the commander of the army first supplies money and then gives the signal for battle, in the same way also the soldiers of virtue receive mystical money and move in battle against the enemy, being led into the conflict by Joshua, the successor of Moses."},{"k":"s","p":1,"i":0,"a":8,"t":830.7,"x":"Do you observe the sequence in which Scripture proceeds?"},{"k":"s","p":1,"i":1,"a":8,"t":834.7,"x":"As long as man is quite weak from maltreatment by wicked tyranny he does not ward off the enemy by himself, because he is not able."},{"k":"s","p":1,"i":2,"a":8,"t":844.2,"x":"Someone else fights on behalf of the weak, battering the enemy with one blow after another."},{"k":"s","p":1,"i":3,"a":8,"t":850.0,"x":"After he is set free from the bondage of his oppressors, is sweetened by the wood, is refreshed from his toil at the resting place among the palms, comes to know the mystery of the rock, and partakes of heavenly food, then he no longer wards off the enemy by another's hand."},{"k":"s","p":1,"i":4,"a":8,"t":868.0,"x":"Now, since he has already outgrown the stature of a child and has laid hold of the vigor of youth, he fights with his opponents by himself, using as a general no longer Moses the servant of God, but God himself, whose servant Moses became."},{"k":"c","a":8,"t":884.1,"e":942.0,"l":[[884.1,"Now the reason here he says God himself."],[887.0,"Because in for example, in Church Slavonic Bible, the name Joshua is the same as Jesus."],[896.0,"It's Jesus, and I'm pretty sure probably the same holds true for Greek."],[903.0,"Somehow in English I think they wanted to make sort of a distinction."],[908.0,"However, those who are obviously aware of this realize that just as Joshua the son of nun, or you could say Jesus the son of nun, led the Israelites into the promised land, led them into battle with their enemies, so does Jesus the son of God, Christ himself lead those who are baptized in his name into the battle with the enemy and leads them to the victory and to the possession of the kingdom of heaven."],[940.0,"Now"]]},{"k":"s","p":1,"i":5,"a":8,"t":940.4,"x":"For the Law which from the beginning was given in type and shadow of things to come remains unfit for battle in the real conflicts."},{"k":"s","p":1,"i":6,"a":8,"t":950.0,"x":"But the fulfiller of the Law and successor of Moses serves as general; he was announced beforehand by the name which he shared with that earlier general."},{"k":"c","a":8,"t":958.9,"e":967.1,"l":[[958.9,"the earlier general."],[960.0,"So I guess he's talking about the Lord Jesus and Jesus the"]]},{"k":"s","p":2,"i":0,"a":8,"t":967.0,"x":"If the people saw the hands of their lawgiver lifted up, they prevailed over the enemy in battle; but if they saw them hanging limp, they fell back."},{"k":"s","p":2,"i":1,"a":8,"t":976.0,"x":"Moses' holding his hands aloft signifies the contemplation of the Law with lofty insights; his letting them hang to earth signifies the mean and lowly literal exposition and observance of the Law."},{"k":"c","a":8,"t":989.7,"e":1078.2,"l":[[989.7,"of the law."],[991.0,"So Jesus the son of Nun, was leading the soldiers into the battle, but Moses was on the mountain at that time."],[997.0,"And when he held his arms up, the Israelites were winning."],[1001.0,"But then when he lowered them, they were losing."],[1004.0,"And so here we're given that interesting comparison that when he lifts them up, that signifies the contemplation of the Law with lofty insides, but when he lowers them down, it means the literal exposition and observance of the law."],[1019.0,"So if we become Pharisaical in our approach to the Holy Scripture, then it's like Moses, arms that are just lowering down, and of course there will be no victory in that."],[1032.0,"Now, does that mean that we should never understand the literal teachings of the Law?"],[1037.0,"Of course not."],[1038.0,"Or of the Scripture?"],[1039.0,"If the Scripture tells us not to steal, well, that's not just some spiritual thing."],[1045.0,"And it's okay to steal materially?"],[1047.0,"Of course not."],[1048.0,"But we must understand it sort of beyond the literal meaning."],[1054.0,"And let's say, for example, it is good not to steal physically, and if it is also good not to steal spiritually, in other words, not to be covetous, not to be envious, or perhaps not to abuse someone, you know, and so on and so forth."],[1071.0,"So there is definitely sort of an interesting explanation of"]]},{"k":"s","p":3,"i":0,"a":8,"t":1079.0,"x":"The priest lifted the weary hands of Moses, using as a helper a member of his family."},{"k":"s","p":3,"i":1,"a":8,"t":1085.0,"x":"Nor is this outside the sequence of things contemplated."},{"k":"s","p":3,"i":2,"a":8,"t":1088.0,"x":"For the true priesthood, through the word of God joined with it, lifts high again the powers of the Law which fell to earth because of the heaviness of the Jewish understanding."},{"k":"s","p":3,"i":3,"a":8,"t":1100.0,"x":"The priesthood supports the falling Law at its base with a stone so that the Law, presenting a figure of outstretched hands, shows forth its own purpose to those who behold it."},{"k":"c","a":8,"t":1112.6,"e":1159.5,"l":[[1112.6,"now."],[1113.0,"So I think, yes, they were, they were the Levites, I guess that, you know, the priests that held up the arms of Moses."],[1119.0,"And I'm assuming Aaron was one of them, since he says, you know, the relative, sort of the."],[1126.0,"The brother of Moses held him up."],[1129.0,"And I'm not sure, do forgive me if I'm making a mistake in this."],[1132.0,"I read it fairly recently, but I, I may be forgetting, however, I think that in this particular case, well, the very fact that Moses raised his hands, it also signifies, you know, Christ who raised his hands upon the cross."],[1149.0,"And that's, you know, very significant for everyone who considers himself to be a Christian."],[1157.0,"Paragraph 151."]]},{"k":"s","p":4,"i":0,"a":8,"t":1158.0,"x":"For truly, to those who are able to see, the mystery of the cross is especially contemplated in the Law."},{"k":"s","p":4,"i":1,"a":8,"t":1164.0,"x":"Wherefore the Gospel says somewhere that not one dot, not one little stroke, shall disappear from the Law, signifying in these words the vertical and horizontal lines by which the form of the cross is drawn."},{"k":"s","p":4,"i":2,"a":8,"t":1179.0,"x":"That which was seen in Moses, who is perceived in the Law's place, is appointed as the cause and monument of victory to those who look at it."},{"k":"c","a":8,"t":1188.3,"e":1216.0,"l":[[1188.3,"at it."],[1189.0,"So just as Moses led the Israelites to victory by raising his arms, sort of, you know, holding his hands up, so does Christ, by stretching his hands on the cross, lead all those who follow him, who believe in him, to victory over sin and over death."],[1207.0,"The next paragraph, the mountain of divine knowledge."],[1211.0,"Sorry, in the next chapter, not paragraph,"]]}]},{"t":"The Mountain of Divine Knowledge","p":[[152,"Again the Scripture leads our understanding upward to the higher levels of virtue. For the man who received strength from the food and showed his power in fighting with his enemies and was the victor over his opponents is then led to the ineffable knowledge of God. Scripture teaches us by these things the nature and the number of things one must accomplish in life before he would at some time dare to approach in his understanding the mountain of the knowledge of God, to hear the sound of the trumpets, to enter into the darkness where God is, to inscribe the tablets with divine characters, and, if these should be broken through some offense, again to present the hand-cut tables to God and to carve with the divine finger the letters which were damaged on the first tables."],[153,"It would be better next, in keeping with the order of the history, to harmonize what is perceived with the spiritual sense. Whoever looks to Moses and the cloud, both of whom are guides to those who progress in virtue (Moses in this place would be the legal precepts, and the cloud which leads, the proper understanding of the Law), who has been purified by crossing the water, who has put the foreigner to death and separated himself from the foreigner, who has tasted the waters of Marah (that is, the life removed far from pleasures) which although appearing bitter and unpleasant at first to those tasting it offers a sweet sensation to those accepting the wood, who has then delighted in the beauties of the palm trees and springs (which were those who preached the Gospel, who were filled with the living water which is the rock), who received the heavenly bread, who has played the man against the foreigners, and for whom the outstretched hands of the lawgiver became the cause of victory foreshadowing the mystery of the cross, he it is who then advances to the contemplation of the transcendent nature."],[154,"His way to such knowledge is purity, not only purity of a body sprinkled by some lustral vessels but also of the clothes washed from every stain with water. This means that the one person who would approach the contemplation of Being must be pure in all things so as to be pure in soul and body, washed stainless of every spot in both parts, in order that he might appear pure to the One who sees what is hidden and that visible respectability might correspond to the inward condition of the soul."],[155,"For this reason the garments are washed at divine command before he ascends the mountain, the garments representing for us in a figure the outward respectability of life. No one would say that a visible spot on the garments hinders the progress of those ascending to God, but I think that the outward pursuits of life are well named the \"garment.\""],[156,"When this had been accomplished and the herd of irrational animals had been driven as far from the mountain as possible, Moses then approached the ascent to lofty perceptions. That none of the irrational animals was allowed to appear on the mountain signifies, in my opinion, that in the contemplation of the intelligibles we surpass the knowledge which originates with the senses. For it is characteristic of the nature of irrational animals that they are governed by the senses alone divorced from understanding. Their sight and hearing often lead them to what stimulates their appetites. Also, all other things through which sense perception becomes active assume an important place in irrational animals."],[157,"The contemplation of God is not effected by sight and hearing, nor is it comprehended by any of the customary perceptions of the mind. For no eye has seen, and no ear has heard, nor does it belong to those things which usually enter into the heart of man. He who would approach the knowledge of things sublime must first purify his manner of life from all sensual and irrational emotion. He must wash from his understanding every opinion derived from some preconception and withdraw himself from his customary intercourse with his own companion, that is, with his sense perceptions, which are, as it were, wedded to our nature as its companion. When he is so purified, then he assaults the mountain."],[158,"The knowledge of God is a mountain steep indeed and difficult to climb —the majority of people scarcely reach its base. If one were a Moses, he would ascend higher and hear the sound of trumpets which, as the text of the history says, becomes louder as one advances. For the preaching of the divine nature is truly a trumpet blast, which strikes the hearing, being already loud at the beginning but becoming yet louder at the end."],[159,"The Law and the Prophets trumpeted the divine mystery of the incarnation, but the first sounds were too weak to strike the disobedient ear. Therefore the Jews' deaf ears did not receive the sound of the trumpets. As the trumpets came closer, according to the text, they became louder. The last sounds, which came through the preaching of the Gospels, struck their ears, since the Spirit through his instruments sounds a noise more loudly ringing and makes a sound more vibrant in each succeeding spokesman. The instruments which ring out the Spirit's sound would be the Prophets and Apostles whose voice, as the Psalter says, goes out through all the earth: and their message to the ends of the world."],[160,"The multitude was not capable of hearing the voice from above but relied on Moses to learn by himself the secrets and to teach the people whatever doctrine he might learn through instruction from above. This is also true of the arrangement in the Church: Not all thrust themselves toward the apprehension of the mysteries, but, choosing from among themselves someone who is able to hear things divine, they give ear gratefully to him, considering trustworthy whatever they might hear from someone initiated into the divine mysteries."],[161,"It is said, Not all are apostles, nor all prophets, but this is not now heeded in many of the churches. For many, still in need of being purified from the way they have lived, unwashed and full of spots in their life's garment and protecting themselves only with their irrational senses, make an assault on the divine mountain. So it happens that they are stoned by their own reasonings, for heretical opinions are in effect stones which crush the inventor of evil doctrines."]],"id":"b2-15","r":[152,161],"w":1090,"x":[{"k":"s","p":0,"i":0,"a":8,"t":1215.5,"x":"Again the Scripture leads our understanding upward to the higher levels of virtue."},{"k":"s","p":0,"i":1,"a":8,"t":1222.0,"x":"For the man who received strength from the food and showed his power in fighting with his enemies and was the victor over his opponents is then led to the ineffable knowledge of God."},{"k":"s","p":0,"i":2,"a":8,"t":1232.0,"x":"Scripture teaches us by these things the nature and the number of things one must accomplish in life before he would at some time dare to approach in his understanding the mountain of the knowledge of God, to hear the sound of the trumpets, to enter into the darkness where God is, to inscribe the tablets with divine characters, and, if these should be broken through some offense, again to present the hand-cut tables to God and to carve with the divine finger the letters which were damaged on the first tables."},{"k":"c","a":8,"t":1265.0,"e":1400.5,"l":[[1265.0,"So in this particular case, now St. Gregory is speaking about Moses ascension on Mount Sinai, you know, where he goes up to the pinnacle of the mountain, spends there 40 days in darkness and in a cloud."],[1280.0,"And the Israelites who were."],[1285.0,"I'm not sure if."],[1287.0,"Yes, I believe that's the very same time who were saying you know, we also want to speak to God."],[1293.0,"Why is it that Moses alone is the one speaking to God?"],[1297.0,"Moses told them to prepare themselves, to pray, to fast for, you know, three days, I think."],[1302.0,"And when he went up the mountain, initially there was so much fire and smoke and."],[1310.0,"And noise, sort of thunder, that the Israelites cried out and said, no, no, no, no, no."],[1316.0,"Please don't let God speak to us, because we will surely die if he speaks to us."],[1321.0,"Let him speak to Moses."],[1322.0,"And Moses stayed on."],[1324.0,"On Mount Sinai and received the tablets of the Law."],[1327.0,"And now, because he stayed there for 40 days, when he came back down, the Israelites had forced Aaron to make for them a molten calf, you know, like a golden calf, sort of molten, you know, out of gold."],[1342.0,"And Moses was so upset that the people had turned away from God, who worked such great miracles for them, dividing the Red Sea, you know, punishing the Egyptians with 10 plagues and."],[1353.0,"And saving the Israelites and doing all the other things."],[1358.0,"Manna in paradise, sort of manna, you know, in the desert."],[1362.0,"Sweetened water turning from bitter into sweet water from the rock."],[1368.0,"And many other miracles, they still turned away from God."],[1372.0,"And Moses, in his wrath, he just threw the tablets upon which God with his finger had inscribed the law."],[1380.0,"The tablets broke."],[1382.0,"So then Moses ended up having to go up Mount Sinai one more time, take two more tablets with him."],[1388.0,"And then God inscribed two tablets to replace the ones that Moses broke."],[1392.0,"And that is what he is referring to in this Particular paragraph."],[1397.0,"Paragraph 153."]]},{"k":"s","p":1,"i":0,"a":8,"t":1400.0,"x":"It would be better next, in keeping with the order of the history, to harmonize what is perceived with the spiritual sense."},{"k":"s","p":1,"i":1,"a":8,"t":1407.0,"x":"Whoever looks to Moses and the cloud, both of whom are guides to those who progress in virtue (Moses in this place would be the legal precepts, and the cloud which leads, the proper understanding of the Law), who has been purified by crossing the water, who has put the foreigner to death and separated himself from the foreigner, who has tasted the waters of Marah (that is, the life removed far from pleasures) which although appearing bitter and unpleasant at first to those tasting it offers a sweet sensation to those accepting the wood, who has then delighted in the beauties of the palm trees and springs (which were those who preached the Gospel, who were filled with the living water which is the rock), who received the heavenly bread, who has played the man against the foreigners, and for whom the outstretched hands of the lawgiver became the cause of victory foreshadowing the mystery of the cross, he it is who then advances to the contemplation of the transcendent nature."},{"k":"c","a":8,"t":1475.0,"e":2014.5,"l":[[1475.0,"So he's saying here basically that one does not become a visionary of God."],[1483.0,"One does not contemplate God without going through the preliminary steps."],[1490.0,"And thus, I think it's something that's quite important for all the people who enter the church, maybe having certain hopes, you know, of tasting certain spiritual benefits and certain spiritual fruits."],[1506.0,"It would behoove everyone to realize that in order to contemplate God, to contemplate his mysteries, to sort of taste the spiritual fruit of a life of a believer, one has to go through many trials and tribulations and has to mature and grow."],[1528.0,"And only then does one sort of partake in this contemplation."],[1533.0,"If someone thinks that, well, you know, immediately after baptism I should be able to contemplate God, well, of course, that would be brazen and inappropriate."],[1542.0,"And if someone thinks that upon entering the church and being baptized, one has already attained unto all knowledge and can argue with a sort of."],[1552.0,"With the priests and can argue with even the saints and the teachings of the church, well, then one is quite frankly deluded."],[1560.0,"Because just as in any other aspect in life."],[1565.0,"Think of it this way,."],[1568.0,"When we."],[1569.0,"Call someone a skillful master, interestingly enough, in the Russian language, for example, skillful master is sort of similar and probably would be best translated as a tried master or even sort of tempted master."],[1586.0,"And in fact, sort of the very Russian word for art and culture, the word in Russian."],[1596.0,"And those who would speak Russian or know Russian would understand I'm speaking the word iskustra."],[1601.0,"Well, actually, a large portion of that word, the root of that word means testing, like temptation or test."],[1610.0,"So basically, you cannot be a skillful artist unless you've been tested enough times, unless you've made enough mistakes and you've learned from them."],[1620.0,"And to be quite honest with you, there is an iconographer who is fairly well known in the church abroad, and his later icons are spectacular, and they're truly like masterpieces of art."],[1639.0,"But those who know can go to a particular church in the church abroad and see some of the very first icons of this iconographer."],[1648.0,"And they."],[1649.0,"They look okay, but they definitely do not look the same."],[1653.0,"They don't have the same finesse."],[1656.0,"They don't have the same sort of quality that the much later works do."],[1663.0,"In a similar way, you might say a young woman who becomes, you know, sort of a homekeeper who gets married and who starts cooking for herself, herself and for her new husband is not as skilled."],[1677.0,"Let's Say, as her mother, who's been married and maybe cooking for 20, 30, in some cases 40 years."],[1685.0,"Just that experience can actually mean so much more."],[1689.0,"And I know that the young people sometimes are, if not discouraged, but perhaps maybe sort of put off by the statement of these facts."],[1703.0,"However, there is nothing that can be done with that."],[1708.0,"Such is the course of life."],[1711.0,"Such are the laws of both material life and spiritual life."],[1716.0,"If you plant an apple tree, let's just say, if you plant it, especially if you planted."],[1724.0,"Let's just say you try to grow a tree from a seed, not from sort of a sapling, well, you can't expect to have fruit from it for several years."],[1732.0,"And in fact, sort of the more years it will have, probably the more fruit you will have, because it will grow and sort of mature and become stronger, and the roots will have to go much deeper into the ground in order for it to."],[1745.0,"To draw the nourishment necessary to produce that sweet and juicy sweet of flavorful fruit."],[1754.0,"The tempering of steel, for example, is another sort of allegory."],[1760.0,"Well, you can't have a perfectly tempered steel without the process of the actual tempering, which means you have to heat it, then you have to cool it, maybe in oil or in water in various ways."],[1775.0,"So in some cases, we know that some steals take quite a bit of time to process, but you can't have them, you know, in five minutes."],[1785.0,"There's no such thing as instant greatness."],[1789.0,"And truly, there's no such thing as instant sanctity."],[1792.0,"There's no such thing as sort of instant spiritual perfection."],[1799.0,"Everything, everything that's valuable, everything that's sort."],[1808.0,"Of."],[1811.0,"Born of particular skill and art and, well, all of that requires a certain time for maturity."],[1822.0,"And even the fact that Moses was 80 years old by the time that he led the Israelites out of Egypt, just as we read before, well, obviously it took time."],[1832.0,"So in this particular case, yes, the Israelites, they."],[1836.0,"They saw the ten plagues of Egypt first."],[1840.0,"Then they saw the sea parted, they crossed the sea on."],[1845.0,"On dry land, literally was dry for them."],[1848.0,"And yet they saw the pharaoh's army get bogged down in the mire."],[1853.0,"Because all of a sudden, when the pharaoh and his army entered the same separation in the Red Sea, the bottom of the sea was no longer dry."],[1862.0,"It was muddy and mucky."],[1864.0,"And so the chariots, the horses, the soldiers, the pharaoh and his generals got stuck."],[1870.0,"And then the water covered them."],[1872.0,"Then they went through many, many, many other things."],[1876.0,"And of course, that ought to teach us not to be Impatient not to be lacking courage."],[1884.0,"We can't expect to sort of be baptized."],[1888.0,"And then within a week, if we're speaking of adults, especially, you know, if you're baptized as an infant in your childhood, obviously initially, you still have to make a conscious commitment to the life of the church as a young adult."],[1903.0,"And even then, you're going to spend some time within the church."],[1907.0,"You're going to have to go through your own trials and tribulations, tribulations, to become sort of the one who contemplates God, the one who is able to contemplate God."],[1917.0,"We know, for example, that St. Anthony of Egypt, who was, you know, the father, the founder of Christian monasticism."],[1926.0,"First, after leaving this world, he lived for many years with an elder."],[1931.0,"So he had a teacher, someone who tested him, who tried him, who prepared him."],[1937.0,"And even when he began to live by himself, when he no longer required an earthly teacher, you know, when sort of he was mature enough, he still went through the various trials and tribulations, and the demons came and physically beat him up and tormented him and tried to scare him and try to frighten him and drive him away from the desert."],[1957.0,"So he had to go through all those trials and tribulations before he reached the level of sanctity, where he was able to see not only sort of the outward appearance of the person, but to see the person's soul, to see the various intricate things about the individual, to see what he's done, to see the things that the person will do, and also to be able to just lay a hand on a person and say, it is not I, Anthony, but it is the Lord Jesus Christ who heals you and healed just with the touch of his hand."],[1989.0,"Yes, he did all that, but he didn't do that sort of the day after he became a monastic."],[1994.0,"It took quite a few years for him to get to that point."],[1999.0,"And that's exactly what St. Gregory describes for the entire natio
