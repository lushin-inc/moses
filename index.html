r small and we put a very big coal into it and we overfill it, if we then attempt to sense Even sort of the icon of Christ or to offer incense to God, coals may spill out and cause tremendous damage."],[2795.0,"And I think that is exactly what St. Gregory is talking about when he says we must realize that not everyone is fit to enter the holy of Holies."],[2804.0,"However, that doesn't mean it doesn't exist."],[2807.0,"The holy of holies is there, and only sort of singular individuals enter it."],[2814.0,"Now, think of it."],[2815.0,"In the nation of Israel, only the great high priest and only once a year was allowed to enter the holy of holies."],[2823.0,"In our day and age, there are saints what I'm."],[2827.0,"Which I'm, you know, who I'm sure are sort of granted the spiritual access, and they're able to enter in and to intercede on our behalf."],[2836.0,"Some of these saints have been manifest and glorified by the Church, and others are yet unknown to us."],[2843.0,"However, they are not doing it in the sight of all men so as not to sort of bring everybody in with them into this holy of holies."],[2853.0,"And that is something that I think should really stay with us in a very healthy and proper way in the true Church."],[2863.0,"In the Orthodox Church, we are all called to be the royal priesthood for sure."],[2869.0,"However, not every single one of us is ordained to the priesthood."],[2876.0,"There are various limitations, there are various reasons for selection of those who are ordained."],[2884.0,"But those who are not ordained, those who are or perhaps do not even meet the qualifications for various reasons, should not be dismayed."],[2894.0,"They can fulfill the royal priesthood by offering to God the sacrifice of praise, the sacrifice of a broken heart, sort of the incense of their prayer."],[2903.0,"Even at home or wherever they may pray in the Church, they participate in the priesthood that way."],[2909.0,"However, during the Divine Liturgy, only the ordained priests are the ones who are offering the bloodless sacrifice on our behalf and on behalf of the entire Church."],[2921.0,"And of course, fewer priests than laity, even fewer bishops, and even fewer, you know, patriarchs we have."],[2932.0,"So basically, the higher we go, the fewer the number."],[2936.0,"And that should not dismay us, that should not dishearten us."],[2940.0,"We must press on, we must pray, we must keep the faith."],[2944.0,"And God willing, maybe in a spiritual way, we can sort of one day, at least at the end of our, you know, sort of life, enter the holy of holies and hear the Lord's word, well done, thou good and faithful servant."],[2961.0,"And if we know our state, if we humbly sort of keep to our place, then indeed we may be granted the inheritance of the heavenly tabernacle and the heavenly holy of holies."],[2977.0,"And in this case, I will back up my words with the Lord's parable of the publican and the Pharisee."],[2984.0,"The Pharisee stood in the middle of the church, closer to the Holy of holies, so to speak."],[2989.0,"And the publican stood at the very entrance."],[2991.0,"He stood at the very back, basically hid himself in the chest and said, God, be merciful to me, a sinner."],[2997.0,"And he was the one that walked away justified."],[3000.0,"So I dare say, if we do not press arrogantly into that which does not pertain to us, which does not belong to us, we stand more chances to be justified and forgiven by God for our offenses and shortcomings."],[3018.0,"It is truly me to bless thee that thou art, O Ko Serve a blessed and most blameless and mother of our God, more honorable than the cherubim and beyond compare, more glorious than the seraphim, who without corruption gave as breath to God the Word, the very thought."],[3035.0,"Okasadir we magnify."],[3040.0,"God bless all of you."],[3042.0,"Many, many, many heartfelt thanks for your prayers, for your support and God willing, we will continue next week."],[3049.0,"All the best."]]}]},{"t":"The Priestly Vestments","p":[[189,"Having been instructed in these and other such things through the vision of the tabernacle, the eye of Moses' soul, purified and elevated through sights such as these, rises again to the height of other insights when he is instructed in the vestments of the priesthood. Among these are the tunic, the ephod, the breast-piece shining with varied rays from precious stones, the turban for the head and the metal-leaf upon it, the breeches, the pomegranates, the bells, then above all these the rational and the doctrine (and the truth discerned in both), and the shoulder-pieces tied together on both sides and fastened with the names of the patriarchs."],[190,"The very names for the clothing keep most folk from an accurate contemplation of their details. What sort of material garments would be called rational, doctrine, or truth? Indeed, these names clearly illustrate that it is not the perceptible clothing which is traced by the history but a certain adornment of the soul woven by virtuous pursuits."],[191,"The dye of the tunic is blue. Some of those who before us have contemplated the passage say that the dye signifies the air. I, for my part, cannot accurately affirm whether such a color as this has anything in common with the color of the air. Nevertheless, I do not reject it. The perception does lead to the contemplation of virtue, because it requires that he who would be a priest to God also bring his own body to the altar and become a sacrifice, not by being put to death, but by being a living sacrifice and rational service. He should not inflict upon his soul a heavy and fleshy garment of life, but by the purity of his life he should make all the pursuits of life as thin as the thread of a spider web."],[0,"Reweaving this bodily nature, we should be close to what rises upwards and is light and airy, in order that when we hear the last trumpet we may be found weightless and light in responding to the voice of the One who calls us. Then we shall be borne on high through the air to be together with the Lord, not drawn down to earth by anything heavy. He who, in keeping with the counsel of the Psalmist, has like a moth eaten away his soul, has put on that airy tunic which extends from his head to his feet, for the Law does not want virtue to be cut short."],[192,"The golden bells alternating with the pomegranates represent the brilliance of good works. They are the two pursuits through which virtue is acquired, namely, faith toward the divine and conscience toward life. The great Paul adds these pomegranates and bells to Timothy's garment, saying that he should have faith and a good conscience. So let faith sound forth pure and loud in the preaching of the holy Trinity and let life imitate the nature of the pomegranate's fruit."],[193,"Because it is covered with a hard and sour rind, its outside is inedible, but the inside is a pleasant sight with its many neatly ordered seeds and it becomes even sweeter when it is tasted. The philosophical life, although outwardly austere and unpleasant, is yet full of good hopes when it ripens. For when our Gardener opens the pomegranate of life at the proper time and manifests the hidden beauty, then those who partake of their own fruit will enjoy the sweetness. For somewhere the divine Apostle says that any punishment is most painful at the time, and far from pleasant (that is the first contact with the pomegranate): but later, in those on whom it has been used, it bears fruit in peace and goodness. This is the sweetness of the nourishment inside."],[194,"The Scripture commands that this tunic be tasseled. The tassels of the tunic are round pendants which serve no other purpose than decoration alone. We learn from this that virtue should not be measured only by what is required, and that we should discover something extra by our own endeavor, in order that some further adornment might be added to the garment. Thus it was with Paul, who joined his own beautiful tassels to the commandments. For whereas the Law commands that the ministers serving in the Temple get their food from the Temple and those who preach the Gospel should get their living from the Gospel, paul offers the Gospel without charge, being himself in hunger, and thirst, and naked. These are the beautiful tassels which adorn the tunic of the commandments by being added to it."],[195,"Above the long tunic were worn two pieces of cloth which reached from the shoulders down the chest and down the back and were joined to one another by a clasp on each shoulder. The clasps were stones with the names of six patriarchs engraved on each. The cloths were woven of many colors: violet was woven with purple, and scarlet was mixed with linen. Gold thread was interspersed through all this so that from the mixture of the various colors resulted a single radiant beauty."],[196,"From this we learn that the upper part of the outer garment, which is in a particular way an adornment of the heart, is composed of many varied virtues. Now the violet is interwoven with purple, for kingliness is joined to purity of life. Scarlet is mixed with linen because the bright and pure quality of life in some way mingles with the redness of modesty. The gold which lends radiance to these colors foreshadows the treasure reserved for such a life. The patriarchs engraved on the shoulders make a great contribution to our adornment, for men's lives are adorned by the earlier examples of good men."],[197,"Furthermore, there is another adornment worn on top of these beautiful cloths. Little shield-like ornaments of gold hung down from each of the shoulder pieces and held a four-cornered object of gold further brightened by twelve stones arranged in rows. There were four rows, each containing three stones. No two of them were alike, but each was beautified by its own particular radiance."],[198,"That was the outward appearance of the ornament, and this is its meaning: The shield-like ornaments hanging down from both shoulders symbolize the two-fold nature of our armor against the Adversary. Therefore, as I said a short time ago, since the life of virtue is lived in a two-fold way—by faith and a good conscience in life—we are made safe with respect to both by the shields' protection. We remain unwounded by the enemy's darts, by being armed with the weapons of righteousness in the right hand and in the left."],[199,"That four-cornered ornament which hung down from both of the shield-like ornaments and which had on it stones inscribed with the patriarchal names of the tribes protects the heart. Scripture instructs us in this figure that he who repels the evil archer with these two shields will adorn his own soul with all the virtues of the patriarchs, for each stone shines with its own brilliance on the cloth of virtue. Let the four-cornered shape be a demonstration to you of steadfastness in the good. Such a shape is hard to move, since it is supported equally by the corners at each side."],[200,"The straps by which these adornments are tied to the arms seem to me to provide a teaching for the higher life, namely that practical philosophy should be joined to contemplative philosophy. So the heart becomes the symbol of contemplation, and the arms, of works."],[201,"The head adorned with the diadem signifies the crown reserved for those who have lived well. It is beautified by an inscription of ineffable letters in gold leaf. Whoever has put on such adornment wears no sandals so he will not be encumbered in his race and hindered by the covering of dead skins (which accords with the understanding obtained in our contemplation concerning the mount). How then is the sandal going to be an adornment for the foot when it is cast off at the first initiation as being an impediment to the ascent?"]],"id":"b2-19","r":[189,201],"w":1357,"x":[{"k":"c","a":10,"t":2.0,"e":63.0,"l":[[2.0,"In the name of the Father and of the Son and of the Holy Spirit."],[4.0,"Amen."],[4.0,"Dear friends, welcome back to our weekly readings from the Holy Fathers. Let us sing a prayer and we will resume."],[14.0,"O heavenly King, call for the Spirit of truth, who art everywhere present and fillest all things. Treasury of good things and giver of life, come and dwell in us and cleanse us of all impurity and save our souls. O good one."],[35.0,"We are continuing our reading of St. Gregory of Nyssa's explanation of the life of Moses and of course I hope that you do. I certainly find it very edifying and in some moments comforting, and then others inspiring and most definitely very, very useful. Today we're continuing with the chapter the priestly vestments, paragraph 189."]]},{"k":"s","p":0,"i":0,"a":10,"t":61.5,"x":"Having been instructed in these and other such things through the vision of the tabernacle, the eye of Moses' soul, purified and elevated through sights such as these, rises again to the height of other insights when he is instructed in the vestments of the priesthood."},{"k":"s","p":0,"i":1,"a":10,"t":88.9,"x":"Among these are the tunic, the ephod, the breast-piece shining with varied rays from precious stones, the turban for the head and the metal-leaf upon it, the breeches, the pomegranates, the bells, then above all these the rational and the doctrine (and the truth discerned in both), and the shoulder-pieces tied together on both sides and fastened with the names of the patriarchs."},{"k":"c","a":10,"t":102.6,"e":135.3,"l":[[102.6,"It's quite interesting."],[104.0,"The Russian word used is the CLO book, which is a similar sort of a hat that is worn by modern day monastics. They have a clue book with. With a veil. So like a black hat with a veil. The Greek CLO book is a little different. The Russian one sort of widens out a bit at the top. But basically, I don't know why they translated the head covering as a turban here anyway,"]]},{"k":"c","a":10,"t":151.2,"e":166.6,"l":[[151.2,"the patriarchs."],[152.0,"So here he basically just sort of goes through the various things that were told by God that Moses should prepare for Aaron and for the priests,"]]},{"k":"s","p":1,"i":0,"a":10,"t":166.1,"x":"The very names for the clothing keep most folk from an accurate contemplation of their details."},{"k":"s","p":1,"i":1,"a":10,"t":174.4,"x":"What sort of material garments would be called rational, doctrine, or truth?"},{"k":"s","p":1,"i":2,"a":10,"t":180.2,"x":"Indeed, these names clearly illustrate that it is not the perceptible clothing which is traced by the history but a certain adornment of the soul woven by virtuous pursuits."},{"k":"c","a":10,"t":194.3,"e":225.5,"l":[[194.3,"So he's basically saying here that when one contemplates the necessary clothing for the Old Testament priesthood. One should see the qualities of the soul, the adornment of a soul of a modern day Christian, you know, of a. Of a sort of a true believer in God. In the new grace and the grace in the New Testament, paragraph 191."]]},{"k":"s","p":2,"i":0,"a":10,"t":224.0,"x":"The dye of the tunic is blue."},{"k":"s","p":2,"i":1,"a":10,"t":226.5,"x":"Some of those who before us have contemplated the passage say that the dye signifies the air."},{"k":"s","p":2,"i":2,"a":10,"t":232.7,"x":"I, for my part, cannot accurately affirm whether such a color as this has anything in common with the color of the air."},{"k":"s","p":2,"i":3,"a":10,"t":240.9,"x":"Nevertheless, I do not reject it."},{"k":"s","p":2,"i":4,"a":10,"t":243.1,"x":"The perception does lead to the contemplation of virtue, because it requires that he who would be a priest to God also bring his own body to the altar and become a sacrifice, not by being put to death, but by being a living sacrifice and rational service."},{"k":"s","p":2,"i":5,"a":10,"t":260.4,"x":"He should not inflict upon his soul a heavy and fleshy garment of life, but by the purity of his life he should make all the pursuits of life as thin as the thread of a spider web."},{"k":"s","p":3,"i":0,"a":10,"t":275.6,"x":"Reweaving this bodily nature, we should be close to what rises upwards and is light and airy, in order that when we hear the last trumpet we may be found weightless and light in responding to the voice of the One who calls us."},{"k":"c","a":10,"t":289.8,"e":295.3,"l":[[289.8,"The One here of course, is capitalized because it refers to God."]]},{"k":"s","p":3,"i":1,"a":10,"t":293.6,"x":"Then we shall be borne on high through the air to be together with the Lord, not drawn down to earth by anything heavy."},{"k":"s","p":3,"i":2,"a":10,"t":301.3,"x":"He who, in keeping with the counsel of the Psalmist, has like a moth eaten away his soul, has put on that airy tunic which extends from his head to his feet, for the Law does not want virtue to be cut short."},{"k":"c","a":10,"t":315.0,"e":878.1,"l":[[315.0,"So basically he's saying, just as the Old Testament priest's tunic was to be of blue color and is supposed to go basically, you know, from the top to the very feet, you know, from the shoulders, from the neck to the very feet, so it covers the entire body. And because it's blue in color, he says, some people consider that to represent the air well, or just as air is light. And I think the Lord, when he speaks to. When he speaks to one of the teachers, I don't know what's happening with my memory. Last time I couldn't remember Elder Paisius of the Holy Mountain, and today I can't remember the person who spoke with the Lord. I mean, the name is just right at the tip of my tongue."],[366.0,"But the Nicodemus, of course, when the Lord speaks to Nicodemus he says that, you know, the Spirit, as the wind blows wherever he desires."],[378.0,"So."],[378.0,"So in this particular case, in order to be that living sacrifice to God, in order to be that royal priesthood, the Christian royal priesthood that offers a bodiless and rational service to God. Rational sacrifice, a living sacrifice. So he's saying the priest's blue tunic, which is the color of the air, sort of represents that light and weightless sort of property of the air. At least, you know, the air around us. Obviously we know that air has weight, a certain weight, but still. And in that sense, of course, yes, that we should be ready to ascend to God, just like the air is readily ascending up, sort of with a warmer temperature. So, you know, we, in imitation to the Old Testament priesthood, should be clothed in the garment of rejection of a worldly life and worldly cares."],[439.0,"Now, that, of course, does not mean that every person has to quit his job, you know, stop caring for his family and start thinking only of spiritual things. That would not be the right interpretation of this particular passage. But the proper interpretation, I think, would basically say that we must strive to be clothed in sort of for our soul to be clothed in a robe similar to the priestly robe in the sense that it's a spiritual yearning for God and readiness to offer our life as a bloodless sacrifice where we cut off our own will and certainly cut off any sort of the strain of sin. And so in that sense, we can be participants in the royal priesthood. That's not to say that every single person is equal to an actual ordained priest. That is not what St. Gregory saying."],[502.0,"That's not what I'm saying. But I think when St. Peter says, you are a holy nation, royal priesthood to the Christians, when he says that, what he is describing here is that the life of virtue, the actual acquisition of virtue, is an offering to God. And just as Abraham and I often speak to our students in the school, in our parish school and say, well, did Abraham sacrifice his son to God or did he not? And I'm quite satisfied with the fact that the majority of children say, well, he did, because even though the angel stopped him, just as he raised his hand with a knife ready to sacrifice Isaac, the intent was there. The intent was present."],[553.0,"He believed that God would either raise him from the dead or work some other miracle and that Isaac would remain with him, but he was willing to do this. And so when we are willing to offer our life to God, that doesn't mean that we have to die physically. However, we must die to sin. And in every way and live unto God. That is what St. Paul teaches us. That is what the Church teaches us. And of course, doing that, we can offer to God as a sacrifice not all of our aspirations, not all of our desires. Obviously, that would make for a very strange situation where we would want nothing and care for nothing. It is normal for us to want to have some measure of success in life."],[606.0,"It is normal for us to want some measure of happiness and love in our lives, of course. But often enough, the very people that we love, and it doesn't even have to be in marriage, necessarily, even our family that is given to us by God, our parents and our siblings, we can offer our own will as a sacrifice time and again. When we sort of put them first, when we yield to them, when we choose to put them first in matters that are not contrary to the gospel and contrary to the teachings of the church. And when we are willing to limit ourselves this way, we gain a certain understanding of ourselves. We certainly learn about our strengths and our weaknesses, and we continue to offer this sacrifice to God."],[667.0,"We."],[670.0,"Offer a sacrifice to God when we pray, when we thank God, because it's not easy. And I don't really know of anyone who tells me that every morning he can't wait to get up just to pray. The majority of people get up and then they have so many distractions and various other things that come up that prevent them from praying the way that they know they should, the way that they want to pray. So in that sense, praying properly in the morning becomes a sacrifice to God because we have to prioritize prayers over other things. And the same in the evening. There are so many things that come up. And, you know, naturally, if were to leave it to sort of a spontaneous flow of things, most likely we won't even pray. But actually making that effort, well, that's a sacrifice to God."],[728.0,"What is another living sacrifice to God? When someone offends us, and rather than taking revenge, or perhaps in our own mind, you know, if it's not a situation where we could say something hurtful back, but when we say something hurtful in our minds, or we respond, or we sort of even want to curse the person or swear or wish them ill, if we stop and we say a prayer for our offender, that is a sacrifice to God. And there are many, many other examples like that. In fact, all of them also fall into another category, the category where the Lord says, enter through the narrow gate. You know, don't go in the broad way, sort of don't go the easy way. Well, good things in life require an effort, and every sacrifice to God is an effort."],[789.0,"If we just were to sort of drop our hands and let things go, well, you know, our lives would become a wreck. We all know that we must work, we must study, we must get up every day, we must hold our tongue when our superiors perhaps maybe unjustly criticize us or do things that we may not like, because if we say something back, it could negatively reflect upon us. So we all know how to do these things for the sake of success, for the sake of keeping a job and earning a living and so on. Well, there's plenty that we can do also for the sake of God and for the sake of his love and for the sake of being true Christians, true orthodox Christians. And that is tremendously important. And I think that can sort of be seen in."],[841.0,"In the comparison of the blue priestly tunic to the air, sort of the detachment of all earthly cares. And whatever is light, whatever is ready to fly up, is light and easy. And of course, a life that is full of sin and full of terrible sort of sinful habits would not be seen as light. It would actually be considered to be fleshly and so on. And I think those are sort of the comparisons that he makes. Along the color of the tunic."]]},{"k":"s","p":4,"i":0,"a":10,"t":876.5,"x":"The golden bells alternating with the pomegranates represent the brilliance of good works."},{"k":"s","p":4,"i":1,"a":10,"t":881.8,"x":"They are the two pursuits through which virtue is acquired, namely, faith toward the divine and conscience toward life."},{"k":"s","p":4,"i":2,"a":10,"t":891.3,"x":"The great Paul adds these pomegranates and bells to Timothy's garment, saying that he should have faith and a good conscience."},{"k":"s","p":4,"i":3,"a":10,"t":900.0,"x":"So let faith sound forth pure and loud in the preaching of the holy Trinity and let life imitate the nature of the pomegranate's fruit."},{"k":"s","p":5,"i":0,"a":10,"t":913.5,"x":"Because it is covered with a hard and sour rind, its outside is inedible, but the inside is a pleasant sight with its many neatly ordered seeds and it becomes even sweeter when it is tasted."},{"k":"s","p":5,"i":1,"a":10,"t":927.8,"x":"The philosophical life, although outwardly austere and unpleasant, is yet full of good hopes when it ripens."},{"k":"s","p":5,"i":2,"a":10,"t":938.5,"x":"For when our Gardener opens the pomegranate of life at the proper time and manifests the hidden beauty, then those who partake of their own fruit will enjoy the sweetness."},{"k":"s","p":5,"i":3,"a":10,"t":950.5,"x":"For somewhere the divine Apostle says that any punishment is most painful at the time, and far from pleasant (that is the first contact with the pomegranate): but later, in those on whom it has been used, it bears fruit in peace and goodness."},{"k":"s","p":5,"i":4,"a":10,"t":969.2,"x":"This is the sweetness of the nourishment inside."},{"k":"c","a":10,"t":972.8,"e":1169.9,"l":[[972.8,"So he's talking about the pomegranates that were part, I guess, the metal pomegranates that were attached to the priestly robes. And he's using the appearance of the fruit both outside and inside as an allegory for spiritual life. Outwardly, and you could say that about the saints. Outwardly, the saints appeared sometimes very austere and harsh and perhaps sort of unapproachable even, sometimes and uninteresting. But inwardly they were like the fruit of the pomegranate, full of neatly ordered seeds with sweet tasting juice."],[1011.0,"One story that comes to mind is one of the great saints who healed a woman who was sick with cancer, who was told by her friends that if she came to see him, he would heal her. And the way that you would say that he behaved as a pomegranate is when she actually saw him in the desert, when she came sort of far out to see him, he looked at her and he was doing some labor outside of his cell. He looked at her and marveled. You know, that woman alone walked that far out into the desert from the city because he was living in a rather sort of abandoned place and very much in solitude and said, what are you looking for here? And she says, well, I'm looking for this person. He says, why?"],[1058.0,"Well, because I'm sick and the doctors didn't help me, and my friends told me that he would heal me. So he says to the woman, oh, this person that you're looking, he's a babbler and an old fool, you know, you don't need to see him. Go back home and pray to God and God will heal you. So as she walked back, she realizes that she's healed. The lump in her breast is gone. And if you stop and you think about it for a moment, healed her of cancer. Of course, God healed by his prayers. But still, it's no small miracle for a woman to be completely free from breast cancer. A lump which she felt before seeing the saint and which was gone after."],[1099.0,"And so when her friends who recommended him asked her, and they said, well, did you see, you know, Father, so and so. And she said, no, I didn't. I saw this monk who told me that this acquaintance of yours, this so and so is an old babbler and a fool. And the monk that I did see told me to pray to God and that God would heal Me and, you know, hallelujah, Praise be to God, I am healed. So her friends said, well, what did he look like? And when she described him, they smiled and said, that was him. That was the man that we sent you to see. So outwardly he appeared to her like a pomegranate with a hard shell. He didn't cordially invite her to talk to him, to pray with him, to, you know, share a meal with him."],[1146.0,"He called himself a babbler and a fool and told her that God would heal her. And of course, God did heal her by his prayers, but inwardly, obviously, he was full of that sort of healing juice. And as she left, she did receive the healing that she so desired. And she looked for paragraph 194."]]},{"k":"s","p":6,"i":0,"a":10,"t":1168.3,"x":"The Scripture commands that this tunic be tasseled."},{"k":"s","p":6,"i":1,"a":10,"t":1171.4,"x":"The tassels of the tunic are round pendants which serve no other purpose than decoration alone."},{"k":"s","p":6,"i":2,"a":10,"t":1177.7,"x":"We learn from this that virtue should not be measured only by what is required, and that we should discover something extra by our own endeavor, in order that some further adornment might be added to the garment."},{"k":"s","p":6,"i":3,"a":10,"t":1192.5,"x":"Thus it was with Paul, who joined his own beautiful tassels to the commandments."},{"k":"s","p":6,"i":4,"a":10,"t":1198.0,"x":"For whereas the Law commands that the ministers serving in the Temple get their food from the Temple and those who preach the Gospel should get their living from the Gospel, paul offers the Gospel without charge, being himself in hunger, and thirst, and naked."},{"k":"s","p":6,"i":5,"a":10,"t":1214.7,"x":"These are the beautiful tassels which adorn the tunic of the commandments by being added to it."},{"k":"c","a":10,"t":1221.2,"e":1317.9,"l":[[1221.2,"Well, I think that another beautiful parallel of this understanding of that text and sort of that portion about the tassels could be said about what the Lord says by saying, when they ask you for your coat, give them your cloak also and go the extra mile. When they ask you for a mile, sort of walk an extra one. So that we don't follow the law just by the letter, but we actually do a bit. A bit extra."],[1252.0,"And if you think about it, this is the quality that was exhibited by Joseph the betrothed. He obviously also had sort of tremendous tassels on his tunic, the tunic of his righteousness. Because when he found out that the mother of God was pregnant, and at the time he didn't know that it was the overshadowing of the Holy Spirit, he thought she might have committed sin. And whereas by law he could have easily had her stoned and just, you know, for an extramarital affair, yet he intended to put her away quietly, it says in the Scripture. So basically he wanted to spare her life. And in this we see that is probably the very reason why God chose him to be his foster father, his sort of adopted father on earth. Because he was that pious, he went beyond the requirements of the law."],[1310.0,"And that is what St. Gregory sort of describes. The tassels of the priestly tunic as paragraph"]]},{"k":"s","p":7,"i":0,"a":10,"t":1316.3,"x":"Above the long tunic were worn two pieces of cloth which reached from the shoulders down the chest and down the back and were joined to one another by a clasp on each shoulder."},{"k":"s","p":7,"i":1,"a":10,"t":1329.3,"x":"The clasps were stones with the names of six patriarchs engraved on each."},{"k":"s","p":7,"i":2,"a":10,"t":1334.1,"x":"The cloths were woven of many colors: violet was woven with purple, and scarlet was mixed with linen."},{"k":"s","p":7,"i":3,"a":10,"t":1340.7,"x":"Gold thread was interspersed through all this so that from the mixture of the various colors resulted a single radiant beauty."},{"k":"s","p":8,"i":0,"a":10,"t":1349.3,"x":"From this we learn that the upper part of the outer garment, which is in a particular way an adornment of the heart, is composed of many varied virtues."},{"k":"s","p":8,"i":1,"a":10,"t":1360.0,"x":"Now the violet is interwoven with purple, for kingliness is joined to purity of life."},{"k":"s","p":8,"i":2,"a":10,"t":1365.9,"x":"Scarlet is mixed with linen because the bright and pure quality of life in some way mingles with the redness of modesty."},{"k":"s","p":8,"i":3,"a":10,"t":1374.6,"x":"The gold which lends radiance to these colors foreshadows the treasure reserved for such a life."},{"k":"s","p":8,"i":4,"a":10,"t":1381.0,"x":"The patriarchs engraved on the shoulders make a great contribution to our adornment, for men's lives are adorned by the earlier examples of good men."},{"k":"c","a":10,"t":1388.9,"e":1463.4,"l":[[1388.9,"early examples of good men. Well, you might say that in this particular case, since it's a multicolored part of the priestly vestment. So basically you'd say that a Christian should be adorned by multiple virtues, not just by one. You know, you can't sort of neglect all the other virtues and say, well, but I only do this one thing."],[1413.0,"I mean, there are examples where that actually worked in particular for a monk who never judged anyone. He was sort of taken straight to heaven after his repose, to the great surprise of his fellow monks, because they considered him to be rather lax and sort of not very zealous. However, I think, as a cautionary tale for the rest of us, that should not give us a license to say, well, you know, I'll choose one virtue and I'll practice that, but the rest of them, you know, who cares? Obviously, that's not the case. The priestly vestments were of multiple colors in that particular portion. And of course, that signifies"]]},{"k":"s","p":9,"i":0,"a":10,"t":1464.0,"x":"Furthermore, there is another adornment worn on top of these beautiful cloths."},{"k":"s","p":9,"i":1,"a":10,"t":1472.7,"x":"Little shield-like ornaments of gold hung down from each of the shoulder pieces and held a four-cornered object of gold further brightened by twelve stones arranged in rows."},{"k":"s","p":9,"i":2,"a":10,"t":1484.1,"x":"There were four rows, each containing three stones."},{"k":"s","p":9,"i":3,"a":10,"t":1487.1,"x":"No two of them were alike, but each was beautified by its own particular radiance."},{"k":"c","a":10,"t":1490.5,"e":1503.2,"l":[[1490.5,"beautiful in its own particular radius. So there's also sort of like a breastplate, you might say, of 12 stones. Well, the 12 tribes of Israel, the 12 patriarchs."]]},{"k":"s","p":10,"i":0,"a":10,"t":1503.8,"x":"That was the outward appearance of the ornament, and this is its meaning:"},{"k":"s","p":10,"i":1,"a":10,"t":1509.2,"x":"The shield-like ornaments hanging down from both shoulders symbolize the two-fold nature of our armor against the Adversary."},{"k":"s","p":10,"i":2,"a":10,"t":1516.0,"x":"Therefore, as I said a short time ago, since the life of virtue is lived in a two-fold way—by faith and a good conscience in life—we are made safe with respect to both by the shields' protection."},{"k":"s","p":10,"i":3,"a":10,"t":1529.2,"x":"We remain unwounded by the enemy's darts, by being armed with the weapons of righteousness in the right hand and in the left."},{"k":"s","p":11,"i":0,"a":10,"t":1543.9,"x":"That four-cornered ornament which hung down from both of the shield-like ornaments and which had on it stones inscribed with the patriarchal names of the tribes protects the heart."},{"k":"s","p":11,"i":1,"a":10,"t":1555.6,"x":"Scripture instructs us in this figure that he who repels the evil archer with these two shields will adorn his own soul with all the virtues of the patriarchs, for each stone shines with its own brilliance on the cloth of virtue."},{"k":"s","p":11,"i":2,"a":10,"t":1572.7,"x":"Let the four-cornered shape be a demonstration to you of steadfastness in the good."},{"k":"s","p":11,"i":3,"a":10,"t":1578.2,"x":"Such a shape is hard to move, since it is supported equally by the corners at each side."},{"k":"s","p":12,"i":0,"a":10,"t":1586.0,"x":"The straps by which these adornments are tied to the arms seem to me to provide a teaching for the higher life, namely that practical philosophy should be joined to contemplative philosophy."},{"k":"s","p":12,"i":1,"a":10,"t":1598.1,"x":"So the heart becomes the symbol of contemplation, and the arms, of works."},{"k":"c","a":10,"t":1602.9,"e":1640.1,"l":[[1602.9,"So in other words, you might say that this sort of parallels the words of St. James, the one who wrote the Epistle of James in the New Testament, where he says, you say you have faith, and I will show you my faith by my works, because faith without works is dead. So you say you have faith, but I have works which show you my faith. And this is what St. Gregory is saying, that, you know, you have both the shoulder plates and the breastplate, you know."],[1636.0,"And so on paragraph 201, the"]]},{"k":"s","p":13,"i":0,"a":10,"t":1638.5,"x":"The head adorned with the diadem signifies the crown reserved for those who have lived well."},{"k":"s","p":13,"i":1,"a":10,"t":1645.5,"x":"It is beautified by an inscription of ineffable letters in gold leaf."},{"k":"s","p":13,"i":2,"a":10,"t":1650.5,"x":"Whoever has put on such adornment wears no sandals so he will not be encumbered in his race and hindered by the covering of dead skins (which accords with the understanding obtained in our contemplation concerning the mount)."},{"k":"s","p":13,"i":3,"a":10,"t":1667.0,"x":"How then is the sandal going to be an adornment for the foot when it is cast off at the first initiation as being an impediment to the ascent?"},{"k":"c","a":10,"t":1681.5,"e":1721.7,"l":[[1681.5,"That's a question. So I guess what he's saying in this particular case, that then they were barefoot. Now, Moses was barefoot as well when he saw the burning bush. So. So maybe that's why."],[1696.0,"And of course, sandals, because they were made of dead skin. Well, he's saying, you know, you leave the dead skin behind in order to sort of be properly adorned for the service of God. The next chapter, the tables of stone. So these would be the two tablets, so to speak, that Moses had God inscribed the Ten Commandments on. Paragraph 2,"]]}]},{"t":"The Tables of Stone","p":[[202,"He who has progressed this far through the ascents which we have contemplated carries in his hand the tables, written by God, which contain the divine Law. But these are broken, crushed by the harsh opposition of sinners. Their sin was that they made for idolatrous worship an image in the shape of a calf. The whole image was pulverized by Moses and mixed with water, and drunk by those who had sinned so that the material which served the godlessness of men was completely destroyed."],[203,"The history prophetically proclaimed at that time the things which have now come to pass in our own time. The error of idolatry utterly disappeared from life, being swallowed by pious mouths, which through good confession bring about the destruction of the material of godlessness. The mysteries established of old by idolators became running water, completely liquid, a water swallowed by the very mouths of those who were at one time idol-mad. When you see those who formerly stooped under such vanity now destroying those things in which they had trusted, does the history then not seem to you to cry out clearly that every idol will then be swallowed by the mouths of those who have left error for true religion?"],[204,"Moses armed the Levites against their fellow countrymen. And crossing the camp from one end to the other, they killed without inquiry, their swords finding their own victims. Death came to everyone they met, without preference; no distinction was made between enemy and friend, stranger and neighbor, kinsman and foreigner. (There was one thrust of the hand equally for everyone.) With equal energy the same thrust of the hand ran through everyone they fell upon."],[205,"This account provides the following useful lesson: Because the Israelites in a body agreed to the evil and because the whole camp to a man participated in it, they were all without distinction scourged. It is like someone punishing a person caught in an evil act by whipping him. Whatever part of the body he may hit, he tears to shreds with the scourge, knowing that the pain inflicted on that part extends throughout the whole body. The same thing happens when the whole body united in evil is punished: The scourging inflicted on the part chastens the whole."],[206,"So if at any time someone observes the same evil in many, but the wrath of God is vented not against everyone but only against some, it is fitting that one perceive the correction as administered through love for mankind. While not all are struck, the blows upon some chastise all to turn them from evil."],[207,"This understanding still pertains to the literal account, but the spiritual meaning would profit us in the following manner. The Lawgiver says in a general proclamation to all: If any man be on the Lord's side let him join with me. This is the Law commanding all: \"If anyone wishes to be the friend of God, let him be a friend of me, the Law\" (for the friend of the Law is certainly a friend of God). And he commands those gathered to him by such a proclamation to use the sword against their brother, friend, and neighbor."],[208,"As we observe the sequence of the contemplation, we perceive that everyone who looks to God and the Law is purified by the death of his evil habits. For not everyone is named brother or friend or neighbor in a good sense by the Scripture. It is possible for one to be both brother and foreigner, both friend and enemy, both neighbor and opponent. These we perceive as our innermost thoughts, whose life brings about our death and whose death brings about our life."],[209,"Such an understanding agrees with our earlier investigation of Aaron, when in his meeting with Moses we perceived the angel as an ally and helper who cooperated in the signs against the Egyptians. He is rightly perceived as being older, since the angelic and incorporeal nature was created before our nature, but he is clearly a brother by virtue of the kinship of his intellectual nature to ours."],[210,"While, then, there is a contradiction (because how is it possible to take in a good sense Moses' meeting with Aaron who became the Israelites' servant in making an idol?), nevertheless Scripture, in a limited sense, gives an indication of the double meaning of brotherhood, that the same word does not always signify the same thing but may be taken with opposite meanings. In one case the person killing the Egyptian tyrant is the brother; in another, it is the one molding the idol for the Israelites. Thus the same name is used in both instances."],[211,"Against such brothers, then, Moses bares the sword. For he very clearly lays down for himself the same requirement that he demands of others. One kills such a brother by destroying sin, for everyone who destroys some evil that the Adversary has contrived in him kills in himself that one who lives through sin."],[212,"The teaching on this matter may be more surely confirmed to us if we bring further details of the history to bear on this contemplation. It is said that at Aaron's command they took off their earrings, which provided the material for the idol. What shall we say about this? That Moses adorned the ears of the Israelites with an ornament for the ears, which is the Law, but the false brother through disobedience removes the ornament placed on their ears and makes an idol with it."],[213,"At the first entrance of sin the advice to disobey the commandment removed the earrings. The serpent was regarded as a friend and neighbor by the first mortals when he advised them that it would be useful and beneficial to them if they transgressed the divine commandment, that is, if they removed from their ears the earring of the commandment. Therefore, he who kills such brothers and friends and neighbors will hear from the Law that statement which the history says Moses spoke to those who killed them: Today you have won yourselves investiture as priests of Yahweh at the cost, one of his son, another of his brother; and so he grants you a blessing today."],[214,"I think it is time to call attention to those who gave themselves over to sin. Thus we may learn how the tables inscribed by God with the divine Law, which fell from Moses' hands to the ground and were broken by the impact, were restored again by Moses. The tables were not wholly the same, only the writing on them was the same. Having made the tables out of earthly matter, Moses submitted them to the power of the One who would engrave his Law upon them. In this way, while he carried the Law in letters of stone, he restored grace inasmuch as God himself had impressed the words on the stone."],[215,"For perhaps it is possible, as we are led by these events, to come to some perception of the divine concern for us. For if the divine Apostle speaks the truth when he calls the tables \"hearts,\" that is, the foremost part of the soul (and certainly he who by the Spirit... reaches... the depths of God does speak the truth), then it is possible to learn from this that human nature at its beginning was unbroken and immortal. Since human nature was fashioned by the divine hands and beautified with the unwritten characters of the Law, the intention of the Law lay in our nature in turning us away from evil and in honoring the divine."],[216,"When the sound of sin struck our ears, that sound which the first book of Scripture calls the \"voice of the serpent,\" but the history concerning the tables calls the \"voice of drunken singing,\" the tables fell to the earth and were broken. But again the true Lawgiver, of whom Moses was a type, cut the tables of human nature for himself from our earth. It was not marriage which produced for him his \"God-receiving\" flesh, but he became the stonecutter of his own flesh, which was carved by the divine finger, for the Holy Spirit came upon the virgin and the power of the Most High overshadowed her. When this took place, our nature regained its unbroken character, becoming immortal through the letters written by his finger. The Holy Spirit is called \"finger\" in many places by Scripture."],[217,"Moses was transformed to such a degree of glory that the mortal eye could not behold him."],[0,"Certainly he who has been instructed in the divine mystery of our faith knows how the contemplation of the spiritual sense agrees with the literal account. For when the restorer of our broken nature (you no doubt perceive in him the one who healed our brokenness) had restored the broken table of our nature to its original beauty—doing this by the finger of God, as I said—the eyes of the unworthy could no longer behold him. In his surpassing glory he becomes inaccessible to these who would look upon him."],[218,"For in truth, as the Gospel says, when he shall come in his glory escorted by all the angels, he is scarcely bearable and visible to the righteous. He who is impious and follows the Judaizing heresy remains without a share in that vision, for let the impious be removed, as Isaiah says, and he shall not see the glory of the Lord."]],"id":"b2-20","r":[202,218],"w":1582,"x":[{"k":"s","p":0,"i":0,"a":10,"t":1720.1,"x":"He who has progressed this far through the ascents which we have contemplated carries in his hand the tables, written by God, which contain the divine Law."},{"k":"s","p":0,"i":1,"a":10,"t":1730.4,"x":"But these are broken, crushed by the harsh opposition of sinners."},{"k":"s","p":0,"i":2,"a":10,"t":1734.6,"x":"Their sin was that they made for idolatrous worship an image in the shape of a calf."},{"k":"s","p":0,"i":3,"a":10,"t":1741.1,"x":"The whole image was pulverized by Moses and mixed with water, and drunk by those who had sinned so that the material which served the godlessness of men was completely destroyed."},{"k":"c","a":10,"t":1753.0,"e":1805.2,"l":[[1753.0,"So now he's talking about the fact that the two tablets of the law that God had inscribed the Ten Commandments on the first two tablets. Moses, crushed in anger when he came down from the mountain and saw that the Israelites forced, you might say, and Aaron to make them a golden calf to be worshiped as God who brought them out of Egypt. Which of course, was definitely not the case. And interestingly enough, it says, yes, the whole image. So this calf was pulverized by Moses. He literally just grounded into dust all that gold mixed with water, and he forced the people who. Who made it to drink that water with that gold. Paragraph 2003."]]},{"k":"s","p":1,"i":0,"a":10,"t":1803.7,"x":"The history prophetically proclaimed at that time the things which have now come to pass in our own time."},{"k":"s","p":1,"i":1,"a":10,"t":1812.6,"x":"The error of idolatry utterly disappeared from life, being swallowed by pious mouths, which through good confession bring about the destruction of the material of godlessness."},{"k":"s","p":1,"i":2,"a":10,"t":1823.7,"x":"The mysteries established of old by idolators became running water, completely liquid, a water swallowed by the very mouths of those who were at one time idol-mad."},{"k":"s","p":1,"i":3,"a":10,"t":1834.9,"x":"When you see those who formerly stooped under such vanity now destroying those things in which they had trusted, does the history then not seem to you to cry out clearly that every idol will then be swallowed by the mouths of those who have left error for true religion?"},{"k":"c","a":10,"t":1855.1,"e":1870.4,"l":[[1855.1,"So I assume that in the time of St. Gregory, of course, the overwhelming majority of people did become Christians. And so and left sort of idolatry and no longer worshiped idols. Paragraph 204."]]},{"k":"s","p":2,"i":0,"a":10,"t":1868.8,"x":"Moses armed the Levites against their fellow countrymen."},{"k":"s","p":2,"i":1,"a":10,"t":1872.0,"x":"And crossing the camp from one end to the other, they killed without inquiry, their swords finding their own victims."},{"k":"s","p":2,"i":2,"a":10,"t":1879.5,"x":"Death came to everyone they met, without preference; no distinction was made between enemy and friend, stranger and neighbor, kinsman and foreigner."},{"k":"s","p":2,"i":3,"a":10,"t":1888.5,"x":"(There was one thrust of the hand equally for everyone.) With equal energy the same thrust of the hand ran through everyone they fell upon."},{"k":"c","a":10,"t":1897.9,"e":1924.0,"l":[[1897.9,"So this is the description of the punishment of that I sort of idolatrous act, the fact that they made the golden calf. Then Moses armed the Levites and told them to go through the camp, and they cut down everyone in their path. And so a certain portion of the people was put to death as a punishment for the golden calf. Paragraph 205."]]},{"k":"s","p":3,"i":0,"a":10,"t":1922.4,"x":"This account provides the following useful lesson:"},{"k":"s","p":3,"i":1,"a":10,"t":1925.0,"x":"Because the Israelites in a body agreed to the evil and because the whole camp to a man participated in it, they were all without distinction scourged."},{"k":"s","p":3,"i":2,"a":10,"t":1935.6,"x":"It is like someone punishing a person caught in an evil act by whipping him."},{"k":"s","p":3,"i":3,"a":10,"t":1941.3,"x":"Whatever part of the body he may hit, he tears to shreds with the scourge, knowing that the pain inflicted on that part extends throughout the whole body."},{"k":"s","p":3,"i":4,"a":10,"t":1951.9,"x":"The same thing happens when the whole body united in evil is punished:"},{"k":"s","p":3,"i":5,"a":10,"t":1956.8,"x":"The scourging inflicted on the part chastens the whole."},{"k":"c","a":10,"t":1960.2,"e":1991.2,"l":[[1960.2,"The whole. So basically the entire nation of Israel was not wiped out, but because the Levites cut down whomever they sort of met, that was punishment for the whole nation. Because I guess you'd say that most likely every household had someone cut down this way."],[1978.0,"And of course that was that would have been truly a great source of sorrow, so to speak. And you know pain from this punishment? Paragraph 206."]]},{"k":"s","p":4,"i":0,"a":10,"t":1989.6,"x":"So if at any time someone observes the same evil in many, but the wrath of God is vented not against everyone but only against some, it is fitting that one perceive the correction as administered through love for mankind."},{"k":"s","p":4,"i":1,"a":10,"t":2006.8,"x":"While not all are struck, the blows upon some chastise all to turn them from evil."},{"k":"c","a":10,"t":2014.2,"e":2042.0,"l":[[2014.2,"So yes, in some cases you might say everybody is sinning, and then the plague may come upon the people. But not everyone will die. And of course God only knows who should die and who should live. And those who live will most likely correct their ways, seeing that others have died because of their sort of mutual sins."],[2040.0,"207"]]},{"k":"s","p":5,"i":0,"a":10,"t":2040.3,"x":"This understanding still pertains to the literal account, but the spiritual meaning would profit us in the following manner."},{"k":"s","p":5,"i":1,"a":10,"t":2046.9,"x":"The Lawgiver says in a general proclamation to all:"},{"k":"s","p":5,"i":2,"a":10,"t":2049.9,"x":"If any man be on the Lord's side let him join with me."},{"k":"s","p":5,"i":3,"a":10,"t":2054.4,"x":"This is the Law commanding all:"},{"k":"s","p":5,"i":4,"a":10,"t":2056.4,"x":"\"If anyone wishes to be the friend of God, let him be a friend of me, the Law\" (for the friend of the Law is certainly a friend of God)."},{"k":"s","p":5,"i":5,"a":10,"t":2066.7,"x":"And he commands those gathered to him by such a proclamation to use the sword against their brother, friend, and neighbor."},{"k":"s","p":6,"i":0,"a":10,"t":2074.6,"x":"As we observe the sequence of the contemplation, we perceive that everyone who looks to God and the Law is purified by the death of his evil habits."},{"k":"s","p":6,"i":1,"a":10,"t":2084.2,"x":"For not everyone is named brother or friend or neighbor in a good sense by the Scripture."},{"k":"s","p":6,"i":2,"a":10,"t":2090.2,"x":"It is possible for one to be both brother and foreigner, both friend and enemy, both neighbor and opponent."},{"k":"s","p":6,"i":3,"a":10,"t":2099.3,"x":"These we perceive as our innermost thoughts, whose life brings about our death and whose death brings about our life."},{"k":"c","a":10,"t":2107.5,"e":2196.4,"l":[[2107.5,"So yes, if we have evil thoughts, we should definitely cut them off and put them to death, because if they bear fruit, they will bring us to death. They will sort of make us die. So that would definitely be something to keep in mind in this particular case. And of course, as we turn closer to God and we draw nearer to God in our efforts to purify our life, we ourselves put to death all not only evil thoughts, but sort of all evil actions, evil habits, all the evil in our life."],[2147.0,"Methodically we must put to death, because otherwise if we leave it alone, it will grow on its own and come to sort of antagonize us and encumber us and prevent us from living a life that is pleasing. Pleasing to God, which is what we want to do and of course in some cases can sort of utterly sort of undo us and undermine us if they sort of take the upper hand. So in that sense, I think spiritually perhaps maybe is a better sort of for a modern person, is a better way to look at this. You know that just as the Levites cut down a certain amount of people in Israel, well, so should we cut down all the evil in our lives."],[2194.0,"Paragraph 209"]]},{"k":"s","p":7,"i":0,"a":10,"t":2194.8,"x":"Such an understanding agrees with our earlier investigation of Aaron, when in his meeting with Moses we perceived the angel as an ally and helper who cooperated in the signs against the Egyptians."},{"k":"s","p":7,"i":1,"a":10,"t":2207.7,"x":"He is rightly perceived as being older, since the angelic and incorporeal nature was created before our nature, but he is clearly a brother by virtue of the kinship of his intellectual nature to ours."},{"k":"c","a":10,"t":2221.0,"e":2242.2,"l":[[2221.0,"So here he's just talking about the relationship between Moses and Aaron and the fact that Aaron in this whole account can be seen sort of as one's guardian angel. Because if. If were to represent Moses spiritually, then our guardian angel would be like Aaron to Moses. Paragraph 210."]]},{"k":"s","p":8,"i":0,"a":10,"t":2240.6,"x":"While, then, there is a contradiction (because how is it possible to take in a good sense Moses' meeting with Aaron who became the Israelites' servant in making an idol?), nevertheless Scripture, in a limited sense, gives an indication of the double meaning of brotherhood, that the same word does not always signify the same thing but may be taken with opposite meanings."},{"k":"s","p":8,"i":1,"a":10,"t":2265.7,"x":"In one case the person killing the Egyptian tyrant is the brother; in another, it is the one molding the idol for the Israelites."},{"k":"s","p":8,"i":2,"a":10,"t":2275.4,"x":"Thus the same name is used in both instances."},{"k":"s","p":9,"i":0,"a":10,"t":2279.9,"x":"Against such brothers, then, Moses bares the sword."},{"k":"s","p":9,"i":1,"a":10,"t":2283.1,"x":"For he very clearly lays down for himself the same requirement that he demands of others."},{"k":"s","p":9,"i":2,"a":10,"t":2289.6,"x":"One kills such a brother by destroying sin, for everyone who destroys some evil that the Adversary has contrived in him kills in himself that one who lives through sin."},{"k":"c","a":10,"t":2301.7,"e":2316.7,"l":[[2301.7,"So I guess he's saying by putting to death that part of us which is inclined toward evil."],[2309.0,"It's akin to the Levites killing their brothers in that particular massacre. Paragraph 212. The teaching"]]},{"k":"s","p":10,"i":0,"a":10,"t":2315.1,"x":"The teaching on this matter may be more surely confirmed to us if we bring further details of the history to bear on this contemplation."},{"k":"s","p":10,"i":1,"a":10,"t":2324.6,"x":"It is said that at Aaron's command they took off their earrings, which provided the material for the idol."},{"k":"s","p":10,"i":2,"a":10,"t":2331.8,"x":"What shall we say about this?"},{"k":"s","p":10,"i":3,"a":10,"t":2334.1,"x":"That Moses adorned the ears of the Israelites with an ornament for the ears, which is the Law, but the false brother through disobedience removes the ornament placed on their ears and makes an idol with it."},{"k":"c","a":10,"t":2348.1,"e":2411.6,"l":[[2348.1,"I can't remember for certain."],[2350.0,"It's possible that recently I read it and in Saint Ephraim the Syrian, maybe on in his commentary sort of on these events, where he basically says, unless St. Gregory mentioned this earlier, and now he's just sort of relating another in another way. But somewhere I read recently that you could see that Aaron was hoping against hope that maybe at least greed would stop them, and so he told them to bring their golden earrings to make this idol. But they. But they did provide the earrings. It didn't stop them. So you could say that perhaps, maybe we could see that Aaron wasn't a very willing participant in this sort of evil, that he was trying to maybe find a way to at least delay it. But the people did not want any delays. 213."]]},{"k":"s","p":11,"i":0,"a":10,"t":2410.0,"x":"At the first entrance of sin the advice to disobey the commandment removed the earrings."},{"k":"s","p":11,"i":1,"a":10,"t":2415.2,"x":"The serpent was regarded as a friend and neighbor by the first mortals when he advised them that it would be useful and beneficial to them if they transgressed the divine commandment, that is, if they removed from their ears the earring of the commandment."},{"k":"s","p":11,"i":2,"a":10,"t":2431.0,"x":"Therefore, he who kills such brothers and friends and neighbors will hear from the Law that statement which the history says Moses spoke to those who killed them:"},{"k":"s","p":11,"i":3,"a":10,"t":2440.7,"x":"Today you have won yourselves investiture as priests of Yahweh at the cost, one of his son, another of his brother; and so he grants you a blessing today."},{"k":"c","a":10,"t":2451.0,"e":2477.7,"l":[[2451.0,"So he's saying to them that they want for themselves the Levites, the tribe of Levi, they want for themselves the priesthood at the cost of, you know, the various relatives that they cut down. And of course we should consider this nowadays, especially nowadays only in the spiritual sense, that we must cut down our sort of wrong and evil and inclinations and fight evil within ourselves. Paragraph 214."]]},{"k":"s","p":12,"i":0,"a":10,"t":2476.1,"x":"I think it is time to call attention to those who gave themselves over to sin."},{"k":"s","p":12,"i":1,"a":10,"t":2481.8,"x":"Thus we may learn how the tables inscribed by God with the divine Law, which fell from Moses' hands to the ground and were broken by the impact, were restored again by Moses."},{"k":"s","p":12,"i":2,"a":10,"t":2493.6,"x":"The tables were not wholly the same, only the writing on them was the same."},{"k":"s","p":12,"i":3,"a":10,"t":2499.0,"x":"Having made the tables out of earthly matter, Moses submitted them to the power of the One who would engrave his Law upon them."},{"k":"s","p":12,"i":4,"a":10,"t":2507.8,"x":"In this way, while he carried the Law in letters of stone, he restored grace inasmuch as God himself had impressed the words on the stone."},{"k":"c","a":10,"t":2517.4,"e":2550.6,"l":[[2517.4,"So he's saying that Moses brought the tablets that were the tables up on Mount Sinai, and God with his finger inscribed the ten Commandments on them. And after Moses crushed them, he made new tablets, went back up on Sinai, and God once again engraved them for him. So you might say that our hearts of clay, you know, are earthly objects, but God can inscribe his commandments on them if we offer them to God the way that Moses did on Sinai. Paragraph 215."]]},{"k":"s","p":13,"i":0,"a":10,"t":2549.0,"x":"For perhaps it is possible, as we are led by these events, to come to some perception of the divine concern for us."},{"k":"s","p":13,"i":1,"a":10,"t":2556.9,"x":"For if the divine Apostle speaks the truth when he calls the tables \"hearts,\" that is, the foremost part of the soul (and certainly he who by the Spirit... reaches... the depths of God does speak the truth), then it is possible to learn from this that human nature at its beginning was unbroken and immortal."},{"k":"s","p":13,"i":2,"a":10,"t":2575.5,"x":"Since human nature was fashioned by the divine hands and beautified with the unwritten characters of the Law, the intention of the Law lay in our nature in turning us away from evil and in honoring the divine."},{"k":"s","p":14,"i":0,"a":10,"t":2590.2,"x":"When the sound of sin struck our ears, that sound which the first book of Scripture calls the \"voice of the serpent,\" but the history concerning the tables calls the \"voice of drunken singing,\" the tables fell to the earth and were broken."},{"k":"s","p":14,"i":1,"a":10,"t":2605.2,"x":"But again the true Lawgiver, of whom Moses was a type, cut the tables of human nature for himself from our earth."},{"k":"s","p":14,"i":2,"a":10,"t":2612.9,"x":"It was not marriage which produced for him his \"God-receiving\" flesh, but he became the stonecutter of his own flesh, which was carved by the divine finger, for the Holy Spirit came upon the virgin and the power of the Most High overshadowed her."},{"k":"s","p":14,"i":3,"a":10,"t":2630.1,"x":"When this took place, our nature regained its unbroken character, becoming immortal through the letters written by his finger."},{"k":"s","p":14,"i":4,"a":10,"t":2638.4,"x":"The Holy Spirit is called \"finger\" in many places by Scripture."},{"k":"c","a":10,"t":2643.0,"e":2668.7,"l":[[2643.0,"So that, I think is a very beautiful and powerful comparison here. That he's saying that the new tablets made by Moses in sort of the New Testament are sort of a. An image of Christ's flesh upon which you know, God, of course, you know, manifested as true law, the sort of the ultimate law. Paragraph 217."]]},{"k":"s","p":15,"i":0,"a":10,"t":2667.1,"x":"Moses was transformed to such a degree of glory that the mortal eye could not behold him."},{"k":"s","p":16,"i":0,"a":10,"t":2674.2,"x":"Certainly he who has been instructed in the divine mystery of our faith knows how the contemplation of the spiritual sense agrees with the literal account."},{"k":"s","p":16,"i":1,"a":10,"t":2685.0,"x":"For when the restorer of our broken nature (you no doubt perceive in him the one who healed our brokenness) had restored the broken table of our nature to its original beauty—doing this by the finger of God, as I said—the eyes of the unworthy could no longer behold him."},{"k":"s","p":16,"i":2,"a":10,"t":2703.9,"x":"In his surpassing glory he becomes inaccessible to these who would look upon him."},{"k":"c","a":10,"t":2709.0,"e":2737.6,"l":[[2709.0,"So now we know from the Old Testament that when Moses came down, the Israelites asked him to wear a veil over his face. Because his face, because of him contemplating God, was shining so brightly they were afraid to look upon him. But Christ, without any veil, sort of transfigured not only his face, but his entire body. His garments were transfigured. Before the disciples and they saw his glory. Paragraph 2 18."]]},{"k":"s","p":17,"i":0,"a":10,"t":2736.0,"x":"For in truth, as the Gospel says, when he shall come in his glory escorted by all the angels, he is scarcely bearable and visible to the righteous."},{"k":"s","p":17,"i":1,"a":10,"t":2746.1,"x":"He who is impious and follows the Judaizing heresy remains without a share in that vision, for let the impious be removed, as Isaiah says, and he shall not see the glory of the Lord."},{"k":"c","a":10,"t":2759.2,"e":2877.8,"l":[[2759.2,"Lord. We will. We'll stop here today and hopefully continue in a week's time with a chapter that's titled Eternal Progress. I think we're probably maybe in the middle of the book or let's just say maybe 2/3 through. So we will continue and hopefully learn more. I find this to be very inspiring and in many ways comforting."],[2782.0,"And of course also some of the images offered here, for example, thinking of Christ's flesh as the tablets that were used by Moses for the second time because the first tablets were broken and sort of the first tablets representing first Adam and of course, and Eve and then the second tablets representing Christ. That's a very beautiful and in a way, really a bit of a discovery for me. I hadn't thought of it that way. At any rate, thank you so much for joining. Please keep me in your prayers. Thank you so much for your support and let's pray and hopefully we will meet again next week."],[2826.0,"It is truly me to bless thee that thou art O. K so ever blessed and most blameless and mother of our God, more honorable than the cherubim and beyond compare, more glorious than the seraphim, who without corruption gave us birth to God the Word."],[2849.0,"Thank you so much for joining. God bless you. Please keep me in your prayers. Thank you for your support, spiritual and otherwise. And God willing, we'll see you next week. Hopefully. That would be. Let me just take a quick peek. Let's see, Today is the 21st, June 28th. I think we should be good and all would be well. God bless and have a wonderful evening."]]}]},{"t":"Eternal Progress","p":[[219,"While following these things in the sequence of our investigation, we were led to a deeper meaning in contemplating this passage. Let us return to the subject. How does someone who Scripture says saw God clearly in such divine appearances—face to face, as a man speaks with his friend — require that God appear to him, as though he who is always visible had not yet been seen, as though Moses had not yet attained what Scripture testifies he had indeed attained?"],[220,"The heavenly voice now grants the petitioner's request and does not deny this additional grace. Yet again He leads him to despair in that He affirms that what the petitioner seeks cannot be contained by human life. Still, God says there is a place with himself where there is a rock with a hole in it into which he commands Moses to enter. Then God placed his hand over the mouth of the hole and called out to Moses as he passed by. When Moses was summoned, he came out of the hole and saw the back of the One who called him. In this way he thought he saw what he was seeking, and the promise of the divine voice did not prove false."],[221,"If these things are looked at literally, not only will the understanding of those who seek God be dim, but their concept of him will also be inappropriate. Front and back pertain only to those things which are observed to have shape. Every shape provides the limits of a body. So then he who conceives of God in some shape will not realize that he is free of a bodily nature. It is a fact that every body is composite, and that what is composite exists by the joining of its different elements. No one would say that what is composite cannot be decomposed. And what decomposes cannot be incorruptible, for corruption is the decomposition of what is composite."],[222,"If therefore one should think of the back of God in a literal fashion, he will necessarily be carried to such an absurd conclusion. For front and back pertain to a shape, and shape pertains to a body. A body by its very nature can be decomposed, for everything composite is capable of dissolution. But what is being decomposed cannot be incorruptible; therefore, he who is bound to the letter would consequently conceive the Divine to be corruptible. But in fact God is incorruptible and incorporeal."],[223,"But what understanding other than the literal interpretation fits what is written? If this part of the written narrative compels us to seek out another understanding, it is certainly appropriate to understand the whole in the same way. Whatever we perceive in the part, we of necessity take as true for the whole, since every whole is made up of its parts. Wherefore the place with God, the rock at that place, the opening in it called a hole, Moses' entrance into it, the placing of the divine hand over its mouth, the passing by and the calling and after this the vision of the back—all this would more fittingly be contemplated in its spiritual sense."],[224,"What then is being signified? Bodies, once they have received the initial thrust downward, are driven downward by themselves with greater speed without any additional help as long as the surface on which they move is steadily sloping and no resistance to their downward thrust is encountered. Similarly, the soul moves in the opposite direction. Once it is released from its earthly attachment, it becomes light and swift for its movement upward, soaring from below up to the heights."],[225,"If nothing comes from above to hinder its upward thrust (for the nature of the Good attracts to itself those who look to it), the soul rises ever higher and will always make its flight yet higher—by its desire of the heavenly things straining ahead for what is still to come, as the Apostle says."],[226,"Made to desire and not to abandon the transcendent height by the things already attained, it makes its way upward without ceasing, ever through its prior accomplishments renewing its intensity for the flight. Activity directed toward virtue causes its capacity to grow through exertion; this kind of activity alone does not slacken its intensity by the effort, but increases it."],[227,"For this reason we also say that the great Moses, as he was becoming ever greater, at no time stopped in his ascent, nor did he set a limit for himself in his upward course. Once having set foot on the ladder which God set up (as Jacob says), he continually climbed to the step above and never ceased to rise higher, because he always found a step higher than the one he had attained."],[228,"He denied the specious kinship with the Egyptian queen. He avenged the Hebrew. He chose the desert way of life where there was no human being to disturb him. In himself he shepherded a flock of tame animals. He saw the brilliance of the light. Unencumbered, having taken off his sandals, he made his approach to the light. He brought his kinsmen and countrymen out to freedom. He saw the enemy drowning in the sea."],[229,"He made camps under the cloud. He quenched thirst with the rock. He produced bread from heaven. By stretching out his hands, he overcame the foreigner. He heard the trumpet. He entered the darkness. He slipped into the inner sanctuary of the tabernacle not made with hands. He learned the secrets of the divine priesthood. He destroyed the idol. He supplicated the divine Being. He restored the Law destroyed by the evil of the Jews."],[230,"He shone with glory. And although lifted up through such lofty experiences, he is still unsatisfied in his desire for more. He still thirsts for that with which he constantly filled himself to capacity, and he asks to attain as if he had never partaken, beseeching God to appear to him, not according to his capacity to partake, but according to God's true being."],[231,"Such an experience seems to me to belong to the soul which loves what is beautiful. Hope always draws the soul from the beauty which is seen to what is beyond, always kindles the desire for the hidden through what is constantly perceived. Therefore, the ardent lover of beauty, although receiving what is always visible as an image of what he desires, yet longs to be filled with the very stamp of the archetype."],[232,"And the bold request which goes up the mountains of desire asks this: to enjoy the Beauty not in mirrors and reflections, but face to face. The divine voice granted what was requested in what was denied, showing in a few words an immeasurable depth of thought. The munificence of God assented to the fulfillment of his desire, but did not promise any cessation or satiety of the desire."],[233,"He would not have shown himself to his servant if the sight were such as to bring the desire of the beholder to an end, since the true sight of God consists in this, that the one who looks up to God never ceases in that desire. For he says: You cannot see my face, for man cannot see me and live."],[234,"Scripture does not indicate that this causes the death of those who look, for how would the face of life ever be the cause of death to those who approach it? On the contrary, the Divine is by its nature lifegiving. Yet the characteristic of the divine nature is to transcend all characteristics. Therefore, he who thinks God is something to be known does not have life, because he has turned from true Being to what he considers by sense perception to have being."],[235,"True Being is true life. This Being is inaccessible to knowledge. If then the life-giving nature transcends knowledge, that which is perceived certainly is not life. It is not in the nature of what is not life to be the cause of life. Thus, what Moses yearned for is satisfied by the very things which leave his desire unsatisfied."],[236,"He learns from what was said that the Divine is by its very nature infinite, enclosed by no boundary. If the Divine is perceived as though bounded by something, one must by all means consider along with that boundary what is beyond it. For certainly that which is bounded leaves off at some point, as air provides the boundary for all that flies and water for all that live in it. Therefore, fish are surrounded on every side by water, and birds by air. The limits of the boundaries which circumscribe the birds or the fish are obvious: The water is the limit to what swims and the air to what flies. In the same way, God, if he is conceived as bounded, would necessarily be surrounded by something different in nature. It is only logical that what encompasses is much larger than what is contained."],[237,"Now it is agreed that the Divine is good in nature. But what is different in nature from the Good is surely something other than the Good. What is outside the Good is perceived to be evil in nature. But it was shown that what encompasses is much larger than what is encompassed. It most certainly follows, then, that those who think God is bounded conclude that he is enclosed by evil."],[238,"Since what is encompassed is certainly less than what encompasses, it would follow that the stronger prevails. Therefore, he who encloses the Divine by any boundary makes out that the Good is ruled over by its opposite. But that is out of the question. Therefore, no consideration will be given to anything enclosing infinite nature. It is not in the nature of what is unenclosed to be grasped. But every desire for the Good which is attracted to that ascent constantly expands as one progresses in pressing on to the Good."],[239,"This truly is the vision of God: never to be satisfied in the desire to see him. But one must always, by looking at what he can see, rekindle his desire to see more. Thus, no limit would interrupt growth in the ascent to God, since no limit to the Good can be found nor is the increasing of desire for the Good brought to an end because it is satisfied."],[240,"But what is that place which is seen next to God? What is the rock? And what again is the hole in the rock? What is the hand of God that covers the mouth of the rock? What is the passing by of God? What is his back which God promised to Moses when he asked to see him face to face?"],[241,"Naturally each of these things must be highly significant and worthy of the munificence of the divine Giver. Thus this promise is believed to be more magnificent and loftier than every theophany which had previously been granted to his great servant. How then would one, from what has been said, understand this height to which Moses desires to attain after such previous ascents and to which he who turns everything to their good cooperates with all those who love God makes the ascent easy through his leadership? Here is a place, he says, beside me."],[242,"The thought harmonizes readily with what has been contemplated before. In speaking of \"place\" he does not limit the place indicated by anything quantitative (for to something unquantitative there is no measure). On the contrary, by the use of the analogy of a measurable surface he leads the hearer to the unlimited and infinite. The text seems to signify some such understanding: \"Whereas, Moses, your desire for what is still to come has expanded and you have not reached satisfaction in your progress and whereas you do not see any limit to the Good, but your yearning always looks for more, the place with me is so great that the one running in it is never able to cease from his progress.\""],[243,"In another Scriptural passage the progress is a standing still, for it says, You must stand on the rock. This is the most marvelous thing of all: how the same thing is both a standing still and a moving."],[0,"For he who ascends certainly does not stand still, and he who stands still does not move upwards. But here the ascent takes place by means of the standing. I mean by this that the firmer and more immovable one remains in the Good, the more he progresses in the course of virtue. The man who in his reasonings is uncertain and liable to slip, since he has no firm grounding in the Good but is tossed one way and another and carried along (as the Apostle says) and is doubtful and wavers in his opinions concerning reality, would never attain to the height of virtue."],[244,"He is like those who toil endlessly as they climb uphill in sand: Even though they take long steps, their footing in the sand always slips downhill, so that, although there is much motion, no progress results from it. But if someone, as the Psalmist says, should pull his feet up from the mud of the pit and plant them upon the rock (the rock is Christ who is absolute virtue), then the more steadfas
