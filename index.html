n of Israel that followed Moses sort of out of Egypt and toward the promised land, paragraph 154."]]},{"k":"s","p":2,"i":0,"a":8,"t":2013.0,"x":"His way to such knowledge is purity, not only purity of a body sprinkled by some lustral vessels but also of the clothes washed from every stain with water."},{"k":"s","p":2,"i":1,"a":8,"t":2023.0,"x":"This means that the one person who would approach the contemplation of Being must be pure in all things so as to be pure in soul and body, washed stainless of every spot in both parts, in order that he might appear pure to the One who sees what is hidden and that visible respectability might correspond to the inward condition of the soul."},{"k":"c","a":8,"t":2027.1,"e":2032.7,"l":[[2027.1,"being here is a capital B."],[2029.0,"So obviously he's talking about God"]]},{"k":"c","a":8,"t":2036.0,"e":2070.2,"l":[[2036.0,"Well, exactly."],[2038.0,"Even when we approach the Holy Communion, we sort of must not only follow the material aspects, but."],[2046.0,"But we Also look at our own spiritual state."],[2049.0,"And for example, we must be at peace with everyone and forgive everyone who has offended us before we approach the chalice."],[2055.0,"Because otherwise, even though we have fulfilled all the physical requirements, said our prayers, fasted, and so on and so forth, if we don't have the contrition, if we don't have love for a fellow man, we would not be properly pure,"]]},{"k":"s","p":3,"i":0,"a":8,"t":2085.0,"x":"For this reason the garments are washed at divine command before he ascends the mountain, the garments representing for us in a figure the outward respectability of life."},{"k":"s","p":3,"i":1,"a":8,"t":2094.0,"x":"No one would say that a visible spot on the garments hinders the progress of those ascending to God, but I think that the outward pursuits of life are well named the \"garment.\""},{"k":"c","a":8,"t":2105.0,"e":2122.0,"l":[[2105.0,"So basically, if you pursue a life of sin, you are not pure."],[2109.0,"You must pursue, even outwardly pursue, that sort of kind of life, that sort of life that is pure."],[2116.0,"It's very well, very well put."],[2119.0,"Paragraph 156."]]},{"k":"s","p":4,"i":0,"a":8,"t":2121.0,"x":"When this had been accomplished and the herd of irrational animals had been driven as far from the mountain as possible, Moses then approached the ascent to lofty perceptions."},{"k":"c","a":8,"t":2128.3,"e":2142.7,"l":[[2128.3,"because remember, God also told the Israelites that the animals could not approach the mountain, and if any animal approached it, it should be stoned."],[2137.0,"So basically, they had to remove all of their animals as well away."]]},{"k":"s","p":4,"i":1,"a":8,"t":2145.0,"x":"That none of the irrational animals was allowed to appear on the mountain signifies, in my opinion, that in the contemplation of the intelligibles we surpass the knowledge which originates with the senses."},{"k":"s","p":4,"i":2,"a":8,"t":2158.0,"x":"For it is characteristic of the nature of irrational animals that they are governed by the senses alone divorced from understanding."},{"k":"s","p":4,"i":3,"a":8,"t":2165.2,"x":"Their sight and hearing often lead them to what stimulates their appetites."},{"k":"s","p":4,"i":4,"a":8,"t":2170.0,"x":"Also, all other things through which sense perception becomes active assume an important place in irrational animals."},{"k":"c","a":8,"t":2179.0,"e":2313.5,"l":[[2179.0,"So the removal of."],[2181.0,"Of the irrational animals from the mountain then, I guess, is sort of in my understanding."],[2190.0,"This mind, in this particular case is interpreted by St. Gregory as sort of removal of all irrational movements on the part of an individual."],[2203.0,"Quite beautifully, I think, in this regard."],[2208.0,"St. Andrew of Crete, in the canon of St. Andrew, the great canon that we read during Lent, he says that I have mortified my soul."],[2217.0,"I've put it to death by irrational sort of irrational movements, basically having sort of irrational desires."],[2229.0,"And what are irrational Movements and desires."],[2232.0,"Well, obviously gluttony, sexual impurity and sort of avarice and so on and so forth."],[2242.0,"Those would be sort of at the level of an irrational animal."],[2249.0,"Irrational animals eat and sort of procreate based on instinct."],[2256.0,"They don't make a decision to fast."],[2258.0,"They don't make a decision to abstain stain from food."],[2261.0,"That is something which is the property of rational beings."],[2265.0,"We people who are created in the image of God, are able to say, well, of course this is edible, but I will not eat it because I'm going to fast today."],[2275.0,"Or I like a particular person, but I will not have a sinful connection with this person."],[2280.0,"I will not have sort of a fornication or an adulterous relationship with a person, because I will stay pure, both for the sake of God and in the case of, you know, a married individual, for the sake of my spouse."],[2296.0,"I will keep fidelity pure and keep my marriage pure and undefiled."],[2302.0,"And that's something that is not present in irrational animals."],[2307.0,"And that's what St. Gregory is talking about here, paragraph 157."]]},{"k":"s","p":5,"i":0,"a":8,"t":2312.0,"x":"The contemplation of God is not effected by sight and hearing, nor is it comprehended by any of the customary perceptions of the mind."},{"k":"s","p":5,"i":1,"a":8,"t":2320.0,"x":"For no eye has seen, and no ear has heard, nor does it belong to those things which usually enter into the heart of man."},{"k":"s","p":5,"i":2,"a":8,"t":2327.0,"x":"He who would approach the knowledge of things sublime must first purify his manner of life from all sensual and irrational emotion."},{"k":"s","p":5,"i":3,"a":8,"t":2334.0,"x":"He must wash from his understanding every opinion derived from some preconception and withdraw himself from his customary intercourse with his own companion, that is, with his sense perceptions, which are, as it were, wedded to our nature as its companion."},{"k":"c","a":8,"t":2346.0,"e":2367.0,"l":[[2346.0,"because the Israelites were told sort of not to have relations with their wives, even lawful wives, for three days before they were going to speak with God or God would appear to them on the Mount Sinai."],[2365.0,"The"]]},{"k":"s","p":5,"i":4,"a":8,"t":2371.0,"x":"When he is so purified, then he assaults the mountain."},{"k":"c","a":8,"t":2376.0,"e":2516.0,"l":[[2376.0,"Interesting that it says assaults here."],[2378.0,"Perhaps."],[2378.0,"Maybe it means ascends or approaches the mountain."],[2381.0,"So basically, once all of our material, fleshly sort of bodily perceptions are quelled and rested and quieted, once our spirit fully becomes the master of the body, then we're able to contemplate God."],[2406.0,"But as long as the body rules the spirit, as long as the body sort of dominates the spirit, well, of course, then such contemplation would be impossible."],[2418.0,"That's not to say that the body is evil, not by any means or anything like that."],[2422.0,"I think in this particular case we're only talking about a proper order of things."],[2430.0,"The body should be a faithful servant of the soul."],[2434.0,"That is what Saint Seraphim of Sarov said."],[2436.0,"And I think that he was essentially sort of condensing the patristic teaching about the body and the soul."],[2443.0,"The soul without the body would ascend to God directly and the body would be then rendered dead because the soul would have separated from it."],[2453.0,"But together, while we are living on this earth, we are not trying to mortify the actual physical body."],[2460.0,"We're trying to mortify the passions of the body."],[2462.0,"And the mortification of the passions basically means that everything is in the divine order in the order that God intended when he first created Adam, before Adam had gotten sort of mixed up and hurt and damaged by sin that he committed together with Eve."],[2483.0,"In other words, the saints, we know they had bodies."],[2487.0,"They didn't become bodiless in order to be saints."],[2490.0,"And in the case of St. Anthony, whom I mentioned just a couple of moments ago, he."],[2497.0,"He would even heal someone using his body, because he would lay his hand on someone's head and pray for him."],[2504.0,"That is the perfect harmony where the body serves the soul."],[2507.0,"The body does that which sort of the soul requires and not the other way around."],[2513.0,"Paragraph 158."]]},{"k":"s","p":6,"i":0,"a":8,"t":2515.0,"x":"The knowledge of God is a mountain steep indeed and difficult to climb —the majority of people scarcely reach its base."},{"k":"s","p":6,"i":1,"a":8,"t":2522.0,"x":"If one were a Moses, he would ascend higher and hear the sound of trumpets which, as the text of the history says, becomes louder as one advances."},{"k":"c","a":8,"t":2532.0,"e":2539.5,"l":[[2532.0,"So, basically, as Moses was rising up Mount Sinai, the noise became louder."]]},{"k":"s","p":6,"i":2,"a":8,"t":2538.0,"x":"For the preaching of the divine nature is truly a trumpet blast, which strikes the hearing, being already loud at the beginning but becoming yet louder at the end."},{"k":"s","p":7,"i":0,"a":8,"t":2549.0,"x":"The Law and the Prophets trumpeted the divine mystery of the incarnation, but the first sounds were too weak to strike the disobedient ear."},{"k":"s","p":7,"i":1,"a":8,"t":2556.0,"x":"Therefore the Jews' deaf ears did not receive the sound of the trumpets."},{"k":"s","p":7,"i":2,"a":8,"t":2561.0,"x":"As the trumpets came closer, according to the text, they became louder."},{"k":"s","p":7,"i":3,"a":8,"t":2565.0,"x":"The last sounds, which came through the preaching of the Gospels, struck their ears, since the Spirit through his instruments sounds a noise more loudly ringing and makes a sound more vibrant in each succeeding spokesman."},{"k":"s","p":7,"i":4,"a":8,"t":2579.0,"x":"The instruments which ring out the Spirit's sound would be the Prophets and Apostles whose voice, as the Psalter says, goes out through all the earth: and their message to the ends of the world."},{"k":"s","p":8,"i":0,"a":8,"t":2591.0,"x":"The multitude was not capable of hearing the voice from above but relied on Moses to learn by himself the secrets and to teach the people whatever doctrine he might learn through instruction from above."},{"k":"s","p":8,"i":1,"a":8,"t":2602.0,"x":"This is also true of the arrangement in the Church:"},{"k":"s","p":8,"i":2,"a":8,"t":2605.0,"x":"Not all thrust themselves toward the apprehension of the mysteries, but, choosing from among themselves someone who is able to hear things divine, they give ear gratefully to him, considering trustworthy whatever they might hear from someone initiated into the divine mysteries."},{"k":"c","a":8,"t":2622.0,"e":2728.4,"l":[[2622.0,"Well, I think here this is beautifully displayed, played by St. Paul in one of his epistles, where he says, for God gave some to church as apostles, some as prophets, others as teachers, others as evangelists, others as healers, and so on."],[2638.0,"So not every person is capable."],[2640.0,"And in the orthodox church we have a clear understanding that it would be foolish and more or less impossible to expect every single individual to be to be likened to Moses, who talks to God directly and perfectly."],[2657.0,"There, for various reasons, there are those who are sort of closer to God, those sometimes whom we call elders, who are actually able to receive revelations from God, sometimes of personal nature and other times sort of a greater nature."],[2678.0,"And that is perfectly normal, because just as in the body, the whole body is comprised of many different organs, if the entire body was just one eye, where would the hearing be?"],[2690.0,"If it were only an ear, where would the side be?"],[2693.0,"And so on."],[2694.0,"And so in this particular case, yes, exactly."],[2697.0,"Moses was sort of like the eye of the nation of Israel that was able to."],[2704.0,"To see God."],[2705.0,"He was the ear who could hear him and the mouth who could speak his law."],[2711.0,"Yet Moses wasn't the one fighting directly in the battle."],[2714.0,"He was praying and blessing and sort of holding his arms."],[2718.0,"So because fighting is done by arms, not by eyes and ears anyway, hopefully that's an understandable thing."],[2726.0,"Paragraph 161,"]]},{"k":"s","p":9,"i":0,"a":8,"t":2726.8,"x":"It is said, Not all are apostles, nor all prophets, but this is not now heeded in many of the churches."},{"k":"c","a":8,"t":2728.7,"e":2735.8,"l":[[2728.7,"our apostles nor all prophets are."],[2731.0,"Well, quite interesting."],[2732.0,"If I had looked ahead, basically, I"]]},{"k":"s","p":9,"i":1,"a":8,"t":2740.0,"x":"For many, still in need of being purified from the way they have lived, unwashed and full of spots in their life's garment and protecting themselves only with their irrational senses, make an assault on the divine mountain."},{"k":"s","p":9,"i":2,"a":8,"t":2752.0,"x":"So it happens that they are stoned by their own reasonings, for heretical opinions are in effect stones which crush the inventor of evil doctrines."},{"k":"c","a":8,"t":2761.0,"e":3034.2,"l":[[2761.0,"So basically he's saying those who try to approach the divine mountain unprepared, unworthy and unpurified are then put to death and stoned and sort of come into a very sort of a."],[2782.0,"What is zain?"],[2783.0,"What is like sort of a bad end."],[2785.0,"You know, they."],[2785.0,"They come to a bad end."],[2787.0,"If you think of it, an interesting idea was later on in the history of the nation of Israel when the Ark of the Covenant was returned by the Philistines to the Israelites and it was returned on a, on a cart into which I think they put two cows or two heifers maybe."],[2810.0,"I'm not sure exactly what sort of the."],[2812.0,"The scripture says in there in that particular case, not a horse and not a donkey, I think, either."],[2817.0,"Like two cows, basically."],[2820.0,"As the Ark arrived in Israel, we are told at one point the car, the wheel of the cart sort of went into a."],[2831.0,"What would you call it, like a pothole in the road, so to speak."],[2835.0,"And a man walking nearby was afraid that the Ark of the Covenant would fall off the cart, so he reached his hand and held it up."],[2844.0,"And we know that the Ark was not to be touched even by the Levites."],[2849.0,"The Ark had rings on its sides, and the Levites put a rod through the rings, and that's how the Ark was transported."],[2857.0,"They didn't touch it."],[2858.0,"They."],[2858.0,"They sort of kept their distance."],[2861.0,"In a similar way, as, you know, we have certain holy objects that people don't touch."],[2867.0,"For example, you know, the laity aren't supposed to touch the chalice other than just kiss the edge of it."],[2873.0,"You know, after Holy Communion at any rate."],[2877.0,"Uzzah, the man's name was Uzzah, was known to David because David was very upset at his death."],[2884.0,"He reached out, he touched the Ark of the Covenant and died instantly."],[2889.0,"And so I think that in this particular case, St. Gregory is saying the same thing."],[2894.0,"Those who approach the mountain unprepared, sort of, they try to enter the contemplation of God unprepared before their time."],[2906.0,"They suffer terrible consequences and are stoned to death by their own sort of false beliefs that arise from that that may be actually heretical."],[2917.0,"So I think we should definitely be prudent and careful enough not to sort of make bold before our time."],[2929.0,"Should we strive for divine contemplation?"],[2931.0,"Yes, indeed, we should all press onward."],[2934.0,"But we also must understand and realize that in order for, for that to take place, we must be properly purified to begin with, God willing, for tonight we will stop and God willing, we should be able to continue next week."],[2949.0,"I don't know if there are going to be any services."],[2953.0,"I don't think so, although let me take a quick look and see."],[2957.0,"I, I do not think that we would be in any way."],[2962.0,"It's the 14th of June."],[2964.0,"I think everything should be fine and we hopefully will continue next Wednesday night."],[2970.0,"Please say a prayer for me."],[2971.0,"God bless all of you and I hope all everyone thank you for your support and thanks for being with us."],[2978.0,"It is truly me to bless thee that the Theotokos ever blessed and most blameless and Mother of our God more honorable than the cherubim and beyond compare more glorious than the Seraphim who without corruption gave us birth to God the Word the very thought Okasa did we magnify."],[2999.0,"Once again God bless you all."],[3001.0,"Thank you so much for your support for your prayers."],[3003.0,"If you want me to sort of answer any questions you can type them here in the direct chat."],[3011.0,"In the live chat, if you leave a comment under a video, hopefully I'd see it and I would also respond."],[3019.0,"You can also contact me directly."],[3021.0,"My phone number, my direct phone number is on our parish website."],[3024.0,"I'm serving at the Holy Trinity Church in Toronto for those who might not know."],[3029.0,"At any rate, God bless and have a wonderful day."]]}]},{"t":"The Darkness","p":[[162,"What does it mean that Moses entered the darkness and then saw God in it? What is now recounted seems somehow to be contradictory to the first theophany, for then the Divine was beheld in light but now he is seen in darkness. Let us not think that this is at variance with the sequence of things we have contemplated spiritually. Scripture teaches by this that religious knowledge comes at first to those who receive it as light. Therefore what is perceived to be contrary to religion is darkness, and the escape from darkness comes about when one participates in light. But as the mind progresses and, through an ever greater and more perfect diligence, comes to apprehend reality, as it approaches more nearly to contemplation, it sees more clearly what of the divine nature is uncontemplated."],[163,"For leaving behind everything that is observed, not only what sense comprehends but also what the intelligence thinks it sees, it keeps on penetrating deeper until by the intelligence's yearning for understanding it gains access to the invisible and the incomprehensible, and there it sees God. This is the true knowledge of what is sought; this is the seeing that consists in not seeing, because that which is sought transcends all knowledge, being separated on all sides by incomprehensibility as by a kind of darkness. Wherefore John the sublime, who penetrated into the luminous darkness, says, No one has ever seen God, thus asserting that knowledge of the divine essence is unattainable not only by men but also by every intelligent creature."],[164,"When, therefore, Moses grew in knowledge, he declared that he had seen God in the darkness, that is, that he had then come to know that what is divine is beyond all knowledge and comprehension, for the text says, Moses approached the dark cloud where God was. What God? He who made darkness his hiding place, as David says, who also was initiated into the mysteries in the same inner sanctuary."],[165,"When Moses arrived there, he was taught by word what he had formerly learned from darkness, so that, I think, the doctrine on this matter might be made firmer for us for being testified to by the divine voice. The divine word at the beginning forbids that the Divine be likened to any of the things known by men, since every concept which comes from some comprehensible image by an approximate understanding and by guessing at the divine nature constitutes an idol of God and does not proclaim God."],[166,"Religious virtue is divided into two parts, into that which pertains to the Divine and that which pertains to right conduct (for purity of life is a part of religion). Moses learns at first the things which must be known about God (namely, that none of those things known by human comprehension is to be ascribed to him). Then he is taught the other side of virtue, learning by what pursuits the virtuous life is perfected."],[167,"After this he comes to the tabernacle not made with hands. Who will follow someone who makes his way through such places and elevates his mind to such heights, who, as though he were passing from one peak to another, comes ever higher than he was through his ascent to the heights? First, he leaves behind the base of the mountain and is separated from all those too weak for the ascent. Then as he rises higher in his ascent he hears the sounds of the trumpets. Thereupon, he slips into the inner sanctuary of divine knowledge. And he does not remain there, but he passes on to the tabernacle not made with hands. For truly this is the limit that someone reaches who is elevated through such ascents."],[168,"For it seems to me that in another sense the heavenly trumpet becomes a teacher to the one ascending as he makes his way to what is not made with hands. For the wonderful harmony of the heavens proclaims the wisdom which shines forth in the creation and sets forth the great glory of God through the things which are seen, in keeping with the statement, the heavens declare the glory of God. It becomes the loud sounding trumpet of clear and melodious teaching, as one of the Prophets says, The heavens trumpeted from above."],[169,"When he who has been purified and is sharp of hearing in his heart hears this sound (I am speaking of the knowledge of the divine power which comes from the contemplation of reality), he is led by it to the place where his intelligence lets him slip in where God is. This is called darkness by the Scripture, which signifies, as I said, the unknown and unseen. When he arrives there, he sees that tabernacle not made with hands, which he shows to those below by means of a material likeness."]],"id":"b2-16","r":[162,169],"w":811,"x":[{"k":"c","a":9,"t":1.0,"e":69.2,"l":[[1.0,"In the name of the Father and of the Son and of the Holy Spirit."],[3.0,"Amen."],[4.0,"Dear friends, welcome back to our weekly readings of the various works of the saints."],[13.0,"Today we are going to continue St. Gregory of Nyssa's the Life of Moses."],[19.0,"Let us pray and we will begin."],[23.0,"O heavenly king, comfort a spirit of truth who art everywhere present and fillest all things."],[30.0,"Treasury of good things and giver of life, come and dwell in us and cleanse us of all impurity and save our souls."],[40.0,"O good one."],[49.0,"Today, God willing, we will continue with the chapter that's titled the Darkness."],[61.0,"And."],[63.0,"We will proceed with paragraph 162."]]},{"k":"s","p":0,"i":0,"a":9,"t":68.0,"x":"What does it mean that Moses entered the darkness and then saw God in it?"},{"k":"s","p":0,"i":1,"a":9,"t":74.0,"x":"What is now recounted seems somehow to be contradictory to the first theophany, for then the Divine was beheld in light but now he is seen in darkness."},{"k":"s","p":0,"i":2,"a":9,"t":87.3,"x":"Let us not think that this is at variance with the sequence of things we have contemplated spiritually."},{"k":"s","p":0,"i":3,"a":9,"t":93.0,"x":"Scripture teaches by this that religious knowledge comes at first to those who receive it as light."},{"k":"s","p":0,"i":4,"a":9,"t":99.0,"x":"Therefore what is perceived to be contrary to religion is darkness, and the escape from darkness comes about when one participates in light."},{"k":"s","p":0,"i":5,"a":9,"t":108.0,"x":"But as the mind progresses and, through an ever greater and more perfect diligence, comes to apprehend reality, as it approaches more nearly to contemplation, it sees more clearly what of the divine nature is uncontemplated."},{"k":"c","a":9,"t":125.0,"e":154.0,"l":[[125.0,"So I think in this particular case, what he's saying is the more one progresses in spiritual life, the more one realizes that one does not really have, one does not possess the light because there's way, way, way, way more room to grow."],[142.0,"There is a lot further distance to travel to the contemplation of God, because he is incomprehensible."],[151.0,"Paragraph 163."]]},{"k":"s","p":1,"i":0,"a":9,"t":153.0,"x":"For leaving behind everything that is observed, not only what sense comprehends but also what the intelligence thinks it sees, it keeps on penetrating deeper until by the intelligence's yearning for understanding it gains access to the invisible and the incomprehensible, and there it sees God."},{"k":"s","p":1,"i":1,"a":9,"t":172.0,"x":"This is the true knowledge of what is sought; this is the seeing that consists in not seeing, because that which is sought transcends all knowledge, being separated on all sides by incomprehensibility as by a kind of darkness."},{"k":"c","a":9,"t":189.0,"e":212.7,"l":[[189.0,"Yes, thank you."],[190.0,"Thank you for joining."],[194.0,"Oh, so let me."],[197.0,"That is a bit of a tongue twister."],[199.0,"This is the true knowledge of what is sought."],[202.0,"This is the seeing that consists in not seeing."],[205.0,"Because that which is sought transcends all Knowledge being separated on all sides by incompetent"]]},{"k":"s","p":1,"i":2,"a":9,"t":214.0,"x":"Wherefore John the sublime, who penetrated into the luminous darkness, says, No one has ever seen God, thus asserting that knowledge of the divine essence is unattainable not only by men but also by every intelligent creature."},{"k":"c","a":9,"t":229.0,"e":333.6,"l":[[229.0,"Thus, I think we arrive at sort of the idea that Moses saw God in darkness."],[236.0,"And I think that in this particular case, it might not hurt us to remember the life of Saint Sisoas the Great, who on his deathbed, as we recall, was transfigured, was shining with the light of transfiguration."],[252.0,"The fathers, his sort of fellow monastics around him, were astounded."],[256.0,"And they heard him muttering."],[258.0,"And when."],[259.0,"When they heard him muttering, you know, praying sort of unintelligibly, they said, Sisoes, what are you praying about?"],[266.0,"And he said to them, I'm praying for God to give me time for repentance."],[271.0,"And they said, Sisoes, you know, are you the one to repent?"],[274.0,"Look at you."],[275.0,"You know, here you are, you're this great saint."],[277.0,"You're transfigured."],[278.0,"And he said, brothers, believe me, I know not yet whether I have made a beginning of my repentance."],[286.0,"And I think this is perhaps sort of, at least, let's see, sort of one of the perspectives that we could look at, sort of seeing God in darkness or, you know, the fact that God is incomprehensible."],[302.0,"Saint Siso is, who's transfigured, who's shining with light, is praying for repentance because he believes he's not even truly begun to repent."],[313.0,"And perhaps maybe that is because also he sort of comprehends how incomprehensible God is."],[324.0,"Anyway, I don't mean that as a pun."],[327.0,"Do forgive me and bear with me."],[330.0,"Let's read on paragraph 164."]]},{"k":"s","p":2,"i":0,"a":9,"t":332.0,"x":"When, therefore, Moses grew in knowledge, he declared that he had seen God in the darkness, that is, that he had then come to know that what is divine is beyond all knowledge and comprehension, for the text says, Moses approached the dark cloud where God was."},{"k":"s","p":2,"i":1,"a":9,"t":347.0,"x":"What God? He who made darkness his hiding place, as David says, who also was initiated into the mysteries in the same inner sanctuary."},{"k":"c","a":9,"t":357.0,"e":371.5,"l":[[357.0,"So you would say that yes, David also, Prophet David, saw how incomprehensible God is, and he would understand that, yes, indeed, he made darkness his hiding place."],[369.0,"Paragraph 165."]]},{"k":"s","p":3,"i":0,"a":9,"t":370.0,"x":"When Moses arrived there, he was taught by word what he had formerly learned from darkness, so that, I think, the doctrine on this matter might be made firmer for us for being testified to by the divine voice."},{"k":"s","p":3,"i":1,"a":9,"t":383.0,"x":"The divine word at the beginning forbids that the Divine be likened to any of the things known by men, since every concept which comes from some comprehensible image by an approximate understanding and by guessing at the divine nature constitutes an idol of God and does not proclaim God."},{"k":"c","a":9,"t":404.0,"e":540.0,"l":[[404.0,"Now, the word idol in Greek actually."],[412.0,"Is of the same root as the word to see."],[415.0,"And so since God cannot be seen, then any sort of manifestation of divine nature or sort of any image of the divine nature that we might sort of come up with in our own minds would actually be constituted as an idol."],[437.0,"And I think for that reason also we read in the conversations with."],[445.0,"What is the sort of."],[448.0,"The most recent Greek saint?"],[452.0,"Oh, my goodness, I could see his face from his photographs."],[456.0,"The very recent saint from Greece."],[460.0,"At any rate, he was talking in his talks with his spiritual children and saying that there were fathers perhaps that he knew on Mount Athos or he heard about or learned about, and probably some of the ancients as well, the ancient monastics who basically, when the demons appear to them with light, and they would say, oh, come and see the light of transfiguration, they would turn away and they would say, I don't want to see any light."],[489.0,"I want to see Christ."],[491.0,"You know, sort of I will see."],[493.0,"See him when I die, but now I don't want to see him."],[496.0,"And of course, they realized that any created light would also be an idol."],[502.0,"It would not be sort of the appearance of the true God."],[511.0,"Wow."],[511.0,"I can't."],[512.0,"I still can't remember that Greek saint."],[514.0,"So do forgive me if his mind, if his name comes to mind, I will definitely."],[521.0,"I even have his icon somewhere."],[524.0,"And we certainly have his icon at church."],[527.0,"But this is what happens to sinful priests like me."],[532.0,"We do forget things."],[533.0,"So we're far from perfect."],[537.0,"Paragraph 166."]]},{"k":"s","p":4,"i":0,"a":9,"t":539.0,"x":"Religious virtue is divided into two parts, into that which pertains to the Divine and that which pertains to right conduct (for purity of life is a part of religion)."},{"k":"s","p":4,"i":1,"a":9,"t":550.0,"x":"Moses learns at first the things which must be known about God (namely, that none of those things known by human comprehension is to be ascribed to him)."},{"k":"s","p":4,"i":2,"a":9,"t":561.0,"x":"Then he is taught the other side of virtue, learning by what pursuits the virtuous life is perfected."},{"k":"c","a":9,"t":569.0,"e":636.0,"l":[[569.0,"So essentially, he's given a twofold revelation."],[573.0,"There's a certain."],[576.0,"In as much as he was capable to receive a certain comprehension about God."],[580.0,"And of course, there's a teaching of a virtuous life, the life that would lead you to God."],[600.0,"I think it's Paisius the Athenite, who said, who is the saint?"],[604.0,"Elder Paisius?"],[605.0,"Yes, I think so."],[607.0,"Elder Paisius is the one who said that when some of the saints saw light and they realized it was not the divine light, it was not God's light, it was the diabolical light sent to deceive them, they would turn away and say, I don't want to see the light."],[623.0,"Because indeed they didn't want to make any idols, they didn't want to accept any idols in the stead of God, so to speak."],[633.0,"Paragraph 167."]]},{"k":"s","p":5,"i":0,"a":9,"t":635.0,"x":"After this he comes to the tabernacle not made with hands."},{"k":"s","p":5,"i":1,"a":9,"t":638.8,"x":"Who will follow someone who makes his way through such places and elevates his mind to such heights, who, as though he were passing from one peak to another, comes ever higher than he was through his ascent to the heights?"},{"k":"s","p":5,"i":2,"a":9,"t":653.0,"x":"First, he leaves behind the base of the mountain and is separated from all those too weak for the ascent."},{"k":"s","p":5,"i":3,"a":9,"t":659.0,"x":"Then as he rises higher in his ascent he hears the sounds of the trumpets."},{"k":"s","p":5,"i":4,"a":9,"t":664.0,"x":"Thereupon, he slips into the inner sanctuary of divine knowledge."},{"k":"s","p":5,"i":5,"a":9,"t":667.0,"x":"And he does not remain there, but he passes on to the tabernacle not made with hands."},{"k":"s","p":5,"i":6,"a":9,"t":672.0,"x":"For truly this is the limit that someone reaches who is elevated through such ascents."},{"k":"c","a":9,"t":678.1,"e":733.2,"l":[[678.1,"a sense."],[679.0,"So basically he's saying here, St. Gregory is saying that the very ascent by Moses up the mountain also signifies a spiritual ascent as well."],[689.0,"In fact, we are taught that in iconography, very often images of mountains signify ascetic struggle."],[698.0,"And of course, just as Moses ascended the mountain, Christ was tempted on the mountain."],[704.0,"And because Satan took him up on the mountain and showed him all the kingdoms, the world, and many other things, of course, happened on the mountain."],[715.0,"So we are taught that in order to receive divine knowledge and a certain revelation of God, it would be proportionate to our ascent."],[726.0,"And of course, Moses ascended to the very peak to the highest part, paragraph"]]},{"k":"s","p":6,"i":0,"a":9,"t":732.0,"x":"For it seems to me that in another sense the heavenly trumpet becomes a teacher to the one ascending as he makes his way to what is not made with hands."},{"k":"s","p":6,"i":1,"a":9,"t":742.1,"x":"For the wonderful harmony of the heavens proclaims the wisdom which shines forth in the creation and sets forth the great glory of God through the things which are seen, in keeping with the statement, the heavens declare the glory of God."},{"k":"s","p":6,"i":2,"a":9,"t":755.5,"x":"It becomes the loud sounding trumpet of clear and melodious teaching, as one of the Prophets says, The heavens trumpeted from above."},{"k":"s","p":7,"i":0,"a":9,"t":764.0,"x":"When he who has been purified and is sharp of hearing in his heart hears this sound (I am speaking of the knowledge of the divine power which comes from the contemplation of reality), he is led by it to the place where his intelligence lets him slip in where God is."},{"k":"s","p":7,"i":1,"a":9,"t":781.0,"x":"This is called darkness by the Scripture, which signifies, as I said, the unknown and unseen."},{"k":"s","p":7,"i":2,"a":9,"t":787.0,"x":"When he arrives there, he sees that tabernacle not made with hands, which he shows to those below by means of a material likeness."},{"k":"c","a":9,"t":796.0,"e":991.5,"l":[[796.0,"Now, I think in this particular case, indeed, I think that there is an excellent secular example, an example which is not sort of found in the writings of the Fathers, which nevertheless could be quite useful."],[813.0,"It is what's called the Dunning Kruger syndrome."],[816.0,"And basically it states that the less someone is experienced, the more confident he is."],[824.0,"And I think this is exactly what St. Gregory describes in reverse."],[828.0,"In other words, the more experienced one becomes in contemplating God through the revealed creation."],[839.0,"So looking at the heavens, looking at the mountains, looking at the way that we are created in ways that are truly marvelous, the more one contemplates that, the more he is able to slip in where God is, in other words, sort of into this darkness, the more one is able to slip into realization that our own intellect is finite."],[864.0,"It's limited."],[865.0,"We cannot possibly comprehend how all of this fits together, how the entire universe fits together, the universe that God has created."],[875.0,"And I think there are so many examples in science that show us the intricate and absolutely phenomenal balance of sort of created things on the molecular level, on the atomic level, the subatomic level."],[895.0,"There is a perfect harmony which is thought through so thoroughly and to so many degrees."],[903.0,"Imagine we know the square root, we know things square, we know things cube."],[909.0,"And then there are various other, you know, sort of categories."],[915.0,"Things could be, you know, not only square, not only cube, but, you know, to the measure of 5, to the measure of 10, to the measure of."],[922.0,"We'll think about how the entire creation comes together."],[925.0,"If we contemplate it with our mind, we will realize that the complexity of the harmony of all living creatures coexisting in the same sort of planet, you know, in the same atmosphere."],[941.0,"It's."],[942.0,"It's amazing."],[942.0,"The degree that one would have to think this through is absolutely astounding."],[948.0,"And sort of would lead us to utter darkness, meaning that we would realize our own intellect is incapable."],[958.0,"Our computer would be on overload."],[960.0,"It would actually sort of shut down or get fried."],[964.0,"Thus, we would be led to this darkness."],[966.0,"And that is what I think St. Gregory says, meaning that, you know, he's saying, those who are wise enough to contemplate the Creator in his creation can eventually sort of slip into higher contemplation by realizing their own limitation."],[986.0,"The heavenly Tabernacle, the next chapter, paragraph 170."]]}]},{"t":"The Heavenly Tabernacle","p":[[170,"What then is that tabernacle not made with hands which was shown to Moses on the mountain and to which he was commanded to look as to an archetype so that he might reproduce in a handmade structure that marvel not made with hands? God says, See that you make them according to the pattern shown you on the mountain. There were gold pillars supported by silver bases and decorated with similar silver capitals; then, there were other pillars whose capitals and bases were of bronze but whose shafts were of silver. The core of all the pillars was wood that does not rot. But all around shone the brightness of these precious metals."],[171,"Likewise, there was an ark made of wood that does not rot, overlaid with gleaming pure gold. In addition, there was a candlestick with a single base, divided at its top into seven branches, each supporting a lamp. The candlestick was made of solid gold and not of wood overlaid with gold. There was, moreover, an altar and the throne of mercy and the so-called cherubim whose wings overshadowed the ark. All these were gold, not merely presenting a superficial appearance of gold but gold through and through."],[172,"Furthermore, there were curtains artistically woven of diverse colors; these brilliant colors were woven together to make a beautiful fabric. The curtains divided the tabernacle into two parts: the one visible and accessible to certain of the priests and the other secret and inaccessible. The name of the front part was the Holy Place and that of the hidden part was the Holy of Holies. In addition, there were lavers and braziers and hangings around the outer court and the curtains of hair and skins dyed red and all the other things he describes in the text. What words could accurately describe it all?"],[173,"Of what things not made with hands are these an imitation? And what benefit does the material imitation of those things Moses saw there convey to those who look at it? It seems good to me to leave the precise meaning of these things to those who have by the Spirit the power to search the depths of God, to someone who may be able, as the Apostle says, in the Spirit to speak about mysterious things. We shall leave what we say conjecturally and by supposition on the thought at hand to the judgment of our readers. Their critical intelligence must decide whether it should be rejected or accepted."],[174,"Taking a hint from what has been said by Paul, who partially uncovered the mystery of these things, we say that Moses was earlier instructed by a type in the mystery of the tabernacle which encompasses the universe. This tabernacle would be Christ who is the power and the wisdom of God, who in his own nature was not made with hands, yet capable of being made when it became necessary for this tabernacle to be erected among us. Thus, the same tabernacle is in a way both unfashioned and fashioned, uncreated in preexistence but created in having received this material composition."],[175,"What we say is of course not obscure to those who have accurately received the mystery of our faith. For there is one thing out of all others which both existed before the ages and came into being at the end of the ages. It did not need a temporal beginning (for how could what was before all times and ages be in need of a temporal origin?), but for our sakes, who had lost our existence through our thoughtlessness, it consented to be born like us so that it might bring that which had left reality back again to reality. This one is the Only Begotten God, who encompasses everything in himself but who also pitched his own tabernacle among us."],[176,"But if we name such a God \"tabernacle,\" the person who loves Christ should not be disturbed at all on the grounds that the suggestion involved in the phrase diminishes the magnificence of the nature of God. For neither is any other name worthy of the nature thus signified, but all names have equally fallen short of accurate description, both those recognized as insignificant as well as those by which some great insight is indicated."],[177,"But just as all the other names, in keeping with what is being specified, are each used piously to express the divine power—as, for example, physician, shepherd, protector, bread, vine, way, door, mansion, water, rock, spring, and whatever other designations are used of him—in the same way he is given the predicate \"tabernacle\" in accord with a signification fitting to God. For the power which encompasses the universe, in which lives the fulness of divinity, the common protector of all, who encompasses everything within himself, is rightly called \"tabernacle.\""],[178,"The vision must correspond to the name \"tabernacle,\" so that each thing seen leads to the contemplation of a concept appropriate to God. Now the great Apostle says that the curtain of the lower tabernacle is the flesh of Christ, I think, because it is composed of various colors, of the four elements. Doubtless he himself had a vision of the tabernacle when he entered the supercelestial sanctuary where the mysteries of Paradise were revealed to him by the Spirit. It would be well then by paying heed to the partial interpretation, to fit the total contemplation of the tabernacle to it."],[179,"We can gain clarity about the figures pertaining to the tabernacle from the very words of the Apostle. For he says somewhere with reference to the Only Begotten, whom we have perceived in place of the tabernacle, that in him were created all things, everything visible and everything invisible, Thrones, Dom inations, Sovereignties, Powers, or forces. Then the pillars gleaming with silver and gold, the bearing poles and rings, and those cherubim who hide the ark with their wings, and all the other things which are contained in the description of the tabernacle's construction—all of these things, if one should turn his view to things above, are the heavenly powers which are contemplated in the tabernacle and which support the universe in accord with the divine will."],[180,"These are our true supports, sent to help those who will be the heirs of salvation. They are slipped through the souls of those being saved as through rings and by themselves raise to the height of virtue those lying upon the earth. In saying that the cherubim cover the mysteries in the ark with their wings, the text confirms our contemplation of the tabernacle. For we have learned that this is the name of those powers which we see around the divine nature, which powers Isaiah and Ezekiel perceived."],[181,"The ark of the covenant, covered by their wings, should not sound strange to your ears. For it is possible to read the same thing also in Isaiah, where the Prophet speaks in a figure about the wings. The same thing is called the ark of the covenant in one place and in the other place the Face; in the one the ark is covered by the wings, in the other the Face is. It is as though one thing is perceived in both, which suggests to me the incomprehensibility of contemplating the ineffable secrets. And if you should hear about lamps which have many branches coming out of one candlestick so that a full and brilliant light is cast all around, you would correctly conclude that they are the varied rays of the Spirit which shine brightly in this tabernacle. This is what Isaiah is speaking about when he divides the lights of the Spirit into seven."],[182,"The throne of mercy, I think, needs no interpretation since the Apostle laid bare what is hidden when he said, Whom God has appointed to be a throne of mercy for our souls. When I hear of the altar of offering and the altar of incense, I understand the adoration of the heavenly beings which is perpetually offered in this tabernacle. For he says that not only the tongues of those on earth and in the underworld but also of those in the heavens render praise to the beginning of all things. This is the sacrifice pleasing to God, a verbal sacrifice, as the Apostle says, the fragrance of prayer."],[183,"Even if one sees skin dyed red and hair woven, the sequence of contemplation is not broken in this way. For the prophetic eye, attaining to a vision of divine things, will see the saving Passion there predetermined. It is signified in both of the elements mentioned: the redness pointing to blood and the hair to death. Hair on the body has no feeling; hence it is rightly a symbol of death."]],"id":"b2-17","r":[170,183],"w":1463,"x":[{"k":"s","p":0,"i":0,"a":9,"t":990.0,"x":"What then is that tabernacle not made with hands which was shown to Moses on the mountain and to which he was commanded to look as to an archetype so that he might reproduce in a handmade structure that marvel not made with hands?"},{"k":"s","p":0,"i":1,"a":9,"t":1005.0,"x":"God says, See that you make them according to the pattern shown you on the mountain."},{"k":"s","p":0,"i":2,"a":9,"t":1010.1,"x":"There were gold pillars supported by silver bases and decorated with similar silver capitals; then, there were other pillars whose capitals and bases were of bronze but whose shafts were of silver."},{"k":"s","p":0,"i":3,"a":9,"t":1023.0,"x":"The core of all the pillars was wood that does not rot."},{"k":"s","p":0,"i":4,"a":9,"t":1028.0,"x":"But all around shone the brightness of these precious metals."},{"k":"c","a":9,"t":1033.0,"e":1089.4,"l":[[1033.0,"Now, I think in this particular case, he isn't saying anything complicated."],[1037.0,"He's only retelling the very fact that on the mountain, when Moses received the law, he also received the instructions for the setup of the tabernacle."],[1051.0,"And the tabernacle, of course, we know that was the movable sanctuary, that was the temple that moved with the Israelites as they moved through the desert."],[1062.0,"And it was an elaborate sort of a structure tent, like in its setup."],[1068.0,"But it had various pillars and various things which Moses saw on the mountain."],[1073.0,"And of course, he saw the heavenly things which were then reflected in the earthly things to the best sort of limitations of the earthly abilities, you know, the materials available and so on."],[1087.0,"Paragraph 171,"]]},{"k":"s","p":1,"i":0,"a":9,"t":1087.7,"x":"Likewise, there was an ark made of wood that does not rot, overlaid with gleaming pure gold."},{"k":"s","p":1,"i":1,"a":9,"t":1094.0,"x":"In addition, there was a candlestick with a single base, divided at its top into seven branches, each supporting a lamp."},{"k":"s","p":1,"i":2,"a":9,"t":1101.0,"x":"The candlestick was made of solid gold and not of wood overlaid with gold."},{"k":"s","p":1,"i":3,"a":9,"t":1105.0,"x":"There was, moreover, an altar and the throne of mercy and the so-called cherubim whose wings overshadowed the ark."},{"k":"s","p":1,"i":4,"a":9,"t":1113.0,"x":"All these were gold, not merely presenting a superficial appearance of gold but gold through and through."},{"k":"c","a":9,"t":1120.0,"e":1312.0,"l":[[1120.0,"So this is quite fascinating."],[1122.0,"And I think that in this particular moment, I would like to draw your attention to the fact that God, who says to Moses the very first commandment, the Lord thy God, the Lord is one, Thou shalt not make thyself an image of anything above or on the earth, or below the earth, or in the waters, to worship it as God."],[1148.0,"And yet we see that when it pertains to the construction of the tabernacle, God commands Moses to make two cherubim."],[1158.0,"So they were actually sort of figures of, you know, we're assuming faces with six wings, and the wings they stretched over the mercy seat."],[1169.0,"Thus, we see already that God did not forbid all images."],[1176.0,"And that would be the fallacy of some sort of people, you know, especially those who ascribe to iconoclasm."],[1186.0,"And of course, iconoclasm."],[1187.0,"The heresy of iconoclasm is the heresy of fighting icons."],[1192.0,"Basically, the iconoclasts forbade the icons."],[1196.0,"They destroyed the icons, the images of Christ, the images of the Virgin Mary and of the saints, and sort of inspired by Islamic teachings at the time, because iconoclasm appeared in the seventh century, they insisted that God commanded Moses not to have any images at all."],[1217.0,"And yet God told Moses to create two cherubim."],[1221.0,"So I think that should give us enough pause to stop and think, what does it mean not to have any images whatsoever at all?"],[1231.0,"Well, you know, I dare say, and I'm just sort of interjecting here, that forbidding to have any images pertains to worshipping images as gods."],[1245.0,"The two cherubim over the mercy seat would have never been worshipped as gods by Moses, by Aaron, or by the."],[1254.0,"The other priesthood that followed after Aaron, sort of the Hebrew priesthood."],[1261.0,"None of the people there would consider the two cherubim over the mercy seat to be gods."],[1267.0,"And yet they all prayed before them, they bowed before them, and they were not committing any idolatry because, well, in fact, they were keeping intact what God had commanded Moses."],[1281.0,"So I think we must be very, very thorough in our understanding because sometimes we rush and we read a commandment, take it out of context and sort of, in some cases, take it to its maximum, where it ceases to be correct and ceases to be true."],[1300.0,"So that's something that's."],[1302.0,"That's quite beautiful."],[1303.0,"He's not even making this point, but he does mention this in passing, and I think it is quite important."],[1309.0,"Paragraph 172."]]},{"k":"s","p":2,"i":0,"a":9,"t":1311.0,"x":"Furthermore, there were curtains artistically woven of diverse colors; these brilliant colors were woven together to make a beautiful fabric."},{"k":"s","p":2,"i":1,"a":9,"t":1320.0,"x":"The curtains divided the tabernacle into two parts: the one visible and accessible to certain of the priests and the other secret and inaccessible."},{"k":"s","p":2,"i":2,"a":9,"t":1334.0,"x":"The name of the front part was the Holy Place and that of the hidden part was the Holy of Holies."},{"k":"s","p":2,"i":3,"a":9,"t":1340.0,"x":"In addition, there were lavers and braziers and hangings around the outer court and the curtains of hair and skins dyed red and all the other things he describes in the text."},{"k":"s","p":2,"i":4,"a":9,"t":1352.0,"x":"What words could accurately describe it all?"},{"k":"c","a":9,"t":1355.0,"e":1382.3,"l":[[1355.0,"Now I will add that the curtain that separated the holy of Holies and."],[1361.0,"And the holy place had cherubim embroidered on it as well."],[1368.0,"So obviously the whole idea of the prohibition of images is a very poor understanding of the Holy Scripture."],[1377.0,"In this particular case, reading on paragraph 173"]]},{"k":"s","p":3,"i":0,"a":9,"t":1380.8,"x":"Of what things not made with hands are these an imitation?"},{"k":"s","p":3,"i":1,"a":9,"t":1386.0,"x":"And what benefit does the material imitation of those things Moses saw there convey to those who look at it?"},{"k":"s","p":3,"i":2,"a":9,"t":1393.0,"x":"It seems good to me to leave the precise meaning of these things to those who have by the Spirit the power to search the depths of God, to someone who may be able, as the Apostle says, in the Spirit to speak about mysterious things."},{"k":"s","p":3,"i":3,"a":9,"t":1406.0,"x":"We shall leave what we say conjecturally and by supposition on the thought at hand to the judgment of our readers."},{"k":"s","p":3,"i":4,"a":9,"t":1415.0,"x":"Their critical intelligence must decide whether it should be rejected or accepted."},{"k":"c","a":9,"t":1421.0,"e":1745.3,"l":[[1421.0,"Now, I think this is probably also a beautiful example that the saint of the stature of St. Gregory of Nyssa, he was considered one of the great Cappadocian fathers, if I'm not mistaken."],[1435.0,"I think he's one of the Cappadocians."],[1436.0,"He's definitely from Asia Minor."],[1438.0,"And."],[1441.0,"He says, we shall leave this to those who have the understanding."],[1446.0,"We will not try to explain this away, because in some cases, talking about things which we do not have the proper understanding yet might actually not be beneficial for us."],[1460.0,"And that is something that is very valuable, because oftentimes, and I think sometimes it happens quite naturally for the people who are beginning in the faith, beginning in the Church, whether they were raised Orthodox or they became Orthodox in their sort of conscious and adult years sometimes, and I think without any ill intent, we can, and especially sort of with the enemy's help who would very much like to sort of sidetrack us and in any way possible beguile us."],[1501.0,"Sometimes we are drawn sort of to deliberation, to discussion, to the study of things which we have not matured yet to understand."],[1512.0,"And, of course, such curiosity in some ways, as I say, is understandable, and it is innocent enough."],[1520.0,"In some cases, however, we must also have enough good reason and enough good discipline to say to ourselves, that is not for me yet."],[1532.0,"I'm not ready for this yet."],[1535.0,"I'm not mature enough for this yet."],[1538.0,"And if we have that proper fear of God to say, whoa, I'm not supposed to go in there."],[1545.0,"Because we know, for example, that the Holy of Holies was entered only once a year, and then by the high priest who had to offer a sacrifice for his own sins."],[1554.0,"And now the reason why, and this is something that we go over with our students at the Holy Trinity Parish School, Saturday School in fifth grade, when we studied the Tabernacle, we discussed the fact that the great High priest entered the Holy of Holies only once a year."],[1573.0,"And of course, that was on the Day of Atonement, when he prayed for the remission of sins of the entire people of Israel."],[1580.0,"Now, interestingly enough, the modern day bishops have something that has sort of remained since those years and something that was very practical, since no one else dared ever to enter the Holy of Holies for the fear of being struck down."],[1599.0,"Because if you went in there and you were not the great high priest, and you were not entering it on the Day of atonement, after having offered a sacrifice for yourself, you would most assuredly be stricken dead by God."],[1612.0,"Well, some of the high priests, unfortunately, have been stricken dead as well."],[1619.0,"That is what we're taught in tradition."],[1622.0,"That is the reason why our bishops have bells on their vestments."],[1626.0,"Because the great High priest entering the Holy of Holies also had bells on his garments."],[1632.0,"And the entire nation of Israel standing outside sort of the sanctuary, the priests standing closer, no one else daring to go in, the only way for them to know whether he's alive or he was stricken dead by God was because of the ringing of these bells."],[1650.0,"So as the great high priest was doing his service, that which he was commanded by Moses to do on the Day of Atonement, the bells on his garments would ring and would let all other people know that he's still alive."],[1666.0,"I'm told that a rope was tied to his foot just in case he was stricken dead and no one else could go in to retrieve him, so they would pull him out by rope."],[1679.0,"Thankfully, our bishops no longer need to have a rope sort of tied to their feet, because God does not strike them dead, even if they do so serve unworthily."],[1691.0,"And of course, I would include myself in that as priest."],[1695.0,"However, in a book about one of the elders of Valaam, the one who left the Valaam monastery and moved to Finland, I think it was Elder Michael of Valaam."],[1710.0,"And in his book it talks about an Arche Mandrit who was serving while committing a great sin."],[1718.0,"He continued to serve in the altar."],[1720.0,"And the spiritual father wrote a letter to him and said, at the least, do not anger God."],[1727.0,"Do not serve the liturgy."],[1729.0,"If you are incapable of stopping the sin, you should repent."],[1733.0,"You should stop, my son."],[1735.0,"And then the sinful Archimandrite just kind of blew him off and continued serving liturgy."],[1739.0,"And one day as he was standing before the Holy table, he was struck"]]},{"k":"s","p":4,"i":0,"a":9,"t":1435.4,"x":"Taking a hint from what has been said by Paul, who partially uncovered the mystery of these things, we say that Moses was earlier instructed by a type in the mystery of the tabernacle which encompasses the universe."},{"k":"s","p":4,"i":1,"a":9,"t":1574.5,"x":"This tabernacle would be Christ who is the power and the wisdom of God, who in his own nature was not made with hands, yet capable of being made when it became necessary for this tabernacle to be erected among us."},{"k":"s","p":4,"i":2,"a":9,"t":1710.4,"x":"Thus, the same tabernacle is in a way both unfashioned and fashioned, uncreated in preexistence but created in having received this material composition."},{"k":"s","p":5,"i":0,"a":9,"t":1780.0,"x":"What we say is of course not obscure to those who have accurately received the mystery of our faith."},{"k":"s","p":5,"i":1,"a":9,"t":1786.0,"x":"For there is one thing out of all others which both existed before the ages and came into being at the end of the ages."},{"k":"s","p":5,"i":2,"a":9,"t":1792.0,"x":"It did not need a temporal beginning (for how could what was before all times and ages be in need of a temporal origin?), but for our sakes, who had lost our existence through our thoughtlessness, it consented to be born like us so that it might bring that which had left reality back again to reality."},{"k":"s","p":5,"i":3,"a":9,"t":1814.0,"x":"This one is the Only Begotten God, who encompasses everything in himself but who also pitched his own tabernacle among us."},{"k":"s","p":6,"i":0,"a":9,"t":1830.0,"x":"But if we name such a God \"tabernacle,\" the person who loves Christ should not be disturbed at all on the grounds that the suggestion involved in the phrase diminishes the magnificence of the nature of God."},{"k":"s","p":6,"i":1,"a":9,"t":1842.1,"x":"For neither is any other name worthy of the nature thus signified, but all names have equally fallen short of accurate description, both those recognized as insignificant as well as those by which some great insight is indicated."},{"k":"s","p":7,"i":0,"a":9,"t":1861.0,"x":"But just as all the other names, in keeping with what is being specified, are each used piously to express the divine power—as, for example, physician, shepherd, protector, bread, vine, way, door, mansion, water, rock, spring, and whatever other designations are used of him—in the same way he is given the predicate \"tabernacle\" in accord with a signification fitting to God."},{"k":"c","a":9,"t":1872.6,"e":1878.8,"l":[[1872.6,"I am the vine and ye are the branches."],[1876.0,"In that sense"]]},{"k":"s","p":7,"i":1,"a":9,"t":1891.2,"x":"For the power which encompasses the universe, in which lives the fulness of divinity, the common protector of all, who encompasses everything within himself, is rightly called \"tabernacle.\""},{"k":"c","a":9,"t":1903.0,"e":1919.5,"l":[[1903.0,"So I'm assuming here what's in Gregory is referring to is the human body of our Lord Jesus Christ, being The tabernacle of his divinity for His Divinity, paragraph 178."]]},{"k":"s","p":8,"i":0,"a":9,"t":1918.0,"x":"The vision must correspond to the name \"tabernacle,\" so that each thing seen leads to the contemplation of a concept appropriate to God."},{"k":"s","p":8,"i":1,"a":9,"t":1927.0,"x":"Now the great Apostle says that the curtain of the lower tabernacle is the flesh of Christ, I think, because it is composed of various colors, of the four elements."},{"k":"s","p":8,"i":2,"a":9,"t":1936.0,"x":"Doubtless he himself had a vision of the tabernacle when he entered the supercelestial sanctuary where the mysteries of Paradise were revealed to him by the Spirit."},{"k":"s","p":8,"i":3,"a":9,"t":1945.0,"x":"It would be well then by paying heed to the partial interpretation, to fit the total contemplation of the tabernacle to it."},{"k":"c","a":9,"t":1954.0,"e":1977.0,"l":[[1954.0,"So I think what he's referring to is the apostle John, the theologian, who refers."],[1961.0,"Or Maybe this is St. Paul."],[1963.0,"It could be St. Paul who referred to Christ's flesh as the curtain of the tabernacle."],[1970.0,"But then he says we should go on and sort of explain it further."],[1974.0,"Paragraph 179."]]},{"k":"s","p":9,"i":0,"a":9,"t":1976.0,"x":"We can gain clarity about the figures pertaining to the tabernacle from the very words of the Apostle."},{"k":"s","p":9,"i":1,"a":9,"t":1982.0,"x":"For he says somewhere with reference to the Only Begotten, whom we have perceived in place of the tabernacle, that in him were created all things, everything visible and everything invisible, Thrones, Dom inations, Sovereignties, Powers, or forces."},{"k":"s","p":9,"i":2,"a":9,"t":2000.0,"x":"Then the pillars gleaming with silver and gold, the bearing poles and rings, and those cherubim who hide the ark with their wings, and all the other things which are contained in the description of the tabernacle's construction—all of these things, if one should turn his view to things above, are the heavenly powers which are contemplated in the tabernacle and which support the universe in accord with the divine will."},{"k":"s","p":10,"i":0,"a":9,"t":2027.0,"x":"These are our true supports, sent to help those who will be the heirs of salvation."},{"k":"s","p":10,"i":1,"a":9,"t":2034.0,"x":"They are slipped through the souls of those being saved as through rings and by themselves raise to the height of virtue those lying upon the earth."},{"k":"s","p":10,"i":2,"a":9,"t":2044.0,"x":"In saying that the cherubim cover the mysteries in the ark with their wings, the text confirms our contemplation of the tabernacle."},{"k":"s","p":10,"i":3,"a":9,"t":2051.0,"x":"For we have learned that this is the name of those powers which we see around the divine nature, which powers Isaiah and Ezekiel perceived."},{"k":"c","a":9,"t":2060.0,"e":2106.0,"l":[[2060.0,"So he's talking about the heavenly hosts."],[2062.0,"And the tabernacle had loops and poles which sort of, you know, held it together and connected it."],[2070.0,"Also we know that the ark of the Covenant, which was sort of the."],[2074.0,"The mercy seat over which the cherubim stood, also had holes, rings, and no one would touch it by hand."],[2084.0,"Poles would be put through these holes, and then sort of the Levites would carry the tabernacle with those poles."],[2094.0,"So he's saying, the heavenly powers are like those rings and poles and pillars and so on that support everything and support our salvation."],[2103.0,"Paragraph 181."]]},{"k":"s","p":11,"i":0,"a":9,"t":2105.0,"x":"The ark of the covenant, covered by their wings, should not sound strange to your ears."},{"k":"s","p":11,"i":1,"a":9,"t":2109.6,"x":"For it is possible to read the same thing also in Isaiah, where the Prophet speaks in a figure about the wings."},{"k":"s","p":11,"i":2,"a":9,"t":2116.0,"x":"The same thing is called the ark of the covenant in one place and in the other place the Face; in the one the ark is covered by the wings, in the other the Face is."},{"k":"s","p":11,"i":3,"a":9,"t":2129.0,"x":"It is as though one thing is perceived in both, which suggests to me the incomprehensibility of contemplating the ineffable secrets."},{"k":"s","p":11,"i":4,"a":9,"t":2137.0,"x":"And if you should hear about lamps which have many branches coming out of one candlestick so that a full and brilliant light is cast all around, you would correctly conclude that they are the varied rays of the Spirit which shine brightly in this tabernacle."},{"k":"s","p":11,"i":5,"a":9,"t":2153.0,"x":"This is what Isaiah is speaking about when he divides the lights of the Spirit into seven."},{"k":"c","a":9,"t":2158.0,"e":2191.0,"l":[[2158.0,"Well, that's quite interesting."],[2159.0,"I don't recall exactly which passage he refers to here speaking of Isaiah."],[2165.0,"However, he's saying that just as the cherubim in the tabernacle had their wings over the mercy seat, so they were hiding the ark of the covenant."],[2175.0,"And then Isaiah sees the cherubim in heaven covering their faces."],[2180.0,"So he's saying, well, this idea of covering speaks about the incomprehensibility of the divine."],[2187.0,"That's really something."],[2188.0,"Paragraph 182."]]},{"k":"s","p":12,"i":0,"a":9,"t":2190.0,"x":"The throne of mercy, I think, needs no interpretation since the Apostle laid bare what is hidden when he said, Whom God has appointed to be a throne of mercy for our souls."},{"k":"s","p":12,"i":1,"a":9,"t":2200.0,"x":"When I hear of the altar of offering and the altar of incense, I understand the adoration of the heavenly beings which is perpetually offered in this tabernacle."},{"k":"s","p":12,"i":2,"a":9,"t":2208.7,"x":"For he says that not only the tongues of those on earth and in the underworld but also of those in the heavens render praise to the beginning of all things."},{"k":"s","p":12,"i":3,"a":9,"t":2219.0,"x":"This is the sacrifice pleasing to God, a verbal sacrifice, as the Apostle says, the fragrance of prayer."},{"k":"c","a":9,"t":2225.0,"e":2243.0,"l":[[2225.0,"Well, because the cherubim in heaven and the seraphim, they cried out, holy, holy, holy, Lord God of Sabaoth, heaven and earth are full of thy glory."],[2236.0,"So that is what Isaiah saw."],[2237.0,"And of course, this is what he's referring to."],[2240.0,"Paragraph 183."]]},{"k":"s","p":13,"i":0,"a":9,"t":2242.0,"x":"Even if one sees skin dyed red and hair woven, the sequence of contemplation is not broken in this way."},{"k":"s","p":13,"i":1,"a":9,"t":2249.0,"x":"For the prophetic eye, attaining to a vision of divine things, will see the saving Passion there predetermined."},{"k":"s","p":13,"i":2,"a":9,"t":2256.0,"x":"It is signified in both of the elements mentioned: the redness pointing to blood and the hair to death."},{"k":"s","p":13,"i":3,"a":9,"t":2263.0,"x":"Hair on the body has no feeling; hence it is rightly a symbol of death."},{"k":"c","a":9,"t":2268.0,"e":2296.2,"l":[[2268.0,"That's quite interesting."],[2269.0,"Yes."],[2269.0,"Because, you know, even when we think we feel hair, it's actually sort of the skin underneath the hair that feels something."],[2276.0,"But if you sort of touch the hair itself, unless you disturb the skin to which it is attached, there is no healing."],[2285.0,"And so he considers that to be a symbol of death."],[2289.0,"That's very, very fascinating."],[2291.0,"The earthly tabernacle, paragraph 184."]]}]},{"t":"The Earthly Tabernacle","p":[[184,"Whenever the prophet looks to the tabernacle above, he sees the heavenly realities through these symbols. But if one should look at the tabernacle below (since in many places the Church also is called Christ by Paul), it would be well to regard the names \"apostles, teachers, and prophets\" as referring to those servants of the divine mystery whom Scripture also calls pillars of the Church. For it is not only Peter and John and James who are pillars of the Church, nor was only John the Baptist a burning light, but all those who themselves support the Church and become lights through their own works are called \"pillars\" and \"lights.\" You are the light of the world, says the Lord to the Apostles. And again the divine Apostle bids others to be pillars, saying Be steadfast and unmovable. And he made Timothy into an excellent pillar, when he made him (as he says in his own words) a pillar and ground of truth."],[185,"In this tabernacle both the sacrifice of praise and the incense of prayer are seen offered continually at morning and evening. The great David allows us to perceive these things when he directs the incense of his prayer in an odor of sweetness to God, performing his sacrifice through the lifting up of his hands. When hearing about the lavers, one will certainly perceive those who wash away the blemish of sins with mystical water. John was a laver, washing men in the Jordan with the baptism of repentance, as was Peter, who led three thousand at the same time to the water. Philip, too, was a laver of the servant of Candace, and all those who administer grace are lavers to those who share in the free gift."],[186,"The interconnecting courts which surround the tabernacle are fittingly understood as the harmony, love, and peace of believers. David interprets it in this way when he says: Who has granted you peace on your frontiers."],[187,"The skin dyed red and the coverings made of hair, which add to the decoration of the tabernacle, would be perceived respectively as the mortification of the sinful flesh (the figure of which is the skin dyed red) and the ascetic way of life. By these the tabernacle of the church is especially beautified. By nature these skins do not have in themselves a vital power, but they become bright red because of the red dye. This teaches that grace, which flourishes through the Spirit, is not found in men unless they first make themselves dead to sin. Whether or not Scripture signifies by the red dye chaste modesty, I leave for whoever wishes to decide. The woven hair, which produced a fabric rough and hard to the touch, foreshadows the self-control which is rough and consumes the habitual passions. The life of virginity demonstrates in itself all such things, as it chastises the flesh of all those who live this way."],[188,"If the interior, which is called the Holy of Holies, is not accessible to the multitude, let us not think that this is at variance with the sequence of what has been perceived. For the truth of reality is truly a holy thing, a holy of holies, and is incomprehensible and inaccessible to the multitude. Since it is set in the secret and ineffable areas of the tabernacle of mystery, the apprehension of the realities above comprehension should not be meddled with; one should rather believe that what is sought does exist, not that it lies visible to all, but that it remains in the secret and ineffable areas of the intelligence."]],"id":"b2-18","r":[184,188],"w":602,"x":[{"k":"s","p":0,"i":0,"a":9,"t":2295.0,"x":"Whenever the prophet looks to the tabernacle above, he sees the heavenly realities through these symbols."},{"k":"s","p":0,"i":1,"a":9,"t":2301.0,"x":"But if one should look at the tabernacle below (since in many places the Church also is called Christ by Paul), it would be well to regard the names \"apostles, teachers, and prophets\" as referring to those servants of the divine mystery whom Scripture also calls pillars of the Church."},{"k":"s","p":0,"i":2,"a":9,"t":2317.0,"x":"For it is not only Peter and John and James who are pillars of the Church, nor was only John the Baptist a burning light, but all those who themselves support the Church and become lights through their own works are called \"pillars\" and \"lights.\" You are the light of the world, says the Lord to the Apostles."},{"k":"s","p":0,"i":3,"a":9,"t":2336.0,"x":"And again the divine Apostle bids others to be pillars, saying Be steadfast and unmovable."},{"k":"s","p":0,"i":4,"a":9,"t":2342.0,"x":"And he made Timothy into an excellent pillar, when he made him (as he says in his own words) a pillar and ground of truth."},{"k":"c","a":9,"t":2350.0,"e":2401.0,"l":[[2350.0,"A pillar in support of the truth."],[2351.0,"Well, a pillar in support of the truth is a phrase that refers to the church."],[2356.0,"However, if I guess."],[2360.0,"I guess what he's referring to in this particular case is that he instructed St. Timothy, although the pillar in support of the truth, I think those are the words of St. Peter."],[2372.0,"So I'm not sure."],[2376.0,"Maybe."],[2377.0,"Let's see."],[2380.0,"St. Paul says to Timothy, be thou sort of an image, a faithful image."],[2387.0,"And, you know, well, I guess be steadfast."],[2391.0,"Yeah, maybe."],[2391.0,"He says, be steadfast in the truth."],[2393.0,"And of course, that makes him a pillar."],[2395.0,"Maybe that's what it is."],[2398.0,"Paragraph 185."]]},{"k":"s","p":1,"i":0,"a":9,"t":2400.0,"x":"In this tabernacle both the sacrifice of praise and the incense of prayer are seen offered continually at morning and evening."},{"k":"s","p":1,"i":1,"a":9,"t":2407.0,"x":"The great David allows us to perceive these things when he directs the incense of his prayer in an odor of sweetness to God, performing his sacrifice through the lifting up of his hands."},{"k":"s","p":1,"i":2,"a":9,"t":2419.0,"x":"When hearing about the lavers, one will certainly perceive those who wash away the blemish of sins with mystical water."},{"k":"s","p":1,"i":3,"a":9,"t":2426.0,"x":"John was a laver, washing men in the Jordan with the baptism of repentance, as was Peter, who led three thousand at the same time to the water."},{"k":"s","p":1,"i":4,"a":9,"t":2435.0,"x":"Philip, too, was a laver of the servant of Candace, and all those who administer grace are lavers to those who share in the free gift."},{"k":"s","p":2,"i":0,"a":9,"t":2453.0,"x":"The interconnecting courts which surround the tabernacle are fittingly understood as the harmony, love, and peace of believers."},{"k":"s","p":2,"i":1,"a":9,"t":2460.0,"x":"David interprets it in this way when he says:"},{"k":"s","p":2,"i":2,"a":9,"t":2464.2,"x":"Who has granted you peace on your frontiers."},{"k":"s","p":3,"i":0,"a":9,"t":2470.0,"x":"The skin dyed red and the coverings made of hair, which add to the decoration of the tabernacle, would be perceived respectively as the mortification of the sinful flesh (the figure of which is the skin dyed red) and the ascetic way of life."},{"k":"s","p":3,"i":1,"a":9,"t":2484.3,"x":"By these the tabernacle of the church is especially beautified."},{"k":"s","p":3,"i":2,"a":9,"t":2488.2,"x":"By nature these skins do not have in themselves a vital power, but they become bright red because of the red dye."},{"k":"s","p":3,"i":3,"a":9,"t":2495.0,"x":"This teaches that grace, which flourishes through the Spirit, is not found in men unless they first make themselves dead to sin."},{"k":"c","a":9,"t":2503.0,"e":2537.3,"l":[[2503.0,"So basically, and I think that is why St. John the Baptist was clothed in a sheepskin to signify the mortification of his flesh."],[2514.0,"The skin that we wear, the animal skin skin that we wear, and nowadays we only usually wear it."],[2519.0,"Well, there are some garments made of skin, but mostly now it's just the shoes and the belts."],[2524.0,"But basically it's a skin of a dead animal."],[2528.0,"So there is a certain mortification, and that is why."],[2531.0,"So in order to be beatified by grace, you must become"]]},{"k":"s","p":3,"i":4,"a":9,"t":2537.0,"x":"Whether or not Scripture signifies by the red dye chaste modesty, I leave for whoever wishes to decide."},{"k":"s","p":3,"i":5,"a":9,"t":2543.0,"x":"The woven hair, which produced a fabric rough and hard to the touch, foreshadows the self-control which is rough and consumes the habitual passions."},{"k":"s","p":3,"i":6,"a":9,"t":2553.0,"x":"The life of virginity demonstrates in itself all such things, as it chastises the flesh of all those who live this way."},{"k":"c","a":9,"t":2562.0,"e":2647.0,"l":[[2562.0,"Well, I think the idea of wearing a hair shirt because hair is sort of, you know, scratchy and itchy, and it definitely, if you wear a hair, short hair shirt, you have to modify your passions because it's."],[2576.0,"It's not smooth as silk, it's not pleasant to touch, and in order to remain in it, one has to really, really sort of mortify his feelings because Definitely, a hair shirt is not something that you want to feel."],[2591.0,"Almost comically."],[2592.0,"I would dare say that those of us living now in the 21st century are so accustomed to clothes that fit fairly well and have reasonably soft fabric that if we have a hair somewhere in our back or somewhere in our garments and it just barely tickles us, it's quite upsetting."],[2613.0,"And we always want to sort of be able to get that hair out because it causes us just enough irritation."],[2620.0,"Not painful irritation, but just sort of inconvenience that draws our attention to it."],[2629.0,"Well, imagine wearing an entire shirt woven of hair."],[2633.0,"Well, of course it would be quite different and would be a great sort of aesthetic feat which many people practiced in the older days."],[2644.0,"Paragraph 188."]]},{"k":"s","p":4,"i":0,"a":9,"t":2646.0,"x":"If the interior, which is called the Holy of Holies, is not accessible to the multitude, let us not think that this is at variance with the sequence of what has been perceived."},{"k":"s","p":4,"i":1,"a":9,"t":2655.0,"x":"For the truth of reality is truly a holy thing, a holy of holies, and is incomprehensible and inaccessible to the multitude."},{"k":"s","p":4,"i":2,"a":9,"t":2663.0,"x":"Since it is set in the secret and ineffable areas of the tabernacle of mystery, the apprehension of the realities above comprehension should not be meddled with; one should rather believe that what is sought does exist, not that it lies visible to all, but that it remains in the secret and ineffable areas of the intelligence."},{"k":"c","a":9,"t":2684.0,"e":3051.8,"l":[[2684.0,"I think we'll stop here today because the next chapter is the priestly, the one on priestly vestments, and we will stop."],[2692.0,"However, I would just like to say that once again it's quite interesting that St. Gregory sort of comes close to this parallel again, of accepting that there is a holy of Holies and not everyone enters into it and sort of accepting it with humility and not pushing to know sort of knowledge that one should not know."],[2717.0,"And I think that, spiritually speaking, sometimes it is a great and necessary discipline to curb our curiosity, to curb our sort of thirst for knowledge of things divine, and to make sure that we reach out to see in as much as our spiritual life is sort of capable of supporting."],[2750.0,"Now, think of it this way."],[2753.0,"Imagine that we all have sort of a sensor given to us by God."],[2760.0,"And the sensor, the more spiritually grounded, the more spiritually mature, sort of the more experienced we become, the sensor grows bigger and stronger."],[2772.0,"Thus we are able to put bigger calls into it and sort of more incense."],[2778.0,"If our censer is rathe
