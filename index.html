, seeking to determine whether the events took place typologi cally, we should be prepared to believe that the lawgiver has taught through the things said. The teaching is this: When through virtue one comes to grips with any evil, he must completely destroy the first beginnings of evil."],[93,"For when he slays the beginning, he destroys at the same time what follows after it. The Lord teaches the same thing in the Gospel, all but explicitly calling on us to kill the firstborn of the Egyptian evils when he commands us to abolish lust and anger and to have no more fear of the stain of adultery or the guilt of murder. Neither of these things would develop of itself, but anger produces murder and lust produces adultery."],[94,"Since the producer of evil gives birth to lust before adultery and anger before murder, in destroying the firstborn he certainly kills along with it the offspring which follows. Take for an example a snake: When one crushes his head he kills the rest of the body at the same time."],[95,"This would not have happened unless the blood which turns aside the destroyer had been poured out on our doors. And if it is necessary to perceive the meaning presented here more fully, the history provides this perception in both the killing of the firstborn and the safeguarding of the entrance by blood. In the one the first impulse to evil is destroyed, and in the other the first entrance of evil into us is turned away by the true Lamb. For when the destroyer has come inside, we do not drive him out by our own devices, but by the Law we throw up a defense to keep him from gaining a foothold among us."],[96,"Safety and security consist in marking the upper doorpost and the side posts of the entrance with the blood of the lamb. While in this way Scripture gives us through figures a scientific understanding of the nature of the soul, profane learning also places it before the mind, dividing the soul into the rational, the appetitive, and the spirited. Of these parts we are told that the spirit and the appetite are placed below, supporting on each side the intellectual part of the soul, while the rational aspect is joined to both so as to keep them together and to be held up by them, being trained for courage by the spirit and elevated to the participation in the Good by the appetite."],[97,"As long, therefore, as the soul is kept safe in this manner, maintaining its firmness by virtuous thoughts as if by bolts, all the parts cooperate with one another for good. The rational for its part furnishes safety to its supports, and in its turn receives from them an equal benefit."],[98,"But if this arrangement should be upset and the upper become the lower—so that if the rational falls from above, the appetitive and spirited disposition makes it the part trampled upon—then the destroyer slips inside. No opposition from the blood resists his entrance; that is to say, faith in Christ does not ally itself with those of such a disposition."],[99,"For he says first to anoint the upper doorpost with blood, then to touch both side doorposts in the same way. How therefore would one anoint the upper first unless it be found on top?"],[100,"Do not be surprised at all if both things—the death of the firstborn and the pouring out of the blood— did not happen to the Israelites and on that account reject the contemplation which we have proposed concerning the destruction of evil as if it were a fabrication without any truth. For now in the difference of the names, Israelite and Egyptian, we perceive the difference between virtue and evil. Since the spiritual meaning proposes that we perceive the Israelite as virtuous, we would not reasonably require the firstfruits of virtue's offspring to be destroyed but rather those whose destruction is more advantageous than their cultivation."],[101,"Consequently we have been taught by God that we must destroy the firstfruits of the Egyptian children so that evil, in being destroyed at its beginning, might come to an end. And this insight agrees with the history, for the protection of the Israelite children took place through the pouring out of blood in order that good might come to maturity. But what would come to maturity in the Egyptian people was destroyed before it matured in evil."]],"id":"b2-7","r":[89,101],"w":1078,"x":[{"k":"c","a":6,"t":1.0,"e":113.7,"l":[[1.0,"In the name of the Father and of the Son and of the Holy Spirit."],[3.0,"Amen."],[3.0,"Dear friends, welcome back to our regular readings of the Holy Fathers."],[8.0,"We're continuing to read the life of Moses, of the holy prophet Moses by St. Gregory of Nyssa."],[16.0,"Let us sing a prayer."],[17.0,"We will sing the tropari into the feast of the Ascension, and we will proceed."],[30.0,"Thou didst ascend into glory of Christ our God, having gladdened thy disciples by the promise of the Holy Spirit."],[38.0,"And this blessing convinced them that thou art the Son of God, the Redeemer of the world."],[47.0,"My apology."],[48.0,"I think I actually managed to sing it in the wrong tone."],[51.0,"I sang it in the sixth tone, which is the time for the kandakian of this feast."],[58.0,"So do forgive me."],[61.0,"And God willing, we could still have the wonderful benefit from our reading as we continue on today."],[73.0,"And we are continuing to read with paragraph 89 and in the chapter which is titled the Death of the Firstborn."],[85.0,"So we are now at the time when Moses, well, God, I suppose I should say, brought the last and final punishment on the Egyptians, that being the death of their firstborn."],[102.0,"So it's the institution of pascha, in the sense that the word pascha in Hebrew means that the angel of death passed by"]]},{"k":"s","p":0,"i":0,"a":6,"t":113.0,"x":"Let us proceed to what follows in the text."},{"k":"s","p":0,"i":1,"a":6,"t":115.0,"x":"We have learned through the things examined already that Moses (and he who exalts himself by virtue in keeping with his example), when his soul had been empowered through long application and high and lofty life, and through the illumination which came from above, considered it a loss not to lead his countrymen to the life of freedom."},{"k":"c","a":6,"t":136.3,"e":147.0,"l":[[136.3,"free freedom."],[137.0,"So he's basically saying Moses would consider it to be a sin not to guide his people"]]},{"k":"c","a":6,"t":148.0,"e":156.5,"l":[[148.0,"And of course, this freedom was necessary for them to worship the one true God."],[154.0,"Paragraph 90."]]},{"k":"s","p":1,"i":0,"a":6,"t":155.0,"x":"When he came to them, he implanted in them a more intense desire for freedom by holding out worse sufferings to them."},{"k":"s","p":1,"i":1,"a":6,"t":163.0,"x":"Intending to remove his countrymen from evil, he brought death upon all the firstborn in Egypt."},{"k":"s","p":1,"i":2,"a":6,"t":168.0,"x":"By doing this he laid down for us the principle that it is necessary to destroy utterly the first birth of evil."},{"k":"s","p":1,"i":3,"a":6,"t":175.0,"x":"It is impossible to flee the Egyptian life in any other way."},{"k":"c","a":6,"t":182.0,"e":220.3,"l":[[182.0,"I think we should probably just continue going, because in a spiritual sense, obviously we're not talking about any actual violence to be done toward anyone, but this is an example of what we should do inwardly with our spiritual struggles."],[204.0,"And of course, the firstborn to be killed, obviously no longer is to be done in regular life."],[214.0,"It's done spiritually Chapter 91, paragraph 91."]]},{"k":"s","p":2,"i":0,"a":6,"t":219.0,"x":"It does not seem good to me to pass this interpretation by without further contemplation."},{"k":"s","p":2,"i":1,"a":6,"t":225.0,"x":"How would a concept worthy of God be preserved in the description of what happened if one looked only to the history?"},{"k":"s","p":2,"i":2,"a":6,"t":233.0,"x":"The Egyptian acts unjustly, and in his place is punished his newborn child, who in his infancy cannot discern what is good and what is not."},{"k":"s","p":2,"i":3,"a":6,"t":243.0,"x":"His life has no experience of evil, for infancy is not capable of passion."},{"k":"s","p":2,"i":4,"a":6,"t":247.0,"x":"He does not know to distinguish between his right hand and his left."},{"k":"s","p":2,"i":5,"a":6,"t":251.0,"x":"The infant lifts his eyes only to his mother's nipple, and tears are the sole perceptible sign of his sadness."},{"k":"s","p":2,"i":6,"a":6,"t":258.0,"x":"And if he obtains anything which his nature desires, he signifies his pleasure by smiling."},{"k":"s","p":2,"i":7,"a":6,"t":265.0,"x":"If such a one now pays the penalty of his father's wickedness, where is justice?"},{"k":"s","p":2,"i":8,"a":6,"t":269.0,"x":"Where is piety? Where is holiness?"},{"k":"s","p":2,"i":9,"a":6,"t":272.0,"x":"Where is Ezekiel, who cries:"},{"k":"s","p":2,"i":10,"a":6,"t":273.2,"x":"The man who has sinned is the man who must die and a son is not to suffer for the sins of his father?"},{"k":"s","p":2,"i":11,"a":6,"t":279.0,"x":"How can the history so contradict reason?"},{"k":"c","a":6,"t":282.0,"e":321.0,"l":[[282.0,"I think in this particular case it's very comforting that St. Gregory draws our attention to that."],[291.0,"Now we could say, and I think he did say earlier, that the Egyptians did put to death a number of the Hebrew children, especially boys, and now their children are being put to death by God."],[307.0,"So there is some sort of retribution."],[309.0,"But of course, quite correctly, the infants themselves are innocent, and you can't say, why is it that God is punishing them."],[318.0,"Paragraph 92."]]},{"k":"s","p":3,"i":0,"a":6,"t":320.0,"x":"Therefore, as we look for the true spiritual meaning, seeking to determine whether the events took place typologi cally, we should be prepared to believe that the lawgiver has taught through the things said."},{"k":"s","p":3,"i":1,"a":6,"t":333.6,"x":"The teaching is this: When through virtue one comes to grips with any evil, he must completely destroy the first beginnings of evil."},{"k":"c","a":6,"t":344.0,"e":361.4,"l":[[344.0,"So essentially evil has to be destroyed at the root."],[349.0,"And that is why we see the destruction of infants here in of the Egyptian infants here, chapter 93."]]},{"k":"s","p":4,"i":0,"a":6,"t":360.0,"x":"For when he slays the beginning, he destroys at the same time what follows after it."},{"k":"s","p":4,"i":1,"a":6,"t":365.0,"x":"The Lord teaches the same thing in the Gospel, all but explicitly calling on us to kill the firstborn of the Egyptian evils when he commands us to abolish lust and anger and to have no more fear of the stain of adultery or the guilt of murder."},{"k":"s","p":4,"i":2,"a":6,"t":381.0,"x":"Neither of these things would develop of itself, but anger produces murder and lust produces adultery."},{"k":"c","a":6,"t":388.0,"e":551.5,"l":[[388.0,"So basically, I think what he's referring to here is the fact that this example sets forth for us the best strategy to overcome evil in our lives and that is we must conquer it early now, I think."],[408.0,"And I wonder if he will mention this further in the text."],[412.0,"Sort of."],[413.0,"Normally I do not read ahead."],[415.0,"I, I read live with you and sort of, you know, offer you my thoughts."],[425.0,"The."],[429.0,"Psalm which is sung two Saturdays in preparation for great Lent, has this particular verse."],[437.0,"It says, O daughter of Babylon, thou wretched one, and forgive me for my English translation."],[443.0,"Maybe it's not perfect, but blessed is he who shall take thine infants and dash them against the rock."],[449.0,"And that also, if you stop and sort of try to imagine this image, it's quite horrific and of course would be considered absolutely inhumane."],[462.0,"I mean, just completely sort of unacceptable in any setting, you know, where you would take children and smash their heads against the rock."],[473.0,"What a terrible, terrible cruelty."],[475.0,"However, spiritually, once again, it basically means that we should smother the beginnings of sin right after their inception, or at inception if possible."],[488.0,"Because what happens is in, if they grow up, then of course, conquering them would be far more laborious and difficult."],[498.0,"I would probably say that in one way."],[501.0,"You know, you could say one can easily stomp a cobra or anaconda to death immediately, sort of, or even maybe while they're still in their eggs."],[517.0,"But once the cobra, especially the king cobra, grows to be, you know, sort of a full size snake and anaconda as well, well, it would be exceedingly difficult just to stump on their heads and, and crush them that way."],[530.0,"Because in one case the cobra can, can bite you, perhaps."],[533.0,"An anaconda, of course, can break your bones and altogether swallow you if you are not careful and you approach, approach it too soon."],[544.0,"In fact, take a look at this paragraph or have a listen to this."],[549.0,"Paragraph 94."]]},{"k":"s","p":5,"i":0,"a":6,"t":550.0,"x":"Since the producer of evil gives birth to lust before adultery and anger before murder, in destroying the firstborn he certainly kills along with it the offspring which follows."},{"k":"s","p":5,"i":1,"a":6,"t":560.6,"x":"Take for an example a snake:"},{"k":"s","p":5,"i":2,"a":6,"t":563.0,"x":"When one crushes his head he kills the rest of the body at the same time."},{"k":"c","a":6,"t":568.0,"e":601.5,"l":[[568.0,"So if you, if you crush the head of the snake, you kill the entire snake?"],[572.0,"Well, most definitely."],[575.0,"If you are not overcome by lust, if you're not overcome by anger, you're not going to commit adultery and you're not going to commit murder."],[584.0,"And if you are overcome by lust and anger, well, you're on your way toward murder and adultery."],[592.0,"So I think that's the parallel that he draws here and it's quite Instructive."],[597.0,"Spiritually."],[599.0,"Paragraph 95."]]},{"k":"s","p":6,"i":0,"a":6,"t":600.0,"x":"This would not have happened unless the blood which turns aside the destroyer had been poured out on our doors."},{"k":"s","p":6,"i":1,"a":6,"t":607.0,"x":"And if it is necessary to perceive the meaning presented here more fully, the history provides this perception in both the killing of the firstborn and the safeguarding of the entrance by blood."},{"k":"s","p":6,"i":2,"a":6,"t":618.0,"x":"In the one the first impulse to evil is destroyed, and in the other the first entrance of evil into us is turned away by the true Lamb."},{"k":"s","p":6,"i":3,"a":6,"t":627.0,"x":"For when the destroyer has come inside, we do not drive him out by our own devices, but by the Law we throw up a defense to keep him from gaining a foothold among us."},{"k":"c","a":6,"t":638.0,"e":647.0,"l":[[638.0,"Now I think perhaps maybe we can continue reading further to better understand what he's saying."],[644.0,"Paragraph 96."]]},{"k":"s","p":7,"i":0,"a":6,"t":646.0,"x":"Safety and security consist in marking the upper doorpost and the side posts of the entrance with the blood of the lamb."},{"k":"s","p":7,"i":1,"a":6,"t":652.0,"x":"While in this way Scripture gives us through figures a scientific understanding of the nature of the soul, profane learning also places it before the mind, dividing the soul into the rational, the appetitive, and the spirited."},{"k":"s","p":7,"i":2,"a":6,"t":668.6,"x":"Of these parts we are told that the spirit and the appetite are placed below, supporting on each side the intellectual part of the soul, while the rational aspect is joined to both so as to keep them together and to be held up by them, being trained for courage by the spirit and elevated to the participation in the Good by the appetite."},{"k":"c","a":6,"t":690.0,"e":701.0,"l":[[690.0,"So I guess he's talking about sort of the three positions where the blood is applied on the lintels and the frame of the door."],[698.0,"Paragraph 97."]]},{"k":"s","p":8,"i":0,"a":6,"t":700.0,"x":"As long, therefore, as the soul is kept safe in this manner, maintaining its firmness by virtuous thoughts as if by bolts, all the parts cooperate with one another for good."},{"k":"s","p":8,"i":1,"a":6,"t":712.9,"x":"The rational for its part furnishes safety to its supports, and in its turn receives from them an equal benefit."},{"k":"s","p":9,"i":0,"a":6,"t":722.0,"x":"But if this arrangement should be upset and the upper become the lower—so that if the rational falls from above, the appetitive and spirited disposition makes it the part trampled upon—then the destroyer slips inside."},{"k":"s","p":9,"i":1,"a":6,"t":737.0,"x":"No opposition from the blood resists his entrance; that is to say, faith in Christ does not ally itself with those of such a disposition."},{"k":"c","a":6,"t":745.6,"e":777.5,"l":[[745.6,"disposition."],[746.0,"So he's basically saying that unless all the powers, the three powers of the soul, are anointed with the blood of Christ, then the angel of death will enter the dwelling of one's soul, and it will then be in terrible, terrible, terrible sort of state when the reasoning power of the soul sort of does not have the proper place and proper rule."]]},{"k":"s","p":10,"i":0,"a":6,"t":777.0,"x":"For he says first to anoint the upper doorpost with blood, then to touch both side doorposts in the same way."},{"k":"s","p":10,"i":1,"a":6,"t":785.6,"x":"How therefore would one anoint the upper first unless it be found on top?"},{"k":"c","a":6,"t":791.0,"e":805.5,"l":[[791.0,"So basically the upper has to be on top, and that's the appetite of, I guess, part of the soul, or the reason the reasoning part of the soul should be on top."],[802.0,"Paragraph 100."]]},{"k":"s","p":11,"i":0,"a":6,"t":805.0,"x":"Do not be surprised at all if both things—the death of the firstborn and the pouring out of the blood— did not happen to the Israelites and on that account reject the contemplation which we have proposed concerning the destruction of evil as if it were a fabrication without any truth."},{"k":"s","p":11,"i":1,"a":6,"t":820.0,"x":"For now in the difference of the names, Israelite and Egyptian, we perceive the difference between virtue and evil."},{"k":"s","p":11,"i":2,"a":6,"t":826.0,"x":"Since the spiritual meaning proposes that we perceive the Israelite as virtuous, we would not reasonably require the firstfruits of virtue's offspring to be destroyed but rather those whose destruction is more advantageous than their cultivation."},{"k":"s","p":12,"i":0,"a":6,"t":848.0,"x":"Consequently we have been taught by God that we must destroy the firstfruits of the Egyptian children so that evil, in being destroyed at its beginning, might come to an end."},{"k":"s","p":12,"i":1,"a":6,"t":858.0,"x":"And this insight agrees with the history, for the protection of the Israelite children took place through the pouring out of blood in order that good might come to maturity."},{"k":"s","p":12,"i":2,"a":6,"t":867.0,"x":"But what would come to maturity in the Egyptian people was destroyed before it matured in evil."},{"k":"c","a":6,"t":875.0,"e":904.5,"l":[[875.0,"So basically he's saying that since the Israelite people represent the good, their infants were spared."],[884.0,"Basically, our good inclinations should not be smothered, they should not be repelled."],[891.0,"Only the evil inclinations should be resisted."],[895.0,"That is what he's saying."],[898.0,"The next chapter and paragraph 102."],[901.0,"The departure from Egypt."]]}]},{"t":"The Departure from Egypt","p":[[102,"What follows agrees with our spiritual understanding of the text. For Scripture requires that the body of the lamb, whose blood was displayed on the doors and separated the people from the destroyer of the firstborn, become our food."],[103,"The demeanor of those eating this food was to be intense and earnest, not like that of those who enjoy themselves at banquets, whose hands are relaxed and whose clothes are loose and whose feet are unprepared for travel. But everything was the opposite. Their feet were covered with sandals, a belt bound the clothing at the waist, and the staff to repel dogs was held in hand."],[104,"And to them in this condition was presented meat without any artfully prepared sauces but cooked upon any fire that happened to be available. The guests eagerly devoured it in great haste until the entire body of the animal was consumed. They ate whatever was edible around the bones, but they did not touch the entrails. To break the bones of this animal was one of the things forbidden. Whatever might be left of the meat was consumed by the fire."],[105,"From all this it is evident that the letter looks to some higher understanding, since the Law does not instruct us how to eat. (Nature which implants a desire for food in us is a sufficient lawgiver with regard to these things.) The account rather signifies something different. For what does it matter to virtue or vice to eat your food this way or that, to have the belt loose or tight, to have your feet bare or covered with shoes, to have your staff in your hand or laid aside?"],[106,"It is clear what the traveler's equipment figuratively stands for: It commands us explicitly to recognize that our present life is transient. Already at birth we are driven by the very nature of things toward our departure, for which we must carefully prepare our hands, feet, and the rest."],[107,"So that the thorns of this life (the thorns would be sins) may not hurt our naked and unprotected feet, let us cover them with shoes. The shoes are the self-controlled and austere life which breaks and crushes the points of the thorns and prevents sin from slipping inside unnoticed."],[108,"The tunic flowing down over the feet and reaching to the soles would be a hindrance to anyone who would diligently finish the divine course. The tunic accordingly would be seen as the full enjoyment of the pursuits of this life, which the prudent reason, like a traveler's belt, draws in as tightly as possible. The place around which the belt passes shows that it is to be understood as prudence. The staff for repelling animals is the message of hope, by which we support the weariness of the soul and ward off what threatens us."],[109,"The food placed before us from the fire I call the warm and fervent faith which we receive without having given thought to it. We devour as much of it as is easily eaten, but we leave aside the doctrine concealed in the thoughts which are hard and tough without investigating it thoroughly or seeking to know more about it. Instead we consign this food to the fire."],[110,"In order that these figures may be made clear, let us explain that whichever of the divine commands are readily perceived should not be followed sluggishly or by constraint, but we should be like those who are hungry and eagerly fill up on the things set before them, so that the food may become provision for our well-being. But such thoughts as are beyond our understanding—like the questions, What is the essence of God? What was there before the creation? What is there outside the visible world? Why do things which happen happen? and other such things as are sought out by inquiring minds —these things we concede to know only by the Holy Spirit, who reaches the depths of God, as the Apostle says."],[111,"Anyone instructed in the Scriptures surely knows that instead of \"Spirit\" Scripture often thinks of it and designates it as \"fire.\" We are also led to this understanding by the announcement of Wisdom: Do not try to understand things that are too difficult for you, that is to say, Do not break the bones of Scripture, foryou have no need [to see with your eyes] those things that are hidden."]],"id":"b2-8","r":[102,111],"w":737,"x":[{"k":"s","p":0,"i":0,"a":6,"t":903.0,"x":"What follows agrees with our spiritual understanding of the text."},{"k":"s","p":0,"i":1,"a":6,"t":906.0,"x":"For Scripture requires that the body of the lamb, whose blood was displayed on the doors and separated the people from the destroyer of the firstborn, become our food."},{"k":"s","p":1,"i":0,"a":6,"t":918.0,"x":"The demeanor of those eating this food was to be intense and earnest, not like that of those who enjoy themselves at banquets, whose hands are relaxed and whose clothes are loose and whose feet are unprepared for travel."},{"k":"s","p":1,"i":1,"a":6,"t":930.0,"x":"But everything was the opposite."},{"k":"s","p":1,"i":2,"a":6,"t":932.0,"x":"Their feet were covered with sandals, a belt bound the clothing at the waist, and the staff to repel dogs was held in hand."},{"k":"c","a":6,"t":942.0,"e":1234.0,"l":[[942.0,"God commanded Moses to tell the Israelite people essentially to eat the Passover as though they were ready for their journey, to eat it fully dressed, not sort of relaxing, not."],[956.0,"And that, in a way, really, I think, also has a certain significance to the modern day liturgy, or, you know, the liturgy, since it was celebrated essentially, you know, by the apostles in that the very partaking of the body and blood of Christ is not just another meal."],[977.0,"We prepare for it with prayer and fasting."],[979.0,"We come to church, we are sober."],[983.0,"As much as it is possible, we are fasting."],[987.0,"We are."],[989.0,"And especially in the Russian Orthodox tradition, we have gone to confession before receiving Holy Communion."],[995.0,"So we receive the Holy Communion sort of ready for our journey."],[1000.0,"And you might actually say the Israelites were ready to leave Egypt and we approached the Holy Communion."],[1010.0,"And here we should really sort of stop and think about the way that we approach the chalice, the way that we should prepare for it."],[1024.0,"We often are aware of the fact that everyone wants to confess and receive Holy Communion shortly before his death so as to depart this life prepared."],[1038.0,"But I think it might actually be a sobering idea and a sobering thought to consider the fact that every preparation for Holy Communion is our preparation for the journey, so that having partaken Communion, we can depart this life."],[1058.0,"That puts things in a different perspective, I think, for many of us, because most often we prepare for Holy Communion just that we prepare for Holy Communion with a full sort of knowledge and expectation that life will continue, we'll be doing other things, and so on and so forth."],[1075.0,"And only those who are near death, they're thinking of communion as sort of the final and last preparation for them to stand before God."],[1082.0,"But life is fleeting, and none of us knows when our last day will be."],[1088.0,"And perhaps if we prepare to every Communion as if it were our last, would actually give us a much healthier and better perspective."],[1097.0,"I mean, that is definitely something that I will try to sort of keep in mind, moving forward for at least, you know, sort of next while to contemplate, even when we finish this reading tonight, preparing for Communion, preparing for the very first time that the Passover lamb was sacrificed and then eaten by the Israelites."],[1123.0,"They prepared for the departure from Egypt."],[1126.0,"And in some way, you might say that this life for us is also somewhat the representation of Israel being in Egypt, being in captivity."],[1139.0,"We are in captivity of sin here."],[1144.0,"The life to come, hopefully the life with God, the life in the kingdom of Heaven, would be like the life in the Promised Land for the Israelites."],[1152.0,"And so in that sense, that's."],[1154.0,"That's definitely something very, very interesting and worthy of contemplating for a number of days, I would say, or perhaps even maybe really, that's the very good thought to keep in mind always, especially when we prepare for Holy Communion."],[1174.0,"So I'm basically turning things, you know, doing a 180."],[1179.0,"It's not that we should hope and pray that, you know, we could confess and receive Holy Communion before death."],[1188.0,"We should actually think of each and every preparation for Holy Communion as potentially being the last one."],[1195.0,"And as such, how would we prepare?"],[1197.0,"Everybody thinks, well, when I'm dying, I will be very thorough."],[1200.0,"I'll be, you know, I'll definitely, definitely sort of, you know, be very fervent in my prayers."],[1206.0,"And for the majority of times that is the case."],[1210.0,"When the person is aware that the time is coming and the time is near, the person is definitely sort of putting things in much better perspective."],[1219.0,"But I think considering that each Communion could be our last is definitely a very spiritually, a very helpful perspective."],[1231.0,"Paragraph 104."]]},{"k":"s","p":2,"i":0,"a":6,"t":1233.0,"x":"And to them in this condition was presented meat without any artfully prepared sauces but cooked upon any fire that happened to be available."},{"k":"s","p":2,"i":1,"a":6,"t":1241.0,"x":"The guests eagerly devoured it in great haste until the entire body of the animal was consumed."},{"k":"s","p":2,"i":2,"a":6,"t":1247.0,"x":"They ate whatever was edible around the bones, but they did not touch the entrails."},{"k":"s","p":2,"i":3,"a":6,"t":1252.0,"x":"To break the bones of this animal was one of the things forbidden."},{"k":"s","p":2,"i":4,"a":6,"t":1256.0,"x":"Whatever might be left of the meat was consumed by the fire."},{"k":"c","a":6,"t":1259.7,"e":1324.0,"l":[[1259.7,"fire."],[1260.0,"So basically, whatever was left was burned in the fire, was consumed in the fire."],[1265.0,"And of course, to those of you who are not clergy, who might be reading with us and watching now, surely and hopefully you know that in the Orthodox Church, every time that we serve liturgy and we have the Holy Communion, the contents of the chalice are most carefully consumed by the deacon or the priest, whoever is serving at that liturgy."],[1291.0,"And nothing is just left, you know, or poured out or sort of disposed in any other way."],[1298.0,"But everything is consumed very thoroughly."],[1300.0,"The chalice is washed very thoroughly."],[1303.0,"The antiments, sort of the cloth upon which we serve the Holy Liturgy also is thoroughly examined for the smallest crumbs, and everything is consumed."],[1313.0,"So nothing of the Lamb of God, of Christ, of his body and blood, is left."],[1319.0,"But behind ever."],[1322.0,"Paragraph"]]},{"k":"s","p":3,"i":0,"a":6,"t":1323.0,"x":"From all this it is evident that the letter looks to some higher understanding, since the Law does not instruct us how to eat."},{"k":"s","p":3,"i":1,"a":6,"t":1330.9,"x":"(Nature which implants a desire for food in us is a sufficient lawgiver with regard to these things.) The account rather signifies something different."},{"k":"s","p":3,"i":2,"a":6,"t":1339.0,"x":"For what does it matter to virtue or vice to eat your food this way or that, to have the belt loose or tight, to have your feet bare or covered with shoes, to have your staff in your hand or laid aside?"},{"k":"c","a":6,"t":1353.0,"e":1397.6,"l":[[1353.0,"So he's basically saying here that God does not sort of attach a divine commandment as to how to eat for the maintenance of our physical and bodily life."],[1370.0,"I mean, we have fasting and that sort of to some extent prescribes, you know, what foods we abstain from and so on."],[1378.0,"But in this particular case, it's quite interesting that of this lamb, we are told how to eat it, to eat it with haste, to be ready, have our loins girt, you know, our sandals on our shoes, the staff in hand, paragraph 106."]]},{"k":"s","p":4,"i":0,"a":6,"t":1396.0,"x":"It is clear what the traveler's equipment figuratively stands for:"},{"k":"s","p":4,"i":1,"a":6,"t":1399.4,"x":"It commands us explicitly to recognize that our present life is transient."},{"k":"s","p":4,"i":2,"a":6,"t":1403.9,"x":"Already at birth we are driven by the very nature of things toward our departure, for which we must carefully prepare our hands, feet, and the rest."},{"k":"c","a":6,"t":1413.3,"e":1451.5,"l":[[1413.3,"basically he's saying, well, yes, you know, when we receive Holy Communion, we should be thinking about death, just the very thing that I mentioned earlier."],[1422.0,"And from the very beginning of our life, we know by the time that's fleeting and by the way that we change."],[1429.0,"We don't become younger, we become older, we turn gray, we have wrinkles appear in our faces, our skin changes and so on."],[1436.0,"Our strength fails."],[1439.0,"And all of that more or less reminds us that our life here is temporary."],[1445.0,"It will come to an end."],[1446.0,"For sure."],[1447.0,"For sure."],[1449.0,"Paragraph 107."]]},{"k":"s","p":5,"i":0,"a":6,"t":1450.0,"x":"So that the thorns of this life (the thorns would be sins) may not hurt our naked and unprotected feet, let us cover them with shoes."},{"k":"s","p":5,"i":1,"a":6,"t":1458.4,"x":"The shoes are the self-controlled and austere life which breaks and crushes the points of the thorns and prevents sin from slipping inside unnoticed."},{"k":"c","a":6,"t":1468.0,"e":1858.4,"l":[[1468.0,"Well, that's a very sort of good analogy and perhaps maybe we should break it down a little more."],[1477.0,"So if he considers sin to be thorns and thistles or barbs, the shoes, he says, are, you know, the austere and self controlled life which would crush those."],[1495.0,"And then the soul, which is hardened, you know, basically is like a habit of virtue that's hardened."],[1503.0,"So the more a person practices a virtuous life, the harder the soles, sort of the shoes of that person become."],[1514.0,"And I might add that if you've ever been in shoe stores that sell shoes for construction workers and people who work at construction sites, there is, or in sometimes in various shops, there is such a thing as steel toed shoes as well."],[1533.0,"And you know, there's a piece of steel that basically protects the toes, so that if something heavy like a piece of machinery or equipment falls on one's foot, it would not crush the toes, it would actually, they would actually be protected."],[1546.0,"So you might say that a pious life is the similar protection from accidental sins."],[1552.0,"A person who makes it a habit not to look at other women wantonly and frivolously not going to be tempted in the same way as the person who's constantly looking for an opportunity to sin."],[1566.0,"If someone's constantly looking for a good looking or, you know, sort of a appealing person,."],[1574.0,"Well,."],[1577.0,"When that person appears and actually tries to entice such an individual, it would be quite easy."],[1583.0,"However, if the person practices purity and if the person is married fidelity, then it's, it's as if there's a certain amount of protection."],[1596.0,"And the more resolution to this practice of piety, the harder the protection."],[1604.0,"So imagine you're stepping on the nail like a huge, huge, huge temptation."],[1609.0,"If you're wearing Keds or some kind of very light sold sports shoes, the nail go, go right through your foot."],[1617.0,"And I don't know if you have, but unfortunately I've actually seen it happen to a friend of mine in my childhood."],[1624.0,"We were playing, running around and he stepped on a board that had a very large nail sort of sticking upward."],[1631.0,"And because the shoe had a sole which was very, very soft, the nail went right through and it came right up at the top of his foot, foot."],[1640.0,"And of course, you know, he had to get a tetanus shot and the whole, you know, matter was very, very painful."],[1645.0,"And, and sorry, I mean, just imagine having to put the nail, pull it out of your foot and so on."],[1654.0,"That's an image of a person who has not made it a customary practice to practice virtue."],[1662.0,"Hence there is no protection."],[1665.0,"The more the person practices virtue, you could say, the harder the soul is."],[1670.0,"And for some of the saints, you know, you'd say yes, they had sort of steel plates in their souls and steel covers over their toes."],[1679.0,"So that when certain temptations came to them, and I remember one saint in particular stands out in my mind."],[1685.0,"I believe his memory is some time during the period of great Lent."],[1689.0,"I can't remember his name exactly, but when a woman bet with some sort of frivolous young man that she would make him sin, she made it a point sort of to get inside his monastic cell."],[1704.0,"She came and she cried and said that, you know, he lived out in the desert."],[1708.0,"She said, oh, wild animals will eat me here."],[1711.0,"You know, what kind of a Christian are you?"],[1713.0,"What kind of a person are you?"],[1714.0,"So she manipulated him to let her in."],[1717.0,"He let her in into the foyer, sort of the first room of his monastic residence."],[1723.0,"Kept inside."],[1724.0,"He kept himself inside, kept her sort of in the entrance way."],[1729.0,"She kept Complaining that she would freeze to death, you know, and otherwise, you know, would still be assaulted there, and that she needed to be warmed by the fire."],[1738.0,"So eventually he let her in because she kept not manipulating him, you know, sort of pressing him that, you know, what kind of a Christian are you?"],[1746.0,"You know, I'm just going to freeze to death here."],[1747.0,"You're going to come out here in the morning and find my poor, cold, dead body."],[1752.0,"He let her in."],[1753.0,"Once she came in, once she started warming by the fire, she started undressing herself and trying, you know, in many sort of ways to seduce him."],[1762.0,"And I can't remember whether he did it over a candle or literally just over the fire in his cell, but he burned all the fingers on his left hand off, completely down to nubs, trying to resist temptation and sort of bring his focus to the pain in his body rather than the potential pleasure that he could receive from this woman."],[1786.0,"And he did not sin that way."],[1788.0,"So it cost him a tremendous effort."],[1791.0,"But in his practice, yes, he."],[1794.0,"He was able to withstand such a terrible temptation because he practiced the life of virtue and was willing to sacrifice his flesh in order to protect himself from sin."],[1805.0,"I'm not saying that the rest of us should go and follow his example literally."],[1810.0,"Of course not."],[1811.0,"Hopefully God would protect us and would not let us be tempted in such a way."],[1817.0,"We also see the same example, actually in the scripture in the life of Joseph, sort of the very person who ended up bringing Israel into Egypt."],[1827.0,"When the wife of Potiphar sort of enticed him to sin, he chose rather to flee away from her without his outer garments and to be imprisoned by false accusations rather than to commit sin."],[1841.0,"So you could say also that, you know, the sole of his shoe was horrible, hard enough to crush the."],[1847.0,"The thistles and the thorns of the lustful suggestion of Potiphar's wife, of the sinful woman, paragraph 108."]]},{"k":"s","p":6,"i":0,"a":6,"t":1857.0,"x":"The tunic flowing down over the feet and reaching to the soles would be a hindrance to anyone who would diligently finish the divine course."},{"k":"s","p":6,"i":1,"a":6,"t":1866.0,"x":"The tunic accordingly would be seen as the full enjoyment of the pursuits of this life, which the prudent reason, like a traveler's belt, draws in as tightly as possible."},{"k":"s","p":6,"i":2,"a":6,"t":1877.0,"x":"The place around which the belt passes shows that it is to be understood as prudence."},{"k":"s","p":6,"i":3,"a":6,"t":1882.0,"x":"The staff for repelling animals is the message of hope, by which we support the weariness of the soul and ward off what threatens us."},{"k":"c","a":6,"t":1890.0,"e":1936.5,"l":[[1890.0,"So basically, I think what he's saying here is people who are not ready to travel in Those days especially because there are no paved roads there in Egypt at all."],[1903.0,"So if you're traveling, you would gird your loins, you would actually sort of lift the edges of your tunic so that it would not be cut, sort of cut, caught, sorry, well, uncut also, perhaps by thorns and thistles of the."],[1920.0,"Of the weight."],[1922.0,"So you would gird it sort of to show your intention to walk, to travel."],[1929.0,"And he says that the staff here is, is the message of hope."],[1934.0,"Paragraph 109."]]},{"k":"s","p":7,"i":0,"a":6,"t":1935.0,"x":"The food placed before us from the fire I call the warm and fervent faith which we receive without having given thought to it."},{"k":"s","p":7,"i":1,"a":6,"t":1944.0,"x":"We devour as much of it as is easily eaten, but we leave aside the doctrine concealed in the thoughts which are hard and tough without investigating it thoroughly or seeking to know more about it."},{"k":"s","p":7,"i":2,"a":6,"t":1955.0,"x":"Instead we consign this food to the fire."},{"k":"c","a":6,"t":1958.0,"e":2688.0,"l":[[1958.0,"Now, this is something that I think is worth stopping on, because."],[1971.0,"Whatever is difficult for us to grasp sort of mentally and reasonably when it comes to our faith, the Church possesses the fullness of our faith."],[1985.0,"And many saints have expounded things and the sort of the aspects and the elements of our faith that might actually be very difficult for us to grasp and understand."],[1996.0,"And what St. Gregory here says that drawing from the image of the Passover meal where they ate that part of the meat which was easily accessible, and the rest of it they burned in the fire, they just sort of left with God because putting it in a fire essentially is sort of giving it back to God."],[2017.0,"Well, I think that's very, very crucially important for modern day people."],[2025.0,"Many people fall into false teachings, into, into heretical beliefs because they continued sort of pressing for things that are hard to understand and they're trying to figure them out."],[2040.0,"And I just recently had a conversation with someone who was preparing for baptism and we were talking about the fact that one of the Holy Fathers once, I think in sort of the Egyptian desert, in the Thabad or maybe in Nitria, came upon the younger monks and they looked at him and they said, you know, he was already a great saint and a sort of very mature man."],[2065.0,"And they looked at him and they said, I can't remember he was Mardari or what his name was."],[2070.0,"I'm terrible with those things."],[2072.0,"I sort of remember the essence of what happened, but I don't remember some of the minute details."],[2077.0,"At any rate, they looked at him and they said, father, here we are talking about Melchizedek and his origin, where he came from."],[2085.0,"Would you like to give us your opinion?"],[2088.0,"Would you tell us about Melchizedek?"],[2090.0,"And he looked at them and I think, crossed himself and said, woe unto you, Margarius, or, you know, or whatever his name was."],[2097.0,"For you have abandoned your own repentance and taken up with things, you know, that do not pertain to you."],[2108.0,"And saying that he communicated not only to his contemporaries and sort of the participants of that particular conversation, the younger monks, but also to all of us, really, that there are things in our faith which we must sort of accept in all humility."],[2125.0,"If this is the way the Church teaches, we accept it, we don't question it, we don't."],[2131.0,"So to try to break it up and examine it and sort of, you know, we don't attempt to do forensic examination of them simply because it's not our place to do that."],[2147.0,"It's not our time to do that."],[2149.0,"And we know that in some cases, saints that have achieved greater purity of soul, greater purity of prayer were given by God."],[2165.0,"The revelations which they have recorded and which they have in some cases sort of left to their disciples and to the rest of the Church as part of that explanation of the more difficult doctrines."],[2182.0,"But they were great people who did that."],[2185.0,"Now, some of us are not very great."],[2188.0,"Do we need to have sort of the same amount of the intellectual faith to obtain salvation, sort of to enter the promised land?"],[2199.0,"No."],[2200.0,"Think of the Israelites who did not perhaps have direct revelation from God to them."],[2209.0,"Well, in fact, the overwhelming majority of them didn't."],[2214.0,"We know that God did not appear to them and speak to them."],[2217.0,"He spoke to Moses, and he chose Moses to lead his people."],[2222.0,"And God continues to work in the same way."],[2226.0,"The Lord did not sort of appoint every single hearer of his teaching to be an apostle."],[2235.0,"He chose 12."],[2237.0,"And these 12 he sent throughout the world."],[2239.0,"And then they had their own disciples and so on."],[2242.0,"And."],[2242.0,"And then later, St. Paul in one of his writings, says, for God is given unto church, some as apostles, others as teachers, others as prophets, others as healers and so on."],[2255.0,"Everyone has his own purpose."],[2257.0,"And so for the overwhelming majority of people, we don't have to have sort of that intricate detail at the forensic level, the knowledge sort of on the molecular level."],[2272.0,"All we need to know is that this is the Church's teaching."],[2276.0,"God did not have to speak to every single Israelite and say, well, you should follow Moses, you know, and appear to every single one of them."],[2283.0,"He appeared to Moses."],[2285.0,"He gave Moses the signs, his hand, which turned sort of leprous and back to healthy."],[2292.0,"The staff that turned into a snake."],[2294.0,"He worked many other miracles that the rest of the Israelites could see, but he spoke only directly through Moses."],[2301.0,"And then Moses was the one that gave them the law."],[2305.0,"So God revealed his law to Moses, and then through Moses, it was given unto them."],[2310.0,"And I think that's very, very, very important because it is quite disturbing when a regular lay person who is not an expert in theology sort of tries to undertake the pains of understanding, deciphering, you might say, what's the word?"],[2332.0,"Sort of digesting, you know, inwardly things that are too lofty and too difficult to comprehend, there can be tremendous damage."],[2343.0,"Just like if you don't have the stomach that actually digests bones, if you swallow a bone, it can get stuck in your throat, you can suffocate."],[2350.0,"If it goes further, in some cases, if it's especially sort of like a needle, like very sharp bone, it can puncture your intestines and wreak havoc and kill you."],[2362.0,"Well, in a similar way, trying to grasp things that are too lofty for our humble position is extremely unwise."],[2373.0,"And why is that?"],[2374.0,"Well, think of it this way."],[2376.0,"Who are the authors of all the spiritual writings?"],[2380.0,"They're not even married clergy."],[2381.0,"They're mostly the monastics."],[2383.0,"Why?"],[2383.0,"Because the monastics sort of, if you had a scale of human strength or power or sort of the ability to focus, you know, sort of one's efforts, if you had a particular scale."],[2402.0,"Well, what is the scale?"],[2406.0,"Sort of the part of that scale that a monastic spends on spiritual struggles, on sort of drawing closer to God, maybe 2/3, another third for, you know, cleaning, eating, and so on and so forth."],[2419.0,"Now, on that same scale, take a layperson who has a 9 to 5 job."],[2425.0,"And especially in modern day world, so many jobs require us to work more or lay people to work more than 40 hours."],[2434.0,"Quite a few of our parishioners sometimes work 10."],[2437.0,"Some people work 12 hours a day."],[2440.0,"Then they have a family, so they might have children."],[2443.0,"And if you have one or two, it's one thing."],[2446.0,"If you have more than two children, you know, you."],[2449.0,"So now all of your attention in your effort, you know, your job takes this much, the marriage takes this much, the children takes this much."],[2457.0,"And so you have only so much really sort of to focus on your life with God, on prayer and fasting and reading the Holy Scriptures."],[2467.0,"It's a relatively small part."],[2470.0,"Well, how do you purport with that small part?"],[2474.0,"Sort of to receive the great revelations of God and to understand great mysteries and to have great insights."],[2483.0,"That's why we Consider certain people who are very successful in some ways to be professionals."],[2490.0,"They spend a great deal of their time on that particular thing."],[2494.0,"And in fact, I would say most likely that same layperson is way better, let's just say, than a monk or a priest at his lay occupation."],[2508.0,"As a priest, I wouldn't begin to know what to do in a courtroom, whereas a lawyer would know exactly the procedure, the various sort of criminal and penal codes and so on and so forth."],[2523.0,"Similarly, in the hospital, a nurse would know her way around, would know her way around medicine and the various medical appliances, sciences way better because she spends more time doing that at church."],[2537.0,"The priests, the monastics, we spend more time, you know, sort of studying the law of God, reading it."],[2543.0,"And even then, we don't claim."],[2544.0,"All of us don't claim to have these revelations from God and great knowledge."],[2552.0,"Think of it as a sort of the Olympian sport, the Olympics."],[2558.0,"It's a very small group of athletes who are actually at that level."],[2564.0,"Many other people go to the gym on a regular basis, but they don't exhibit the same results because they don't have the same determination."],[2572.0,"They don't have the same dedication."],[2573.0,"They can't afford it in some cases."],[2575.0,"And, you know, sometimes certain things are incompatible."],[2580.0,"You can be sort of the best Olympic something rather, and, you know, the best car salesman."],[2589.0,"At the same time, perhaps, you know, because one thing requires your attention at the same time as."],[2595.0,"As does the other."],[2596.0,"And I think that is something that's."],[2599.0,"That's very important."],[2601.0,"They ate what was possible, and the rest they burned in the fire."],[2604.0,"In a similar way, when you come to church, when you say your prayers, if there's something you don't understand, accept the teaching of the church, don't question it."],[2614.0,"And I don't mean it sort of, you know, blindly following everything that your local priest tells you or, you know, even a bishop."],[2622.0,"Obviously we should have an understanding of what our church's teachings are."],[2627.0,"We should have some understanding of what our beliefs are, you know, what the church taught at the councils and so on."],[2634.0,"Because sometimes as clergy, sort of those who are your contemporaries, who are living at the same time and who are charged with protecting and keeping the faith, we might make a mistake, we might sort of misstep somewhere."],[2647.0,"And in some cases, in fact, when the clergy failed, the monastics and the laity were the ones who sort of came up and said, no, no, no, no, we must keep the faith the way it is."],[2660.0,"We must keep the faith of the fathers."],[2662.0,"So for certain, that's the case, but everything within proper perspective and within proper limitation."],[2670.0,"Now I think there's exactly just one more paragraph and it would start a new page."],[2675.0,"So perhaps we could finish for the night paragraph 110."],[2682.0,"Let's see."],[2686.0,"Yes,"]]},{"k":"s","p":8,"i":0,"a":6,"t":2686.4,"x":"In order that these figures may be made clear, let us explain that whichever of the divine commands are readily perceived should not be followed sluggishly or by constraint, but we should be like those who are hungry and eagerly fill up on the things set before them, so that the food may become provision for our well-being."},{"k":"s","p":8,"i":1,"a":6,"t":2705.0,"x":"But such thoughts as are beyond our understanding—like the questions, What is the essence of God?"},{"k":"s","p":8,"i":2,"a":6,"t":2712.0,"x":"What was there before the creation?"},{"k":"s","p":8,"i":3,"a":6,"t":2715.0,"x":"What is there outside the visible world?"},{"k":"s","p":8,"i":4,"a":6,"t":2719.0,"x":"Why do things which happen happen? and other such things as are sought out by inquiring minds —these things we concede to know only by the Holy Spirit, who reaches the depths of God, as the Apostle says."},{"k":"c","a":6,"t":2733.0,"e":2743.2,"l":[[2733.0,"And I think we will read the next paragraph because that will actually sort of bring the chapter to an end."],[2739.0,"And in the next paragraph, 1:11, he"]]},{"k":"s","p":9,"i":0,"a":6,"t":2742.3,"x":"Anyone instructed in the Scriptures surely knows that instead of \"Spirit\" Scripture often thinks of it and designates it as \"fire.\" We are also led to this understanding by the announcement of Wisdom:"},{"k":"s","p":9,"i":1,"a":6,"t":2754.0,"x":"Do not try to understand things that are too difficult for you, that is to say, Do not break the bones of Scripture, foryou have no need [to see with your eyes] those things that are hidden."},{"k":"c","a":6,"t":2766.0,"e":3095.7,"l":[[2766.0,"Well, there's a tremendous amount of healthy humility here, I think that St. Gregory advises us to keep and I, I definitely think that."],[2776.0,"And especially really sort of, even with my own limited experience, I'm a fairly young priest, although, you know, I I've served for over 20 years."],[2788.0,"I would say that nothing good really ever comes from sort of entertaining too eagerly those very difficult questions."],[2797.0,"It is better just to accept those and to focus our attention on the things which are readily available."],[2804.0,"And I would say that also since we're talking about food and sort of consuming of the lamb, of the Paschal lamb, eating the accessible flesh, burning the bones in the fire."],[2820.0,"Think of it this way."],[2821.0,"There's another very good sort of food allegory or food comparison that seems St. Paul gives us, which I think could also sort of explain why some of the saints were able to meet eat sort of closer to the bones or even sort of like more of the harder parts of the Paschal lamb, meaning like they understood greater things because St. Paul says infants drink milk and sort of, he says, and grown ups eat meat because, you know, their teeth now are stronger."],[2852.0,"So, so when they grow up, they sort of start eating meat, but not until they finished sort of, you know, with the mother's milk and so on and so forth, no infant born is ever given a steak sort of right there at the hospital or at home, you know, where he's born."],[2870.0,"Most likely, the very first steak the child is going to eat is probably going to be around four or five years, maybe older, in some cases, maybe younger."],[2880.0,"And even then the parents would probably cut it up and chop it up so that it would be easier for a child to chew, because meat is hard to chew, even if it's, you know, soft, and so on and so forth."],[2890.0,"And for the steak, you know, we use a knife and a fork to cut it up into smaller pieces and then."],[2896.0,"And then we eat it."],[2898.0,"So in a similar way, spiritually, I would say sort of in conclusion, if we nourish ourselves properly on the milk of faith, that is to say, if we teach ourselves to fulfill on a regular basis, properly fulfill the lesser commandments of our faith, the lesser expectations, if we make a habit of those virtues which are easily accessible to us, such as forgiving others, you know, being kind, not judging, and so on, if we manage those, then perhaps God would give us the tougher food, the stronger food, and we would have some sort of revelation."],[2941.0,"But if we are still sort of, spiritually speaking, like little children with milk teeth, well, we should really not reach for the steak and for, you know, hard nuts and various sort of things that are such lofty thoughts."],[2954.0,"We should eat the food which is soft."],[2957.0,"And in."],[2958.0,"In some cases, I know, for example, when I, even as a child, when I had already started eating some of the harder food, I had my appendix removed."],[2968.0,"And when I had my appendix removed, definitely the surgeon and the doctors at the hospital adjusted my diet."],[2975.0,"And for quite some time, I couldn't eat very solid foods."],[2978.0,"Some people who have sort of, you know, surgeries that are abdominal or, you know, any."],[2984.0,"Anything to do with their digestive tract are then sort of consigned to eating softer foods."],[2993.0,"You know, they can maybe eat, like, only Jello and pudding and, you know, sort of drink liquids."],[2998.0,"And the various foods are given to them, blended so that they can still get the nutrients, but they don't really have their."],[3006.0,"Their organism isn't capable of processing harder foods."],[3011.0,"Well, I would say perhaps, maybe if a person has committed a grievous sin or has had a spiritual mishap, something has happened or even some external trauma happened to that person, turn around and try to sort of grasp some lofty aspects which would be considered hard food spiritually could actually lead to disastrous results, and I'm very grateful that we were able to touch on that."],[3040.0,"So anyways, with that, let us, I guess we could just maybe sing the prayer to the Mother of God at the end."],[3049.0,"And God willing, we can continue next week and read more of this wonderful book by St. Gregory of Nyssa."],[3059.0,"It is truly me to bless thee that thou art O Kos, ever blessed and most blameless and Mother of our God, more honourable than the cherubim and beyond compare, more glorious than the Seraphim, who without corruption gave his birth to God the Word, the very Theotoka Sadir we magnify."],[3080.0,"God bless all of you."],[3081.0,"Please keep me a sinner in your prayers."],[3084.0,"I hope that everything is going well with everyone."],[3087.0,"I thank you for your support and God willing, we will continue next week."]]}]},{"t":"The Wealth of Egypt","p":[[112,"Thus Moses led the people out of Egypt, and everyone who follows in the steps of Moses in this way sets free from the Egyptian tyrant all those guided by his word. Those who follow the leader to virtue must, I think, not lack the wealth of Egypt or be deprived of the treasures of the foreigners, but having acquired all the property of their enemies, must have it for their own use. This is exactly what Moses then commanded the people to do."],[113,"No one who has listened to this carelessly would accept the advice of the lawgiver if he enjoined those in want to rob and so became a leader in their wrongdoing. If someone looks to the laws which follow, which from beginning to end forbid wrongdoing to one's neighbor, he could not truthfully say that the lawgiver commanded these things, even though to some it seems reasonable that the Israelites should have exacted the wages for their work from the Egyptians by this device."],[114,"Yet there is no less ground for complaint; this justification does not purify such a command of falsehood and fraud, for the person who borrows something and does not repay the lender is deceitful. If he borrows something not belonging to him, he does wrong because he commits fraud. But even if he should take what is rightly his own he is still correctly called a deceiver since he misleads the lender into hoping that he will be repaid."],[115,"The loftier meaning is therefore more fitting than the obvious one. It commands those participating through virtue in the free life also to equip themselves with the wealth of pagan learning by which foreigners to the faith beautify themselves. Our guide in virtue commands someone who \"borrows\" from wealthy Egyptians to receive such things as moral and natural philosophy, geometry, astronomy, dialectic, and whatever else is sought by those outside the Church, since these things will be useful when in time the divine sanctuary of mystery must be beautified with the riches of reason."],[116,"Those who treasured up for themselves such wealth handed it over to Moses as he was working on the tent of mystery, each one making his personal contribution to the construction of the holy places. It is possible to see this happening even now. For many bring to the Church of God their profane learning as a kind of gift: Such a man was the great Basil, who acquired the Egyptian wealth in every respect during his youth and dedicated this wealth to God for the adornment of the Church, the true tabernacle."]],"id":"b2-9","r":[112,116],"w":434,"x":[{"k":"c","a":7,"t":3.0,"e":106.6,"l":[[3.0,"In the name of the Father and of the Son and of the Holy Spirit."],[5.0,"Amen."],[6.0,"Dear friends, forgive me for my tardiness for a couple of minutes."],[12.0,"Let us pray and we will continue our reading of the wonderful book by St. Gregory of Nyssa of the life of Moses."],[34.0,"Thou didst ascend into glory of Christ our God, having glad on thy disciples by the promise of the Holy Spirit and this blessing, convince them that thou art the Son of God, the Redeemer of the world."],[52.0,"Sorry if my hands went ever so slightly off, offline there, off center."],[63.0,"Having been doing my sort of singing from a screen which is not on the phone, having to hold the phone and make sure that it's done right, it gets a bit tricky ever so slightly."],[83.0,"At any rate, I know for me, this book has already given quite a good bit of very useful spiritual insights."],[95.0,"And I hope."],[96.0,"I hope so that it would do the same for you as well."],[100.0,"So we're beginning the new chapter, the wealth of Egypt, in paragraph 1:12."]]},{"k":"s","p":0,"i":0,"a":7,"t":105.0,"x":"Thus Moses led the people out of Egypt, and everyone who follows in the steps of Moses in this way sets free from the Egyptian tyrant all those guided by his word."},{"k":"s","p":0,"i":1,"a":7,"t":115.0,"x":"Those who follow the leader to virtue must, I think, not lack the wealth of Egypt or be deprived of the treasures of the foreigners, but having acquired all the property of their enemies, must have it for their own use."},{"k":"s","p":0,"i":2,"a":7,"t":127.0,"x":"This is exactly what Moses then commanded the people to do."},{"k":"c","a":7,"t":132.0,"e":242.7,"l":[[132.0,"Now, we know that Moses did command the people, of course, at the instruction of God, that they take the gold and silver jewelry from their neighbors, and essentially, you know, they were not going to return it, unfortunately."],[151.0,"But you might say that maybe symbolically, they perceived that to be some sort of payment for the years of slavery that they had endured."],[162.0,"And."],[165.0,"I think perhaps quite beautifully here, St. Gregory, as we read on, will talk about how a person who wants to be free from the Egyptian slavery, from."],[177.0,"Free from the life of sin, nevertheless should take the riches from that life, from that land, and use them in order to achieve the inheritance of the promised land, in order to sort of reach the promised land."],[197.0,"And of course, I think in this particular case, we could say that certain life skills, certain amount of education that we can get from secular philosophers may be useful even as we embark upon the life of holiness."],[214.0,"Although, of course, we have to keep in mind that St. Paul says that the wisdom of this world is foolishness before God, for certain."],[225.0,"Although some of it may actually come in quite handy in various aspects of our spiritual life."],[235.0,"So we can draw a bit of a parallel there as well."],[240.0,"Paragraph 1 13."]]},{"k":"s","p":1,"i":0,"a":7,"t":241.0,"x":"No one who has listened to this carelessly would accept the advice of the lawgiver if he enjoined those in want to rob and so became a leader in their wrongdoing."},{"k":"s","p":1,"i":1,"a":7,"t":252.0,"x":"If someone looks to the laws which follow, which from beginning to end forbid wrongdoing to one's neighbor, he could not truthfully say that the lawgiver commanded these things, even though to some it seems reasonable that the Israelites should have exacted the wages for their work from the Egyptians by this device."},{"k":"s","p":2,"i":0,"a":7,"t":270.5,"x":"Yet there is no less ground for complaint; this justification does not purify such a command of falsehood and fraud, for the person who borrows something and does not repay the lender is deceitful."},{"k":"s","p":2,"i":1,"a":7,"t":284.0,"x":"If he borrows something not belonging to him, he does wrong because he commits fraud."},{"k":"s","p":2,"i":2,"a":7,"t":289.0,"x":"But even if he should take what is rightly his own he is still correctly called a deceiver since he misleads the lender into hoping that he will be repaid."},{"k":"c","a":7,"t":300.0,"e":309.3,"l":[[300.0,"So St. Gregory here says, basically, there's no justification for their actions."],[306.0,"Paragraph 1 15."]]},{"k":"s","p":3,"i":0,"a":7,"t":308.0,"x":"The loftier meaning is therefore more fitting than the obvious one."},{"k":"s","p":3,"i":1,"a":7,"t":312.0,"x":"It commands those participating through virtue in the free life also to equip themselves with the wealth of pagan learning by which foreigners to the faith beautify themselves."},{"k":"s","p":3,"i":2,"a":7,"t":324.0,"x":"Our guide in virtue commands someone who \"borrows\" from wealthy Egyptians to receive such things as moral and natural philosophy, geometry, astronomy, dialectic, and whatever else is sought by those outside the Church, since these things will be useful when in time the divine sanctuary of mystery must be beautified with the riches of reason."},{"k":"c","a":7,"t":344.0,"e":600.3,"l":[[344.0,"So what he's saying here is that I think by dialectic he basically means sort of the art of rhetoric and conversation, and making one's point."],[354.0,"And proving one's point, of course, will be quite useful in time."],[359.0,"When a believer has to make clear and succinct the points of his belief, sort of the various aspects of the faith to the unbelievers, then of course such knowledge would be useful."],[374.0,"So while he's saying the literal command to do that is unjustifiable, but the allegorical one, in terms of taking from the natural philosophy."],[387.0,"And I would say basically what he's saying here is that Christianity does not contradict honest science."],[398.0,"So if science is there for the sake of science, and it is not polluted by various political or sort of moral teachings of those who are engaged in the science, and by moral, what I mean is, if there's a good and sound moral purported by those engaged in science."],[426.0,"Of course we would find it praiseworthy."],[429.0,"However, in our modern day and age, we see that there are people who sort of want to imbue science with their own set of morals."],[438.0,"That happened during the Soviet rule and the very atheistic stance of the Soviet government, the stance against the belief in God, the stance against the church, the stance against the organized religion."],[454.0,"And the Soviet government essentially required all the scientists to purport sort of atheistic morals and various things."],[466.0,"However, those are not innate to true science."],[469.0,"True science is dispassionate in this particular case."],[473.0,"And whether the mathematician is an atheist or he is a believer in God, it bears little consequence upon the way one is executing an equation or something."],[483.0,"However, obviously, if one purports true moral values, then for any Christian sort of to accept scientific knowledge from such a teacher would be a lot easier and a lot sort of more welcome."],[502.0,"But all the political and moral aspects set aside science in its pure form, especially when it comes to empirical knowledge, where it's proven by experiment and so on."],[522.0,"Well, it's neutral."],[524.0,"And as such, of course, it can be, and in some cases most definitely should be used by Christians for the glory of God and for the benefit of those around them."],[535.0,"So, for example, the science of architecture and the way that the physics enter into that, and mathematical calculations and so on."],[547.0,"Well, if one wants to build a beautiful church, one actually has to sort of employ an architect, employ a mathematician, employ engineers who could make sure that this building is not only pretty on the outside, the way, like a designer might say, you know, do the drawings and so on, but this building is also of sound architectural and structural value so that it won't collapse."],[576.0,"And that, of course, is a perfect example of where a Christian can take from something that's neutral, that is not Christian in and of itself."],[587.0,"Architecture is not a product of our faith or religion."],[593.0,"Anyway, not to belabor the point, paragraph 1 16."]]},{"k":"s","p":4,"i":0,"a":7,"t":599.0,"x":"Those who treasured up for themselves such wealth handed it over to Moses as he was working on the tent of mystery, each one making his personal contribution to the construction of the holy places."},{"k":"s","p":4,"i":1,"a":7,"t":611.0,"x":"It is possible to see this happening even now."},{"k":"s","p":4,"i":2,"a":7,"t":613.5,"x":"For many bring to the Church of God their profane learning as a kind of gift:"},{"k":"s","p":4,"i":3,"a":7,"t":618.0,"x":"Such a man was the great Basil, who acquired the Egyptian wealth in every respect during his youth and dedicated this wealth to God for the adornment of the Church, the true tabernacle."},{"k":"c","a":7,"t":629.0,"e":677.3,"l":[[629.0,"So he's basically saying that St."],[631.0,"Basil the Great, who was Educated in all the non Christian disciplines."],[639.0,"Basically he."],[639.0,"He knew all the classical knowledge and not only St."],[642.0,"Basil the Great, but several other saints as well, had great philosophical education and they knew the sciences of their day very well."],[653.0,"And when they became Christians, it sort of offered them a tremendous opportunity to make those a contribution in their service to God."],[664.0,"The cloudy pillar."],[666.0,"Or I guess maybe not cloudy, but the."],[669.0,"The pillar of cloud."],[672.0,"That's the next chapter, paragraph 117."]]}]},{"t":"The Cloudy Pillar","p":[[117,"Let us return to the point where we digressed. When those who already look to virtue and follow the lawgiver in life have left the borders of the Egyptians' dominion behind, the assaults of temptations in some way pursue them and bring on distress and fears and threats of death. When frightened by these things, those newly established in the faith lose all hope for what is good. But if Moses or some leader of the people like him happens along, he will counsel them against fear and will strengthen their downcast minds with the hope of divine help."],[118,"This help will not come unless the heart of the leader speaks with God. Many of those who occupy a position of leadership are concerned only with outward appearances; of those hidden things which are observed only by God they have hardly a thought. But in the case of Moses it was not so. While he exhorted the Israelites to be of good courage, he did cry out, although outwardly making no sound to God, as God himself bears witness. The Scripture teaches us, I think, that the voice which is melodious and ascends to God's hearing is not the cry made with the organs of speech but the meditation sent up from a pure conscience."],[119,"To the one who finds himself in these circumstances the brother appears limited in the help he renders for the great struggles—I mean that brother who met Moses as he was going down to Egypt at the divine bidding, whom Scripture has understood as being in the rank of angels. Then occurred the manifestation of the divine nature which manifests itself in the way that one is capable of receiving."],[0,"What we hear from the history to have happened, then, we understand from contemplation of the Word always to happen."],[120,"Whenever someone flees Egypt and, after getting outside its borders, is terrified by the assaults of temptation, the guide produces unexpected salvation from on high. Whenever the enemy with his army surrounds the one being pursued, the guide is forced to make the sea passable for him."],[121,"In this crossing the cloud served as guide. Those before us interpreted the cloud well as the grace of the Holy Spirit, who guides toward the Good those who are worthy. Whoever follows him passes through the water, since the guide makes a way through it for him. In this way he is safely led to freedom, and the one who pursues him to bring him into bondage is destroyed in the water."]],"id":"b2-10","r":[117,121],"w":425,"x":[{"k":"s","p":0,"i":0,"a":7,"t":676.0,"x":"Let us return to the point where we digressed."},{"k":"s","p":0,"i":1,"a":7,"t":678.0,"x":"When those who already look to virtue and follow the lawgiver in life have left the borders of the Egyptians' dominion behind, the assaults of temptations in some way pursue them and bring on distress and fears and threats of death."},{"k":"s","p":0,"i":2,"a":7,"t":692.0,"x":"When frightened by these things, those newly established in the faith lose all hope for what is good."},{"k":"s","p":0,"i":3,"a":7,"t":698.0,"x":"But if Moses or some leader of the people like him happens along, he will counsel them against fear and will strengthen their downcast minds with the hope of divine help."},{"k":"c","a":7,"t":706.4,"e":727.8,"l":[[706.4,"a hope of divine help."],[708.0,"And of course, how do we see this?"],[710.0,"Well, when the Israelites were in the desert and they were seeing the Egyptian army approaching, they of course, many of them lost heart and they thought that they were going to die there, by the shore of the Red"]]},{"k":"s","p":1,"i":0,"a":7,"t":729.0,"x":"This help will not come unless the heart of the leader speaks with God."},{"k":"s","p":1,"i":1,"a":7,"t":733.0,"x":"Many of those who occupy a position of leadership are concerned only with outward appearances; of those hidden things which are observed only by God they have hardly a thought."},{"k":"s","p":1,"i":2,"a":7,"t":744.0,"x":"But in the case of Moses it was not so."},{"k":"s","p":1,"i":3,"a":7,"t":746.0,"x":"While he exhorted the Israelites to be of good courage, he did cry out, although outwardly making no sound to God, as God himself bears witness."},{"k":"s","p":1,"i":4,"a":7,"t":755.0,"x":"The Scripture teaches us, I think, that the voice which is melodious and ascends to God's hearing is not the cry made with the organs of speech but the meditation sent up from a pure conscience."},{"k":"c","a":7,"t":766.0,"e":831.5,"l":[[766.0,"So I think that while he was silent, or while he was talking to the Israelites, inwardly he prayed to God."],[777.0,"He cried out to God for deliverance."],[779.0,"And that's the One thing that St. Gregory here specifically points out, that to God it's not how melodious one's prayer is, it's not how eloquent it is, but it's the inner composition of the prayer."],[798.0,"And I think that maybe the best way to describe it is in the words of King David, who says, if thou hadst desired a sacrifice, I would have given it with whole burnt offerings."],[809.0,"Thou shalt not be pleased."],[810.0,"The heart that is broken and humbled, God will not despise so when we cry out inwardly from the broken heart, basically with contrition and utter dependence on God, he never hesitates, neither is he ever late to our aid."],[828.0,"Paragraph 119."]]},{"k":"s","p":2,"i":0,"a":7,"t":831.0,"x":"To the one who finds himself in these circumstances the brother appears limited in the help he renders for the great struggles—I mean that brother who met Moses as he was going down to Egypt at the divine bidding, whom Scripture has understood as being in the rank of angels."},{"k":"c","a":7,"t":848.0,"e":868.5,"l":[[848.0,"So he's talking about Aaron here."],[851.0,"However, I guess if we were to think of this allegorically, every Christian has a guardian angel."],[857.0,"And he's saying that perhaps the guardian angel seems limited to us, that, you know, his."],[863.0,"His help is not readily seen by us."]]},{"k":"s","p":2,"i":1,"a":7,"t":867.0,"x":"Then occurred the manifestation of the divine nature which manifests itself in the way that one is capable of receiving."},{"k":"s","p":3,"i":0,"a":7,"t":876.0,"x":"What we hear from the history to have happened, then, we understand from contemplation of the Word always to happen."},{"k":"s","p":4,"i":0,"a":7,"t":885.0,"x":"Whenever someone flees Egypt and, after getting outside its borders, is terrified by the assaults of temptation, the guide produces unexpected salvation from on high."},{"k":"s","p":4,"i":1,"a":7,"t":895.0,"x":"Whenever the enemy with his army surrounds the one being pursued, the guide is forced to make the sea passable for him."},{"k":"s","p":5,"i":0,"a":7,"t":905.0,"x":"In this crossing the cloud served as guide."},{"k":"s","p":5,"i":1,"a":7,"t":907.0,"x":"Those before us interpreted the cloud well as the grace of the Holy Spirit, who guides toward the Good those who are worthy."},{"k":"s","p":5,"i":2,"a":7,"t":916.0,"x":"Whoever follows him passes through the water, since the guide makes a way through it for him."},{"k":"s","p":5,"i":3,"a":7,"t":921.7,"x":"In this way he is safely led to freedom, and the one who pursues him to bring him into bondage is destroyed in the water."},{"k":"c","a":7,"t":930.0,"e":1037.5,"l":[[930.0,"Now, there's one interesting implication in this particular case, and that is, since we know that the Israelites followed Moses, who in turn followed the cloud, which during the day appeared as a pillar of cloud, but during the night appeared as a pillar of fire."],[949.0,"So during the day the cloud provided shade in the desert for the Israelites, and during the night it provided them warmth and fire."],[959.0,"And they followed this cloud basically with their entire camp in their escape from Egypt."],[966.0,"Now, you might say that the cloud brought them to the bank of the Red Sea."],[972.0,"And to those who were weak of heart, of course, it would appear that the cloud brought them to their very brink of extinction, because there was no escape from Pharaoh, because either way they were going to run to one side or to the other."],[987.0,"The army of Pharaoh."],[988.0,"Just imagine a triangle and."],[991.0,"And somebody sort of at the one end of it in the middle of its base."],[996.0,"So Pharaoh, who was coming from the other direction, only had to adjust the angle and he would eventually definitely catch up with him, because they had no way of running from him because the Red Sea crossed their path."],[1011.0,"However, we see that it was providential that the cloud brought them to the brink of the Red Sea, because just as they thought that they were perishing and that they were finished and that Pharaoh was going to apprehend them, God opened the sea for them."],[1028.0,"Crossing of the Red Sea and I assume this is the continuation of the 121st paragraph."]]}]},{"t":"Crossing the Red Sea","p":[[0,"No one who hears this should be ignorant of the mystery of the water. He who has gone down into it with the army of the enemy emerges alone, leaving the enemy's army drowning in the water."],[122,"For who does not know that the Egyptian army— those horses, chariots and their drivers, archers, slingers, heavily armed soldiers, and the rest of the crowd in the enemies' line of battle—are the various passions of the soul by which man is enslaved? For the undisciplined intellectual drives and the sensual impulses to pleasure, sorrow, and covetousness are indistinguishable from the aforementioned army.
