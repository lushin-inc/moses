uide, they arrived at a place irrigated with drinkable water. It was watered all around by twelve bountiful springs and shaded by a grove of date palms. There were seventy date palms which, even though few in number, made a great impression on those who saw them, because of their exceptional beauty and height."],[35,"Again their guide, the cloud, rose up and led them forth to another place. But this was a desert with arid, scorching sand and not a drop of water to moisten the country. Here once more thirst exhausted the people. But when Moses struck a prominent rock with his rod, it gave forth water which was sweet and drinkable in greater abundance than was needed by even so large a host."],[36,"It was also there that the provisions which they had laid in for the journey out of Egypt failed, and the people were famished. Then the most incredible marvel of all occurred: Food did not grow out of the earth in the customary manner but fell like dew from heaven. For the dew was poured out upon them at daybreak and became food for those who gathered it. What was poured out was not drops of water as in the case of dew but crystal-like drops in the shape of coriander seed, tasting as sweet as honey."],[37,"With this marvel was seen also another: Those who went out to gather the food were all, as one might expect, of different ages and capacities, yet despite their differences one did not gather more or less than another. Instead, the amount gathered was measured by the need of each, so that the stronger did not have a surplus nor was the weaker deprived of his fair share. In addition, the history tells another marvel. Each one, when making provision for the day, laid up nothing for the morrow, but when some stingy person did store up some of the daily food for the next day, it became inedible, being changed into worms."],[38,"The history offers yet another astounding feature of this food, for one of the seven days of the week was observed by rest in keeping with a mystical ordinance. On the day before the day of rest, the same amount of food flowed down as on other days and the effort of those gathering it was the same, yet what was gathered was found to be double the usual amount, so that their need for food was no excuse for breaking the law of rest. Divine power was shown even more in that, whereas on other days the excess became worthless, on the day of Preparation for the Sabbath (which is the name of this day of rest) alone did what was stored up remain imperishable so that it in no way appeared to be less fresh than the new."],[39,"Then they waged war against a foreign nation. The text calls those combining against them Amalekites. For the first time the Israelites were drawn up fully armed in battle array. The full army was not moved into battle; only picked troops chosen for their merit undertook the war. Here Moses showed a new piece of strategy. While Joshua (who was to succeed Moses in leading the people) led the army out against the Amalekites, Moses, standing on a hilltop away from the furor of battle, was looking up toward heaven with a friend stationed on either side of him."],[40,"Then we hear from the history the following marvel: When Moses raised his hands to heaven, those under his command prevailed against their enemies, but when he let them down, the army began to give in to the foreigners' assault. When those who stood with him recognized this they stationed themselves on either side of him and supported his hands, which for some unknown reason had become heavy and hard to move. When his helpers became too weak to hold him in an upright position, they provided him a stone to sit on, thus helping Moses to raise his hands to heaven. From then on the foreign army was mightily defeated by the Israelites."]],"id":"b1-5","r":[33,40],"w":822,"x":[{"k":"s","p":0,"i":0,"a":1,"t":2357.8,"x":"After that, Moses pushed on, but when he had traveled three days without water he was at a loss how to relieve the thirst of the army."},{"k":"s","p":0,"i":1,"a":1,"t":2369.0,"x":"They pitched camp near a pool of salty water, more bitter than the sea itself."},{"k":"s","p":0,"i":2,"a":1,"t":2373.0,"x":"While they were resting close to the water and were parched with thirst, Moses, acting on the counsel of God, found a piece of wood near that place and threw it into the water."},{"k":"s","p":0,"i":3,"a":1,"t":2383.0,"x":"Immediately it became drinkable, for the wood by its own power changed the nature of the water from bitter to sweet."},{"k":"c","a":1,"t":2391.0,"e":2427.0,"l":[[2391.0,"Now, of course, all the Holy Fathers, commenting on this particular passage in the life of St. Moses, the holy prophet Moses and the entire nation of Israel, say again that this wood that turned water from bitter into sweet also is the image of the cross of Christ, which has the power to turn the bitter sufferings and temptations that we come upon in our lives in too sweet."],[2425.0,"33"]]},{"k":"s","p":1,"i":0,"a":1,"t":2425.4,"x":"As the cloud moved forward, the Israelites followed their guide closely."},{"k":"s","p":1,"i":1,"a":1,"t":2430.0,"x":"They always rested from their march wherever the cloud indicated by stopping, and they departed again whenever the cloud led the way on."},{"k":"s","p":1,"i":2,"a":1,"t":2438.0,"x":"By following this guide, they arrived at a place irrigated with drinkable water."},{"k":"s","p":1,"i":3,"a":1,"t":2443.0,"x":"It was watered all around by twelve bountiful springs and shaded by a grove of date palms."},{"k":"s","p":1,"i":4,"a":1,"t":2449.0,"x":"There were seventy date palms which, even though few in number, made a great impression on those who saw them, because of their exceptional beauty and height."},{"k":"s","p":2,"i":0,"a":1,"t":2462.4,"x":"Again their guide, the cloud, rose up and led them forth to another place."},{"k":"c","a":1,"t":2465.2,"e":2616.7,"l":[[2465.2,"and led them forth to another place."],[2468.0,"But this was a desert with arid, scorching sand and not a drop of water to moisten the country."],[2474.0,"Here once more, thirst exhausted the people."],[2477.0,"But when Moses struck a prominent rock with his rod, it gave forth water which was sweet and drinkable in great abundance, in greater abundance than was needed by even so large a host."],[2491.0,"I think that if you will bear with me and forgive me, I will make this our stopping point for tonight we will hopefully continue not the following week, because the following week is Holy Week, and of course there will be daily services, morning and evening, and I will be quite busy, understandably quite busy."],[2516.0,"But hopefully we will be able to continue during Bright week and by God's grace we we will read on this Beautiful Life of St. Moses."],[2528.0,"I imagine that just as St. Gregory says, first he will recount the entire Life of St. Moses, and then he will draw some interesting parallels."],[2539.0,"But even as we are recounting it, of course we should not fail to see the multiple lessons that it offers us on the ability and the power of God to save us from in all of our temptations and tribulations."],[2554.0,"So let us pray and we will stop for the night."],[2560.0,"It is truly me to bless thee that Theotokos, ever blessed and most blameless and mother of our God, more honorable than the cherubim and beyond compare more glorious than the Seraphim, who without corruption gave his birth to God the Word, the very Theotoka Sadi do we magnify."],[2582.0,"God bless all of you."],[2585.0,"Thank you for your prayers, for your support."],[2587.0,"Always feel free to leave a comment here or in the comments or ask a question."],[2593.0,"I will do my best to respond."],[2596.0,"Also, I wish all of you the most profitable remainder of Great Lent."],[2603.0,"I hope that you have a peaceful and holy Holy Week, and of course, a bright and joyous celebration of Pascha."],[2613.0,"God Bless."]]},{"k":"s","p":2,"i":1,"a":1,"t":2501.3,"x":"But this was a desert with arid, scorching sand and not a drop of water to moisten the country."},{"k":"s","p":2,"i":2,"a":1,"t":2566.3,"x":"Here once more thirst exhausted the people."},{"k":"s","p":2,"i":3,"a":1,"t":2590.0,"x":"But when Moses struck a prominent rock with his rod, it gave forth water which was sweet and drinkable in greater abundance than was needed by even so large a host."},{"k":"c","a":2,"t":2.0,"e":82.2,"l":[[2.0,"In the name of the Father and of the Son and of the Holy Spirit."],[4.0,"Amen."],[4.0,"Christ is risen, my dear friends."],[6.0,"Truly he is risen."],[8.0,"Let us pray and we will continue Our readings of St. Gregory Ibnes Life of Moses."],[18.0,"Christ has risen from the dead, trampling down death by death, and on those in the tombs bestowing life."],[26.0,"Christ."],[27.0,"Christ has risen from the dead, trampling down death by death, and on those in the tombs bestowing life."],[35.0,"Christ has risen from the dead, trampling down death by death, and on those in the tombs bestowing life."],[52.0,"So today we will hopefully continue the wonderful reading that we've started of St. Gregory of Nyssa."],[62.0,"And if memory serves me right, we stopped at paragraph 34, so we will continue with 35."],[71.0,"If I happen to repeat myself, do forgive me again."],[75.0,"Their guide to the cloud rose up and led them forth to another place."],[78.0,"But this was a desert with arid, scorching"]]},{"k":"s","p":3,"i":0,"a":2,"t":106.0,"x":"It was also there that the provisions which they had laid in for the journey out of Egypt failed, and the people were famished."},{"k":"s","p":3,"i":1,"a":2,"t":114.0,"x":"Then the most incredible marvel of all occurred:"},{"k":"s","p":3,"i":2,"a":2,"t":117.0,"x":"Food did not grow out of the earth in the customary manner but fell like dew from heaven."},{"k":"s","p":3,"i":3,"a":2,"t":123.5,"x":"For the dew was poured out upon them at daybreak and became food for those who gathered it."},{"k":"s","p":3,"i":4,"a":2,"t":130.0,"x":"What was poured out was not drops of water as in the case of dew but crystal-like drops in the shape of coriander seed, tasting as sweet as honey."},{"k":"c","a":2,"t":140.0,"e":173.5,"l":[[140.0,"Apparently the Hebrew word manna means, what is this?"],[147.0,"And it's quite possible that the reason why, to this day we continue referring to what God provided for them as food in the desert as manna."],[157.0,"Because when they saw it, all of them said, what is this?"],[161.0,"And apparently, in the language of their day, that what is this?"],[165.0,"Was mana, mana, mana."],[168.0,"So what is this chapter or paragraph 37."]]},{"k":"s","p":4,"i":0,"a":2,"t":172.0,"x":"With this marvel was seen also another:"},{"k":"s","p":4,"i":1,"a":2,"t":174.6,"x":"Those who went out to gather the food were all, as one might expect, of different ages and capacities, yet despite their differences one did not gather more or less than another."},{"k":"s","p":4,"i":2,"a":2,"t":185.0,"x":"Instead, the amount gathered was measured by the need of each, so that the stronger did not have a surplus nor was the weaker deprived of his fair share."},{"k":"s","p":4,"i":3,"a":2,"t":195.0,"x":"In addition, the history tells another marvel."},{"k":"s","p":4,"i":4,"a":2,"t":197.0,"x":"Each one, when making provision for the day, laid up nothing for the morrow, but when some stingy person did store up some of the daily food for the next day, it became inedible, being changed into worms."},{"k":"c","a":2,"t":212.0,"e":236.8,"l":[[212.0,"So that obviously was a very interesting miracle, a peculiar one, one might say, in that if they decided to store up more for the following day so that they didn't have to labor by collecting it, by picking it up, well, it all went to waste because it turned into worms."],[234.0,"Chapter 38 this"]]},{"k":"s","p":5,"i":0,"a":2,"t":235.1,"x":"The history offers yet another astounding feature of this food, for one of the seven days of the week was observed by rest in keeping with a mystical ordinance."},{"k":"s","p":5,"i":1,"a":2,"t":246.0,"x":"On the day before the day of rest, the same amount of food flowed down as on other days and the effort of those gathering it was the same, yet what was gathered was found to be double the usual amount, so that their need for food was no excuse for breaking the law of rest."},{"k":"s","p":5,"i":2,"a":2,"t":262.0,"x":"Divine power was shown even more in that, whereas on other days the excess became worthless, on the day of Preparation for the Sabbath (which is the name of this day of rest) alone did what was stored up remain imperishable so that it in no way appeared to be less fresh than the new."},{"k":"c","a":2,"t":282.0,"e":333.5,"l":[[282.0,"So we see that this particular food, this manna from heaven, had a very miraculous quality."],[289.0,"When it was gathered on a Friday and stored up for Saturday, it remained perfectly fine."],[296.0,"However, when it was gathered on any other day, and if someone tried to sort of, you know, sneak some more of it, well, then it definitely did not work very well for for them."],[313.0,"And so that, of course, is also a great miracle in and of itself, in that it did not stay other days of the week, but on Sabbath it definitely stay fresh and completely edible."],[331.0,"Chapter 39"]]},{"k":"s","p":6,"i":0,"a":2,"t":332.0,"x":"Then they waged war against a foreign nation."},{"k":"s","p":6,"i":1,"a":2,"t":336.0,"x":"The text calls those combining against them Amalekites."},{"k":"s","p":6,"i":2,"a":2,"t":340.0,"x":"For the first time the Israelites were drawn up fully armed in battle array."},{"k":"s","p":6,"i":3,"a":2,"t":344.0,"x":"The full army was not moved into battle; only picked troops chosen for their merit undertook the war."},{"k":"s","p":6,"i":4,"a":2,"t":351.0,"x":"Here Moses showed a new piece of strategy."},{"k":"s","p":6,"i":5,"a":2,"t":353.5,"x":"While Joshua (who was to succeed Moses in leading the people) led the army out against the Amalekites, Moses, standing on a hilltop away from the furor of battle, was looking up toward heaven with a friend stationed on either side of him."},{"k":"s","p":7,"i":0,"a":2,"t":368.9,"x":"Then we hear from the history the following marvel:"},{"k":"s","p":7,"i":1,"a":2,"t":372.9,"x":"When Moses raised his hands to heaven, those under his command prevailed against their enemies, but when he let them down, the army began to give in to the foreigners' assault."},{"k":"s","p":7,"i":2,"a":2,"t":384.0,"x":"When those who stood with him recognized this they stationed themselves on either side of him and supported his hands, which for some unknown reason had become heavy and hard to move."},{"k":"s","p":7,"i":3,"a":2,"t":395.0,"x":"When his helpers became too weak to hold him in an upright position, they provided him a stone to sit on, thus helping Moses to raise his hands to heaven."},{"k":"s","p":7,"i":4,"a":2,"t":405.0,"x":"From then on the foreign army was mightily defeated by the Israelites."},{"k":"c","a":2,"t":410.0,"e":518.5,"l":[[410.0,"Now here, if you will allow me, I will show you that he didn't raise his hands like this."],[416.0,"More so he raised them in prayer like this, or sometimes, you know, maybe considered to be like this."],[422.0,"And of course, that sort of raising of hands signified prayer on his part."],[428.0,"So we see that spiritually, while Moses was praying, the Israelites were winning."],[435.0,"The moment he lowered his hands and he stopped praying, they stopped winning."],[441.0,"And so his friends, his assistants, they basically made sure his hands didn't go down."],[446.0,"So he did not stop praying."],[449.0,"And perhaps in this, what we could see is the Lord says that we must make a spiritual sacrifice unto God, that we must go through a narrow path."],[463.0,"It would be easy to pray with one's hands lowered to their natural position."],[468.0,"Holding one's hands up for, you know, a few minutes or for a few seconds is an easy job."],[474.0,"But if you actually try to remain standing like this for longer than a minute or five minutes, you will realize how soon your muscles begin to ache and you would very much wish to lower your hands."],[487.0,"The battle obviously did not take just a couple of minutes."],[490.0,"It lasted for perhaps over an hour."],[494.0,"And of course, holding one's hands for that amount of time is definitely a tremendous feat, you might say a physical feat."],[504.0,"So in this particular case, his feet of holding up one's hands would."],[509.0,"Was also, in some fashion, in some manner, a spiritual offering that he was offering to God."],[516.0,"Chapter 41."]]}]},{"t":"The Mountain of Divine Knowledge","p":[[41,"When the cloud which led the people in their journey continued to remain at the same place, the people could not move on, since there was no one to lead them to depart. All the necessities of life were provided for them without toil. The air from above rained bread already prepared for them, and the rock from below provided drink. The cloud in turn tempered the unpleasantness of being out in the open, forming a shelter from the heat by day and at night dispelling the darkness by shining with a torch-like radiance. So they experienced no discomfort in that desert at the foot of the mountain where they had pitched camp."],[42,"Here Moses guided them in a most secret initiation. The divine power itself by marvels beyond description initiated all the people and their leader himself in the following manner. The people were ordered beforehand to keep themselves from defilements of all kinds which pertain to both soul and body and to purify themselves by certain lustrations. They were to keep themselves pure from intercourse for a stated number of days so that, pure of passion, they might approach the mountain to be initiated, cleansed of every emotion and bodily concern. (The name of the mountain was Sinai.) Persons alone were allowed at that time to approach the mountain, and of them men alone, and of them, in turn, those purified from every pollution. Every safeguard and precaution was taken against the approach of any animals to the mountain. If somehow it did happen that any animal at all showed itself at the mountain, it was stoned by the people."],[43,"Then the clear light of the atmosphere was darkened so that the mountain became invisible, wrapped in a dark cloud. A fire shining out of the darkness presented a fearful sight to those who saw it. It hovered all around the sides of the mountain so that everything which one could see smouldered with the smoke from the surrounding fire. Moses led the people to the slope, not without fear himself at the sight. His whole being so trembled with fright that his faintness of soul was not concealed from the Israelites, but he was terrified, as they were, at what he saw and his body shook violently."],[44,"The manifestation was of such a nature that it not only caused consternation in their souls through what they saw but it also struck fear in them through what they heard. A terrible sound ripped down from above upon everything below. Its first impact was harsh and intolerable to every ear. Its sound was like the blaring of trumpets, but the intensity and terribleness of the sound surpassed any such comparison. As it drew nearer, its blaring steadily increased to a more terrifying volume. This sound was sharp and clear, the air articulating the word by divine power without using organs of speech. The word was not articulated without purpose but was laying down divine ordinances. As the sound drew nearer, it became louder, and the trumpet surpassed itself, the successive sounds exceeding in volume the preceding ones."],[45,"The people as a whole were incapable of enduring what was seen and heard. Therefore, a general request from all was brought before Moses that the Law be mediated through him, on the ground that the people would not doubt that whatever he commanded in keeping with the teaching from above was a divine command. So when all went down to the foot of the mountain, Moses alone remained and showed the opposite of what was to be expected of him. Whereas all other men feel confidence in the face of fearful things when in the company of their associates, Moses was more courageous after he had been left by himself. From this it became clear that the fear which had encompassed him at the beginning was an emotion not in keeping with his character but was experienced out of sympathy for those who were terrified."],[46,"Since he was alone, by having been stripped as it were of the people's fear, he boldly approached the very darkness itself and entered the invisible things where he was no longer seen by those watching. After he entered the inner sanctuary of the divine mystical doctrine, there, while not being seen, he was in company with the Invisible. He teaches, I think, by the things he did that the one who is going to associate intimately with God must go beyond all that is visible and (lifting up his own mind, as to a mountaintop, to the invisible and incomprehensible) believe that the divine is there where the understanding does not reach."],[47,"While there he received the divine ordinances. These were the teachings concerning virtue, the chief of which is reverence and having the proper notions about the divine nature, inasmuch as it transcends all cognitive thought and representation and cannot be likened to anything which is known. He was commanded to heed none of those things comprehended by the notions with regard to the divine nor to liken the transcendent nature to any of the things known by comprehension. Rather, he should believe that the Divine exists, and he should not examine it with respect to quality, quantity, origin, and mode of being, since it is unattainable."],[48,"The word also adds what are right moral actions, presenting its teaching in both general and specific laws. General is the law which is destructive of all injustice, namely that one must love his neighbor. If this law were observed, it would certainly follow in consequence that no one would do any evil to his neighbor. Among the specific laws was established honor for parents, and there was listed a catalogue of prohibited deeds."]],"id":"b1-6","r":[41,48],"w":957,"x":[{"k":"s","p":0,"i":0,"a":2,"t":517.0,"x":"When the cloud which led the people in their journey continued to remain at the same place, the people could not move on, since there was no one to lead them to depart."},{"k":"s","p":0,"i":1,"a":2,"t":526.0,"x":"All the necessities of life were provided for them without toil."},{"k":"s","p":0,"i":2,"a":2,"t":529.0,"x":"The air from above rained bread already prepared for them, and the rock from below provided drink."},{"k":"s","p":0,"i":3,"a":2,"t":535.0,"x":"The cloud in turn tempered the unpleasantness of being out in the open, forming a shelter from the heat by day and at night dispelling the darkness by shining with a torch-like radiance."},{"k":"s","p":0,"i":4,"a":2,"t":546.0,"x":"So they experienced no discomfort in that desert at the foot of the mountain where they had pitched camp."},{"k":"c","a":2,"t":552.0,"e":593.5,"l":[[552.0,"Well, we know that in the desert, the temperature difference, the variance of the temperature is quite great, because during the day, as the sun heats the rocks of the desert and it's sort of arid soil Directly it reflects a lot of heat and it becomes very hot, but at night it cools very quickly and becomes very cold."],[573.0,"So the very fact that during the day God provided them with a cloud, and at night with sort of a column of fire raising up to heaven, well, at night they had warmth."],[584.0,"During the day they had the shade from the sun."],[587.0,"And that was no small thing as well."],[591.0,"Chapter 42."]]},{"k":"s","p":1,"i":0,"a":2,"t":592.0,"x":"Here Moses guided them in a most secret initiation."},{"k":"s","p":1,"i":1,"a":2,"t":595.0,"x":"The divine power itself by marvels beyond description initiated all the people and their leader himself in the following manner."},{"k":"s","p":1,"i":2,"a":2,"t":603.0,"x":"The people were ordered beforehand to keep themselves from defilements of all kinds which pertain to both soul and body and to purify themselves by certain lustrations."},{"k":"s","p":1,"i":3,"a":2,"t":614.0,"x":"They were to keep themselves pure from intercourse for a stated number of days so that, pure of passion, they might approach the mountain to be initiated, cleansed of every emotion and bodily concern."},{"k":"s","p":1,"i":4,"a":2,"t":626.0,"x":"(The name of the mountain was Sinai.) Persons alone were allowed at that time to approach the mountain, and of them men alone, and of them, in turn, those purified from every pollution."},{"k":"s","p":1,"i":5,"a":2,"t":639.1,"x":"Every safeguard and precaution was taken against the approach of any animals to the mountain."},{"k":"s","p":1,"i":6,"a":2,"t":645.0,"x":"If somehow it did happen that any animal at all showed itself at the mountain, it was stoned by the people."},{"k":"s","p":2,"i":0,"a":2,"t":652.8,"x":"Then the clear light of the atmosphere was darkened so that the mountain became invisible, wrapped in a dark cloud."},{"k":"s","p":2,"i":1,"a":2,"t":661.0,"x":"A fire shining out of the darkness presented a fearful sight to those who saw it."},{"k":"s","p":2,"i":2,"a":2,"t":666.0,"x":"It hovered all around the sides of the mountain so that everything which one could see smouldered with the smoke from the surrounding fire."},{"k":"s","p":2,"i":3,"a":2,"t":676.0,"x":"Moses led the people to the slope, not without fear himself at the sight."},{"k":"s","p":2,"i":4,"a":2,"t":680.7,"x":"His whole being so trembled with fright that his faintness of soul was not concealed from the Israelites, but he was terrified, as they were, at what he saw and his body shook violently."},{"k":"s","p":3,"i":0,"a":2,"t":692.7,"x":"The manifestation was of such a nature that it not only caused consternation in their souls through what they saw but it also struck fear in them through what they heard."},{"k":"s","p":3,"i":1,"a":2,"t":704.0,"x":"A terrible sound ripped down from above upon everything below."},{"k":"s","p":3,"i":2,"a":2,"t":710.0,"x":"Its first impact was harsh and intolerable to every ear."},{"k":"s","p":3,"i":3,"a":2,"t":713.0,"x":"Its sound was like the blaring of trumpets, but the intensity and terribleness of the sound surpassed any such comparison."},{"k":"s","p":3,"i":4,"a":2,"t":721.0,"x":"As it drew nearer, its blaring steadily increased to a more terrifying volume."},{"k":"s","p":3,"i":5,"a":2,"t":727.0,"x":"This sound was sharp and clear, the air articulating the word by divine power without using organs of speech."},{"k":"s","p":3,"i":6,"a":2,"t":735.0,"x":"The word was not articulated without purpose but was laying down divine ordinances."},{"k":"s","p":3,"i":7,"a":2,"t":740.0,"x":"As the sound drew nearer, it became louder, and the trumpet surpassed itself, the successive sounds exceeding in volume the preceding ones."},{"k":"s","p":4,"i":0,"a":2,"t":750.0,"x":"The people as a whole were incapable of enduring what was seen and heard."},{"k":"s","p":4,"i":1,"a":2,"t":755.0,"x":"Therefore, a general request from all was brought before Moses that the Law be mediated through him, on the ground that the people would not doubt that whatever he commanded in keeping with the teaching from above was a divine command."},{"k":"s","p":4,"i":2,"a":2,"t":770.0,"x":"So when all went down to the foot of the mountain, Moses alone remained and showed the opposite of what was to be expected of him."},{"k":"s","p":4,"i":3,"a":2,"t":780.0,"x":"Whereas all other men feel confidence in the face of fearful things when in the company of their associates, Moses was more courageous after he had been left by himself."},{"k":"s","p":4,"i":4,"a":2,"t":791.0,"x":"From this it became clear that the fear which had encompassed him at the beginning was an emotion not in keeping with his character but was experienced out of sympathy for those who were terrified."},{"k":"c","a":2,"t":802.0,"e":864.5,"l":[[802.0,"Well, speaking of the sympathy of Moses, of course, when the people later on, as we were, as we are going to continue to read, when the people will misbehave and and anger God, Moses would actually intervene on their behalf and order that God would wipe him as well out of the book of the living, unless he would have mercy on the people."],[827.0,"Because God did not want to punish Moses."],[829.0,"He only wanted to punish the people."],[832.0,"But Moses was so kind and so compassionate toward his people that he said, if you're going to punish, punish them."],[838.0,"Punish me as well."],[840.0,"And so this makes perfect sense, saying that he was really scared and afraid, not so much for himself as he was for the people."],[847.0,"And the people we know in that particular case, they said to Moses, they said, let God speak to you alone, because we will all surely die if we continue wanting to listen to God."],[862.0,"Chapter 46."]]},{"k":"s","p":5,"i":0,"a":2,"t":863.0,"x":"Since he was alone, by having been stripped as it were of the people's fear, he boldly approached the very darkness itself and entered the invisible things where he was no longer seen by those watching."},{"k":"s","p":5,"i":1,"a":2,"t":875.0,"x":"After he entered the inner sanctuary of the divine mystical doctrine, there, while not being seen, he was in company with the Invisible."},{"k":"s","p":5,"i":2,"a":2,"t":883.0,"x":"He teaches, I think, by the things he did that the one who is going to associate intimately with God must go beyond all that is visible and (lifting up his own mind, as to a mountaintop, to the invisible and incomprehensible) believe that the divine is there where the understanding does not reach."},{"k":"c","a":2,"t":903.0,"e":935.4,"l":[[903.0,"Now, quite interestingly enough, I believe in iconography."],[910.0,"Mountains depicted in the background also depict the ascetic striving after God."],[918.0,"And by sort of going up high up the mountain with both his feet and also, of course, his heart and his mind Moses indeed communicated with God, the invisible one."],[933.0,"Chapter 47"]]},{"k":"s","p":6,"i":0,"a":2,"t":933.9,"x":"While there he received the divine ordinances."},{"k":"s","p":6,"i":1,"a":2,"t":937.0,"x":"These were the teachings concerning virtue, the chief of which is reverence and having the proper notions about the divine nature, inasmuch as it transcends all cognitive thought and representation and cannot be likened to anything which is known."},{"k":"s","p":6,"i":2,"a":2,"t":951.0,"x":"He was commanded to heed none of those things comprehended by the notions with regard to the divine nor to liken the transcendent nature to any of the things known by comprehension."},{"k":"s","p":6,"i":3,"a":2,"t":963.0,"x":"Rather, he should believe that the Divine exists, and he should not examine it with respect to quality, quantity, origin, and mode of being, since it is unattainable."},{"k":"c","a":2,"t":973.0,"e":999.0,"l":[[973.0,"I think here St. Gregory is talking about sort of the prohibition of making any images of God at that time or images to be worshipped as gods, because obviously God was incomprehensible and unattainable to the people."],[991.0,"Then chapter 48 the Word."],[996.0,"Let's see."]]},{"k":"s","p":7,"i":0,"a":2,"t":998.0,"x":"The word also adds what are right moral actions, presenting its teaching in both general and specific laws."},{"k":"s","p":7,"i":1,"a":2,"t":1007.0,"x":"General is the law which is destructive of all injustice, namely that one must love his neighbor."},{"k":"s","p":7,"i":2,"a":2,"t":1013.0,"x":"If this law were observed, it would certainly follow in consequence that no one would do any evil to his neighbor."},{"k":"s","p":7,"i":3,"a":2,"t":1019.0,"x":"Among the specific laws was established honor for parents, and there was listed a catalogue of prohibited deeds."}]},{"t":"The Tabernacle and the Priestly Vestments","p":[[49,"With his mind purified by these laws, as it were, he was led to the higher initiation, where a tabernacle was all at once shown to him by divine power. The tabernacle was a sanctuary with beauty of indescribable variety—entrances, pillars, and curtains, table, candlestick, and altar of incense, the altar of holocaust and the propitiatory, and the inaccessible and unapproachable holy of holies. So that their beauty and arrangement might not be forgotten and might be shown to those below, he was counseled not to represent these things in mere writing but to imitate in material construction that immaterial creation, employing the most splendid and radiant materials found on earth. Among these the most abundant was gold, with which the pillars were overlaid. With the gold, silver also made its contribution by beautifying the capitals and bases of the pillars so that by the changes of color at each end, I think, the gold might shine forth more brightly. There were also places where brass was considered useful, namely at the head and base of the silver pillars."],[50,"The draperies and the curtains and the outer wall of the sanctuary and the coverings stretched out in succession over the columns—each was finished out of an appropriate material by the weaver's art. The dye of these woven fabrics was violet, purple, and fiery scarlet, and some material had its natural brightness. For some things linen was used and for other things hair, in keeping with the purposes of the fabrics. There were also places where skins dyed red were suitable to the beauty of the structure."],[51,"After his descent from the mountain Moses, employing workmen, constructed these things according to the pattern shown to him. While he was in that sanctuary not made with hands, he was commanded how the priest should be adorned when he entered the sanctuary. The law prescribed the details of the under and outer garments."],[52,"The first in order of the garments was not the hidden but the visible. There was an ephod embroidered of different colors with gold thread predominating. (The veil was also made of these colors.) Clasps held the ephod together on both sides and provided a setting of gold for emeralds. The beauty of these stones was due partly to their natural radiance—from them a green brightness was given forth—and partly to the marvellous skill of the engraving. (This was not the skill which carves out images of idols, but the adornment was the names of the patriarchs engraved six on each stone.)"],[53,"From the clasps down the front the little shield-like ornaments hung loosely. There were also intertwined cords plaited through one another in a netlike pattern hanging from the clasps on each side. They dropped down below the shield-like ornaments so that the beauty of the plaiting might, I think, be more conspicuous being enhanced by the background."],[54,"The ornament made out of gold which hung down from the chest had on it stones of different kinds equal in number to the patriarchs. These were arranged in four rows set three to a row, with the names of the tribes written on them. The tunic beneath the ephod extended from the neck to the toes and was suitably adorned with fringes. The hem was decked out beautifully, not only by the variety of skilled weaving but also by the hanging of gold ornaments. These were golden bells and pomegranates distributed alternately along the hem."],[55,"The fillet for the head was solid violet, and the metal-leaf frontpiece was of pure gold engraved with the ineffable letters. There was also a girdle which held together the loose folds of the garment, as well as an adornment for the hidden parts of the body, and the other articles of clothing which symbolically instruct concerning priestly virtue under the form of clothing."]],"id":"b1-7","r":[49,55],"w":639,"x":[{"k":"s","p":0,"i":0,"a":2,"t":1027.7,"x":"With his mind purified by these laws, as it were, he was led to the higher initiation, where a tabernacle was all at once shown to him by divine power."},{"k":"s","p":0,"i":1,"a":2,"t":1038.0,"x":"The tabernacle was a sanctuary with beauty of indescribable variety—entrances, pillars, and curtains, table, candlestick, and altar of incense, the altar of holocaust and the propitiatory, and the inaccessible and unapproachable holy of holies."},{"k":"s","p":0,"i":2,"a":2,"t":1054.7,"x":"So that their beauty and arrangement might not be forgotten and might be shown to those below, he was counseled not to represent these things in mere writing but to imitate in material construction that immaterial creation, employing the most splendid and radiant materials found on earth."},{"k":"s","p":0,"i":3,"a":2,"t":1076.0,"x":"Among these the most abundant was gold, with which the pillars were overlaid."},{"k":"s","p":0,"i":4,"a":2,"t":1080.9,"x":"With the gold, silver also made its contribution by beautifying the capitals and bases of the pillars so that by the changes of color at each end, I think, the gold might shine forth more brightly."},{"k":"s","p":0,"i":5,"a":2,"t":1095.0,"x":"There were also places where brass was considered useful, namely at the head and base of the silver pillars."},{"k":"s","p":1,"i":0,"a":2,"t":1102.8,"x":"The draperies and the curtains and the outer wall of the sanctuary and the coverings stretched out in succession over the columns—each was finished out of an appropriate material by the weaver's art."},{"k":"s","p":1,"i":1,"a":2,"t":1115.6,"x":"The dye of these woven fabrics was violet, purple, and fiery scarlet, and some material had its natural brightness."},{"k":"s","p":1,"i":2,"a":2,"t":1124.0,"x":"For some things linen was used and for other things hair, in keeping with the purposes of the fabrics."},{"k":"s","p":1,"i":3,"a":2,"t":1130.5,"x":"There were also places where skins dyed red were suitable to the beauty of the structure."},{"k":"s","p":2,"i":0,"a":2,"t":1135.8,"x":"After his descent from the mountain Moses, employing workmen, constructed these things according to the pattern shown to him."},{"k":"s","p":2,"i":1,"a":2,"t":1143.6,"x":"While he was in that sanctuary not made with hands, he was commanded how the priest should be adorned when he entered the sanctuary."},{"k":"s","p":2,"i":2,"a":2,"t":1151.0,"x":"The law prescribed the details of the under and outer garments."},{"k":"c","a":2,"t":1156.0,"e":1183.4,"l":[[1156.0,"So we see in this particular case that St. Gregory is saying that quite obviously Moses was given more than just the Ten Commandments."],[1165.0,"He was actually shown the design of the tabernacle and told what to do about its structure, how to set it up, and also he was told obviously how to clothe the priests."],[1181.0,"Chapter 52"]]},{"k":"s","p":3,"i":0,"a":2,"t":1181.7,"x":"The first in order of the garments was not the hidden but the visible."},{"k":"s","p":3,"i":1,"a":2,"t":1189.0,"x":"There was an ephod embroidered of different colors with gold thread predominating."},{"k":"s","p":3,"i":2,"a":2,"t":1194.0,"x":"(The veil was also made of these colors.) Clasps held the ephod together on both sides and provided a setting of gold for emeralds."},{"k":"s","p":3,"i":3,"a":2,"t":1203.0,"x":"The beauty of these stones was due partly to their natural radiance—from them a green brightness was given forth—and partly to the marvellous skill of the engraving."},{"k":"s","p":3,"i":4,"a":2,"t":1213.0,"x":"(This was not the skill which carves out images of idols, but the adornment was the names of the patriarchs engraved six on each stone.)"},{"k":"s","p":4,"i":0,"a":2,"t":1224.6,"x":"From the clasps down the front the little shield-like ornaments hung loosely."},{"k":"s","p":4,"i":1,"a":2,"t":1231.0,"x":"There were also intertwined cords plaited through one another in a netlike pattern hanging from the clasps on each side."},{"k":"s","p":4,"i":2,"a":2,"t":1240.4,"x":"They dropped down below the shield-like ornaments so that the beauty of the plaiting might, I think, be more conspicuous being enhanced by the background."},{"k":"s","p":5,"i":0,"a":2,"t":1250.7,"x":"The ornament made out of gold which hung down from the chest had on it stones of different kinds equal in number to the patriarchs."},{"k":"c","a":2,"t":1259.0,"e":1268.5,"l":[[1259.0,"And of course there were 12 patriarchs, as we know, the 12 sons of, let's see, Jacob."]]},{"k":"s","p":5,"i":1,"a":2,"t":1267.0,"x":"These were arranged in four rows set three to a row, with the names of the tribes written on them."},{"k":"s","p":5,"i":2,"a":2,"t":1275.0,"x":"The tunic beneath the ephod extended from the neck to the toes and was suitably adorned with fringes."},{"k":"s","p":5,"i":3,"a":2,"t":1281.0,"x":"The hem was decked out beautifully, not only by the variety of skilled weaving but also by the hanging of gold ornaments."},{"k":"s","p":5,"i":4,"a":2,"t":1288.0,"x":"These were golden bells and pomegranates distributed alternately along the hem."},{"k":"s","p":6,"i":0,"a":2,"t":1294.8,"x":"The fillet for the head was solid violet, and the metal-leaf frontpiece was of pure gold engraved with the ineffable letters."},{"k":"s","p":6,"i":1,"a":2,"t":1305.0,"x":"There was also a girdle which held together the loose folds of the garment, as well as an adornment for the hidden parts of the body, and the other articles of clothing which symbolically instruct concerning priestly virtue under the form of clothing."}]},{"t":"The Tables of Stone","p":[[56,"After he was instructed in these and other such things by the ineffable teaching of God while he was surrounded by that invisible darkness, and having surpassed himself by the aid of the mystical doctrines, he emerged again out of the darkness. He then went down to his people to share with them the marvels which had been shown to him in the theophany, to deliver the laws, and to institute for them the sanctuary and priesthood according to the pattern shown to him on the mountain."],[57,"He carried in his hands the holy tablets, which were a divine invention and gift that needed no human cooperation to be brought into existence. Both the material and the writing on them were equally the work of God. The writing was the Law. But the people prevented grace: Before giving heed to the lawgiver they rebelled in idolatry."],[58,"Some considerable time had elapsed while Moses devoted himself to conversation with God in that divine initiation. He participated in that eternal life under the darkness for forty days and nights, and lived in a state beyond nature, for his body had no need of food during that time. It was then that the people, like a little child who escapes the attention of his pedagogue, were carried along into disorderliness by uncontrolled impulses, and, banding together against Aaron, forced the priest to lead them in idolatry."],[59,"When the idol had been made out of gold (it was a calf), they exulted in their impiety; but Moses came to them and broke the tablets which he had received from God so that they might suffer a punishment worthy of their transgression by having no share in the God-given grace."],[60,"He then purified his people's guilt with their own blood when the Levites slew them, and appeased the divine by his own anger against the transgressors. Thereupon he utterly destroyed the idol. Once more applying himself to the matter for forty days, he received the tablets. The writing on them was done by divine power, but the material was fashioned by the hand of Moses. He received them while for the same number of days he again lived beyond nature in a manner different from that to which we are accustomed and admitted to his body none of those sustenances which our nature requires."],[61,"Moses accordingly erected for them the tabernacle, delivered to them the laws, and established the priesthood in keeping with the teaching given to him by God. The workmanship on all the material objects was done according to the divine directions—the tabernacle, the entrances, and everything inside—the altar of incense, the altar of holocaust, the candlestick, the curtains, the propitiatory within the holy of holies; the adornment of the priesthood, the myrrh, the different sacrifices—the purifications, the thankofferings, the offerings to avert evil, the propitiations for trespasses. As he arranged everything in the required manner, among his family he aroused against himself envy, that congenital malady in the nature of man."]],"id":"b1-8","r":[56,61],"w":499,"x":[{"k":"s","p":0,"i":0,"a":2,"t":1319.7,"x":"After he was instructed in these and other such things by the ineffable teaching of God while he was surrounded by that invisible darkness, and having surpassed himself by the aid of the mystical doctrines, he emerged again out of the darkness."},{"k":"s","p":0,"i":1,"a":2,"t":1334.0,"x":"He then went down to his people to share with them the marvels which had been shown to him in the theophany, to deliver the laws, and to institute for them the sanctuary and priesthood according to the pattern shown to him on the mountain."},{"k":"s","p":1,"i":0,"a":2,"t":1349.8,"x":"He carried in his hands the holy tablets, which were a divine invention and gift that needed no human cooperation to be brought into existence."},{"k":"s","p":1,"i":1,"a":2,"t":1360.0,"x":"Both the material and the writing on them were equally the work of God."},{"k":"s","p":1,"i":2,"a":2,"t":1364.0,"x":"The writing was the Law. But the people prevented grace:"},{"k":"s","p":1,"i":3,"a":2,"t":1367.4,"x":"Before giving heed to the lawgiver they rebelled in idolatry."},{"k":"c","a":2,"t":1371.0,"e":1398.0,"l":[[1371.0,"and idolatry."],[1373.0,"So what he is talking about here now is the fact that they urged Aaron to make them a molten golden calf, and they danced around it and played and said that this golden calf led them out of Egypt, and by that of course, they mightily upset Moses."],[1396.0,"Chapter"]]},{"k":"s","p":2,"i":0,"a":2,"t":1397.3,"x":"Some considerable time had elapsed while Moses devoted himself to conversation with God in that divine initiation."},{"k":"s","p":2,"i":1,"a":2,"t":1405.0,"x":"He participated in that eternal life under the darkness for forty days and nights, and lived in a state beyond nature, for his body had no need of food during that time."},{"k":"s","p":2,"i":2,"a":2,"t":1415.0,"x":"It was then that the people, like a little child who escapes the attention of his pedagogue, were carried along into disorderliness by uncontrolled impulses, and, banding together against Aaron, forced the priest to lead them in idolatry."},{"k":"s","p":3,"i":0,"a":2,"t":1433.5,"x":"When the idol had been made out of gold (it was a calf), they exulted in their impiety; but Moses came to them and broke the tablets which he had received from God so that they might suffer a punishment worthy of their transgression by having no share in the God-given grace."},{"k":"c","a":2,"t":1450.8,"e":1459.7,"l":[[1450.8,"God given grace."],[1452.0,"So he was upset with them, and I think he threw the tablets on the ground, and of course he crushed them."]]},{"k":"s","p":4,"i":0,"a":2,"t":1458.8,"x":"He then purified his people's guilt with their own blood when the Levites slew them, and appeased the divine by his own anger against the transgressors."},{"k":"s","p":4,"i":1,"a":2,"t":1468.9,"x":"Thereupon he utterly destroyed the idol."},{"k":"s","p":4,"i":2,"a":2,"t":1471.3,"x":"Once more applying himself to the matter for forty days, he received the tablets."},{"k":"s","p":4,"i":3,"a":2,"t":1476.0,"x":"The writing on them was done by divine power, but the material was fashioned by the hand of Moses."},{"k":"s","p":4,"i":4,"a":2,"t":1482.0,"x":"He received them while for the same number of days he again lived beyond nature in a manner different from that to which we are accustomed and admitted to his body none of those sustenances which our nature requires."},{"k":"c","a":2,"t":1497.0,"e":1523.0,"l":[[1497.0,"So basically, St. Gregory of Nyssa is saying here that Moses fasted for 40 days initially, and then after he punished the transgressors who made the golden calf and committed adultery, he fasted for yet another 40 days in order to receive the new tablets."],[1515.0,"Essentially the same law written, but on the new tablets, because he crushed the first ones."],[1519.0,"Chapter 61."],[1521.0,"Moses"]]},{"k":"s","p":5,"i":0,"a":2,"t":1521.4,"x":"Moses accordingly erected for them the tabernacle, delivered to them the laws, and established the priesthood in keeping with the teaching given to him by God."},{"k":"s","p":5,"i":1,"a":2,"t":1531.0,"x":"The workmanship on all the material objects was done according to the divine directions—the tabernacle, the entrances, and everything inside—the altar of incense, the altar of holocaust, the candlestick, the curtains, the propitiatory within the holy of holies; the adornment of the priesthood, the myrrh, the different sacrifices—the purifications, the thankofferings, the offerings to avert evil, the propitiations for trespasses."},{"k":"s","p":5,"i":2,"a":2,"t":1559.0,"x":"As he arranged everything in the required manner, among his family he aroused against himself envy, that congenital malady in the nature of man."},{"k":"c","a":2,"t":1572.0,"e":1585.0,"l":[[1572.0,"Chapter 62."],[1573.0,"I guess maybe before I make any comments on the envy, we should read on, because probably St. Gregory mentions that himself, now that he addressed it."],[1582.0,"Chapter 62."]]}]},{"t":"Envy, the Spies, the Serpent, and the Priesthood","p":[[62,"Even Aaron, who was endowed with the honors of the priesthood, and his sister Miriam, driven by a most female-like jealousy against the honor given to Moses by God, so railed against him that deity was provoked to punish their trespass. Here Moses showed patience most worthy of admiration, because, when God punished the irrational envy of the woman, he made his nature prevail over anger and appeased God on behalf of his sister."],[63,"The multitude again fell into disorderliness. What led to their transgression was a lack of moderation in regard to the pleasures of the table, for they were not satisfied to live healthfully and painlessly on the food which flowed down from above, but the craving for meat made them prefer slavery in Egypt to their present good circumstances. Moses took counsel with God concerning the passion which had overcome them, and God instructed that they should not have such desires because he would give what they longed for. He sent flocks of birds like a cloud to fly close to the ground near the camp. The ease with which they could catch the birds led them in their craving for meat to stuff themselves."],[64,"Their immoderation at once became destructive to their bodies, and their satiety ended in sickness and death. This example became to them and to those watching them a sufficient cause for moderation."],[65,"Next, Moses sent spies into that region which they hoped to inhabit according to the divine promise. When not all of them reported the truth, but some gave false and discouraging information, the people again rose in anger against Moses. God decreed that those who had no confidence in divine help should not see the promised land."],[66,"As they were crossing the desert, water again failed them—as did their memory of the divine power, for the earlier miracle of the rock did not give them confidence that their present necessities would be provided for. Abandoning their hopes for better things, they reviled Moses and God himself, so that the disbelief of the people seemed to intimidate even Moses. Nevertheless he performed for them again the miracle of changing that jutting rock into water."],[67,"Again the pleasures of the table enslaved them, and their desires led them to gluttony. Although they lacked none of the necessities of life, disorderly youths were dreaming of the Egyptian plenty. They were disciplined by very severe scourges: Serpents within the encampment as they bit them injected deadly poison in them."],[68,"When deaths caused by the serpents followed in rapid succession, the lawgiver, at the urging of divine counsel, cast a bronze likeness of a serpent and placed it on a height to be seen by the whole camp. In this way he stayed the harm done among the people by the serpents and delivered them from destruction. For he who looked on the bronze image of the serpent did not fear the bite of the real serpent, since looking at it counteracted the poison by some mysterious antidote."],[69,"Some of the people again rose up against Moses' leadership and put pressure on him to transfer the priesthood to themselves. Although he made supplication to God on behalf of the rebels, the righteous judgment of God was stronger than the compassion of Moses for his people. For the earth, opening up like a chasm at the divine will and closing up again, swallowed all those who set themselves, together with all their kinsmen, against the authority of Moses. When two hundred and fifty of those who raved about the priesthood were consumed by fire, the people were brought to their senses."],[70,"In order to persuade men that the grace of the priesthood comes from God to those who are worthy, Moses received rods from the most eminent man in each tribe, each man bringing a rod marked with his own name. Aaron's rod was among them. Moses placed the rods before the sanctuary, and by them he made God's choice concerning the priesthood clear to the people. Aaron's rod alone budded and produced ripe fruit from the wood—and the fruit was the almond."],[71,"It seemed a very great marvel to the unbelievers that what was dried, polished, and rootless all at once produced the growth natural to things which are planted. Instead of earth, bark, moisture, roots, and time, it was the divine power at work in the wood."]],"id":"b1-9","r":[62,71],"w":733,"x":[{"k":"s","p":0,"i":0,"a":2,"t":1584.0,"x":"Even Aaron, who was endowed with the honors of the priesthood, and his sister Miriam, driven by a most female-like jealousy against the honor given to Moses by God, so railed against him that deity was provoked to punish their trespass."},{"k":"c","a":2,"t":1599.0,"e":1610.7,"l":[[1599.0,"So basically, they greatly angered God by rebelling against Moses."],[1608.0,"You might say"]]},{"k":"s","p":0,"i":1,"a":2,"t":1609.1,"x":"Here Moses showed patience most worthy of admiration, because, when God punished the irrational envy of the woman, he made his nature prevail over anger and appeased God on behalf of his sister."},{"k":"c","a":2,"t":1621.0,"e":1665.3,"l":[[1621.0,"Basically, we know that when he saw that Miriam was struck with leprosy because of her envy against him, or, you know, an envy directed toward him, Moses actually prayed for her to God that she be healed, and she was."],[1637.0,"And of course, that St. Gregory calls him prevailing, made his nature prevailing over anger, because he could have thought, you know, you got what you rightly deserve."],[1651.0,"You know, why did you envy me?"],[1653.0,"Why did you rebel against me?"],[1655.0,"But even though she did sin against him, he prayed for her deliverance from leprosy, and she was healed."],[1662.0,"Field chapter 62."]]},{"k":"s","p":1,"i":0,"a":2,"t":1664.0,"x":"The multitude again fell into disorderliness."},{"k":"s","p":1,"i":1,"a":2,"t":1667.0,"x":"What led to their transgression was a lack of moderation in regard to the pleasures of the table, for they were not satisfied to live healthfully and painlessly on the food which flowed down from above, but the craving for meat made them prefer slavery in Egypt to their present good circumstances."},{"k":"s","p":1,"i":2,"a":2,"t":1683.0,"x":"Moses took counsel with God concerning the passion which had overcome them, and God instructed that they should not have such desires because he would give what they longed for."},{"k":"s","p":1,"i":3,"a":2,"t":1695.0,"x":"He sent flocks of birds like a cloud to fly close to the ground near the camp."},{"k":"s","p":1,"i":4,"a":2,"t":1700.0,"x":"The ease with which they could catch the birds led them in their craving for meat to stuff themselves."},{"k":"c","a":2,"t":1706.3,"e":2282.0,"l":[[1706.3,"me to stuff themselves."],[1708.0,"So they were definitely overeating."],[1715.0,"Now, let's see."],[1719.0,"There's a question here."],[1721.0,"Is Moses throwing of the tablets, considering, considered an example of righteous anger?"],[1729.0,"How might we carefully think about this emotion possibly occurring in our lives?"],[1734.0,"Well, if Moses threw the tablets down, then of course, the Lord took the whip and overturned the tables of the money changers within the temple."],[1746.0,"And with the whip, he."],[1747.0,"He drew those who were sort of making commerce in his house, which he said, of course, my house is the house of prayer."],[1755.0,"It's not the house of, let's see, sort of merchant activity, merchandise."],[1764.0,"So, yes, I do think that."],[1766.0,"And considering the fact that Moses also punished or, you know, righteous prophet, holy prophet, Moses also punished those who misbehaved because some of them died."],[1777.0,"And I think I can't remember how they were slaughtered."],[1780.0,"Maybe they were slaughtered by the priests."],[1782.0,"At least a portion of the people were cut down for sure."],[1785.0,"So definitely this would have been righteous anger."],[1788.0,"Now, the only sort of main danger for us is to consider if we were to give into anger, is our anger righteous."],[1804.0,"Now we see that Moses could have been righteously and rightfully angry with Miriam."],[1810.0,"But once she was struck down by God with leprosy or struck with leprosy, he prayed for her healing."],[1818.0,"He had mercy on his own sister."],[1819.0,"And while others might say, well, she's a sister, you know, no wonder, of course, you know, anyone would pray for his brother or for his sister, for his child, or for his parent."],[1830.0,"But we also know that Moses, as I mentioned earlier, when God was going to wipe out the Israelite nation, Moses prayed and said, lord, if you're going to wipe them out, wipe me out with them."],[1843.0,"And so we see that in as much as he exhibited righteous anger and he threw the plates, the stone plates, the sort of the scrolls were the commandments onto the ground, crushing them."],[1862.0,"In the same way, he was also an example, a living example of self sacrifice and of utmost and purest love for his fellow countrymen."],[1876.0,"So maybe he could exhibit such anger."],[1880.0,"As for us, I don't know that that would be such a safe idea because we would probably justify ourselves that our anger is just, but we would end up only offending those near us."],[1891.0,"And especially like some people say, oh, you know, my anger is justified."],[1895.0,"And they unleash their anger on their family members, causing so much pain and suffering, when in fact they could have handled the situation differently."],[1905.0,"So I think, and also in that particular case, most likely the crushing of the tablets, the original ones, the ones given to him by God, was most likely the only action that would have gotten the Israelites attention."],[1924.0,"And as to their transgression and what they were doing, if he came and simply tried speaking to them, they might not have listened."],[1930.0,"Because we do know that when someone said to them, well, you know, what about Moses?"],[1936.0,"You know, what's he going to say about this golden calf when he comes down the mountain?"],[1940.0,"And some of those activists, you might say, some of the people who were getting everybody else riled up, come, come on, come on, come on, let's make an idol."],[1951.0,"Let's make a God for ourselves that we can see, you know."],[1954.0,"And when they were asked, well, what about Moses?"],[1957.0,"They said, what about Moses?"],[1959.0,"We don't know where he's at."],[1961.0,"He's gone, he's disappeared."],[1963.0,"You know, it's been so many days and we have not seen or heard of him."],[1968.0,"So they were definitely very heedless when it comes to Moses, considering he led them with so many, so many miracles."],[1976.0,"And yet, you know, when he was praying on the mountain and fasting for 40 days, they said, well, we don't know of him."],[1983.0,"Where is he?"],[1983.0,"He's disappeared."],[1984.0,"He's gone."],[1985.0,"Essentially like he vanished, you know."],[1987.0,"So he came and he threw the tablets down."],[1991.0,"Are we ever in that same position?"],[1993.0,"You know, and I imagine so."],[1995.0,"Think of it this way."],[1996.0,"Oftentimes I say to parents, if you're a little child, two, two and a half, maybe three years old, even a four or five year old, is about to run out in front of a car on the street."],[2009.0,"If you say, honey, you really shouldn't do that, what's going to happen?"],[2013.0,"Your child is going to die."],[2015.0,"Because you normally speak like that when there is nothing major happening."],[2020.0,"You know, if your child is about to spill the milk, you go, oh, careful."],[2024.0,"But you don't scream and shout, you know, you say, or, you know, if they're doing something at home, you speak calmly, you know, you behave."],[2034.0,"If your child is about to run out in front of a running car, you yell, you scream, and if that doesn't work, you run and you hope that you grab your child by the sort of scruff of the neck and get him out of the harm's way, you know, or if it's not the car, but something else when the child is trying to stick the hand into, you know, the fireplace and you say, once, honey, don't do that."],[2061.0,"You say, twice, honey, don't do that."],[2063.0,"Well, I mean, a crazy person might say, okay, go ahead and put it in and burn the child's hand."],[2070.0,"But, you know, in some cases you might say, don't do that."],[2074.0,"You know, ouch, you're going to get hurt."],[2076.0,"And you know, even if that doesn't work, well, the child is going to get burned."],[2081.0,"Right?"],[2082.0,"And by then, of course, maybe, hopefully, you'd think it would be a lesson learned."],[2087.0,"So in that particular case, was that righteous anger?"],[2091.0,"Well, of course, for Moses, it would not have been an unrighteous anger."],[2095.0,"However, later on, when Moses was commanded by God to speak to the rock, but he was so angry with the Israelites and their continuous grumbling and so on that he struck them rock instead of speaking to it."],[2111.0,"Then, if you recall, the Lord told him, because you disobeyed me because you were told to speak to the rock, not to strike it, striking the first time, speaking the second time, but because he was so angry he struck it the second time."],[2125.0,"And the Lord told him, you will not enter the promised land."],[2128.0,"So righteous anger, Is there such a thing?"],[2133.0,"Yes."],[2134.0,"Are we capable of it?"],[2136.0,"Are, you know, are we readily sort of capable of identifying, oh, this is righteous anger for me."],[2143.0,"It's okay, this is not righteous."],[2145.0,"I better control myself."],[2147.0,"I'd say probably it's the best thing to control yourself 99% of the time, you know, maybe even 99.9% of the time and allow yourself only a small fraction, you know, of a percentage point to say, well, this is righteous anger, you know, because sometimes we, what we consider to be righteous anger is perceived by our family members, by children, by our spouses as a passionate anger."],[2176.0,"So, you know."],[2179.0,"But yes, as you write, you know, parents with children, I think that does help because it puts things for all of us into perspective."],[2189.0,"You know, imagine a teacher who always gives straight A to a student that doesn't do his homework, that doesn't learn anything."],[2196.0,"Well, what's going to happen to that student when that student goes to the university from school, and the professor there is not going to be the same and much worse."],[2206.0,"What if the professor at the university does the same?"],[2209.0,"And let's say the student is studying to be a trauma doctor?"],[2215.0,"Then what if the student who wanted to be a trauma doctor was given a pass every single time and no one ever told him that he needs to learn and he needs to practice."],[2225.0,"When he gets a live patient in front of him who's going to be in serious need of medical assistance and he's not going to be able to help the patient, the patient is going to suffer either death or perhaps maybe serious consequential problems because the medical assistance was not offered right away in a way that it should have."],[2251.0,"And then, of course, that sorry person who was never admonished properly to study will be eaten by his conscience and will have to carry tremendous amount of blood guilt because he will realize that, oops, I guess because I didn't do my studies, I didn't learn properly."],[2273.0,"Well, my patient died, you know, where my patient didn't do as well as he could have, or she should have, you know, or."],[2280.0,"And"]]},{"k":"s","p":2,"i":0,"a":2,"t":2283.0,"x":"Their immoderation at once became destructive to their bodies, and their satiety ended in sickness and death."},{"k":"s","p":2,"i":1,"a":2,"t":2294.0,"x":"This example became to them and to those watching them a sufficient cause for moderation."},{"k":"c","a":2,"t":2299.0,"e":2329.0,"l":[[2299.0,"So, basically, yes, fasting is not meant to teach us to abstain radically, to the point of sort of physical hurt to our bodies, you know, or even damage in some cases, as people do when they fast without reasonable measure."],[2322.0,"Fasting is meant to teach us moderation, that we can actually control ourselves."],[2326.0,"Chapter 65."]]},{"k":"s","p":3,"i":0,"a":2,"t":2328.0,"x":"Next, Moses sent spies into that region which they hoped to inhabit according to the divine promise."},{"k":"s" land."],[2453.0,"It's too much."],[2454.0,"Let's not do that."],[2456.0,"So they said, let's not do that."],[2458.0,"They rebelled against Moses and of course the punishment was actually quite horrific and tremendous."],[2465.0,"God commanded them to wander in the desert to, what's the other word, sort of to be exiled in the desert for 40 years."],[2478.0,"And, and during that 40 years, everyone who was 20 years of age at the time of the decision made based on the sort of false report of the 10 spies, everyone who was 20 died."],[2495.0,"So the Promised land was inhabited by those who would have been under 20, so 19 and younger."],[2502.0,"The children survived, those who were 19 years old by the time they actually crossed the River Jordan and went into the Promised Land."],[2513.0,"The youngest people would have been 59, you know, or you know, 59 plus something."],[2518.0,"But everyone who was 20 at that time in the hearing of those 10 spies, they all died."],[2525.0,"The 10 spies died."],[2527.0,"They died in the desert."],[2529.0,"The only two people of those two 12 spies who saw the Promised Land were Caleb and Joshua."],[2539.0,"That, that really does say something to us."],[2541.0,"And of course Moses, because of, you know, sort of striking the rock, he was also told by God that he would not see the Promised Land, but that he would die beforehand."],[2552.0,"Thus it was actually Joshua who had to lead them into the Promised Land, who had sort of taken up the burden of leadership after the death of Moses."],[2564.0,"And that is a tremendous example."],[2567.0,"That is something that is very much for us to consider."],[2571.0,"Now think of it."],[2572.0,"This way."],[2573.0,"So you had 10 people out of 12."],[2576.0,"So the majority, the overwhelming majority said it's impossible, you know, it's impossible, we can't conquer this land."],[2583.0,"We can't, you know, take these fortified cities, we can't fight these giants, you know, who live there."],[2591.0,"Think of the parallel of the spiritual parallel to our modern day."],[2596.0,"How many people nowadays are saying, oh, Father, come on, you know, you should give communion to everyone because it's impossible to live a pious life."],[2606.0,"It's impossible not to fornicate, it's impossible not to do drugs, it's impossible not to, you know, do whatever, cheat and steal and so on, because everybody lives like that."],[2618.0,"Well, but we see in the example of Moses and the twelve spies and the Israelites that those who considered it to be impossible were condemned to die in the desert."],[2633.0,"They never saw the promised land."],[2636.0,"So if you think that the life of virtue is imposed, possible, my sad news to you is that you will never see it, you will die without it."],[2647.0,"If you think that the attainment of the kingdom of heaven is impossible, you will never attain it."],[2654.0,"Think even the modern day psychologists say if you think that something cannot be done, you can't do it."],[2664.0,"Not that sort of cheating yourself or pretending to be, you know, how some of those people that we all think are very insincere and, you know, sort of lacking authenticity when you ask them how they're doing, oh, I'm great, everything is great, I can do anything."],[2683.0,"And then, you know, when they actually face tribulations and trials, they crack just like anybody else."],[2692.0,"You know, they break down, they cry and so on."],[2695.0,"Was the battle for the habitation of the promised land difficult?"],[2702.0,"Did some warriors of Israel perhaps die during the process?"],[2706.0,"Of course, it took them time as well once they crossed the River Jordan."],[2712.0,"And I'm sorry, I'm running ahead of the book a little bit, but it took them time."],[2716.0,"The kingdom of heaven suffereth violence, meaning that it requires an effort and violent men take it by force."],[2724.0,"Well, Joshua and Caleb said, let's go, let's do it, let's apply force, let's apply violence in order, you know, to sort of conquer the promised land and hopefully with God's help, we can do it."],[2740.0,"Well, I dare say to you, try to apply the same mentality of Joshua and Caleb to your Christian life."],[2749.0,"Yes, I will go out and struggle for virtue."],[2753.0,"I will fail miserably, maybe time and again, time and again I will fall, I will sin, but I will not give up."],[2760.0,"I'll keep getting up on My feet and I will try to possess the promised land, the kingdom of heaven, you know, I will try to attain to it."],[2768.0,"And that's a very very, I think, very serious example and serious lesson for us to learn."],[2784.0,"Well, thank you so much."],[2785.0,"I. I definitely agree being a priest is not an easy task, especially in our day and age."],[2792.0,"But hopefully by your prayers and by the grace of God, God willing, like Caleb and Joshua, somehow not by my abilities, but by God's grace, I can make it foreign."],[2803.0,"Let's stop for today and God willing, we will continue on April 26th."],[2809.0,"That's a Wednesday, next Wednesday at our regular time."],[2813.0,"I don't think that we're going to have any reasons not to."],[2819.0,"As I always say."],[2821.0,"I would like to thank all the contributors, all the supporters of our humble small channel channel."],[2828.0,"We don't have a lot of subscribers and don't have."],[2831.0,"We don't boast many views, but I think that the most important thing is not the numbers of people, the."],[2837.0,"Not the numbers of subscribers or the numbers of views or likes as such or comments."],[2843.0,"But I think the most important thing for us is the actual subject matter that we cover."],[2849.0,"The things that we discuss, the."],[2851.0,"The works of the Holy Fathers that we read, I think are intended."],[2855.0,"Inspiring, very helpful and of course thank you all for your prayers, for your support and both spiritual and material and God willing, we will see you soon again."],[2866.0,"God bless you and let us pray and we'll say goodbye."],[2874.0,"I'll try to do it by memory."],[2876.0,"Shine, shine a new Jerusalem for the glory of the Lord is risen upon."],[2881.0,"Rejoice now and be glad and be radiant up your Theotokos and the resurrection of thy Son."],[2893.0,"Something like that."],[2894.0,"Forgive me for my."],[2896.0,"What is it, the word?"],[2899.0,"You know, slightly dusty English, liturgical English mostly, of course."],[2906.0,"Our services are in Church Slavonic, so please say a prayer for me."],[2910.0,"God bless and Christ is risen."]]},{"k":"c","a":3,"t":0.0,"e":85.5,"l":[[0.0,"Foreign."],[5.0,"Of the Son and of the Holy Spirit."],[7.0,"Amen."],[7.0,"Christ is Risen Dear friends, welcome back to our weekly readings of the works of the Holy Fathers."],[14.0,"We are currently reading the Life of the Holy prophet Moses by St. Gregory of Nyssa."],[20.0,"Let us pray and begin."],[24.0,"Christ has risen from the dead, trampling down dead by death and on those in the tombs bestowing life."],[32.0,"Christ is risen from the dead, trampling down dead by death and on those in the tombs bestowing life."],[40.0,"Christ has risen from the dead, trampling down death by death and on those and atoms bestowing life."],[53.0,"Thankfully, now that we have joyously celebrated the resurrection of Christ the Holy Pascha, we are able to have a sort of a more regular schedule, and the services have resumed their normal yearly schedule, so we are able to do our readings the way we normally chapter let's see, it looks like chapter"]]},{"k":"s","p":4,"i":0,"a":3,"t":84.6,"x":"As they were crossing the desert, water again failed them—as did their memory of the divine power, for the earlier miracle of the rock did not give them confidence that their present necessities would be provided for."},{"k":"s","p":4,"i":1,"a":3,"t":101.0,"x":"Abandoning their hopes for better things, they reviled Moses and God himself, so that the disbelief of the people seemed to intimidate even Moses."},{"k":"s","p":4,"i":2,"a":3,"t":110.0,"x":"Nevertheless he performed for them again the miracle of changing that jutting rock into water."},{"k":"c","a":3,"t":118.0,"e":130.0,"l":[[118.0,"So basically we are reading about the fact that God for the second time provided water for Israel from a rock."],[128.0,"67"]]},{"k":"s","p":5,"i":0,"a":3,"t":128.5,"x":"Again the pleasures of the table enslaved them, and their desires led them to gluttony."},{"k":"s","p":5,"i":1,"a":3,"t":136.0,"x":"Although they lacked none of the necessities of life, disorderly youths were dreaming of the Egyptian plenty."},{"k":"s","p":5,"i":2,"a":3,"t":143.0,"x":"They were disciplined by very severe scourges:"},{"k":"s","p":5,"i":3,"a":3,"t":146.0,"x":"Serpents within the encampment as they bit them injected deadly poison in them."},{"k":"s","p":6,"i":0,"a":3,"t":151.3,"x":"When deaths caused by the serpents followed in rapid succession, the lawgiver, at the urging of divine counsel, cast a bronze likeness of a serpent and placed it on a height to be seen by the whole camp."},{"k":"s","p":6,"i":1,"a":3,"t":164.0,"x":"In this way he stayed the harm done among the people by the serpents and delivered them from destruction."},{"k":"s","p":6,"i":2,"a":3,"t":171.0,"x":"For he who looked on the bronze image of the serpent did not fear the bite of the real serpent, since looking at it counteracted the poison by some mysterious antidote."},{"k":"c","a":3,"t":181.0,"e":219.0,"l":[[181.0,"And so we see in this the foreshadowing of the Lord's crucifixion."],[187.0,"I'm sorry, in being lifted up upon the cross, and much in the same way as the Israelites in the desert who were bitten by real serpents, looked at the bronze serpent and did not die in the same way, you might say that Those who look to Christ and who are bitten by the spiritual serpent also have an opportunity to live because of the power of Christ and of his cross and resurrection."],[217.0,"69"]]},{"k":"s","p":7,"i":0,"a":3,"t":217.3,"x":"Some of the people again rose up against Moses' leadership and put pressure on him to transfer the priesthood to themselves."},{"k":"s","p":7,"i":1,"a":3,"t":224.3,"x":"Although he made supplication to God on behalf of the rebels, the righteous judgment of God was stronger than the compassion of Moses for his people."},{"k":"s","p":7,"i":2,"a":3,"t":232.0,"x":"For the earth, opening up like a chasm at the divine will and closing up again, swallowed all those who set themselves, together with all their kinsmen, against the authority of Moses."},{"k":"s","p":7,"i":3,"a":3,"t":241.1,"x":"When two hundred and fifty of those who raved about the priesthood were consumed by fire, the people were brought to their senses."},{"k":"c","a":3,"t":250.0,"e":405.5,"l":[[250.0,"So we see that the Lord refers to those people as hard and hard of heart."],[257.0,"And that is why the law that was given to them was also difficult and hard."],[261.0,"And we could see this hardness and harshness in some way in these examples."],[268.0,"Because we see that even after Moses performed such great miracles, such as all the punishments of the Egyptians, and then of course, the guidance by the cloud during the day, by the pillar of fire during the night, the splitting of the Red Sea into two, the passing of the Israelites on the seabed as on dry land, which of course is completely unexpected because once the water leaves soil, soil takes time to dry, but they walk through on dry land."],[307.0,"And the Egyptian army was drowned together with the Pharaoh after they crossed the sea and the sea closed in on the Egyptians."],[315.0,"And even still after so great a number of miracles, the Israelites did not respect Moses authority."],[324.0,"And of course, by disrespecting his authority, they were disrespecting the authority of the one who sent him."],[331.0,"And this is something that's very important."],[333.0,"The Lord in the New Testament says that those who receive him receive the one who sent him."],[340.0,"And then he says to the disciples, those who listen to you will listen to me and also to the one who sent me."],[347.0,"And I think that that is very important in that we live in a society where respect for authority is rare anymore."],[358.0,"And there are certain questions."],[360.0,"And lots of people, especially as we've seen in sort of the later times, the more recent times, people don't even respect the authority of professionals."],[373.0,"And of course, people who have great experience and knowledge in certain subjects, others who have absolutely no experience, no knowledge, challenge their authority."],[384.0,"And we see that this is something that happened even in those days and even after such evident displays of divine power as were of course done by God on Moses behalf, so, so to speak, Chapter 70."]]},{"k":"s","p":8,"i":0,"a":3,"t":404.0,"x":"In order to persuade men that the grace of the priesthood comes from God to those who are worthy, Moses received rods from the most eminent man in each tribe, each man bringing a rod marked with his own name."},{"k":"s","p":8,"i":1,"a":3,"t":416.0,"x":"Aaron's rod was among them."},{"k":"s","p":8,"i":2,"a":3,"t":418.0,"x":"Moses placed the rods before the sanctuary, and by them he made God's choice concerning the priesthood clear to the people."},{"k":"s","p":8,"i":3,"a":3,"t":425.0,"x":"Aaron's rod alone budded and produced ripe fruit from the wood—and the fruit was the almond."},{"k":"c","a":3,"t":431.0,"e":555.0,"l":[[431.0,"And so Aaron had a rod made of almond tree, and his rod basically sprang forth shoots which sprung forth leaves and flowers, and of course, ripe fruits, ripe fruits of almond in a short time, I think maybe what, a period of three days or something like that."],[454.0,"That's, of course, completely unheard of, especially if you think about it."],[458.0,"Once the rod is cut from the tree, and even if it isn't lacquered or in any way sort of made pretty by carvings and
