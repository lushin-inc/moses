whatnot, even if it's just cut from the tree and kept that way, well, at least it still dries up completely."],[479.0,"And normally it would not produce any fruit."],[482.0,"Especially we know a story of a great miracle that took place in the Egyptian desert with the monks, when one of the monks took a rod planted in the ground and told his disciple to water it until it brought forth fruit."],[500.0,"And I think it took three years of watering, and water was far away."],[504.0,"And so the disciple would walk."],[506.0,"I can't remember if it was Saint Pambo or Saint John the Dwarf, but he would walk and he would water it every day."],[512.0,"And when that rod actually let out roots, rooted itself in the ground, and then brought forth fruit."],[520.0,"The spiritual father, the elder, collected the fruit, brought it into the church, and told the brothers, here, brothers, taste the fruit of obedience."],[528.0,"And that was considered a great miracle."],[530.0,"But that was a rod that was planted in the ground."],[533.0,"Even though it had no roots, it was stuck in the ground and it was watered on a daily basis."],[539.0,"Here we see rods that were just basically placed in front of the sanctuary, and they had no soil, no watering, nothing."],[547.0,"And one of them sprouted and brought forth complete fruit, ripened fruit."],[553.0,"71"]]},{"k":"s","p":9,"i":0,"a":3,"t":553.4,"x":"It seemed a very great marvel to the unbelievers that what was dried, polished, and rootless all at once produced the growth natural to things which are planted."},{"k":"s","p":9,"i":1,"a":3,"t":565.0,"x":"Instead of earth, bark, moisture, roots, and time, it was the divine power at work in the wood."}]},{"t":"The Royal Way, Balaam, and the End of His Life","p":[[72,"Thereupon, when he led the army through foreign nations who blocked their passage, he swore an oath that the people would not pass through the fields and vineyards but would keep to the royal road, turning aside neither to the right nor to the left. When the adversaries would not make peace on these terms, he prevailed in battle against the enemy and became master of the route."],[73,"Next, a certain Balak who ruled a greater nation known as the Midianites, panic-stricken at the experience of those who were destroyed and expecting to undergo nothing less calamitous at the hands of the Israelites, brought in support not arms and men but magical arts in the person of a certain Balaam. He was commonly reputed to be skilled in these things and was believed by those who employed him to be powerful in such matters. His augury came from watching the flight of birds, yet he was a hard man to deal with, for with the cooperation of demons he could bring utter ruin on men through this magical power."],[74,"As he followed those who were leading him to the king of that nation, he learned by the voice of his ass that the way was not propitious for him. Having learned in a vision what was to be done, he found that any harm to be inflicted by working magic was impotent against those who have God as their ally. Moved by divine inspiration instead of by demonic power, he uttered such words as were a clear prophecy of better things which would later come to pass. What prevented his making use of his skill for evil also brought him an awareness of divine power. Leaving divination aside, he acted as an interpreter of the divine will."],[75,"Then the foreign nation was destroyed. The Israelites had the upper hand in the battle, but they in turn were overcome by licentious passion for their female captives. When Phineas then with one blow ran those through who were entangled in dishonor, the wrath of God against those raving for unlawful unions abated. Then the lawgiver, ascending a high mountain, surveyed from afar the land which was prepared for Israel by the divine promise made to the fathers. He departed from this human life, leaving behind no sign on the earth nor any grave as a memorial of his departure."],[76,"Time had not harmed his beauty, neither dimmed his brightness of eye nor diminished the graciousness of his appearance. Always remaining the same, he preserved in the changeableness of nature an unchangeable beauty."],[77,"Those things which we have learned from the literal history of the man we have retraced in summary for you, although we have of necessity so amplified the account as to bring out its intention. Now we must adapt the life which we have called to mind to the aim we have proposed for our study so that we might gain some benefit for the virtuous life from the things mentioned. Let us now begin the account of this life."]],"id":"b1-10","r":[72,77],"w":510,"x":[{"k":"s","p":0,"i":0,"a":3,"t":571.3,"x":"Thereupon, when he led the army through foreign nations who blocked their passage, he swore an oath that the people would not pass through the fields and vineyards but would keep to the royal road, turning aside neither to the right nor to the left."},{"k":"s","p":0,"i":1,"a":3,"t":585.0,"x":"When the adversaries would not make peace on these terms, he prevailed in battle against the enemy and became master of the route."},{"k":"c","a":3,"t":595.0,"e":653.0,"l":[[595.0,"So here St. Gregory passes very quickly from the election of Aaron, divine election, I'm sorry, of Aaron, to the priesthood and so to the appointment of his tribe essentially as a high priest, and his sons were then high priests in his stead."],[613.0,"Later on, he passes on to the passage of Moses through the various lands on their journey."],[620.0,"And of course, Moses promised the kings of those, sort of, the local kings of those lands that he would not trample their vineyards, that his people would stay to the roads, to the high ground, sort of to the royal path."],[634.0,"They would not deviate in any way."],[637.0,"And only those who forbade them passage, only those, did they fight."],[642.0,"And that way, by conquering these nations, they sort of had access to their travel route."],[651.0,"73."]]},{"k":"s","p":1,"i":0,"a":3,"t":652.0,"x":"Next, a certain Balak who ruled a greater nation known as the Midianites, panic-stricken at the experience of those who were destroyed and expecting to undergo nothing less calamitous at the hands of the Israelites, brought in support not arms and men but magical arts in the person of a certain Balaam."},{"k":"s","p":1,"i":1,"a":3,"t":674.0,"x":"He was commonly reputed to be skilled in these things and was believed by those who employed him to be powerful in such matters."},{"k":"s","p":1,"i":2,"a":3,"t":682.0,"x":"His augury came from watching the flight of birds, yet he was a hard man to deal with, for with the cooperation of demons he could bring utter ruin on men through this magical power."},{"k":"c","a":3,"t":694.4,"e":741.3,"l":[[694.4,"his this magical power."],[696.0,"So we know from the Holy scriptures that Balak sent mercenaries, he sent people to Balaam, and of course, Balaam was told by God."],[712.0,"God had appeared and spoken to him in one way or another."],[715.0,"I think maybe just as an audible voice."],[718.0,"He had no vision, I don't think."],[719.0,"But he heard the voice of God saying, do not go with these men."],[723.0,"Because these men were saying, please come and curse the Israelites for us."],[728.0,"And so he refused."],[730.0,"They offered him tremendous amount of money as a reward."],[734.0,"And I don't remember the exact terms on which he went, sort of he spurned God's"]]},{"k":"s","p":2,"i":0,"a":3,"t":740.8,"x":"As he followed those who were leading him to the king of that nation, he learned by the voice of his ass that the way was not propitious for him."},{"k":"s","p":2,"i":1,"a":3,"t":752.0,"x":"Having learned in a vision what was to be done, he found that any harm to be inflicted by working magic was impotent against those who have God as their ally."},{"k":"s","p":2,"i":2,"a":3,"t":762.0,"x":"Moved by divine inspiration instead of by demonic power, he uttered such words as were a clear prophecy of better things which would later come to pass."},{"k":"s","p":2,"i":3,"a":3,"t":770.0,"x":"What prevented his making use of his skill for evil also brought him an awareness of divine power."},{"k":"s","p":2,"i":4,"a":3,"t":776.0,"x":"Leaving divination aside, he acted as an interpreter of the divine will."},{"k":"c","a":3,"t":782.0,"e":865.0,"l":[[782.0,"An interesting thing here is that St. Gregory does not describe what was happening with his donkey."],[789.0,"But at some point in time, as he was going to do this task for which he was paid money, as he was going to curse the Israelites, there was a narrow passage between a rock and, I think, a brush, some."],[800.0,"Some sort of bushes that were growing on the one side, and the donkey would not go through this narrow passage."],[806.0,"And so Balaam got off his donkey and he started beating it, saying, you know, oh, you know, you're worthless animal."],[813.0,"Why aren't you just going there?"],[815.0,"And so the donkey then spoke with a human voice and said, o blind man, don't you see that an angel of God has positioned himself in this narrow passage with his sword drawn to take off your head so that you do not curse the Israelites?"],[833.0,"And I didn't want you to die."],[834.0,"That's why I didn't go there."],[835.0,"And so, of course, Balaam had a great turn of heart."],[838.0,"He very much expressed his fondness for his donkey, for."],[846.0,"For the donkey saving his life."],[847.0,"But it's quite an interesting thing that even his donkey spoke with human voice, telling him, look, you will be decapitated, you will lose your head if you proceed with this terrible plan to curse the Israelites."],[863.0,"75."]]},{"k":"s","p":3,"i":0,"a":3,"t":864.0,"x":"Then the foreign nation was destroyed."},{"k":"s","p":3,"i":1,"a":3,"t":865.0,"x":"The Israelites had the upper hand in the battle, but they in turn were overcome by licentious passion for their female captives."},{"k":"s","p":3,"i":2,"a":3,"t":873.0,"x":"When Phineas then with one blow ran those through who were entangled in dishonor, the wrath of God against those raving for unlawful unions abated."},{"k":"c","a":3,"t":883.0,"e":935.4,"l":[[883.0,"There was a major problem."],[885.0,"They had taken wives from among that particular nation, which was something that was forbidden by God."],[892.0,"And Phinehas, that was his name, in his order."],[898.0,"He."],[898.0,"He ran through two of those people with a spear."],[902.0,"And I can't remember for sure if Moses actually told them to set aside these women, but they refused."],[909.0,"And so then, of course, God's wrath abated only after Phineas did what he did."],[914.0,"And I think that when Phineas did that, when he killed a man and a woman, an Israelite man and a Gentile woman with the spear by running through, I guess the rest of the Israelite men realized this was not a good idea to do."],[930.0,"And."],[932.0,"And the wrath of God"]]},{"k":"s","p":3,"i":3,"a":3,"t":934.1,"x":"Then the lawgiver, ascending a high mountain, surveyed from afar the land which was prepared for Israel by the divine promise made to the fathers."},{"k":"s","p":3,"i":4,"a":3,"t":943.0,"x":"He departed from this human life, leaving behind no sign on the earth nor any grave as a memorial of his departure."},{"k":"s","p":4,"i":0,"a":3,"t":950.4,"x":"Time had not harmed his beauty, neither dimmed his brightness of eye nor diminished the graciousness of his appearance."},{"k":"s","p":4,"i":1,"a":3,"t":958.0,"x":"Always remaining the same, he preserved in the changeableness of nature an unchangeable beauty."},{"k":"s","p":5,"i":0,"a":3,"t":965.4,"x":"Those things which we have learned from the literal history of the man we have retraced in summary for you, although we have of necessity so amplified the account as to bring out its intention."},{"k":"s","p":5,"i":1,"a":3,"t":977.4,"x":"Now we must adapt the life which we have called to mind to the aim we have proposed for our study so that we might gain some benefit for the virtuous life from the things mentioned."},{"k":"s","p":5,"i":2,"a":3,"t":988.0,"x":"Let us now begin the account of this life."},{"k":"c","a":3,"t":991.0,"e":1005.5,"l":[[991.0,"And so now the second book in the contemplation of the life of Moses by St. Gregory of Nyssa begins, and we begin with birth and childhood."],[1003.0,"Chapter one."]]}]}]},{"id":"b2","n":"Book II","sub":"Contemplation on the Life of Moses","s":[{"t":"Birth and Childhood","p":[[1,"Moses was born at the time Pharaoh issued the decree for male offspring to be destroyed. How shall we as a matter of choice imitate this fortuitous birth of Moses? Someone will rightly raise the objection that it does not lie within our power to imitate in our own birth that famous birth. But it is not hard to begin the imitation with this seeming difficulty."],[2,"Everyone knows that anything placed in a world of change never remains the same but is always passing from one state to another, the alteration always bringing about something better or worse. The narrative is to be understood according to its real intention. For the material and passionate disposition to which human nature is carried when it falls is the female form of life, whose birth is favored by the tyrant. The austerity and intensity of virtue is the male birth, which is hostile to the tyrant and suspected of insurrection against his rule."],[3,"Now, it is certainly required that what is subject to change be in a sense always coming to birth. In mutable nature nothing can be observed which is always the same. Being born, in the sense of constantly experiencing change, does not come about as the result of external initiative, as is the case with the birth of the body, which takes place by chance. Such a birth occurs by choice. We are in some manner our own parents, giving birth to ourselves by our own free choice in accordance with whatever we wish to be, whether male or female, moulding ourselves to the teaching of virtue or vice."],[4,"We can most certainly enter upon a better birth into the realm of light, however much the unwilling tyrant is distressed, and we can be seen with pleasure and be given life by the parents of this goodly offspring, even though it is contrary to the design of the tyrant. (The rational faculties are what become the \"parents of... virtue.\")"],[5,"When we lay bare the hidden meaning of the history, Scripture is seen to teach that the birth which distresses the tyrant is the beginning of the virtuous life. I am speaking of that kind of birth in which free will serves as the midwife, delivering the child amid great pain. For no one causes grief to his antagonist unless he exhibits in himself those marks which give proof of his victory over the other."],[6,"It is the function of the free will both to beget this virtuous male offspring and to nourish it with proper food and to take forethought how to save it unharmed from the water. For there are those who present their children to the tyrant, delivering them naked and without forethought to the stream. I am speaking of life as a stream made turbulent by the successive waves of passion, which plunge what is in the stream under the water and drown it."],[7,"Whenever life demands that the sober and provident rational thoughts which are the parents of the male child launch their good child on the billows of this life, they make him safe in an ark so that when he is given to the stream he will not be drowned. The ark, constructed out of various boards, would be education in the different disciplines, which holds what it carries above the waves of life."],[8,"Although he is borne along by the rushing of the waves, the child is not carried far by the tossing of the waters where there is education. Instead he is washed to the side and the motion of the waters naturally thrusts him on the firm bank, that is to say, outside the turmoil of life."],[9,"Experience teaches us that the restless and heaving motion of life thrusts from itself those who do not totally submerge themselves in the deceits of human affairs and it reckons as a useless burden those whose virtue is annoying. He who escapes from these things must imitate Moses and not spare his tears, even though he should be safe in the ark, for tears are the unfailing guardian of those saved by virtue."],[10,"Since the daughter of the king, being childless and barren (I think she is rightly perceived as profane philosophy), arranged to be called his mother by adopting the youngster, Scripture concedes that his relationship with her who was falsely called his mother should not be rejected until he had recognized his own immaturity. But he who has already attained maturity, as we have learned about Moses, will be ashamed to be called the son of one who is barren by nature."],[11,"For truly barren is profane education, which is always in labor but never gives birth. For what fruit worthy of such pangs does philosophy show for being so long in labor? Do not all who are full of wind and never come to term miscarry before they come to the light of the knowledge of God, although they could as well become men if they were not altogether hidden in the womb of barren wisdom?"],[12,"Now after living with the princess of the Egyptians for such a long time that he seemed to share in their honors, he must return to his natural mother. Indeed he was not separated from her while he was being brought up by the princess but was nursed by his mother's milk, as the history states. This teaches, it seems to me, that if we should be involved with profane teachings during our education, we should not separate ourselves from the nourishment of the Church's milk, which would be her laws and customs. By these the soul is nourished and matured, thus being given the means of ascending the height."],[13,"It is true that he who looks to both the profane doctrines and to the doctrines of the fathers will find himself between two antagonists. For the foreigner in worship is opposed to the Hebrew teaching, and contentiously strives to appear stronger than the Israelite. And so he seems to be to many of the more superficial who abandon the faith of their fathers and fight on the side of the enemy, becoming transgressors of the fathers' teaching. On the other hand, he who is great and noble in soul like Moses slays with his own hand the one who rises in opposition to true religion."],[14,"One may, moreover, find this same conflict in us, for man is set before competitors as the prize of their contest. He makes the one with whom he sides the victor over the other. The fight of the Egyptian against the Hebrew is like the fight of idolatry against true religion, of licentiousness against self-control, of injustice against righteousness, of arrogance against humility, and of everything against what is perceived by its opposite."],[15,"Moses teaches us by his own example to take our stand with virtue as with a kinsman and to kill virtue's adversary. The victory of true religion is the death and destruction of idolatry. So also injustice is killed by righteousness and arrogance is slain by humility."],[16,"The dispute of the two Israelites with each other occurs also in us. There would be no occasion for wicked, heretical opinions to arise unless erroneous reasonings withstood the truth. If, therefore, we by ourselves are too weak to give the victory to what is righteous, since the bad is stronger in its attacks and rejects the rule of truth, we must flee as quickly as possible (in accordance with the historical example) from the conflict to the greater and higher teaching of the mysteries."],[17,"And if we must again live with a foreigner, that is to say, if need requires us to associate with profane wisdom, let us with determination scatter the wicked shepherds from their unjust use of the wells—which means let us reprove the teachers of evil for their wicked use of instruction."],[18,"In the same way we shall live a solitary life, no longer entangled with adversaries or mediating between them, but we shall live among those of like disposition and mind who are fed by us while all the movements of our soul are shepherded, like sheep, by the will of guiding reason."]],"id":"b2-1","r":[1,18],"w":1369,"x":[{"k":"s","p":0,"i":0,"a":3,"t":1004.0,"x":"Moses was born at the time Pharaoh issued the decree for male offspring to be destroyed."},{"k":"s","p":0,"i":1,"a":3,"t":1010.0,"x":"How shall we as a matter of choice imitate this fortuitous birth of Moses?"},{"k":"s","p":0,"i":2,"a":3,"t":1015.0,"x":"Someone will rightly raise the objection that it does not lie within our power to imitate in our own birth that famous birth."},{"k":"s","p":0,"i":3,"a":3,"t":1022.0,"x":"But it is not hard to begin the imitation with this seeming difficulty."},{"k":"s","p":1,"i":0,"a":3,"t":1027.8,"x":"Everyone knows that anything placed in a world of change never remains the same but is always passing from one state to another, the alteration always bringing about something better or worse."},{"k":"s","p":1,"i":1,"a":3,"t":1040.0,"x":"The narrative is to be understood according to its real intention."},{"k":"s","p":1,"i":2,"a":3,"t":1043.9,"x":"For the material and passionate disposition to which human nature is carried when it falls is the female form of life, whose birth is favored by the tyrant."},{"k":"s","p":1,"i":3,"a":3,"t":1054.0,"x":"The austerity and intensity of virtue is the male birth, which is hostile to the tyrant and suspected of insurrection against his rule."},{"k":"s","p":2,"i":0,"a":3,"t":1068.0,"x":"Now, it is certainly required that what is subject to change be in a sense always coming to birth."},{"k":"s","p":2,"i":1,"a":3,"t":1074.9,"x":"In mutable nature nothing can be observed which is always the same."},{"k":"s","p":2,"i":2,"a":3,"t":1079.0,"x":"Being born, in the sense of constantly experiencing change, does not come about as the result of external initiative, as is the case with the birth of the body, which takes place by chance."},{"k":"s","p":2,"i":3,"a":3,"t":1090.0,"x":"Such a birth occurs by choice."},{"k":"s","p":2,"i":4,"a":3,"t":1091.0,"x":"We are in some manner our own parents, giving birth to ourselves by our own free choice in accordance with whatever we wish to be, whether male or female, moulding ourselves to the teaching of virtue or vice."},{"k":"c","a":3,"t":1104.6,"e":1225.0,"l":[[1104.6,"versa."],[1105.0,"Now this is rather interesting."],[1106.0,"So basically St. Gregory of Nyssa is saying that to Pharaoh, to the tyrant, the birth of males would be sort of undesirable because they can cause insurrection, they can cause an uprising and fight against him."],[1129.0,"And females, who of course were no threat because females would not set up such an insurrection, and so on."],[1137.0,"And obviously, especially in so ancient a time, the roles of males and females were clearly defined as separate."],[1148.0,"And we know of certain women warriors, of course, and in some cases in the history of Israel itself, women such as Jael and Deborah and, let's see, Judith, yes, they worked great feats of fighting, so to speak, but they were not really considered normally to be fighters."],[1175.0,"In fact, in the case of the two of those women, they sort of killed the men, unaware it wasn't a battle like David and Goliath."],[1187.0,"We don't really see that."],[1189.0,"And so, Also quite interestingly, St. Gregory says that since we are giving birth to ourselves in terms of as we change, we give birth either to good intentions or to bad intentions, and so on and so forth, then we choose the path in which we develop."],[1211.0,"We can be contrary to the tyrant, the devil, or we could be sort of pliable and malleable for him, which is not a good thing, of course."],[1222.0,"Chapter four."]]},{"k":"s","p":3,"i":0,"a":3,"t":1224.0,"x":"We can most certainly enter upon a better birth into the realm of light, however much the unwilling tyrant is distressed, and we can be seen with pleasure and be given life by the parents of this goodly offspring, even though it is contrary to the design of the tyrant."},{"k":"s","p":3,"i":1,"a":3,"t":1240.0,"x":"(The rational faculties are what become the \"parents of... virtue.\")"},{"k":"c","a":3,"t":1244.0,"e":1259.5,"l":[[1244.0,"So essentially our mind and our will, the rational faculties, the ones that direct our actions toward good, toward virtue, they become the parents."],[1257.0,"Chapter 5."]]},{"k":"s","p":4,"i":0,"a":3,"t":1258.0,"x":"When we lay bare the hidden meaning of the history, Scripture is seen to teach that the birth which distresses the tyrant is the beginning of the virtuous life."},{"k":"s","p":4,"i":1,"a":3,"t":1267.0,"x":"I am speaking of that kind of birth in which free will serves as the midwife, delivering the child amid great pain."},{"k":"s","p":4,"i":2,"a":3,"t":1275.0,"x":"For no one causes grief to his antagonist unless he exhibits in himself those marks which give proof of his victory over the other."},{"k":"c","a":3,"t":1286.0,"e":1386.5,"l":[[1286.0,"In other words, what he's saying is when we are born again in repentance, and of course we all know that the mystery of repentance, and especially sort of the confession and the remission of sins, is seen by the Church as a new birth, and the actual mystery of baptism and Chrismation is the birth that takes place only once."],[1313.0,"It's the spiritual rebirth of which the Lord himself talks in his conversation with Nicodemus."],[1320.0,"And he says, unless a man is born again of water and the Spirit."],[1324.0,"And of course, the water is the font and the Spirit is the mystery of Chrismation, the reception of the Holy Spirit, the bestowing of the Holy Spirit upon the sort of the newly illumined."],[1335.0,"While the Holy Fathers say that the mystery of repentance, the mystery of confidence, confession and remission of sins, is the baptism that is repeatable."],[1346.0,"And of course also of necessity, because we do continue to sin, unfortunately, after we are baptized with a one and only baptism."],[1354.0,"And so in this particular case, quite truly, as we repent, as we sort of make new our resolve to live for righteousness, well, then the."],[1369.0,"The tyrant is quite aggravated and unhappy because he sees that we're trying to wrestle away from his grasp and unite ourselves to Christ, to the."],[1383.0,"The Master of our life."],[1384.0,"Chapter six."]]},{"k":"s","p":5,"i":0,"a":3,"t":1385.0,"x":"It is the function of the free will both to beget this virtuous male offspring and to nourish it with proper food and to take forethought how to save it unharmed from the water."},{"k":"s","p":5,"i":1,"a":3,"t":1397.0,"x":"For there are those who present their children to the tyrant, delivering them naked and without forethought to the stream."},{"k":"s","p":5,"i":2,"a":3,"t":1404.4,"x":"I am speaking of life as a stream made turbulent by the successive waves of passion, which plunge what is in the stream under the water and drown it."},{"k":"c","a":3,"t":1415.0,"e":1467.5,"l":[[1415.0,"In other words, once we have a good intention, in some cases, if we're negligent and we're careless as to how to carry it through to life, then we hand it over to the tyrant."],[1430.0,"And of course all of our intentions are destroyed."],[1435.0,"And sometimes a sinner stops and sort of with his will, with his thought, he gives birth to the new intention."],[1445.0,"You know, I must repent, I must correct my life."],[1447.0,"I must stop this particular thing."],[1451.0,"But then he takes no heed to protect that intention."],[1455.0,"No heed, no further effort is made."],[1458.0,"And thus it dies."],[1460.0,"Just like a baby would drown in the river without a proper basket."],[1464.0,"And so on."],[1465.0,"Chapter seven."]]},{"k":"s","p":6,"i":0,"a":3,"t":1466.0,"x":"Whenever life demands that the sober and provident rational thoughts which are the parents of the male child launch their good child on the billows of this life, they make him safe in an ark so that when he is given to the stream he will not be drowned."},{"k":"s","p":6,"i":1,"a":3,"t":1482.0,"x":"The ark, constructed out of various boards, would be education in the different disciplines, which holds what it carries above the waves of life."},{"k":"c","a":3,"t":1492.0,"e":1530.5,"l":[[1492.0,"So basically, if we're speaking of an actual parent and child, what he's saying here, here what the ark was for Moses, the education of a child is to a child preparing the child for the turbulence of the life to come."],[1510.0,"And indeed if we did not teach our children how to live this life, how to navigate this life, well, they would suffer tremendous damage and would be greatly disadvantaged against the tyrant, against the devil, as they embark upon this life."]]},{"k":"s","p":7,"i":0,"a":3,"t":1529.0,"x":"Although he is borne along by the rushing of the waves, the child is not carried far by the tossing of the waters where there is education."},{"k":"s","p":7,"i":1,"a":3,"t":1539.0,"x":"Instead he is washed to the side and the motion of the waters naturally thrusts him on the firm bank, that is to say, outside the turmoil of life."},{"k":"c","a":3,"t":1549.0,"e":1694.4,"l":[[1549.0,"And I think in this particular case, the one verse from the Akathist to the Mother of God, the original Akathist stands out."],[1558.0,"It says, rejoice, thou who drawest us up out of the depths of ignorance."],[1564.0,"So we do thank the mother."],[1566.0,"And I think the Mother of God also says, rejoice, thou who enlivenest our minds, or something like that, darkened minds."],[1573.0,"So indeed, St. Gregory says here, education is something that protects the child."],[1581.0,"But if we were to think once again of sort of the parent and child in the one person, because he's saying, well, how does this apply to us specifically and individually?"],[1592.0,"So if our free will and our mental faculty is the parent, and then the intention to correct our life, the intention to dedicate our life to Christ is the child, well, how does that intention get educated?"],[1606.0,"Well, if we do not read the Holy Scripture at all, if we don't know the Holy Fathers, if we don't know the canons of our Church, if we don't know any of the divine laws and spiritual laws of life, if we are completely uneducated, well, of course it will be extremely difficult to bring that intention to fruition, actually to where it would grow."],[1628.0,"It would most likely get killed because it would just be completely overrun by passions and even the various basic necessities of life, which might not be passionate in and of themselves."],[1640.0,"However, just the vanity of it all would totally suffocate them."],[1647.0,"Just as the Lord says that the seeds that fall among the thorns and thistles get."],[1656.0,"Why was it choked?"],[1658.0,"Basically, you know, because as they try to spring forth other, you know, things growing around them, choke them, choke them, and do not allow them to grow."],[1669.0,"And so in this particular case, indeed, if we take no provision to protect this new birth, so to speak, this intention to live a pious life for Christ by proper education, also by making the necessary provisions to abstain from the things that lead us easily to sin, and so on, well, then of course that intention will die."],[1692.0,"Chapter 9"]]},{"k":"s","p":8,"i":0,"a":3,"t":1692.8,"x":"Experience teaches us that the restless and heaving motion of life thrusts from itself those who do not totally submerge themselves in the deceits of human affairs and it reckons as a useless burden those whose virtue is annoying."},{"k":"s","p":8,"i":1,"a":3,"t":1709.0,"x":"He who escapes from these things must imitate Moses and not spare his tears, even though he should be safe in the ark, for tears are the unfailing guardian of those saved by virtue."},{"k":"s","p":9,"i":0,"a":3,"t":1722.0,"x":"Since the daughter of the king, being childless and barren (I think she is rightly perceived as profane philosophy), arranged to be called his mother by adopting the youngster, Scripture concedes that his relationship with her who was falsely called his mother should not be rejected until he had recognized his own immaturity."},{"k":"s","p":9,"i":1,"a":3,"t":1742.0,"x":"But he who has already attained maturity, as we have learned about Moses, will be ashamed to be called the son of one who is barren by nature."},{"k":"c","a":3,"t":1751.0,"e":1767.0,"l":[[1751.0,"So in this particular case."],[1753.0,"Well, let's just read on."],[1755.0,"I think he."],[1756.0,"He gives a fairly good explanation."],[1758.0,"Further, before I comment, I'd like to sort of see the completion of St. Gregory's thought on this."],[1765.0,"Chapter 11."]]},{"k":"s","p":10,"i":0,"a":3,"t":1765.0,"x":"For truly barren is profane education, which is always in labor but never gives birth."},{"k":"s","p":10,"i":1,"a":3,"t":1770.0,"x":"For what fruit worthy of such pangs does philosophy show for being so long in labor?"},{"k":"s","p":10,"i":2,"a":3,"t":1776.0,"x":"Do not all who are full of wind and never come to term miscarry before they come to the light of the knowledge of God, although they could as well become men if they were not altogether hidden in the womb of barren wisdom?"},{"k":"s","p":11,"i":0,"a":3,"t":1795.6,"x":"Now after living with the princess of the Egyptians for such a long time that he seemed to share in their honors, he must return to his natural mother."},{"k":"s","p":11,"i":1,"a":3,"t":1804.0,"x":"Indeed he was not separated from her while he was being brought up by the princess but was nursed by his mother's milk, as the history states."},{"k":"s","p":11,"i":2,"a":3,"t":1811.4,"x":"This teaches, it seems to me, that if we should be involved with profane teachings during our education, we should not separate ourselves from the nourishment of the Church's milk, which would be her laws and customs."},{"k":"s","p":11,"i":3,"a":3,"t":1824.0,"x":"By these the soul is nourished and matured, thus being given the means of ascending the height."},{"k":"c","a":3,"t":1830.0,"e":1958.5,"l":[[1830.0,"So I think what he's basically saying that just as Moses was raised in Pharaoh's palace by his adoptive mother, the Egyptian princess, who was barren, so we can also benefit to a certain extent from barren pagan philosophy."],[1852.0,"We're not pagan, but secular in our particular case anymore."],[1858.0,"However."],[1859.0,"However, we must always have the connection, just as Moses did to his real mother, who nursed him with her milk and who taught him that he was a Hebrew and who, you know, explained to him who he was and what nation he belonged to, that he was part of the God's chosen people."],[1877.0,"So the one who is getting sort of the princess education should always have the divine education."],[1885.0,"And I would say indeed in another place, I think St. Gregory was it St. Gregory the Theologian."],[1895.0,"Or maybe it is St. Gregory of Nyssa, I can't remember which One of the two of them of the St. Gregory's says that only those who are ignorant want and want others to be ignorant, prohibit others to study external knowledge."],[1911.0,"We should not shy away from external knowledge in as much as it can serve our divine goals of glorifying God and attaining the kingdom of heaven."],[1925.0,"We could use the knowledge of the external society, of sort of the society outside the Church, especially recognizing those good things to which maybe they have arrived."],[1937.0,"And of course, from time to time, you know, we see that there's not that much good."],[1942.0,"But still, whatever is useful, whatever is good, can be used for the glory of God, and we should not shy away from it."],[1949.0,"However, we should always have the connection to the Church and to God and to our faith and remember who we are."],[1956.0,"Chapter 13."]]},{"k":"s","p":12,"i":0,"a":3,"t":1957.0,"x":"It is true that he who looks to both the profane doctrines and to the doctrines of the fathers will find himself between two antagonists."},{"k":"s","p":12,"i":1,"a":3,"t":1967.0,"x":"For the foreigner in worship is opposed to the Hebrew teaching, and contentiously strives to appear stronger than the Israelite."},{"k":"s","p":12,"i":2,"a":3,"t":1974.0,"x":"And so he seems to be to many of the more superficial who abandon the faith of their fathers and fight on the side of the enemy, becoming transgressors of the fathers' teaching."},{"k":"s","p":12,"i":3,"a":3,"t":1984.0,"x":"On the other hand, he who is great and noble in soul like Moses slays with his own hand the one who rises in opposition to true religion."},{"k":"c","a":3,"t":1995.0,"e":2044.5,"l":[[1995.0,"So I think this is the reference to Moses defending one of his fellow Israelites from an Egyptian and killing him."],[2006.0,"So he's saying, St. Gregory, and this is saying here where the two educations, the church education, the secular education, become antagonized."],[2016.0,"And of course there are enough secular people who would actually sort of very much want to assert their power, their supremacy, sort of their superiority over the church."],[2030.0,"Well, if we were to be noble like Moses, we would definitely recognize that the Church's teaching is true and we should stay with it."],[2042.0,"Chapter 14."]]},{"k":"s","p":13,"i":0,"a":3,"t":2043.0,"x":"One may, moreover, find this same conflict in us, for man is set before competitors as the prize of their contest."},{"k":"s","p":13,"i":1,"a":3,"t":2051.0,"x":"He makes the one with whom he sides the victor over the other."},{"k":"s","p":13,"i":2,"a":3,"t":2055.0,"x":"The fight of the Egyptian against the Hebrew is like the fight of idolatry against true religion, of licentiousness against self-control, of injustice against righteousness, of arrogance against humility, and of everything against what is perceived by its opposite."},{"k":"s","p":14,"i":0,"a":3,"t":2074.0,"x":"Moses teaches us by his own example to take our stand with virtue as with a kinsman and to kill virtue's adversary."},{"k":"s","p":14,"i":1,"a":3,"t":2081.0,"x":"The victory of true religion is the death and destruction of idolatry."},{"k":"s","p":14,"i":2,"a":3,"t":2086.0,"x":"So also injustice is killed by righteousness and arrogance is slain by humility."},{"k":"s","p":15,"i":0,"a":3,"t":2092.0,"x":"The dispute of the two Israelites with each other occurs also in us."},{"k":"c","a":3,"t":2098.0,"e":2124.0,"l":[[2098.0,"So we know from history that there were two Israelites who were quarreling with each other after Moses had killed an Egyptian."],[2109.0,"And when Moses said to them, why are you two brothers fighting with each other?"],[2114.0,"One of them, in an angry sort of unkind way, said, what?"],[2118.0,"Are you going to kill me like you killed the Egyptian the other day as well?"],[2122.0,"So"]]},{"k":"s","p":15,"i":1,"a":3,"t":2122.6,"x":"There would be no occasion for wicked, heretical opinions to arise unless erroneous reasonings withstood the truth."},{"k":"s","p":15,"i":2,"a":3,"t":2133.0,"x":"If, therefore, we by ourselves are too weak to give the victory to what is righteous, since the bad is stronger in its attacks and rejects the rule of truth, we must flee as quickly as possible (in accordance with the historical example) from the conflict to the greater and higher teaching of the mysteries."},{"k":"s","p":16,"i":0,"a":3,"t":2152.0,"x":"And if we must again live with a foreigner, that is to say, if need requires us to associate with profane wisdom, let us with determination scatter the wicked shepherds from their unjust use of the wells—which means let us reprove the teachers of evil for their wicked use of instruction."},{"k":"c","a":3,"t":2169.0,"e":2222.5,"l":[[2169.0,"So he then proceeds forward and saying, well, if we have to flee, Moses fled Egypt, obviously, and he avoided persecution by the Pharaoh for that one murder that he committed of the Egyptian as he defended an Israelite."],[2185.0,"And so here he's basically saying, scatter the wicked shepherds from their unjust use of the wells."],[2193.0,"This is something that took place in the land of Madian, where Moses married Sepporah, because her father Jethro was very grateful to Moses for defending his daughters from the shepherds, who basically, with their brute strength, drove the women away from the well with their animals and sort of watered their animals out of turn, out of proper turn."],[2217.0,"And this is what St. Gregory says about that."],[2220.0,"Chapter 18."]]},{"k":"s","p":17,"i":0,"a":3,"t":2221.0,"x":"In the same way we shall live a solitary life, no longer entangled with adversaries or mediating between them, but we shall live among those of like disposition and mind who are fed by us while all the movements of our soul are shepherded, like sheep, by the will of guiding reason."},{"k":"c","a":3,"t":2240.0,"e":2362.9,"l":[[2240.0,"Perhaps I think we should stop here, because now he's starting the chapters on the burning bush and perhaps even though our reading today is a little shorter than usual, we should sort of allow what we have read to sink in."],[2261.0,"Because now, since we're talking about such a great allegory and I think a very masterful sort of interpretation of the spiritual meaning of the Life of Moses by St. Gregory, I think probably it would be best just to stop here and then continue next week with a Burning bush, since that will be essentially like another chapter."],[2288.0,"So let us pray and we'll say goodbye for a week."],[2293.0,"Hopefully everything will go well."],[2294.0,"I hope everybody will be healthy and happy and sort of abiding with God and with his grace until the next time."],[2305.0,"A wonderful book."],[2306.0,"Many thanks for the recommendation."],[2308.0,"Many thanks to everyone for his support and for his prayers."],[2315.0,"Please continue to do so."],[2317.0,"Let us pray today and God willing, we will see you all next week."],[2323.0,"Shaheenshine Anu Jerusalem for the glory of the Lord is risen upon the Rejoice now and be glad and be radiant of the pure Theotokos in the resurrection of thy son."],[2341.0,"Once again I beg your forgiveness for my sort of scraggly chant in English."],[2348.0,"It's been quite some time since I heard that in church in English."],[2352.0,"So please do forgive me and bear with me."],[2356.0,"God bless you."],[2357.0,"Christ is risen and hopefully we'll see you all next week."]]}]},{"t":"The Burning Bush","p":[[19,"It is upon us who continue in this quiet and peaceful course of life that the truth will shine, illuminating the eyes of our soul with its own rays. This truth, which was then manifested by the ineffable and mysterious illumination which came to Moses, is God."],[20,"And if the flame by which the soul of the prophet was illuminated was kindled from a thorny bush, even this fact will not be useless for our inquiry. For if truth is God and truth is light—the Gospel testifies by these sublime and divine names to the God who made himself visible to us in the flesh — such guidance of virtue leads us to know that light which has reached down even to human nature. Lest one think that the radiance did not come from a material substance, this light did not shine from some luminary among the stars but came from an earthly bush and surpassed the heavenly luminaries in brilliance."],[21,"From this we learn also the mystery of the Virgin: The light of divinity which through birth shone from her into human life did not consume the burning bush, even as the flower of her virginity was not withered by giving birth."],[22,"That light teaches us what we must do to stand within the rays of the true light: Sandaled feet cannot ascend that height where the light of truth is seen, but the dead and earthly covering of skins, which was placed around our nature at the beginning when we were found naked because of disobedience to the divine will, must be removed from the feet of the soul."],[0,"When we do this, the knowledge of the truth will result and manifest itself. The full knowledge of being comes about by purifying our opinion concerning nonbeing."],[23,"In my view the definition of truth is this: not to have a mistaken apprehension of Being. Falsehood is a kind of impression which arises in the understanding about nonbeing: as though what does not exist does, in fact, exist. But truth is the sure apprehension of real Being. So, whoever applies himself in quietness to higher philosophical matters over a long period of time will barely apprehend what true Being is, that is, what possesses existence in its own nature, and what nonbeing is, that is, what is existence only in appearance, with no self-subsisting nature."],[24,"It seems to me that at the time the great Moses was instructed in the theophany he came to know that none of those things which are apprehended by sense perception and contemplated by the understanding really subsists, but that the transcendent essence and cause of the universe, on which everything depends, alone subsists."],[25,"For even if the understanding looks upon any other existing things, reason observes in absolutely none of them the self-sufficiency by which they could exist without participating in true Being. On the other hand, that which is always the same, neither increasing nor diminishing, immutable to all change whether to better or to worse (for it is far removed from the inferior and it has no superior), standing in need of nothing else, alone desirable, participated in by all but not lessened by their participation—this is truly real Being. And the apprehension of it is the knowledge of truth."],[26,"In the same way that Moses on that occasion attained to this knowledge, so now does everyone who, like him, divests himself of the earthly covering and looks to the light shining from the bramble bush, that is, to the Radiance which shines upon us through this thorny flesh and which is (as the Gospel says) the true light and the truth itself. A person like this becomes able to help others to salvation, to destroy the tyranny which holds power wickedly, and to deliver to freedom everyone held in evil servitude."],[0,"The transformation of the right hand and the rod's changing into a snake became the first of the miracles."],[27,"These seem to me to signify in a figure the mystery of the Lord's incarnation, a manifestation of deity to men which effects the death of the tyrant and sets free those under his power."],[28,"What leads me to this understanding is the testimony of the Prophets and the Gospel. The Prophet declares: This is the change of the right hand of the most High, indicating that, although the divine nature is contemplated in its immutability, by condescension to the weakness of human nature it was changed to our shape and form."],[29,"When the hand of the lawgiver was extended from his bosom it was changed to an unnatural complexion, and when placed again in his bosom, it returned to its own natural beauty. Again, the only begotten God who is in the bosom of the Father is he who is the right hand of the most High."],[30,"When he was manifested to us from the bosom of the Father, he was changed to be like us. After he wiped away our infirmities, he again returned to his own bosom the hand which had been among us and had received our complexion. (The Father is the bosom of the right hand.) What is impassible by nature did not change into what is passible, but what is mutable and subject to passions was transformed into impassibility through its participation in the immutable."],[31,"The change from a rod into a snake should not trouble the lovers of Christ—as if we were adapting the doctrine of the incarnation to an unsuitable animal. For the Truth himself through the voice of the Gospel does not refuse a comparison like this in saying: And the Son of Man must be lifted up as Moses lifted up the serpent in the desert."],[32,"The teaching is clear. For if the father of sin is called a serpent by Holy Scripture and what is born of the serpent is certainly a serpent, it follows that sin is synonymous with the one who begot it. But the apostolic word testifies that the Lord was made into sin for our sake by being invested with our sinful nature."],[33,"This figure therefore is rightly applied to the Lord. For if sin is a serpent and the Lord became sin, the logical conclusion should be evident to all: By becoming sin he became also a serpent, which is nothing other than sin. For our sake he became a serpent that he might devour and consume the Egyptian serpents produced by the sorcerers."],[34,"This done, the serpent was changed back into a rod by which sinners are brought to their senses, and those slackening on the upward and toilsome course of virtue are given rest, the rod of faith supporting them through their high hopes. Only faith can guarantee the blessings that we hope for."],[35,"He who has some insight into these things right away becomes a god to those who resist the truth, who have been distracted to a material and unsubstantial delusion. They disdain the discussion of Being as so much idle talk, as Pharaoh says: Who is Yahweh, that I should listen to him? I do not know Yahweh. He considered valuable only the material and fleshly things which characterize lives governed by the most irrational sense."],[36,"If, on the other hand, he had been strengthened by the illumination of the light and had received such strength and power against his enemies, then, as one who has developed as an athlete by strenuous practice under his trainer, he would boldly and confidently strip for the contest with his opponents. With that rod, the word of faith, in his hand, he would prevail against the Egyptian serpents."],[37,"The foreign wife will follow him, for there are certain things derived from profane education which should not be rejected when we propose to give birth to virtue. Indeed moral and natural philosophy may become at certain times a comrade, friend, and companion of life to the higher way, provided that the offspring of this union introduce nothing of a foreign defilement."],[38,"Since his son had not been circumcised so as to cut off completely everything hurtful and impure, the angel who met them brought the fear of death. His wife appeased the angel when she presented her offspring as pure by completely removing that mark by which the foreigner was known."],[39,"I think that if someone who has been initiated under the guidance of the history follow closely the order of the historical figures, the sequence of the development in virtue marked out in our account will be clear. There is something fleshly and uncircumcised in what is taught by philosophy's generative faculty; when that has been completely removed, there remains the pure Israelite race."],[40,"For example, pagan philosophy says that the soul is immortal. This is a pious offspring. But it also says that souls pass from bodies to bodies and are changed from a rational to an irrational nature. This is a fleshly and alien foreskin. And there are many other such examples. It says there is a God, burt it thinks of him as material. It acknowledges him as Creator, but says he needed matter for creation. It affirms that he is both good and powerful, but that in all things he submits to the necessity of fate."],[41,"And one could describe in some detail how good doctrines are contaminated by profane philosophy's absurd additions. When these are completely removed, the angel of God comes to us in mercy, as if rejoicing in the true offspring of these doctrines."]],"id":"b2-2","r":[19,41],"w":1588,"x":[{"k":"c","a":4,"t":2.0,"e":103.1,"l":[[2.0,"In the name of the Father and of the Son of the Holy Spirit."],[5.0,"Amen."],[5.0,"Christ is risen."],[7.0,"Dear friends, welcome back to our weekly readings of the Holy Fathers."],[14.0,"I'm sorry, I had a little bit of a technical issue here before starting, and it seems to be persisting."],[22.0,"So hopefully we'll pray in just a second."],[25.0,"And after we pray, we will continue our reading of St. Gregory of Nyssa."],[31.0,"Life of Moses."],[48.0,"Christ is risen from the dead, trampling down death by death, and on those in the tombs bestowing life."],[56.0,"Christ."],[56.0,"Christ has risen from the dead, trampling down dead by death, and on those in the tombs bestowing life."],[64.0,"Christ is risen from the dead, trampling down death by death, and on those in the tombs bestowing life."],[77.0,"Do forgive me for a bit of a delay with our start today."],[85.0,"We should be continuing our reading with the chapter on the burning bush."],[96.0,"So it is, I guess, paragraph 19."]]},{"k":"s","p":0,"i":0,"a":4,"t":102.0,"x":"It is upon us who continue in this quiet and peaceful course of life that the truth will shine, illuminating the eyes of our soul with its own rays."},{"k":"s","p":0,"i":1,"a":4,"t":112.0,"x":"This truth, which was then manifested by the ineffable and mysterious illumination which came to Moses, is God."},{"k":"c","a":4,"t":119.0,"e":130.4,"l":[[119.0,"So I assume here he is saying that God himself is the one who illuminated Moses."],[126.0,"Chapter 20, or paragraph 20."]]},{"k":"s","p":1,"i":0,"a":4,"t":129.0,"x":"And if the flame by which the soul of the prophet was illuminated was kindled from a thorny bush, even this fact will not be useless for our inquiry."},{"k":"s","p":1,"i":1,"a":4,"t":139.0,"x":"For if truth is God and truth is light—the Gospel testifies by these sublime and divine names to the God who made himself visible to us in the flesh — such guidance of virtue leads us to know that light which has reached down even to human nature."},{"k":"s","p":1,"i":2,"a":4,"t":154.8,"x":"Lest one think that the radiance did not come from a material substance, this light did not shine from some luminary among the stars but came from an earthly bush and surpassed the heavenly luminaries in brilliance."},{"k":"c","a":4,"t":169.0,"e":183.4,"l":[[169.0,"So here St. Gregory is saying that this particular light was brighter than the stars of heaven or heavenly lights, paragraph 21."]]},{"k":"s","p":2,"i":0,"a":4,"t":182.0,"x":"From this we learn also the mystery of the Virgin:"},{"k":"s","p":2,"i":1,"a":4,"t":185.1,"x":"The light of divinity which through birth shone from her into human life did not consume the burning bush, even as the flower of her virginity was not withered by giving birth."},{"k":"c","a":4,"t":195.0,"e":227.4,"l":[[195.0,"Well, that's a parallel that is well known and well used by not only St. Gregory, but by many other Church fathers."],[203.0,"And of course, it's quite beautiful that the bush was burning and it did not burn."],[211.0,"And that in and of itself was a foreshadowing of the birth of Christ from the Virgin and of the virgin womb."],[223.0,"That light, chapter paragraph 21."]]},{"k":"s","p":3,"i":0,"a":4,"t":226.0,"x":"That light teaches us what we must do to stand within the rays of the true light:"},{"k":"s","p":3,"i":1,"a":4,"t":230.7,"x":"Sandaled feet cannot ascend that height where the light of truth is seen, but the dead and earthly covering of skins, which was placed around our nature at the beginning when we were found naked because of disobedience to the divine will, must be removed from the feet of the soul."},{"k":"s","p":4,"i":0,"a":4,"t":249.0,"x":"When we do this, the knowledge of the truth will result and manifest itself."},{"k":"s","p":4,"i":1,"a":4,"t":254.0,"x":"The full knowledge of being comes about by purifying our opinion concerning nonbeing."},{"k":"s","p":5,"i":0,"a":4,"t":263.0,"x":"In my view the definition of truth is this: not to have a mistaken apprehension of Being."},{"k":"c","a":4,"t":269.0,"e":275.6,"l":[[269.0,"Being here is with a capital B."],[272.0,"So he's talking about God."]]},{"k":"s","p":5,"i":1,"a":4,"t":274.0,"x":"Falsehood is a kind of impression which arises in the understanding about nonbeing: as though what does not exist does, in fact, exist."},{"k":"s","p":5,"i":2,"a":4,"t":283.0,"x":"But truth is the sure apprehension of real Being."},{"k":"s","p":5,"i":3,"a":4,"t":290.0,"x":"So, whoever applies himself in quietness to higher philosophical matters over a long period of time will barely apprehend what true Being is, that is, what possesses existence in its own nature, and what nonbeing is, that is, what is existence only in appearance, with no self-subsisting nature."},{"k":"c","a":4,"t":309.4,"e":339.2,"l":[[309.4,"self subsiding, subsisting nature."],[311.0,"So if he is referring to the enemy of our salvation, then he's basically saying that he has no substance other than what was created to him by God."],[322.0,"And darkness has no material nature, it is only the absence of light."],[330.0,"And so non being is the absence of the being."],[333.0,"That's what it would seem like to me."],[336.0,"Chapter or, sorry,"]]},{"k":"s","p":6,"i":0,"a":4,"t":339.0,"x":"It seems to me that at the time the great Moses was instructed in the theophany he came to know that none of those things which are apprehended by sense perception and contemplated by the understanding really subsists, but that the transcendent essence and cause of the universe, on which everything depends, alone subsists."},{"k":"c","a":4,"t":361.0,"e":374.5,"l":[[361.0,"So basically everything exists in God, and if God does not will, well, nothing will sort of enter into existence."],[371.0,"Chapter or paragraph 25."]]},{"k":"s","p":7,"i":0,"a":4,"t":373.0,"x":"For even if the understanding looks upon any other existing things, reason observes in absolutely none of them the self-sufficiency by which they could exist without participating in true Being."},{"k":"s","p":7,"i":1,"a":4,"t":386.0,"x":"On the other hand, that which is always the same, neither increasing nor diminishing, immutable to all change whether to better or to worse (for it is far removed from the inferior and it has no superior), standing in need of nothing else, alone desirable, participated in by all but not lessened by their participation—this is truly real Being."},{"k":"s","p":7,"i":2,"a":4,"t":408.0,"x":"And the apprehension of it is the knowledge of truth."},{"k":"c","a":4,"t":412.0,"e":460.5,"l":[[412.0,"So basically, he's saying that everything exists in God, yet it does not diminish God's existence."],[418.0,"Everything sort of takes its beginning from him."],[424.0,"I think that St. Paul also says something along those lines where he says, because God acts sort of."],[437.0,"He acts in all men, you know, he upholds all of the creation."],[448.0,"And without the understanding of this ultimate existence and ultimate being, well, there's no understanding whatsoever at all."],[458.0,"Paragraph 26."]]},{"k":"s","p":8,"i":0,"a":4,"t":459.0,"x":"In the same way that Moses on that occasion attained to this knowledge, so now does everyone who, like him, divests himself of the earthly covering and looks to the light shining from the bramble bush, that is, to the Radiance which shines upon us through this thorny flesh and which is (as the Gospel says) the true light and the truth itself."},{"k":"s","p":8,"i":1,"a":4,"t":482.0,"x":"A person like this becomes able to help others to salvation, to destroy the tyranny which holds power wickedly, and to deliver to freedom everyone held in evil servitude."},{"k":"s","p":9,"i":0,"a":4,"t":493.0,"x":"The transformation of the right hand and the rod's changing into a snake became the first of the miracles."},{"k":"c","a":4,"t":500.0,"e":525.0,"l":[[500.0,"So basically, here he's talking about the fact that once someone gains the understanding of the true God, he's able to lead others to this understanding as well."],[511.0,"And this knowledge of the true God is the only way toward freedom from the passions of the flesh and of the soul as well."],[522.0,"Paragraph 27."]]},{"k":"s","p":10,"i":0,"a":4,"t":524.0,"x":"These seem to me to signify in a figure the mystery of the Lord's incarnation, a manifestation of deity to men which effects the death of the tyrant and sets free those under his power."},{"k":"s","p":11,"i":0,"a":4,"t":537.0,"x":"What leads me to this understanding is the testimony of the Prophets and the Gospel."},{"k":"s","p":11,"i":1,"a":4,"t":541.0,"x":"The Prophet declares: This is the change of the right hand of the most High, indicating that, although the divine nature is contemplated in its immutability, by condescension to the weakness of human nature it was changed to our shape and form."},{"k":"c","a":4,"t":556.0,"e":572.5,"l":[[556.0,"So basically, God, who is immutable and who is incomprehensible, made Himself comprehensible for men for our salvation."],[570.0,"Paragraph 29."]]},{"k":"s","p":12,"i":0,"a":4,"t":571.0,"x":"When the hand of the lawgiver was extended from his bosom it was changed to an unnatural complexion, and when placed again in his bosom, it returned to its own natural beauty."},{"k":"s","p":12,"i":1,"a":4,"t":581.0,"x":"Again, the only begotten God who is in the bosom of the Father is he who is the right hand of the most High."},{"k":"s","p":13,"i":0,"a":4,"t":590.0,"x":"When he was manifested to us from the bosom of the Father, he was changed to be like us."},{"k":"s","p":13,"i":1,"a":4,"t":595.0,"x":"After he wiped away our infirmities, he again returned to his own bosom the hand which had been among us and had received our complexion."},{"k":"s","p":13,"i":2,"a":4,"t":604.0,"x":"(The Father is the bosom of the right hand.) What is impassible by nature did not change into what is passible, but what is mutable and subject to passions was transformed into impassibility through its participation in the immutable."},{"k":"c","a":4,"t":610.6,"e":694.9,"l":[[610.6,"what is passable, but what is mutable and subject to passions was transformed into impassibility through its participation in the immutable."],[619.0,"So I imagine that just as Moses, when he put his hand into his bosom and he withdrew it, it was stricken with leprosy."],[627.0,"And then when he put it back and withdrew it, it was fine."],[631.0,"So St. Gregory draws a parallel in saying that the Lord sort of took on our fallen human nature."],[640.0,"It was as if he was stricken with our leprosy."],[643.0,"But then when he returned to the bosom of the Father of His resurrect after his resurrection, of course he was perfectly fine again."],[650.0,"Although once again he does say that Christ and God is impassable by nature."],[663.0,"So he did not change into what is passable, but what is mutable and subject to passions was transformed into impassibility through its participation in the immutable."],[672.0,"So he's saying, rather than God changing, we were changed and transfigured and transformed by our participation in Him."],[682.0,"And, and I would imagine here what is very important is the understanding that that is why the Lord says, unless ye eat my body and drink my blood, you have no"]]},{"k":"s","p":14,"i":0,"a":4,"t":706.0,"x":"The change from a rod into a snake should not trouble the lovers of Christ—as if we were adapting the doctrine of the incarnation to an unsuitable animal."},{"k":"s","p":14,"i":1,"a":4,"t":715.0,"x":"For the Truth himself through the voice of the Gospel does not refuse a comparison like this in saying:"},{"k":"s","p":14,"i":2,"a":4,"t":721.9,"x":"And the Son of Man must be lifted up as Moses lifted up the serpent in the desert."},{"k":"c","a":4,"t":723.7,"e":745.9,"l":[[723.7,"must be lifted up, as Moses lifted up the serpent in the desert, so later on in the life of the holy prophet Moses, of course we will see that as the people were stricken by snakes, as they were bitten by snakes, venomous snakes, and they were dying, Moses was told to erect a bronze serpent,"]]},{"k":"s","p":15,"i":0,"a":4,"t":749.0,"x":"The teaching is clear. For if the father of sin is called a serpent by Holy Scripture and what is born of the serpent is certainly a serpent, it follows that sin is synonymous with the one who begot it."},{"k":"s","p":15,"i":1,"a":4,"t":763.4,"x":"But the apostolic word testifies that the Lord was made into sin for our sake by being invested with our sinful nature."},{"k":"c","a":4,"t":771.7,"e":779.7,"l":[[771.7,"so he became sin for us."],[774.0,"I believe that was also in the words of St. Paul, paragraph 33."]]},{"k":"s","p":16,"i":0,"a":4,"t":778.0,"x":"This figure therefore is rightly applied to the Lord."},{"k":"s","p":16,"i":1,"a":4,"t":781.0,"x":"For if sin is a serpent and the Lord became sin, the logical conclusion should be evident to all:"},{"k":"s","p":16,"i":2,"a":4,"t":787.3,"x":"By becoming sin he became also a serpent, which is nothing other than sin."},{"k":"s","p":16,"i":3,"a":4,"t":792.0,"x":"For our sake he became a serpent that he might devour and consume the Egyptian serpents produced by the sorcerers."},{"k":"s","p":17,"i":0,"a":4,"t":801.0,"x":"This done, the serpent was changed back into a rod by which sinners are brought to their senses, and those slackening on the upward and toilsome course of virtue are given rest, the rod of faith supporting them through their high hopes."},{"k":"s","p":17,"i":1,"a":4,"t":814.5,"x":"Only faith can guarantee the blessings that we hope for."},{"k":"c","a":4,"t":819.0,"e":871.3,"l":[[819.0,"Now, the rod of faith supporting."],[822.0,"I think maybe this is a reference to the ascetics that would have been contemporaries of St. Gregory."],[830.0,"Because when we see sometimes in the icons the ascetics that had a rod, they would actually support themselves during the long vigils in the middle of the night when they would not sleep, but they would try to stand for prayer, and they would support themselves with rods."],[846.0,"And of course, when it comes to the understanding of the Lord becoming serpent, well, so he became sin for us in order to destroy our sin."],[856.0,"And so the rod of Moses swallowed the the rods of Janni and Jambre, the Egyptian sorcerers, Pharaoh Sorcerers, paragraph 35."]]},{"k":"s","p":18,"i":0,"a":4,"t":870.0,"x":"He who has some insight into these things right away becomes a god to those who resist the truth, who have been distracted to a material and unsubstantial delusion."},{"k":"s","p":18,"i":1,"a":4,"t":883.0,"x":"They disdain the discussion of Being as so much idle talk, as Pharaoh says:"},{"k":"s","p":18,"i":2,"a":4,"t":889.0,"x":"Who is Yahweh, that I should listen to him?"},{"k":"s","p":18,"i":3,"a":4,"t":892.0,"x":"I do not know Yahweh. He considered valuable only the material and fleshly things which characterize lives governed by the most irrational sense."},{"k":"c","a":4,"t":902.0,"e":942.0,"l":[[902.0,"So here I think St. Gregory is basically saying Pharaoh didn't recognize the God of Moses."],[908.0,"He just said, well, who is he?"],[910.0,"That I should obey him, that I should listen to him?"],[913.0,"And he rejected outright, you know, any sort of need to do what Moses ask them."],[921.0,"And we see that in a similar fashion, people who are the base slaves of sin say the same thing now and basically say, you know, that there's nothing other than this material life, and then there's no reason for them to follow the teachings of the Lord and the teachings of the Church."],[939.0,"Paragraph 36."]]},{"k":"s","p":19,"i":0,"a":4,"t":941.0,"x":"If, on the other hand, he had been strengthened by the illumination of the light and had received such strength and power against his enemies, then, as one who has developed as an athlete by strenuous practice under his trainer, he would boldly and confidently strip for the contest with his opponents."},{"k":"s","p":19,"i":1,"a":4,"t":957.0,"x":"With that rod, the word of faith, in his hand, he would prevail against the Egyptian serpents."},{"k":"s","p":20,"i":0,"a":4,"t":967.0,"x":"The foreign wife will follow him, for there are certain things derived from profane education which should not be rejected when we propose to give birth to virtue."},{"k":"s","p":20,"i":1,"a":4,"t":976.0,"x":"Indeed moral and natural philosophy may become at certain times a comrade, friend, and companion of life to the higher way, provided that the offspring of this union introduce nothing of a foreign defilement."},{"k":"c","a":4,"t":989.0,"e":1028.6,"l":[[989.0,"So now he's likening sort of the foreign wife of Moses to that external education which can actually be useful for the one who serves for the glory of God."],[1001.0,"And of course, we know that the contemporaries of St. Gregory of Nyssa, St. Gregory the Theologian, St. John Chrysostom, St."],[1008.0,"Basil the Great, had excellent secular education."],[1011.0,"They were perfectly educated in philosophy."],[1014.0,"And indeed they used that education for the glory of God and to further their service of Christ and the Church."],[1023.0,"And that is the comparison made here, paragraph 38."]]},{"k":"s","p":21,"i":0,"a":4,"t":1027.0,"x":"Since his son had not been circumcised so as to cut off completely everything hurtful and impure, the angel who met them brought the fear of death."},{"k":"s","p":21,"i":1,"a":4,"t":1036.0,"x":"His wife appeased the angel when she presented her offspring as pure by completely removing that mark by which the foreigner was known."},{"k":"c","a":4,"t":1044.0,"e":1074.5,"l":[[1044.0,"We know that initially the wife of Moses did not want one of the sons to be circumcised."],[1051.0,"She."],[1052.0,"She allowed one to be, and the other one she didn't."],[1054.0,"But when the angel threatened him with death, she definitely implored Moses to have the son circumcised right away, so as to appease the angel who appeared to her and for her son not to be."],[1070.0,"Not to be killed."],[1072.0,"Paragraph 39."]]},{"k":"s","p":22,"i":0,"a":4,"t":1073.0,"x":"I think that if someone who has been initiated under the guidance of the history follow closely the order of the historical figures, the sequence of the development in virtue marked out in our account will be clear."},{"k":"s","p":22,"i":1,"a":4,"t":1085.0,"x":"There is something fleshly and uncircumcised in what is taught by philosophy's generative faculty; when that has been completely removed, there remains the pure Israelite race."},{"k":"c","a":4,"t":1097.0,"e":1117.9,"l":[[1097.0,"So he's basically saying that the unnecessary portion of the philosophical teaching, the secular teaching, must be removed."],[1107.0,"And then when it is, then of course, obviously there is a true Israelite, meaning there's a true believer, a true Christian."],[1115.0,"Paragraph 40, for"]]},{"k":"s","p":23,"i":0,"a":4,"t":1116.3,"x":"For example, pagan philosophy says that the soul is immortal."},{"k":"s","p":23,"i":1,"a":4,"t":1120.8,"x":"This is a pious offspring."},{"k":"s","p":23,"i":2,"a":4,"t":1123.0,"x":"But it also says that souls pass from bodies to bodies and are changed from a rational to an irrational nature."},{"k":"s","p":23,"i":3,"a":4,"t":1130.0,"x":"This is a fleshly and alien foreskin."},{"k":"s","p":23,"i":4,"a":4,"t":1132.5,"x":"And there are many other such examples."},{"k":"s","p":23,"i":5,"a":4,"t":1135.4,"x":"It says there is a God, burt it thinks of him as material."},{"k":"s","p":23,"i":6,"a":4,"t":1140.0,"x":"It acknowledges him as Creator, but says he needed matter for creation."},{"k":"s","p":23,"i":7,"a":4,"t":1145.0,"x":"It affirms that he is both good and powerful, but that in all things he submits to the necessity of fate."},{"k":"c","a":4,"t":1152.4,"e":1171.5,"l":[[1152.4,"so basically, that is exactly what he's he's doing here."],[1156.0,"He's giving examples of where philosophy is true to an extent, and then has various things that should be set aside, such as the the setting aside of the foreskin in circumcision."],[1169.0,"Paragraph 41"]]},{"k":"s","p":24,"i":0,"a":4,"t":1170.0,"x":"And one could describe in some detail how good doctrines are contaminated by profane philosophy's absurd additions."},{"k":"s","p":24,"i":1,"a":4,"t":1178.0,"x":"When these are completely removed, the angel of God comes to us in mercy, as if rejoicing in the true offspring of these doctrines."}]},{"t":"The Meeting with Aaron","p":[[42,"We must return to the sequence in Scripture so that brotherly assistance might come out to meet us as we draw near the conflict with the Egyptians. For we remember the incidents of fighting and quarreling which involved Moses at the beginning of the life of virtue, the Egyptian oppressing the Hebrew and on another occasion a Hebrew disputing with his countryman."],[43,"For the one who has been lifted to the greatest virtue of soul by long training and supernatural illumination on the mountain, it is a friendly and peaceful encounter that takes place when his brother is brought by God to meet him. If this historical incident is taken in a more figurative spiritual sense, it will be found useful for our purpose."],[44,"For truly the assistance which God gives to our nature is provided to those who correctly live the life of virtue. This assistance was already there at our birth, but it is manifested and made known whenever we apply ourselves to diligent training in the higher life and strip ourselves for the more vigorous contests."],[45,"So as not to interpret the figures by our own figure, I shall set forth my understanding about this more plainly. There is a doctrine (which derives its trustworthiness from the tradition of the fathers) which says that after our nature fell into sin God did not disregard our fall and withhold his providence. No, on the one hand, he appointed an angel with an incorporeal nature to help in the life of each person and, on the other hand, he also appointed the corruptor who, by an evil and maleficent demon, afflicts the life of man and contrives against our nature."],[46,"Because man finds himself between these two who have contrary purposes for him, it is in his power to make the one prevail over the other. While the good angel by rational demonstration shows the benefits of virtue which are seen in hope by those who live aright, his opponent shows the material pleasures in which there is no hope of future benefits, but which are present, visible, can be partaken of, and enslave the senses of those who do not exercise their intellect."],[47,"If, then, one should withdraw from those who seduce him to evil and by the use of his reason turn to the better, putting evil behind him, it is as if he places his own soul, like a mirror, face to face with the hope of good things, with the result that the images and impressions of virtue, as it is shown to him by God, are imprinted on the purity of his soul. Then his brother brings him assistance and joins him, for the angel, who in a way is a brother to the rational and intellectual part of man's soul, appears, as I have said, and stands by us whenever we approach the Pharaoh."],[48,"If, while trying to parallel completely the historical account to the sequence of such intellectual contemplation, someone should somehow discover something in the account which does not coincide with our understanding, he should not reject the whole enterprise. He should always keep in mind our discussion's goal, to which we are looking while we relate these details. We have already said in our prologue that the lives of honored men would be set forth as a pattern of virtue for those who come after them."],[49,"Those who emulate their lives, however, cannot experience the identical literal events. For how could one again find the people multiplying during their sojourn in Egypt? And how again find the tyrant who enslaves the people and bears hostility to male offspring and allows the feminine and weaker to grow in numbers? And how again find all the other things which Scripture includes? Because therefore it has been shown to be impossible to imitate the marvels of these blessed men in these exact events, one might substitute a moral teaching for the literal sequence in those things which admit of such an approach. In this way those who have been striving toward virtue may find aid in living the virtuous life."],[50,"If the events require dropping from the literal account anything written which is foreign to the sequence of elevated understanding, we pass over this on the grounds that it is useless and unprofitable to our purpose, so as not to interrupt the guidance to virtue at such points."],[51,"I say these things concerning the interpretation of Aaron in order to anticipate the objection which will arise from what follows in the narrative. For someone will say that there is no doubt that the angel does share kinship with the soul in its intellectual and incorporeal aspects, that it already existed before our creation, and that it is allied with those engaged in the fight against the Adversary, but that it is not right to see Aaron, who led the Israelites in the worship of idols, as a type of the angel."],[52,"To him we shall reply, passing over the sequence, with the point already made, that what falls outside our purpose is not to overthrow the agreement which exists elsewhere. Moreover, both words, \"brother\" and \"angel,\" are alike applicable in the meaning they might have to opposite things."],[53,"For \"angel\" signifies not only an angel of God but also an angel of Satan. And we call \"brother\" not only a good brother but also a bad brother. So the Scripture speaks of the good, Brothers are proved in distress, and of the opposite, Every brother will utterly supplant."]],"id":"b2-3","r":[42,53],"w":925,"x":[{"k":"s","p":0,"i":0,"a":4,"t":1190.1,"x":"We must return to the sequence in Scripture so that brotherly assistance might come out to meet us as we draw near the conflict with the Egyptians."},{"k":"s","p":0,"i":1,"a":4,"t":1202.0,"x":"For we remember the incidents of fighting and quarreling which involved Moses at the beginning of the life of virtue, the Egyptian oppressing the Hebrew and on another occasion a Hebrew disputing with his countryman."},{"k":"s","p":1,"i":0,"a":4,"t":1214.6,"x":"For the one who has been lifted to the greatest virtue of soul by long training and supernatural illumination on the mountain, it is a friendly and peaceful encounter that takes place when his brother is brought by God to meet him."},{"k":"s","p":1,"i":1,"a":4,"t":1228.0,"x":"If this historical incident is taken in a more figurative spiritual sense, it will be found useful for our purpose."},{"k":"s","p":2,"i":0,"a":4,"t":1235.7,"x":"For truly the assistance which God gives to our nature is provided to those who correctly live the life of virtue."},{"k":"s","p":2,"i":1,"a":4,"t":1243.0,"x":"This assistance was already there at our birth, but it is manifested and made known whenever we apply ourselves to diligent training in the higher life and strip ourselves for the more vigorous contests."},{"k":"c","a":4,"t":1255.5,"e":1286.8,"l":[[1255.5,"basically he's saying in here that Aaron was older than Moses, and he was already there at his birth."],[1264.0,"But he became his assistant only when Moses arrived in Egypt with God's calling and with the purpose of taking the Israelites out of Egypt."],[1275.0,"So when he came with the goal of living a pious and virtuous life, Aaron was given to him for his help."],[1284.0,"Paragraph 4:45 so"]]},{"k":"s","p":3,"i":0,"a":4,"t":1284.8,"x":"So as not to interpret the figures by our own figure, I shall set forth my understanding about this more plainly."},{"k":"s","p":3,"i":1,"a":4,"t":1293.0,"x":"There is a doctrine (which derives its trustworthiness from the tradition of the fathers) which says that after our nature fell into sin God did not disregard our fall and withhold his providence."},{"k":"s","p":3,"i":2,"a":4,"t":1304.0,"x":"No, on the one hand, he appointed an angel with an incorporeal nature to help in the life of each person an
