 in the good. Such a shape is hard to move, since it is supported equally by the corners at each side."],[200,"The straps by which these adornments are tied to the arms seem to me to provide a teaching for the higher life, namely that practical philosophy should be joined to contemplative philosophy. So the heart becomes the symbol of contemplation, and the arms, of works."],[201,"The head adorned with the diadem signifies the crown reserved for those who have lived well. It is beautified by an inscription of ineffable letters in gold leaf. Whoever has put on such adornment wears no sandals so he will not be encumbered in his race and hindered by the covering of dead skins (which accords with the understanding obtained in our contemplation concerning the mount). How then is the sandal going to be an adornment for the foot when it is cast off at the first initiation as being an impediment to the ascent?"]],"id":"b2-19","r":[189,201],"w":1357},{"t":"The Tables of Stone","p":[[202,"He who has progressed this far through the ascents which we have contemplated carries in his hand the tables, written by God, which contain the divine Law. But these are broken, crushed by the harsh opposition of sinners. Their sin was that they made for idolatrous worship an image in the shape of a calf. The whole image was pulverized by Moses and mixed with water, and drunk by those who had sinned so that the material which served the godlessness of men was completely destroyed."],[203,"The history prophetically proclaimed at that time the things which have now come to pass in our own time. The error of idolatry utterly disappeared from life, being swallowed by pious mouths, which through good confession bring about the destruction of the material of godlessness. The mysteries established of old by idolators became running water, completely liquid, a water swallowed by the very mouths of those who were at one time idol-mad. When you see those who formerly stooped under such vanity now destroying those things in which they had trusted, does the history then not seem to you to cry out clearly that every idol will then be swallowed by the mouths of those who have left error for true religion?"],[204,"Moses armed the Levites against their fellow countrymen. And crossing the camp from one end to the other, they killed without inquiry, their swords finding their own victims. Death came to everyone they met, without preference; no distinction was made between enemy and friend, stranger and neighbor, kinsman and foreigner. (There was one thrust of the hand equally for everyone.) With equal energy the same thrust of the hand ran through everyone they fell upon."],[205,"This account provides the following useful lesson: Because the Israelites in a body agreed to the evil and because the whole camp to a man participated in it, they were all without distinction scourged. It is like someone punishing a person caught in an evil act by whipping him. Whatever part of the body he may hit, he tears to shreds with the scourge, knowing that the pain inflicted on that part extends throughout the whole body. The same thing happens when the whole body united in evil is punished: The scourging inflicted on the part chastens the whole."],[206,"So if at any time someone observes the same evil in many, but the wrath of God is vented not against everyone but only against some, it is fitting that one perceive the correction as administered through love for mankind. While not all are struck, the blows upon some chastise all to turn them from evil."],[207,"This understanding still pertains to the literal account, but the spiritual meaning would profit us in the following manner. The Lawgiver says in a general proclamation to all: If any man be on the Lord's side let him join with me. This is the Law commanding all: \"If anyone wishes to be the friend of God, let him be a friend of me, the Law\" (for the friend of the Law is certainly a friend of God). And he commands those gathered to him by such a proclamation to use the sword against their brother, friend, and neighbor."],[208,"As we observe the sequence of the contemplation, we perceive that everyone who looks to God and the Law is purified by the death of his evil habits. For not everyone is named brother or friend or neighbor in a good sense by the Scripture. It is possible for one to be both brother and foreigner, both friend and enemy, both neighbor and opponent. These we perceive as our innermost thoughts, whose life brings about our death and whose death brings about our life."],[209,"Such an understanding agrees with our earlier investigation of Aaron, when in his meeting with Moses we perceived the angel as an ally and helper who cooperated in the signs against the Egyptians. He is rightly perceived as being older, since the angelic and incorporeal nature was created before our nature, but he is clearly a brother by virtue of the kinship of his intellectual nature to ours."],[210,"While, then, there is a contradiction (because how is it possible to take in a good sense Moses' meeting with Aaron who became the Israelites' servant in making an idol?), nevertheless Scripture, in a limited sense, gives an indication of the double meaning of brotherhood, that the same word does not always signify the same thing but may be taken with opposite meanings. In one case the person killing the Egyptian tyrant is the brother; in another, it is the one molding the idol for the Israelites. Thus the same name is used in both instances."],[211,"Against such brothers, then, Moses bares the sword. For he very clearly lays down for himself the same requirement that he demands of others. One kills such a brother by destroying sin, for everyone who destroys some evil that the Adversary has contrived in him kills in himself that one who lives through sin."],[212,"The teaching on this matter may be more surely confirmed to us if we bring further details of the history to bear on this contemplation. It is said that at Aaron's command they took off their earrings, which provided the material for the idol. What shall we say about this? That Moses adorned the ears of the Israelites with an ornament for the ears, which is the Law, but the false brother through disobedience removes the ornament placed on their ears and makes an idol with it."],[213,"At the first entrance of sin the advice to disobey the commandment removed the earrings. The serpent was regarded as a friend and neighbor by the first mortals when he advised them that it would be useful and beneficial to them if they transgressed the divine commandment, that is, if they removed from their ears the earring of the commandment. Therefore, he who kills such brothers and friends and neighbors will hear from the Law that statement which the history says Moses spoke to those who killed them: Today you have won yourselves investiture as priests of Yahweh at the cost, one of his son, another of his brother; and so he grants you a blessing today."],[214,"I think it is time to call attention to those who gave themselves over to sin. Thus we may learn how the tables inscribed by God with the divine Law, which fell from Moses' hands to the ground and were broken by the impact, were restored again by Moses. The tables were not wholly the same, only the writing on them was the same. Having made the tables out of earthly matter, Moses submitted them to the power of the One who would engrave his Law upon them. In this way, while he carried the Law in letters of stone, he restored grace inasmuch as God himself had impressed the words on the stone."],[215,"For perhaps it is possible, as we are led by these events, to come to some perception of the divine concern for us. For if the divine Apostle speaks the truth when he calls the tables \"hearts,\" that is, the foremost part of the soul (and certainly he who by the Spirit... reaches... the depths of God does speak the truth), then it is possible to learn from this that human nature at its beginning was unbroken and immortal. Since human nature was fashioned by the divine hands and beautified with the unwritten characters of the Law, the intention of the Law lay in our nature in turning us away from evil and in honoring the divine."],[216,"When the sound of sin struck our ears, that sound which the first book of Scripture calls the \"voice of the serpent,\" but the history concerning the tables calls the \"voice of drunken singing,\" the tables fell to the earth and were broken. But again the true Lawgiver, of whom Moses was a type, cut the tables of human nature for himself from our earth. It was not marriage which produced for him his \"God-receiving\" flesh, but he became the stonecutter of his own flesh, which was carved by the divine finger, for the Holy Spirit came upon the virgin and the power of the Most High overshadowed her. When this took place, our nature regained its unbroken character, becoming immortal through the letters written by his finger. The Holy Spirit is called \"finger\" in many places by Scripture."],[217,"Moses was transformed to such a degree of glory that the mortal eye could not behold him."],[0,"Certainly he who has been instructed in the divine mystery of our faith knows how the contemplation of the spiritual sense agrees with the literal account. For when the restorer of our broken nature (you no doubt perceive in him the one who healed our brokenness) had restored the broken table of our nature to its original beauty—doing this by the finger of God, as I said—the eyes of the unworthy could no longer behold him. In his surpassing glory he becomes inaccessible to these who would look upon him."],[218,"For in truth, as the Gospel says, when he shall come in his glory escorted by all the angels, he is scarcely bearable and visible to the righteous. He who is impious and follows the Judaizing heresy remains without a share in that vision, for let the impious be removed, as Isaiah says, and he shall not see the glory of the Lord."]],"id":"b2-20","r":[202,218],"w":1582},{"t":"Eternal Progress","p":[[219,"While following these things in the sequence of our investigation, we were led to a deeper meaning in contemplating this passage. Let us return to the subject. How does someone who Scripture says saw God clearly in such divine appearances—face to face, as a man speaks with his friend — require that God appear to him, as though he who is always visible had not yet been seen, as though Moses had not yet attained what Scripture testifies he had indeed attained?"],[220,"The heavenly voice now grants the petitioner's request and does not deny this additional grace. Yet again He leads him to despair in that He affirms that what the petitioner seeks cannot be contained by human life. Still, God says there is a place with himself where there is a rock with a hole in it into which he commands Moses to enter. Then God placed his hand over the mouth of the hole and called out to Moses as he passed by. When Moses was summoned, he came out of the hole and saw the back of the One who called him. In this way he thought he saw what he was seeking, and the promise of the divine voice did not prove false."],[221,"If these things are looked at literally, not only will the understanding of those who seek God be dim, but their concept of him will also be inappropriate. Front and back pertain only to those things which are observed to have shape. Every shape provides the limits of a body. So then he who conceives of God in some shape will not realize that he is free of a bodily nature. It is a fact that every body is composite, and that what is composite exists by the joining of its different elements. No one would say that what is composite cannot be decomposed. And what decomposes cannot be incorruptible, for corruption is the decomposition of what is composite."],[222,"If therefore one should think of the back of God in a literal fashion, he will necessarily be carried to such an absurd conclusion. For front and back pertain to a shape, and shape pertains to a body. A body by its very nature can be decomposed, for everything composite is capable of dissolution. But what is being decomposed cannot be incorruptible; therefore, he who is bound to the letter would consequently conceive the Divine to be corruptible. But in fact God is incorruptible and incorporeal."],[223,"But what understanding other than the literal interpretation fits what is written? If this part of the written narrative compels us to seek out another understanding, it is certainly appropriate to understand the whole in the same way. Whatever we perceive in the part, we of necessity take as true for the whole, since every whole is made up of its parts. Wherefore the place with God, the rock at that place, the opening in it called a hole, Moses' entrance into it, the placing of the divine hand over its mouth, the passing by and the calling and after this the vision of the back—all this would more fittingly be contemplated in its spiritual sense."],[224,"What then is being signified? Bodies, once they have received the initial thrust downward, are driven downward by themselves with greater speed without any additional help as long as the surface on which they move is steadily sloping and no resistance to their downward thrust is encountered. Similarly, the soul moves in the opposite direction. Once it is released from its earthly attachment, it becomes light and swift for its movement upward, soaring from below up to the heights."],[225,"If nothing comes from above to hinder its upward thrust (for the nature of the Good attracts to itself those who look to it), the soul rises ever higher and will always make its flight yet higher—by its desire of the heavenly things straining ahead for what is still to come, as the Apostle says."],[226,"Made to desire and not to abandon the transcendent height by the things already attained, it makes its way upward without ceasing, ever through its prior accomplishments renewing its intensity for the flight. Activity directed toward virtue causes its capacity to grow through exertion; this kind of activity alone does not slacken its intensity by the effort, but increases it."],[227,"For this reason we also say that the great Moses, as he was becoming ever greater, at no time stopped in his ascent, nor did he set a limit for himself in his upward course. Once having set foot on the ladder which God set up (as Jacob says), he continually climbed to the step above and never ceased to rise higher, because he always found a step higher than the one he had attained."],[228,"He denied the specious kinship with the Egyptian queen. He avenged the Hebrew. He chose the desert way of life where there was no human being to disturb him. In himself he shepherded a flock of tame animals. He saw the brilliance of the light. Unencumbered, having taken off his sandals, he made his approach to the light. He brought his kinsmen and countrymen out to freedom. He saw the enemy drowning in the sea."],[229,"He made camps under the cloud. He quenched thirst with the rock. He produced bread from heaven. By stretching out his hands, he overcame the foreigner. He heard the trumpet. He entered the darkness. He slipped into the inner sanctuary of the tabernacle not made with hands. He learned the secrets of the divine priesthood. He destroyed the idol. He supplicated the divine Being. He restored the Law destroyed by the evil of the Jews."],[230,"He shone with glory. And although lifted up through such lofty experiences, he is still unsatisfied in his desire for more. He still thirsts for that with which he constantly filled himself to capacity, and he asks to attain as if he had never partaken, beseeching God to appear to him, not according to his capacity to partake, but according to God's true being."],[231,"Such an experience seems to me to belong to the soul which loves what is beautiful. Hope always draws the soul from the beauty which is seen to what is beyond, always kindles the desire for the hidden through what is constantly perceived. Therefore, the ardent lover of beauty, although receiving what is always visible as an image of what he desires, yet longs to be filled with the very stamp of the archetype."],[232,"And the bold request which goes up the mountains of desire asks this: to enjoy the Beauty not in mirrors and reflections, but face to face. The divine voice granted what was requested in what was denied, showing in a few words an immeasurable depth of thought. The munificence of God assented to the fulfillment of his desire, but did not promise any cessation or satiety of the desire."],[233,"He would not have shown himself to his servant if the sight were such as to bring the desire of the beholder to an end, since the true sight of God consists in this, that the one who looks up to God never ceases in that desire. For he says: You cannot see my face, for man cannot see me and live."],[234,"Scripture does not indicate that this causes the death of those who look, for how would the face of life ever be the cause of death to those who approach it? On the contrary, the Divine is by its nature lifegiving. Yet the characteristic of the divine nature is to transcend all characteristics. Therefore, he who thinks God is something to be known does not have life, because he has turned from true Being to what he considers by sense perception to have being."],[235,"True Being is true life. This Being is inaccessible to knowledge. If then the life-giving nature transcends knowledge, that which is perceived certainly is not life. It is not in the nature of what is not life to be the cause of life. Thus, what Moses yearned for is satisfied by the very things which leave his desire unsatisfied."],[236,"He learns from what was said that the Divine is by its very nature infinite, enclosed by no boundary. If the Divine is perceived as though bounded by something, one must by all means consider along with that boundary what is beyond it. For certainly that which is bounded leaves off at some point, as air provides the boundary for all that flies and water for all that live in it. Therefore, fish are surrounded on every side by water, and birds by air. The limits of the boundaries which circumscribe the birds or the fish are obvious: The water is the limit to what swims and the air to what flies. In the same way, God, if he is conceived as bounded, would necessarily be surrounded by something different in nature. It is only logical that what encompasses is much larger than what is contained."],[237,"Now it is agreed that the Divine is good in nature. But what is different in nature from the Good is surely something other than the Good. What is outside the Good is perceived to be evil in nature. But it was shown that what encompasses is much larger than what is encompassed. It most certainly follows, then, that those who think God is bounded conclude that he is enclosed by evil."],[238,"Since what is encompassed is certainly less than what encompasses, it would follow that the stronger prevails. Therefore, he who encloses the Divine by any boundary makes out that the Good is ruled over by its opposite. But that is out of the question. Therefore, no consideration will be given to anything enclosing infinite nature. It is not in the nature of what is unenclosed to be grasped. But every desire for the Good which is attracted to that ascent constantly expands as one progresses in pressing on to the Good."],[239,"This truly is the vision of God: never to be satisfied in the desire to see him. But one must always, by looking at what he can see, rekindle his desire to see more. Thus, no limit would interrupt growth in the ascent to God, since no limit to the Good can be found nor is the increasing of desire for the Good brought to an end because it is satisfied."],[240,"But what is that place which is seen next to God? What is the rock? And what again is the hole in the rock? What is the hand of God that covers the mouth of the rock? What is the passing by of God? What is his back which God promised to Moses when he asked to see him face to face?"],[241,"Naturally each of these things must be highly significant and worthy of the munificence of the divine Giver. Thus this promise is believed to be more magnificent and loftier than every theophany which had previously been granted to his great servant. How then would one, from what has been said, understand this height to which Moses desires to attain after such previous ascents and to which he who turns everything to their good cooperates with all those who love God makes the ascent easy through his leadership? Here is a place, he says, beside me."],[242,"The thought harmonizes readily with what has been contemplated before. In speaking of \"place\" he does not limit the place indicated by anything quantitative (for to something unquantitative there is no measure). On the contrary, by the use of the analogy of a measurable surface he leads the hearer to the unlimited and infinite. The text seems to signify some such understanding: \"Whereas, Moses, your desire for what is still to come has expanded and you have not reached satisfaction in your progress and whereas you do not see any limit to the Good, but your yearning always looks for more, the place with me is so great that the one running in it is never able to cease from his progress.\""],[243,"In another Scriptural passage the progress is a standing still, for it says, You must stand on the rock. This is the most marvelous thing of all: how the same thing is both a standing still and a moving."],[0,"For he who ascends certainly does not stand still, and he who stands still does not move upwards. But here the ascent takes place by means of the standing. I mean by this that the firmer and more immovable one remains in the Good, the more he progresses in the course of virtue. The man who in his reasonings is uncertain and liable to slip, since he has no firm grounding in the Good but is tossed one way and another and carried along (as the Apostle says) and is doubtful and wavers in his opinions concerning reality, would never attain to the height of virtue."],[244,"He is like those who toil endlessly as they climb uphill in sand: Even though they take long steps, their footing in the sand always slips downhill, so that, although there is much motion, no progress results from it. But if someone, as the Psalmist says, should pull his feet up from the mud of the pit and plant them upon the rock (the rock is Christ who is absolute virtue), then the more steadfast and unmoveable (according to the advice of Paul) he becomes in the Good the faster he completes the course. It is like using the standing still as if it were a wing while the heart flies upward through its stability in the good."],[245,"Therefore, he who showed Moses the place urges him on in his course. When he promised that he would stand him on the rock, he showed him the nature of that divine race. But the opening in the rock which Scripture calls a \"hole\" the divine Apostle interprets well in his own words when he speaks of a heavenly house not made with hands which is laid up by hope for those who have dissolved their earthly tabernacle."],[246,"For truly he who has run the race, as the Apostle says, in that wide and roomy stadium, which the divine voice calls \"place,\" and has kept the faith and, as the figurative expression says, has planted his feet on the rock; such a person will be adorned with the crown of righteousness from the hand of the contest's judge. This prize is described in different ways by Scripture."],[247,"For the same thing which is here called an opening in the rock is elsewhere referred to as \"pleasure of paradise,\" \"eternal tabernacle,\" \"mansion with the Father,\" \"bosom of the patriarch,\" \"land of the living,\" \"water of refreshment,\" \"Jerusalem which is above,\" \"kingdom of heaven,\" \"prize of calling,\" \"crown of graces,\" \"crown of pleasure,\" \"crown of beauty,\" \"pillar of strength,\" \"pleasure on a table,\" \"councils of God,\" \"throne of judgment,\" \"place of name,\" \"hidden tabernacle.\""],[248,"We say, then, that Moses' entrance into the rock has the same significance as these descriptions. For, since Christ is understood by Paul as the rock, all hope of good things is believed to be in Christ, in whom we have learned all the treasures of good things to be. He who finds any good finds it in Christ who contains all good."],[249,"He who attained to this and was shadowed by the hand of God, as the text promised (for the hand of God would be the creative power of what exists, the only begotten God, by whom all things were made, who is also \"place\" for those who run, who is, according to his own words, the \"way\" of the course, and who is \"rock\" to those who are well established and \"house\" to those who are resting), he it is who will hear the One who summons and will see the back of the One who calls, which means he will follow Yahweh your God, as the Law commands."],[250,"When the great David heard and understood this, he said to him who dwells in the shelter of the most High; He will overshadow you with his shoulders, which is the same as being behind God (for the shoulder is on the back of the body). Concerning himself David says, My soul clings close to you, your right hand supports me. You see how the Psalms agree with the history. For as the one says that the right hand is a help to the person who has joined himself close behind God, so the other says that the hand touches the person who waits in the rock upon the divine voice and prays that he might follow behind."],[251,"But when the Lord who spoke to Moses came to fulfill his own law, he likewise gave a clear explanation to his disciples, laying bare the meaning of what had previously been said in a figure when he said, If anyone wants to be a follower of mine and not \"If any man will go before me.\" And to the one asking about eternal life he proposes the same thing, for he says Come, follow me. Now, he who follows sees the back."],[252,"So Moses, who eagerly seeks to behold God, is now taught how he can behold Him: to follow God wherever he might lead is to behold God. His passing by signifies his guiding the one who follows, for someone who does not know the way cannot complete his journey safely in any other way than by following behind his guide. He who leads, then, by his guidance shows the way to the one following. He who follows will not turn aside from the right way if he always keeps the back of his leader in view."],[253,"For he who moves to one side or brings himself to face his guide assumes another direction for himself than the one his guide shows him. Therefore, he says to the one who is led, My face is not to be seen, that is, \"Do not face your guide.\" If he does so, his course will certainly be in the opposite direction, for good does not look good in the face, but follows it."],[254,"What is perceived to be its opposite is face to face with the good, for what looks virtue in the face is evil. But virtue is not perceived in contrast to virtue. Therefore, Moses does not look God in the face, but looks at his back; for whoever looks at him face to face shall not live, as the divine voice testifies, man cannot see the face of the Lord and live."],[255,"You see how it is so great a thing to learn how to follow God, that after those lofty ascents and awesome and glorious theophanies virtually at the end of his life, the man who has learned to follow behind God is scarcely considered worthy of this grace."]],"id":"b2-21","r":[219,255],"w":3166},{"t":"Moses Envied","p":[[256,"No longer does any offense which comes about through evil withstand the one who in this manner follows God. After these things the envy of his brothers arose against him. Envy is the passion which causes evil, the father of death, the first entrance of sin, the root of wickedness, the birth of sorrow, the mother of misfortune, the basis of disobedience, the beginning of shame. Envy banished us from Paradise, having become a serpent to oppose Eve. Envy walled us off from the tree of life, divested us of holy garments, and in shame led us away clothed with fig leaves."],[257,"Envy armed Cain contrary to nature and instituted the death which is vindicated seven times. Envy made Joseph a slave. Envy is the death-dealing sting, the hidden weapon, the sickness of nature, the bitter poison, the self-willed emaciation, the bitter dart, the nail of the soul, the fire in the heart, the flame burning on the inside."],[258,"For envy, it is not its own misfortune but another's good fortune that is unfortunate. Again, inversely, success is not one's own good fortune but the neighbor's misfortune. Envy is grieved at the good deeds of men and takes advantage of their misfortunes. It is said that the vultures which devour corpses are destroyed by perfume. Their nature is akin to the foul and corrupt. Anyone who is in the power of this sickness is destroyed by the happiness of his neighbors as by the application of some perfume; but if he should see any unfortunate experience he flies to it, sets his crooked beak to it, and draws forth the hidden misfortunes."],[259,"Envy fought against many who lived before Moses, but when it attacked this great man, it was broken like a clay pot being dashed against a rock. By this especially was shown the progress which Moses had made in his journey with God. He ran in the divine place, took his stand on the rock, was held in its opening, was covered by God's hand, and followed behind his leader, not looking him in the face, but looking at his back."],[260,"That he appeared higher than the bow can shoot shows that of himself he had become most blessed in following God. For envy also sends the dart against Moses, but it does not reach the height where Moses was. The bowstring of evil was too slack to shoot the passion far enough to reach Moses from those who were previously ill. But Aaron and Miriam were wounded by the passion of its evil influence and became like a bow of envy, shooting words against him rather than darts."],[261,"Moses so refrained from becoming involved in their weakness that he even ministered to the condition of those who had become ill. Not only was he not moved to defend himself against those who caused him sorrow, but he even besought God for mercy on their behalf. He showed through what he did, I think, that the person who is well fortified with the shield of virtue will not be stung by the tips of the darts."],[262,"He blunts the spears; the hardness of his armor deflects them. The armor that protects against such darts is God himself, whom the soldier of virtue puts on. For Scripture says let your armor be the Lord Jesus, that is to say, the full armor that cannot be pierced. Being thus well protected, Moses rendered the evil archer ineffective."],[263,"He did not rush to defend himself against those who caused him sorrow; although they had been condemned by impartial judgment and he knew what was the naturally right thing to do, he nevertheless interceded with God for his brethren. He would not have done this if he had not been behind God, who had shown him his back as a safe guide to virtue."]],"id":"b2-22","r":[256,263],"w":642},{"t":"Joshua and the Spies","p":[[264,"Let us proceed. When the natural enemy of men found no occasion to harm Moses, he directed the battle against those more vulnerable. When the lust of gluttony had been thrown at the people like a dart, he caused in them a desire for the things of Egypt so that they preferred the meat eaten by the Egyptians to the bread of heaven."],[265,"But Moses, having an elevated soul and soaring above such lust, was totally devoted to the coming inheritance which had been promised by God to those who departed from Egypt (spiritually understood) and made their way to that land flowing with milk and honey. For this reason he appointed some spies to be teachers of the beauties in that land."],[266,"The spies, in my opinion, are: on the one hand those who offer hope of good things are the reasonings born of faith which confirm hope for the good things laid up for us; on the other hand, the reasonings of the Adversary would be those who reject better hopes and blunt faith in the things reported."],[0,"Moses considered no report of the opponents trustworthy, but accepted the man who gave a more favorable report of that land."],[267,"Joshua was the one who led the better mission and he made the things reported trustworthy by his own confirmation. When Moses looked at him, he had a steady firm hope for the future, finding proof of that land's abundance in the bunch of grapes which Joshua had carried back on poles. Of course, when you hear of Joshua telling about that land and about a bunch of grapes hanging on the wood, you perceive what it is that he sees which makes him secure in his hopes."],[268,"What is the bunch of grapes suspended from the wood but that bunch suspended from the wood in the last days, whose blood becomes a saving drink for those who believe? Moses spoke to us of this ahead of time when he said in a figure: They drank the blood of the grape. By this he signifies the saving passion."]],"id":"b2-23","r":[264,268],"w":349},{"t":"The Brazen Serpent","p":[[269,"Again the way led through the desert, and the people lost hope in the good things promised and were reduced to thirst. Moses again made water flow in the desert for them. When it is perceived spiritually, this account teaches us what the mystery of repentance is. Those who turn to the stomach, the flesh, and the Egyptian pleasures, after having once tasted the rock, are sentenced to be excluded from partaking in good things."],[270,"But they can by repentance again find the rock which they abandoned and again open the spring of water for themselves and again take their fill. The rock gives forth water to Moses who believed that Joshua's spying is truer than his opponents', Moses who looked to the bunch of grapes which for our sakes was suspended and shed blood, and Moses who by the wood prepared water to gush from the rock again for them."],[271,"But the people had not yet learned to keep in step with Moses' greatness. They were still drawn down to the slavish passions and were inclined to the Egyptian pleasures. The history shows by this that human nature is especially drawn to this passion, being led to the disease along thousands of ways."],[272,"As a physician by his treatment prevents a disease from prevailing, so Moses does not permit the disease to cause death. Their unruly desires produced serpents which injected deadly poison into those they bit. The great lawgiver, however, rendered the real serpents powerless by the image of a serpent."],[273,"This would be an appropriate time to explain the figure. There is one antidote for these evil passions: the purification of our souls which takes place through the mystery of godliness. The chief act of faith in the \"mystery\" is to look to him who suffered the passion for us. The cross is the passion, so that whoever looks to it, as the text relates, is not harmed by the poison of desire."],[274,"To look to the cross means to render one's whole life dead and crucified to the world, unmoved by evil. Truly it is as the prophet says: \"They nail their own flesh with the fear of God.\" The nail would be the self-control that holds the flesh."],[275,"Since therefore unruly desires brought forth the deadly serpents from the earth (for every offspring of evil desire is a serpent), the Law prefigures for us what is clear in the wood. This figure is a likeness of a serpent and not a serpent itself, as the great Paul himself says, in the likeness of sinful flesh. Sin is the real serpent, and whoever deserts to sin takes on the nature of the serpent."],[276,"Man, then, is freed from sin through him who assumed the form of sin and became like us who had turned into the form of the serpent. He keeps the bites from causing death, but the beasts themselves are not destroyed. By beasts I mean desires. For although the evil of death which follows sins does not prevail against those who look to the cross, the lust of flesh against spirit has not completely ceased to exist."],[277,"In fact, the gnawings of desire are frequently active even in the faithful. Nevertheless, the person who looks to the One lifted up on the wood rejects passion, diluting the poison with the fear of the commandment as with a medicine. The voice of the Lord teaches clearly that the serpent lifted up in the desert is a symbol of the mystery of the cross when he says, The Son of Man must be lifted up as Moses lifted up the serpent in the desert."]],"id":"b2-24","r":[269,277],"w":609},{"t":"The True Priesthood","p":[[278,"Again sin advanced in evil succession in its customary way, progressing consistently as in an evil series. And the lawgiver, like a physician, accommodated the remedy to what the evil had produced."],[0,"When the bite of the serpents was ineffective against those who looked to the likeness of the serpent—you certainly perceive the figure through what has been said—another stratagem was contrived by him who with infinite variety devises such things against us."],[279,"It is possible even now to see this happening on many occasions. For when some individuals punish the passion of desire by living a disciplined life, they thrust themselves into the priesthood, and with human zeal and selfish ambition they arrogate to themselves God's ministry. He whom the history accuses of producing evil in men leads them to the subsequent sin."],[280,"When those who were lusting believed in the one lifted up on the wood, the earth stopped bringing forth serpents to bite them, and they then thought themselves to be above the venomous bites. It is then, when lustful desire leaves them, that the disease of arrogance enters in its place. Judging that to keep to their assigned place was too lowly a thing, they thrust themselves into the honor of the priesthood and contentiously thrust out those who had obtained this ministry from God. They were swallowed up by the yawning chasm and were destroyed. All of those left on the earth were burned to ashes by lightning."],[0,"The Scripture teaches in the history, I think, that when one arrogantly exalts himself he ends by falling even below the earth. And perhaps, if viewed through these events, arrogance might not unreasonably be defined as a downward ascent."],[281,"Do not be surprised if popular opinion leads to the opposite notion, for the masses think that the word \"arrogance\" means \"being above others.\" But the truth of the narrative confirms our definition. For if those who elevate themselves above others in some way go downward, as the earth opens a chasm for them, no one should argue with the definition of \"arrogance\" as \"an abject fall.\""],[282,"Moses instructs those who see this to be moderate and not to be puffed up by their right conduct but always to keep a good disposition in the present. Overcoming one's pleasures does not mean being no longer liable to be seized by another kind of passion, for every passion is a fall as long as it is a passion. The diversity in passions does not mean a different kind of fall. The man who slipped on slippery passion has fallen, as has the man who was tripped by arrogance. The intelligent man should prefer no kind of fall, but every fall should be equally avoided as long as it is a fall."],[283,"So if you should now see someone purifying himself to some degree of the disease of pleasure and with great zeal considering himself above others as he thrusts himself into the priesthood, realize that this man whom you see is someone who is falling to earth by his lofty arrogance. For in what follows the Law teaches that the priesthood is something divine and not human. It teaches this in the following manner."],[284,"Having marked the rods which he received from each tribe with the name of those who gave them, Moses placed them on the altar. The result was that one rod became a testimony to the heavenly ordination, for it was distinguished over the others by a divine miracle. This happened: The rods of the others remained as they were; but the rod of the priest took root by itself (not through any extraneous moisture but through the power which was placed in it by God), and brought forth branches and fruit, and the fruit ripened. The fruit was a nut."],[285,"By this event all the people were instructed in discipline. In the fruit that Aaron's rod produced it is fitting to perceive the kind of life that must characterize the priesthood—namely, a life self-controlled, tough and dried in appearance, but containing on the inside (hidden and invisible) what can be eaten. It becomes visible when the food ripens and the hard shell is stripped off and the wood-like covering of the meat is removed."],[286,"If you should discover the life of the priest we are discussing to be quince-like, fragrant and rosecolored, like the lives of many who are adorned with linen and purple and who fatten themselves at rich tables and who drink pure wine and anoint themselves with the best myrrh and who make use of whatever seems pleasant to those who have a taste for a life of luxury, then you would with good cause apply to this situation the word of the Gospel: \"When I look at your fruit, I do not recognize the priestly tree by it.\" The priesthood has one fruit and this kind of life another. The fruit of the one is self-control, that of the other is self-indulgence. The fruit of the priesthood does not mature from earthly moisture, but this kind of fruit has many streams of pleasure which flow from underneath, by which life's fruit is brought to a state of ripeness like this."]],"id":"b2-25","r":[278,286],"w":869},{"t":"The Royal Way","p":[[287,"When the people are purified of this passion, then they cross through the foreign life. As the Law leads them along the royal highway, they deviate from it in no way at all. It is easy for a traveler to turn aside. Suppose two precipices form a high narrow pass; from its middle the person crossing it veers at his peril in either direction (for the chasm on either side swallows the person who turns aside). In the same way the Law requires the person who keeps in step with it not to leave the way which is, as the Lord says, narrow and hard, to the left or to the right."],[288,"This teaching lays down that virtue is discerned in the mean. Accordingly, all evil naturally operates in a deficiency of or an excess of virtue. In the case of courage, cowardice is the lack of virtue and rashness is its excess. What is pure of each of these is seen to lie between these corresponding evils and is virtue. In the same way all other things which strive for the better also somehow take the middle road between the neighboring evils."],[289,"Wisdom holds to the mean between shrewdness and simplicity. Neither the wisdom of the serpent nor the simplicity of the dove is to be praised, if one should choose either of these with respect to itself alone. Rather it is the disposition which closely unites these two by the mean that is virtue. The person who lacks moderation is a libertine, and he who goes beyond moderation has his conscience branded, as the Apostle says. For the one has given himself up without restraint to pleasures, and the other defiles marriage as if it were adultery. The disposition observed in the mean between these two is moderation."],[290,"Since, as the Lord says, this world lies in wickedness, and everything opposed to virtue (which is wickedness) is foreign to those who follow the Law, the man who in his life makes his way through this world will safely conclude this necessary journey of virtue if he truly keeps to the highway which is hardened and smoothed by virtue and will under no circumstances be turned aside to any byways because of evil."]],"id":"b2-26","r":[287,290],"w":374},{"t":"Balaam and the Daughters of Moab","p":[[291,"Since, as has been said, the assault of the Adversary accompanies the ascent of virtue and seeks out corresponding opportunities to subvert toward evil, as the people improve in the godly life, the Adversary launches another attack such as experts in warfare use. These latter, when they estimate that their adversary has superior power in open battle, lay their plans for an ambush. In the same way evil's general no longer brings his power to bear openly against those empowered by the law and virtue, but he carries out his assault secretly by laying ambushes for them."],[292,"He calls in magic as his ally against those whom he assaults. The history says this magic is a diviner and augur who derived his presumably harmful power from the working of demons to use it against the adversaries and was paid by the ruler of the Midianites to curse those who live to God, but actually he turned the curse into a blessing. We perceive through the sequence of the things previously contemplated that magic is ineffective against those who live in virtue; on the contrary, those fortified by divine help prevail over every onslaught."],[293,"The history gives witness of divination by observing birds when it says of the one mentioned that he possessed powers of divination and received counsel from birds. Before this it testifies that he was taught things about his immediate undertaking by the braying of his ass. Because he usually received advice by the sounds made by irrational animals under demonic influence, Scripture clearly describes the utterance of the ass. It shows in this way that those who had previously been overtaken by deceit of demons have come to the point that, instead of reasoning, they accept teaching which comes to them from paying attention to the sound of irrational animals. By paying attention to the ass, he was instructed by those very things which had deceived him and learned that the power of those against whom he was hired was invincible."],[294,"In the Gospel history also the Legion, the horde of demons, was ready to oppose the authority of the Lord. When he who has power over all things drew near, Legion hailed his superior power and did not hide the truth that this was the divine nature which at the appropriate time punishes those who have sinned. For the voice of the demons says, We know who you are, the Holy One of God, and that, You have come here to torture us before the time. The same thing happened earlier when the demonic power which accompanied the diviner taught Balaam that the people of God are invincible."],[295,"But, as we bring the history into harmony with our earlier investigations, we say that whoever wishes to utter a curse against those who live in virtue can bring forth no harmful and maledictory sound at all, but that the curse turns into a blessing. What we mean is this: Railing reproach does not touch those who live virtuously."],[296,"For how can the man without possessions be reviled for covetousness? How can someone go around preaching on profligacy to the man who lives a retiring and secluded life? Or about temper to the mild man? Or about luxury to the man of moderate habits? Or about any other blameable things to those who are renowned for their opposites? Their goal is to present their life blameless, in order that, as the Apostle says, any opponent will be at a loss, with no accusation to make against us. Wherefore the voice of the one who has been called in to deliver the curse says, How shall I curse one whom God does not curse? That is to say, \"How shall I revile someone who has given no ground for reviling, whose life is impervious to evil because he looks to God?\""],[297,"When the inventor of evil failed in this, he still did not stop completely conniving against those he was assaulting. But, resorting to that trickery characteristic of him, he through pleasure again enticed nature to evil. Pleasure is truly like evil's bait; when it is thrown out lightly, it draws gluttonous souls to the fish hook of destruction. Especially through licentious pleasure is nature, when it is not on guard, drawn aside to evil. This is indeed what took place on that occasion."],[298,"For those who prevailed over the enemy's arms, who proved every assault made with iron weapons weaker than their own power, and who by their might turned their enemies' line of battle, were themselves wounded by feminine darts of pleasure. Those who were stronger than men were conquered by women. As soon as the women appeared to them, showing off comeliness instead of weapons, they forgot their manly strength and dissipated their vigor in pleasure."],[299,"It was only to be expected that some among them would be filled with lust for unlawful intercourse with foreigners. But intimacy with evil meant estrangement from the assistance of the Good; immediately God began to war against them. The zealous Phineas, however, did not wait to have sin purged by heavenly decision; he himself became at once judge and jury."],[300,"Having been moved to wrath against the men who were filled with lust, he did the work of a priest by purging the sin with blood, not the blood of some guiltless animal which had no part in the stain of licentiousness, but the blood of those who were joined with one another in evil. The spear, by piercing the two bodies conjointly, stayed divine justice, mixing pleasure with the death of those who sinned."],[301,"The history, it seems to me, offers some advice profitable to men. It teaches us that of the many passions which afflict men's thinking there is none so strong as the disease of pleasure. That those Israelites, who were manifestly stronger than the Egyptian cavalry and had prevailed over the Amalekites and had shown themselves awesome to the next nation and then had prevailed over the troops of the Midianites, were enslaved by this sickness at the very moment they saw the foreign women only shows, as I have said, that pleasure is an enemy of ours that is hard to fight and difficult to overcome."],[302,"By vanquishing by her very appearance those who had not been conquered by weapons, pleasure raised a trophy of dishonor against them and held up their shame to public scorn. Pleasure showed that she makes men beasts. The irrational animal impulse to licentiousness made them forget their human nature; they did not hide their excess but adorned themselves with the dishonor of passion and beautified themselves with the stain of shame as they wallowed, like pigs, in the slimy mire of uncleanness, openly for everyone to see."],[303,"What, then, are we taught by this account? This: that now having learned what great power for evil the disease of pleasure possesses, we should conduct our lives as far removed from it as possible; otherwise the disease may find some opening against us, like fire whose very proximity causes an evil flame. Solomon teaches this in Wisdom when he says that one should not walk upon hot coals with bare feet or hide fire in his bosom. So also it is in our power to remain unaffected by passion as long as we stay far away from the thing that enflames. If we come close enough to step on this burning heat, the fire of desire will burn in our breast and so it will follow that we are burned both in our feet and our breast."],[304,"In order that we might be kept far from such evil, the Lord in the Gospel with his own voice cuts out the very root of evil—namely, the desire which arises through sight—when he teaches that the person who welcomes passion by his taking a look gives an opening to the disease harmful to himself. For the evils of the passions, like a plague, when once they have gained possession of the critical parts, stop only at death."]],"id":"b2-27","r":[291,304],"w":1345},{"t":"The Perfection of the Servant","p":[[305,"I think there is no need to prolong the discourse by presenting to the reader the whole life of Moses as an example of virtue. For to anyone straining to the higher life what has been said provides amply for true wisdom. To anyone who shows weakness in toiling for virtue there would be no gain even if many more things should be written than what has been said."],[306,"Nevertheless, let us not forget our definition in the prologue. There we affirmed that the perfect life was such that no description of its perfection hinders its progress; the continual development of life to what is better is the soul's way to perfection. We would do well, by bringing our discourse up to the end of Moses's life, to show the certainty of the definition of perfection which we have proposed."],[307,"For he who elevates his life beyond earthly things through such ascents never fails to become even loftier than he was until, as I think, like an eagle in all things his life may be seen above and beyond the cloud whirling around the ether of spiritual ascent."],[308,"He was born when the Egyptians considered a Hebrew birth an offense. When the tyrant ruling at that time punished by his law every boy who was born, Moses triumphed over the murderous law, being saved at first by his parents and then by the very persons who laid down the law. And those who desired his death by law actually exercised great care not only for his life but also for his highly esteemed education by introducing the youth to all wisdom."],[309,"After this he stood above human honor and beyond royal dignity, considering it to be stronger and more royal to keep watch for virtue and to be beautified with its adornment than to be a spearman and to wear royal adornment."],[310,"Then he saved his countryman and struck down the Egyptian; in this we see by our interpretative contemplation both the friend and the enemy of the soul. Next, he made his retirement the teacher of lofty matters, and in this way his understanding was enlightened by the light which shone from the bush. And then he made haste to share with his countrymen the good things which came to him from God."],[311,"On that occasion he demonstrated his power in two ways, by warding off his opponents with ingenious blows one after the other and by doing good to his countrymen. He led this people through the sea on foot without making a fleet of ships for himself; instead, he made their faith a ship for crossing through the water. He made the bottom of the sea dry land for the Hebrews and the dry land sea for the Egyptians."],[312,"He sang the victory song. He was led by the pillar. He was enlightened by the heavenly fire. He prepared a table out of the food which came down to him from above. He drew water from the rock. He stretched forth his hands to destroy the Amalekites. He ascended the mountain. He entered the darkness. He heard the trumpet. He approached the divine nature. He was enclosed by the heavenly tabernacle. He adorned the priesthood. He built the tabernacle. He ordered life by the laws. He successfully waged his last wars in the manner we have described."],[313,"As the last of his right actions he punished licentiousness through the priesthood. This was signified by the wrath that Phineas showed against passion. After all these things he went to the mountain of rest. He did not set foot on the land below for which the people were longing by reason of the promise. He who preferred to live by what flowed from above no longer tasted earthly food. But having come to the very top of the mountain, he, like a good sculptor who has fashioned well the whole statue of his own life, did not simply bring his creation to an end but he placed the finishing touch on his work."],[314,"What does the history say about this? That Moses the servant of Yahweh died as Yahweh decreed, and no one has ever found his grave, his eyes were undimmed, and his face unimpaired. From this we learn that, when one has accomplished such noble actions, he is considered worthy of this sublime name, to be called servant of Yahweh, which is the same as saying that he is better than all others. For one would not serve God unless he had become superior to everyone in the world. This for him is the end of the virtuous life, an end wrought by the word of God. History speaks of \"death,\" a living death, which is not followed by the grave, or fills the tomb, or brings dimness to the eyes and aging to the person."],[315,"What then are we taught through what has been said? To have but one purpose in life: to be called servants of God by virtue of the lives we live. For when you conquer all enemies (the Egyptian, the Amalekite, the Idumaean, the Midianite), cross the water, are enlightened by the cloud, are sweetened by the wood, drink from the rock, taste of the food from above, make your ascent up the mountain through purity and sanctity; and when you arrive there, you are instructed in the divine mystery by the sound of the trumpets, and in the impenetrable darkness draw near to God by your faith, and there are taught the mysteries of the tabernacle and the dignity of the priesthood."],[316,"And when you, as a sculptor, carve in your own heart the divine oracles which you receive from God; and when you destroy the golden idol (that is, if you wipe from your life the desire of covetousness); and when you are elevated to such heights that you appear invincible to the magic of Balaam (by \"magic\" you will perceive the crafty deceit of this life through which men drugged as though by some philtre of Circe are changed into the form of irrational animals and leave their proper nature); and when you come through all these things, and the staff of the priesthood blossoms in you, drawing no moisture at all from the earth but having its own unique power for producing fruit (that is the nut whose first taste is bitter and tough but whose inside is sweet and edible); when you destroy everything which opposes your worth, as Dathan was swallowed in the earth and Core was consumed by the fire—then you will draw near to the goal."],[317,"I mean by \"goal\" that for the sake of which everything is done, for example: The goal of agriculture is the enjoyment of its fruits; the goal of building a house is living in it; the goal of commerce is wealth; and the goal of striving in contests is the prize. In the same way, too, the goal of the sublime way of life is being called a servant of God. Along with this honor is contemplated an end which is not covered by a tomb; it refers to the life lived simply and free from evil appendages."],[318,"Scripture describes another characteristic of this service to God: The eye is not dimmed nor does the person age. For how can an eye which is always in the light be dimmed by the darkness from which it is always separated? And the person who by every means achieves incorruption in his whole life admits no corruption in himself. For he who has truly come to be in the image of God and who has in no way turned aside from the divine character bears in himself its distinguishing marks and shows in all things his conformity to the archetype; he beautifies his own soul with what is incorruptible, unchangeable, and shares in no evil at all."]],"id":"b2-28","r":[305,318],"w":1317},{"t":"Conclusion","p":[[319,"These things concerning the perfection of the virtuous life, O Caesarius, man of God, we have briefly written for you, tracing in outline like a pattern of beauty the life of the great Moses so that each one of us might copy the image of the beauty which has been shown to us by imitating his way of life. What more trustworthy witness of the fact that Moses did attain the perfection which was possible would be found than the divine voice which said to him: I have known you more than all others? It is also shown in the fact that he is named the \"friend of God\" by God himself, and by preferring to perish with all the rest if the Divine One did not through his good will forgive their errors, he stayed God's wrath against the Israelites. God averted judgment so as not to grieve his friend. All such things are a clear testimony and demonstration of the fact that the life of Moses did ascend the highest mount of perfection."],[320,"Since the goal of the virtuous way of life was the very thing we have been seeking, and this goal has been found in what we have said, it is time for you, noble friend, to look to that example and, by transferring to your own life what is contemplated through spiritual interpretation of the things spoken literally, to be known by God and to become his friend. This is true perfection: not to avoid a wicked life because like slaves we servilely fear punishment, nor to do good because we hope for rewards, as if cashing in on the virtuous life by some business-like and contractual arrangement. On the contrary, disregarding all those things for which we hope and which have been reserved by promise, we regard falling from God's friendship as the only thing dreadful and we consider becoming God's friend the only thing worthy of honor and desire. This, as I have said, is the perfection of life."],[321,"As your understanding is lifted up to what is magnificent and divine, whatever you may find (and I know full well that you will find many things) will most certainly be for the common benefit in Christ Jesus. Amen."]],"id":"b2-29","r":[319,321],"w":375}]}]</script>
<script>
const BOOKS = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s), app = $('#app');
const LS = {get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
            set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const WPM = 230;
const mins = w => Math.max(1, Math.round(w / WPM));
const hm = m => m < 60 ? m + ' min' : Math.floor(m/60) + ' hr ' + (m%60 ? (m%60) + ' min' : '');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const HEART = 'M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1L12 21l7.7-7.6 1.1-1a5.5 5.5 0 0 0 0-7.8z';
const CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const CHEV = '<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';

// flat index of every section in reading order
const ALL = [], BYID = {}, BOOKBY = {};
BOOKS.forEach(b => { BOOKBY[b.id] = b; b.s.forEach((s, i) => { s.b = b; s.i = i; s.g = ALL.length; ALL.push(s); BYID[s.id] = s; }); });
const range = s => s.r ? (s.r[0] === s.r[1] ? '§' + s.r[0] : '§' + s.r[0] + '–' + s.r[1]) : '';

let done = LS.get('lom_done', {});        // {sectionId: timestamp}
let favs = LS.get('lom_favs', []);        // [{k, id, p, n, x, w}]
let last = LS.get('lom_last', null);      // {id, y}
const isDone = id => !!done[id];
function setDone(id, on){ if (on) done[id] = Date.now(); else delete done[id]; LS.set('lom_done', done); }
const fk = (id, p) => id + '/' + p;
const isFav = (id, p) => favs.some(f => f.k === fk(id, p));
const favCount = id => favs.filter(f => f.id === id).length;

/* ---------- theme + text settings ---------- */
const SUN='<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/>';
const MOON='<path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5a8.5 8.5 0 1 0 10.7 10.7z"/>';
function applyTheme(t){ document.documentElement.setAttribute('data-theme', t);
  $('#ttsvg').innerHTML = t === 'dark' ? SUN : MOON;
  $('#tcolor').setAttribute('content', t === 'dark' ? '#121614' : '#f4f1ea'); }
let theme = LS.get('lom_theme', null);
if (!theme) theme = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
applyTheme(theme);
$('#tt').onclick = () => { theme = theme === 'dark' ? 'light' : 'dark'; LS.set('lom_theme', theme); applyTheme(theme); };

const SIZES = [17, 19, 21, 23, 25, 28, 31];
let fs = LS.get('lom_fs', 21), font = LS.get('lom_font', 'sans');
const SERIF = '"New York","Iowan Old Style",ui-serif,Georgia,"Times New Roman",serif';
const SANS = '-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",system-ui,sans-serif';
function applyText(){
  document.documentElement.style.setProperty('--fs', fs + 'px');
  document.documentElement.style.setProperty('--rf', font === 'serif' ? SERIF : SANS);
  $('#fsv').textContent = fs;
  document.querySelectorAll('[data-f]').forEach(b => b.classList.toggle('on', b.dataset.f === font));
}
applyText();
function sizeStep(d){
  let i = SIZES.indexOf(fs); if (i < 0) i = 2;
  i = Math.min(SIZES.length - 1, Math.max(0, i + d)); fs = SIZES[i]; LS.set('lom_fs', fs); applyText();
}
$('#fsm').onclick = () => sizeStep(-1);
$('#fsp').onclick = () => sizeStep(1);
document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { font = b.dataset.f; LS.set('lom_font', font); applyText(); });
const sheet = $('#sheet'), scrim = $('#scrim');
const sheetOpen = on => { sheet.classList.toggle('open', on); scrim.classList.toggle('open', on); };
$('#aa').onclick = () => sheetOpen(!sheet.classList.contains('open'));
scrim.onclick = () => sheetOpen(false);
$('#favbtn').onclick = () => location.hash = '#favs';

let tt = null;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 1700); }

function setNav(backTo, label, brand){
  const b = $('#back');
  b.hidden = !backTo;
  if (backTo){ $('#backlab').textContent = label; b.onclick = () => location.hash = backTo; }
  $('#brand').textContent = brand;
}

/* ---------- stats ---------- */
function stats(list){
  const tot = list.length, fin = list.filter(s => isDone(s.id)).length;
  const wl = list.filter(s => !isDone(s.id)).reduce((a, s) => a + s.w, 0);
  const wt = list.reduce((a, s) => a + s.w, 0);
  return {tot, fin, left: tot - fin, minLeft: wl ? mins(wl) : 0, pct: wt ? Math.round(100 * (wt - wl) / wt) : 0};
}
function nextUp(){
  // the section you were last in if unfinished, else the next unfinished after it, else the first unfinished
  if (last && BYID[last.id] && !isDone(last.id)) return BYID[last.id];
  const from = last && BYID[last.id] ? BYID[last.id].g + 1 : 0;
  for (let i = 0; i < ALL.length; i++){ const s = ALL[(from + i) % ALL.length]; if (!isDone(s.id)) return s; }
  return null;
}

/* ---------- home ---------- */
function home(){
  setNav(null, '', 'The Life of Moses');
  const st = stats(ALL), nx = nextUp();
  let h = `<div class="hero"><div class="eyebrow">Gregory of Nyssa</div>
    <h1>The Life of Moses</h1><p>Concerning Perfection in Virtue</p></div>`;
  h += `<div class="prog">
    <div class="big">${st.left ? st.left + ' section' + (st.left === 1 ? '' : 's') + ' left' : 'All finished'}
      <small>${st.left ? 'About ' + hm(st.minLeft) + ' of reading to go' : 'Every section is marked read'}</small></div>
    <div class="track"><div class="fill" style="width:${st.pct}%"></div></div>
    <div class="plab"><span>${st.fin} of ${st.tot} finished</span><span>${st.pct}% read</span></div></div>`;
  if (nx){
    const started = last && last.id === nx.id;
    h += `<button class="cont" data-go="${nx.id}"><div class="ct">
      <div class="ck">${started ? 'Continue reading' : (st.fin ? 'Up next' : 'Start reading')}</div>
      <div class="cn">${nx.b.n} &middot; ${esc(nx.t)}</div></div>${CHEV}</button>`;
  }
  h += '<div class="sect">Books</div>';
  BOOKS.forEach(b => {
    const s = stats(b.s);
    h += `<button class="bk" data-b="${b.id}"><div class="bn">${b.n}</div><div class="bs">${esc(b.sub)}</div>
      <div class="bt"><div class="bf" style="width:${s.pct}%"></div></div>
      <div class="bp"><span>${s.fin} of ${s.tot} finished</span><span>${s.left ? hm(s.minLeft) + ' left' : 'Done'}</span></div></button>`;
  });
  const fc = favs.length;
  h += `<div class="sect">Favorites</div>
    <button class="nextc" style="margin-top:0" data-favs="1"><div class="ct"><div class="cn">${fc ? fc + ' saved passage' + (fc === 1 ? '' : 's') : 'No favorites yet'}</div>
    <div class="ck" style="text-transform:none;letter-spacing:0;font-weight:500;font-size:15px;margin-top:3px">Tap the heart beside any paragraph to save it</div></div>${CHEV}</button>`;
  h += `<div class="foot"><button id="reset">Reset reading progress</button></div>`;
  app.innerHTML = h;
  app.querySelectorAll('[data-go]').forEach(el => el.onclick = () => location.hash = '#s/' + el.dataset.go);
  app.querySelectorAll('[data-b]').forEach(el => el.onclick = () => location.hash = '#b/' + el.dataset.b);
  app.querySelector('[data-favs]').onclick = () => location.hash = '#favs';
  $('#reset').onclick = () => {
    if (!confirm('Clear all finished marks? Favorites are kept.')) return;
    done = {}; LS.set('lom_done', done); last = null; LS.set('lom_last', null); home();
  };
}

/* ---------- book ---------- */
function rowHTML(s, cur){
  const fc = favCount(s.id);
  const meta = [range(s), mins(s.w) + ' min'];
  return `<div class="row${isDone(s.id) ? ' done' : ''}" data-row="${s.id}">
    <button class="chk" data-chk="${s.id}" aria-label="${isDone(s.id) ? 'Mark unread' : 'Mark finished'}: ${esc(s.t)}"><i>${CHECK}</i></button>
    <button class="open" data-go="${s.id}"><div class="ot"><div class="on">${esc(s.t)}</div>
      <div class="om"><span>${meta.join(' &middot; ')}</span>${fc ? `<span class="h"><svg viewBox="0 0 24 24"><path d="${HEART}"/></svg>${fc}</span>` : ''}${cur ? '<span class="now">Reading</span>' : ''}</div></div>${CHEV}</button></div>`;
}
function book(id, flash){
  const b = BOOKBY[id]; if (!b) return home();
  setNav('#', 'Home', b.n);
  const st = stats(b.s);
  const todo = b.s.filter(s => !isDone(s.id));
  const fin = b.s.filter(s => isDone(s.id)).sort((a, c) => a.i - c.i);
  let h = `<div class="bhead"><div class="eyebrow">${b.n}</div><h1>${esc(b.sub)}</h1></div>
    <div class="prog" style="margin-top:16px">
      <div class="big">${st.left ? st.left + ' left' : 'All finished'}<small>${st.left ? 'About ' + hm(st.minLeft) + ' of reading to go' : 'Every section in this book is read'}</small></div>
      <div class="track"><div class="fill" style="width:${st.pct}%"></div></div>
      <div class="plab"><span>${st.fin} of ${st.tot} finished</span><span>${st.pct}%</span></div></div>`;
  h += `<div class="sect">To read (${todo.length})</div><div class="list">` +
       (todo.length ? todo.map(s => rowHTML(s, last && last.id === s.id)).join('') : '<div class="empty">Nothing left in this book.</div>') + '</div>';
  if (fin.length) h += `<div class="sect">Finished (${fin.length})</div><div class="list">` + fin.map(s => rowHTML(s, false)).join('') + '</div>';
  app.innerHTML = h;
  app.querySelectorAll('[data-go]').forEach(el => el.onclick = () => location.hash = '#s/' + el.dataset.go);
  app.querySelectorAll('[data-chk]').forEach(el => el.onclick = () => {
    const sid = el.dataset.chk, on = !isDone(sid);
    setDone(sid, on);
    const y = scrollY; book(id, sid); scrollTo(0, y);
    toast(on ? 'Marked finished' : 'Moved back to To read');
  });
  if (flash){ const r = app.querySelector(`[data-row="${flash}"]`); if (r) r.classList.add('flash'); }
}

/* ---------- reading ---------- */
let saveT = null, onRead = null;
function section(id, para){
  const s = BYID[id]; if (!s) return home();
  const b = s.b;
  setNav('#b/' + b.id, b.n, s.t);
  const prev = ALL[s.g - 1], next = ALL[s.g + 1];
  let h = `<div class="rhead"><div class="eyebrow">${b.n} &middot; ${s.i + 1} of ${b.s.length}</div>
    <h1>${esc(s.t)}</h1><div class="rmeta"><span>${range(s)} &middot; ${mins(s.w)} min read</span>
    ${isDone(s.id) ? `<span class="pill">${CHECK}Finished</span>` : ''}</div></div><div class="text" id="text">`;
  s.p.forEach((p, i) => {
    const f = isFav(s.id, i);
    h += `<div class="para${f ? ' faved' : ''}" id="p${i}" data-pi="${i}"><button class="fv" data-fv="${i}" aria-label="Favorite paragraph ${p[0] || ''}"><svg viewBox="0 0 24 24"><path d="${HEART}"/></svg></button>${p[0] ? `<span class="n">${p[0]}</span>` : ''}${esc(p[1])}</div>`;
  });
  h += '</div><div class="done-box" id="donebox"></div><div class="pn">';
  if (prev) h += `<button data-go="${prev.id}"><span>Previous${prev.b !== b ? ' &middot; ' + prev.b.n : ''}</span>${esc(prev.t)}</button>`;
  if (next) h += `<button data-go="${next.id}"><span>Next${next.b !== b ? ' &middot; ' + next.b.n : ''}</span>${esc(next.t)}</button>`;
  h += '</div>';
  app.innerHTML = h;
  drawDone(s);
  app.querySelectorAll('.pn [data-go]').forEach(el => el.onclick = () => location.hash = '#s/' + el.dataset.go);
  app.querySelectorAll('[data-fv]').forEach(el => el.onclick = e => {
    e.stopPropagation();
    const i = +el.dataset.fv, p = s.p[i], k = fk(s.id, i), at = favs.findIndex(f => f.k === k);
    if (at >= 0) favs.splice(at, 1);
    else favs.push({k, id: s.id, p: i, n: p[0], x: p[1], w: Date.now()});
    LS.set('lom_favs', favs);
    el.parentElement.classList.toggle('faved', at < 0);
    toast(at < 0 ? 'Saved to favorites' : 'Removed from favorites');
  });
  // where to land: a specific paragraph, else where you left off in this section
  requestAnimationFrame(() => {
    if (para != null){
      const el = document.getElementById('p' + para);
      if (el){ const top = $('#top').offsetHeight;
        scrollTo(0, Math.max(0, scrollY + el.getBoundingClientRect().top - top - 16));
        el.classList.add('hl'); setTimeout(() => el.classList.remove('hl'), 1600); }
    } else if (last && last.id === id && last.y > 0){
      const max = document.documentElement.scrollHeight - innerHeight;
      scrollTo(0, Math.round(last.y * max));
    }
    readBar();
  });
  last = {id, y: last && last.id === id ? last.y : 0}; LS.set('lom_last', last);
  onRead = () => {
    readBar();
    clearTimeout(saveT);
    saveT = setTimeout(() => {
      const max = document.documentElement.scrollHeight - innerHeight;
      last = {id, y: max > 0 ? Math.min(1, scrollY / max) : 0}; LS.set('lom_last', last);
    }, 250);
  };
}
function readBar(){
  const bar = $('#rbar');
  if (!onRead){ bar.style.width = 0; return; }
  const t = $('#text'); if (!t){ bar.style.width = 0; return; }
  const top = t.offsetTop, h = t.offsetHeight - innerHeight * .6;
  const p = h > 0 ? Math.min(1, Math.max(0, (scrollY - top + innerHeight * .3) / h)) : 1;
  bar.style.width = (p * 100) + '%';
}
addEventListener('scroll', () => { if (onRead) onRead(); }, {passive: true});

function drawDone(s){
  const box = $('#donebox'); if (!box) return;
  const nx = (() => { for (let i = s.g + 1; i < ALL.length; i++) if (!isDone(ALL[i].id)) return ALL[i];
                      for (let i = 0; i < s.g; i++) if (!isDone(ALL[i].id)) return ALL[i]; return null; })();
  if (!isDone(s.id)){
    box.innerHTML = `<button class="mark" id="mk">${CHECK}Mark as finished</button>`;
    $('#mk').onclick = () => { setDone(s.id, true); drawDone(s); toast('Marked finished');
      const pill = app.querySelector('.rmeta'); if (pill && !pill.querySelector('.pill')) pill.insertAdjacentHTML('beforeend', `<span class="pill">${CHECK}Finished</span>`); };
  } else {
    box.innerHTML = `<div class="isdone">${CHECK}Finished</div>` +
      (nx ? `<button class="nextc" id="nx"><div class="ct"><div class="ck">Up next &middot; ${nx.b.n}</div><div class="cn">${esc(nx.t)}</div></div>${CHEV}</button>`
          : `<div class="nextc"><div class="ct"><div class="cn">That was the last section. The whole book is read.</div></div></div>`) +
      `<button class="undo" id="undo">Mark as unread</button>`;
    if (nx) $('#nx').onclick = () => location.hash = '#s/' + nx.id;
    $('#undo').onclick = () => { setDone(s.id, false); drawDone(s);
      const pill = app.querySelector('.rmeta .pill'); if (pill) pill.remove(); toast('Marked unread'); };
  }
}

/* ---------- favorites ---------- */
function favsView(){
  setNav('#', 'Home', 'Favorites');
  const list = favs.filter(f => BYID[f.id]).sort((a, b) => BYID[a.id].g - BYID[b.id].g || a.p - b.p);
  let h = '<div class="bhead"><h1>Favorites</h1><p>' + (list.length ? list.length + ' saved, in reading order' : '') + '</p></div>';
  if (!list.length){
    app.innerHTML = h + '<div class="empty">Nothing saved yet. While reading, tap the heart beside any paragraph.</div>';
    return;
  }
  h += '<div class="feed">' + list.map(f => {
    const s = BYID[f.id];
    return `<div class="fcard"><div class="fsrc">${s.b.n} &middot; ${esc(s.t)}${f.n ? ' &middot; §' + f.n : ''}</div>
      <div class="ftx">${esc(f.x)}</div>
      <div class="frow"><button class="fgo" data-open="${f.id}|${f.p}">Open in context</button>
      <button class="fdel" data-drop="${f.k}">Remove</button></div></div>`;
  }).join('') + '</div>';
  app.innerHTML = h;
  app.querySelectorAll('[data-open]').forEach(el => el.onclick = () => {
    const [id, p] = el.dataset.open.split('|'); location.hash = '#s/' + id + '/' + p; });
  app.querySelectorAll('[data-drop]').forEach(el => el.onclick = () => {
    favs = favs.filter(f => f.k !== el.dataset.drop); LS.set('lom_favs', favs);
    const y = scrollY; favsView(); scrollTo(0, y); });
}

/* ---------- routing ---------- */
function route(){
  const h = location.hash || '';
  onRead = null; sheetOpen(false);
  window.scrollTo(0, 0);
  if (h.startsWith('#favs')){ favsView(); readBar(); return; }
  const s = h.match(/^#s\/([^/]+)(?:\/(\d+))?/);
  if (s) return section(s[1], s[2] != null ? +s[2] : null);
  const b = h.match(/^#b\/(.+)/);
  if (b){ book(b[1]); readBar(); return; }
  home(); readBar();
}
addEventListener('hashchange', route);
route();
</script></body></html>
