[1043.0,"Paragraph 274"]]},{"k":"s","p":5,"i":0,"a":12,"t":1043.8,"x":"To look to the cross means to render one's whole life dead and crucified to the world, unmoved by evil."},{"k":"s","p":5,"i":1,"a":12,"t":1052.0,"x":"Truly it is as the prophet says:"},{"k":"s","p":5,"i":2,"a":12,"t":1054.1,"x":"\"They nail their own flesh with the fear of God.\" The nail would be the self-control that holds the flesh."},{"k":"c","a":12,"t":1058.4,"e":1067.9,"l":[[1058.4,"self control that holds them flesh."],[1060.0,"I think that really requires no, no commentary that that's quite clear"]]},{"k":"s","p":6,"i":0,"a":12,"t":1069.0,"x":"Since therefore unruly desires brought forth the deadly serpents from the earth (for every offspring of evil desire is a serpent), the Law prefigures for us what is clear in the wood."},{"k":"s","p":6,"i":1,"a":12,"t":1080.0,"x":"This figure is a likeness of a serpent and not a serpent itself, as the great Paul himself says, in the likeness of sinful flesh."},{"k":"s","p":6,"i":2,"a":12,"t":1087.5,"x":"Sin is the real serpent, and whoever deserts to sin takes on the nature of the serpent."},{"k":"s","p":7,"i":0,"a":12,"t":1096.6,"x":"Man, then, is freed from sin through him who assumed the form of sin and became like us who had turned into the form of the serpent."},{"k":"s","p":7,"i":1,"a":12,"t":1105.0,"x":"He keeps the bites from causing death, but the beasts themselves are not destroyed."},{"k":"s","p":7,"i":2,"a":12,"t":1111.0,"x":"By beasts I mean desires."},{"k":"s","p":7,"i":3,"a":12,"t":1113.0,"x":"For although the evil of death which follows sins does not prevail against those who look to the cross, the lust of flesh against spirit has not completely ceased to exist."},{"k":"c","a":12,"t":1123.0,"e":1151.5,"l":[[1123.0,"So basically here he's saying that those who are baptized into Christ and who are making their best attempts to live a life of godliness, are not exempt, are not free from temptations."],[1140.0,"The desires still assail them, they approach them."],[1144.0,"But if they look to the cross, they can overcome them."],[1149.0,"Paragraph 277."]]},{"k":"s","p":8,"i":0,"a":12,"t":1150.0,"x":"In fact, the gnawings of desire are frequently active even in the faithful."},{"k":"s","p":8,"i":1,"a":12,"t":1155.0,"x":"Nevertheless, the person who looks to the One lifted up on the wood rejects passion, diluting the poison with the fear of the commandment as with a medicine."},{"k":"s","p":8,"i":2,"a":12,"t":1164.0,"x":"The voice of the Lord teaches clearly that the serpent lifted up in the desert is a symbol of the mystery of the cross when he says, The Son of Man must be lifted up as Moses lifted up the serpent in the desert."},{"k":"c","a":12,"t":1174.2,"e":1187.7,"l":[[1174.2,"must be lifted up as Moses lifted up the serpent in the desert."],[1178.0,"So of course we realize that, yes, the raising or the lifting up of the serpent is also a certain figure"]]}]},{"t":"The True Priesthood","p":[[278,"Again sin advanced in evil succession in its customary way, progressing consistently as in an evil series. And the lawgiver, like a physician, accommodated the remedy to what the evil had produced."],[0,"When the bite of the serpents was ineffective against those who looked to the likeness of the serpent—you certainly perceive the figure through what has been said—another stratagem was contrived by him who with infinite variety devises such things against us."],[279,"It is possible even now to see this happening on many occasions. For when some individuals punish the passion of desire by living a disciplined life, they thrust themselves into the priesthood, and with human zeal and selfish ambition they arrogate to themselves God's ministry. He whom the history accuses of producing evil in men leads them to the subsequent sin."],[280,"When those who were lusting believed in the one lifted up on the wood, the earth stopped bringing forth serpents to bite them, and they then thought themselves to be above the venomous bites. It is then, when lustful desire leaves them, that the disease of arrogance enters in its place. Judging that to keep to their assigned place was too lowly a thing, they thrust themselves into the honor of the priesthood and contentiously thrust out those who had obtained this ministry from God. They were swallowed up by the yawning chasm and were destroyed. All of those left on the earth were burned to ashes by lightning."],[0,"The Scripture teaches in the history, I think, that when one arrogantly exalts himself he ends by falling even below the earth. And perhaps, if viewed through these events, arrogance might not unreasonably be defined as a downward ascent."],[281,"Do not be surprised if popular opinion leads to the opposite notion, for the masses think that the word \"arrogance\" means \"being above others.\" But the truth of the narrative confirms our definition. For if those who elevate themselves above others in some way go downward, as the earth opens a chasm for them, no one should argue with the definition of \"arrogance\" as \"an abject fall.\""],[282,"Moses instructs those who see this to be moderate and not to be puffed up by their right conduct but always to keep a good disposition in the present. Overcoming one's pleasures does not mean being no longer liable to be seized by another kind of passion, for every passion is a fall as long as it is a passion. The diversity in passions does not mean a different kind of fall. The man who slipped on slippery passion has fallen, as has the man who was tripped by arrogance. The intelligent man should prefer no kind of fall, but every fall should be equally avoided as long as it is a fall."],[283,"So if you should now see someone purifying himself to some degree of the disease of pleasure and with great zeal considering himself above others as he thrusts himself into the priesthood, realize that this man whom you see is someone who is falling to earth by his lofty arrogance. For in what follows the Law teaches that the priesthood is something divine and not human. It teaches this in the following manner."],[284,"Having marked the rods which he received from each tribe with the name of those who gave them, Moses placed them on the altar. The result was that one rod became a testimony to the heavenly ordination, for it was distinguished over the others by a divine miracle. This happened: The rods of the others remained as they were; but the rod of the priest took root by itself (not through any extraneous moisture but through the power which was placed in it by God), and brought forth branches and fruit, and the fruit ripened. The fruit was a nut."],[285,"By this event all the people were instructed in discipline. In the fruit that Aaron's rod produced it is fitting to perceive the kind of life that must characterize the priesthood—namely, a life self-controlled, tough and dried in appearance, but containing on the inside (hidden and invisible) what can be eaten. It becomes visible when the food ripens and the hard shell is stripped off and the wood-like covering of the meat is removed."],[286,"If you should discover the life of the priest we are discussing to be quince-like, fragrant and rosecolored, like the lives of many who are adorned with linen and purple and who fatten themselves at rich tables and who drink pure wine and anoint themselves with the best myrrh and who make use of whatever seems pleasant to those who have a taste for a life of luxury, then you would with good cause apply to this situation the word of the Gospel: \"When I look at your fruit, I do not recognize the priestly tree by it.\" The priesthood has one fruit and this kind of life another. The fruit of the one is self-control, that of the other is self-indulgence. The fruit of the priesthood does not mature from earthly moisture, but this kind of fruit has many streams of pleasure which flow from underneath, by which life's fruit is brought to a state of ripeness like this."]],"id":"b2-25","r":[278,286],"w":869,"x":[{"k":"s","p":0,"i":0,"a":12,"t":1192.0,"x":"Again sin advanced in evil succession in its customary way, progressing consistently as in an evil series."},{"k":"s","p":0,"i":1,"a":12,"t":1199.0,"x":"And the lawgiver, like a physician, accommodated the remedy to what the evil had produced."},{"k":"s","p":1,"i":0,"a":12,"t":1204.0,"x":"When the bite of the serpents was ineffective against those who looked to the likeness of the serpent—you certainly perceive the figure through what has been said—another stratagem was contrived by him who with infinite variety devises such things against us."},{"k":"s","p":2,"i":0,"a":12,"t":1220.0,"x":"It is possible even now to see this happening on many occasions."},{"k":"s","p":2,"i":1,"a":12,"t":1224.0,"x":"For when some individuals punish the passion of desire by living a disciplined life, they thrust themselves into the priesthood, and with human zeal and selfish ambition they arrogate to themselves God's ministry."},{"k":"s","p":2,"i":2,"a":12,"t":1239.0,"x":"He whom the history accuses of producing evil in men leads them to the subsequent sin."},{"k":"c","a":12,"t":1245.0,"e":1266.0,"l":[[1245.0,"So I think in this particular case there was a rebellion against the priesthood of Aaron."],[1251.0,"There were those who were saying, why is it that Aaron is appointed a priest?"],[1256.0,"You know, are we not all worthy to be priests?"],[1258.0,"And of course there was a punishment against those who rebelled."],[1263.0,"Paragraph 280."]]},{"k":"s","p":3,"i":0,"a":12,"t":1265.0,"x":"When those who were lusting believed in the one lifted up on the wood, the earth stopped bringing forth serpents to bite them, and they then thought themselves to be above the venomous bites."},{"k":"s","p":3,"i":1,"a":12,"t":1277.0,"x":"It is then, when lustful desire leaves them, that the disease of arrogance enters in its place."},{"k":"s","p":3,"i":2,"a":12,"t":1282.4,"x":"Judging that to keep to their assigned place was too lowly a thing, they thrust themselves into the honor of the priesthood and contentiously thrust out those who had obtained this ministry from God."},{"k":"s","p":3,"i":3,"a":12,"t":1295.0,"x":"They were swallowed up by the yawning chasm and were destroyed."},{"k":"s","p":3,"i":4,"a":12,"t":1299.0,"x":"All of those left on the earth were burned to ashes by lightning."},{"k":"c","a":12,"t":1302.4,"e":1316.9,"l":[[1302.4,"by lightning."],[1303.0,"So we know that the Scripture tells us that the earth opened and swallowed those who rebelled against Moses and Aaron, and those who were not swallowed were burned"]]},{"k":"s","p":4,"i":0,"a":12,"t":1317.0,"x":"The Scripture teaches in the history, I think, that when one arrogantly exalts himself he ends by falling even below the earth."},{"k":"s","p":4,"i":1,"a":12,"t":1325.0,"x":"And perhaps, if viewed through these events, arrogance might not unreasonably be defined as a downward ascent."},{"k":"c","a":12,"t":1332.0,"e":1344.0,"l":[[1332.0,"So that's very nice."],[1333.0,"Well, of course we know that the Scripture also says that pride comes before a fall."],[1341.0,"Paragraph 281."]]},{"k":"s","p":5,"i":0,"a":12,"t":1343.0,"x":"Do not be surprised if popular opinion leads to the opposite notion, for the masses think that the word \"arrogance\" means \"being above others.\" But the truth of the narrative confirms our definition."},{"k":"s","p":5,"i":1,"a":12,"t":1357.6,"x":"For if those who elevate themselves above others in some way go downward, as the earth opens a chasm for them, no one should argue with the definition of \"arrogance\" as \"an abject fall.\""},{"k":"c","a":12,"t":1370.0,"e":1384.5,"l":[[1370.0,"Well, yes, because arrogance, when it comes to fruition, definitely brings about a fall."],[1378.0,"And so I think I Definitely agree with St. Gregory here."],[1382.0,"Paragraph 282."]]},{"k":"s","p":6,"i":0,"a":12,"t":1383.0,"x":"Moses instructs those who see this to be moderate and not to be puffed up by their right conduct but always to keep a good disposition in the present."},{"k":"s","p":6,"i":1,"a":12,"t":1392.0,"x":"Overcoming one's pleasures does not mean being no longer liable to be seized by another kind of passion, for every passion is a fall as long as it is a passion."},{"k":"s","p":6,"i":2,"a":12,"t":1401.3,"x":"The diversity in passions does not mean a different kind of fall."},{"k":"s","p":6,"i":3,"a":12,"t":1405.0,"x":"The man who slipped on slippery passion has fallen, as has the man who was tripped by arrogance."},{"k":"s","p":6,"i":4,"a":12,"t":1411.0,"x":"The intelligent man should prefer no kind of fall, but every fall should be equally avoided as long as it is a fall."},{"k":"c","a":12,"t":1420.3,"e":1450.0,"l":[[1420.3,"whether you slip or you trip, it really doesn't matter."],[1423.0,"This is what St. Gregory is saying."],[1425.0,"So one should avoid just as much as one avoids falling through sort of passionate sins just in the same amount."],[1436.0,"Just as much one should avoid falls through arrogance and through, you know, sort of being haughty and thinking that one is deserving of the grace of the priesthood."],[1447.0,"Paragraph 283."]]},{"k":"s","p":7,"i":0,"a":12,"t":1449.0,"x":"So if you should now see someone purifying himself to some degree of the disease of pleasure and with great zeal considering himself above others as he thrusts himself into the priesthood, realize that this man whom you see is someone who is falling to earth by his lofty arrogance."},{"k":"s","p":7,"i":1,"a":12,"t":1466.0,"x":"For in what follows the Law teaches that the priesthood is something divine and not human."},{"k":"s","p":7,"i":2,"a":12,"t":1471.0,"x":"It teaches this in the following manner."},{"k":"s","p":8,"i":0,"a":12,"t":1475.0,"x":"Having marked the rods which he received from each tribe with the name of those who gave them, Moses placed them on the altar."},{"k":"s","p":8,"i":1,"a":12,"t":1482.0,"x":"The result was that one rod became a testimony to the heavenly ordination, for it was distinguished over the others by a divine miracle."},{"k":"s","p":8,"i":2,"a":12,"t":1489.8,"x":"This happened: The rods of the others remained as they were; but the rod of the priest took root by itself (not through any extraneous moisture but through the power which was placed in it by God), and brought forth branches and fruit, and the fruit ripened."},{"k":"s","p":8,"i":3,"a":12,"t":1505.0,"x":"The fruit was a nut."},{"k":"s","p":9,"i":0,"a":12,"t":1512.0,"x":"By this event all the people were instructed in discipline."},{"k":"s","p":9,"i":1,"a":12,"t":1515.5,"x":"In the fruit that Aaron's rod produced it is fitting to perceive the kind of life that must characterize the priesthood—namely, a life self-controlled, tough and dried in appearance, but containing on the inside (hidden and invisible) what can be eaten."},{"k":"s","p":9,"i":2,"a":12,"t":1533.0,"x":"It becomes visible when the food ripens and the hard shell is stripped off and the wood-like covering of the meat is removed."},{"k":"c","a":12,"t":1542.0,"e":1594.5,"l":[[1542.0,"Well, so we know that because the priesthood of Aaron was challenged."],[1548.0,"And since Aaron was Moses brother, there were those who were saying that Moses was guilty of nepotism, of promoting his own brother."],[1555.0,"So they, you know, were not very pleased and said, why is it that we are not given the priesthood?"],[1562.0,"And of course Moses prayed to God for guidance on how to settle that situation."],[1567.0,"Because it was not Moses who intended to make Aaron a priest."],[1572.0,"It was God who told Moses to do that."],[1575.0,"And so God told Moses to collect the staves."],[1581.0,"And once the stabs were placed on the altar, altar, it was the rod of Aaron which blossomed forth."],[1592.0,"Paragraph 286."]]},{"k":"s","p":10,"i":0,"a":12,"t":1593.0,"x":"If you should discover the life of the priest we are discussing to be quince-like, fragrant and rosecolored, like the lives of many who are adorned with linen and purple and who fatten themselves at rich tables and who drink pure wine and anoint themselves with the best myrrh and who make use of whatever seems pleasant to those who have a taste for a life of luxury, then you would with good cause apply to this situation the word of the Gospel:"},{"k":"s","p":10,"i":1,"a":12,"t":1618.0,"x":"\"When I look at your fruit, I do not recognize the priestly tree by it.\" The priesthood has one fruit and this kind of life another."},{"k":"s","p":10,"i":2,"a":12,"t":1626.0,"x":"The fruit of the one is self-control, that of the other is self-indulgence."},{"k":"s","p":10,"i":3,"a":12,"t":1631.0,"x":"The fruit of the priesthood does not mature from earthly moisture, but this kind of fruit has many streams of pleasure which flow from underneath, by which life's fruit is brought to a state of ripeness like this."},{"k":"c","a":12,"t":1644.0,"e":1690.4,"l":[[1644.0,"So I guess in this particular case what he's saying is that the priesthood, the."],[1651.0,"The fruit of the priesthood is."],[1658.0,"Is not requiring earthly moisture because the rod was suspended in the air, and yet it blossomed and brought forth fruit."],[1668.0,"So it's not the same kind of juices that a regular tree, a regular planted tree would actually sort of draw to produce the fruit."],[1678.0,"So the fruit of the priesthood is the gift of the spirit."],[1681.0,"That's also a very interesting thought."],[1685.0,"Next chapter, the Royal Way, paragraph 287."]]}]},{"t":"The Royal Way","p":[[287,"When the people are purified of this passion, then they cross through the foreign life. As the Law leads them along the royal highway, they deviate from it in no way at all. It is easy for a traveler to turn aside. Suppose two precipices form a high narrow pass; from its middle the person crossing it veers at his peril in either direction (for the chasm on either side swallows the person who turns aside). In the same way the Law requires the person who keeps in step with it not to leave the way which is, as the Lord says, narrow and hard, to the left or to the right."],[288,"This teaching lays down that virtue is discerned in the mean. Accordingly, all evil naturally operates in a deficiency of or an excess of virtue. In the case of courage, cowardice is the lack of virtue and rashness is its excess. What is pure of each of these is seen to lie between these corresponding evils and is virtue. In the same way all other things which strive for the better also somehow take the middle road between the neighboring evils."],[289,"Wisdom holds to the mean between shrewdness and simplicity. Neither the wisdom of the serpent nor the simplicity of the dove is to be praised, if one should choose either of these with respect to itself alone. Rather it is the disposition which closely unites these two by the mean that is virtue. The person who lacks moderation is a libertine, and he who goes beyond moderation has his conscience branded, as the Apostle says. For the one has given himself up without restraint to pleasures, and the other defiles marriage as if it were adultery. The disposition observed in the mean between these two is moderation."],[290,"Since, as the Lord says, this world lies in wickedness, and everything opposed to virtue (which is wickedness) is foreign to those who follow the Law, the man who in his life makes his way through this world will safely conclude this necessary journey of virtue if he truly keeps to the highway which is hardened and smoothed by virtue and will under no circumstances be turned aside to any byways because of evil."]],"id":"b2-26","r":[287,290],"w":374,"x":[{"k":"s","p":0,"i":0,"a":12,"t":1689.0,"x":"When the people are purified of this passion, then they cross through the foreign life."},{"k":"s","p":0,"i":1,"a":12,"t":1693.0,"x":"As the Law leads them along the royal highway, they deviate from it in no way at all."},{"k":"s","p":0,"i":2,"a":12,"t":1698.0,"x":"It is easy for a traveler to turn aside."},{"k":"s","p":0,"i":3,"a":12,"t":1701.9,"x":"Suppose two precipices form a high narrow pass; from its middle the person crossing it veers at his peril in either direction (for the chasm on either side swallows the person who turns aside)."},{"k":"s","p":0,"i":4,"a":12,"t":1714.0,"x":"In the same way the Law requires the person who keeps in step with it not to leave the way which is, as the Lord says, narrow and hard, to the left or to the right."},{"k":"c","a":12,"t":1724.0,"e":1767.7,"l":[[1724.0,"So the Royal Way, the royal path by the Holy Fathers, is presented as that which goes straight."],[1732.0,"It's the straight and narrow path without the deviation to the right or to the left."],[1737.0,"You might say that in an ascetic struggle it means one should not veer to the right, meaning overly exert himself and thus suffer damage."],[1750.0,"Neither should one overly lacks in ascetic struggle and also suffer loss because of being sort of inattentive or lacking order and intention."],[1765.0,"Perspective, paragraph 288."]]},{"k":"s","p":1,"i":0,"a":12,"t":1766.0,"x":"This teaching lays down that virtue is discerned in the mean."},{"k":"s","p":1,"i":1,"a":12,"t":1772.0,"x":"Accordingly, all evil naturally operates in a deficiency of or an excess of virtue."},{"k":"s","p":1,"i":2,"a":12,"t":1779.0,"x":"In the case of courage, cowardice is the lack of virtue and rashness is its excess."},{"k":"s","p":1,"i":3,"a":12,"t":1785.0,"x":"What is pure of each of these is seen to lie between these corresponding evils and is virtue."},{"k":"s","p":1,"i":4,"a":12,"t":1791.0,"x":"In the same way all other things which strive for the better also somehow take the middle road between the neighboring evils."},{"k":"c","a":12,"t":1799.0,"e":1918.0,"l":[[1799.0,"That, I think is quite interesting, especially in our day."],[1805.0,"And age, when so many people are so eager to go one way or another, to rush, to take sides and so on, it's very important to remember, to focus, follow on the royal path."],[1828.0,"The fear of God and the fear and remembrance of death."],[1834.0,"Well, I would say that in this particular case, the, the example that you mentioned from Elder Cleopa, you might say that the fear of God and the fear of death, of course, course, are not deviations from the right way."],[1847.0,"I might see them as the guiding ropes or perils."],[1850.0,"So as you travel the narrow path, you have the fear of God on the one hand, and the fear of death, sort of the remembrance of death on the other."],[1859.0,"That will actually hold you up and sort of help you stay in the straight and narrow."],[1863.0,"That's what I would think about that."],[1865.0,"Thank you."],[1866.0,"That's a very, very good comment."],[1868.0,"And I would almost be inclined to say that perhaps the fear of God and the fear of death are not the sides sort of from the path, because really and truly they are virtues in and of themselves."],[1887.0,"But of course, an excess in any virtue would not be good."],[1892.0,"So, yes, that's how I would, I would say that."],[1897.0,"Or perhaps, you know, the fear of God and if, and sort of the memory of death are like the two staves in the, in the hands of the one who is walking."],[1907.0,"So one can, you know, be."],[1908.0,"Be sort of uplifted on both sides."],[1915.0,"Paragraph 289."]]},{"k":"s","p":2,"i":0,"a":12,"t":1917.0,"x":"Wisdom holds to the mean between shrewdness and simplicity."},{"k":"s","p":2,"i":1,"a":12,"t":1921.0,"x":"Neither the wisdom of the serpent nor the simplicity of the dove is to be praised, if one should choose either of these with respect to itself alone."},{"k":"s","p":2,"i":2,"a":12,"t":1929.0,"x":"Rather it is the disposition which closely unites these two by the mean that is virtue."},{"k":"s","p":2,"i":3,"a":12,"t":1935.0,"x":"The person who lacks moderation is a libertine, and he who goes beyond moderation has his conscience branded, as the Apostle says."},{"k":"s","p":2,"i":4,"a":12,"t":1943.0,"x":"For the one has given himself up without restraint to pleasures, and the other defiles marriage as if it were adultery."},{"k":"s","p":2,"i":5,"a":12,"t":1950.0,"x":"The disposition observed in the mean between these two is moderation."},{"k":"c","a":12,"t":1954.0,"e":2019.0,"l":[[1954.0,"Now, this is a very good point, because recently I was looking at the Book of Canons, the church canons, and in fact it says that if anyone should consider marriage to be defilement, let him be cast out, excommunicated."],[1972.0,"And if anyone, it says, abstains from food for the sake of virtue, for the sake of, what do you call it, sort of practice and temperance, then it's good."],[1985.0,"But if anyone abstains from any food because he says that food is defiled, naturally defiled, then let him be cast out because no food can defile us."],[1999.0,"Of course, we're not talking about food sacrificed to idols."],[2002.0,"That's."],[2003.0,"That's a different situation."],[2004.0,"But just naturally, if somebody says, well, you know, I won't eat pork because it is unclean, well, that's, that's."],[2013.0,"That."],[2013.0,"That's not acceptable."],[2016.0,"Paragraph 290."]]},{"k":"s","p":3,"i":0,"a":12,"t":2018.0,"x":"Since, as the Lord says, this world lies in wickedness, and everything opposed to virtue (which is wickedness) is foreign to those who follow the Law, the man who in his life makes his way through this world will safely conclude this necessary journey of virtue if he truly keeps to the highway which is hardened and smoothed by virtue and will under no circumstances be turned aside to any byways because of evil."},{"k":"c","a":12,"t":2045.0,"e":2072.4,"l":[[2045.0,"Give me just one second."],[2047.0,"I'll be right back."],[2048.0,"I just have to."],[2055.0,"I have a candle burning and it's."],[2058.0,"It was almost finished in a porcelain candle holder, so I didn't want it to."],[2062.0,"To crack it."],[2064.0,"The next chapter."],[2066.0,"Balaam and the Daughters of MOAB paragraph 291."]]}]},{"t":"Balaam and the Daughters of Moab","p":[[291,"Since, as has been said, the assault of the Adversary accompanies the ascent of virtue and seeks out corresponding opportunities to subvert toward evil, as the people improve in the godly life, the Adversary launches another attack such as experts in warfare use. These latter, when they estimate that their adversary has superior power in open battle, lay their plans for an ambush. In the same way evil's general no longer brings his power to bear openly against those empowered by the law and virtue, but he carries out his assault secretly by laying ambushes for them."],[292,"He calls in magic as his ally against those whom he assaults. The history says this magic is a diviner and augur who derived his presumably harmful power from the working of demons to use it against the adversaries and was paid by the ruler of the Midianites to curse those who live to God, but actually he turned the curse into a blessing. We perceive through the sequence of the things previously contemplated that magic is ineffective against those who live in virtue; on the contrary, those fortified by divine help prevail over every onslaught."],[293,"The history gives witness of divination by observing birds when it says of the one mentioned that he possessed powers of divination and received counsel from birds. Before this it testifies that he was taught things about his immediate undertaking by the braying of his ass. Because he usually received advice by the sounds made by irrational animals under demonic influence, Scripture clearly describes the utterance of the ass. It shows in this way that those who had previously been overtaken by deceit of demons have come to the point that, instead of reasoning, they accept teaching which comes to them from paying attention to the sound of irrational animals. By paying attention to the ass, he was instructed by those very things which had deceived him and learned that the power of those against whom he was hired was invincible."],[294,"In the Gospel history also the Legion, the horde of demons, was ready to oppose the authority of the Lord. When he who has power over all things drew near, Legion hailed his superior power and did not hide the truth that this was the divine nature which at the appropriate time punishes those who have sinned. For the voice of the demons says, We know who you are, the Holy One of God, and that, You have come here to torture us before the time. The same thing happened earlier when the demonic power which accompanied the diviner taught Balaam that the people of God are invincible."],[295,"But, as we bring the history into harmony with our earlier investigations, we say that whoever wishes to utter a curse against those who live in virtue can bring forth no harmful and maledictory sound at all, but that the curse turns into a blessing. What we mean is this: Railing reproach does not touch those who live virtuously."],[296,"For how can the man without possessions be reviled for covetousness? How can someone go around preaching on profligacy to the man who lives a retiring and secluded life? Or about temper to the mild man? Or about luxury to the man of moderate habits? Or about any other blameable things to those who are renowned for their opposites? Their goal is to present their life blameless, in order that, as the Apostle says, any opponent will be at a loss, with no accusation to make against us. Wherefore the voice of the one who has been called in to deliver the curse says, How shall I curse one whom God does not curse? That is to say, \"How shall I revile someone who has given no ground for reviling, whose life is impervious to evil because he looks to God?\""],[297,"When the inventor of evil failed in this, he still did not stop completely conniving against those he was assaulting. But, resorting to that trickery characteristic of him, he through pleasure again enticed nature to evil. Pleasure is truly like evil's bait; when it is thrown out lightly, it draws gluttonous souls to the fish hook of destruction. Especially through licentious pleasure is nature, when it is not on guard, drawn aside to evil. This is indeed what took place on that occasion."],[298,"For those who prevailed over the enemy's arms, who proved every assault made with iron weapons weaker than their own power, and who by their might turned their enemies' line of battle, were themselves wounded by feminine darts of pleasure. Those who were stronger than men were conquered by women. As soon as the women appeared to them, showing off comeliness instead of weapons, they forgot their manly strength and dissipated their vigor in pleasure."],[299,"It was only to be expected that some among them would be filled with lust for unlawful intercourse with foreigners. But intimacy with evil meant estrangement from the assistance of the Good; immediately God began to war against them. The zealous Phineas, however, did not wait to have sin purged by heavenly decision; he himself became at once judge and jury."],[300,"Having been moved to wrath against the men who were filled with lust, he did the work of a priest by purging the sin with blood, not the blood of some guiltless animal which had no part in the stain of licentiousness, but the blood of those who were joined with one another in evil. The spear, by piercing the two bodies conjointly, stayed divine justice, mixing pleasure with the death of those who sinned."],[301,"The history, it seems to me, offers some advice profitable to men. It teaches us that of the many passions which afflict men's thinking there is none so strong as the disease of pleasure. That those Israelites, who were manifestly stronger than the Egyptian cavalry and had prevailed over the Amalekites and had shown themselves awesome to the next nation and then had prevailed over the troops of the Midianites, were enslaved by this sickness at the very moment they saw the foreign women only shows, as I have said, that pleasure is an enemy of ours that is hard to fight and difficult to overcome."],[302,"By vanquishing by her very appearance those who had not been conquered by weapons, pleasure raised a trophy of dishonor against them and held up their shame to public scorn. Pleasure showed that she makes men beasts. The irrational animal impulse to licentiousness made them forget their human nature; they did not hide their excess but adorned themselves with the dishonor of passion and beautified themselves with the stain of shame as they wallowed, like pigs, in the slimy mire of uncleanness, openly for everyone to see."],[303,"What, then, are we taught by this account? This: that now having learned what great power for evil the disease of pleasure possesses, we should conduct our lives as far removed from it as possible; otherwise the disease may find some opening against us, like fire whose very proximity causes an evil flame. Solomon teaches this in Wisdom when he says that one should not walk upon hot coals with bare feet or hide fire in his bosom. So also it is in our power to remain unaffected by passion as long as we stay far away from the thing that enflames. If we come close enough to step on this burning heat, the fire of desire will burn in our breast and so it will follow that we are burned both in our feet and our breast."],[304,"In order that we might be kept far from such evil, the Lord in the Gospel with his own voice cuts out the very root of evil—namely, the desire which arises through sight—when he teaches that the person who welcomes passion by his taking a look gives an opening to the disease harmful to himself. For the evils of the passions, like a plague, when once they have gained possession of the critical parts, stop only at death."]],"id":"b2-27","r":[291,304],"w":1345,"x":[{"k":"s","p":0,"i":0,"a":12,"t":2071.0,"x":"Since, as has been said, the assault of the Adversary accompanies the ascent of virtue and seeks out corresponding opportunities to subvert toward evil, as the people improve in the godly life, the Adversary launches another attack such as experts in warfare use."},{"k":"s","p":0,"i":1,"a":12,"t":2087.6,"x":"These latter, when they estimate that their adversary has superior power in open battle, lay their plans for an ambush."},{"k":"s","p":0,"i":2,"a":12,"t":2095.0,"x":"In the same way evil's general no longer brings his power to bear openly against those empowered by the law and virtue, but he carries out his assault secretly by laying ambushes for them."},{"k":"c","a":12,"t":2107.0,"e":2242.5,"l":[[2107.0,"So I think in this particular case, this is St. Gregory sort of offering us strategic advice and saying, and this is something very important and something that I've mentioned on occasion in confession with the people who come, that we must not forget."],[2127.0,"So strategy Christians should not be sort of, you know, ignorant."],[2134.0,"And we must realize that because we wage war, we wage a spiritual war every day, we should have some understanding of strategy."],[2143.0,"And of course, indeed, this is exactly what St. Gregory is saying."],[2146.0,"When the enemy knows that he cannot have victory in a given setting."],[2151.0,"Let's say when the person has, you know, fasting or another virtue more or less in order under control, then the enemy is going to try to undermine it in a different way, whether by, you know, sort of tempting a person when the person is ill, so that during an illness, let's just say if the doctor prescribes a different ration of food, the person has to weaken one's fasting."],[2182.0,"And then, of course, that's when the Enemy will say, oh, don't go back to your previous habit."],[2188.0,"You know what?"],[2188.0,"If you get sick again, you should do something."],[2190.0,"And in a similar way as well, somebody who has no problem with, let's just say, drug addiction or alcohol abuse is not going to be tempted by alcohol and drugs."],[2203.0,"The enemy is going to bring different temptations against this person."],[2208.0,"And in many ways you could say that."],[2211.0,"Unfortunately, what the enemy does, and realistically, probably every, every general, every soldier would do the same."],[2223.0,"The attack is carried sort of in the place where the wall is the weakest, where the defense is the weakest, and when there is the greatest chance of success."],[2236.0,"So this is what St. Gregory is talking about, paragraph 292."]]},{"k":"s","p":1,"i":0,"a":12,"t":2241.0,"x":"He calls in magic as his ally against those whom he assaults."},{"k":"s","p":1,"i":1,"a":12,"t":2245.0,"x":"The history says this magic is a diviner and augur who derived his presumably harmful power from the working of demons to use it against the adversaries and was paid by the ruler of the Midianites to curse those who live to God, but actually he turned the curse into a blessing."},{"k":"c","a":12,"t":2265.0,"e":2316.7,"l":[[2265.0,"So this is exactly what happened to Balaam."],[2268.0,"Balaam was warned by God not to go with the messengers from the king, from the king of the Midianites."],[2275.0,"But he went and he was offered money in order to curse Israel, because the king of the Midianites was afraid that they were going to come and wage war against him them."],[2285.0,"And so he wanted Balaam to curse them because Balaam was practicing that kind of stuff."],[2289.0,"He was customarily, I guess, offering curses and blessings for a price."],[2297.0,"And the demons were carrying out his orders."],[2299.0,"And so in this particular case, he turned his curse into a blessing."],[2305.0,"He actually blessed them after he was sort of forced to come."],[2310.0,"He didn't curse, he blessed the Israelites, much to the dismay of the Midianite king."]]},{"k":"s","p":1,"i":2,"a":12,"t":2315.0,"x":"We perceive through the sequence of the things previously contemplated that magic is ineffective against those who live in virtue; on the contrary, those fortified by divine help prevail over every onslaught."},{"k":"c","a":12,"t":2326.9,"e":2342.4,"l":[[2326.9,"every prevail over every onslaught."],[2329.0,"So basically, as the Israelites marched past him, he wasn't even able to curse them."],[2336.0,"He blessed them because, you know, magic did not sort of have any power over"]]},{"k":"s","p":2,"i":0,"a":12,"t":2343.0,"x":"The history gives witness of divination by observing birds when it says of the one mentioned that he possessed powers of divination and received counsel from birds."},{"k":"s","p":2,"i":1,"a":12,"t":2353.1,"x":"Before this it testifies that he was taught things about his immediate undertaking by the braying of his ass."},{"k":"s","p":2,"i":2,"a":12,"t":2360.7,"x":"Because he usually received advice by the sounds made by irrational animals under demonic influence, Scripture clearly describes the utterance of the ass."},{"k":"s","p":2,"i":3,"a":12,"t":2372.0,"x":"It shows in this way that those who had previously been overtaken by deceit of demons have come to the point that, instead of reasoning, they accept teaching which comes to them from paying attention to the sound of irrational animals."},{"k":"s","p":2,"i":4,"a":12,"t":2385.0,"x":"By paying attention to the ass, he was instructed by those very things which had deceived him and learned that the power of those against whom he was hired was invincible."},{"k":"c","a":12,"t":2397.0,"e":2468.8,"l":[[2397.0,"Now, this is interesting."],[2398.0,"I don't think I've ever read anywhere before that the donkey speaking was actually sort of speech produced by the demons."],[2409.0,"It's quite possible, obviously, in some cases the demons in a human being,."],[2416.0,"When."],[2416.0,"A man was possessed by a legion, spoke to the Lord and called him the son of the Most High God and begged him not to torment them, so they can definitely speak with human speech."],[2428.0,"The situation with Balaam was that he came to a narrow place in the thicket, or maybe like the thicket and the mountain, and his donkey refused to go, and so he started beating his donkey."],[2442.0,"And that's when the donkey said with a human voice, why are you beating me?"],[2445.0,"An angel of God stands with his sword drawn to kill you so that you do not curse the people of Israel."],[2453.0,"And I didn't take you to your certain death, and now you're, you're beating me."],[2457.0,"And so then he, of course, immediately changed his disposition toward his animal."],[2466.0,"Paragraph 294 in the."]]},{"k":"s","p":3,"i":0,"a":12,"t":2467.0,"x":"In the Gospel history also the Legion, the horde of demons, was ready to oppose the authority of the Lord."},{"k":"s","p":3,"i":1,"a":12,"t":2476.2,"x":"When he who has power over all things drew near, Legion hailed his superior power and did not hide the truth that this was the divine nature which at the appropriate time punishes those who have sinned."},{"k":"s","p":3,"i":2,"a":12,"t":2488.0,"x":"For the voice of the demons says, We know who you are, the Holy One of God, and that, You have come here to torture us before the time."},{"k":"s","p":3,"i":3,"a":12,"t":2495.0,"x":"The same thing happened earlier when the demonic power which accompanied the diviner taught Balaam that the people of God are invincible."},{"k":"c","a":12,"t":2503.0,"e":2510.5,"l":[[2503.0,"The diviner, I guess, basically sort of the Sorcerer Balaam."],[2507.0,"Paragraph 295."]]},{"k":"s","p":4,"i":0,"a":12,"t":2510.0,"x":"But, as we bring the history into harmony with our earlier investigations, we say that whoever wishes to utter a curse against those who live in virtue can bring forth no harmful and maledictory sound at all, but that the curse turns into a blessing."},{"k":"s","p":4,"i":1,"a":12,"t":2525.0,"x":"What we mean is this: Railing reproach does not touch those who live virtuously."},{"k":"c","a":12,"t":2530.0,"e":2555.0,"l":[[2530.0,"And so we know that just as Balaam proceeded sort of to curse the people of Israel, he actually uttered blessings."],[2541.0,"He was not able to continue cursing."],[2544.0,"Paragraph 296 Today I guess we're not going to be able to finish."],[2550.0,"Let's see, a chapter."],[2553.0,"Paragraph"]]},{"k":"s","p":5,"i":0,"a":12,"t":2554.0,"x":"For how can the man without possessions be reviled for covetousness?"},{"k":"s","p":5,"i":1,"a":12,"t":2559.0,"x":"How can someone go around preaching on profligacy to the man who lives a retiring and secluded life?"},{"k":"s","p":5,"i":2,"a":12,"t":2564.8,"x":"Or about temper to the mild man?"},{"k":"s","p":5,"i":3,"a":12,"t":2567.0,"x":"Or about luxury to the man of moderate habits?"},{"k":"s","p":5,"i":4,"a":12,"t":2569.9,"x":"Or about any other blameable things to those who are renowned for their opposites?"},{"k":"s","p":5,"i":5,"a":12,"t":2575.0,"x":"Their goal is to present their life blameless, in order that, as the Apostle says, any opponent will be at a loss, with no accusation to make against us."},{"k":"s","p":5,"i":6,"a":12,"t":2586.0,"x":"Wherefore the voice of the one who has been called in to deliver the curse says, How shall I curse one whom God does not curse?"},{"k":"s","p":5,"i":7,"a":12,"t":2593.0,"x":"That is to say, \"How shall I revile someone who has given no ground for reviling, whose life is impervious to evil because he looks to God?\""},{"k":"s","p":6,"i":0,"a":12,"t":2603.7,"x":"When the inventor of evil failed in this, he still did not stop completely conniving against those he was assaulting."},{"k":"s","p":6,"i":1,"a":12,"t":2611.0,"x":"But, resorting to that trickery characteristic of him, he through pleasure again enticed nature to evil."},{"k":"s","p":6,"i":2,"a":12,"t":2617.0,"x":"Pleasure is truly like evil's bait; when it is thrown out lightly, it draws gluttonous souls to the fish hook of destruction."},{"k":"s","p":6,"i":3,"a":12,"t":2625.5,"x":"Especially through licentious pleasure is nature, when it is not on guard, drawn aside to evil."},{"k":"s","p":6,"i":4,"a":12,"t":2632.0,"x":"This is indeed what took place on that occasion."},{"k":"s","p":7,"i":0,"a":12,"t":2636.7,"x":"For those who prevailed over the enemy's arms, who proved every assault made with iron weapons weaker than their own power, and who by their might turned their enemies' line of battle, were themselves wounded by feminine darts of pleasure."},{"k":"s","p":7,"i":1,"a":12,"t":2651.0,"x":"Those who were stronger than men were conquered by women."},{"k":"s","p":7,"i":2,"a":12,"t":2655.0,"x":"As soon as the women appeared to them, showing off comeliness instead of weapons, they forgot their manly strength and dissipated their vigor in pleasure."},{"k":"s","p":8,"i":0,"a":12,"t":2665.0,"x":"It was only to be expected that some among them would be filled with lust for unlawful intercourse with foreigners."},{"k":"s","p":8,"i":1,"a":12,"t":2671.0,"x":"But intimacy with evil meant estrangement from the assistance of the Good; immediately God began to war against them."},{"k":"s","p":8,"i":2,"a":12,"t":2678.0,"x":"The zealous Phineas, however, did not wait to have sin purged by heavenly decision; he himself became at once judge and jury."},{"k":"c","a":12,"t":2687.0,"e":2823.8,"l":[[2687.0,"We know that he ran through with a spear a man and a woman who were cohabiting unlawfully because the the law of God, of course, forbids the intermingling with foreigners, people of of other faith."],[2706.0,"Let's see, maybe if you will Forgive me."],[2709.0,"I will stop here today and let's add a bookmark here and we will continue with paragraph 300 next."],[2723.0,"So hopefully."],[2726.0,"Let's see."],[2728.0,"Next Wednesday is the day of the holy apostles Peter and Paul."],[2732.0,"It's July 12th."],[2734.0,"It's sort of the last day of the fast."],[2737.0,"Would not have been a fasting day, but it falls on Wednesday and I believe that in the evening I should be free and we shall be able to continue our reading."],[2747.0,"Let us pray."],[2749.0,"Please forgive me for any sort of mispronouncements or."],[2757.0,"Or any tripping during reading."],[2760.0,"Reading is not an easy task always."],[2764.0,"Sometimes it can be challenging, both due to eyesight and maybe due to also some fatigue."],[2772.0,"But in any case, thank you all for your prayers, for your support and God willing, we will continue soon."],[2783.0,"It is truly me to bless thee that thou art o. K. Ever blessed and most blameless and mother of our God, more honorable than the cherubim and beyond compare, more glorious than the seraphim who without corruption gave us birth to God, the Word, the very Theotokos that we magnify."],[2806.0,"Once again, thank you."],[2808.0,"God bless you."],[2809.0,"Have a wonderful week."],[2810.0,"And I hope everybody has a wonderful celebration of the feast of Saints Peter and Paul."],[2819.0,"Let's see."],[2820.0,"How do I."],[2821.0,"There we go."]]},{"k":"c","a":13,"t":0.0,"e":81.5,"l":[[0.0,"Foreign."],[5.0,"The Father and of the Son and of the Holy Spirit."],[7.0,"Amen."],[8.0,"Dear friends, welcome back to our regular readings of the Holy Fathers."],[14.0,"Today we are finishing St. Gregory of Nyssa's the Life of Moses."],[19.0,"Let us pray and we will proceed."],[24.0,"O heavenly King, comfort a spirit of truth who art everywhere present and fillest all things."],[32.0,"Treasury of good things and giver of life, come and dwell in us and cleanse us of all impurity and save our souls."],[42.0,"O good one."],[50.0,"So today, most likely, we will read the very end of the book."],[59.0,"And I recall we stopped at paragraph 300 last time."],[69.0,"Let me see."],[70.0,"Maybe I can even do it, I suppose."],[76.0,"Okay, I guess."],[77.0,"That's good."]]},{"k":"s","p":9,"i":0,"a":13,"t":82.0,"x":"Having been moved to wrath against the men who were filled with lust, he did the work of a priest by purging the sin with blood, not the blood of some guiltless animal which had no part in the stain of licentiousness, but the blood of those who were joined with one another in evil."},{"k":"s","p":9,"i":1,"a":13,"t":98.0,"x":"The spear, by piercing the two bodies conjointly, stayed divine justice, mixing pleasure with the death of those who sinned."},{"k":"c","a":13,"t":107.0,"e":167.0,"l":[[107.0,"So I think this is talking about the action by Phineas, who pierced the Israelite."],[116.0,"Israelite man."],[117.0,"And the."],[120.0,"See,."],[123.0,"The women were from the tribe, oh, let's see."],[132.0,"The Moabites or."],[140.0,"Midianites."],[141.0,"So the Medianite woman, sorry, and an Israelite man were pierced by St. Gregory and by Phineas."],[152.0,"And of course, that way the."],[160.0,"The wrath of God was stayed."],[164.0,"Paragraph 301."]]},{"k":"s","p":10,"i":0,"a":13,"t":166.0,"x":"The history, it seems to me, offers some advice profitable to men."},{"k":"s","p":10,"i":1,"a":13,"t":170.0,"x":"It teaches us that of the many passions which afflict men's thinking there is none so strong as the disease of pleasure."},{"k":"s","p":10,"i":2,"a":13,"t":178.6,"x":"That those Israelites, who were manifestly stronger than the Egyptian cavalry and had prevailed over the Amalekites and had shown themselves awesome to the next nation and then had prevailed over the troops of the Midianites, were enslaved by this sickness at the very moment they saw the foreign women only shows, as I have said, that pleasure is an enemy of ours that is hard to fight and difficult to overcome."},{"k":"c","a":13,"t":203.0,"e":305.1,"l":[[203.0,"And difficult to overcome."],[206.0,"So I think here, obviously, St. Gregory isn't saying anything that would appear to be new, because we're all very well aware of the fact that indeed, pleasure is very difficult to overcome."],[220.0,"It is not easy to control oneself sometimes."],[225.0,"And that is why I would say that our church encourages fasting and practice of discipline in many ways, one of which is fasting, as I mentioned."],[240.0,"And we just finished the longer fast this year."],[244.0,"It was longer."],[245.0,"Four weeks."],[246.0,"The fast of saints."],[247.0,"Peter and Paul of the the apostles fast."],[252.0,"And the idea that we learn abstinence from food."],[260.0,"By conquering the desire for pleasure associated with food."],[267.0,"Now, once we gain that experience of overcoming our stomach, we should be able to port that experience, to transfer that experience to the struggle with other passions as well."],[281.0,"And so, if we are able to fast properly, then we should be able to resist the temptation and whatever, you know, for whatever other inappropriate pleasures there may be presented to us by the enemy in order to distract us and to sway us from the true path of"]]},{"k":"s","p":11,"i":0,"a":13,"t":306.0,"x":"By vanquishing by her very appearance those who had not been conquered by weapons, pleasure raised a trophy of dishonor against them and held up their shame to public scorn."},{"k":"s","p":11,"i":1,"a":13,"t":316.0,"x":"Pleasure showed that she makes men beasts."},{"k":"s","p":11,"i":2,"a":13,"t":320.0,"x":"The irrational animal impulse to licentiousness made them forget their human nature; they did not hide their excess but adorned themselves with the dishonor of passion and beautified themselves with the stain of shame as they wallowed, like pigs, in the slimy mire of uncleanness, openly for everyone to see."},{"k":"c","a":13,"t":340.0,"e":374.0,"l":[[340.0,"Now, what a sad fall from grace for these Israelite warriors, because their ancestor Joseph, the comely one, ended up being imprisoned unjustly, because he in fact, did resist the temptation of plain pleasure and was able to conquer it valiantly."],[370.0,"Paragraph 3, 303."]]},{"k":"s","p":12,"i":0,"a":13,"t":373.0,"x":"What, then, are we taught by this account?"},{"k":"s","p":12,"i":1,"a":13,"t":375.0,"x":"This: that now having learned what great power for evil the disease of pleasure possesses, we should conduct our lives as far removed from it as possible; otherwise the disease may find some opening against us, like fire whose very proximity causes an evil flame."},{"k":"s","p":12,"i":2,"a":13,"t":393.0,"x":"Solomon teaches this in Wisdom when he says that one should not walk upon hot coals with bare feet or hide fire in his bosom."},{"k":"s","p":12,"i":3,"a":13,"t":401.0,"x":"So also it is in our power to remain unaffected by passion as long as we stay far away from the thing that enflames."},{"k":"s","p":12,"i":4,"a":13,"t":409.0,"x":"If we come close enough to step on this burning heat, the fire of desire will burn in our breast and so it will follow that we are burned both in our feet and our breast."},{"k":"c","a":13,"t":420.0,"e":458.0,"l":[[420.0,"Well, most definitely, as King Solomon says, you can't put fire in your bosom, fiery coals in your bosom, and not be burned."],[430.0,"Most likely, they will also sort of burn outwardly."],[433.0,"They will burn through your clothes, and you will be discovered."],[438.0,"So just as much as we would abstain from putting burning fire, burning embers into our bosom, we should abstain from fleshly desires."],[453.0,"Most definitely."],[455.0,"Paragraph 304."]]},{"k":"s","p":13,"i":0,"a":13,"t":457.0,"x":"In order that we might be kept far from such evil, the Lord in the Gospel with his own voice cuts out the very root of evil—namely, the desire which arises through sight—when he teaches that the person who welcomes passion by his taking a look gives an opening to the disease harmful to himself."},{"k":"s","p":13,"i":1,"a":13,"t":476.0,"x":"For the evils of the passions, like a plague, when once they have gained possession of the critical parts, stop only at death."},{"k":"c","a":13,"t":485.0,"e":683.3,"l":[[485.0,"Well, if we were to think about the sad experience of King David, of course he was stricken by the desire for pleasure, by sight, through sight."],[502.0,"He saw Bathsheba wash herself, he saw her taking a bath, and of course he was pierced with an arrow."],[512.0,"And there are quite a few things like that as well."],[514.0,"And of course we know that even the very first temptation of our foremother Eve, she saw that the fruit was good to eat."],[524.0,"So we see once again that sight is a very main gateway for the enemy to bring temptation to our attention, to bring the temptation to us."],[537.0,"And so if we want to protect ourselves, if we want to cut the temptation away, we must protect our sight either entirely or at least sort of for the time being when we are in a given setting where there's a possibility of temptation."],[561.0,"There's a story somewhere in the Patarakon or in the Lives of the Desert Saints, about a monk who had to go and visit."],[570.0,"I can't remember either he had to go visit the ruler or the archbishop, someone, but he had to go to a large city from the desert, and he went and he came back."],[582.0,"And so when he came back, the other monks in the desert, they asked him, father, so how is the world?"],[590.0,"How are the people?"],[591.0,"And he says, I don't know, I didn't see anyone."],[593.0,"And they say, oh, no, is there a plague?"],[596.0,"Did the people die, or was there a terrible war?"],[599.0,"He says, I don't know."],[600.0,"No, there was no plague and there's no war, and everybody is alive."],[604.0,"And they said, well, but how do you say that you hadn't seen anyone because you had to go into the city to see someone, to see this person, either the ruler or the archbishop, I can't remember."],[614.0,"And he says, well, I saw the person I went to see, and beside that person I saw no one else."],[622.0,"And they said, well, are."],[624.0,"Is everybody else still there?"],[626.0,"And he said, yes."],[627.0,"And they said, well, how is it that you walked into the city and you saw no one?"],[631.0,"And he said, the whole time I walked, I looked in front of myself, keeping my hood down."],[638.0,"Once I met with a person, I saw that person that I'm intended I was intending to see."],[645.0,"And after that I walked back to the desert without looking up, and thus I didn't see anyone."],[652.0,"So this way he couldn't possibly be tempted, because nothing entered into his heart or into his mind, into his soul, through the eyes."],[664.0,"And of course the eyes, yes, very much so, are the windows of the soul, and we must be very careful to protect them."],[672.0,"Paragraph 3, 305."],[675.0,"The beginning of what I think appears to be the very last chapter, the perfection of the servant, it says,"]]}]},{"t":"The Perfection of the Servant","p":[[305,"I think there is no need to prolong the discourse by presenting to the reader the whole life of Moses as an example of virtue. For to anyone straining to the higher life what has been said provides amply for true wisdom. To anyone who shows weakness in toiling for virtue there would be no gain even if many more things should be written than what has been said."],[306,"Nevertheless, let us not forget our definition in the prologue. There we affirmed that the perfect life was such that no description of its perfection hinders its progress; the continual development of life to what is better is the soul's way to perfection. We would do well, by bringing our discourse up to the end of Moses's life, to show the certainty of the definition of perfection which we have proposed."],[307,"For he who elevates his life beyond earthly things through such ascents never fails to become even loftier than he was until, as I think, like an eagle in all things his life may be seen above and beyond the cloud whirling around the ether of spiritual ascent."],[308,"He was born when the Egyptians considered a Hebrew birth an offense. When the tyrant ruling at that time punished by his law every boy who was born, Moses triumphed over the murderous law, being saved at first by his parents and then by the very persons who laid down the law. And those who desired his death by law actually exercised great care not only for his life but also for his highly esteemed education by introducing the youth to all wisdom."],[309,"After this he stood above human honor and beyond royal dignity, considering it to be stronger and more royal to keep watch for virtue and to be beautified with its adornment than to be a spearman and to wear royal adornment."],[310,"Then he saved his countryman and struck down the Egyptian; in this we see by our interpretative contemplation both the friend and the enemy of the soul. Next, he made his retirement the teacher of lofty matters, and in this way his understanding was enlightened by the light which shone from the bush. And then he made haste to share with his countrymen the good things which came to him from God."],[311,"On that occasion he demonstrated his power in two ways, by warding off his opponents with ingenious blows one after the other and by doing good to his countrymen. He led this people through the sea on foot without making a fleet of ships for himself; instead, he made their faith a ship for crossing through the water. He made the bottom of the sea dry land for the Hebrews and the dry land sea for the Egyptians."],[312,"He sang the victory song. He was led by the pillar. He was enlightened by the heavenly fire. He prepared a table out of the food which came down to him from above. He drew water from the rock. He stretched forth his hands to destroy the Amalekites. He ascended the mountain. He entered the darkness. He heard the trumpet. He approached the divine nature. He was enclosed by the heavenly tabernacle. He adorned the priesthood. He built the tabernacle. He ordered life by the laws. He successfully waged his last wars in the manner we have described."],[313,"As the last of his right actions he punished licentiousness through the priesthood. This was signified by the wrath that Phineas showed against passion. After all these things he went to the mountain of rest. He did not set foot on the land below for which the people were longing by reason of the promise. He who preferred to live by what flowed from above no longer tasted earthly food. But having come to the very top of the mountain, he, like a good sculptor who has fashioned well the whole statue of his own life, did not simply bring his creation to an end but he placed the finishing touch on his work."],[314,"What does the history say about this? That Moses the servant of Yahweh died as Yahweh decreed, and no one has ever found his grave, his eyes were undimmed, and his face unimpaired. From this we learn that, when one has accomplished such noble actions, he is considered worthy of this sublime name, to be called servant of Yahweh, which is the same as saying that he is better than all others. For one would not serve God unless he had become superior to everyone in the world. This for him is the end of the virtuous life, an end wrought by the word of God. History speaks of \"death,\" a living death, which is not followed by the grave, or fills the tomb, or brings dimness to the eyes and aging to the person."],[315,"What then are we taught through what has been said? To have but one purpose in life: to be called servants of God by virtue of the lives we live. For when you conquer all enemies (the Egyptian, the Amalekite, the Idumaean, the Midianite), cross the water, are enlightened by the cloud, are sweetened by the wood, drink from the rock, taste of the food from above, make your ascent up the mountain through purity and sanctity; and when you arrive there, you are instructed in the divine mystery by the sound of the trumpets, and in the impenetrable darkness draw near to God by your faith, and there are taught the mysteries of the tabernacle and the dignity of the priesthood."],[316,"And when you, as a sculptor, carve in your own heart the divine oracles which you receive from God; and when you destroy the golden idol (that is, if you wipe from your life the desire of covetousness); and when you are elevated to such heights that you appear invincible to the magic of Balaam (by \"magic\" you will perceive the crafty deceit of this life through which men drugged as though by some philtre of Circe are changed into the form of irrational animals and leave their proper nature); and when you come through all these things, and the staff of the priesthood blossoms in you, drawing no moisture at all from the earth but having its own unique power for producing fruit (that is the nut whose first taste is bitter and tough but whose inside is sweet and edible); when you destroy everything which opposes your worth, as Dathan was swallowed in the earth and Core was consumed by the fire—then you will draw near to the goal."],[317,"I mean by \"goal\" that for the sake of which everything is done, for example: The goal of agriculture is the enjoyment of its fruits; the goal of building a house is living in it; the goal of commerce is wealth; and the goal of striving in contests is the prize. In the same way, too, the goal of the sublime way of life is being called a servant of God. Along with this honor is contemplated an end which is not covered by a tomb; it refers to the life lived simply and free from evil appendages."],[318,"Scripture describes another characteristic of this service to God: The eye is not dimmed nor does the person age. For how can an eye which is always in the light be dimmed by the darkness from which it is always separated? And the person who by every means achieves incorruption in his whole life admits no corruption in himself. For he who has truly come to be in the image of God and who has in no way turned aside from the divine character bears in himself its distinguishing marks and shows in all things his conformity to the archetype; he beautifies his own soul with what is incorruptible, unchangeable, and shares in no evil at all."]],"id":"b2-28","r":[305,318],"w":1317,"x":[{"k":"s","p":0,"i":0,"a":13,"t":681.7,"x":"I think there is no need to prolong the discourse by presenting to the reader the whole life of Moses as an example of virtue."},{"k":"s","p":0,"i":1,"a":13,"t":690.0,"x":"For to anyone straining to the higher life what has been said provides amply for true wisdom."},{"k":"s","p":0,"i":2,"a":13,"t":696.0,"x":"To anyone who shows weakness in toiling for virtue there would be no gain even if many more things should be written than what has been said."},{"k":"s","p":1,"i":0,"a":13,"t":707.0,"x":"Nevertheless, let us not forget our definition in the prologue."},{"k":"s","p":1,"i":1,"a":13,"t":712.0,"x":"There we affirmed that the perfect life was such that no description of its perfection hinders its progress; the continual development of life to what is better is the soul's way to perfection."},{"k":"s","p":1,"i":2,"a":13,"t":725.0,"x":"We would do well, by bringing our discourse up to the end of Moses's life, to show the certainty of the definition of perfection which we have proposed."},{"k":"s","p":2,"i":0,"a":13,"t":737.0,"x":"For he who elevates his life beyond earthly things through such ascents never fails to become even loftier than he was until, as I think, like an eagle in all things his life may be seen above and beyond the cloud whirling around the ether of spiritual ascent."},{"k":"c","a":13,"t":760.0,"e":814.0,"l":[[760.0,"So I think St. Gregory here, he transitioned from making a point that writing a lot more will not be benefit someone who's not really interested in spiritual life and spiritual struggle, because enough has been said to help those who are, and more is not necessarily going to be better."],[784.0,"Which is interesting, because we see that he uses temperance even in discussing something which was good."],[791.0,"So obviously it's possible he's able to say more, but he properly restrains himself."],[799.0,"And then, of course, he says that the life of Moses went from perfection to perfection, that he indeed was a very lofty saint."],[811.0,"Paragraph 308."]]},{"k":"s","p":3,"i":0,"a":13,"t":813.0,"x":"He was born when the Egyptians considered a Hebrew birth an offense."},{"k":"s","p":3,"i":1,"a":13,"t":817.3,"x":"When the tyrant ruling at that time punished by his law every boy who was born, Moses triumphed over the murderous law, being saved at first by his parents and then by the very persons who laid down the law."},{"k":"s","p":3,"i":2,"a":13,"t":831.0,"x":"And those who desired his death by law actually exercised great care not only for his life but also for his highly esteemed education by introducing the youth to all wisdom."},{"k":"c","a":13,"t":843.0,"e":901.0,"l":[[843.0,"So we see here that most definitely divine providence was manifest in the life of Moses, because he was born at the time when all the boys were supposed to be put to death."],[854.0,"His mother didn't follow the law of the wicked Pharaoh and hid the boy for three months."],[862.0,"And then when she was afraid to hide him any longer, she had a plan of putting him out at the river, at the place where the Pharaoh's daughter would come to wash herself."],[877.0,"And I guess maybe she felt that Moses was so beautiful that when the daughter would see him, she would also want to keep him and not put him to death."],[885.0,"Which is exactly what happened."],[887.0,"And then, of course, Moses did get the benefits of a royal upbringing."],[898.0,"Paragraph 309."]]},{"k":"s","p":4,"i":0,"a":13,"t":900.0,"x":"After this he stood above human honor and beyond royal dignity, considering it to be stronger and more royal to keep watch for virtue and to be beautified with its adornment than to be a spearman and to wear royal adornment."},{"k":"c","a":13,"t":915.0,"e":958.0,"l":[[915.0,"So basically, I think what he's referring to here is the fact that Moses chose righteousness over social status."],[926.0,"Social status."],[927.0,"Wise, he would have been perfectly fine."],[929.0,"He lived in the palace."],[931.0,"He had all the prospects of living a wonderful and sort of a very well provided life."],[940.0,"And yet he chose to stand up for the truth."],[943.0,"He chose to stand up for his own people and to speak against their abuse, which of course, made him an exile."],[955.0,"Paragraph 310."]]},{"k":"s","p":5,"i":0,"a":13,"t":957.0,"x":"Then he saved his countryman and struck down the Egyptian; in this we see by our interpretative contemplation both the friend and the enemy of the soul."},{"k":"s","p":5,"i":1,"a":13,"t":966.0,"x":"Next, he made his retirement the teacher of lofty matters, and in this way his understanding was enlightened by the light which shone from the bush."},{"k":"s","p":5,"i":2,"a":13,"t":975.0,"x":"And then he made haste to share with his countrymen the good things which came to him from God."},{"k":"c","a":13,"t":981.0,"e":1104.0,"l":[[981.0,"Now, I think in this particular case, it's quite interesting that St. Gregory says he made his retirement the teacher of lofty matters, because we know that Moses lived in Egypt for 40 years."],[995.0,"He struck down the Egyptian when he was 40."],[998.0,"He retired into the Egyptian desert."],[1001.0,"So he lived out there with the shepherds and with his father in law, Jethro, for another 40 years."],[1008.0,"And I would say how interesting it is."],[1011.0,"It's almost like the process of making very good wine."],[1015.0,"There is the."],[1017.0,"The manufacturing process, which one could say for Moses, the first 40 years of living in Egypt, in Pharaoh's palace, was the time that he had learned everything that was sort of available to him based on the wisdom acquired by his contemporaries, the people of the time."],[1039.0,"And then he went into the desert, so that that knowledge that he had received in Egypt could settle."],[1046.0,"It's almost like the time that the wine spends in a barrel when it actually sort of takes on the property of the tastes of the."],[1053.0,"The wooden barrels that it's in and is then, you know, steadied, stilled and rested becomes way better than sort of fresh young wine."],[1064.0,"And so the retirement was the teacher of lofty matters for Moses."],[1069.0,"And he was enlightened there, having spent 40 years in the desert, just shepherding his sheep and not really talking with other people a lot, not having a lot of hustle and bustle of life, but being in a quiet place."],[1085.0,"And the wine, I think also, you know, when it rests, right, it sits stills in the barrels."],[1091.0,"They."],[1091.0,"They try not to move it too much so that it doesn't burst out, especially when it's first, you know, bubbling and fermenting and all."],[1099.0,"Very interesting."],[1101.0,"Paragraph 311."]]},{"k":"s","p":6,"i":0,"a":13,"t":1103.0,"x":"On that occasion he demonstrated his power in two ways, by warding off his opponents with ingenious blows one after the other and by doing good to his countrymen."},{"k":"s","p":6,"i":1,"a":13,"t":1113.0,"x":"He led this people through the sea on foot without making a fleet of ships for himself; instead, he made their faith a ship for crossing through the water."},{"k":"s","p":6,"i":2,"a":13,"t":1123.0,"x":"He made the bottom of the sea dry land for the Hebrews and the dry land sea for the Egyptians."},{"k":"c","a":13,"t":1130.0,"e":1176.4,"l":[[1130.0,"Now, so that more or less describes what he did."],[1133.0,"And of course, here in one short paragraph, he talks about dealing blows sort of from the time that he dealt blows to an Egyptian to the time that he actually led them away."],[1146.0,"And of course, he dealt blows then too, 10 blows, 10 plagues were dealt to the Egyptians because the Pharisee, sorry, the pharaoh."],[1157.0,"I don't know."],[1157.0,"I blended the two words in one."],[1160.0,"The pharaoh was hardened in his heart and he did not want to let them go."],[1166.0,"And thus Moses had to deal These blows that St. Gregory mentions here, paragraph 312."]]},{"k":"s","p":7,"i":0,"a":13,"t":1175.0,"x":"He sang the victory song."},{"k":"s","p":7,"i":1,"a":13,"t":1176.0,"x":"He was
