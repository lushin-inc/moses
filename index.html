t and unmoveable (according to the advice of Paul) he becomes in the Good the faster he completes the course. It is like using the standing still as if it were a wing while the heart flies upward through its stability in the good."],[245,"Therefore, he who showed Moses the place urges him on in his course. When he promised that he would stand him on the rock, he showed him the nature of that divine race. But the opening in the rock which Scripture calls a \"hole\" the divine Apostle interprets well in his own words when he speaks of a heavenly house not made with hands which is laid up by hope for those who have dissolved their earthly tabernacle."],[246,"For truly he who has run the race, as the Apostle says, in that wide and roomy stadium, which the divine voice calls \"place,\" and has kept the faith and, as the figurative expression says, has planted his feet on the rock; such a person will be adorned with the crown of righteousness from the hand of the contest's judge. This prize is described in different ways by Scripture."],[247,"For the same thing which is here called an opening in the rock is elsewhere referred to as \"pleasure of paradise,\" \"eternal tabernacle,\" \"mansion with the Father,\" \"bosom of the patriarch,\" \"land of the living,\" \"water of refreshment,\" \"Jerusalem which is above,\" \"kingdom of heaven,\" \"prize of calling,\" \"crown of graces,\" \"crown of pleasure,\" \"crown of beauty,\" \"pillar of strength,\" \"pleasure on a table,\" \"councils of God,\" \"throne of judgment,\" \"place of name,\" \"hidden tabernacle.\""],[248,"We say, then, that Moses' entrance into the rock has the same significance as these descriptions. For, since Christ is understood by Paul as the rock, all hope of good things is believed to be in Christ, in whom we have learned all the treasures of good things to be. He who finds any good finds it in Christ who contains all good."],[249,"He who attained to this and was shadowed by the hand of God, as the text promised (for the hand of God would be the creative power of what exists, the only begotten God, by whom all things were made, who is also \"place\" for those who run, who is, according to his own words, the \"way\" of the course, and who is \"rock\" to those who are well established and \"house\" to those who are resting), he it is who will hear the One who summons and will see the back of the One who calls, which means he will follow Yahweh your God, as the Law commands."],[250,"When the great David heard and understood this, he said to him who dwells in the shelter of the most High; He will overshadow you with his shoulders, which is the same as being behind God (for the shoulder is on the back of the body). Concerning himself David says, My soul clings close to you, your right hand supports me. You see how the Psalms agree with the history. For as the one says that the right hand is a help to the person who has joined himself close behind God, so the other says that the hand touches the person who waits in the rock upon the divine voice and prays that he might follow behind."],[251,"But when the Lord who spoke to Moses came to fulfill his own law, he likewise gave a clear explanation to his disciples, laying bare the meaning of what had previously been said in a figure when he said, If anyone wants to be a follower of mine and not \"If any man will go before me.\" And to the one asking about eternal life he proposes the same thing, for he says Come, follow me. Now, he who follows sees the back."],[252,"So Moses, who eagerly seeks to behold God, is now taught how he can behold Him: to follow God wherever he might lead is to behold God. His passing by signifies his guiding the one who follows, for someone who does not know the way cannot complete his journey safely in any other way than by following behind his guide. He who leads, then, by his guidance shows the way to the one following. He who follows will not turn aside from the right way if he always keeps the back of his leader in view."],[253,"For he who moves to one side or brings himself to face his guide assumes another direction for himself than the one his guide shows him. Therefore, he says to the one who is led, My face is not to be seen, that is, \"Do not face your guide.\" If he does so, his course will certainly be in the opposite direction, for good does not look good in the face, but follows it."],[254,"What is perceived to be its opposite is face to face with the good, for what looks virtue in the face is evil. But virtue is not perceived in contrast to virtue. Therefore, Moses does not look God in the face, but looks at his back; for whoever looks at him face to face shall not live, as the divine voice testifies, man cannot see the face of the Lord and live."],[255,"You see how it is so great a thing to learn how to follow God, that after those lofty ascents and awesome and glorious theophanies virtually at the end of his life, the man who has learned to follow behind God is scarcely considered worthy of this grace."]],"id":"b2-21","r":[219,255],"w":3166,"x":[{"k":"c","a":11,"t":2.0,"e":60.4,"l":[[2.0,"In the name of the Father and of the Son and of the Holy Spirit."],[5.0,"Amen."],[6.0,"Dear friends, welcome back to our weekly readings from the Holy Fathers."],[10.0,"Today we're continuing the book the Life of Moses by St. Gregory of Nyssa."],[16.0,"Let us pray and we will begin."],[19.0,"O Heavenly King, comfort the Spirit of truth, who art everywhere present and fillest all things."],[27.0,"Treasury of good things and giver of life, come and dwell in us, and cleanse us of all impurity and save our souls, O good One."],[49.0,"So today we're continuing with the chapter that is titled eternal progress, paragraph"]]},{"k":"s","p":0,"i":0,"a":11,"t":60.0,"x":"While following these things in the sequence of our investigation, we were led to a deeper meaning in contemplating this passage."},{"k":"s","p":0,"i":1,"a":11,"t":68.0,"x":"Let us return to the subject."},{"k":"s","p":0,"i":2,"a":11,"t":69.0,"x":"How does someone who Scripture says saw God clearly in such divine appearances—face to face, as a man speaks with his friend — require that God appear to him, as though he who is always visible had not yet been seen, as though Moses had not yet attained what Scripture testifies he had indeed attained?"},{"k":"c","a":11,"t":91.0,"e":109.9,"l":[[91.0,"So St. Gregory here is basically asking, how is it that Moses is asking to see God, when in fact we are told in the Scriptures that he had already seen God?"],[104.0,"So I'm assuming he will answer his question."],[106.0,"As we read on paragraph 220,"]]},{"k":"s","p":1,"i":0,"a":11,"t":108.3,"x":"The heavenly voice now grants the petitioner's request and does not deny this additional grace."},{"k":"s","p":1,"i":1,"a":11,"t":114.0,"x":"Yet again He leads him to despair in that He affirms that what the petitioner seeks cannot be contained by human life."},{"k":"s","p":1,"i":2,"a":11,"t":122.0,"x":"Still, God says there is a place with himself where there is a rock with a hole in it into which he commands Moses to enter."},{"k":"s","p":1,"i":3,"a":11,"t":131.0,"x":"Then God placed his hand over the mouth of the hole and called out to Moses as he passed by."},{"k":"s","p":1,"i":4,"a":11,"t":137.0,"x":"When Moses was summoned, he came out of the hole and saw the back of the One who called him."},{"k":"s","p":1,"i":5,"a":11,"t":142.0,"x":"In this way he thought he saw what he was seeking, and the promise of the divine voice did not prove false."},{"k":"c","a":11,"t":150.0,"e":175.5,"l":[[150.0,"So,."],[152.0,"Perhaps, maybe because of the boldness of Moses in his request to seek God, this is how he was commanded to see him after he passed by."],[162.0,"So he saw his back part, so to speak, saw him from the back."],[166.0,"But let us read on and see what St. Gregory says more specifically about this paragraph 221."]]},{"k":"s","p":2,"i":0,"a":11,"t":174.0,"x":"If these things are looked at literally, not only will the understanding of those who seek God be dim, but their concept of him will also be inappropriate."},{"k":"s","p":2,"i":1,"a":11,"t":183.0,"x":"Front and back pertain only to those things which are observed to have shape."},{"k":"s","p":2,"i":2,"a":11,"t":187.0,"x":"Every shape provides the limits of a body."},{"k":"s","p":2,"i":3,"a":11,"t":191.0,"x":"So then he who conceives of God in some shape will not realize that he is free of a bodily nature."},{"k":"s","p":2,"i":4,"a":11,"t":201.0,"x":"It is a fact that every body is composite, and that what is composite exists by the joining of its different elements."},{"k":"s","p":2,"i":5,"a":11,"t":209.0,"x":"No one would say that what is composite cannot be decomposed."},{"k":"s","p":2,"i":6,"a":11,"t":213.5,"x":"And what decomposes cannot be incorruptible, for corruption is the decomposition of what is composite."},{"k":"c","a":11,"t":219.0,"e":258.0,"l":[[219.0,"So I think in this particular case, St. Gregory just draws our attention to the fact that God, who is immutable by nature and incomprehensible, imperceivable in his fullness, who also fills all things, maintains all things, who knows all things, who is all powerful, he cannot be seen in such a way."],[244.0,"And so when we're given this account, we should really not dwell in it in the literal sense, because in the literal sense it does not do God the justice that he deserves."],[255.0,"Paragraph 222."]]},{"k":"s","p":3,"i":0,"a":11,"t":257.0,"x":"If therefore one should think of the back of God in a literal fashion, he will necessarily be carried to such an absurd conclusion."},{"k":"s","p":3,"i":1,"a":11,"t":265.0,"x":"For front and back pertain to a shape, and shape pertains to a body."},{"k":"s","p":3,"i":2,"a":11,"t":269.0,"x":"A body by its very nature can be decomposed, for everything composite is capable of dissolution."},{"k":"s","p":3,"i":3,"a":11,"t":276.2,"x":"But what is being decomposed cannot be incorruptible; therefore, he who is bound to the letter would consequently conceive the Divine to be corruptible."},{"k":"s","p":3,"i":4,"a":11,"t":292.0,"x":"But in fact God is incorruptible and incorporeal."},{"k":"s","p":4,"i":0,"a":11,"t":302.0,"x":"But what understanding other than the literal interpretation fits what is written?"},{"k":"s","p":4,"i":1,"a":11,"t":307.0,"x":"If this part of the written narrative compels us to seek out another understanding, it is certainly appropriate to understand the whole in the same way."},{"k":"s","p":4,"i":2,"a":11,"t":316.6,"x":"Whatever we perceive in the part, we of necessity take as true for the whole, since every whole is made up of its parts."},{"k":"s","p":4,"i":3,"a":11,"t":326.0,"x":"Wherefore the place with God, the rock at that place, the opening in it called a hole, Moses' entrance into it, the placing of the divine hand over its mouth, the passing by and the calling and after this the vision of the back—all this would more fittingly be contemplated in its spiritual sense."},{"k":"s","p":5,"i":0,"a":11,"t":350.0,"x":"What then is being signified?"},{"k":"s","p":5,"i":1,"a":11,"t":352.0,"x":"Bodies, once they have received the initial thrust downward, are driven downward by themselves with greater speed without any additional help as long as the surface on which they move is steadily sloping and no resistance to their downward thrust is encountered."},{"k":"s","p":5,"i":2,"a":11,"t":369.0,"x":"Similarly, the soul moves in the opposite direction."},{"k":"s","p":5,"i":3,"a":11,"t":373.0,"x":"Once it is released from its earthly attachment, it becomes light and swift for its movement upward, soaring from below up to the heights."},{"k":"s","p":6,"i":0,"a":11,"t":384.0,"x":"If nothing comes from above to hinder its upward thrust (for the nature of the Good attracts to itself those who look to it), the soul rises ever higher and will always make its flight yet higher—by its desire of the heavenly things straining ahead for what is still to come, as the Apostle says."},{"k":"c","a":11,"t":407.0,"e":421.0,"l":[[407.0,"Now this is quite interesting, but here for the nature of the good, here the good is capitalized."],[413.0,"So for the nature, you could say of God, and also of the good, attracts to itself those who look to it."],[419.0,"Paragraph"]]},{"k":"s","p":7,"i":0,"a":11,"t":420.5,"x":"Made to desire and not to abandon the transcendent height by the things already attained, it makes its way upward without ceasing, ever through its prior accomplishments renewing its intensity for the flight."},{"k":"s","p":7,"i":1,"a":11,"t":436.3,"x":"Activity directed toward virtue causes its capacity to grow through exertion; this kind of activity alone does not slacken its intensity by the effort, but increases it."},{"k":"c","a":11,"t":447.0,"e":455.5,"l":[[447.0,"So he's talking about the movement of the soul up toward heaven and toward God."],[452.0,"Paragraph 227."]]},{"k":"s","p":8,"i":0,"a":11,"t":455.0,"x":"For this reason we also say that the great Moses, as he was becoming ever greater, at no time stopped in his ascent, nor did he set a limit for himself in his upward course."},{"k":"s","p":8,"i":1,"a":11,"t":466.0,"x":"Once having set foot on the ladder which God set up (as Jacob says), he continually climbed to the step above and never ceased to rise higher, because he always found a step higher than the one he had attained."},{"k":"s","p":9,"i":0,"a":11,"t":480.0,"x":"He denied the specious kinship with the Egyptian queen."},{"k":"s","p":9,"i":1,"a":11,"t":485.0,"x":"He avenged the Hebrew. He chose the desert way of life where there was no human being to disturb him."},{"k":"s","p":9,"i":2,"a":11,"t":495.0,"x":"In himself he shepherded a flock of tame animals."},{"k":"s","p":9,"i":3,"a":11,"t":499.0,"x":"He saw the brilliance of the light."},{"k":"s","p":9,"i":4,"a":11,"t":501.6,"x":"Unencumbered, having taken off his sandals, he made his approach to the light."},{"k":"s","p":9,"i":5,"a":11,"t":506.0,"x":"He brought his kinsmen and countrymen out to freedom."},{"k":"s","p":9,"i":6,"a":11,"t":511.0,"x":"He saw the enemy drowning in the sea."},{"k":"s","p":10,"i":0,"a":11,"t":515.0,"x":"He made camps under the cloud."},{"k":"s","p":10,"i":1,"a":11,"t":518.0,"x":"He quenched thirst with the rock."},{"k":"s","p":10,"i":2,"a":11,"t":520.0,"x":"He produced bread from heaven."},{"k":"s","p":10,"i":3,"a":11,"t":521.5,"x":"By stretching out his hands, he overcame the foreigner."},{"k":"s","p":10,"i":4,"a":11,"t":525.0,"x":"He heard the trumpet. He entered the darkness."},{"k":"s","p":10,"i":5,"a":11,"t":528.0,"x":"He slipped into the inner sanctuary of the tabernacle not made with hands."},{"k":"s","p":10,"i":6,"a":11,"t":532.0,"x":"He learned the secrets of the divine priesthood."},{"k":"s","p":10,"i":7,"a":11,"t":535.0,"x":"He destroyed the idol. He supplicated the divine Being."},{"k":"s","p":10,"i":8,"a":11,"t":538.0,"x":"He restored the Law destroyed by the evil of the Jews."},{"k":"s","p":11,"i":0,"a":11,"t":545.0,"x":"He shone with glory. And although lifted up through such lofty experiences, he is still unsatisfied in his desire for more."},{"k":"s","p":11,"i":1,"a":11,"t":555.0,"x":"He still thirsts for that with which he constantly filled himself to capacity, and he asks to attain as if he had never partaken, beseeching God to appear to him, not according to his capacity to partake, but according to God's true being."},{"k":"c","a":11,"t":571.0,"e":613.5,"l":[[571.0,"So what he's saying here, St. Gregory, is essentially that the desire of Moses to keep on drawing closer and closer to God, you might say higher and higher, is unquenchable because with every step he thirsts for more."],[594.0,"With every achievement he realizes that there is more."],[598.0,"And so that is why he's asking to see God the way that he is."],[605.0,"You might say he's asking for the ultimate knowledge and experience of God."],[611.0,"Paragraph 231."]]},{"k":"s","p":12,"i":0,"a":11,"t":612.0,"x":"Such an experience seems to me to belong to the soul which loves what is beautiful."},{"k":"s","p":12,"i":1,"a":11,"t":618.0,"x":"Hope always draws the soul from the beauty which is seen to what is beyond, always kindles the desire for the hidden through what is constantly perceived."},{"k":"s","p":12,"i":2,"a":11,"t":628.0,"x":"Therefore, the ardent lover of beauty, although receiving what is always visible as an image of what he desires, yet longs to be filled with the very stamp of the archetype."},{"k":"s","p":13,"i":0,"a":11,"t":641.8,"x":"And the bold request which goes up the mountains of desire asks this: to enjoy the Beauty not in mirrors and reflections, but face to face."},{"k":"s","p":13,"i":1,"a":11,"t":652.0,"x":"The divine voice granted what was requested in what was denied, showing in a few words an immeasurable depth of thought."},{"k":"s","p":13,"i":2,"a":11,"t":659.0,"x":"The munificence of God assented to the fulfillment of his desire, but did not promise any cessation or satiety of the desire."},{"k":"s","p":14,"i":0,"a":11,"t":670.0,"x":"He would not have shown himself to his servant if the sight were such as to bring the desire of the beholder to an end, since the true sight of God consists in this, that the one who looks up to God never ceases in that desire."},{"k":"s","p":14,"i":1,"a":11,"t":686.0,"x":"For he says: You cannot see my face, for man cannot see me and live."},{"k":"s","p":15,"i":0,"a":11,"t":691.3,"x":"Scripture does not indicate that this causes the death of those who look, for how would the face of life ever be the cause of death to those who approach it?"},{"k":"s","p":15,"i":1,"a":11,"t":701.0,"x":"On the contrary, the Divine is by its nature lifegiving."},{"k":"s","p":15,"i":2,"a":11,"t":705.0,"x":"Yet the characteristic of the divine nature is to transcend all characteristics."},{"k":"s","p":15,"i":3,"a":11,"t":710.0,"x":"Therefore, he who thinks God is something to be known does not have life, because he has turned from true Being to what he considers by sense perception to have being."},{"k":"c","a":11,"t":722.0,"e":812.4,"l":[[722.0,"So this is really quite interesting because it almost sort of leads us to the point where I think St. Gregory is saying, since God is incomprehensible, attempting to comprehend them by physical sense is the very sort of proof of one's deadness, you know, and perhaps, maybe that's the very good reason why God had forbidden idolatry."],[757.0,"Because idols are dead."],[760.0,"They are not images of the living."],[762.0,"They are not in any way corresponding with those who, as God, is always alive."],[770.0,"And so this desire on the part of Moses is human, sort of from the human perspective."],[779.0,"He wants to see God."],[780.0,"But God is far greater."],[782.0,"He is more than a human can sort of contain, than the human intellect that the human mind, that the human soul can contain."],[792.0,"Therefore, to know God, to see God and to live, is impossible."],[796.0,"But it would not be death, as St. Gregory says."],[798.0,"It would essentially sort of be perhaps the understanding of one's own limitation and mortality."],[807.0,"And so on."],[810.0,"Paragraph 235"]]},{"k":"s","p":16,"i":0,"a":11,"t":810.9,"x":"True Being is true life. This Being is inaccessible to knowledge."},{"k":"s","p":16,"i":1,"a":11,"t":816.4,"x":"If then the life-giving nature transcends knowledge, that which is perceived certainly is not life."},{"k":"s","p":16,"i":2,"a":11,"t":822.0,"x":"It is not in the nature of what is not life to be the cause of life."},{"k":"s","p":16,"i":3,"a":11,"t":827.0,"x":"Thus, what Moses yearned for is satisfied by the very things which leave his desire unsatisfied."},{"k":"s","p":17,"i":0,"a":11,"t":834.9,"x":"He learns from what was said that the Divine is by its very nature infinite, enclosed by no boundary."},{"k":"s","p":17,"i":1,"a":11,"t":845.0,"x":"If the Divine is perceived as though bounded by something, one must by all means consider along with that boundary what is beyond it."},{"k":"s","p":17,"i":2,"a":11,"t":854.0,"x":"For certainly that which is bounded leaves off at some point, as air provides the boundary for all that flies and water for all that live in it."},{"k":"s","p":17,"i":3,"a":11,"t":863.0,"x":"Therefore, fish are surrounded on every side by water, and birds by air."},{"k":"s","p":17,"i":4,"a":11,"t":868.0,"x":"The limits of the boundaries which circumscribe the birds or the fish are obvious:"},{"k":"s","p":17,"i":5,"a":11,"t":875.0,"x":"The water is the limit to what swims and the air to what flies."},{"k":"s","p":17,"i":6,"a":11,"t":878.0,"x":"In the same way, God, if he is conceived as bounded, would necessarily be surrounded by something different in nature."},{"k":"s","p":17,"i":7,"a":11,"t":889.0,"x":"It is only logical that what encompasses is much larger than what is contained."},{"k":"s","p":18,"i":0,"a":11,"t":897.0,"x":"Now it is agreed that the Divine is good in nature."},{"k":"s","p":18,"i":1,"a":11,"t":899.0,"x":"But what is different in nature from the Good is surely something other than the Good."},{"k":"s","p":18,"i":2,"a":11,"t":905.0,"x":"What is outside the Good is perceived to be evil in nature."},{"k":"s","p":18,"i":3,"a":11,"t":908.0,"x":"But it was shown that what encompasses is much larger than what is encompassed."},{"k":"s","p":18,"i":4,"a":11,"t":915.0,"x":"It most certainly follows, then, that those who think God is bounded conclude that he is enclosed by evil."},{"k":"s","p":19,"i":0,"a":11,"t":925.9,"x":"Since what is encompassed is certainly less than what encompasses, it would follow that the stronger prevails."},{"k":"s","p":19,"i":1,"a":11,"t":934.0,"x":"Therefore, he who encloses the Divine by any boundary makes out that the Good is ruled over by its opposite."},{"k":"s","p":19,"i":2,"a":11,"t":943.0,"x":"But that is out of the question."},{"k":"s","p":19,"i":3,"a":11,"t":945.0,"x":"Therefore, no consideration will be given to anything enclosing infinite nature."},{"k":"s","p":19,"i":4,"a":11,"t":950.0,"x":"It is not in the nature of what is unenclosed to be grasped."},{"k":"s","p":19,"i":5,"a":11,"t":955.8,"x":"But every desire for the Good which is attracted to that ascent constantly expands as one progresses in pressing on to the Good."},{"k":"c","a":11,"t":966.0,"e":983.0,"l":[[966.0,"So you might say that because God is infinite, the more one draws to God, the more infinite one's desire and grasp becomes."],[977.0,"And thus it is never satisfied."],[980.0,"Paragraph 239."]]},{"k":"s","p":20,"i":0,"a":11,"t":967.4,"x":"This truly is the vision of God: never to be satisfied in the desire to see him."},{"k":"s","p":20,"i":1,"a":11,"t":980.0,"x":"But one must always, by looking at what he can see, rekindle his desire to see more."},{"k":"s","p":20,"i":2,"a":11,"t":993.0,"x":"Thus, no limit would interrupt growth in the ascent to God, since no limit to the Good can be found nor is the increasing of desire for the Good brought to an end because it is satisfied."},{"k":"c","a":11,"t":1004.2,"e":1575.4,"l":[[1004.2,"brought to an end because it is satisfied."],[1008.0,"That's really quite interesting."],[1010.0,"And I think that we see the proof of what he's saying here in the lives of the saints, because we see the greatest of saints, the ones who worked tremendous miracles, who were able to see the past, the present and the future as clearly as we see, say, you know, our own hand in front of our face, considered themselves to be utterly worthless sinners, completely sort of surrounded by darkness and so on, and prayed to God to give them time for repentance, pray to God to have mercy on them."],[1049.0,"That, I think, is the very nice parallel."],[1052.0,"And so much so that I think the."],[1058.0,"The idea of the Dunning Kruger syndrome, which basically states the less someone is experienced in something, the more confident he is."],[1067.0,"I think that is also very well seen by people who are distant from God, who are far from him, who do not understand fully sort of his workings and so on."],[1081.0,"Yet we see them oftentimes act as though they're close and they understand everything they see."],[1090.0,"And that is because they have not reached that level of perfection that opens wider and wider the horizon of knowledge of God."],[1099.0,"So the more one is drawn close to God, the more one realizes how sort of distant he is, how dark and unenlightened he is."],[1112.0,"And the further one is away from God, well, the more he thinks that he knows God and everything else about life as well."],[1119.0,"So that's."],[1120.0,"That's definitely something interesting."],[1134.0,"Yes, I think that when the Lord says, Abraham rejoiced to see my day."],[1140.0,"Well, of course, St. John the Theologian also says, that which we have seen with our own eyes, right, that which we have heard with our ears, which our hands have handled, we pass on to you."],[1156.0,"So we are talking here, Abraham seeing the Lord's day, sort of in the human history, in the human existence, you might say, in the dimension of Humanity, inasmuch as Christ, the Son of God, the infinite word of God, became finite man, the one who can be circumscribed."],[1179.0,"And he was definitely contained in the womb of the Virgin Mary."],[1184.0,"He was lifted up on the cross."],[1186.0,"He was contained in the tomb, you know, for the period of what, three days."],[1192.0,"And so that is what is being said."],[1197.0,"And I think we shall see him as he is perhaps refers, St. Paul speaking, refers of believers standing before Christ."],[1208.0,"And most definitely even Christ himself says, if you remember when he's telling the disciples that, you know, I will soon go there where you cannot follow me, and I go to prepare a place for you, you."],[1220.0,"And you remember, Thomas says, show us the Father and it sufficeth us."],[1224.0,"And the Lord says to him, have you not yet realized if you have seen me, you have seen the Father?"],[1231.0,"And of course, that seeing does pertain to human sight, to human seeing, because God did become man."],[1241.0,"There is that face to face aspect that we can now talk about."],[1247.0,"But when Moses was wanting to see God, obviously Christ the incarnate God had not yet appeared to him the way that he would later appear to his disciples."],[1259.0,"I think maybe that's where the difference is."],[1262.0,"And so St. Gregory perhaps is talking about sort of the desire to perceive the imperceivable, to attain the unattainable, that sort of desire, the ever greater desire and thirst for God."],[1280.0,"And you might say that in some way this desire is in an interesting way reflected in human nature."],[1288.0,"And that when we taste something good, even physical, we want more."],[1293.0,"Only when we are absolutely full and perhaps, you know, maybe even overly full, do we want to stop."],[1300.0,"But in some cases, even then, we don't want to stop."],[1304.0,"Even when we get nauseated and might actually get sick."],[1308.0,"In some cases, if something is truly very, very, very tasty and we find it attractive, we want to do more and more and more and more and more."],[1319.0,"So if our fallen human nature sort of has those aspects of certain understanding of the insatiability of a desire, well then definitely sort of in that measure of the divine being which is immeasurable and incomprehensible, sort of uncontainable and so on."],[1349.0,"Well, yes, in that sense as well."],[1352.0,"When we see even the small portion of it, the door opens just a crack, then it immediately fills us with the desire to yearn and sort of want for more."],[1365.0,"And I think that if we don't have that desire, it basically says we have not yet even tasted it to such an extent that we would have that desire now, let's see."],[1377.0,"Did I read 2:39?"],[1378.0,"Well, let me just read it just."],[1379.0,"Just in case."],[1381.0,"True, this truly is the vision of God never to be satisfied in the desire to see Him."],[1386.0,"But one must always, by looking at what he can see, rekindle his desire to see more."],[1391.0,"Thus, no limit would interrupt growth in the ascent to God, since no limit to the good can be found."],[1398.0,"Nor is the increasing design of a desire for the good brought to an end because it is satisfied."],[1404.0,"I read this already."],[1404.0,"Sorry, I repeated myself."],[1406.0,"But I think in this case, based on the comment that was just posted in the chat, I could say that, well, we see that even in the life of Christ as perfect man, you know, both perfect God and perfect man, when he, as the man was around other men and when he was with the apostles, they had that sort of interesting desire always to be with him."],[1439.0,"They didn't."],[1440.0,"And remember, he says, I go, but it is better for you that I go, because if I do not go, the Spirit will not come."],[1446.0,"So I go to my Father."],[1448.0,"So you can receive the Spirit."],[1450.0,"Well, that would signify they didn't want to see him go, right?"],[1454.0,"No, I'm not sure exactly what this question is."],[1466.0,"Forgive me, how should we understand Christ being the rock that followed Moses in the wilderness according to Corinthians?"],[1473.0,"Well, I'm not sure exactly what is meant by this particular question."],[1479.0,"I think that more so, you know, the rock didn't sort of follow, right?"],[1487.0,"I mean, if we look at the literal account of the wilderness, it was the pillar of fire and the cloud that followed."],[1496.0,"Pillar of fire at night, cloud by the day, cloud protecting them."],[1501.0,"And you could say that it was Christ's presence."],[1504.0,"Well, because God was with them in the wilderness."],[1506.0,"So Christ was certainly with them in the wilderness, but he was not yet incarnate, not in the dimension of our time that would happen down the road."],[1519.0,"Now, I think that St. Paul is referring to Christ as the rock, the rock from which the water flowed, being Christ."],[1529.0,"Yes, sort of."],[1532.0,"He is, you know, in that sense, he is the rock, you know, from which the water flow."],[1538.0,"And of course, the water then gave the thirsty Israelites sort of the way to be saved from dying of thirst."],[1547.0,"But for us, there is the greater."],[1549.0,"There is sort of the water of life flowing from Christ, the true faith and so on."],[1554.0,"And St. Paul, I'm pretty sure, was in some cases definitely speaking of those images in the Old Testament, sort of in a spiritual way, as St. Gregory would say, not necessarily in the very literal way."],[1569.0,"Maybe if we could read a little further."],[1571.0,"We can sort of see where St."]]},{"k":"s","p":21,"i":0,"a":11,"t":1577.0,"x":"But what is that place which is seen next to God?"},{"k":"s","p":21,"i":1,"a":11,"t":1582.9,"x":"What is the rock? And what again is the hole in the rock?"},{"k":"s","p":21,"i":2,"a":11,"t":1587.0,"x":"What is the hand of God that covers the mouth of the rock?"},{"k":"s","p":21,"i":3,"a":11,"t":1590.0,"x":"What is the passing by of God?"},{"k":"s","p":21,"i":4,"a":11,"t":1593.0,"x":"What is his back which God promised to Moses when he asked to see him face to face?"},{"k":"s","p":22,"i":0,"a":11,"t":1600.0,"x":"Naturally each of these things must be highly significant and worthy of the munificence of the divine Giver."},{"k":"s","p":22,"i":1,"a":11,"t":1606.0,"x":"Thus this promise is believed to be more magnificent and loftier than every theophany which had previously been granted to his great servant."},{"k":"s","p":22,"i":2,"a":11,"t":1615.0,"x":"How then would one, from what has been said, understand this height to which Moses desires to attain after such previous ascents and to which he who turns everything to their good cooperates with all those who love God makes the ascent easy through his leadership?"},{"k":"s","p":22,"i":3,"a":11,"t":1631.6,"x":"Here is a place, he says, beside me."},{"k":"s","p":23,"i":0,"a":11,"t":1637.0,"x":"The thought harmonizes readily with what has been contemplated before."},{"k":"s","p":23,"i":1,"a":11,"t":1643.4,"x":"In speaking of \"place\" he does not limit the place indicated by anything quantitative (for to something unquantitative there is no measure)."},{"k":"s","p":23,"i":2,"a":11,"t":1654.0,"x":"On the contrary, by the use of the analogy of a measurable surface he leads the hearer to the unlimited and infinite."},{"k":"s","p":23,"i":3,"a":11,"t":1662.0,"x":"The text seems to signify some such understanding:"},{"k":"s","p":23,"i":4,"a":11,"t":1665.0,"x":"\"Whereas, Moses, your desire for what is still to come has expanded and you have not reached satisfaction in your progress and whereas you do not see any limit to the Good, but your yearning always looks for more, the place with me is so great that the one running in it is never able to cease from his progress.\""},{"k":"s","p":24,"i":0,"a":11,"t":1689.8,"x":"In another Scriptural passage the progress is a standing still, for it says, You must stand on the rock."},{"k":"s","p":24,"i":1,"a":11,"t":1697.0,"x":"This is the most marvelous thing of all: how the same thing is both a standing still and a moving."},{"k":"s","p":25,"i":0,"a":11,"t":1703.0,"x":"For he who ascends certainly does not stand still, and he who stands still does not move upwards."},{"k":"s","p":25,"i":1,"a":11,"t":1709.0,"x":"But here the ascent takes place by means of the standing."},{"k":"s","p":25,"i":2,"a":11,"t":1713.0,"x":"I mean by this that the firmer and more immovable one remains in the Good, the more he progresses in the course of virtue."},{"k":"s","p":25,"i":3,"a":11,"t":1721.0,"x":"The man who in his reasonings is uncertain and liable to slip, since he has no firm grounding in the Good but is tossed one way and another and carried along (as the Apostle says) and is doubtful and wavers in his opinions concerning reality, would never attain to the height of virtue."},{"k":"c","a":11,"t":1740.6,"e":1911.8,"l":[[1740.6,"virtue."],[1741.0,"Now this is to me this is very interesting because it's almost like quantum physics, you know, that where."],[1747.0,"Where the."],[1754.0,"Oh, it's not a problem at all."],[1755.0,"You can."],[1756.0,"You can interrupt anytime if."],[1758.0,"If you're watching and if you're sort of in the chat, it's no problem."],[1762.0,"I."],[1762.0,"It doesn't bother me in the least."],[1764.0,"Now."],[1764.0,"You're."],[1764.0,"You're absolutely fine."],[1766.0,"And the whole purpose, you know, for the chat, of course, is so that you can ask questions and any clarifications."],[1773.0,"I find sometimes, because St. Gregory is so lofty and, you know, it was such a great saint with such amazing understanding of some of these things."],[1784.0,"For me, sometimes it's safer to read more, to sort of widen the context so that I do not go off in sort of some."],[1796.0,"Maybe not the very correct place."],[1799.0,"So I don't want to be brazen in my commentaries on such a great saint's work."],[1805.0,"That's."],[1806.0,"That's the only reason I was saying, you know, that it would be probably wise to continue reading."],[1811.0,"Now, in this particular case, as I said, this is quite interesting because he's saying standing firm and moving at the same time."],[1817.0,"Well, you move toward God by standing firm in your faith."],[1821.0,"So."],[1822.0,"So, like I said, it's almost like quantum physics."],[1824.0,"It's quite interesting, you know, like God is three in one, which was very difficult for the people of the early church, sort of the contemporaries of the early Christians."],[1836.0,"It was very, very difficult to comprehend."],[1839.0,"How is it that you believe in one God and yet he is Father, Son, and Holy Spirit?"],[1844.0,"So you have three gods."],[1845.0,"And of course, we say, no, there's only one God, but he is manifest."],[1850.0,"Well, sort of he is in three persons, you know, three persons, one God."],[1854.0,"And that the ancient people had a very, very difficult time sort of grasping that idea."],[1863.0,"Even, you might say the people of the law, the people who had the Mosaic Law, had an incredibly difficult time comprehending."],[1874.0,"How is it that Moses told them that God is one, and yet Christ comes and says, my Father and I are one?"],[1881.0,"And they, of course, some of them thought that he was saying a blasphemy, which, of course, we believe that he didn't blaspheme."],[1889.0,"He was speaking the truth."],[1891.0,"It was just the fact that it was very, very difficult even for some of his contemporaries among the chosen people, not just the Greeks, you know, with their philosophy and sort of, you know, mechanical physics budding, you know, forward to understand this concept."],[1909.0,"Reading on"]]},{"k":"s","p":26,"i":0,"a":11,"t":1911.2,"x":"He is like those who toil endlessly as they climb uphill in sand:"},{"k":"s","p":26,"i":1,"a":11,"t":1916.0,"x":"Even though they take long steps, their footing in the sand always slips downhill, so that, although there is much motion, no progress results from it."},{"k":"s","p":26,"i":2,"a":11,"t":1925.0,"x":"But if someone, as the Psalmist says, should pull his feet up from the mud of the pit and plant them upon the rock (the rock is Christ who is absolute virtue), then the more steadfast and unmoveable (according to the advice of Paul) he becomes in the Good the faster he completes the course."},{"k":"s","p":26,"i":3,"a":11,"t":1946.0,"x":"It is like using the standing still as if it were a wing while the heart flies upward through its stability in the good."},{"k":"c","a":11,"t":1957.0,"e":2050.0,"l":[[1957.0,"Now, I think also the doing of God's words, the doing of the work of the words of Christ is what he compares, what Christ himself compares."],[1970.0,"Compares, sorry, to building the house on the solid rock, hearing his teachings, but not doing them."],[1980.0,"He compares to building on the sand."],[1984.0,"I think sometimes we think conveniently that it is enough for us just to hear, just to sort of be present when they're read, but we fail to put them into practice very well."],[1997.0,"Now, when we put them into practice, we are building on the solid rock."],[2003.0,"We are building on Christ."],[2005.0,"And you know, of course, he is Christ, Christ, the cornerstone, sort of the foundation rock."],[2011.0,"But that building on the sound foundation allows us to grow."],[2016.0,"You might actually say that standing firmly on the rock allows you to climb, meaning your building of the virtue is being built."],[2025.0,"But because the foundation is steady, it does not collapse, it does not sort of sink, it does not fall."],[2031.0,"If the foundation is unsteady, if you're putting your building into the sand, you know, you keep on building and it keeps falling."],[2039.0,"You keep on building and it keeps falling."],[2041.0,"So, you know, that, I think, is probably applicable here as well."],[2047.0,"Paragraph 245."]]},{"k":"s","p":27,"i":0,"a":11,"t":2049.0,"x":"Therefore, he who showed Moses the place urges him on in his course."},{"k":"s","p":27,"i":1,"a":11,"t":2055.0,"x":"When he promised that he would stand him on the rock, he showed him the nature of that divine race."},{"k":"s","p":27,"i":2,"a":11,"t":2061.0,"x":"But the opening in the rock which Scripture calls a \"hole\" the divine Apostle interprets well in his own words when he speaks of a heavenly house not made with hands which is laid up by hope for those who have dissolved their earthly tabernacle."},{"k":"c","a":11,"t":2076.0,"e":2082.6,"l":[[2076.0,"And I'm assuming the earthly tabernacle being dissolved as the human body, perhaps,"]]},{"k":"s","p":28,"i":0,"a":11,"t":2081.0,"x":"For truly he who has run the race, as the Apostle says, in that wide and roomy stadium, which the divine voice calls \"place,\" and has kept the faith and, as the figurative expression says, has planted his feet on the rock; such a person will be adorned with the crown of righteousness from the hand of the contest's judge."},{"k":"s","p":28,"i":1,"a":11,"t":2105.0,"x":"This prize is described in different ways by Scripture."},{"k":"s","p":29,"i":0,"a":11,"t":2111.0,"x":"For the same thing which is here called an opening in the rock is elsewhere referred to as \"pleasure of paradise,\" \"eternal tabernacle,\" \"mansion with the Father,\" \"bosom of the patriarch,\" \"land of the living,\" \"water of refreshment,\" \"Jerusalem which is above,\" \"kingdom of heaven,\" \"prize of calling,\" \"crown of graces,\" \"crown of pleasure,\" \"crown of beauty,\" \"pillar of strength,\" \"pleasure on a table,\" \"councils of God,\" \"throne of judgment,\" \"place of name,\" \"hidden tabernacle.\""},{"k":"s","p":30,"i":0,"a":11,"t":2146.0,"x":"We say, then, that Moses' entrance into the rock has the same significance as these descriptions."},{"k":"s","p":30,"i":1,"a":11,"t":2153.0,"x":"For, since Christ is understood by Paul as the rock, all hope of good things is believed to be in Christ, in whom we have learned all the treasures of good things to be."},{"k":"s","p":30,"i":2,"a":11,"t":2164.0,"x":"He who finds any good finds it in Christ who contains all good."},{"k":"s","p":31,"i":0,"a":11,"t":2172.0,"x":"He who attained to this and was shadowed by the hand of God, as the text promised (for the hand of God would be the creative power of what exists, the only begotten God, by whom all things were made, who is also \"place\" for those who run, who is, according to his own words, the \"way\" of the course, and who is \"rock\" to those who are well established and \"house\" to those who are resting), he it is who will hear the One who summons and will see the back of the One who calls, which means he will follow Yahweh your God, as the Law commands."},{"k":"s","p":32,"i":0,"a":11,"t":2209.0,"x":"When the great David heard and understood this, he said to him who dwells in the shelter of the most High;"},{"k":"s","p":32,"i":1,"a":11,"t":2217.4,"x":"He will overshadow you with his shoulders, which is the same as being behind God (for the shoulder is on the back of the body)."},{"k":"s","p":32,"i":2,"a":11,"t":2230.0,"x":"Concerning himself David says, My soul clings close to you, your right hand supports me."},{"k":"s","p":32,"i":3,"a":11,"t":2235.0,"x":"You see how the Psalms agree with the history."},{"k":"s","p":32,"i":4,"a":11,"t":2238.0,"x":"For as the one says that the right hand is a help to the person who has joined himself close behind God, so the other says that the hand touches the person who waits in the rock upon the divine voice and prays that he might follow behind."},{"k":"s","p":33,"i":0,"a":11,"t":2257.0,"x":"But when the Lord who spoke to Moses came to fulfill his own law, he likewise gave a clear explanation to his disciples, laying bare the meaning of what had previously been said in a figure when he said, If anyone wants to be a follower of mine and not \"If any man will go before me.\" And to the one asking about eternal life he proposes the same thing, for he says Come, follow me."},{"k":"s","p":33,"i":1,"a":11,"t":2285.0,"x":"Now, he who follows sees the back."},{"k":"c","a":11,"t":2288.0,"e":2322.5,"l":[[2288.0,"Oh, that's Very interesting."],[2291.0,"That is very, very interesting."],[2295.0,"Come after me and didn't follow me, right?"],[2297.0,"So, so the Lord says, follow me."],[2300.0,"In a way, you might also say that then he's saying, be like Moses, you know, and if the rock is Christ, so you be in Christ and you follow God to sort of unlimited perfection and limitless perfection."],[2316.0,"That's really impressive."],[2319.0,"Very interesting."],[2320.0,"Paragraph 252."]]},{"k":"s","p":34,"i":0,"a":11,"t":2321.0,"x":"So Moses, who eagerly seeks to behold God, is now taught how he can behold Him: to follow God wherever he might lead is to behold God."},{"k":"s","p":34,"i":1,"a":11,"t":2332.0,"x":"His passing by signifies his guiding the one who follows, for someone who does not know the way cannot complete his journey safely in any other way than by following behind his guide."},{"k":"s","p":34,"i":2,"a":11,"t":2345.0,"x":"He who leads, then, by his guidance shows the way to the one following."},{"k":"s","p":34,"i":3,"a":11,"t":2349.0,"x":"He who follows will not turn aside from the right way if he always keeps the back of his leader in view."},{"k":"c","a":11,"t":2357.0,"e":2402.0,"l":[[2357.0,"Well, that's very true."],[2359.0,"You know, if, if you follow, if you stay behind the leader, you will definitely come to where the leader leads."],[2367.0,"So very, very interesting way that St. Gregory took us on a long journey where I have to confess I was a bit apprehensive as to, you know, know, whether I would be able to sort of comment properly on what he's saying."],[2384.0,"But I, I think we see sort of some sort of a conclusion to this."],[2389.0,"We're actually just a couple paragraphs away from the end of the chapter and I'm quite happy with where we've come so far."],[2399.0,"Paragraph 253."]]},{"k":"s","p":35,"i":0,"a":11,"t":2401.0,"x":"For he who moves to one side or brings himself to face his guide assumes another direction for himself than the one his guide shows him."},{"k":"s","p":35,"i":1,"a":11,"t":2411.0,"x":"Therefore, he says to the one who is led, My face is not to be seen, that is, \"Do not face your guide.\" If he does so, his course will certainly be in the opposite direction, for good does not look good in the face, but follows it."},{"k":"s","p":36,"i":0,"a":11,"t":2436.0,"x":"What is perceived to be its opposite is face to face with the good, for what looks virtue in the face is evil."},{"k":"c","a":11,"t":2443.0,"e":2512.5,"l":[[2443.0,"Now come to think of it, the devil says to God when he talks to him about Job, he says, take away his wealth and see if he will BL you."],[2461.0,"Bless you to your face."],[2463.0,"That's quite interesting."],[2464.0,"So basically he's saying, right now, Job is following you."],[2469.0,"He's behind you."],[2470.0,"You know, he's your follower."],[2472.0,"But if you take his wealth away, see if he will bless you face to face."],[2476.0,"He will actually sort of confront you and perhaps argue with you."],[2481.0,"And so, you know, Moses was shown the back of God because thus it was communicated to everyone that Moses is the follower of God."],[2493.0,"And we see that Job, in fact, was also the follower of God, because that is what the devil wanted to do."],[2499.0,"He wanted to bring Job face to face with God as to confront him."],[2504.0,"Very interesting."],[2506.0,"Very, very, very interesting."]]},{"k":"s","p":36,"i":1,"a":11,"t":2512.0,"x":"But virtue is not perceived in contrast to virtue."},{"k":"s","p":36,"i":2,"a":11,"t":2515.0,"x":"Therefore, Moses does not look God in the face, but looks at his back; for whoever looks at him face to face shall not live, as the divine voice testifies, man cannot see the face of the Lord and live."},{"k":"c","a":11,"t":2533.6,"e":2551.5,"l":[[2533.6,"well."],[2534.0,"Yes."],[2534.0,"So if you confront God, if you oppose him, you cannot live."],[2538.0,"Because life is God."],[2540.0,"Following God is life everlasting."],[2544.0,"But confronting God, well, of course, that's very, very interesting."],[2549.0,"Paragraph 255."]]},{"k":"s","p":37,"i":0,"a":11,"t":2550.0,"x":"You see how it is so great a thing to learn how to follow God, that after those lofty ascents and awesome and glorious theophanies virtually at the end of his life, the man who has learned to follow behind God is scarcely considered worthy of this grace."},{"k":"c","a":11,"t":2568.0,"e":2879.4,"l":[[2568.0,"That is really and truly amazing."],[2571.0,"And that is why we see, for example, that Saint Sisoas, who on his deathbed is transfigured like Christ, and he shines with the light of Christ."],[2583.0,"And when the disciples of Saint Sisoas, his fellow brothers, say, we hear you mumbling."],[2590.0,"What are you saying?"],[2590.0,"And he says, I'm asking God to give me time for repentance."],[2595.0,"Well, that's quite beautiful."],[2596.0,"Sort of repentance."],[2597.0,"As to what and where does repentance mean to lead us?"],[2603.0,"It's actually intended to lead us to follow God."],[2610.0,"That's really quite beautiful because the Lord says, come, follow me."],[2616.0,"That's, that's."],[2617.0,"That's."],[2620.0,"To me, that is the biggest takeaway from this chapter."],[2623.0,"Quite amazing."],[2625.0,"Sort of, you know, the eternal development, the eternal growth."],[2628.0,"What is it for?"],[2629.0,"Well, it's the hope of seeing the back of God."],[2634.0,"That gives us the consolation that if we see his back, then we're following in his footsteps, you might say, then we are truly his disciples."],[2643.0,"And if we ever see him face to face, something's wrong."],[2646.0,"Then, you know, perhaps we."],[2648.0,"We should be alarmed."],[2651.0,"That that is."],[2652.0,"Is really quite nice and I think in that regard."],[2659.0,"And we shall see him as he is."],[2664.0,"Think of it this way."],[2666.0,"How beautiful."],[2668.0,"Sort of the picture the Lord paints when he talks about himself being the shepherd."],[2673.0,"He says, my sheep follow me because they know my voice."],[2678.0,"Well, what do the sheep see?"],[2679.0,"They also see the back of their shepherd."],[2682.0,"He says, they Follow me."],[2683.0,"And I've always sort of looked at that from the perspective of, well, follow me as in he doesn't drag him, he doesn't lead the sheep on the leash."],[2694.0,"The sheep follow him, and as they follow him, well, you know, where do they follow him?"],[2700.0,"His path leads to the Cross."],[2702.0,"And so we should all be willing also to go to the cross and to die with Christ."],[2709.0,"And that I, I, I find that to be really, really quite inspiring today."],[2715.0,"So thank you so much for, for, for bringing this up and, and sort of mentioning this."],[2723.0,"And thankfully St. Gregory, toward the end of the chapter, he, he gave us a fairly good explanation of what he meant."],[2732.0,"Really and truly."],[2733.0,"Yes, you know, come follow me."],[2735.0,"The Lord says, you know, go sell all you have and come follow me."],[2739.0,"He says, the sheep, my sheep know my voice and they follow me."],[2745.0,"That, that is really, really, truly something, something amazing."],[2750.0,"At any rate, let us, let us pray and hopefully we will be able to continue next week."],[2757.0,"I'm not sure whether we will have a vigil service next Wednesday night."],[2763.0,"There may be a service on Thursday morning for the Vladimir icon of the Mother of God, or maybe not."],[2772.0,"If there will be no service on Wednesday evening, then we shall be able to continue as normal as usual."],[2779.0,"If there will be a service on Wednesday evening, then I will try to do my best either to do this broadcast on Tuesday or on Friday night, depending."],[2790.0,"So let us sing a prayer and I will say goodbye for tonight."],[2795.0,"It is truly me to bless ever blessed and most blameless and Mother of our God, more honorable than, than the cherubim and beyond compare, more glorious than the seraphim who without corruption gave his birth to God, the Word, the very Theotokosadhi do we magnify."],[2817.0,"God bless all of you once again."],[2819.0,"Thank you so much for your support."],[2822.0,"Also thank you so much for the chat, the questions and the clarifications."],[2827.0,"Those are very useful."],[2829.0,"So sometimes streamlabs shows me that there's only one or two, two people watching."],[2836.0,"Sometimes nobody."],[2837.0,"And a parishioner of mine has mentioned once before that sometimes that might not be correct."],[2843.0,"But I do feel lonely at times when I'm reading this."],[2846.0,"And while it benefits me, then my only consolation is, well, hopefully if nobody's present life, they will benefit by reading afterward when they can just sort of watch the recording."],[2858.0,"Well, in this particular case, when you write your comments, it at least lets me knows that I'm, lets me know that I'm not alone and we're working through this together."],[2871.0,"So that's very, very greatly appreciated."],[2874.0,"God bless and have a wonderful night."],[2876.0,"All the best."]]}]},{"t":"Moses Envied","p":[[256,"No longer does any offense which comes about through evil withstand the one who in this manner follows God. After these things the envy of his brothers arose against him. Envy is the passion which causes evil, the father of death, the first entrance of sin, the root of wickedness, the birth of sorrow, the mother of misfortune, the basis of disobedience, the beginning of shame. Envy banished us from Paradise, having become a serpent to oppose Eve. Envy walled us off from the tree of life, divested us of holy garments, and in shame led us away clothed with fig leaves."],[257,"Envy armed Cain contrary to nature and instituted the death which is vindicated seven times. Envy made Joseph a slave. Envy is the death-dealing sting, the hidden weapon, the sickness of nature, the bitter poison, the self-willed emaciation, the bitter dart, the nail of the soul, the fire in the heart, the flame burning on the inside."],[258,"For envy, it is not its own misfortune but another's good fortune that is unfortunate. Again, inversely, success is not one's own good fortune but the neighbor's misfortune. Envy is grieved at the good deeds of men and takes advantage of their misfortunes. It is said that the vultures which devour corpses are destroyed by perfume. Their nature is akin to the foul and corrupt. Anyone who is in the power of this sickness is destroyed by the happiness of his neighbors as by the application of some perfume; but if he should see any unfortunate experience he flies to it, sets his crooked beak to it, and draws forth the hidden misfortunes."],[259,"Envy fought against many who lived before Moses, but when it attacked this great man, it was broken like a clay pot being dashed against a rock. By this especially was shown the progress which Moses had made in his journey with God. He ran in the divine place, took his stand on the rock, was held in its opening, was covered by God's hand, and followed behind his leader, not looking him in the face, but looking at his back."],[260,"That he appeared higher than the bow can shoot shows that of himself he had become most blessed in following God. For envy also sends the dart against Moses, but it does not reach the height where Moses was. The bowstring of evil was too slack to shoot the passion far enough to reach Moses from those who were previously ill. But Aaron and Miriam were wounded by the passion of its evil influence and became like a bow of envy, shooting words against him rather than darts."],[261,"Moses so refrained from becoming involved in their weakness that he even ministered to the condition of those who had become ill. Not only was he not moved to defend himself against those who caused him sorrow, but he even besought God for mercy on their behalf. He showed through what he did, I think, that the person who is well fortified with the shield of virtue will not be stung by the tips of the darts."],[262,"He blunts the spears; the hardness of his armor deflects them. The armor that protects against such darts is God himself, whom the soldier of virtue puts on. For Scripture says let your armor be the Lord Jesus, that is to say, the full armor that cannot be pierced. Being thus well protected, Moses rendered the evil archer ineffective."],[263,"He did not rush to defend himself against those who caused him sorrow; although they had been condemned by impartial judgment and he knew what was the naturally right thing to do, he nevertheless interceded with God for his brethren. He would not have done this if he had not been behind God, who had shown him his back as a safe guide to virtue."]],"id":"b2-22","r":[256,263],"w":642,"x":[{"k":"c","a":12,"t":2.0,"e":68.5,"l":[[2.0,"In the name of the Father and of the Son and of the Holy Spirit."],[5.0,"Amen."],[5.0,"Dear friends, welcome back to our weekly readings of the Holy Fathers."],[11.0,"Let us pray and we will go ahead and resume our reading."],[18.0,"O heavenly King, comfort the spirit of truth who art ever were present and fillest all things true treasury of good things and giver of life, come and dwell in us, and cleanse us of all impurity and save our souls."],[36.0,"O good one."],[42.0,"So today we're continuing our reading of the life of the holy prophet Moses,."],[51.0,"As."],[54.0,"Written and sort of described by St. Gregory of Nissa."],[59.0,"Today we're reading chapter which is titled Moses envied."],[65.0,"Paragraph 256."]]},{"k":"s","p":0,"i":0,"a":12,"t":68.0,"x":"No longer does any offense which comes about through evil withstand the one who in this manner follows God."},{"k":"s","p":0,"i":1,"a":12,"t":75.0,"x":"After these things the envy of his brothers arose against him."},{"k":"s","p":0,"i":2,"a":12,"t":78.6,"x":"Envy is the passion which causes evil, the father of death, the first entrance of sin, the root of wickedness, the birth of sorrow, the mother of misfortune, the basis of disobedience, the beginning of shame."},{"k":"s","p":0,"i":3,"a":12,"t":93.0,"x":"Envy banished us from Paradise, having become a serpent to oppose Eve."},{"k":"s","p":0,"i":4,"a":12,"t":97.7,"x":"Envy walled us off from the tree of life, divested us of holy garments, and in shame led us away clothed with fig leaves."},{"k":"c","a":12,"t":107.0,"e":117.0,"l":[[107.0,"So I guess in this particular case he's just giving us the breakdown of how bad envy is."],[114.0,"Paragraph 257."]]},{"k":"s","p":1,"i":0,"a":12,"t":116.0,"x":"Envy armed Cain contrary to nature and instituted the death which is vindicated seven times."},{"k":"s","p":1,"i":1,"a":12,"t":123.0,"x":"Envy made Joseph a slave."},{"k":"s","p":1,"i":2,"a":12,"t":125.4,"x":"Envy is the death-dealing sting, the hidden weapon, the sickness of nature, the bitter poison, the self-willed emaciation, the bitter dart, the nail of the soul, the fire in the heart, the flame burning on the inside."},{"k":"s","p":2,"i":0,"a":12,"t":143.0,"x":"For envy, it is not its own misfortune but another's good fortune that is unfortunate."},{"k":"s","p":2,"i":1,"a":12,"t":148.0,"x":"Again, inversely, success is not one's own good fortune but the neighbor's misfortune."},{"k":"s","p":2,"i":2,"a":12,"t":152.4,"x":"Envy is grieved at the good deeds of men and takes advantage of their misfortunes."},{"k":"s","p":2,"i":3,"a":12,"t":158.0,"x":"It is said that the vultures which devour corpses are destroyed by perfume."},{"k":"s","p":2,"i":4,"a":12,"t":163.0,"x":"Their nature is akin to the foul and corrupt."},{"k":"s","p":2,"i":5,"a":12,"t":166.0,"x":"Anyone who is in the power of this sickness is destroyed by the happiness of his neighbors as by the application of some perfume; but if he should see any unfortunate experience he flies to it, sets his crooked beak to it, and draws forth the hidden misfortunes."},{"k":"c","a":12,"t":183.0,"e":203.0,"l":[[183.0,"So."],[184.0,"So in this particular case, I think what he's saying is that the person who is smitten with envy, who is stricken with envy, is like a vulture that feeds on the misfortune of others, and that rejoices in the misfortune of others."],[200.0,"Paragraph 259."]]},{"k":"s","p":3,"i":0,"a":12,"t":202.0,"x":"Envy fought against many who lived before Moses, but when it attacked this great man, it was broken like a clay pot being dashed against a rock."},{"k":"s","p":3,"i":1,"a":12,"t":211.0,"x":"By this especially was shown the progress which Moses had made in his journey with God."},{"k":"s","p":3,"i":2,"a":12,"t":217.0,"x":"He ran in the divine place, took his stand on the rock, was held in its opening, was covered by God's hand, and followed behind his leader, not looking him in the face, but looking at his back."},{"k":"c","a":12,"t":232.0,"e":241.0,"l":[[232.0,"So here he just describes how well Moses did spiritually for himself."],[238.0,"Paragraph 260."]]},{"k":"s","p":4,"i":0,"a":12,"t":240.0,"x":"That he appeared higher than the bow can shoot shows that of himself he had become most blessed in following God."},{"k":"s","p":4,"i":1,"a":12,"t":247.0,"x":"For envy also sends the dart against Moses, but it does not reach the height where Moses was."},{"k":"s","p":4,"i":2,"a":12,"t":254.0,"x":"The bowstring of evil was too slack to shoot the passion far enough to reach Moses from those who were previously ill."},{"k":"s","p":4,"i":3,"a":12,"t":261.0,"x":"But Aaron and Miriam were wounded by the passion of its evil influence and became like a bow of envy, shooting words against him rather than darts."},{"k":"c","a":12,"t":271.0,"e":292.4,"l":[[271.0,"So in this particular case, we know that Aaron and Miriam spoke out against Moses."],[276.0,"And that is why he's saying that while the devil was not able to access Moses himself, unfortunately he was able to get to Aaron and Miriam."]]},{"k":"s","p":5,"i":0,"a":12,"t":291.0,"x":"Moses so refrained from becoming involved in their weakness that he even ministered to the condition of those who had become ill."},{"k":"s","p":5,"i":1,"a":12,"t":299.7,"x":"Not only was he not moved to defend himself against those who caused him sorrow, but he even besought God for mercy on their behalf."},{"k":"s","p":5,"i":2,"a":12,"t":307.0,"x":"He showed through what he did, I think, that the person who is well fortified with the shield of virtue will not be stung by the tips of the darts."},{"k":"c","a":12,"t":316.0,"e":378.4,"l":[[316.0,"Now, in this particular case, I think he's referring to the fact that I know, for I know for sure that at least Miriam, I don't remember that Aaron was but Miriam when she spoke out against Moses with envy."],[329.0,"She was stricken with leprosy."],[333.0,"And of course she had to leave the camp and her flesh was rotting."],[339.0,"And Moses prayed to God and begged the Lord to heal her and to forgive her."],[346.0,"And that, of course, is of great importance because, yes, St. Gregory points out here that he did not even think about defending himself."],[356.0,"Not at all."],[356.0,"What he did think about was the fact that he was beseeching mercy on her behalf."],[362.0,"He was praying for God to heal her."],[364.0,"And of course, that, I think, definitely shows the height to which he ascended spiritually, that he climbed to paragraph 262."]]},{"k":"s","p":6,"i":0,"a":12,"t":377.0,"x":"He blunts the spears; the hardness of his armor deflects them."},{"k":"s","p":6,"i":1,"a":12,"t":381.0,"x":"The armor that protects against such darts is God himself, whom the soldier of virtue puts on."},{"k":"s","p":6,"i":2,"a":12,"t":388.0,"x":"For Scripture says let your armor be the Lord Jesus, that is to say, the full armor that cannot be pierced."},{"k":"s","p":6,"i":3,"a":12,"t":394.0,"x":"Being thus well protected, Moses rendered the evil archer ineffective."},{"k":"c","a":12,"t":399.0,"e":415.0,"l":[[399.0,"So because he was so closely united with God, he was not in the least bothered by sort of the temptation that assailed Miriam and Aaron."],[412.0,"Paragraph 263."]]},{"k":"s","p":7,"i":0,"a":12,"t":414.0,"x":"He did not rush to defend himself against those who caused him sorrow; although they had been condemned by impartial judgment and he knew what was the naturally right thing to do, he nevertheless interceded with God for his brethren."},{"k":"s","p":7,"i":1,"a":12,"t":428.0,"x":"He would not have done this if he had not been behind God, who had shown him his back as a safe guide to virtue."},{"k":"c","a":12,"t":436.0,"e":464.8,"l":[[436.0,"So basically, yes, had he not been a follower of God, he might have been provoked and tempted to strike back, to actually sort of rejoice in Miriam's punishment."],[453.0,"But he did not much the rather he prayed for Miriam to be forgiven."],[460.0,"Next chapter Joshua and the Spies264"]]}]},{"t":"Joshua and the Spies","p":[[264,"Let us proceed. When the natural enemy of men found no occasion to harm Moses, he directed the battle against those more vulnerable. When the lust of gluttony had been thrown at the people like a dart, he caused in them a desire for the things of Egypt so that they preferred the meat eaten by the Egyptians to the bread of heaven."],[265,"But Moses, having an elevated soul and soaring above such lust, was totally devoted to the coming inheritance which had been promised by God to those who departed from Egypt (spiritually understood) and made their way to that land flowing with milk and honey. For this reason he appointed some spies to be teachers of the beauties in that land."],[266,"The spies, in my opinion, are: on the one hand those who offer hope of good things are the reasonings born of faith which confirm hope for the good things laid up for us; on the other hand, the reasonings of the Adversary would be those who reject better hopes and blunt faith in the things reported."],[0,"Moses considered no report of the opponents trustworthy, but accepted the man who gave a more favorable report of that land."],[267,"Joshua was the one who led the better mission and he made the things reported trustworthy by his own confirmation. When Moses looked at him, he had a steady firm hope for the future, finding proof of that land's abundance in the bunch of grapes which Joshua had carried back on poles. Of course, when you hear of Joshua telling about that land and about a bunch of grapes hanging on the wood, you perceive what it is that he sees which makes him secure in his hopes."],[268,"What is the bunch of grapes suspended from the wood but that bunch suspended from the wood in the last days, whose blood becomes a saving drink for those who believe? Moses spoke to us of this ahead of time when he said in a figure: They drank the blood of the grape. By this he signifies the saving passion."]],"id":"b2-23","r":[264,268],"w":349,"x":[{"k":"s","p":0,"i":0,"a":12,"t":463.3,"x":"Let us proceed. When the natural enemy of men found no occasion to harm Moses, he directed the battle against those more vulnerable."},{"k":"s","p":0,"i":1,"a":12,"t":473.0,"x":"When the lust of gluttony had been thrown at the people like a dart, he caused in them a desire for the things of Egypt so that they preferred the meat eaten by the Egyptians to the bread of heaven."},{"k":"c","a":12,"t":484.0,"e":583.5,"l":[[484.0,"So in this particular case, this refers to the grumbling among the Israelites against Moses, saying, we miss the meat that we were accustomed to eating in Egypt."],[498.0,"We would rather have had the meat."],[501.0,"Why did you bring us out here?"],[503.0,"So we would die of starvation."],[505.0,"And who wants this manna?"],[506.0,"You know, we want meat."],[507.0,"And that's when quail came to the camp and started falling from the sky upon them so that they can eat the meat."],[516.0,"But they were more or less sort of going back in their mind to the meat that the Egyptians ate customarily."],[525.0,"And now, quite interesting, many centuries later, when St. Mary of Egypt was also dwelling in the desert for sort of her life of cleansing, the first 17 years of her battle with the enemy actually included the memory of the Egyptian food, sort of the memory of the meat and the wine and so on, which was, of course, the hope of the enemy that she would be inclined to go back to her sinful life because she wished to taste those things again."],[562.0,"And so we see that the people who were not spiritually mature like Moses, they had actually fallen into sin of murmuring against God, because they didn't have any meat to eat, and so they wanted meat."]]},{"k":"s","p":1,"i":0,"a":12,"t":582.0,"x":"But Moses, having an elevated soul and soaring above such lust, was totally devoted to the coming inheritance which had been promised by God to those who departed from Egypt (spiritually understood) and made their way to that land flowing with milk and honey."},{"k":"s","p":1,"i":1,"a":12,"t":597.0,"x":"For this reason he appointed some spies to be teachers of the beauties in that land."},{"k":"c","a":12,"t":602.0,"e":626.5,"l":[[602.0,"So we know that Moses."],[604.0,"We know for a fact that Moses sent spies into this, the promised land, so that they would report on the conditions there."],[614.0,"And of course the hope was that they would tell the people that the promised land is so wonderful and so beautiful that the people would want to go in there."],[624.0,"Paragraph 266."]]},{"k":"s","p":2,"i":0,"a":12,"t":625.0,"x":"The spies, in my opinion, are: on the one hand those who offer hope of good things are the reasonings born of faith which confirm hope for the good things laid up for us; on the other hand, the reasonings of the Adversary would be those who reject better hopes and blunt faith in the things reported."},{"k":"s","p":3,"i":0,"a":12,"t":644.0,"x":"Moses considered no report of the opponents trustworthy, but accepted the man who gave a more favorable report of that land."},{"k":"c","a":12,"t":651.0,"e":680.0,"l":[[651.0,"So now we know that of the 12 spies, only two said, we should go and possess the land, and with God's help we will prevail the adversary."],[665.0,"And of course the 10 spies said, no, no, no, this is too much."],[671.0,"This is going to be too complicated."],[674.0,"We cannot possess the land."],[677.0,"Paragraph 267."]]},{"k":"s","p":4,"i":0,"a":12,"t":679.0,"x":"Joshua was the one who led the better mission and he made the things reported trustworthy by his own confirmation."},{"k":"s","p":4,"i":1,"a":12,"t":685.0,"x":"When Moses looked at him, he had a steady firm hope for the future, finding proof of that land's abundance in the bunch of grapes which Joshua had carried back on poles."},{"k":"s","p":4,"i":2,"a":12,"t":696.0,"x":"Of course, when you hear of Joshua telling about that land and about a bunch of grapes hanging on the wood, you perceive what it is that he sees which makes him secure in his hopes."},{"k":"c","a":12,"t":706.0,"e":758.5,"l":[[706.0,"So the grapes were so big that actually two men had to carry a stick on their shoulders with the bunch of grapes sort of hanging on that stick."],[718.0,"And of course it's quite interesting that the name Joshua of course is the same as the name Jesus in English language."],[726.0,"There's a difference."],[727.0,"I'm not sure about the Greek and Church Slavonic for sure."],[730.0,"Both our Lord and Joshua, the son of Nun are called Esus."],[735.0,"And of course the fact that it was Joshua who brought the grapes."],[741.0,"And of course the grapes of."],[742.0,"Are used."],[744.0,"The."],[744.0,"The wine made from grapes is used for the Lord's blood in the sacrament of the Holy Communion."],[750.0,"I think that's."],[751.0,"That's That's a very significant moment here."],[756.0,"Paragraph 268."]]},{"k":"s","p":5,"i":0,"a":12,"t":757.0,"x":"What is the bunch of grapes suspended from the wood but that bunch suspended from the wood in the last days, whose blood becomes a saving drink for those who believe?"},{"k":"s","p":5,"i":1,"a":12,"t":769.0,"x":"Moses spoke to us of this ahead of time when he said in a figure:"},{"k":"s","p":5,"i":2,"a":12,"t":773.1,"x":"They drank the blood of the grape."},{"k":"s","p":5,"i":3,"a":12,"t":775.0,"x":"By this he signifies the saving passion."},{"k":"c","a":12,"t":778.0,"e":804.0,"l":[[778.0,"Well, that's quite interesting."],[779.0,"Yes."],[779.0,"So they."],[781.0,"If he said they drank the blood of the grape."],[783.0,"Yes."],[783.0,"Well, you know, of course, then the grape is Christ."],[787.0,"So Joshua, the son of nun on a stick, you know, sort of on wood, on the cross, brings the grape and then they drank the blood of the grape."],[796.0,"That's."],[796.0,"That's quite nice."],[797.0,"Very nice."],[799.0,"The next chapter is titled the Brazen Serpent."],[802.0,"Paragraph"]]}]},{"t":"The Brazen Serpent","p":[[269,"Again the way led through the desert, and the people lost hope in the good things promised and were reduced to thirst. Moses again made water flow in the desert for them. When it is perceived spiritually, this account teaches us what the mystery of repentance is. Those who turn to the stomach, the flesh, and the Egyptian pleasures, after having once tasted the rock, are sentenced to be excluded from partaking in good things."],[270,"But they can by repentance again find the rock which they abandoned and again open the spring of water for themselves and again take their fill. The rock gives forth water to Moses who believed that Joshua's spying is truer than his opponents', Moses who looked to the bunch of grapes which for our sakes was suspended and shed blood, and Moses who by the wood prepared water to gush from the rock again for them."],[271,"But the people had not yet learned to keep in step with Moses' greatness. They were still drawn down to the slavish passions and were inclined to the Egyptian pleasures. The history shows by this that human nature is especially drawn to this passion, being led to the disease along thousands of ways."],[272,"As a physician by his treatment prevents a disease from prevailing, so Moses does not permit the disease to cause death. Their unruly desires produced serpents which injected deadly poison into those they bit. The great lawgiver, however, rendered the real serpents powerless by the image of a serpent."],[273,"This would be an appropriate time to explain the figure. There is one antidote for these evil passions: the purification of our souls which takes place through the mystery of godliness. The chief act of faith in the \"mystery\" is to look to him who suffered the passion for us. The cross is the passion, so that whoever looks to it, as the text relates, is not harmed by the poison of desire."],[274,"To look to the cross means to render one's whole life dead and crucified to the world, unmoved by evil. Truly it is as the prophet says: \"They nail their own flesh with the fear of God.\" The nail would be the self-control that holds the flesh."],[275,"Since therefore unruly desires brought forth the deadly serpents from the earth (for every offspring of evil desire is a serpent), the Law prefigures for us what is clear in the wood. This figure is a likeness of a serpent and not a serpent itself, as the great Paul himself says, in the likeness of sinful flesh. Sin is the real serpent, and whoever deserts to sin takes on the nature of the serpent."],[276,"Man, then, is freed from sin through him who assumed the form of sin and became like us who had turned into the form of the serpent. He keeps the bites from causing death, but the beasts themselves are not destroyed. By beasts I mean desires. For although the evil of death which follows sins does not prevail against those who look to the cross, the lust of flesh against spirit has not completely ceased to exist."],[277,"In fact, the gnawings of desire are frequently active even in the faithful. Nevertheless, the person who looks to the One lifted up on the wood rejects passion, diluting the poison with the fear of the commandment as with a medicine. The voice of the Lord teaches clearly that the serpent lifted up in the desert is a symbol of the mystery of the cross when he says, The Son of Man must be lifted up as Moses lifted up the serpent in the desert."]],"id":"b2-24","r":[269,277],"w":609,"x":[{"k":"s","p":0,"i":0,"a":12,"t":803.0,"x":"Again the way led through the desert, and the people lost hope in the good things promised and were reduced to thirst."},{"k":"s","p":0,"i":1,"a":12,"t":812.0,"x":"Moses again made water flow in the desert for them."},{"k":"s","p":0,"i":2,"a":12,"t":815.0,"x":"When it is perceived spiritually, this account teaches us what the mystery of repentance is."},{"k":"s","p":0,"i":3,"a":12,"t":823.1,"x":"Those who turn to the stomach, the flesh, and the Egyptian pleasures, after having once tasted the rock, are sentenced to be excluded from partaking in good things."},{"k":"c","a":12,"t":833.0,"e":873.0,"l":[[833.0,"So since they had initially been able to drink the water flowing from the rock, and the rock, of course, is the image of Christ, because the Ra giving them water in the desert."],[848.0,"Well, of course, yes, is a sort of a foreshadow of Christ."],[853.0,"And now that they had after that murmured against manna and were not happy to to eat the manna, but required meat, of course, they are considered to be unworthy."],[870.0,"Paragraph 270."]]},{"k":"s","p":1,"i":0,"a":12,"t":872.0,"x":"But they can by repentance again find the rock which they abandoned and again open the spring of water for themselves and again take their fill."},{"k":"c","a":12,"t":880.0,"e":889.5,"l":[[880.0,"Because there was the second second rock, second time that they got water from a rock."]]},{"k":"s","p":1,"i":1,"a":12,"t":888.0,"x":"The rock gives forth water to Moses who believed that Joshua's spying is truer than his opponents', Moses who looked to the bunch of grapes which for our sakes was suspended and shed blood, and Moses who by the wood prepared water to gush from the rock again for them."},{"k":"s","p":2,"i":0,"a":12,"t":908.0,"x":"But the people had not yet learned to keep in step with Moses' greatness."},{"k":"s","p":2,"i":1,"a":12,"t":912.0,"x":"They were still drawn down to the slavish passions and were inclined to the Egyptian pleasures."},{"k":"s","p":2,"i":2,"a":12,"t":917.0,"x":"The history shows by this that human nature is especially drawn to this passion, being led to the disease along thousands of ways."},{"k":"c","a":12,"t":926.0,"e":957.0,"l":[[926.0,"Now, I'm not sure exactly what he's speaking, so let's keep on reading."],[931.0,"Although I I wonder why he is not mentioning the fact that when they drank water from the rock the second time, Moses was commanded this time not to strike the rock, but just to speak to the rock."],[944.0,"But they angered Moses so much, and he was provoked that he struck the rock."],[948.0,"And of course for that reason the Lord told him that he disrupted, disobeyed him, and he did not enter the promised land."],[954.0,"Paragraph 272."]]},{"k":"s","p":3,"i":0,"a":12,"t":956.0,"x":"As a physician by his treatment prevents a disease from prevailing, so Moses does not permit the disease to cause death."},{"k":"s","p":3,"i":1,"a":12,"t":963.0,"x":"Their unruly desires produced serpents which injected deadly poison into those they bit."},{"k":"s","p":3,"i":2,"a":12,"t":968.0,"x":"The great lawgiver, however, rendered the real serpents powerless by the image of a serpent."},{"k":"s","p":4,"i":0,"a":12,"t":976.0,"x":"This would be an appropriate time to explain the figure."},{"k":"s","p":4,"i":1,"a":12,"t":978.0,"x":"There is one antidote for these evil passions: the purification of our souls which takes place through the mystery of godliness."},{"k":"s","p":4,"i":2,"a":12,"t":986.0,"x":"The chief act of faith in the \"mystery\" is to look to him who suffered the passion for us."},{"k":"s","p":4,"i":3,"a":12,"t":992.0,"x":"The cross is the passion, so that whoever looks to it, as the text relates, is not harmed by the poison of desire."},{"k":"c","a":12,"t":1000.0,"e":1045.4,"l":[[1000.0,"So we know that when the snakes bit the Israelites, they died."],[1005.0,"And Moses once again, rather than rejoicing in their punishment and saying, you know, you got what you deserve, he prayed for them, he felt sorry for his kinsmen, he entreated God to have mercy on them."],[1020.0,"And of course God told him to make a brazen serpent."],[1024.0,"And the serpent was put on a stick and lifted up."],[1030.0,"And so whoever was bitten by a snake, if he only looked at the serpent, he would not die."],[1037.0,"So this, and of course St. Gregory gives us a spiritual understanding of that."],
