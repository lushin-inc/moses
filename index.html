own life, did not simply bring his creation to an end but he placed the finishing touch on his work."},{"k":"s","p":9,"i":0,"a":13,"t":1258.0,"x":"What does the history say about this?"},{"k":"s","p":9,"i":1,"a":13,"t":1261.0,"x":"That Moses the servant of Yahweh died as Yahweh decreed, and no one has ever found his grave, his eyes were undimmed, and his face unimpaired."},{"k":"s","p":9,"i":2,"a":13,"t":1274.0,"x":"From this we learn that, when one has accomplished such noble actions, he is considered worthy of this sublime name, to be called servant of Yahweh, which is the same as saying that he is better than all others."},{"k":"s","p":9,"i":3,"a":13,"t":1288.0,"x":"For one would not serve God unless he had become superior to everyone in the world."},{"k":"s","p":9,"i":4,"a":13,"t":1294.0,"x":"This for him is the end of the virtuous life, an end wrought by the word of God."},{"k":"s","p":9,"i":5,"a":13,"t":1299.0,"x":"History speaks of \"death,\" a living death, which is not followed by the grave, or fills the tomb, or brings dimness to the eyes and aging to the person."},{"k":"s","p":10,"i":0,"a":13,"t":1313.0,"x":"What then are we taught through what has been said?"},{"k":"s","p":10,"i":1,"a":13,"t":1316.7,"x":"To have but one purpose in life: to be called servants of God by virtue of the lives we live."},{"k":"s","p":10,"i":2,"a":13,"t":1323.4,"x":"For when you conquer all enemies (the Egyptian, the Amalekite, the Idumaean, the Midianite), cross the water, are enlightened by the cloud, are sweetened by the wood, drink from the rock, taste of the food from above, make your ascent up the mountain through purity and sanctity; and when you arrive there, you are instructed in the divine mystery by the sound of the trumpets, and in the impenetrable darkness draw near to God by your faith, and there are taught the mysteries of the tabernacle and the dignity of the priesthood."},{"k":"s","p":11,"i":0,"a":13,"t":1359.0,"x":"And when you, as a sculptor, carve in your own heart the divine oracles which you receive from God; and when you destroy the golden idol (that is, if you wipe from your life the desire of covetousness); and when you are elevated to such heights that you appear invincible to the magic of Balaam (by \"magic\" you will perceive the crafty deceit of this life through which men drugged as though by some philtre of Circe are changed into the form of irrational animals and leave their proper nature); and when you come through all these things, and the staff of the priesthood blossoms in you, drawing no moisture at all from the earth but having its own unique power for producing fruit (that is the nut whose first taste is bitter and tough but whose inside is sweet and edible); when you destroy everything which opposes your worth, as Dathan was swallowed in the earth and Core was consumed by the fire—then you will draw near to the goal."},{"k":"s","p":12,"i":0,"a":13,"t":1418.9,"x":"I mean by \"goal\" that for the sake of which everything is done, for example:"},{"k":"s","p":12,"i":1,"a":13,"t":1426.7,"x":"The goal of agriculture is the enjoyment of its fruits; the goal of building a house is living in it; the goal of commerce is wealth; and the goal of striving in contests is the prize."},{"k":"s","p":12,"i":2,"a":13,"t":1440.0,"x":"In the same way, too, the goal of the sublime way of life is being called a servant of God."},{"k":"s","p":12,"i":3,"a":13,"t":1446.0,"x":"Along with this honor is contemplated an end which is not covered by a tomb; it refers to the life lived simply and free from evil appendages."},{"k":"s","p":13,"i":0,"a":13,"t":1458.0,"x":"Scripture describes another characteristic of this service to God:"},{"k":"s","p":13,"i":1,"a":13,"t":1463.0,"x":"The eye is not dimmed nor does the person age."},{"k":"s","p":13,"i":2,"a":13,"t":1466.0,"x":"For how can an eye which is always in the light be dimmed by the darkness from which it is always separated?"},{"k":"s","p":13,"i":3,"a":13,"t":1473.0,"x":"And the person who by every means achieves incorruption in his whole life admits no corruption in himself."},{"k":"s","p":13,"i":4,"a":13,"t":1480.0,"x":"For he who has truly come to be in the image of God and who has in no way turned aside from the divine character bears in himself its distinguishing marks and shows in all things his conformity to the archetype; he beautifies his own soul with what is incorruptible, unchangeable, and shares in no evil at all."}]},{"t":"Conclusion","p":[[319,"These things concerning the perfection of the virtuous life, O Caesarius, man of God, we have briefly written for you, tracing in outline like a pattern of beauty the life of the great Moses so that each one of us might copy the image of the beauty which has been shown to us by imitating his way of life. What more trustworthy witness of the fact that Moses did attain the perfection which was possible would be found than the divine voice which said to him: I have known you more than all others? It is also shown in the fact that he is named the \"friend of God\" by God himself, and by preferring to perish with all the rest if the Divine One did not through his good will forgive their errors, he stayed God's wrath against the Israelites. God averted judgment so as not to grieve his friend. All such things are a clear testimony and demonstration of the fact that the life of Moses did ascend the highest mount of perfection."],[320,"Since the goal of the virtuous way of life was the very thing we have been seeking, and this goal has been found in what we have said, it is time for you, noble friend, to look to that example and, by transferring to your own life what is contemplated through spiritual interpretation of the things spoken literally, to be known by God and to become his friend. This is true perfection: not to avoid a wicked life because like slaves we servilely fear punishment, nor to do good because we hope for rewards, as if cashing in on the virtuous life by some business-like and contractual arrangement. On the contrary, disregarding all those things for which we hope and which have been reserved by promise, we regard falling from God's friendship as the only thing dreadful and we consider becoming God's friend the only thing worthy of honor and desire. This, as I have said, is the perfection of life."],[321,"As your understanding is lifted up to what is magnificent and divine, whatever you may find (and I know full well that you will find many things) will most certainly be for the common benefit in Christ Jesus. Amen."]],"id":"b2-29","r":[319,321],"w":375,"x":[{"k":"s","p":0,"i":0,"a":13,"t":1506.1,"x":"These things concerning the perfection of the virtuous life, O Caesarius, man of God, we have briefly written for you, tracing in outline like a pattern of beauty the life of the great Moses so that each one of us might copy the image of the beauty which has been shown to us by imitating his way of life."},{"k":"s","p":0,"i":1,"a":13,"t":1528.0,"x":"What more trustworthy witness of the fact that Moses did attain the perfection which was possible would be found than the divine voice which said to him:"},{"k":"s","p":0,"i":2,"a":13,"t":1537.3,"x":"I have known you more than all others?"},{"k":"s","p":0,"i":3,"a":13,"t":1540.0,"x":"It is also shown in the fact that he is named the \"friend of God\" by God himself, and by preferring to perish with all the rest if the Divine One did not through his good will forgive their errors, he stayed God's wrath against the Israelites."},{"k":"s","p":0,"i":4,"a":13,"t":1559.0,"x":"God averted judgment so as not to grieve his friend."},{"k":"s","p":0,"i":5,"a":13,"t":1561.7,"x":"All such things are a clear testimony and demonstration of the fact that the life of Moses did ascend the highest mount of perfection."},{"k":"c","a":13,"t":1574.0,"e":1870.0,"l":[[1574.0,"Now, this is quite interesting, I think, because when St. Gregory says this, you know that Moses became a friend of God."],[1585.0,"Even if we have a difficult time understanding some of the things that we read and sort of discussed this book, the very fact that we are given an image of being a friend, what is it like to be someone's friend?"],[1604.0,"I think that we all know a good friend when we have one, or perhaps maybe when we lack one."],[1614.0,"We know what a good friend would do in many of life's circumstances."],[1620.0,"And we know very well when we are being good friends to our friends, or maybe sort of shabby, not such good friends."],[1630.0,"Now, if anything, that alone is enough of an indication that we could take away from this book and say, okay, if Moses truly became the friend of God and was able to do such great things, can we follow in his footsteps and also become God's friends?"],[1650.0,"Now, in this particular case, I think what I'm saying is not friends in terms of a familiar and sort of loose and frivolous relation."],[1669.0,"Think of it this way."],[1673.0,"Moses, and this is what St. Gregory is saying."],[1677.0,"Moses, by all of his achievements, by all of his struggles, by his very way of life, made God his friend."],[1690.0,"You might say that he earned God's friendship."],[1694.0,"Now, when we decide for ourselves that someone is worthy of being a friend, someone is worthy of sort of working hard to earn someone's friendship, when we put our mind to that, when we make an effort to gain someone as a friend, we would never be familiar."],[1722.0,"We would never behave in a way that would be in any way uncomely."],[1728.0,"Quite the contrary."],[1728.0,"We would try our best to please the individual whom we want to befriend, because we would realize perhaps that the friendship would then offer us certain benefits."],[1743.0,"And I think that in this particular case, most definitely, the holy prophet Moses received a tremendous amount of benefits, benefits from his friendship with God."],[1757.0,"And St. Gregory saying that the very fact that God did not destroy the Israelite people who tempted him and provoked him and angered him tremendously in the short period of time since they left Egypt."],[1774.0,"Because think of it this way, this they'd angered God enough even before God told them that they would have to sort of wander in the desert for 40 years."],[1790.0,"I don't believe at that time God wanted to Destroy them."],[1794.0,"I'm not sure."],[1795.0,"I would have to sort of look closer at the actual text of the Scripture."],[1802.0,"But obviously during the period of 40 years of wandering, they had done many other things."],[1808.0,"And among those things, something was bad enough for God to say, I will wipe them out."],[1815.0,"I'm done with them."],[1817.0,"Enough."],[1818.0,"And that's when Moses said, no, please, if you would wipe them out, then of course wipe me out as well."],[1824.0,"Then erase, eradicate my name from the book of life as well."],[1829.0,"And God said no, because he didn't want to do that to Moses."],[1834.0,"So Moses, friendship with God did indeed allow Moses to be sort of a small letter s. Savior to his people."],[1845.0,"Not only because he led them out of Egypt and saved them from slavery to Pharaoh, he also saved them from the fair and dreadful punishment of God, who wanted to wipe them out."],[1858.0,"That."],[1858.0,"That is worth noting."],[1861.0,"Paragraph 320."],[1866.0,"Now, my."],[1866.0,"I hope I'm not repeating myself."],[1868.0,"No."]]},{"k":"s","p":1,"i":0,"a":13,"t":1869.0,"x":"Since the goal of the virtuous way of life was the very thing we have been seeking, and this goal has been found in what we have said, it is time for you, noble friend, to look to that example and, by transferring to your own life what is contemplated through spiritual interpretation of the things spoken literally, to be known by God and to become his friend."},{"k":"s","p":1,"i":1,"a":13,"t":1892.0,"x":"This is true perfection: not to avoid a wicked life because like slaves we servilely fear punishment, nor to do good because we hope for rewards, as if cashing in on the virtuous life by some business-like and contractual arrangement."},{"k":"c","a":13,"t":1901.0,"e":1924.0,"l":[[1901.0,"I guess it's sort of."],[1910.0,"I can't fathom why someone translated that word in such a way, but because like slaves, we with an attitude sort of, that is servile,"]]},{"k":"s","p":1,"i":2,"a":13,"t":1935.0,"x":"On the contrary, disregarding all those things for which we hope and which have been reserved by promise, we regard falling from God's friendship as the only thing dreadful and we consider becoming God's friend the only thing worthy of honor and desire."},{"k":"s","p":1,"i":3,"a":13,"t":1951.0,"x":"This, as I have said, is the perfection of life."},{"k":"c","a":13,"t":1954.0,"e":2059.7,"l":[[1954.0,"And of course, reading that, I can't but think of St. Anthony the Great, who said, I no longer fear God, I love him."],[1967.0,"Or, you know, you could say, I no longer fear God because I love him."],[1972.0,"Well, this is exactly the kind of perfection that St. Gregory is urging his friend Caesarius, I guess, to whom he addressed this book."],[1983.0,"And that's definitely something that we should strive for."],[1987.0,"The holy fathers talk about three stages of the fear of God."],[1991.0,"First is that sort of servile, slavish kind where People do good things only because they afraid to be punished."],[2003.0,"Second is the quid pro quo, you know, the businesslike and contractual arrangement type of fear of God, where people do certain things with a hope of getting something in return."],[2018.0,"But the ultimate and sort of the best fear of God is when one loves God so much that one fears offending him just because it would hurt the person committing an offense, knowing that the other one was offended."],[2037.0,"And so St. Gregory points us to the same thought, to the same idea that we hear St. Anthony say later on, I no longer fear God because I love Him."],[2049.0,"And love drives away fear."],[2055.0,"The last paragraph in the book, paragraph 3, 21."]]},{"k":"s","p":2,"i":0,"a":13,"t":2058.0,"x":"As your understanding is lifted up to what is magnificent and divine, whatever you may find (and I know full well that you will find many things) will most certainly be for the common benefit in Christ Jesus."},{"k":"s","p":2,"i":1,"a":13,"t":2071.0,"x":"Amen."},{"k":"c","a":13,"t":2074.0,"e":2367.7,"l":[[2074.0,"So I think that what he's saying here in this particular case is that as this friend Caesarius would read something that's uplifting and magnificent and divine, then of course it will be for the common benefit in Christ."],[2094.0,"And hopefully that will be the same for us as we complete this book."],[2101.0,"I would like very much to thank the gentleman."],[2106.0,"I'm not sure if I should say the name in the translation, so perhaps unless I'm given the express permission, I won't mention the name right away."],[2115.0,"But the one viewer on this channel, this channel who actually took my request seriously and offered this book to be read and provided me with a text, I'm most grateful to and I think it's been a tremendous benefit to all of us."],[2135.0,"May God bless us and, and protect us."],[2138.0,"By the prayers of St. Gregory, I hope that we will continue to read more good and beneficial books."],[2147.0,"I have gotten, I think at least four suggestions."],[2153.0,"I could take a very quick look."],[2156.0,"I think I should be able to find it."],[2159.0,"Unfortunately, what happens with email is that it."],[2162.0,"It very quickly piles up."],[2167.0,"So here we go."],[2168.0,"Yes."],[2169.0,"The latest books suggested were My Life in Christ, the Spiritual Meadow Testimonies and Experiences of Elder Porphyrius, and Let's see."],[2187.0,"And Wounded by Love."],[2189.0,"It's the book by Elder Porphyrius as well."],[2194.0,"So what I think we'll do, if that's okay, let's pray and see where God leads us."],[2202.0,"I even thought about casting lots."],[2205.0,"Having these four texts available is."],[2207.0,"Is very lovely."],[2209.0,"I also have a number of books in English that are printed that I could use sort of as."],[2217.0,"As a paper book and that might be nice."],[2220.0,"I'll."],[2220.0,"I'll see."],[2222.0,"I was thinking about Elders Barsanufius and John, their response, responses, their answers to sort of questions on spiritual life."],[2230.0,"And also I have a nice volume of the writings and the teachings of St. Mark and the book says St. Mark the monk."],[2241.0,"I think also he's known as St. Mark the ascetic."],[2246.0,"I think, yeah, probably both titles are used and I think, think St. Mark is included in Philokalea."],[2256.0,"So I have his writings in a separate volume."],[2259.0,"It's, it's a nice book."],[2261.0,"Unfortunately it's in another room."],[2263.0,"So in order not to get up from the, from the camera, I won't go and get it right now, but I might consider reading that."],[2271.0,"And if the gentleman who made the suggestions, if he is watching now and he hears what I have available and wants to sort of give some input, I would be most grateful."],[2286.0,"So feel free to email or, or, or you know, otherwise comment and let me know what you think would work."],[2295.0,"But I think one of those books would be quite useful."],[2299.0,"I'm profoundly grateful to everyone for the support and of course for the prayers."],[2308.0,"I think if it's okay today we are stopping just a little early, but let us pray and I will let everyone go."],[2318.0,"We will pray and hopefully we will announce what we will read next, next week, God willing."],[2325.0,"It is truly mean to bless thee, the Theotokos, ever blessed and most blameless and mother of our God, more honorable than the cherubim and beyond compare, more glorious than the Sara of him who without corruption gave his birth to God the Word, the very Theotoka Sadhidu we magnify."],[2348.0,"Please pray for me as I make these decisions, the wonderful decisions about what to read."],[2354.0,"And God willing, we will continue to grow together spiritually and in many other ways as well."],[2361.0,"God willing."],[2362.0,"God bless you all."],[2363.0,"Please keep me a sinner in your prayers."]]}]}]}]</script>
<script type="application/json" id="talk">{"paras":[{"t":1,"ad":false,"x":"Now I'm going to talk to you. I'm going to talk to you about a book by St. Gregory of Nyssa. It's called the Life of Moses. And there's. I checked it out. There's a few copies of it back there. If you have never read this book, you really have to read this book. The theme of the conference is encountering God. And I have to be honest, when I was exploring Orthodoxy, when I was a catechumen, just trying to figure, figuring things out when I read St. Gregory's book, I mean, coming from a Protestant background, having all the Bible stories just, you know, really deeply in my memory, reading St. Gregory's book is just. Was like constant lightning bolt. I was just reading the book and just couldn't believe it. He was just connecting everything together and making everything just make so much sense."},{"t":53,"ad":false,"x":"And so what I was hoping to do, and I've never done this before, is that as I continued my life, as I continued as I converted, as I explored iconography, as I explored other writers, I would just always come back in the back of my mind. I realized that I had this program running in the back of my mind, and it was basically St. Gregory's book. And it just informs. Yesterday I told you about, talked about patterns and stories and this book, what St. Gregory does is the pattern is there in the scripture, but what St. Gregory does is the way he speaks about things and the analogies that he threads together. He just shows it to you. So what I'm going to try to do today is I'm going to try to take you on that journey."},{"t":103,"ad":false,"x":"I'm going to try to trace the basic pattern in St. Gregory's book. Now, his book is extremely expansive. He talks about a lot of things I could never. You can't, I couldn't capture it all here, but I'm going to trace of the basic pattern about, of what's in there. And hopefully it will help people understand, first of all, what I'm talking about when I talk about these patterns. And then as everybody here has, we all have the experience of the liturgy, the experience of Scripture. Hopefully it will. It will spark some of your intuitions to kind of start to see those connections. I mean, everybody has already seen them, but hopefully it will be a part of, to help you to get through that experience."},{"t":152,"ad":false,"x":"So the idea is that in St. Gregory's book or in the Scripture and everything, he traces a pattern of the world, basically a pattern of the cosmos. And when I talk about a pattern or a map of the world. We're not talking about the kind of map that you get on Google Maps or, you know, like a physical map, but it's a map of meanings that are threaded together. And really what it is, it's a map of our own journey. It's a map of our ascent up the ladder, of divine ascent. Because the story in St. Gregory's book, the basic structure of his story, is he traces the life of Moses as he ascends up the mountain. And this ascent up the mountain is basically the same as what we're seeing in this icon of the ascent up the holy ladder."},{"t":211,"ad":false,"x":"And so going up the mountain is the gradual. Is this gradual ascent towards divinity, but at the same time, it's our participation in the church. If you look at the icon that's up now, you can see that. You can see that the beginning of the ladder is the church. And then through the church and up the ladder, we move up towards this divine encounter which we find at the top of the ladder. And so in St. Gregory, what he does is he connects all these things together. So the base of the mountain that Moses is going to ascend, what he does is he gives us these images of what the base of the mountain looks like or what it looks like before we begin the journey, before we enter onto the journey."},{"t":261,"ad":false,"x":"And the images that he uses are all these images of flesh, these images of all the things that are outside our nature, all these things that are added to our nature, the things that are foreign to us. And the basic image that he threads through is these image of the garments of skin. When Adam and Eve fell in the garden, what God gave them as they were chased away from the garden, were these garments of skin around them, these garments of dead animal skins. And that's like the. That's the basic image that St. Gregory uses as the bottom of the. Of the mountain. So here's. This is going to be our mountain people. It's going to be very simple. I'm not an artist today. I'm just a speaker. And so the bottom of the mountain. Told you. Is the garments of skin. But it's also."},{"t":318,"ad":false,"x":"We could. We could say that it's the narthex, okay? So it's the place where the church ends and the world begins. So the bottom of the mountain is what Gregory calls, quote, the feet of the soul. And it's the passionate and appetitive parts of our soul. It's where our appetites, our passions are located in the human soul. And so the top of the mountain is the place where we encounter God. So it's the intellect, it's the higher part of the soul, where we're capable of grasping the nature of things. But at the same time, because the bottom of the soul, the bottom of the mountain, is the nartex, then the top of the mountain also appears as the sanctuary. And as we talked about yesterday, beyond the sanctuary, in the highest place of our being, that's where we encounter this divine tabernacle. That's where."},{"t":384,"ad":false,"x":"That's where Moses received the pattern of the divine tabernacle. And the divine tabernacle, as St. Gregory told us, that's Christ himself, okay? It's Christ as the universal origin and container of all things. So that's the basic pattern already giving you, like, just the basic pattern that St. Gregory traces in the book. And what it does is it joins. If you look at the elements already there, it joins the personal to the communal. So it's a body, but it's a community as the church. And then ultimately, it's all it leads us up to what is the most, to the highest, to the spiritual and to the uncreated."},{"t":430,"ad":false,"x":"And so when I'm, as you see, what I'm starting to do, and this is what I'm going to be doing, is that I'm going to use St. Gregory's words, and I'm actually going to create a visual map of what he is, of the journey that he's bringing us on. And at the end, you'll see why I'm doing that. Now, the first thing, the first important thing as we do this, as we look at the elements that St. Gregory brings together, and this is a rule, I think, for all our interpretations of symbols in the Bible or in the Liturgy, is that symbols are not moral things. That is, the elements that we find in the liturgy or the elements that we find in the Bible, they're neither. They're not necessarily good or bad, the things in themselves. So they're places of meaning."},{"t":481,"ad":false,"x":"You could say, okay, so what's important on this map of meaning isn't so much where the thing is on the map, but which direction is it pointing to. So if you think back at that ladder of divine ascent, it doesn't matter how high you are on the ladder, if you're falling down. If you're at the bottom of the ladder, but you're going up, you're in a much better place than that person at the top who's falling down. And so everything in this map of meaning has a Dual possibility. We could say it could have a light side or a dark side. And so because we're talking about a trip, I'm going to start with the actual movement of the trip. And in the movement of the mountain, there's two possibilities, right? He can go up or he can come down."},{"t":531,"ad":false,"x":"And in St. Gregory's description of this, it's actually. It's very. It's really interesting because he shows us this duality, how the same thing can have a light and a dark side. And so the way he does is he talks about Aaron's. About Moses's brother Aaron. Okay? So I hope everybody knows the story of Moses, because I'm not going to go through too much of the details of the actual story. But Aaron was Moses brother, and God chose Aaron to be Moses helper. So the way St. Gregory interprets that is he says that Aaron is akin is analogical to our guardian angel, that angel that God places with us to counsel us, to entice us into making that ascent up the divine ladder, up the mountain. And the angel does this through reasonable thoughts and through encouragement."},{"t":588,"ad":false,"x":"But if you know the story of Moses, you know that Aaron is also the one who made the golden calf, right? And who brought the. Brought Israel to engage in licentiousness and idolatry. So how do we reconcile those two things so well, Gregory tells us a secret. He tells us that, quote, there is a doctrine which derives its trustworthiness from the tradition of the Fathers, which says that after our nature fell into sin, God did not disregard our fall and withhold his providence. No, on the one hand, he appointed angel with an incorporeal nature to help in the life of each person. And on the other hand, he also appointed a corrupter who by an evil and maleficent demon, afflicts the life of man and contrives against our nature. Okay, so what are we talking about?"},{"t":646,"ad":false,"x":"I think most people here would know what he's referring to. And what he's referring to is this. And I think. I mean, the faster that we just reconcile ourselves with the fact that this is what he's talking about the best, because the imagery might seem silly on a first reading, but it's only silly if we're materialists who think that angels are fleshy people with wings and devils have spiky tails. But once we get rid of the materialist blindfold that often entraps us, then we experience this every day of our lives. I mean, anybody who has fought a passion or else given into a passion, then suddenly wakes up and think, like, why did I do that? You know, where does that come from? I mean, everybody knows that we have this fight in us all the time."},{"t":702,"ad":true,"x":"Hello, everyone. We are excited to announce that God's Dog three, that is God's dog Monk, is currently being shipped to the United States. It is set to ship to all of you in October. And so we are offering it in pre sale. And to celebrate, we are also offering up to $25 off if you get the bundle of the books together. We are also offering free shipping in the United States. And so now's the time to get God's dog. The new book will really explode the story if in the past two books we've stayed close to the main characters, now we're going to bring it close to its cosmic place. We're going to see more about the giants, more about the biblical themes of the garments of skin."},{"t":740,"ad":true,"x":"We're going to see the Amazon, the centaurs, and even we'll take a little trip into hell. And so I'm definitely looking forward to seeing what all of you think of this recent book. And so get your books today."},{"t":754,"ad":false,"x":"But if you're struggling with this image, if you find it too difficult to accept, I mean, I've already showed you this image in iconic form at the beginning, it's this one. Look at what's happening on that image. On one side there are the angels encouraging, and on the other side there are the demons bringing down. All right, so the brother who is our counselor, we could call him that little voice in our head, our conscious, whatever you want to call it, can become a vehicle for the angel or the demon, depending on which side the person decides to go. Right."},{"t":800,"ad":false,"x":"Which way we decide to move. So now we've got this notion of movement. So we can start the trip. We can start the trip. St. Gregory starts at the beginning of Moses journey. He starts at the birth of Moses. And as most of you know, when Moses was born, there was a law. Pharaoh made a law because there were too many Israelite children. And the law was that all the male children were to be killed. And so St. Gregory interprets this and he tells us for the material and passionate disposition to which human nature is carried when it falls, is the female form of life whose birth is favored by the tyrant. The austerity and intensity of virtue is the male birth, which is hostile to the tyrant and suspected of insurrection against his rule. So am I in trouble? Yes."},{"t":856,"ad":false,"x":"All right, we've got materiality and passions related to the female form and Austerity and virtue related to the male, okay? So right away, our modern minds are bothered with this, and I can understand that. I totally get it. But we. Just hold that thought, okay? Just hold it just a little bit, okay? Because if you really read that quote, I'm going to make you read it again. If you really read that quote, you'll see that hiding in that quote is actually also the dark side of the masculine, okay? And that's the tyrant, okay? So don't worry. Everything will balance out. You'll see."},{"t":899,"ad":false,"x":"St. Gregory balances everything out. In fact, St. Gregory starts by telling us that Moses, right, that Moses had two mothers, okay? And because in order to protect Moses from the pharaoh, he's placed in a basket. We know the story. Placed in a basket on the Nile and found by an Egyptian princess. So St. Gregory tells us. The daughter of the king, being childless and barren, I think she's rightly perceived as profane philosophy, arranged to be called his mother by adopting the youngster. For truly barren is profane education. So the adoptive mother of Moses is knowledge of the world. It's profane natural philosophy. Today we would say science, technology, all that type of knowledge. And St. Gregory warns us that it can sometimes impede our spiritual journey."},{"t":961,"ad":false,"x":"And this is the foreign princess, but Moses, birth mother, who continued to care for him while he was being raised by the Egyptian. Well, Gregory tells us that it's the church and its teaching. So already now we start to see, right at the beginning, we start to see the other side of the feminine, which is. Which appears. So the feminine is the periphery in the sense of the womb, okay, that which surrounds us. But at the risk of going into cliches, but sometimes cliches are useful. It is both the womb and the tomb, if you will. And so St. Gregory uses the image of a fruitful womb in his natural mother compared to a quote, womb of barren wisdom. So what it is, it's both the church, which contains us, but also the outer world, which is our dissipation, okay?"},{"t":1027,"ad":false,"x":"So two things which surround us. So that's why it is the periphery. It's both the church, which contains us, and the outer world, which is our dissipation. So if we. If we continue with this idea of periphery, We've already talked about the foreign princess. And so what Gregory develops is this idea of the foreign. Is this idea of the foreign as this outside thing. So Gregory develops this whole idea that the subjugation of the Israelites to the Egyptians in the book of Exodus is an image of the subjugation of the human person to what is added or exterior to our nature. It could be the tyranny of our flesh, our desires. But it could also be these foreign. Foreign knowledge, foreign education, all these things which are on the outside, which. Which can trap us."},{"t":1097,"ad":false,"x":"So when Moses grows up, we know this story as well. He suddenly feels this attachment to Hebrews, to his own people who are slaves in Egypt. And one day, Moses kills an Egyptian who he sees abusing an Israelite. Quote. Moses teaches us by his own example to take our stand with virtue as with a kinsman, and to kill virtue's adversary. The victory of true religion is the death and destruction of idolatry. So slavery to foreign elements, idolatry being the best example of them, can appear like we've seen, as tyranny, as the Pharaoh who imposes himself on us. But it can also appear  must be removed from the feet of the soul. But even this removal finds a surprising duality in St. Gregory. Because when St. Gregory describes the burning bush, he insists on the fact that the burning bush was a thorn bush. And he says it few times for you to really notice that it's not just a bush, it's a thorn bush. Now, why. Well, why would he insist on the fact that it's a thorn bush?"},{"t":1475,"ad":false,"x":"Moses on that occasion attained to this knowledge of true Being so now does everyone who, like him, divest himself of the earthly coverings and look to the light shining from the bramble bush, that is, to the radiance which shines upon us through this thorny flesh, which, as the Gospel says, the truth is that. And which is, as the Gospel says, the true light and the truth itself. So think about that quote for a minute. In the book of Genesis, one of the consequences of the fall of Adam and Eve is that creation is going to produce thorns. And that's the hostility of creation appears in the image of thorns. And, and the garments of skin which God gives to Adam are meant to protect them from the consequence of that fall. And the image of which is those thorns on the bushes."},{"t":1531,"ad":false,"x":"But here, just as Moses removes that outer fleshy covering of skin which is the consequence of the fall, where does he see the light? He sees the light coming through the thorn bush. And as St. Gregory says, himself coming through the thorny flesh. So St. Gregory always preserves those two things. All the removals will come back and you'll see. It's an amazing thing to watch. And this question of the periphery of the bottom of the mountain comes to its limit, which is chaos, complete chaos. And Gregory uses this image of clay, this chaos. So what he does is he connects the slavery of the Israelites in the foreign land to what they're doing in the foreign land. And what are they doing? They're forced to make by a foreigner to make bricks out of clay. Quote."}, iest, who is the only one who can reach all the way into the holy of holies. And so this echoes the actual shape of a mountain. It's the actual shape of the mountain which is large at the base and just moves up to a narrower and narrower summit. Okay, so when we have this image of a mountain in the Bible as this place of."},{"t":1757,"ad":false,"x":"Of epiphany, as this place of encountering God, it's not arbitrary. The fact of mountains is the very experience going up a mountain and reaching the top. And all of a sudden you see the entire world around you. It's the best image of what it means to enter that unity, which is that connection to what unites everything together. And so the movement up the mountain is. Is the movement up this pattern of meaning which I mentioned, and St. Gregory makes a big deal about that. And this movement is up. Both we could say the epistemological and ontological hierarchy of beings. And St. Gregory formulated in a very particular way, he explains that Moses ascent up the mountain is Moses discovery of the true knowledge of being. So by removing the sandals and seeing the light in the bramble bush, he's moving away from dependent beings."},{"t":1820,"ad":false,"x":"So when I say dependent beings, what I mean is everything that's created is dependent on God. But when we see those things as isolated in themselves, and we don't see them as being connected to God, then that's when they become dangerous. That's when they become. St. Gregory calls them a type of falsehood. So as Moses is moving up, he's moving towards being itself, from which dependent beings find their meaning and coherence. And again, that's analogous to the movement up from the multiplicity of the base up to the unity of the summit, the bottom of the mountain is assimilated with darkness. And as Moses goes up, he encounters light and music, the source of visual and auditory meaning. But to enter the divine chamber, the sanctuary, Moses must encounter God in higher darkness, as Father Stephen mentioned yesterday."},{"t":1892,"ad":false,"x":"So, quote, what does it mean that Moses entered the darkness and then saw God in it? What is now recounted seems somehow to be contradictory to the first theophany. For then the divine was beheld in light, but now he is seen in darkness. Let us not think that this is at variance with the sequence of things we have contemplated spiritually. Scripture teaches us by this that religious knowledge comes at first to those who perceive it as light. Therefore, what is perceived to be contrary to religion is darkness. Down there. Oops, sorry, I don't have that map up there anymore. And the escape from the darkness comes about when one participates in the light."},{"t":1934,"ad":false,"x":"But as the mind progresses and through an even greater and more perfect diligence comes to apprehend reality, as it approaches more nearly to contemplation, it sees more clearly what of divine nature is uncontemplated, unquote. And then, as I explained yesterday, even beyond that divine darkness, what does Moses encounter? He encounters the pattern of the tabernacle. Now, the pattern of the tabernacle is extremely fascinating because in its description, we could take that pattern of the tabernacle and we could stretch it out to encompass everything else that we've already seen. Okay, imagine this is the mountain. Now. So in moving out of the world, so to speak, Moses regains the world. So, for example, in its most hidden place, the tabernacle is."},{"t":1993,"ad":false,"x":"Is equivalent to that lonely place where Moses encountered God and the Menorah, that seventh branch candlestick which is in the Holy of Holies, St. Gregory makes equivalent to those rays of light of the Spirit, and also to the pillars of the church. And he talks about the pillar. Sorry, he talks about the pillars of the tabernacle, which are the pillars of the church. Quote. All who themselves support the church and become lights to through their own works are called pillars and lights. And so the saints, of course, but also all of us who participate in the life of the church, we become pillars and lights of the church. You are the light of the world, says the Lord to the apostle, unquote."},{"t":2039,"ad":false,"x":"So this light that he sees in the pattern of the tabernacle is the very light that Moses encountered as he was ascending the mountain. And finally, the biggest mystery of all is that on the edge of the tabernacle, the outer cover of that tabernacle is made of animal skins which are dyed red. And so the beauty is that just like in the burning bush, those dead skins which were removed in the ascent are found again, though transformed. And what were the enslaving passions are now the passion of Christ. And there's even water down there. If you notice, as the people entered into the tabernacle, they had to wash themselves before the entrance. Even if one sees skin dyed red and hair woven, the sequence of contemplation is not broken in this way."},{"t":2094,"ad":false,"x":"For the prophetic eye attaining to a vision of divine things, will see the saving passion there predetermined. It is signified in both the elements mentioned. The redness pointing to blood and. And the hair to death. And St. Gregory tells us that, quote, hair on the body has no feeling, hence it is rightly a symbol of death, unquote. All right, we're starting to get the full image here. One of the things that is encountered by Moses is in the heavenly tabernacle is the pattern of priesthood which is given to Moses. And so this makes this whole pattern, this whole mountain, and analogical to the ecclesiastical hierarchy, which is later elaborated in Dionysian theology. But what's fascinating is that in that section where he talks about attaining priesthood and gaining the pattern of priesthood in the. In the."},{"t":2150,"ad":false,"x":"In the divine tabernacle, he also traces now the dark side of the ascent. I told you, everything has  in all. Now, try to keep this basic pattern in your memory, okay? It shouldn't be so difficult because in theory, the elements here are intuitive. They should make sense to us on a very basic level. Okay, is everybody got it? Now watch. Do you see the pattern? There is light, the outside of the circle. There is darkness, the inner darkness within."},{"t":2340,"ad":false,"x":"And there is the divine tabernacle, not made with hands. There is the mountain, and there in the circle are the sandals removed in order to attain the vision. There is the ascent and the descent of the mountain. And I didn't tell you the positive descent of the mountain, but it also has a positive, because when we descend the mountain, we can be descending it because we're falling, but we can be descending it, bringing the law down to the people. We can be descending, bringing the division of God to the world. Do you see the pattern? There's the divine darkness. There are there are the rays of light, all the pillars of the church, and there is the outer darkness at the bottom. Now, the older versions of this icon didn't use the king cosmos. They actually use the foreigners."},{"t":2400,"ad":false,"x":"So they would put all the different tribes and all the different foreigners represented inside. And usually in the middle, there was a dog headed man who represented that final monster, that final chaos, that frog on the edge of what being is. Now, if you take this and you flip it around and you think of the Tower of Babel, what do you have? You have the same structure making, taking clay, making bricks, and building this false ascent of a tower up to reach to God. And what's the result of that? The creation of foreigners. All right? Do you see the pattern, And I keep asking that. There's the divine darkness, the rays of light. And in this icon, it's not so much as much the bottom. The descent of the mountain is the descent into the mountain."},{"t":2461,"ad":false,"x":"So it's a slight change, but it's the same thing. The cavern becomes this womb, this tomb, at the same time. And so there's the mother, and there's the tomb on which Christ is laid. There are the animals next to Christ, which represent those garments of skins. There are the two foreigners, the helpful foreigner who come to serve Christ, and the harmful foreigner who comes to tempt Joseph. And down there, just to make sure, there's the water. Got to have the water down there. I'm going to show you one last one. But I. I could have 25 here. I'm going to show you one last one. All right. Can you see the pattern? There's the divine darkness. There's the light. There's. There's the tabernacle. The angels ascend one side, the demons descend on the other. The saints are the pillars."},{"t":2522,"ad":false,"x":"They are the lights of the church. And in this one particular one, it is an amazing vision of the womb one side, which is paradise and the church and theotokos. And on the other side, there is the grave. You see that? You see that circle with those strange brown that are. Those are the dead coming out of their tombs. And what's bringing them out of their tombs? Music, of course. And so I would just encourage you to just think when you go to liturgy and you see it's everywhere. I mean, this is just. This is just like a hint. I mean, I had to. When I first wrote this, it was like two hours long. Okay, so just cut, cut. I was cutting everything, but it's just an amazing thing. Read. Read St. Gregory and read the Scriptures with this vision. And it's just."},{"t":2574,"ad":false,"x":"It just. It just astounds us every time. It astounds me until today. And I get knocked over all the time just by how amazing our God is and how amazing his creation is. So thank you."}],"refs":[{"skip":false,"v":211,"tp":4,"k":"r","note":"The ascent starts by leaving the base of the mountain","gi":1026,"id":"b2-16","sec":"The Darkness","book":"Book II","n":167,"p":5,"a":9,"at":653.0,"x":"First, he leaves behind the base of the mountain and is separated from all those too weak for the ascent.","para":"After this he comes to the tabernacle not made with hands. Who will follow someone who makes his way through such places and elevates his mind to such heights, who, as though he were passing from one peak to another, comes ever higher than he was through his ascent to the heights? First, he leaves behind the base of the mountain and is separated from all those too weak for the ascent. Then as he rises higher in his ascent he hears the sounds of the trumpets. Thereupon, he slips into the inner sanctuary of divine knowledge. And he does not remain there, but he passes on to the tabernacle not made with hands. For truly this is the limit that someone reaches who is elevated through such ascents.","xs":["First, he leaves behind the base of the mountain and is separated from all those too weak for the ascent."]},{"skip":false,"v":261,"tp":5,"k":"r","note":"Garments of skin","gi":452,"id":"b2-2","sec":"The Burning Bush","book":"Book II","n":22,"p":3,"a":4,"at":230.7,"x":"Sandaled feet cannot ascend that height where the light of truth is seen, but the dead and earthly covering of skins, which was placed around our nature at the beginning when we were found naked because of disobedience to the divine will, must be removed from the feet of the soul.","para":"That light teaches us what we must do to stand within the rays of the true light: Sandaled feet cannot ascend that height where the light of truth is seen, but the dead and earthly covering of skins, which was placed around our nature at the beginning when we were found naked because of disobedience to the divine will, must be removed from the feet of the soul.","xs":["Sandaled feet cannot ascend that height where the light of truth is seen, but the dead and earthly covering of skins, which was placed around our nature at the beginning when we were found naked because of disobedience to the divine will, must be removed from the feet of
