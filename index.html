tute a moral teaching for the literal sequence in those things which admit of such an approach. In this way those who have been striving toward virtue may find aid in living the virtuous life."],[50,"If the events require dropping from the literal account anything written which is foreign to the sequence of elevated understanding, we pass over this on the grounds that it is useless and unprofitable to our purpose, so as not to interrupt the guidance to virtue at such points."],[51,"I say these things concerning the interpretation of Aaron in order to anticipate the objection which will arise from what follows in the narrative. For someone will say that there is no doubt that the angel does share kinship with the soul in its intellectual and incorporeal aspects, that it already existed before our creation, and that it is allied with those engaged in the fight against the Adversary, but that it is not right to see Aaron, who led the Israelites in the worship of idols, as a type of the angel."],[52,"To him we shall reply, passing over the sequence, with the point already made, that what falls outside our purpose is not to overthrow the agreement which exists elsewhere. Moreover, both words, \"brother\" and \"angel,\" are alike applicable in the meaning they might have to opposite things."],[53,"For \"angel\" signifies not only an angel of God but also an angel of Satan. And we call \"brother\" not only a good brother but also a bad brother. So the Scripture speaks of the good, Brothers are proved in distress, and of the opposite, Every brother will utterly supplant."]],"id":"b2-3","r":[42,53],"w":925},{"t":"Deliverance Announced","p":[[54,"Laying aside these matters for a later point in our discussion where we shall give a fuller interpretation of them in their proper place, let us now turn to what is at hand. Moses, who had been strengthened by the shining light and had acquired such a brother as an ally and supporter, boldly delivered to the people the words of freedom, brought to their remembrance the nobility of their fathers, and gave his judgment how they could escape from their wretched labor of brick making."],[55,"What then does the history teach us by this? That he who has not equipped himself by this kind of spiritual training to instruct the multitude must not presume to speak among the people. For you see how, while he was still young and had not yet matured to so lofty a degree of virtue, two men who were quarreling did not consider his peaceful advice worth accepting, yet now he addresses tens of thousands in the same way. The history all but cries out to you not to be presumptuous in giving advice to your hearers in your teaching unless the ability for this has been perfected in you by a long and exacting training such as Moses had."],[56,"When Moses had spoken these excellent words and had offered his hearers freedom and had strengthened their desire for it, the enemy was provoked and increased the suffering of those who hearkened to his speech. This is not unlike what happens now. For many of those who have accepted the word as a liberator from tyranny and have identified themselves with the Gospel are today still threatened by the Adversary with onslaughts of temptations."],[57,"Many of them do become more firmly established in their faith as they are hardened by these grievous assaults, but some of the weaker ones are beaten to their knees by these misfortunes and say outright that it would have been more useful for them not to have heard the message of freedom than to endure these things for freedom's sake."],[58,"The same thing happened when the Israelites through meanness of spirit blamed those who proclaimed to them deliverance from servitude. But the Word will not cease at all from leading on toward the Good, even if he who is yet young and immature in understanding should, childlike, be fearful of the strangeness of temptations."],[59,"For this demon who does men harm and corrupts them is intensely concerned that his subjects not look to heaven but that they stoop to earth and make bricks within themselves out of the clay. It is clear to everyone that whatever belongs to material pleasure consists assuredly of earth or water, whether one is concerned with the pleasures of the stomach and the table or with the pleasures of wealth."],[60,"The mixture of these elements becomes clay and is so called. Those who yearn after the pleasures of clay and keep on filling themselves with them never keep the space which receives them full; for although it is always being filled, it becomes empty again before the next pouring. In the same way the brick maker keeps on throwing yet more clay into the mould while it is constantly being emptied. I think that anyone can easily perceive the meaning of this figure by looking at the appetitive part of the soul."],[61,"For if he who fills his desire in one of the things which he pursues should then incline his desire to something else, he finds himself empty again in that regard. And if he should fill himself on this, he becomes empty and a vacant container once more for something else. And we never stop doing this until we depart from this material life."],[62,"The straw and its chaff which those subject to the tyrant's orders were required to mix in the brick are interpreted by both the divine Gospel and the sublime voice of the Apostle as material for the fire."]],"id":"b2-4","r":[54,62],"w":660},{"t":"The Plagues on Egypt","p":[[63,"Whenever someone who excels in virtue wishes to draw those who have been enslaved by trickery to a life philosophical and free, the one who schemes against our souls with many different deceits (as the Apostle says) knows how to introduce the devices of trickery against the divine law. I am speaking here of the Egyptian serpents in the text, that is, of the many different evil tricks which the rod of Moses destroyed. We have probably already sufficiently interpreted the rod."],[64,"Now he who possesses that invincible rod of virtue which consumes the rods of magic progresses along his course to greater marvels. Marvels are not performed for the purpose of terrifying those who happen to be present, but they look to the benefit of those being saved. By these very marvels of virtue the enemy is defeated and his own people are strengthened."],[65,"If we first learn the general spiritual intent of miracles, we would then be able to apply this insight to individual miracles. True doctrine conforms to the dispositions of those receiving the word, for although the word presents to all equally what is good and bad, the one who is favorably disposed to what is presented has his understanding enlightened, but the darkness of ignorance remains with the one who is obstinately disposed and does not permit his soul to behold the ray of truth. If our general understanding of these things is not false, the specific items would certainly not be different since the individual part is demonstrated with the whole."],[66,"So then, it is not marvelous at all that the Hebrew, although living in the midst of foreigners, remains unaffected by the evils of the Egyptians. One can also see the same thing happening now in populous cities where people are holding contradictory opinions. To some, the stream of faith from which they draw by means of the divine teaching is fresh and clear, but to others, who live as the Egyptians do and draw by means of their own evil presuppositions, the water becomes corrupted blood."],[67,"And many times the master of deceit endeavors to turn the drink of the Hebrews also into blood by polluting it with falsehood, that is, by presenting our doctrine to us as different from what it really is. But he cannot make the water wholly unusable, even if he should easily turn it red by his trickery. For since he pays no attention to the optical illusion, the Hebrew drinks the true water, even though he is successfully misled by his adversaries."],[68,"The same applies to the frogs—ugly and noisy amphibians, leaping about, not only unpleasant to the sight, but also having a foul-smelling skin—they entered the houses, beds, and storerooms of the Egyptians, but they did not affect the life of the Hebrews."],[69,"The breed of frogs is obviously the destructive offspring of the evil which is brought to life from the sordid heart of men as though from some slimy mire. These frogs overrun the houses of those who choose to live the Egyptian life, appearing on the tables, not even sparing the beds, and entering the very storerooms."],[70,"One sees in the sordid and licentious life that which is indeed born out of clay and mire and that which, through imitation of the irrational, remains in a form of life neither altogether human nor frog. Being a man by nature and becoming a beast by passion, this kind of person exhibits an amphibious form of life ambiguous in nature. In addition, one will also find the evidences of such an illness, not only on the bed, but also on the table and in the storeroom and throughout the house."],[71,"For such a man shows his profligacy in everything so that everyone readily recognizes the life of the profligate and the life of the pure man by what is valued in each one's household. In the house of the one there are frescoes on the wall which by their artful pictures inflame the sensual passions. These things bring out the nature of the illness, and through the eye passion pours in upon the soul from the dishonorable things which are seen. But in the house of the prudent man there is every precaution and foresight to keep the eye pure from sensual spectacles."],[72,"The table of the prudent man is similarly found to be pure, but that of the man wallowing in the mire is frog-like and fleshy. And if you search the storeroom, that is to say the secret and unmentionable things of his life, you will discern there in his licentiousness a much greater pile of frogs."]],"id":"b2-5","r":[63,72],"w":775},{"t":"The Hardening of Pharaoh's Heart and Free Will","p":[[73,"Let us not be astonished if the history says that the rod of virtue did these things to the Egyptians, for it also says that the tyrant was hardened by God. Now, how could he be condemned if he were disposed by divine constraint to be stubborn and obstinate? Somewhere the divine Apostle also expresses the same thought: Since they refused to see it was rational to acknowledge God, he abandoned them to shameful passions, speaking about those who commit sodomy and those who disgrace themselves by dishonorable and unmentionable profligacy."],[74,"But even if what has been said before is so stated by Scripture, and God does in this way entirely give up to dishonorable passions the one who gives himself up to them, still Pharaoh is not hardened by the divine will nor is the frog-like life fashioned by virtue. For if this were to be willed by the divine nature, then certainly any human choice would fall into line in every case, so that no distinction between virtue and vice in life could be observed. People live differently—some live uprightly in virtue while others slide into vice. One would not reasonably attribute these differences in their lives to some divine constraint which lies outside themselves. It lies within each person's power to make this choice."],[75,"Who it is who is delivered up to shameful affections can be clearly learned from the Apostle: It is he who does not like to have God in his knowledge. God delivers up to passion him whom he does not protect because he is not acknowledged by him. But his failure to acknowledge God becomes the reason why he is being pulled down into the passionate and dishonorable life."],[76,"It is as if someone who has not seen the sun blames it for causing him to fall into the ditch. Yet we do not hold that the luminary in anger pushes into the ditch someone who does not choose to look at it. Rather, we would interpret this statement in a more reasonable manner: It is the failure to participate in the light that causes the person who does not see to fall into the ditch. In the same way, the thought of the Apostle should be clear, that it is those who do not acknowledge God who are delivered up to shameful affections, and that the Egyptian tyrant is hardened by God not because the divine will places the resistance in the soul of Pharaoh but because the free will through its inclination to evil does not receive the word which softens resistance."],[77,"In the same way also, when the rod of virtue appeared among the Egyptians, it made the Hebrews pure from the frog-like life but showed the Egyptians to be full of this illness."],[78,"When Moses stretched forth his hands on the Egyptians' behalf, the frogs were instantly destroyed. This can also be seen happening now. For those who perceive the outstretched hands of the lawgiver—you understand, surely, what the figure says to you, and perceive in the lawgiver the true Lawgiver and in his outstretched hands him who stretched forth his hands upon the cross —those then who for a short time have lived with these sordid and frog-like thoughts, if they look to him who stretched forth his hands on our behalf, are set free from their evil life as their passion is put to death and left stinking."],[79,"Truly, after the death of the frog-like emotions, the former manner of life of those who have been delivered from such an illness becomes to them a foul and odorous memory which disgusts the soul in shame. It is as the Apostle says to those changed from evil to virtue: What did you get from this? Nothing but experiences that now make you blush."],[80,"In keeping with this insight of mine, consider the air which is darkened to the Egyptians' eyes by the rod while to the Hebrews' it is illuminated by the sun. By this incident the meaning which we have given is confirmed. It was not some constraining power from above that caused the one to be found in darkness and the other in light, but we men have in ourselves, in our own nature and by our own choice, the causes of light or of darkness, since we place ourselves in whichever sphere we wish to be."],[81,"According to the history, the eyes of the Egyptians were not in darkness because some wall or mountain darkened their view and shadowed the rays, but the sun cast its rays upon all equally. Whereas the Hebrews delighted in its light, the Egyptians were insensitive to its gift. In a similar manner the enlightened life is proposed to all equally according to their ability. Some continue on in darkness, driven by their evil pursuits to the darkness of wickedness, while others are made radiant by the light of virtue."],[82,"Perhaps someone, taking his departure from the fact that after three days of distress in darkness the Egyptians did share in the light, might be led to perceive the final restoration which is expected to take place later in the kingdom of heaven of those who have suffered condemnation in Gehenna. For that darkness that could be felt, as the history says, has a great affinity both in its name and in its actual meaning to the exterior darkness. Both are dispelled when Moses, as we have perceived before, stretched forth his hands on behalf of those in darkness."],[83,"In the same way we would perceive the true meaning of the furnace asbes which, according to the text, produced painful boils on the Egyptians. In the figure of what is called the \"furnace\" we perceive the threatened punishment of fire in Gehenna which touches only those who imitate the Egyptians in their manner of life."],[84,"If anyone is truly an Israelite, a son of Abraham, and looks to him in life in such a way as to show by his own free will his kinship in race to the elect people, he is kept unharmed from that painful fire. The interpretation of Moses' outstretched hands which we have already given may become for those others also the healing of pain and the deliverance from punishment."],[85,"If one follows the sequence of our earlier investigations, he will have no trouble attaching to each plague the corresponding perception: those light gadflies which tormented the Egyptians with their unseen bites, the flies which clung painfully with their bites to their bodies, the tillage which was ravaged by the locusts, and the storms from heaven which rained down hailstones."],[86,"The Egyptians' free will caused all these things according to the preceding principle, and the impartial justice of God followed their free choices and brought upon them what they deserved. As we follow closely the reading of the text at hand, let us not draw the conclusion that these distresses upon those who deserved them came directly from God, but rather let us observe that each man makes his own plagues when through his own free will he inclines toward these painful experiences. The Apostle says the same thing when talking to such a person: Your stubborn refusal to repent is only adding to the anger God will have toward you on that day of anger when his just judgments will be made known. He will repay each one as his works deserve."],[87,"What we are describing is like some destructive and bilious humor which arises in the intestines because of a dissipated life. When the physician induces vomiting by his medicines, he does not become the cause of the sickness in the body, but on the contrary it is disorderly eating habits which bring it about; medical knowledge only brought it into the open. In the same way, even if one says that painful retribution comes directly from God upon those who abuse their free will, it would only be reasonable to note that such sufferings have their origin and cause in ourselves."],[88,"To the one who has lived without sin there is no darkness, no worm, no Gehenna, no fire, nor any other of these fearful names and things, as indeed the history goes on to say that the plagues of Egypt were not meant for the Hebrews. Since then in the same place evil comes to one but not to the other, the difference of free choices distinguishing each from the other, it is evident that nothing evil can come into existence apart from our free choice."]],"id":"b2-6","r":[73,88],"w":1425},{"t":"The Death of the Firstborn","p":[[89,"Let us proceed to what follows in the text. We have learned through the things examined already that Moses (and he who exalts himself by virtue in keeping with his example), when his soul had been empowered through long application and high and lofty life, and through the illumination which came from above, considered it a loss not to lead his countrymen to the life of freedom."],[90,"When he came to them, he implanted in them a more intense desire for freedom by holding out worse sufferings to them. Intending to remove his countrymen from evil, he brought death upon all the firstborn in Egypt. By doing this he laid down for us the principle that it is necessary to destroy utterly the first birth of evil. It is impossible to flee the Egyptian life in any other way."],[91,"It does not seem good to me to pass this interpretation by without further contemplation. How would a concept worthy of God be preserved in the description of what happened if one looked only to the history? The Egyptian acts unjustly, and in his place is punished his newborn child, who in his infancy cannot discern what is good and what is not. His life has no experience of evil, for infancy is not capable of passion. He does not know to distinguish between his right hand and his left. The infant lifts his eyes only to his mother's nipple, and tears are the sole perceptible sign of his sadness. And if he obtains anything which his nature desires, he signifies his pleasure by smiling. If such a one now pays the penalty of his father's wickedness, where is justice? Where is piety? Where is holiness? Where is Ezekiel, who cries: The man who has sinned is the man who must die and a son is not to suffer for the sins of his father? How can the history so contradict reason?"],[92,"Therefore, as we look for the true spiritual meaning, seeking to determine whether the events took place typologi cally, we should be prepared to believe that the lawgiver has taught through the things said. The teaching is this: When through virtue one comes to grips with any evil, he must completely destroy the first beginnings of evil."],[93,"For when he slays the beginning, he destroys at the same time what follows after it. The Lord teaches the same thing in the Gospel, all but explicitly calling on us to kill the firstborn of the Egyptian evils when he commands us to abolish lust and anger and to have no more fear of the stain of adultery or the guilt of murder. Neither of these things would develop of itself, but anger produces murder and lust produces adultery."],[94,"Since the producer of evil gives birth to lust before adultery and anger before murder, in destroying the firstborn he certainly kills along with it the offspring which follows. Take for an example a snake: When one crushes his head he kills the rest of the body at the same time."],[95,"This would not have happened unless the blood which turns aside the destroyer had been poured out on our doors. And if it is necessary to perceive the meaning presented here more fully, the history provides this perception in both the killing of the firstborn and the safeguarding of the entrance by blood. In the one the first impulse to evil is destroyed, and in the other the first entrance of evil into us is turned away by the true Lamb. For when the destroyer has come inside, we do not drive him out by our own devices, but by the Law we throw up a defense to keep him from gaining a foothold among us."],[96,"Safety and security consist in marking the upper doorpost and the side posts of the entrance with the blood of the lamb. While in this way Scripture gives us through figures a scientific understanding of the nature of the soul, profane learning also places it before the mind, dividing the soul into the rational, the appetitive, and the spirited. Of these parts we are told that the spirit and the appetite are placed below, supporting on each side the intellectual part of the soul, while the rational aspect is joined to both so as to keep them together and to be held up by them, being trained for courage by the spirit and elevated to the participation in the Good by the appetite."],[97,"As long, therefore, as the soul is kept safe in this manner, maintaining its firmness by virtuous thoughts as if by bolts, all the parts cooperate with one another for good. The rational for its part furnishes safety to its supports, and in its turn receives from them an equal benefit."],[98,"But if this arrangement should be upset and the upper become the lower—so that if the rational falls from above, the appetitive and spirited disposition makes it the part trampled upon—then the destroyer slips inside. No opposition from the blood resists his entrance; that is to say, faith in Christ does not ally itself with those of such a disposition."],[99,"For he says first to anoint the upper doorpost with blood, then to touch both side doorposts in the same way. How therefore would one anoint the upper first unless it be found on top?"],[100,"Do not be surprised at all if both things—the death of the firstborn and the pouring out of the blood— did not happen to the Israelites and on that account reject the contemplation which we have proposed concerning the destruction of evil as if it were a fabrication without any truth. For now in the difference of the names, Israelite and Egyptian, we perceive the difference between virtue and evil. Since the spiritual meaning proposes that we perceive the Israelite as virtuous, we would not reasonably require the firstfruits of virtue's offspring to be destroyed but rather those whose destruction is more advantageous than their cultivation."],[101,"Consequently we have been taught by God that we must destroy the firstfruits of the Egyptian children so that evil, in being destroyed at its beginning, might come to an end. And this insight agrees with the history, for the protection of the Israelite children took place through the pouring out of blood in order that good might come to maturity. But what would come to maturity in the Egyptian people was destroyed before it matured in evil."]],"id":"b2-7","r":[89,101],"w":1078},{"t":"The Departure from Egypt","p":[[102,"What follows agrees with our spiritual understanding of the text. For Scripture requires that the body of the lamb, whose blood was displayed on the doors and separated the people from the destroyer of the firstborn, become our food."],[103,"The demeanor of those eating this food was to be intense and earnest, not like that of those who enjoy themselves at banquets, whose hands are relaxed and whose clothes are loose and whose feet are unprepared for travel. But everything was the opposite. Their feet were covered with sandals, a belt bound the clothing at the waist, and the staff to repel dogs was held in hand."],[104,"And to them in this condition was presented meat without any artfully prepared sauces but cooked upon any fire that happened to be available. The guests eagerly devoured it in great haste until the entire body of the animal was consumed. They ate whatever was edible around the bones, but they did not touch the entrails. To break the bones of this animal was one of the things forbidden. Whatever might be left of the meat was consumed by the fire."],[105,"From all this it is evident that the letter looks to some higher understanding, since the Law does not instruct us how to eat. (Nature which implants a desire for food in us is a sufficient lawgiver with regard to these things.) The account rather signifies something different. For what does it matter to virtue or vice to eat your food this way or that, to have the belt loose or tight, to have your feet bare or covered with shoes, to have your staff in your hand or laid aside?"],[106,"It is clear what the traveler's equipment figuratively stands for: It commands us explicitly to recognize that our present life is transient. Already at birth we are driven by the very nature of things toward our departure, for which we must carefully prepare our hands, feet, and the rest."],[107,"So that the thorns of this life (the thorns would be sins) may not hurt our naked and unprotected feet, let us cover them with shoes. The shoes are the self-controlled and austere life which breaks and crushes the points of the thorns and prevents sin from slipping inside unnoticed."],[108,"The tunic flowing down over the feet and reaching to the soles would be a hindrance to anyone who would diligently finish the divine course. The tunic accordingly would be seen as the full enjoyment of the pursuits of this life, which the prudent reason, like a traveler's belt, draws in as tightly as possible. The place around which the belt passes shows that it is to be understood as prudence. The staff for repelling animals is the message of hope, by which we support the weariness of the soul and ward off what threatens us."],[109,"The food placed before us from the fire I call the warm and fervent faith which we receive without having given thought to it. We devour as much of it as is easily eaten, but we leave aside the doctrine concealed in the thoughts which are hard and tough without investigating it thoroughly or seeking to know more about it. Instead we consign this food to the fire."],[110,"In order that these figures may be made clear, let us explain that whichever of the divine commands are readily perceived should not be followed sluggishly or by constraint, but we should be like those who are hungry and eagerly fill up on the things set before them, so that the food may become provision for our well-being. But such thoughts as are beyond our understanding—like the questions, What is the essence of God? What was there before the creation? What is there outside the visible world? Why do things which happen happen? and other such things as are sought out by inquiring minds —these things we concede to know only by the Holy Spirit, who reaches the depths of God, as the Apostle says."],[111,"Anyone instructed in the Scriptures surely knows that instead of \"Spirit\" Scripture often thinks of it and designates it as \"fire.\" We are also led to this understanding by the announcement of Wisdom: Do not try to understand things that are too difficult for you, that is to say, Do not break the bones of Scripture, foryou have no need [to see with your eyes] those things that are hidden."]],"id":"b2-8","r":[102,111],"w":737},{"t":"The Wealth of Egypt","p":[[112,"Thus Moses led the people out of Egypt, and everyone who follows in the steps of Moses in this way sets free from the Egyptian tyrant all those guided by his word. Those who follow the leader to virtue must, I think, not lack the wealth of Egypt or be deprived of the treasures of the foreigners, but having acquired all the property of their enemies, must have it for their own use. This is exactly what Moses then commanded the people to do."],[113,"No one who has listened to this carelessly would accept the advice of the lawgiver if he enjoined those in want to rob and so became a leader in their wrongdoing. If someone looks to the laws which follow, which from beginning to end forbid wrongdoing to one's neighbor, he could not truthfully say that the lawgiver commanded these things, even though to some it seems reasonable that the Israelites should have exacted the wages for their work from the Egyptians by this device."],[114,"Yet there is no less ground for complaint; this justification does not purify such a command of falsehood and fraud, for the person who borrows something and does not repay the lender is deceitful. If he borrows something not belonging to him, he does wrong because he commits fraud. But even if he should take what is rightly his own he is still correctly called a deceiver since he misleads the lender into hoping that he will be repaid."],[115,"The loftier meaning is therefore more fitting than the obvious one. It commands those participating through virtue in the free life also to equip themselves with the wealth of pagan learning by which foreigners to the faith beautify themselves. Our guide in virtue commands someone who \"borrows\" from wealthy Egyptians to receive such things as moral and natural philosophy, geometry, astronomy, dialectic, and whatever else is sought by those outside the Church, since these things will be useful when in time the divine sanctuary of mystery must be beautified with the riches of reason."],[116,"Those who treasured up for themselves such wealth handed it over to Moses as he was working on the tent of mystery, each one making his personal contribution to the construction of the holy places. It is possible to see this happening even now. For many bring to the Church of God their profane learning as a kind of gift: Such a man was the great Basil, who acquired the Egyptian wealth in every respect during his youth and dedicated this wealth to God for the adornment of the Church, the true tabernacle."]],"id":"b2-9","r":[112,116],"w":434},{"t":"The Cloudy Pillar","p":[[117,"Let us return to the point where we digressed. When those who already look to virtue and follow the lawgiver in life have left the borders of the Egyptians' dominion behind, the assaults of temptations in some way pursue them and bring on distress and fears and threats of death. When frightened by these things, those newly established in the faith lose all hope for what is good. But if Moses or some leader of the people like him happens along, he will counsel them against fear and will strengthen their downcast minds with the hope of divine help."],[118,"This help will not come unless the heart of the leader speaks with God. Many of those who occupy a position of leadership are concerned only with outward appearances; of those hidden things which are observed only by God they have hardly a thought. But in the case of Moses it was not so. While he exhorted the Israelites to be of good courage, he did cry out, although outwardly making no sound to God, as God himself bears witness. The Scripture teaches us, I think, that the voice which is melodious and ascends to God's hearing is not the cry made with the organs of speech but the meditation sent up from a pure conscience."],[119,"To the one who finds himself in these circumstances the brother appears limited in the help he renders for the great struggles—I mean that brother who met Moses as he was going down to Egypt at the divine bidding, whom Scripture has understood as being in the rank of angels. Then occurred the manifestation of the divine nature which manifests itself in the way that one is capable of receiving."],[0,"What we hear from the history to have happened, then, we understand from contemplation of the Word always to happen."],[120,"Whenever someone flees Egypt and, after getting outside its borders, is terrified by the assaults of temptation, the guide produces unexpected salvation from on high. Whenever the enemy with his army surrounds the one being pursued, the guide is forced to make the sea passable for him."],[121,"In this crossing the cloud served as guide. Those before us interpreted the cloud well as the grace of the Holy Spirit, who guides toward the Good those who are worthy. Whoever follows him passes through the water, since the guide makes a way through it for him. In this way he is safely led to freedom, and the one who pursues him to bring him into bondage is destroyed in the water."]],"id":"b2-10","r":[117,121],"w":425},{"t":"Crossing the Red Sea","p":[[0,"No one who hears this should be ignorant of the mystery of the water. He who has gone down into it with the army of the enemy emerges alone, leaving the enemy's army drowning in the water."],[122,"For who does not know that the Egyptian army— those horses, chariots and their drivers, archers, slingers, heavily armed soldiers, and the rest of the crowd in the enemies' line of battle—are the various passions of the soul by which man is enslaved? For the undisciplined intellectual drives and the sensual impulses to pleasure, sorrow, and covetousness are indistinguishable from the aforementioned army. Reviling is a stone straight from the sling and the spirited impulse is the quivering spear point. The passion for pleasures is to be seen in the horses who themselves with irresistible drive pull the chariot."],[123,"In the chariot there are three drivers whom the history calls \"viziers.\" Since you were previously instructed in the mystery of the side posts and upper doorpost, you will perceive these three, who are completely carried along by the chariot, as the tripartite division of the soul, meaning the rational, the appetitive, and the spirited."],[124,"So all such things rush into the water with the Israelite who leads the way in the baleful passage. Then as the staff of faith leads on and the cloud provides light, the water gives life to those who find refuge in it but destroys their pursuers."],[125,"Moreover, the history teaches us by this what kind of people they should be who come through the water, bringing nothing of the opposing army along as they emerge from the water. For if the enemy came up out of the water with them, they would continue in slavery even after the water, since they would have brought up with themselves the tyrant, still alive, whom they did not drown in the deep. If anyone wishes to clarify the figure, this lays it bare: Those who pass through the mystical water in baptism must put to death in the water the whole phalanx of evil—such as covetousness, unbridled desire, rapacious thinking, the passion of conceit and arrogance, wild impulse, wrath, anger, malice, envy, and all such things. Since the passions naturally pursue our nature, we must put to death in the water both the base movements of the mind and the acts which issue from them."],[126,"Just as unleavened bread was eaten in the mystery of the Pasch (which is the name of the sacrificial victim whose blood prevents the death of the one using it), even so the Law now commands us to eat unleavened bread at the Pasch (unleavened would be unmixed with stale yeast). The Law gives us to understand by this that no remnant of evil should mix with the subsequent life. Rather we should make a totally new beginning in life after these things, breaking the continuity with evil by a radical change for the better. Thus also he means here that after we have drowned the whole Egyptian person (that is every form of evil) in the saving baptism we emerge alone, dragging along nothing foreign in our subsequent life. This is what we hear through the history, which says that in the same water the enemy and the friend are distinguished by death and life, the enemy being destroyed and the friend given life."],[127,"Many of those who receive the mystical baptism, in ignorance of the commandments of the Law, mix the bad leaven of the old life with the new life. Even after crossing the water they bring along the Egyptian army, which still lives with them in their doings."],[128,"Take for instance the one who became rich by robbery or injustice, or who acquired property through perjury, or lived with a woman in adultery, or undertook any of the other things against life which have been forbidden before the gift of baptism. Does he think that even after his washing he may continue to enjoy those evil things which have become attached to him and yet be freed from the bondage of sin, as though he cannot see that he is under the yoke of harsh masters?"],[129,"For uncontrolled passion is a fierce and raging master to the servile reasoning, tormenting it with pleasures as though they were scourges. Covetousness is another such master who provides no relief to the bondsman, but even if the one in bondage should slave in subservience to the commands of the master and acquire for him what he desires, the servant is always driven on to more. And all the other things which are performed by evil are so many tyrants and masters. If someone should still serve them, even if he should happen to have passed through the water, according to my thinking he has not at all touched the mystical water whose function is to destroy evil tyrants."]],"id":"b2-11","r":[122,129],"w":813},{"t":"The First Stations in the Desert","p":[[130,"Let us again proceed to the next point in the text. For the person who has crossed the sea and has seen this Egyptian dead in it, as we interpret it, no longer looks to Moses alone as the staff-bearer of virtue; but in keeping with the foregoing he believes in God, even as the Scripture says, and is obedient to his servant Moses. We see this happening even now with those who truly cross the water, who dedicate themselves to God and are obedient and submissive, as the Apostle says, to those who serve the Divine in the priesthood."],[131,"After they had crossed the sea, a three days' march ensued, during which they made camp at a place where they found water so bitter that they could not at first drink it. But wood placed in the water made the drink agreeable to those who were thirsty."],[132,"The history agrees with what now happens: for to the one who has left behind the Egyptian pleasures which he served before crossing the sea, life removed from these pleasures seems at first difficult and disagreeable. But if the wood be thrown into the water, that is, if one receives the mystery of the resurrection which had its beginning with the wood (you of course understand the \"cross\" when you hear \"wood\"), then the virtuous life, being sweetened by the hope of things to come, becomes sweeter and more pleasant than all the sweetness that tickles the senses with pleasure."],[133,"The next resting place on the journey, replete with palm trees and springs, refreshed the travelers. There were twelve springs of pure and very sweet water and seventy large, high-crested date palms which had grown tall with the years. What do we discover in these things as we follow the history? That the mystery of the wood through which the water of virtue became pleasant to those athirst leads us to the twelve springs and the seventy date palms, that is, to the teaching of the Gospel."],[134,"The springs are the Twelve Apostles whom the Lord chose for this service and through whom he caused his word to well up. One of the Prophets foretold the welling up of grace from the Apostles when he said: In the churches bless God the Lord, from the fountains of Israel. And the seventy date palms would be those apostles appointed in addition to the Twelve Disciples throughout the whole world; they were the same in number as the history says the palm trees were."],[135,"But I think it is fitting to speed our journey through the text, yet making the contemplation of the rest of the camps easier for those who are more studious by offering a few remarks. The campsites, where the person following the pillar of cloud is refreshed as he presses on, would be the virtues. Passing over the intermediate resting places with a mere mention, I shall call to mind the miracle of the rock, whose resistant and hard nature became drink to those who were thirsty when its hardness dissolved into the softness of water."],[136,"It is not difficult to harmonize the sequence of the history with spiritual contemplation. He who left the Egyptian behind dead in the water, was sweetened by the wood, was delighted in the apostolic springs, and was refreshed by the shade of the palm trees, is already capable of receiving God. For the rock, as the Apostle says, is Christ, who is moistureless and resistant to unbelievers, but if one should employ the rod of faith he becomes drink to those who are thirsty and flows into those who receive him, for he says, I and my Father shall come to him and make our home with him."]],"id":"b2-12","r":[130,136],"w":624},{"t":"The Manna","p":[[137,"There is another event which we must not rush over without contemplation. After the travelers in virtue had crossed the sea, after the water had been sweetened for them, after their refreshing rest by the springs and palms, and after their drinking from the rock, the supplies from Egypt ran completely Out. And thus when they had no more of the foreign food which they had laid by in Egypt, there flowed down from above food which was at the same time varied and uniform. In appearance the food was uniform, but in quality it was varied, for it conformed itself to each person's desire."],[138,"What then do we learn here? We learn by what purifications one should purify himself of Egypt and the foreign life so that he empties the sack of his soul of all evil nourishment prepared by the Egyptians. In this way he receives in himself with his pure soul the food which comes down from above, which was not produced for us by any sowing in cultivated soil. Coming down from above, the bread is found upon the earth already prepared without the wheat's having been sown or ripened."],[139,"You no doubt perceive the true food in the figure of the history: The bread which came from heaven is not some incorporeal thing. For how could something incorporeal be nourishment to a body? Neither ploughing nor sowing produced the body of this bread, but the earth which remained unchanged was found full of this divine food, of which the hungry partake. This miracle teaches in anticipation the mystery of the Virgin."],[140,"This bread, then, that does not come from the earth is the Word. He changes his power in diverse ways to suit those who eat. He knows not only to be bread but also to become milk and meat and greens and whatever else might be appropriate to and desired by the one who receives him. So teaches Paul the divine Apostle who spreads such a table as this for us—making his message strong meat for the more mature and greens for the weaker and milk for little children."],[141,"Whatever marvels the history ennumerates in connection with that food are teachings for the virtuous life. For it says that everyone shared in the food equally. The strength of those who gathered made no difference; they had neither more nor less than they needed. This is, according to my view at least, advice generally applicable: that those making their living from material things should not exceed the bounds of need but should understand well that the one natural measure for all in eating is to eat as much as can be enjoyed in one day."],[142,"Even if much more were prepared than is needed, it is not in the stomach's nature to exceed its proper measure or to be stretched by the insatiate desire for what is prepared. But, as the history says, neither did the one who took much have an abundance (for he had nowhere to store the excess) nor did he who took little lack any (for his requirements were lessened according to the amount which was found)."],[143,"In this account Scripture after a fashion cries out to the covetous that the insatiable greed of those always hoarding surplus is turned into worms. Everything beyond what they need encompassed by this covetous desire becomes on the next day—that is in the future life—a worm to the person who hoards it. He who hears \"worm\" certainly perceives the undying worm which is made alive by covetousness."],[144,"The fact that what is stored up continues to supply nourishment and experiences no corruption only on the Sabbath contains the following counsel: There is a time in the course of one's life when he must be grasping—at the time when what is gathered does not submit to corruption. Then, when we pass beyond the preparation of this life and come to the rest after death, it will become useful to us. The day before the Sabbath is named the Preparation for the Sabbath. This day would be the present life in which we prepare for ourselves the things of the life to come."],[145,"In that life none of the things we engage in now are undertaken—neither agriculture, nor trade, nor military service, nor any of the other things pursued here. But living in complete rest from such works, we acquire the fruits of the seeds which we now sow in life, some incorruptible, if the seeds of life be good, and some deadly and destructive, if the cultivation of this life produce such in us. For he who sows in the field of the spirit, Scripture says, will get from it a harvest of eternal life, but he who sows in the field of self-indulgence willget a harvest of corruption out of it."],[146,"The preparation for the better is alone properly called Preparation and is surely confirmed by the Law, and what is stored up during it is incorruptible. That which is perceived as belonging to the opposite is neither Preparation nor is so called, for no one would reasonably call privation of good Preparation, but rather a lack of preparation. Therefore, the history prescribes for men the Preparation for the better and leaves it to the intelligent to perceive the opposite by its omission."]],"id":"b2-13","r":[137,146],"w":889},{"t":"The War with Amalek","p":[[147,"Just as in military conscription the commander of the army first supplies money and then gives the signal for battle, in the same way also the soldiers of virtue receive mystical money and move in battle against the enemy, being led into the conflict by Joshua, the successor of Moses."],[148,"Do you observe the sequence in which Scripture proceeds? As long as man is quite weak from maltreatment by wicked tyranny he does not ward off the enemy by himself, because he is not able. Someone else fights on behalf of the weak, battering the enemy with one blow after another. After he is set free from the bondage of his oppressors, is sweetened by the wood, is refreshed from his toil at the resting place among the palms, comes to know the mystery of the rock, and partakes of heavenly food, then he no longer wards off the enemy by another's hand. Now, since he has already outgrown the stature of a child and has laid hold of the vigor of youth, he fights with his opponents by himself, using as a general no longer Moses the servant of God, but God himself, whose servant Moses became. For the Law which from the beginning was given in type and shadow of things to come remains unfit for battle in the real conflicts. But the fulfiller of the Law and successor of Moses serves as general; he was announced beforehand by the name which he shared with that earlier general."],[149,"If the people saw the hands of their lawgiver lifted up, they prevailed over the enemy in battle; but if they saw them hanging limp, they fell back. Moses' holding his hands aloft signifies the contemplation of the Law with lofty insights; his letting them hang to earth signifies the mean and lowly literal exposition and observance of the Law."],[150,"The priest lifted the weary hands of Moses, using as a helper a member of his family. Nor is this outside the sequence of things contemplated. For the true priesthood, through the word of God joined with it, lifts high again the powers of the Law which fell to earth because of the heaviness of the Jewish understanding. The priesthood supports the falling Law at its base with a stone so that the Law, presenting a figure of outstretched hands, shows forth its own purpose to those who behold it."],[151,"For truly, to those who are able to see, the mystery of the cross is especially contemplated in the Law. Wherefore the Gospel says somewhere that not one dot, not one little stroke, shall disappear from the Law, signifying in these words the vertical and horizontal lines by which the form of the cross is drawn. That which was seen in Moses, who is perceived in the Law's place, is appointed as the cause and monument of victory to those who look at it."]],"id":"b2-14","r":[147,151],"w":484},{"t":"The Mountain of Divine Knowledge","p":[[152,"Again the Scripture leads our understanding upward to the higher levels of virtue. For the man who received strength from the food and showed his power in fighting with his enemies and was the victor over his opponents is then led to the ineffable knowledge of God. Scripture teaches us by these things the nature and the number of things one must accomplish in life before he would at some time dare to approach in his understanding the mountain of the knowledge of God, to hear the sound of the trumpets, to enter into the darkness where God is, to inscribe the tablets with divine characters, and, if these should be broken through some offense, again to present the hand-cut tables to God and to carve with the divine finger the letters which were damaged on the first tables."],[153,"It would be better next, in keeping with the order of the history, to harmonize what is perceived with the spiritual sense. Whoever looks to Moses and the cloud, both of whom are guides to those who progress in virtue (Moses in this place would be the legal precepts, and the cloud which leads, the proper understanding of the Law), who has been purified by crossing the water, who has put the foreigner to death and separated himself from the foreigner, who has tasted the waters of Marah (that is, the life removed far from pleasures) which although appearing bitter and unpleasant at first to those tasting it offers a sweet sensation to those accepting the wood, who has then delighted in the beauties of the palm trees and springs (which were those who preached the Gospel, who were filled with the living water which is the rock), who received the heavenly bread, who has played the man against the foreigners, and for whom the outstretched hands of the lawgiver became the cause of victory foreshadowing the mystery of the cross, he it is who then advances to the contemplation of the transcendent nature."],[154,"His way to such knowledge is purity, not only purity of a body sprinkled by some lustral vessels but also of the clothes washed from every stain with water. This means that the one person who would approach the contemplation of Being must be pure in all things so as to be pure in soul and body, washed stainless of every spot in both parts, in order that he might appear pure to the One who sees what is hidden and that visible respectability might correspond to the inward condition of the soul."],[155,"For this reason the garments are washed at divine command before he ascends the mountain, the garments representing for us in a figure the outward respectability of life. No one would say that a visible spot on the garments hinders the progress of those ascending to God, but I think that the outward pursuits of life are well named the \"garment.\""],[156,"When this had been accomplished and the herd of irrational animals had been driven as far from the mountain as possible, Moses then approached the ascent to lofty perceptions. That none of the irrational animals was allowed to appear on the mountain signifies, in my opinion, that in the contemplation of the intelligibles we surpass the knowledge which originates with the senses. For it is characteristic of the nature of irrational animals that they are governed by the senses alone divorced from understanding. Their sight and hearing often lead them to what stimulates their appetites. Also, all other things through which sense perception becomes active assume an important place in irrational animals."],[157,"The contemplation of God is not effected by sight and hearing, nor is it comprehended by any of the customary perceptions of the mind. For no eye has seen, and no ear has heard, nor does it belong to those things which usually enter into the heart of man. He who would approach the knowledge of things sublime must first purify his manner of life from all sensual and irrational emotion. He must wash from his understanding every opinion derived from some preconception and withdraw himself from his customary intercourse with his own companion, that is, with his sense perceptions, which are, as it were, wedded to our nature as its companion. When he is so purified, then he assaults the mountain."],[158,"The knowledge of God is a mountain steep indeed and difficult to climb —the majority of people scarcely reach its base. If one were a Moses, he would ascend higher and hear the sound of trumpets which, as the text of the history says, becomes louder as one advances. For the preaching of the divine nature is truly a trumpet blast, which strikes the hearing, being already loud at the beginning but becoming yet louder at the end."],[159,"The Law and the Prophets trumpeted the divine mystery of the incarnation, but the first sounds were too weak to strike the disobedient ear. Therefore the Jews' deaf ears did not receive the sound of the trumpets. As the trumpets came closer, according to the text, they became louder. The last sounds, which came through the preaching of the Gospels, struck their ears, since the Spirit through his instruments sounds a noise more loudly ringing and makes a sound more vibrant in each succeeding spokesman. The instruments which ring out the Spirit's sound would be the Prophets and Apostles whose voice, as the Psalter says, goes out through all the earth: and their message to the ends of the world."],[160,"The multitude was not capable of hearing the voice from above but relied on Moses to learn by himself the secrets and to teach the people whatever doctrine he might learn through instruction from above. This is also true of the arrangement in the Church: Not all thrust themselves toward the apprehension of the mysteries, but, choosing from among themselves someone who is able to hear things divine, they give ear gratefully to him, considering trustworthy whatever they might hear from someone initiated into the divine mysteries."],[161,"It is said, Not all are apostles, nor all prophets, but this is not now heeded in many of the churches. For many, still in need of being purified from the way they have lived, unwashed and full of spots in their life's garment and protecting themselves only with their irrational senses, make an assault on the divine mountain. So it happens that they are stoned by their own reasonings, for heretical opinions are in effect stones which crush the inventor of evil doctrines."]],"id":"b2-15","r":[152,161],"w":1090},{"t":"The Darkness","p":[[162,"What does it mean that Moses entered the darkness and then saw God in it? What is now recounted seems somehow to be contradictory to the first theophany, for then the Divine was beheld in light but now he is seen in darkness. Let us not think that this is at variance with the sequence of things we have contemplated spiritually. Scripture teaches by this that religious knowledge comes at first to those who receive it as light. Therefore what is perceived to be contrary to religion is darkness, and the escape from darkness comes about when one participates in light. But as the mind progresses and, through an ever greater and more perfect diligence, comes to apprehend reality, as it approaches more nearly to contemplation, it sees more clearly what of the divine nature is uncontemplated."],[163,"For leaving behind everything that is observed, not only what sense comprehends but also what the intelligence thinks it sees, it keeps on penetrating deeper until by the intelligence's yearning for understanding it gains access to the invisible and the incomprehensible, and there it sees God. This is the true knowledge of what is sought; this is the seeing that consists in not seeing, because that which is sought transcends all knowledge, being separated on all sides by incomprehensibility as by a kind of darkness. Wherefore John the sublime, who penetrated into the luminous darkness, says, No one has ever seen God, thus asserting that knowledge of the divine essence is unattainable not only by men but also by every intelligent creature."],[164,"When, therefore, Moses grew in knowledge, he declared that he had seen God in the darkness, that is, that he had then come to know that what is divine is beyond all knowledge and comprehension, for the text says, Moses approached the dark cloud where God was. What God? He who made darkness his hiding place, as David says, who also was initiated into the mysteries in the same inner sanctuary."],[165,"When Moses arrived there, he was taught by word what he had formerly learned from darkness, so that, I think, the doctrine on this matter might be made firmer for us for being testified to by the divine voice. The divine word at the beginning forbids that the Divine be likened to any of the things known by men, since every concept which comes from some comprehensible image by an approximate understanding and by guessing at the divine nature constitutes an idol of God and does not proclaim God."],[166,"Religious virtue is divided into two parts, into that which pertains to the Divine and that which pertains to right conduct (for purity of life is a part of religion). Moses learns at first the things which must be known about God (namely, that none of those things known by human comprehension is to be ascribed to him). Then he is taught the other side of virtue, learning by what pursuits the virtuous life is perfected."],[167,"After this he comes to the tabernacle not made with hands. Who will follow someone who makes his way through such places and elevates his mind to such heights, who, as though he were passing from one peak to another, comes ever higher than he was through his ascent to the heights? First, he leaves behind the base of the mountain and is separated from all those too weak for the ascent. Then as he rises higher in his ascent he hears the sounds of the trumpets. Thereupon, he slips into the inner sanctuary of divine knowledge. And he does not remain there, but he passes on to the tabernacle not made with hands. For truly this is the limit that someone reaches who is elevated through such ascents."],[168,"For it seems to me that in another sense the heavenly trumpet becomes a teacher to the one ascending as he makes his way to what is not made with hands. For the wonderful harmony of the heavens proclaims the wisdom which shines forth in the creation and sets forth the great glory of God through the things which are seen, in keeping with the statement, the heavens declare the glory of God. It becomes the loud sounding trumpet of clear and melodious teaching, as one of the Prophets says, The heavens trumpeted from above."],[169,"When he who has been purified and is sharp of hearing in his heart hears this sound (I am speaking of the knowledge of the divine power which comes from the contemplation of reality), he is led by it to the place where his intelligence lets him slip in where God is. This is called darkness by the Scripture, which signifies, as I said, the unknown and unseen. When he arrives there, he sees that tabernacle not made with hands, which he shows to those below by means of a material likeness."]],"id":"b2-16","r":[162,169],"w":811},{"t":"The Heavenly Tabernacle","p":[[170,"What then is that tabernacle not made with hands which was shown to Moses on the mountain and to which he was commanded to look as to an archetype so that he might reproduce in a handmade structure that marvel not made with hands? God says, See that you make them according to the pattern shown you on the mountain. There were gold pillars supported by silver bases and decorated with similar silver capitals; then, there were other pillars whose capitals and bases were of bronze but whose shafts were of silver. The core of all the pillars was wood that does not rot. But all around shone the brightness of these precious metals."],[171,"Likewise, there was an ark made of wood that does not rot, overlaid with gleaming pure gold. In addition, there was a candlestick with a single base, divided at its top into seven branches, each supporting a lamp. The candlestick was made of solid gold and not of wood overlaid with gold. There was, moreover, an altar and the throne of mercy and the so-called cherubim whose wings overshadowed the ark. All these were gold, not merely presenting a superficial appearance of gold but gold through and through."],[172,"Furthermore, there were curtains artistically woven of diverse colors; these brilliant colors were woven together to make a beautiful fabric. The curtains divided the tabernacle into two parts: the one visible and accessible to certain of the priests and the other secret and inaccessible. The name of the front part was the Holy Place and that of the hidden part was the Holy of Holies. In addition, there were lavers and braziers and hangings around the outer court and the curtains of hair and skins dyed red and all the other things he describes in the text. What words could accurately describe it all?"],[173,"Of what things not made with hands are these an imitation? And what benefit does the material imitation of those things Moses saw there convey to those who look at it? It seems good to me to leave the precise meaning of these things to those who have by the Spirit the power to search the depths of God, to someone who may be able, as the Apostle says, in the Spirit to speak about mysterious things. We shall leave what we say conjecturally and by supposition on the thought at hand to the judgment of our readers. Their critical intelligence must decide whether it should be rejected or accepted."],[174,"Taking a hint from what has been said by Paul, who partially uncovered the mystery of these things, we say that Moses was earlier instructed by a type in the mystery of the tabernacle which encompasses the universe. This tabernacle would be Christ who is the power and the wisdom of God, who in his own nature was not made with hands, yet capable of being made when it became necessary for this tabernacle to be erected among us. Thus, the same tabernacle is in a way both unfashioned and fashioned, uncreated in preexistence but created in having received this material composition."],[175,"What we say is of course not obscure to those who have accurately received the mystery of our faith. For there is one thing out of all others which both existed before the ages and came into being at the end of the ages. It did not need a temporal beginning (for how could what was before all times and ages be in need of a temporal origin?), but for our sakes, who had lost our existence through our thoughtlessness, it consented to be born like us so that it might bring that which had left reality back again to reality. This one is the Only Begotten God, who encompasses everything in himself but who also pitched his own tabernacle among us."],[176,"But if we name such a God \"tabernacle,\" the person who loves Christ should not be disturbed at all on the grounds that the suggestion involved in the phrase diminishes the magnificence of the nature of God. For neither is any other name worthy of the nature thus signified, but all names have equally fallen short of accurate description, both those recognized as insignificant as well as those by which some great insight is indicated."],[177,"But just as all the other names, in keeping with what is being specified, are each used piously to express the divine power—as, for example, physician, shepherd, protector, bread, vine, way, door, mansion, water, rock, spring, and whatever other designations are used of him—in the same way he is given the predicate \"tabernacle\" in accord with a signification fitting to God. For the power which encompasses the universe, in which lives the fulness of divinity, the common protector of all, who encompasses everything within himself, is rightly called \"tabernacle.\""],[178,"The vision must correspond to the name \"tabernacle,\" so that each thing seen leads to the contemplation of a concept appropriate to God. Now the great Apostle says that the curtain of the lower tabernacle is the flesh of Christ, I think, because it is composed of various colors, of the four elements. Doubtless he himself had a vision of the tabernacle when he entered the supercelestial sanctuary where the mysteries of Paradise were revealed to him by the Spirit. It would be well then by paying heed to the partial interpretation, to fit the total contemplation of the tabernacle to it."],[179,"We can gain clarity about the figures pertaining to the tabernacle from the very words of the Apostle. For he says somewhere with reference to the Only Begotten, whom we have perceived in place of the tabernacle, that in him were created all things, everything visible and everything invisible, Thrones, Dom inations, Sovereignties, Powers, or forces. Then the pillars gleaming with silver and gold, the bearing poles and rings, and those cherubim who hide the ark with their wings, and all the other things which are contained in the description of the tabernacle's construction—all of these things, if one should turn his view to things above, are the heavenly powers which are contemplated in the tabernacle and which support the universe in accord with the divine will."],[180,"These are our true supports, sent to help those who will be the heirs of salvation. They are slipped through the souls of those being saved as through rings and by themselves raise to the height of virtue those lying upon the earth. In saying that the cherubim cover the mysteries in the ark with their wings, the text confirms our contemplation of the tabernacle. For we have learned that this is the name of those powers which we see around the divine nature, which powers Isaiah and Ezekiel perceived."],[181,"The ark of the covenant, covered by their wings, should not sound strange to your ears. For it is possible to read the same thing also in Isaiah, where the Prophet speaks in a figure about the wings. The same thing is called the ark of the covenant in one place and in the other place the Face; in the one the ark is covered by the wings, in the other the Face is. It is as though one thing is perceived in both, which suggests to me the incomprehensibility of contemplating the ineffable secrets. And if you should hear about lamps which have many branches coming out of one candlestick so that a full and brilliant light is cast all around, you would correctly conclude that they are the varied rays of the Spirit which shine brightly in this tabernacle. This is what Isaiah is speaking about when he divides the lights of the Spirit into seven."],[182,"The throne of mercy, I think, needs no interpretation since the Apostle laid bare what is hidden when he said, Whom God has appointed to be a throne of mercy for our souls. When I hear of the altar of offering and the altar of incense, I understand the adoration of the heavenly beings which is perpetually offered in this tabernacle. For he says that not only the tongues of those on earth and in the underworld but also of those in the heavens render praise to the beginning of all things. This is the sacrifice pleasing to God, a verbal sacrifice, as the Apostle says, the fragrance of prayer."],[183,"Even if one sees skin dyed red and hair woven, the sequence of contemplation is not broken in this way. For the prophetic eye, attaining to a vision of divine things, will see the saving Passion there predetermined. It is signified in both of the elements mentioned: the redness pointing to blood and the hair to death. Hair on the body has no feeling; hence it is rightly a symbol of death."]],"id":"b2-17","r":[170,183],"w":1463},{"t":"The Earthly Tabernacle","p":[[184,"Whenever the prophet looks to the tabernacle above, he sees the heavenly realities through these symbols. But if one should look at the tabernacle below (since in many places the Church also is called Christ by Paul), it would be well to regard the names \"apostles, teachers, and prophets\" as referring to those servants of the divine mystery whom Scripture also calls pillars of the Church. For it is not only Peter and John and James who are pillars of the Church, nor was only John the Baptist a burning light, but all those who themselves support the Church and become lights through their own works are called \"pillars\" and \"lights.\" You are the light of the world, says the Lord to the Apostles. And again the divine Apostle bids others to be pillars, saying Be steadfast and unmovable. And he made Timothy into an excellent pillar, when he made him (as he says in his own words) a pillar and ground of truth."],[185,"In this tabernacle both the sacrifice of praise and the incense of prayer are seen offered continually at morning and evening. The great David allows us to perceive these things when he directs the incense of his prayer in an odor of sweetness to God, performing his sacrifice through the lifting up of his hands. When hearing about the lavers, one will certainly perceive those who wash away the blemish of sins with mystical water. John was a laver, washing men in the Jordan with the baptism of repentance, as was Peter, who led three thousand at the same time to the water. Philip, too, was a laver of the servant of Candace, and all those who administer grace are lavers to those who share in the free gift."],[186,"The interconnecting courts which surround the tabernacle are fittingly understood as the harmony, love, and peace of believers. David interprets it in this way when he says: Who has granted you peace on your frontiers."],[187,"The skin dyed red and the coverings made of hair, which add to the decoration of the tabernacle, would be perceived respectively as the mortification of the sinful flesh (the figure of which is the skin dyed red) and the ascetic way of life. By these the tabernacle of the church is especially beautified. By nature these skins do not have in themselves a vital power, but they become bright red because of the red dye. This teaches that grace, which flourishes through the Spirit, is not found in men unless they first make themselves dead to sin. Whether or not Scripture signifies by the red dye chaste modesty, I leave for whoever wishes to decide. The woven hair, which produced a fabric rough and hard to the touch, foreshadows the self-control which is rough and consumes the habitual passions. The life of virginity demonstrates in itself all such things, as it chastises the flesh of all those who live this way."],[188,"If the interior, which is called the Holy of Holies, is not accessible to the multitude, let us not think that this is at variance with the sequence of what has been perceived. For the truth of reality is truly a holy thing, a holy of holies, and is incomprehensible and inaccessible to the multitude. Since it is set in the secret and ineffable areas of the tabernacle of mystery, the apprehension of the realities above comprehension should not be meddled with; one should rather believe that what is sought does exist, not that it lies visible to all, but that it remains in the secret and ineffable areas of the intelligence."]],"id":"b2-18","r":[184,188],"w":602},{"t":"The Priestly Vestments","p":[[189,"Having been instructed in these and other such things through the vision of the tabernacle, the eye of Moses' soul, purified and elevated through sights such as these, rises again to the height of other insights when he is instructed in the vestments of the priesthood. Among these are the tunic, the ephod, the breast-piece shining with varied rays from precious stones, the turban for the head and the metal-leaf upon it, the breeches, the pomegranates, the bells, then above all these the rational and the doctrine (and the truth discerned in both), and the shoulder-pieces tied together on both sides and fastened with the names of the patriarchs."],[190,"The very names for the clothing keep most folk from an accurate contemplation of their details. What sort of material garments would be called rational, doctrine, or truth? Indeed, these names clearly illustrate that it is not the perceptible clothing which is traced by the history but a certain adornment of the soul woven by virtuous pursuits."],[191,"The dye of the tunic is blue. Some of those who before us have contemplated the passage say that the dye signifies the air. I, for my part, cannot accurately affirm whether such a color as this has anything in common with the color of the air. Nevertheless, I do not reject it. The perception does lead to the contemplation of virtue, because it requires that he who would be a priest to God also bring his own body to the altar and become a sacrifice, not by being put to death, but by being a living sacrifice and rational service. He should not inflict upon his soul a heavy and fleshy garment of life, but by the purity of his life he should make all the pursuits of life as thin as the thread of a spider web."],[0,"Reweaving this bodily nature, we should be close to what rises upwards and is light and airy, in order that when we hear the last trumpet we may be found weightless and light in responding to the voice of the One who calls us. Then we shall be borne on high through the air to be together with the Lord, not drawn down to earth by anything heavy. He who, in keeping with the counsel of the Psalmist, has like a moth eaten away his soul, has put on that airy tunic which extends from his head to his feet, for the Law does not want virtue to be cut short."],[192,"The golden bells alternating with the pomegranates represent the brilliance of good works. They are the two pursuits through which virtue is acquired, namely, faith toward the divine and conscience toward life. The great Paul adds these pomegranates and bells to Timothy's garment, saying that he should have faith and a good conscience. So let faith sound forth pure and loud in the preaching of the holy Trinity and let life imitate the nature of the pomegranate's fruit."],[193,"Because it is covered with a hard and sour rind, its outside is inedible, but the inside is a pleasant sight with its many neatly ordered seeds and it becomes even sweeter when it is tasted. The philosophical life, although outwardly austere and unpleasant, is yet full of good hopes when it ripens. For when our Gardener opens the pomegranate of life at the proper time and manifests the hidden beauty, then those who partake of their own fruit will enjoy the sweetness. For somewhere the divine Apostle says that any punishment is most painful at the time, and far from pleasant (that is the first contact with the pomegranate): but later, in those on whom it has been used, it bears fruit in peace and goodness. This is the sweetness of the nourishment inside."],[194,"The Scripture commands that this tunic be tasseled. The tassels of the tunic are round pendants which serve no other purpose than decoration alone. We learn from this that virtue should not be measured only by what is required, and that we should discover something extra by our own endeavor, in order that some further adornment might be added to the garment. Thus it was with Paul, who joined his own beautiful tassels to the commandments. For whereas the Law commands that the ministers serving in the Temple get their food from the Temple and those who preach the Gospel should get their living from the Gospel, paul offers the Gospel without charge, being himself in hunger, and thirst, and naked. These are the beautiful tassels which adorn the tunic of the commandments by being added to it."],[195,"Above the long tunic were worn two pieces of cloth which reached from the shoulders down the chest and down the back and were joined to one another by a clasp on each shoulder. The clasps were stones with the names of six patriarchs engraved on each. The cloths were woven of many colors: violet was woven with purple, and scarlet was mixed with linen. Gold thread was interspersed through all this so that from the mixture of the various colors resulted a single radiant beauty."],[196,"From this we learn that the upper part of the outer garment, which is in a particular way an adornment of the heart, is composed of many varied virtues. Now the violet is interwoven with purple, for kingliness is joined to purity of life. Scarlet is mixed with linen because the bright and pure quality of life in some way mingles with the redness of modesty. The gold which lends radiance to these colors foreshadows the treasure reserved for such a life. The patriarchs engraved on the shoulders make a great contribution to our adornment, for men's lives are adorned by the earlier examples of good men."],[197,"Furthermore, there is another adornment worn on top of these beautiful cloths. Little shield-like ornaments of gold hung down from each of the shoulder pieces and held a four-cornered object of gold further brightened by twelve stones arranged in rows. There were four rows, each containing three stones. No two of them were alike, but each was beautified by its own particular radiance."],[198,"That was the outward appearance of the ornament, and this is its meaning: The shield-like ornaments hanging down from both shoulders symbolize the two-fold nature of our armor against the Adversary. Therefore, as I said a short time ago, since the life of virtue is lived in a two-fold way—by faith and a good conscience in life—we are made safe with respect to both by the shields' protection. We remain unwounded by the enemy's darts, by being armed with the weapons of righteousness in the right hand and in the left."],[199,"That four-cornered ornament which hung down from both of the shield-like ornaments and which had on it stones inscribed with the patriarchal names of the tribes protects the heart. Scripture instructs us in this figure that he who repels the evil archer with these two shields will adorn his own soul with all the virtues of the patriarchs, for each stone shines with its own brilliance on the cloth of virtue. Let the four-cornered shape be a demonstration to you of steadfastness
