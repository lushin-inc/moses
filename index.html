d, on the other hand, he also appointed the corruptor who, by an evil and maleficent demon, afflicts the life of man and contrives against our nature."},{"k":"s","p":4,"i":0,"a":4,"t":1322.0,"x":"Because man finds himself between these two who have contrary purposes for him, it is in his power to make the one prevail over the other."},{"k":"s","p":4,"i":1,"a":4,"t":1331.0,"x":"While the good angel by rational demonstration shows the benefits of virtue which are seen in hope by those who live aright, his opponent shows the material pleasures in which there is no hope of future benefits, but which are present, visible, can be partaken of, and enslave the senses of those who do not exercise their intellect."},{"k":"s","p":5,"i":0,"a":4,"t":1352.0,"x":"If, then, one should withdraw from those who seduce him to evil and by the use of his reason turn to the better, putting evil behind him, it is as if he places his own soul, like a mirror, face to face with the hope of good things, with the result that the images and impressions of virtue, as it is shown to him by God, are imprinted on the purity of his soul."},{"k":"s","p":5,"i":1,"a":4,"t":1374.0,"x":"Then his brother brings him assistance and joins him, for the angel, who in a way is a brother to the rational and intellectual part of man's soul, appears, as I have said, and stands by us whenever we approach the Pharaoh."},{"k":"c","a":4,"t":1388.0,"e":1395.0,"l":[[1388.0,"And I'm sure the pharaoh here is sort of the image of the enemy."],[1392.0,"Paragraph 48."]]},{"k":"s","p":6,"i":0,"a":4,"t":1394.0,"x":"If, while trying to parallel completely the historical account to the sequence of such intellectual contemplation, someone should somehow discover something in the account which does not coincide with our understanding, he should not reject the whole enterprise."},{"k":"s","p":6,"i":1,"a":4,"t":1403.8,"x":"He should always keep in mind our discussion's goal, to which we are looking while we relate these details."},{"k":"s","p":6,"i":2,"a":4,"t":1404.9,"x":"We have already said in our prologue that the lives of honored men would be set forth as a pattern of virtue for those who come after them."},{"k":"s","p":7,"i":0,"a":4,"t":1408.0,"x":"Those who emulate their lives, however, cannot experience the identical literal events."},{"k":"s","p":7,"i":1,"a":4,"t":1413.0,"x":"For how could one again find the people multiplying during their sojourn in Egypt?"},{"k":"s","p":7,"i":2,"a":4,"t":1418.0,"x":"And how again find the tyrant who enslaves the people and bears hostility to male offspring and allows the feminine and weaker to grow in numbers?"},{"k":"s","p":7,"i":3,"a":4,"t":1426.0,"x":"And how again find all the other things which Scripture includes?"},{"k":"s","p":7,"i":4,"a":4,"t":1433.0,"x":"Because therefore it has been shown to be impossible to imitate the marvels of these blessed men in these exact events, one might substitute a moral teaching for the literal sequence in those things which admit of such an approach."},{"k":"s","p":7,"i":5,"a":4,"t":1447.0,"x":"In this way those who have been striving toward virtue may find aid in living the virtuous life."},{"k":"c","a":4,"t":1452.2,"e":1485.5,"l":[[1452.2,"the living, the virtuous life."],[1454.0,"So what he's saying here basically is that we should not strive to imitate the saints exactly, sort of in the very literal sense, but we should emulate them."],[1466.0,"That we should sort of realize what it was that they were struggling for."],[1470.0,"And try to do that, try to achieve that, rather than go out and sort of try to retrace their steps exactly because, well, in many cases it would"]]},{"k":"s","p":8,"i":0,"a":4,"t":1485.7,"x":"If the events require dropping from the literal account anything written which is foreign to the sequence of elevated understanding, we pass over this on the grounds that it is useless and unprofitable to our purpose, so as not to interrupt the guidance to virtue at such points."},{"k":"s","p":9,"i":0,"a":4,"t":1503.8,"x":"I say these things concerning the interpretation of Aaron in order to anticipate the objection which will arise from what follows in the narrative."},{"k":"s","p":9,"i":1,"a":4,"t":1513.0,"x":"For someone will say that there is no doubt that the angel does share kinship with the soul in its intellectual and incorporeal aspects, that it already existed before our creation, and that it is allied with those engaged in the fight against the Adversary, but that it is not right to see Aaron, who led the Israelites in the worship of idols, as a type of the angel."},{"k":"s","p":10,"i":0,"a":4,"t":1538.8,"x":"To him we shall reply, passing over the sequence, with the point already made, that what falls outside our purpose is not to overthrow the agreement which exists elsewhere."},{"k":"s","p":10,"i":1,"a":4,"t":1550.0,"x":"Moreover, both words, \"brother\" and \"angel,\" are alike applicable in the meaning they might have to opposite things."},{"k":"s","p":11,"i":0,"a":4,"t":1558.7,"x":"For \"angel\" signifies not only an angel of God but also an angel of Satan."},{"k":"s","p":11,"i":1,"a":4,"t":1564.0,"x":"And we call \"brother\" not only a good brother but also a bad brother."},{"k":"s","p":11,"i":2,"a":4,"t":1567.0,"x":"So the Scripture speaks of the good, Brothers are proved in distress, and of the opposite, Every brother will utterly supplant."},{"k":"c","a":4,"t":1577.0,"e":1629.3,"l":[[1577.0,"Now, I think also in this particular case, well, if you stop and think about the fact that angel also means messenger, you might actually say, well, that we could even in some way see Moses himself as God's angel to both Aaron and the Israelite people, and also in some way to Pharaoh as well, because he brought a message to them all."],[1602.0,"So I think basically what St. Gregory says is that when we interpret these things in spiritual way, we should not constrict ourselves to the literal meaning, to this, to the point where it sort of derails the benefit that we get from the spiritual allegory deliverance announced."],[1622.0,"So sort of the next section subtitle paragraph 54."]]}]},{"t":"Deliverance Announced","p":[[54,"Laying aside these matters for a later point in our discussion where we shall give a fuller interpretation of them in their proper place, let us now turn to what is at hand. Moses, who had been strengthened by the shining light and had acquired such a brother as an ally and supporter, boldly delivered to the people the words of freedom, brought to their remembrance the nobility of their fathers, and gave his judgment how they could escape from their wretched labor of brick making."],[55,"What then does the history teach us by this? That he who has not equipped himself by this kind of spiritual training to instruct the multitude must not presume to speak among the people. For you see how, while he was still young and had not yet matured to so lofty a degree of virtue, two men who were quarreling did not consider his peaceful advice worth accepting, yet now he addresses tens of thousands in the same way. The history all but cries out to you not to be presumptuous in giving advice to your hearers in your teaching unless the ability for this has been perfected in you by a long and exacting training such as Moses had."],[56,"When Moses had spoken these excellent words and had offered his hearers freedom and had strengthened their desire for it, the enemy was provoked and increased the suffering of those who hearkened to his speech. This is not unlike what happens now. For many of those who have accepted the word as a liberator from tyranny and have identified themselves with the Gospel are today still threatened by the Adversary with onslaughts of temptations."],[57,"Many of them do become more firmly established in their faith as they are hardened by these grievous assaults, but some of the weaker ones are beaten to their knees by these misfortunes and say outright that it would have been more useful for them not to have heard the message of freedom than to endure these things for freedom's sake."],[58,"The same thing happened when the Israelites through meanness of spirit blamed those who proclaimed to them deliverance from servitude. But the Word will not cease at all from leading on toward the Good, even if he who is yet young and immature in understanding should, childlike, be fearful of the strangeness of temptations."],[59,"For this demon who does men harm and corrupts them is intensely concerned that his subjects not look to heaven but that they stoop to earth and make bricks within themselves out of the clay. It is clear to everyone that whatever belongs to material pleasure consists assuredly of earth or water, whether one is concerned with the pleasures of the stomach and the table or with the pleasures of wealth."],[60,"The mixture of these elements becomes clay and is so called. Those who yearn after the pleasures of clay and keep on filling themselves with them never keep the space which receives them full; for although it is always being filled, it becomes empty again before the next pouring. In the same way the brick maker keeps on throwing yet more clay into the mould while it is constantly being emptied. I think that anyone can easily perceive the meaning of this figure by looking at the appetitive part of the soul."],[61,"For if he who fills his desire in one of the things which he pursues should then incline his desire to something else, he finds himself empty again in that regard. And if he should fill himself on this, he becomes empty and a vacant container once more for something else. And we never stop doing this until we depart from this material life."],[62,"The straw and its chaff which those subject to the tyrant's orders were required to mix in the brick are interpreted by both the divine Gospel and the sublime voice of the Apostle as material for the fire."]],"id":"b2-4","r":[54,62],"w":660,"x":[{"k":"s","p":0,"i":0,"a":4,"t":1628.0,"x":"Laying aside these matters for a later point in our discussion where we shall give a fuller interpretation of them in their proper place, let us now turn to what is at hand."},{"k":"s","p":0,"i":1,"a":4,"t":1638.0,"x":"Moses, who had been strengthened by the shining light and had acquired such a brother as an ally and supporter, boldly delivered to the people the words of freedom, brought to their remembrance the nobility of their fathers, and gave his judgment how they could escape from their wretched labor of brick making."},{"k":"s","p":1,"i":0,"a":4,"t":1659.0,"x":"What then does the history teach us by this?"},{"k":"s","p":1,"i":1,"a":4,"t":1661.9,"x":"That he who has not equipped himself by this kind of spiritual training to instruct the multitude must not presume to speak among the people."},{"k":"s","p":1,"i":2,"a":4,"t":1670.0,"x":"For you see how, while he was still young and had not yet matured to so lofty a degree of virtue, two men who were quarreling did not consider his peaceful advice worth accepting, yet now he addresses tens of thousands in the same way."},{"k":"s","p":1,"i":3,"a":4,"t":1684.0,"x":"The history all but cries out to you not to be presumptuous in giving advice to your hearers in your teaching unless the ability for this has been perfected in you by a long and exacting training such as Moses had."},{"k":"c","a":4,"t":1697.0,"e":1884.0,"l":[[1697.0,"Now, that makes good sense, because we know that Moses spent sort of the first 40 years of his life and Egypt, and he killed an Egyptian at the age of 40."],[1710.0,"Roughly, that's when he tried to see himself as a liberator to his people."],[1718.0,"They rejected him."],[1719.0,"And only even just two men."],[1721.0,"And one of the two basically said, are you going to kill me like you killed the Egyptian?"],[1725.0,"That is what he's referring to."],[1727.0,"That's what St. Gregory is referring to."],[1729.0,"But then he spent another 40 years in the desert tending to sheep, and you might say learning how to manage."],[1740.0,"Learning how to lead by leading irrational sheep."],[1744.0,"And then God entrusted him with his rational sheep and sent him back."],[1748.0,"And when he came back at the age of 80, he was obviously listened to by people."],[1756.0,"And also that is when God called him."],[1760.0,"So that's."],[1760.0,"That's quite an interesting idea."],[1763.0,"We see that Moses was chosen from his birth."],[1765.0,"You know, his mother noticed that he was a beautiful child, and she hit him against the decree of the Pharaoh to kill the male infants."],[1777.0,"Then he was taken into Pharaoh's palace to be raised as the adopted son of Pharaoh's daughter, which was a miracle also, you know, if you consider that he was a Hebrew child."],[1789.0,"But then the people didn't follow him right away."],[1795.0,"It still took time."],[1796.0,"He had to come back from the desert."],[1798.0,"And of course, we know that St. John the Baptist grew up in the desert."],[1804.0,"And the Lord also, you know, spent a large portion of his life."],[1811.0,"Actually, if you think that the Lord came at the age of 30 to be baptized, and at the age of 33, he was crucified."],[1818.0,"His ministry lasted exactly one tenth of his previous life, only three years out of 30."],[1825.0,"So that is really something to be considered for sure."],[1830.0,"And to those of us who are young, it's a great comfort to realize that we are not to attempt to lead right away, and we are not to worry about that."],[1842.0,"But we are to spend our time in proper preparation."],[1846.0,"Think of it."],[1846.0,"St. Anthony the Great lived with his elder for a long period of time, then he lived in the desert, and then he became a guiding light for the monastics."],[1857.0,"Saint Seraphim of Sorof spent, I think, what is it, 10 years in reclusion, in complete reclusion."],[1863.0,"And only after that the Mother of God appeared to him and said, now you should accept people, you should receive people."],[1869.0,"So most certainly there is a time and place for everything."],[1873.0,"And even Moses was given ample time by God to prepare."],[1877.0,"And that's what we see St. Gregory underscoring here."],[1881.0,"Paragraph 56."]]},{"k":"s","p":2,"i":0,"a":4,"t":1883.0,"x":"When Moses had spoken these excellent words and had offered his hearers freedom and had strengthened their desire for it, the enemy was provoked and increased the suffering of those who hearkened to his speech."},{"k":"s","p":2,"i":1,"a":4,"t":1895.0,"x":"This is not unlike what happens now."},{"k":"s","p":2,"i":2,"a":4,"t":1897.0,"x":"For many of those who have accepted the word as a liberator from tyranny and have identified themselves with the Gospel are today still threatened by the Adversary with onslaughts of temptations."},{"k":"c","a":4,"t":1907.3,"e":1964.5,"l":[[1907.3,"and temptations."],[1908.0,"So basically before their ultimate liberation from the enemy, whenever a person sets out upon the path of virtue and a pious life, the enemy definitely makes things difficult and challenges such a person so as to snuffle out his light at the very beginning, basically to murder him in his infancy."],[1932.0,"And you might say, even drawing on the allegories here, just as Pharaoh was trying to kill the Hebrew children in their infancy, so does the enemy definitely tries to squash this whole liberation plan at the very, very beginning by making the Hebrews lives so much more difficult once they actually accepted Moses and prepared themselves for the liberation that God promised them."]]},{"k":"s","p":3,"i":0,"a":4,"t":1964.0,"x":"Many of them do become more firmly established in their faith as they are hardened by these grievous assaults, but some of the weaker ones are beaten to their knees by these misfortunes and say outright that it would have been more useful for them not to have heard the message of freedom than to endure these things for freedom's sake."},{"k":"c","a":4,"t":1982.0,"e":2013.0,"l":[[1982.0,"Well, and for sure, sometimes we see that happening with the people who come to the life of virtue, and then they say, well, you know, I shouldn't have even bothered."],[1993.0,"You know, things have gotten only worse now that I've started coming to church, or now that I've started praying, or now that I've started reading the Holy Fathers, things are becoming more difficult because obviously the enemy is fighting."],[2004.0,"He's not happy with the fact that we set forth on the path of liberation."],[2010.0,"Paragraph 58."]]},{"k":"s","p":4,"i":0,"a":4,"t":2012.0,"x":"The same thing happened when the Israelites through meanness of spirit blamed those who proclaimed to them deliverance from servitude."},{"k":"s","p":4,"i":1,"a":4,"t":2019.0,"x":"But the Word will not cease at all from leading on toward the Good, even if he who is yet young and immature in understanding should, childlike, be fearful of the strangeness of temptations."},{"k":"c","a":4,"t":2036.0,"e":2050.5,"l":[[2036.0,"So basically, God does not abandon these people who are only starting out just because they're afraid, but he continues to lead them."],[2046.0,"Paragraph 59."]]},{"k":"s","p":5,"i":0,"a":4,"t":2051.0,"x":"For this demon who does men harm and corrupts them is intensely concerned that his subjects not look to heaven but that they stoop to earth and make bricks within themselves out of the clay."},{"k":"s","p":5,"i":1,"a":4,"t":2062.0,"x":"It is clear to everyone that whatever belongs to material pleasure consists assuredly of earth or water, whether one is concerned with the pleasures of the stomach and the table or with the pleasures of wealth."},{"k":"s","p":6,"i":0,"a":4,"t":2077.0,"x":"The mixture of these elements becomes clay and is so called."},{"k":"s","p":6,"i":1,"a":4,"t":2081.8,"x":"Those who yearn after the pleasures of clay and keep on filling themselves with them never keep the space which receives them full; for although it is always being filled, it becomes empty again before the next pouring."},{"k":"s","p":6,"i":2,"a":4,"t":2101.2,"x":"In the same way the brick maker keeps on throwing yet more clay into the mould while it is constantly being emptied."},{"k":"s","p":6,"i":3,"a":4,"t":2109.0,"x":"I think that anyone can easily perceive the meaning of this figure by looking at the appetitive part of the soul."},{"k":"c","a":4,"t":2115.0,"e":2170.0,"l":[[2115.0,"Well, basically, yes."],[2117.0,"Material things and fleshly pleasures never satisfy one who sort of engages in them and actually sort of tries to give them ample satisfaction."],[2131.0,"But contrary to sort of expectation, the more the person pleases himself in a fleshly way, the more the appetite grows."],[2145.0,"So one definitely has to see in that, I guess, a work of the devil, I suppose."],[2151.0,"Well, basically, the more you wrap yourself with the chains of the devil, well, the more you are limited in your movement and the less easy it becomes for you to set yourself free from the passion."],[2167.0,"Paragraph 61."]]},{"k":"s","p":7,"i":0,"a":4,"t":2169.0,"x":"For if he who fills his desire in one of the things which he pursues should then incline his desire to something else, he finds himself empty again in that regard."},{"k":"s","p":7,"i":1,"a":4,"t":2178.0,"x":"And if he should fill himself on this, he becomes empty and a vacant container once more for something else."},{"k":"s","p":7,"i":2,"a":4,"t":2184.0,"x":"And we never stop doing this until we depart from this material life."},{"k":"c","a":4,"t":2190.0,"e":2218.6,"l":[[2190.0,"What a beautiful contrast we see in the Gospel when the Lord speaks to the Samaritan woman at the well, and he says, the water that you drink, you thirst after it again, and you come back and you draw again."],[2203.0,"But the water that I would give you would spring to eternal life, and you would never thirst again."],[2209.0,"So I think this, this is a very, very sort of good point that St. Gregory makes here, paragraph 62."]]},{"k":"s","p":8,"i":0,"a":4,"t":2217.0,"x":"The straw and its chaff which those subject to the tyrant's orders were required to mix in the brick are interpreted by both the divine Gospel and the sublime voice of the Apostle as material for the fire."},{"k":"c","a":4,"t":2233.0,"e":2373.9,"l":[[2233.0,"Well, that's."],[2235.0,"Isn't that very interesting in that he's talking about the material for the fire, I guess maybe, you know, you could say that that material becomes the material for the fire of suffering in Gehenna, the fire that is not quenched according to the Lord."],[2258.0,"And so indeed we see, we see a very interesting parallel here offered to us by St. Gregory."],[2266.0,"My dear viewers, today, if you will allow me, we will stop because we are at a next logical subtitle, the next title here, the subtitle is the Plagues on Egypt."],[2279.0,"So rather than starting and then finishing the broadcast, perhaps we could stop here today and God willing, we should be able to continue next Wednesday morning."],[2291.0,"Let me take a very quick look."],[2293.0,"Next Wednesday will be May 10, and I think there's a service that day in the morning perhaps, but there's nothing in the evening."],[2304.0,"So God willing, we should be able to."],[2307.0,"To continue as we did today."],[2310.0,"Please pray for me."],[2311.0,"Please keep me in your prayers."],[2312.0,"If you, if you have any comments, any suggestions, feel free, of course, to leave a comment below or perhaps contact me directly as well, if that is convenient and I'll be happy to respond."],[2329.0,"Once again, I apologize for a somewhat late start today."],[2333.0,"Let us pray and we will hopefully see you God willing."],[2338.0,"See you, See you next week."],[2342.0,"Shah and shine A new Jerusalem for the glory of the Lord is risen upon thee."],[2348.0,"Rejoice now and be glad of Zion and be radiant, almost pure Theotokos in the resurrection of him whom Thou didst bear."],[2361.0,"Christ has risen."],[2362.0,"God bless all of you."],[2364.0,"Thank you for your support, for your continuous prayers and God willing, we will continue."]]}]},{"t":"The Plagues on Egypt","p":[[63,"Whenever someone who excels in virtue wishes to draw those who have been enslaved by trickery to a life philosophical and free, the one who schemes against our souls with many different deceits (as the Apostle says) knows how to introduce the devices of trickery against the divine law. I am speaking here of the Egyptian serpents in the text, that is, of the many different evil tricks which the rod of Moses destroyed. We have probably already sufficiently interpreted the rod."],[64,"Now he who possesses that invincible rod of virtue which consumes the rods of magic progresses along his course to greater marvels. Marvels are not performed for the purpose of terrifying those who happen to be present, but they look to the benefit of those being saved. By these very marvels of virtue the enemy is defeated and his own people are strengthened."],[65,"If we first learn the general spiritual intent of miracles, we would then be able to apply this insight to individual miracles. True doctrine conforms to the dispositions of those receiving the word, for although the word presents to all equally what is good and bad, the one who is favorably disposed to what is presented has his understanding enlightened, but the darkness of ignorance remains with the one who is obstinately disposed and does not permit his soul to behold the ray of truth. If our general understanding of these things is not false, the specific items would certainly not be different since the individual part is demonstrated with the whole."],[66,"So then, it is not marvelous at all that the Hebrew, although living in the midst of foreigners, remains unaffected by the evils of the Egyptians. One can also see the same thing happening now in populous cities where people are holding contradictory opinions. To some, the stream of faith from which they draw by means of the divine teaching is fresh and clear, but to others, who live as the Egyptians do and draw by means of their own evil presuppositions, the water becomes corrupted blood."],[67,"And many times the master of deceit endeavors to turn the drink of the Hebrews also into blood by polluting it with falsehood, that is, by presenting our doctrine to us as different from what it really is. But he cannot make the water wholly unusable, even if he should easily turn it red by his trickery. For since he pays no attention to the optical illusion, the Hebrew drinks the true water, even though he is successfully misled by his adversaries."],[68,"The same applies to the frogs—ugly and noisy amphibians, leaping about, not only unpleasant to the sight, but also having a foul-smelling skin—they entered the houses, beds, and storerooms of the Egyptians, but they did not affect the life of the Hebrews."],[69,"The breed of frogs is obviously the destructive offspring of the evil which is brought to life from the sordid heart of men as though from some slimy mire. These frogs overrun the houses of those who choose to live the Egyptian life, appearing on the tables, not even sparing the beds, and entering the very storerooms."],[70,"One sees in the sordid and licentious life that which is indeed born out of clay and mire and that which, through imitation of the irrational, remains in a form of life neither altogether human nor frog. Being a man by nature and becoming a beast by passion, this kind of person exhibits an amphibious form of life ambiguous in nature. In addition, one will also find the evidences of such an illness, not only on the bed, but also on the table and in the storeroom and throughout the house."],[71,"For such a man shows his profligacy in everything so that everyone readily recognizes the life of the profligate and the life of the pure man by what is valued in each one's household. In the house of the one there are frescoes on the wall which by their artful pictures inflame the sensual passions. These things bring out the nature of the illness, and through the eye passion pours in upon the soul from the dishonorable things which are seen. But in the house of the prudent man there is every precaution and foresight to keep the eye pure from sensual spectacles."],[72,"The table of the prudent man is similarly found to be pure, but that of the man wallowing in the mire is frog-like and fleshy. And if you search the storeroom, that is to say the secret and unmentionable things of his life, you will discern there in his licentiousness a much greater pile of frogs."]],"id":"b2-5","r":[63,72],"w":775,"x":[{"k":"c","a":5,"t":0.0,"e":68.4,"l":[[0.0,"Foreign."],[5.0,"The Father and of the Son of the Holy Spirit."],[7.0,"Amen."],[7.0,"Christ is Risen Dear brothers and sisters, welcome back to our weekly readings."],[13.0,"Let us pray and begin."],[19.0,"Christ is risen from the dead, trampling down death by death, and on those in the tombs bestowing life."],[28.0,"Christ is risen from the dead, trampling down death by death, and on those in the tombs bestowing life."],[36.0,"Christ is risen from the dead, trampling down death by death, and on those in the tombs bestowing life."],[50.0,"Today we are proceeding with our reading, and we will be reading about the plagues on Egypt."],[66.0,"Paragraph 63"]]},{"k":"s","p":0,"i":0,"a":5,"t":66.8,"x":"Whenever someone who excels in virtue wishes to draw those who have been enslaved by trickery to a life philosophical and free, the one who schemes against our souls with many different deceits (as the Apostle says) knows how to introduce the devices of trickery against the divine law."},{"k":"s","p":0,"i":1,"a":5,"t":88.0,"x":"I am speaking here of the Egyptian serpents in the text, that is, of the many different evil tricks which the rod of Moses destroyed."},{"k":"s","p":0,"i":2,"a":5,"t":96.0,"x":"We have probably already sufficiently interpreted the rod."},{"k":"s","p":1,"i":0,"a":5,"t":110.0,"x":"Now he who possesses that invincible rod of virtue which consumes the rods of magic progresses along his course to greater marvels."},{"k":"s","p":1,"i":1,"a":5,"t":121.0,"x":"Marvels are not performed for the purpose of terrifying those who happen to be present, but they look to the benefit of those being saved."},{"k":"s","p":1,"i":2,"a":5,"t":129.0,"x":"By these very marvels of virtue the enemy is defeated and his own people are strengthened."},{"k":"c","a":5,"t":136.0,"e":157.4,"l":[[136.0,"While own people here, I am sure, refers to the people of God."],[142.0,"And obviously, if the man takes hold of the rod of virtues, he sees great marvels performed by God for the benefit of those who are being saved."],[155.0,"Paragraph 65"]]},{"k":"s","p":2,"i":0,"a":5,"t":155.8,"x":"If we first learn the general spiritual intent of miracles, we would then be able to apply this insight to individual miracles."},{"k":"s","p":2,"i":1,"a":5,"t":165.0,"x":"True doctrine conforms to the dispositions of those receiving the word, for although the word presents to all equally what is good and bad, the one who is favorably disposed to what is presented has his understanding enlightened, but the darkness of ignorance remains with the one who is obstinately disposed and does not permit his soul to behold the ray of truth."},{"k":"s","p":2,"i":2,"a":5,"t":189.0,"x":"If our general understanding of these things is not false, the specific items would certainly not be different since the individual part is demonstrated with the whole."},{"k":"c","a":5,"t":198.3,"e":258.4,"l":[[198.3,"a whole."],[199.0,"Now, in this particular case, I think what he's basically saying is that it happens to most of us that if we are disposed toward hearing the word of God and hearing the word of salvation, then most definitely whatever we hear being preached to us or shared with us from the lives of the saints or from the holy Scriptures or from the writings of the saints, we accept more readily and benefit from what we hear."],[234.0,"But those who are disposed unfavorably toward the work of salvation, and any word of the gospel is perceived by them in a negative way."],[247.0,"And then, of course, they don't want to hear it, they don't want to accept it."]]},{"k":"s","p":3,"i":0,"a":5,"t":259.0,"x":"So then, it is not marvelous at all that the Hebrew, although living in the midst of foreigners, remains unaffected by the evils of the Egyptians."},{"k":"s","p":3,"i":1,"a":5,"t":269.0,"x":"One can also see the same thing happening now in populous cities where people are holding contradictory opinions."},{"k":"s","p":3,"i":2,"a":5,"t":275.0,"x":"To some, the stream of faith from which they draw by means of the divine teaching is fresh and clear, but to others, who live as the Egyptians do and draw by means of their own evil presuppositions, the water becomes corrupted blood."},{"k":"c","a":5,"t":290.0,"e":375.5,"l":[[290.0,"So now what he's saying basically is in an allegorical way, is it not marvelous that Moses, being a Hebrew and believing in the true God, lived in the midst of the Egyptians and lived in a palace of all places, does not become affected by their habits?"],[316.0,"And St. Gregory says, in a similar way, people living in his contemporary cities, those that hold on to their faith, are unaffected and continue to drink fresh water."],[333.0,"But those who are perverted by the ways of this world and by its corrupt pleasures, to them the same waters become blood."],[347.0,"Basically, they become unusable."],[349.0,"So I think that's fair."],[355.0,"St. Paul the Apostle says that to us who are being saved, the word of the cross is through God's power for salvation."],[365.0,"But to those who do not believe, it is a stumbling block, and it is foolishness."],[373.0,"Chapter 67."]]},{"k":"s","p":4,"i":0,"a":5,"t":374.0,"x":"And many times the master of deceit endeavors to turn the drink of the Hebrews also into blood by polluting it with falsehood, that is, by presenting our doctrine to us as different from what it really is."},{"k":"s","p":4,"i":1,"a":5,"t":386.0,"x":"But he cannot make the water wholly unusable, even if he should easily turn it red by his trickery."},{"k":"s","p":4,"i":2,"a":5,"t":391.0,"x":"For since he pays no attention to the optical illusion, the Hebrew drinks the true water, even though he is successfully misled by his adversaries."},{"k":"c","a":5,"t":402.0,"e":503.5,"l":[[402.0,"I think in this particular case, the references to the fact that the enemy tries his best to introduce false beliefs into sort of the."],[415.0,"The."],[417.0,"What would you call it?"],[418.0,"The collection of."],[419.0,"You know, sort of the."],[424.0,"The codex, so to speak, of faith of an orthodox Christian."],[428.0,"And thus he manages to turn the water looking red, but it isn't entirely blood to those who draw it with faith."],[440.0,"And we see that in some cases, indeed even people who profess themselves to be orthodox Christians manifest some odd Beliefs that they pick up who knows where, certainly not in the Church."],[456.0,"They're not taught that by the holy fathers."],[459.0,"They're not taught that even by the sinful fathers such as myself."],[464.0,"We are not introducing any new beliefs."],[468.0,"Yet the world is continuously trying to install its own ideas into the minds of the faithful and those who are not careful, of course, force can fall prey to these fallacies, to these mistakes."],[483.0,"Yet if they hold on to the Church, then they are safe."],[488.0,"Because if they say, well, whatever the Church teaches is what I believe, not personally, what sort of I arrive at by my own corrupt mind."],[497.0,"And then there's great safety in that."],[501.0,"Paragraph 68."]]},{"k":"s","p":5,"i":0,"a":5,"t":502.0,"x":"The same applies to the frogs—ugly and noisy amphibians, leaping about, not only unpleasant to the sight, but also having a foul-smelling skin—they entered the houses, beds, and storerooms of the Egyptians, but they did not affect the life of the Hebrews."},{"k":"c","a":5,"t":520.0,"e":635.5,"l":[[520.0,"And so you might say, for example, this could be sort of paralleled or an allegory."],[528.0,"It could be drawn to various superstitions and sort of vain beliefs and false beliefs that the people following this world easily attempt."],[540.0,"And these vain and false beliefs enter very quickly the minds and the hearts of the people who are not identifying themselves firmly with the Church and who are not holding firmly to the Church's teaching."],[554.0,"Now in particular, I think Theodore Dostoevsky said many, many, many years ago that a couple centuries ago that if you take people's faith in God away from them, they'll believe in anything."],[573.0,"And I think there are ample examples of that in the current world where people who do not believe in God, who do not associate themselves with the true Orthodox Church, with the Christian Church, the true Christian Church, which we believe is the Orthodox Church."],[596.0,"Such people easily believe in aliens in extrasensory perception and various various other things that in the end really complicate and sort of make their lives way more difficult and unpleasant in some cases even unbeknownst to the people, you know, because maybe the Egyptians also, they were bothered by the frogs, but they didn't know where they came from and they certainly couldn't do anything about them."],[628.0,"So that is an interesting idea and an interesting thought."],[632.0,"Paragraph 69."]]},{"k":"s","p":6,"i":0,"a":5,"t":635.0,"x":"The breed of frogs is obviously the destructive offspring of the evil which is brought to life from the sordid heart of men as though from some slimy mire."},{"k":"s","p":6,"i":1,"a":5,"t":645.1,"x":"These frogs overrun the houses of those who choose to live the Egyptian life, appearing on the tables, not even sparing the beds, and entering the very storerooms."},{"k":"c","a":5,"t":654.6,"e":671.4,"l":[[654.6,"entering the very storerooms."],[656.0,"So basically These false beliefs and superstitions can easily permeate every facet of an unbeliever's life and make it very, very difficult."]]},{"k":"s","p":7,"i":0,"a":5,"t":670.4,"x":"One sees in the sordid and licentious life that which is indeed born out of clay and mire and that which, through imitation of the irrational, remains in a form of life neither altogether human nor frog."},{"k":"s","p":7,"i":1,"a":5,"t":685.0,"x":"Being a man by nature and becoming a beast by passion, this kind of person exhibits an amphibious form of life ambiguous in nature."},{"k":"s","p":7,"i":2,"a":5,"t":694.0,"x":"In addition, one will also find the evidences of such an illness, not only on the bed, but also on the table and in the storeroom and throughout the house."},{"k":"c","a":5,"t":705.0,"e":817.5,"l":[[705.0,"I think this is an interesting idea that he mentions the frogs and the amphibians here and you know, sort of a sordid and licentious life which is identified with them in his mind."],[720.0,"And I think it's quite interesting and very telling that modern day psychology and sort of motivational speaking and various experts talk about what they call the lizard brain."],[738.0,"And they say that, you know, the lizard brain is that part of human being which is responsible for basic survival."],[748.0,"You know, when we sort of are faced with a situation where we have to fight or flee, sort of the lizard brain takes over."],[756.0,"But that lizard brain, yes, it's, let's see, eat, procreate and fight to survive."],[766.0,"That's, that's about it."],[767.0,"That's about the extent of it."],[769.0,"So not very noble at all."],[772.0,"And it's quite interesting that there is such a parallel and our modern day and time, when people refer to what they call the lizard brain, or if not the lizard brain, what is the word for it?"],[789.0,"Sometimes the, Not the serpent brain, not the lizard brain, but sort of the animal part, you know, sort of the, the very, very basic one, the reptilian."],[807.0,"That's it, the reptilian brain."],[810.0,"Sometimes also that's what the people refer to, chapter or paragraph 71."]]},{"k":"s","p":8,"i":0,"a":5,"t":816.0,"x":"For such a man shows his profligacy in everything so that everyone readily recognizes the life of the profligate and the life of the pure man by what is valued in each one's household."},{"k":"s","p":8,"i":1,"a":5,"t":826.0,"x":"In the house of the one there are frescoes on the wall which by their artful pictures inflame the sensual passions."},{"k":"s","p":8,"i":2,"a":5,"t":833.0,"x":"These things bring out the nature of the illness, and through the eye passion pours in upon the soul from the dishonorable things which are seen."},{"k":"s","p":8,"i":3,"a":5,"t":841.0,"x":"But in the house of the prudent man there is every precaution and foresight to keep the eye pure from sensual spectacles."},{"k":"c","a":5,"t":848.0,"e":863.3,"l":[[848.0,"Well, I, I don't know that that really requires any sort of further explanation."],[857.0,"I think that's very well said as it is."],[861.0,"Paragraph 72"]]},{"k":"s","p":9,"i":0,"a":5,"t":861.7,"x":"The table of the prudent man is similarly found to be pure, but that of the man wallowing in the mire is frog-like and fleshy."},{"k":"s","p":9,"i":1,"a":5,"t":871.0,"x":"And if you search the storeroom, that is to say the secret and unmentionable things of his life, you will discern there in his licentiousness a much greater pile of frogs."},{"k":"c","a":5,"t":881.6,"e":909.0,"l":[[881.6,"fragments."],[882.0,"Frogs."],[883.0,"So basically, if."],[884.0,"If by frogs we're talking about defilement and impurity, well, obviously if you search the hidden aspects of a man's life, well, you'll find that there's some very dishonorable and unpleasant things hiding."],[903.0,"The next Chapter the Hardening of Pharaoh's Heart and free will paragraph"]]}]},{"t":"The Hardening of Pharaoh's Heart and Free Will","p":[[73,"Let us not be astonished if the history says that the rod of virtue did these things to the Egyptians, for it also says that the tyrant was hardened by God. Now, how could he be condemned if he were disposed by divine constraint to be stubborn and obstinate? Somewhere the divine Apostle also expresses the same thought: Since they refused to see it was rational to acknowledge God, he abandoned them to shameful passions, speaking about those who commit sodomy and those who disgrace themselves by dishonorable and unmentionable profligacy."],[74,"But even if what has been said before is so stated by Scripture, and God does in this way entirely give up to dishonorable passions the one who gives himself up to them, still Pharaoh is not hardened by the divine will nor is the frog-like life fashioned by virtue. For if this were to be willed by the divine nature, then certainly any human choice would fall into line in every case, so that no distinction between virtue and vice in life could be observed. People live differently—some live uprightly in virtue while others slide into vice. One would not reasonably attribute these differences in their lives to some divine constraint which lies outside themselves. It lies within each person's power to make this choice."],[75,"Who it is who is delivered up to shameful affections can be clearly learned from the Apostle: It is he who does not like to have God in his knowledge. God delivers up to passion him whom he does not protect because he is not acknowledged by him. But his failure to acknowledge God becomes the reason why he is being pulled down into the passionate and dishonorable life."],[76,"It is as if someone who has not seen the sun blames it for causing him to fall into the ditch. Yet we do not hold that the luminary in anger pushes into the ditch someone who does not choose to look at it. Rather, we would interpret this statement in a more reasonable manner: It is the failure to participate in the light that causes the person who does not see to fall into the ditch. In the same way, the thought of the Apostle should be clear, that it is those who do not acknowledge God who are delivered up to shameful affections, and that the Egyptian tyrant is hardened by God not because the divine will places the resistance in the soul of Pharaoh but because the free will through its inclination to evil does not receive the word which softens resistance."],[77,"In the same way also, when the rod of virtue appeared among the Egyptians, it made the Hebrews pure from the frog-like life but showed the Egyptians to be full of this illness."],[78,"When Moses stretched forth his hands on the Egyptians' behalf, the frogs were instantly destroyed. This can also be seen happening now. For those who perceive the outstretched hands of the lawgiver—you understand, surely, what the figure says to you, and perceive in the lawgiver the true Lawgiver and in his outstretched hands him who stretched forth his hands upon the cross —those then who for a short time have lived with these sordid and frog-like thoughts, if they look to him who stretched forth his hands on our behalf, are set free from their evil life as their passion is put to death and left stinking."],[79,"Truly, after the death of the frog-like emotions, the former manner of life of those who have been delivered from such an illness becomes to them a foul and odorous memory which disgusts the soul in shame. It is as the Apostle says to those changed from evil to virtue: What did you get from this? Nothing but experiences that now make you blush."],[80,"In keeping with this insight of mine, consider the air which is darkened to the Egyptians' eyes by the rod while to the Hebrews' it is illuminated by the sun. By this incident the meaning which we have given is confirmed. It was not some constraining power from above that caused the one to be found in darkness and the other in light, but we men have in ourselves, in our own nature and by our own choice, the causes of light or of darkness, since we place ourselves in whichever sphere we wish to be."],[81,"According to the history, the eyes of the Egyptians were not in darkness because some wall or mountain darkened their view and shadowed the rays, but the sun cast its rays upon all equally. Whereas the Hebrews delighted in its light, the Egyptians were insensitive to its gift. In a similar manner the enlightened life is proposed to all equally according to their ability. Some continue on in darkness, driven by their evil pursuits to the darkness of wickedness, while others are made radiant by the light of virtue."],[82,"Perhaps someone, taking his departure from the fact that after three days of distress in darkness the Egyptians did share in the light, might be led to perceive the final restoration which is expected to take place later in the kingdom of heaven of those who have suffered condemnation in Gehenna. For that darkness that could be felt, as the history says, has a great affinity both in its name and in its actual meaning to the exterior darkness. Both are dispelled when Moses, as we have perceived before, stretched forth his hands on behalf of those in darkness."],[83,"In the same way we would perceive the true meaning of the furnace asbes which, according to the text, produced painful boils on the Egyptians. In the figure of what is called the \"furnace\" we perceive the threatened punishment of fire in Gehenna which touches only those who imitate the Egyptians in their manner of life."],[84,"If anyone is truly an Israelite, a son of Abraham, and looks to him in life in such a way as to show by his own free will his kinship in race to the elect people, he is kept unharmed from that painful fire. The interpretation of Moses' outstretched hands which we have already given may become for those others also the healing of pain and the deliverance from punishment."],[85,"If one follows the sequence of our earlier investigations, he will have no trouble attaching to each plague the corresponding perception: those light gadflies which tormented the Egyptians with their unseen bites, the flies which clung painfully with their bites to their bodies, the tillage which was ravaged by the locusts, and the storms from heaven which rained down hailstones."],[86,"The Egyptians' free will caused all these things according to the preceding principle, and the impartial justice of God followed their free choices and brought upon them what they deserved. As we follow closely the reading of the text at hand, let us not draw the conclusion that these distresses upon those who deserved them came directly from God, but rather let us observe that each man makes his own plagues when through his own free will he inclines toward these painful experiences. The Apostle says the same thing when talking to such a person: Your stubborn refusal to repent is only adding to the anger God will have toward you on that day of anger when his just judgments will be made known. He will repay each one as his works deserve."],[87,"What we are describing is like some destructive and bilious humor which arises in the intestines because of a dissipated life. When the physician induces vomiting by his medicines, he does not become the cause of the sickness in the body, but on the contrary it is disorderly eating habits which bring it about; medical knowledge only brought it into the open. In the same way, even if one says that painful retribution comes directly from God upon those who abuse their free will, it would only be reasonable to note that such sufferings have their origin and cause in ourselves."],[88,"To the one who has lived without sin there is no darkness, no worm, no Gehenna, no fire, nor any other of these fearful names and things, as indeed the history goes on to say that the plagues of Egypt were not meant for the Hebrews. Since then in the same place evil comes to one but not to the other, the difference of free choices distinguishing each from the other, it is evident that nothing evil can come into existence apart from our free choice."]],"id":"b2-6","r":[73,88],"w":1425,"x":[{"k":"s","p":0,"i":0,"a":5,"t":907.7,"x":"Let us not be astonished if the history says that the rod of virtue did these things to the Egyptians, for it also says that the tyrant was hardened by God."},{"k":"s","p":0,"i":1,"a":5,"t":920.0,"x":"Now, how could he be condemned if he were disposed by divine constraint to be stubborn and obstinate?"},{"k":"s","p":0,"i":2,"a":5,"t":926.0,"x":"Somewhere the divine Apostle also expresses the same thought:"},{"k":"s","p":0,"i":3,"a":5,"t":929.0,"x":"Since they refused to see it was rational to acknowledge God, he abandoned them to shameful passions, speaking about those who commit sodomy and those who disgrace themselves by dishonorable and unmentionable profligacy."},{"k":"c","a":5,"t":945.1,"e":1002.3,"l":[[945.1,"I recall in the writings of Saint Ephraim the Syrian, in his commentary on the Book of Exodus, he actually points out the fact that in the Scripture there is a mention of the fact that Pharaoh hardened himself."],[965.0,"Now there is mention of God hardening the heart of Pharaoh, but also in another place it says in Pharaoh hardened himself, or, you know, sort of stiffened himself."],[975.0,"And Saint Ephrem the Syrian makes the point that he wasn't just God who did this to Pharaoh."],[982.0,"God allowed Pharaoh to harden himself."],[985.0,"He gave him the free will to do that."],[988.0,"And Pharaoh of course did did that on his own."],[992.0,"Because otherwise, of course, if he was hardened by God, how can God hold him accountable for that?"],[1000.0,"Paragraph 74"]]},{"k":"s","p":1,"i":0,"a":5,"t":1000.7,"x":"But even if what has been said before is so stated by Scripture, and God does in this way entirely give up to dishonorable passions the one who gives himself up to them, still Pharaoh is not hardened by the divine will nor is the frog-like life fashioned by virtue."},{"k":"s","p":1,"i":1,"a":5,"t":1019.0,"x":"For if this were to be willed by the divine nature, then certainly any human choice would fall into line in every case, so that no distinction between virtue and vice in life could be observed."},{"k":"s","p":1,"i":2,"a":5,"t":1030.3,"x":"People live differently—some live uprightly in virtue while others slide into vice."},{"k":"s","p":1,"i":3,"a":5,"t":1035.0,"x":"One would not reasonably attribute these differences in their lives to some divine constraint which lies outside themselves."},{"k":"s","p":1,"i":4,"a":5,"t":1042.0,"x":"It lies within each person's power to make this choice."},{"k":"c","a":5,"t":1047.0,"e":1121.0,"l":[[1047.0,"Well, I think exactly."],[1048.0,"Because if we didn't have the free will, if our sin or virtue was not the consequence of our own choice and consequent action, well, then how can we be held accountable?"],[1061.0,"And I think that is the very nature of the reason why in some cases we're hearing some people trying to claim that they were born a certain way, that they, you know, sort of were made by God a certain way, which is rather blasphemous if you think, because basically what they're saying is whatever it is that you think I'm doing, which is wrong is not wrong because I was born that way."],[1089.0,"I was made this way by God, by evolution, it doesn't really matter."],[1094.0,"But they try to justify their poor behavior and poor sort of, you know, moral choices in life by saying that they were born that way."],[1105.0,"And we see the other side of it, where St. Gregory says, well, if God made him this way, how could he punish him?"],[1113.0,"So, most obviously, God gives everyone a choice."],[1117.0,"Paragraph 75. Who."]]},{"k":"s","p":2,"i":0,"a":5,"t":1120.0,"x":"Who it is who is delivered up to shameful affections can be clearly learned from the Apostle:"},{"k":"s","p":2,"i":1,"a":5,"t":1126.0,"x":"It is he who does not like to have God in his knowledge."},{"k":"s","p":2,"i":2,"a":5,"t":1129.0,"x":"God delivers up to passion him whom he does not protect because he is not acknowledged by him."},{"k":"s","p":2,"i":3,"a":5,"t":1139.0,"x":"But his failure to acknowledge God becomes the reason why he is being pulled down into the passionate and dishonorable life."},{"k":"c","a":5,"t":1147.0,"e":1212.5,"l":[[1147.0,"Now someone might say, well, what is it that God sort of takes vengeance on the people who refuse to believe in Him."],[1155.0,"I don't think that God plunges them into a sinful life himself, because God is good, and in him there is no shadow of evil, not even the slightest."],[1168.0,"However, he leaves men to their own devices."],[1174.0,"And if these men cling to him and cling to a righteous life, he protects them and allows them to live in a way that is pleasing to him and also beneficial to them who turn to God."],[1187.0,"But those who turn away from God, those who forget about his existence, those who sort of reject him outright or deny his existence, of course they are easy prey to the evil spirits, to false beliefs, and as a consequence, also to a dishonorable and passionate life."],[1208.0,"Paragraph 76."]]},{"k":"s","p":3,"i":0,"a":5,"t":1213.0,"x":"It is as if someone who has not seen the sun blames it for causing him to fall into the ditch."},{"k":"s","p":3,"i":1,"a":5,"t":1219.0,"x":"Yet we do not hold that the luminary in anger pushes into the ditch someone who does not choose to look at it."},{"k":"s","p":3,"i":2,"a":5,"t":1225.0,"x":"Rather, we would interpret this statement in a more reasonable manner:"},{"k":"s","p":3,"i":3,"a":5,"t":1229.0,"x":"It is the failure to participate in the light that causes the person who does not see to fall into the ditch."},{"k":"s","p":3,"i":4,"a":5,"t":1236.0,"x":"In the same way, the thought of the Apostle should be clear, that it is those who do not acknowledge God who are delivered up to shameful affections, and that the Egyptian tyrant is hardened by God not because the divine will places the resistance in the soul of Pharaoh but because the free will through its inclination to evil does not receive the word which softens resistance."},{"k":"c","a":5,"t":1261.0,"e":1320.5,"l":[[1261.0,"So basically God hardened the Pharaoh's heart not in terms of sort of directly harding it and saying here, just don't let them go, don't let this do, don't let this happen."],[1275.0,"But he allowed his heart to be hardened by giving him the free will."],[1279.0,"And when Pharaoh said, well, I don't believe in you God, why should I allow you to go and worship him?"],[1286.0,"Well obviously then he allowed his heart to be hardened."],[1291.0,"And since Pharaoh did not incline his heart toward the pleas of Moses, who said, basically, well, you know, allow us to do this, allow us to leave and respect our God, well then of course, since he refused to do that, well, he certainly didn't have any benefit whatsoever at all from hearing that appeal by Moses."],[1318.0,"Paragraph 77."]]},{"k":"s","p":4,"i":0,"a":5,"t":1319.0,"x":"In the same way also, when the rod of virtue appeared among the Egyptians, it made the Hebrews pure from the frog-like life but showed the Egyptians to be full of this illness."},{"k":"c","a":5,"t":1330.0,"e":1360.4,"l":[[1330.0,"So basically the punishments of Egypt, the plagues, sort of the 10 punishments, the 10 plagues, they manifested in a very visible and outward manner, sort of the internal corruption of the spirit of the Egyptian life and the vain and false beliefs and worship of the false gods and idols and so on."],[1358.0,"Paragraph 78,"]]},{"k":"s","p":5,"i":0,"a":5,"t":1358.9,"x":"When Moses stretched forth his hands on the Egyptians' behalf, the frogs were instantly destroyed."},{"k":"s","p":5,"i":1,"a":5,"t":1366.0,"x":"This can also be seen happening now."},{"k":"s","p":5,"i":2,"a":5,"t":1368.9,"x":"For those who perceive the outstretched hands of the lawgiver—you understand, surely, what the figure says to you, and perceive in the lawgiver the true Lawgiver and in his outstretched hands him who stretched forth his hands upon the cross —those then who for a short time have lived with these sordid and frog-like thoughts, if they look to him who stretched forth his hands on our behalf, are set free from their evil life as their passion is put to death and left stinking."},{"k":"c","a":5,"t":1380.0,"e":1392.2,"l":[[1380.0,"So he has the small L and the capital L Lawgiver."],[1384.0,"The small L lawgiver would be Moses, and the capital L lawgiver would be Christ, of course,"]]},{"k":"c","a":5,"t":1395.6,"e":1402.3,"l":[[1395.6,"cross."],[1396.0,"So you know, when Moses stretched his hands like this, the frogs were"]]},{"k":"c","a":5,"t":1417.2,"e":1554.2,"l":[[1417.2,"left stinking."],[1418.0,"Now, St. Mary of Egypt, I think, gives a most beautiful example of the fact that she had committed 17 years of her life to awful, awful, awful sort of debauchery and terrible profligate lifestyle."],[1442.0,"And yet, when she looked at the cross, when she wanted to venerate the cross and she couldn't, she was brought to repentance."],[1450.0,"She realized who she was, and."],[1457.0,"She was given victory over that desire of the flesh, even though the desire wasn't dead instantly."],[1465.0,"Because we HEAR she's telling Saint Zasema that she struggled for 17 years in the desert."],[1472.0,"The memories of Egypt haunted her and caused her tremendous spiritual and perhaps even physical pain because she was very much tempted to want to go back and return to that life."],[1485.0,"However, she had the victory over it because she remained pure."],[1490.0,"She remained in her repentance."],[1493.0,"She said that she would fall to the ground and strike her chest and pray to God and say, I would rather die here than return back to this life."],[1501.0,"So even though that life had a tremendous pull, tremendous attraction for her, she was given the victory."],[1508.0,"So upon her contemplation, both material and physical, with her own eyes, she saw, perhaps in the church at a distance, the true cross of the Lord that she wanted to go and venerate."],[1524.0,"She also spiritually saw the cross and wanted, with sort of the eyes of her heart and wanted to cling to it, wanted to draw near it."],[1534.0,"When she realized she couldn't because of her sinfulness, she overcame her passion."],[1540.0,"So I think in this particular example of the interpretation of that passage from the Book of exodus, I think St. Mary of Egypt is a beautiful example of the allegory"]]},{"k":"s","p":6,"i":0,"a":5,"t":1554.0,"x":"Truly, after the death of the frog-like emotions, the former manner of life of those who have been delivered from such an illness becomes to them a foul and odorous memory which disgusts the soul in shame."},{"k":"s","p":6,"i":1,"a":5,"t":1568.0,"x":"It is as the Apostle says to those changed from evil to virtue:"},{"k":"s","p":6,"i":2,"a":5,"t":1573.0,"x":"What did you get from this?"},{"k":"s","p":6,"i":3,"a":5,"t":1574.0,"x":"Nothing but experiences that now make you blush."},{"k":"c","a":5,"t":1579.0,"e":1642.5,"l":[[1579.0,"That's very interesting."],[1581.0,"Maybe that's just sort of an unconventional translation, but most definitely I would also say that St. Paul perhaps could be mentioned here in a different instance, where he says, woe unto me, because the things that I love, I do not do and want to do, I do not do."],[1602.0,"But the things that I hate, I, I do."],[1605.0,"Wretched man that I am, who will deliver me from the body of this death."],[1609.0,"So it's like he is surrounded, you know, by a foul smelling dead body that he wants to be delivered from because of its stench, you know."],[1618.0,"And yet it's still, you know, attached to him and requires a tremendous spiritual struggle on his part and perseverance to be freed from it."],[1630.0,"So St. Mary of Egypt for 17 years was attached to the memories of Egypt, and so on and so forth."],[1636.0,"So food for thought, for sure."],[1640.0,"Paragraph 80."]]},{"k":"s","p":7,"i":0,"a":5,"t":1641.0,"x":"In keeping with this insight of mine, consider the air which is darkened to the Egyptians' eyes by the rod while to the Hebrews' it is illuminated by the sun."},{"k":"s","p":7,"i":1,"a":5,"t":1652.0,"x":"By this incident the meaning which we have given is confirmed."},{"k":"s","p":7,"i":2,"a":5,"t":1656.0,"x":"It was not some constraining power from above that caused the one to be found in darkness and the other in light, but we men have in ourselves, in our own nature and by our own choice, the causes of light or of darkness, since we place ourselves in whichever sphere we wish to be."},{"k":"c","a":5,"t":1676.0,"e":1707.5,"l":[[1676.0,"I think that too really requires almost no commentary."],[1681.0,"But he's saying here that the Spirit, spiritual Son, Christ, the Son of righteousness, he shines for all men equally, for all the people equally."],[1692.0,"But those who choose to live the life of sin are devoid."],[1697.0,"They are sort of empty."],[1699.0,"They don't have his light, and they walk as though they were walking in darkness and were blind."],[1705.0,"Paragraph 81."]]},{"k":"s","p":8,"i":0,"a":5,"t":1706.0,"x":"According to the history, the eyes of the Egyptians were not in darkness because some wall or mountain darkened their view and shadowed the rays, but the sun cast its rays upon all equally."},{"k":"s","p":8,"i":1,"a":5,"t":1718.0,"x":"Whereas the Hebrews delighted in its light, the Egyptians were insensitive to its gift."},{"k":"s","p":8,"i":2,"a":5,"t":1723.0,"x":"In a similar manner the enlightened life is proposed to all equally according to their ability."},{"k":"s","p":8,"i":3,"a":5,"t":1729.0,"x":"Some continue on in darkness, driven by their evil pursuits to the darkness of wickedness, while others are made radiant by the light of virtue."},{"k":"c","a":5,"t":1738.0,"e":1748.0,"l":[[1738.0,"I dare not comment on that."],[1740.0,"I think that's very beautifully and clearly said."],[1745.0,"Paragraph 82."]]},{"k":"s","p":9,"i":0,"a":5,"t":1747.0,"x":"Perhaps someone, taking his departure from the fact that after three days of distress in darkness the Egyptians did share in the light, might be led to perceive the final restoration which is expected to take place later in the kingdom of heaven of those who have suffered condemnation in Gehenna."},{"k":"s","p":9,"i":1,"a":5,"t":1765.0,"x":"For that darkness that could be felt, as the history says, has a great affinity both in its name and in its actual meaning to the exterior darkness."},{"k":"s","p":9,"i":2,"a":5,"t":1775.0,"x":"Both are dispelled when Moses, as we have perceived before, stretched forth his hands on behalf of those in darkness."},{"k":"c","a":5,"t":1789.0,"e":1797.5,"l":[[1789.0,"Let's read on and comment on that in a minute, just in case he says something relevant in the next paragraph."],[1795.0,"Paragraph 83."]]},{"k":"s","p":10,"i":0,"a":5,"t":1796.0,"x":"In the same way we would perceive the true meaning of the furnace asbes which, according to the text, produced painful boils on the Egyptians."},{"k":"s","p":10,"i":1,"a":5,"t":1806.0,"x":"In the figure of what is called the \"furnace\" we perceive the threatened punishment of fire in Gehenna which touches only those who imitate the Egyptians in their manner of life."},{"k":"s","p":11,"i":0,"a":5,"t":1821.0,"x":"If anyone is truly an Israelite, a son of Abraham, and looks to him in life in such a way as to show by his own free will his kinship in race to the elect people, he is kept unharmed from that painful fire."},{"k":"s","p":11,"i":1,"a":5,"t":1835.0,"x":"The interpretation of Moses' outstretched hands which we have already given may become for those others also the healing of pain and the deliverance from punishment."},{"k":"c","a":5,"t":1846.0,"e":2428.3,"l":[[1846.0,"Now, the only thing I would say here, and I'm not sure if it was St. Gregory of Nyssa, who elsewhere might have said something to the extent that torments of hell might stop at some point."],[1861.0,"It's an interesting notion because the Church conciliarly sort of rejected that notion, rejected that idea and confirmed the words of the Lord, because the Lord says, when the worm dieth not, and the fire is not quenched."],[1881.0,"So if we were listening to Christ's perceived description of sort of the fire of Gehenna, it's unquenchable, it's unstopping."],[1892.0,"And the Church held to that belief specifically and said that."],[1897.0,"However, the Church has also set forth numerous examples of people who were condemned initially upon death and were then given freedom and sort of given forgiveness and were moved from Hades or, you know, wherever sort of, they were expecting the second coming in torment to a better place."],[1923.0,"Now, one such example, just off the, you know, sort of the top of my head, I think, is found in the spiritual meadow by St John Moscas, where a certain monk is asked why he chose monasticism, why he became a monk."],[1942.0,"And his story, his response is that he."],[1947.0,"He was once, as a young man, so sick that he saw two young other men walk into his room, take him by the hands and say, follow us, come with us."],[1958.0,"And when he looked back, he saw his body lying in the bed."],[1962.0,"And he realized that these were the angels of God taking his soul."],[1966.0,"They showed him heaven and they also showed him hell."],[1971.0,"His description of Hellas is very horrific."],[1974.0,"I can't remember the exact details, but I think, you know, he says that it was very, very bad."],[1981.0,"Bad, very bad, dark, terrible, foul place."],[1986.0,"And yet, when he was in hell, two other angels, similar to the ones who were escorting him, who were guiding him, approached a young man who was bound by chains, hand and foot, and it was all completely black."],[2000.0,"The two other angels came to him."],[2002.0,"They undid his chains."],[2004.0,"When they undid his chains, when they loosened this other man's chains, he started getting brighter and started shining and turned bright."],[2013.0,"As you know, his light turned white and was taken away from there."],[2019.0,"The two angels who escorted the future monk who was asked, why was it that he sort of embrace the monastic life."],[2030.0,"His two guides looked at him and looked at the astonishment in his eyes and said, marvel not at what you see."],[2037.0,"Do not be surprised by what you see."],[2039.0,"This young man led a profligate life, and all the counsels of his parents and all their pleas he neglected and rejected outright."],[2052.0,"Didn't live right, didn't live well, died young and was condemned to be in hell."],[2059.0,"But his parents continued to give alms in his memory, to pray for the repose of his soul, and to do many other good works on his behalf to such an extent that God decided to show mercy to him for the sake of their love, because they are doing so much, he will be set free."],[2084.0,"And so this young man was taken out of hell."],[2087.0,"There are somewhat similar stories in other cases."],[2091.0,"One which I can tell you briefly, was that an economist of a certain monastery."],[2097.0,"Now, the economist of a monastery is not the treasurer."],[2101.0,"It's not the man who deals with only the money."],[2104.0,"The."],[2104.0,"The actual economist is kind of like the governor who reports to the abbot."],[2111.0,"So basically, he's sort of the assistant abbot or, you know, the."],[2115.0,"The man who's in charge of all sort of the material possessions of the monastery."],[2120.0,"And I assume he's in charge of the treasurer and."],[2124.0,"And, you know, also the cooks and, and the."],[2128.0,"The clothes for the."],[2129.0,"For the."],[2130.0,"For the monks and so on and so forth."],[2131.0,"So the economist sort of rules the monastery."],[2135.0,"And this particular economist died."],[2138.0,"And it was revealed to the abbot that he was condemned at the personal judgment, the judgment that each one of us will go through when we die."],[2147.0,"When we die."],[2148.0,"Even though it's not the second Coming, even though Christ is not coming yet at the moment of our death to judge the entire world, he will definitely judge us."],[2157.0,"We will have to stand before him and give him sort of an account of our life."],[2164.0,"The economist was condemned."],[2166.0,"His body was laid in the church and it turned black."],[2170.0,"The face turned very dark."],[2172.0,"And it was revealed to the abbot that he was condemned."],[2175.0,"He did not sort of make it past the judgment."],[2179.0,"So the abbot gathered the brethren of the entire monastery together into the church and showed them and said, look, our brother has been condemned."],[2189.0,"This is manifest in his appearance."],[2191.0,"He's quite black and he's condemned because he was the buffer for us."],[2200.0,"For the rest of us, we did not have to worry about the material possessions, you know, where our next meal is coming from, who is going to heat the church, who is going to light the church, how is that going to happen?"],[2213.0,"Who's going to get the provisions?"],[2214.0,"He took care of all that and taking care of that, he ended up sinning and doing things which were not right for his soul."],[2222.0,"But he was doing that to alleviate that burden from us so that we could actually focus on prayer and fasting and saving our souls."],[2231.0,"And the abbot then said, let us fast for three days and three nights, you know, sort of as strictly as possible so that we can potentially, you know, bring about his forgiveness."],[2245.0,"And they fasted for three days and for three nights."],[2249.0,"And the abbot was witness to a conversation that the devil had with Christ where the devil was arguing over the soul of this economist and saying, look, this sinful monk did everything I taught him."],[2263.0,"He, you know, he did my will."],[2265.0,"He didn't do your will."],[2266.0,"He belongs to me."],[2268.0,"But the Lord responded and said, and yet, look at the brotherhood in the monastery."],[2275.0,"Some of the older monks are at the point of death."],[2278.0,"They're willing to die for his sake, meaning they're fasting so strictly at their age, that kind of a strict fast can literally mean that they would die."],[2289.0,"And because they're doing that out of their love for him, for the sake of their love, I will forgive him."],[2298.0,"And the next day, the abbot came into the church after he had that dream or that vision where he heard this dialogue between the enemy and the Lord, he came into the church, and sure enough, the economist's countenance was completely white and radiant, and the monks realized that their prayer was heard."],[2316.0,"So we know that God can in fact, spare those who might have not passed sort of the initial, the personal judgment by the prayers of the church that is present in this world."],[2335.0,"So those."],[2336.0,"And that is when we pray for the departed in the Orthodox Church."],[2339.0,"So those who are still alive can intercede for those who have passed away and obtain for them remission of their sins and even sort of a change for the better in the life to come, provided someone here cares enough to do that."],[2356.0,"And of course, that behooves us to live our lives in such a way that should we die and be condemned, hopefully someone behind our children, our grandchildren, our friends who are still living would pray for us and would pray earnestly enough for us to be forgiven."],[2376.0,"So if St. Gregory of Nyssa refers to that I think it's perfectly fine."],[2381.0,"Meanwhile, when it comes to sort of the sufferings of hell and the torments of Gehenna, the Church ruled that it would be eternal."],[2392.0,"And so we'll leave it at that."],[2393.0,"I don't really want to of get too much into that, but yeah, that's."],[2400.0,"That's something I thought that would be pertinent and important."],[2405.0,"Paragraph 84."],[2411.0,"Let's see, maybe we read that already."],[2414.0,"If anyone is true, is truly an Israelite, a son of Abraham, and looks to him in life in such a way as to show by his own free will his kinship."],[2423.0,"I think I read that."],[2425.0,"So paragraph 85."]]},{"k":"s","p":12,"i":0,"a":5,"t":2427.0,"x":"If one follows the sequence of our earlier investigations, he will have no trouble attaching to each plague the corresponding perception: those light gadflies which tormented the Egyptians with their unseen bites, the flies which clung painfully with their bites to their bodies, the tillage which was ravaged by the locusts, and the storms from heaven which rained down hailstones."},{"k":"s","p":13,"i":0,"a":5,"t":2457.0,"x":"The Egyptians' free will caused all these things according to the preceding principle, and the impartial justice of God followed their free choices and brought upon them what they deserved."},{"k":"s","p":13,"i":1,"a":5,"t":2470.0,"x":"As we follow closely the reading of the text at hand, let us not draw the conclusion that these distresses upon those who deserved them came directly from God, but rather let us observe that each man makes his own plagues when through his own free will he inclines toward these painful experiences."},{"k":"s","p":13,"i":2,"a":5,"t":2490.0,"x":"The Apostle says the same thing when talking to such a person:"},{"k":"s","p":13,"i":3,"a":5,"t":2494.0,"x":"Your stubborn refusal to repent is only adding to the anger God will have toward you on that day of anger when his just judgments will be made known."},{"k":"s","p":13,"i":4,"a":5,"t":2508.0,"x":"He will repay each one as his works deserve."},{"k":"c","a":5,"t":2513.0,"e":2550.0,"l":[[2513.0,"Now, if you stick your hand into the fire, it isn't God who burns you, you know."],[2519.0,"God doesn't sort of."],[2521.0,"He's not a sadist."],[2523.0,"He's not somebody who rejoices in human suffering."],[2529.0,"When you stick your hand into the fire after you've been told not to do it because you'll burn, well, you're the one hurting yourself."],[2535.0,"And so when you engage in sin willingly, well, you reap the consequences."],[2543.0,"And it isn't God who's punishing you, you are bringing punishment upon yourself."],[2547.0,"Paragraph 87."]]},{"k":"s","p":14,"i":0,"a":5,"t":2549.0,"x":"What we are describing is like some destructive and bilious humor which arises in the intestines because of a dissipated life."},{"k":"s","p":14,"i":1,"a":5,"t":2558.0,"x":"When the physician induces vomiting by his medicines, he does not become the cause of the sickness in the body, but on the contrary it is disorderly eating habits which bring it about; medical knowledge only brought it into the open."},{"k":"s","p":14,"i":2,"a":5,"t":2571.0,"x":"In the same way, even if one says that painful retribution comes directly from God upon those who abuse their free will, it would only be reasonable to note that such sufferings have their origin and cause in ourselves."},{"k":"c","a":5,"t":2585.0,"e":2603.4,"l":[[2585.0,"If you get drunk, you get behind the wheel of the car, you wreck the car, you kill someone else, you maim yourself or you hurt yourself."],[2593.0,"No, it isn't God who caused the accident."],[2596.0,"You did."],[2597.0,"And you should definitely take the responsibility."],[2601.0,"Paragraph 88"]]},{"k":"s","p":15,"i":0,"a":5,"t":2601.8,"x":"To the one who has lived without sin there is no darkness, no worm, no Gehenna, no fire, nor any other of these fearful names and things, as indeed the history goes on to say that the plagues of Egypt were not meant for the Hebrews."},{"k":"s","p":15,"i":1,"a":5,"t":2618.0,"x":"Since then in the same place evil comes to one but not to the other, the difference of free choices distinguishing each from the other, it is evident that nothing evil can come into existence apart from our free choice."},{"k":"c","a":5,"t":2633.5,"e":2803.7,"l":[[2633.5,"freedom."],[2634.0,"Free choice."],[2636.0,"Well, I. I think that is a beautiful stopping place."],[2639.0,"The next sort of chapter is titled the Death of the Firstborn."],[2646.0,"In it so addresses the the final plague where the firstborn were dying in Egypt."],[2653.0,"And we will read that hopefully."],[2656.0,"Let's see."],[2657.0,"Let me take a quick look as to what's happening on schedule for our services because one of the Wednesday nights we will have the Vigil for Ascension and so most likely for that day we will do we will do the reading another time."],[2684.0,"Now our schedule goes only through the Sunday the 21st and it looks like next week we are fine because we had the mid feast of Pentecost now and then from the 14th to the 20th there is nothing happening."],[2706.0,"So next Wednesday, God willing we should have a broadcast."],[2710.0,"If I happen to be out of town and unavailable, we'll think of something else."],[2716.0,"But God willing, if I'm here, we will continue our reading, which I I'm finding St. Gregory quite interesting and definitely very beneficial."],[2726.0,"So let us sing and we will finish and say goodbye for today."],[2735.0,"Shine, shine on you Jerusalem for the glory of the Lord is risen upon thee."],[2742.0,"Exalt thou and be radiant, O Zion."],[2745.0,"And do thou rejoice, O most pure Theotokos, in the resurrection of the of the High Son."],[2756.0,"Forgive me for the sort of ad lib translation of that hymn."],[2761.0,"I should probably look over it in English and it's sort of a proper version somewhere so that I do not tempt you by my terrible sort of memory and text."],[2776.0,"Many thanks to all of you for being with us each week."],[2780.0,"Thank you so much for your support."],[2782.0,"I'm not sure how much more we're going to read."],[2786.0,"However, if you have any ideas of what you would like for us to read next, please let me know either in the comments or directly, and I will be happy to see if the text is available for us to read next."],[2799.0,"God Bless and Christ is risen."]]}]},{"t":"The Death of the Firstborn","p":[[89,"Let us proceed to what follows in the text. We have learned through the things examined already that Moses (and he who exalts himself by virtue in keeping with his example), when his soul had been empowered through long application and high and lofty life, and through the illumination which came from above, considered it a loss not to lead his countrymen to the life of freedom."],[90,"When he came to them, he implanted in them a more intense desire for freedom by holding out worse sufferings to them. Intending to remove his countrymen from evil, he brought death upon all the firstborn in Egypt. By doing this he laid down for us the principle that it is necessary to destroy utterly the first birth of evil. It is impossible to flee the Egyptian life in any other way."],[91,"It does not seem good to me to pass this interpretation by without further contemplation. How would a concept worthy of God be preserved in the description of what happened if one looked only to the history? The Egyptian acts unjustly, and in his place is punished his newborn child, who in his infancy cannot discern what is good and what is not. His life has no experience of evil, for infancy is not capable of passion. He does not know to distinguish between his right hand and his left. The infant lifts his eyes only to his mother's nipple, and tears are the sole perceptible sign of his sadness. And if he obtains anything which his nature desires, he signifies his pleasure by smiling. If such a one now pays the penalty of his father's wickedness, where is justice? Where is piety? Where is holiness? Where is Ezekiel, who cries: The man who has sinned is the man who must die and a son is not to suffer for the sins of his father? How can the history so contradict reason?"],[92,"Therefore, as we look for the true spiritual meaning
