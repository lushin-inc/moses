<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>The Life of Moses</title>
<style>
:root{
 --bg:#f4f1ea; --card:#e9e5dc; --card2:#ddd8cd;
 --fg:#202923; --dim:#59635b; --dim2:#7d867e;
 --ac:#8a5a1f; --acq:rgba(138,90,31,.12);
 --ok:#2b8a57; --okq:rgba(43,138,87,.13);
 --heart:#d9465a;
 --line:#cfcabe; --sh:rgba(0,0,0,.09);
 --tile:#25322e; --tileb:#65736a; --gold:#c5ac78; --tilefg:#f4efdf; --tiledim:#c5c9bd;
 --fs:21px; --rf:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",system-ui,sans-serif;
}
:root[data-theme="dark"]{
 --bg:#121614; --card:#1b201d; --card2:#252b27;
 --fg:#f1eee5; --dim:#abaea7; --dim2:#8a8e86;
 --ac:#e0b56f; --acq:rgba(224,181,111,.16);
 --ok:#4cc38a; --okq:rgba(76,195,138,.16);
 --heart:#f06b7c;
 --line:#323a34; --sh:rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);
 font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,"Segoe UI",system-ui,sans-serif;
 font-size:18px;line-height:1.5;overflow-x:clip;min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:left}
a{color:inherit;text-decoration:none}
.wrap{max-width:720px;margin:0 auto;padding:0 18px calc(40px + env(safe-area-inset-bottom,0px))}

/* top bar */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 96%,transparent);
 backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
 border-bottom:.5px solid var(--line);
 padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
.topin{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:6px;min-height:44px}
.back{display:flex;align-items:center;gap:2px;font-size:18px;color:var(--ac);min-height:44px;
 padding-right:6px;margin-left:-6px;flex:0 1 auto;min-width:0}
.back[hidden]{display:none}
.back span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
.back svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.brand{font-size:17px;font-weight:600;letter-spacing:-.2px;color:var(--dim);flex:1;min-width:0;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.tt{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto}
.tt svg{width:22px;height:22px;stroke:var(--dim);fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tt.aa{font-size:18px;font-weight:600;color:var(--dim);letter-spacing:-.5px}
.rbar{position:absolute;left:0;bottom:-1px;height:3px;background:var(--ac);width:0;transition:width .1s linear}

/* text settings sheet */
.sheet{position:fixed;left:0;right:0;z-index:60;top:calc(61px + env(safe-area-inset-top,0px));
 padding:0 14px;display:none}
.sheet.open{display:block}
.sheetin{max-width:420px;margin:0 0 0 auto;background:var(--card);border-radius:18px;padding:16px;
 box-shadow:0 14px 40px var(--sh),0 0 0 .5px var(--line)}
.srow{display:flex;align-items:center;gap:10px}
.srow + .srow{margin-top:12px}
.slab{font-size:15px;color:var(--dim);flex:1}
.step{width:52px;height:46px;border-radius:12px;background:var(--bg);font-size:22px;font-weight:600;
 display:grid;place-items:center;color:var(--fg)}
:root[data-theme="dark"] .step{background:var(--card2)}
.sval{min-width:44px;text-align:center;font-variant-numeric:tabular-nums;font-size:16px;font-weight:600}
.seg{display:flex;background:var(--bg);border-radius:12px;padding:3px}
:root[data-theme="dark"] .seg{background:var(--card2)}
.seg button{padding:10px 16px;border-radius:9px;font-size:16px;color:var(--dim)}
.seg button.on{background:var(--card);color:var(--fg);font-weight:600;box-shadow:0 1px 3px var(--sh)}
:root[data-theme="dark"] .seg button.on{background:var(--bg)}
.scrim{position:fixed;inset:0;z-index:55;display:none}
.scrim.open{display:block}

/* home */
.hero{padding:28px 0 6px}
.eyebrow{font-size:14px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--dim2)}
.hero h1{margin:6px 0 4px;font-size:38px;line-height:1.1;font-weight:700;letter-spacing:-1px}
.hero p{margin:0;font-size:18px;color:var(--dim)}
.prog{background:var(--card);border-radius:18px;padding:18px 18px 16px;margin:22px 0 14px}
.big{font-size:30px;font-weight:700;letter-spacing:-.6px;line-height:1.15}
.big small{display:block;font-size:17px;font-weight:500;color:var(--dim);letter-spacing:0;margin-top:4px}
.track{height:10px;border-radius:6px;background:var(--card2);overflow:hidden;margin-top:14px}
.fill{height:100%;background:var(--ok);border-radius:6px;width:0;transition:width .3s ease}
.plab{display:flex;justify-content:space-between;font-size:15px;color:var(--dim);margin-top:8px;font-variant-numeric:tabular-nums}
.cont{display:flex;align-items:center;gap:14px;width:100%;background:var(--ac);color:#fff;
 border-radius:16px;padding:16px 18px;margin:0 0 26px;min-height:64px}
:root[data-theme="dark"] .cont{color:#1a1408}
.cont .ct{flex:1;min-width:0}
.cont .ck{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.cont .cn{font-size:19px;font-weight:600;line-height:1.3;margin-top:2px}
.cont svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.sect{font-size:14px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--dim2);margin:26px 0 12px}
.bk{position:relative;display:block;width:100%;background:var(--tile);border:1px solid var(--tileb);
 border-radius:14px;padding:26px 20px 18px;margin-bottom:12px;color:var(--tilefg);
 box-shadow:0 3px 7px #00000014;transition:transform .12s ease}
.bk:active{transform:scale(.985)}
.bk::after{content:'';position:absolute;top:13px;left:calc(50% - 16px);width:32px;height:1px;background:var(--gold)}
.bk::before{content:'';position:absolute;left:8px;top:12px;bottom:12px;width:1px;background:#ffffff10}
.bk .bn{font-size:26px;font-weight:600;letter-spacing:-.4px;text-align:center}
.bk .bs{font-size:15px;color:var(--tiledim);text-align:center;margin-top:2px}
.bk .bt{height:7px;border-radius:5px;background:#ffffff1c;overflow:hidden;margin-top:16px}
.bk .bf{height:100%;background:var(--gold);border-radius:5px}
.bk .bp{display:flex;justify-content:space-between;font-size:14px;color:var(--tiledim);margin-top:8px;font-variant-numeric:tabular-nums}
.foot{margin-top:34px;text-align:center}
.foot button{font-size:15px;color:var(--dim2);padding:12px 16px}

/* book */
.bhead{padding:24px 0 4px}
.bhead h1{margin:4px 0 2px;font-size:34px;font-weight:700;letter-spacing:-.9px;line-height:1.15}
.bhead p{margin:0;font-size:18px;color:var(--dim)}
.list{margin:0}
.row{display:flex;align-items:center;gap:4px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.chk{flex:0 0 52px;height:64px;display:grid;place-items:center;margin-left:-8px}
.chk i{width:30px;height:30px;border-radius:50%;border:2px solid var(--dim2);display:grid;place-items:center;transition:all .15s ease}
.chk svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.row.done .chk i{background:var(--ok);border-color:var(--ok)}
.row.done .chk svg{opacity:1}
.open{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:14px 0;min-height:64px}
.open .ot{flex:1;min-width:0}
.open .on{font-size:20px;line-height:1.3;font-weight:500;letter-spacing:-.2px}
.open .om{font-size:15px;color:var(--dim2);margin-top:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.open .om .h{color:var(--heart);display:inline-flex;align-items:center;gap:3px}
.open .om .h svg{width:14px;height:14px;fill:currentColor}
.open .om .now{color:var(--ac);font-weight:600}
.open > svg{width:20px;height:20px;stroke:var(--dim2);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.row.done .on{color:var(--dim)}
.row.flash{animation:fl .7s ease}
@keyframes fl{from{background:var(--okq)}to{background:transparent}}
.empty{color:var(--dim);font-size:17px;padding:14px 0}

/* reading */
.rhead{padding:24px 0 6px}
.rhead h1{margin:6px 0 6px;font-size:32px;font-weight:700;letter-spacing:-.8px;line-height:1.15}
.rmeta{font-size:16px;color:var(--dim2);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:14px;font-weight:600;color:var(--ok);
 background:var(--okq);padding:4px 10px;border-radius:999px}
.pill svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.text{padding:14px 0 10px}
.para{position:relative;font-family:var(--rf);font-size:var(--fs);line-height:1.62;letter-spacing:-.1px;
 margin:0 -10px 6px;padding:8px 10px;border-radius:12px;transition:background .3s ease}
.para .n{font-size:.62em;font-weight:700;color:var(--ac);margin-right:7px;vertical-align:.15em;
 font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-variant-numeric:tabular-nums}
.para .fv{float:right;width:44px;height:44px;margin:-6px -8px 0 6px;display:grid;place-items:center;border-radius:50%;opacity:.35}
.para .fv svg{width:20px;height:20px;fill:none;stroke:var(--dim);stroke-width:2;stroke-linejoin:round}
.para.faved{background:color-mix(in srgb,var(--heart) 9%,transparent)}
.para.faved .fv{opacity:1}
.para.faved .fv svg{fill:var(--heart);stroke:var(--heart)}
.para.hl{background:var(--acq)}
.done-box{margin:22px 0 10px}
.mark{width:100%;min-height:62px;border-radius:16px;background:var(--ok);color:#fff;font-size:20px;font-weight:600;
 display:flex;align-items:center;justify-content:center;gap:10px}
:root[data-theme="dark"] .mark{color:#08130d}
.mark svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.isdone{display:flex;align-items:center;justify-content:center;gap:10px;font-size:19px;font-weight:600;color:var(--ok);
 background:var(--okq);border-radius:16px;min-height:62px}
.isdone svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.undo{display:block;margin:6px auto 0;font-size:16px;color:var(--dim2);padding:12px 16px;text-align:center}
.nextc{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border-radius:16px;padding:16px 18px;margin-top:12px;min-height:64px}
.nextc .ct{flex:1;min-width:0}
.nextc .ck{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--dim2)}
.nextc .cn{font-size:19px;font-weight:600;line-height:1.3;margin-top:2px}
.nextc svg{width:22px;height:22px;stroke:var(--ac);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.pn{display:flex;flex-direction:column;gap:2px;margin-top:18px;border-top:1px solid var(--line);padding-top:8px}
.pn button{font-size:17px;color:var(--ac);padding:12px 0;min-height:44px}
.pn button span{color:var(--dim2);font-size:14px;display:block}

/* favorites */
.feed{padding:4px 0 30px}
.fcard{border-top:1px solid var(--line);padding:18px 0}
.fcard:first-child{border-top:0}
.fsrc{font-size:15px;color:var(--dim2);margin-bottom:8px;font-weight:500}
.ftx{font-family:var(--rf);font-size:calc(var(--fs) - 1px);line-height:1.6}
.frow{display:flex;align-items:center;gap:10px;margin-top:12px}
.fgo{font-size:16px;font-weight:600;color:var(--ac);background:var(--acq);padding:10px 16px;border-radius:10px;min-height:44px}
.fdel{font-size:16px;color:var(--dim2);padding:10px 14px;border-radius:10px;min-height:44px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);
 background:var(--fg);color:var(--bg);font-size:16px;font-weight:600;padding:12px 20px;border-radius:999px;
 opacity:0;pointer-events:none;transition:all .25s ease;z-index:80;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head><body>
<div class="top" id="top"><div class="topin">
  <button class="back" id="back" hidden><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg><span id="backlab">Books</span></button>

  <button class="tt" id="favbtn" aria-label="Favorites"><svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1L12 21l7.7-7.6 1.1-1a5.5 5.5 0 0 0 0-7.8z"/></svg></button>

</div><div class="rbar" id="rbar"></div></div>

</div></div>

<script type="application/json" id="data">[{"id":"b1","n":"Book I","sub":"The History","s":[{"t":"Prologue","p":[[1,"At horse races the spectators intent on victory shout to their favorites in the contest, even though the horses are eager to run. From the stands they participate in the race with their eyes, thinking to incite the charioteer to keener effort, at the same time urging the horses on while leaning forward and flailing the air with their outstretched hands instead of with a whip. They do this not because their actions themselves contribute anything to the victory; but in this way, by their good will, they eagerly show in voice and deed their concern for the contestants. I seem to be doing the same thing myself, most valued friend and brother. While you are competing admirably in the divine race along the course of virtue, lightfootedly leaping and straining constantly for the prize of the heavenly calling, I exhort, urge and encourage you vigorously to increase your speed. I do this, not moved to it by some unconsidered impulse, but to humor the delights of a beloved child."],[2,"Since the letter which you recently sent requested us to furnish you with some counsel concerning the perfect life, I thought it only proper to answer your request. Although there may be nothing useful for you in my words, perhaps this example of ready obedience will not be wholly unprofitable to you. For if we who have been appointed to the position of fathers over so many souls consider it proper here in our old age to accept a commission from youth, how much more suitable is it, inasmuch as we have taught you, a young man, to obey voluntarily, that the right action of ready obedience be confirmed in you."],[3,"So much for that. We must take up the task that lies before us, taking God as our guide in our treatise. You requested, dear friend, that we trace in outline for you what the perfect life is. Your intention clearly was to translate the grace disclosed by my word into your own life, if you should find in my treatise what you were seeking. I am at an equal loss about both things: It is beyond my power to encompass perfection in my treatise or to show in my life the insights of the treatise. And perhaps I am not alone in this. Many great men, even those who excel in virtue, will admit that for them such an accomplishment as this is unattainable."],[4,"As I would not seem, in the words of the Psalmist, there to tremble for fear, where no fear was, I shall set forth for you more clearly what I think."],[5,"The perfection of everything which can be measured by the senses is marked off by certain definite boundaries. Quantity, for example, admits of both continuity and limitation, for every quantitative measure is circumscribed by certain limits proper to itself. The person who looks at a cubit or at the number ten knows that its perfection consists in the fact that it has both a beginning and an end. But in the case of virtue we have learned from the Apostle that its one limit of perfection is the fact that it has no limit. For that divine Apostle, great and lofty in understanding, ever running the course of virtue, never ceased straining toward those things that are still to come. Coming to a stop in the race was not safe for him. Why? Because no Good has a limit in its own nature but is limited by the presence of its opposite, as life is limited by death and light by darkness. And every good thing generally ends with all those things which are perceived to be contrary to the good."],[6,"Just as the end of life is the beginning of death, so also stopping in the race of virtue marks the beginning of the race of evil. Thus our statement that grasping perfection with reference to virtue is impossible was not false, for it has been pointed out that what is marked off by boundaries is not virtue."],[0,"I said that it is also impossible for those who pursue the life of virtue to attain perfection. The meaning of this statement will be explained."],[7,"The Divine One is himself the Good (in the primary and proper sense of the word), whose very nature is goodness. This he is and he is so named, and is known by this nature. Since, then, it has not been demonstrated that there is any limit to virtue except evil, and since the Divine does not admit of an opposite, we hold the divine nature to be unlimited and infinite. Certainly whoever pursues true virtue participates in nothing other than God, because he is himself absolute virtue. Since, then, those who know what is good by nature desire participation in it, and since this good has no limit, the participant's desire itself necessarily has no stopping place but stretches out with the limitless."],[8,"It is therefore undoubtedly impossible to attain perfection, since, as I have said, perfection is not marked off by limits: The one limit of virtue is the absence of a limit. How then would one arrive at the sought-for boundary when he can find no boundary?"],[9,"Although on the whole my argument has shown that what is sought for is unattainable, one should not disregard the commandment of the Lord which says, Therefore be perfect, just as your heavenly father is perfect. For in the case of those things which are good by nature, even if men of understanding were not able to attain to everything, by attaining even a part they could yet gain a great deal."],[10,"We should show great diligence not to fall away from the perfection which is attainable but to acquire as much as is possible: To that extent let us make progress within the realm of what we seek. For the perfection of human nature consists perhaps in its very growth in goodness."],[11,"It seems good to me to make use of Scripture as a counselor in this matter. For the divine voice says somewhere in the prophecy of Isaiah, Consider Abraham your father, and Sarah who gave you birth. Scripture gives this admonition to those who wander outside virtue. Just as at sea those who are carried away from the direction of the harbor bring themselves back on course by a clear sign, upon seeing either a beacon light raised up high or some mountain peak coming into view, in the same way Scripture by the example of Abraham and Sarah may guide again to the harbor of the divine will those adrift on the sea of life with a pilotless mind."],[12,"Human nature is divided into male and female, and the free choice of virtue or of evil is set before both equally. For this reason the corresponding example of virtue for each sex has been exemplified by the divine voice, so that each, by observing the one to which he is akin (the men to Abraham and the women to Sarah), may be directed in the life of virtue by the appropriate examples."],[13,"Perhaps, then, the memory of anyone distinguished in life would be enough to fill our need for a beacon light and to show us how we can bring our soul to the sheltered harbor of virtue where it no longer has to pass the winter amid the storms of life or be shipwrecked in the deep water of evil by the successive billows of passion. It may be for this very reason that the daily life of those sublime individuals is recorded in detail, that by imitating those earlier examples of right action those who follow them may conduct their lives to the good."],[14,"What then? Some one will say, \"How shall I imitate them, since I am not a Chaldaean as I remember Abraham was, nor was I nourished by the daughter of the Egyptian as Scripture teaches about Moses, and in general I do not have in these matters anything in my life corresponding to anyone of the ancients? How shall I place myself in the same rank with one of them, when I do not know how to imitate anyone so far removed from me by the circumstances of his life?\" To him we reply that we do not consider being a Chaldaean a virtue or a vice, nor is anyone exiled from the life of virtue by living in Egypt or spending his life in Babylon, nor again has God been known to the esteemed individuals in Judaea only, nor is Zion, as people commonly think, the divine habitation. We need some subtlety of understanding and keenness of vision to discern from the history how, by removing ourselves from such Chaldaeans and Egyptians and by escaping from such a Babylonian captivity, we shall embark on the blessed life."],[15,"Let us put forth Moses as our example for life in our treatise. First we shall go through in outline his life as we have learned it from the divine Scriptures. Then we shall seek out the spiritual understanding which corresponds to the history in order to obtain suggestions of virtue. Through such understanding we may come to know the perfect life for men."]],"id":"b1-1","r":[1,15],"w":1544},{"t":"Birth, Childhood, and the Burning Bush","p":[[16,"Moses is said to have been born when the tyrant's law sought to prevent the birth of male offspring. Yet in his outward grace he anticipated the whole contribution which he would make in time. Already appearing beautiful in swaddling clothes, he caused his parents to draw back from having such a child destroyed by death."],[17,"Thus, when the threat of the tyrant prevailed, he was not simply thrown into the Nile but was placed in a basket daubed along its joints with slime and pitch, and so was given to the current. (This was recounted by those who carefully gave a narrative concerning him.) Guided by some divine power, the basket moved to a certain place along the sloping bank where it was washed up naturally by the lapping of the waves. As the king's daughter happened to come to that grassy bank where the basket washed up, she discovered him when he gave a childlike cry in the ark. When she saw the outward grace evident in him, the princess out of her good will immediately adopted him and took him as her son. But when he instinctively refused a stranger's nourishment, he was nursed at his mother's breast through the contrivance of his close relatives."],[18,"After he had left childhood, and had been educated in pagan learning during his royal upbringing, he did not choose the things considered glorious by the pagans nor did he any longer recognize as his mother that wise woman by whom he had been adopted, but he returned to his natural mother and attached himself to his own kinsmen. During a fight between a Hebrew and an Egyptian he sided with his countryman and killed the foreigner. Then when two Hebrews fought with each other, he tried to restrain them, counseling them that because they were brothers they should make nature and not passion the arbiter of their disputes."],[19,"Having been rebuffed by the one in the wrong, he made this rejection the occasion for a greater philosophy. Separating himself from association with the people, he thereafter lived alone. He became the son-in-law of one of the foreigners, a man with insight into what is noble, and perceptive in judging the habits and lives of men. This man saw in one act—the attack on the shepherds —the virtue of the young man, how he fought on behalf of the right without looking for personal gain. Considering the right valuable in itself, Moses punished the wrong done by the shepherds, although they had done nothing against him. Honoring the young man Moses for these acts and judging his virtue in his manifest poverty more valuable than great riches, the man gave him his daughter in marriage and, in keeping with his authority, he permitted Moses to live as he wished. Moses lived alone in the mountains away from all the turmoil of the marketplace; there in the wilderness he cared for his sheep."],[20,"After he had passed some time in this kind of life, the history says an awe-inspiring theophany occurred. At high noon a light brighter than the sunlight dazzled his eyes. Astonished at the strange sight, he looked up at the mountain and saw a bush from which this light was flaming up like a fire. When he saw the branches of the bush sprouting up in flame as if they were in pure water, he said to himself, \"I will go and see this great sight.\" As soon as he said this, he no longer received the marvel of the light with his sight alone, but (which is most astounding of all) his hearing too was illuminated by the rays of light. The light's grace was distributed to both senses, illuminating the sight with flashing rays and lighting the way for the hearing with undefiled teachings. The voice from the light forbade Moses to approach the mountain burdened with lifeless sandals. He removed the sandals from his feet, and so stood on that ground on which the divine light was shining."],[21,"I think that the discussion should not dwell extensively on the bare history of the man. We should give attention to the matters we have proposed. After he was empowered by the theophany which he had seen, he was commanded to release his countrymen from Egyptian bondage. In order that he might learn more fully the strength implanted in him by God he tested the divine command by the things in his hands."],[0,"This was the test. When the rod fell from his hand, it became alive, a living creature (in fact it was a serpent); when he took it up again in his hand, it became what it had been before becoming an animal. When he withdrew his hand from his bosom, it looked as white as snow, but when he put it back in his bosom, it returned to its natural color."]],"id":"b1-2","r":[16,21],"w":815},{"t":"Aaron, Pharaoh, and the Plagues","p":[[22,"Moses went down to Egypt and he took with him his foreign wife and the children she had borne him. Scripture says that an angel encountered him and threatened death. His wife appeased the angel by the blood of the child's circumcision. Then he met Aaron, who had himself been brought by God to this meeting."],[23,"Later, the people in Egypt were gathered by Moses and Aaron into a general assembly and their release from bondage was announced all around to those who were already distressed by the hardships of their labors. Report of this came to the tyrant himself. When he heard it his anger at both the overseers of the work and the Israelites themselves was greater than ever. The levy of bricks to be made was increased and a harsher command was sent down, not only to those slaving with the clay but also to those laboriously gathering chaff and straw."],[24,"Pharaoh (for this was the Egyptian tyrant's name) attempted to counter the divine signs performed by Moses and Aaron with magical tricks performed by his sorcerers. When Moses again turned his own rod into an animal before the eyes of the Egyptians, they thought that the sorcery of the magicians could equally work miracles with their rods. This deceit was exposed when the serpent produced from the staff of Moses ate the sticks of sorcery—the snakes no less! The rods of the sorcerers had no means of defense nor any power of life, only the appearance which cleverly devised sorcery showed to the eyes of those easily deceived."],[25,"When Moses saw that all the subjects agreed with their leader in his evil, he laid a blow upon the whole Egyptian nation, sparing no one from the calamities. Like an army under orders, the very elements of the universe—earth, water, air, and fire which are seen to be in everything—cooperated with him in this attack on the Egyptians, and changed their natural operations to serve human purposes. For by the same power and at the same time and place the disorderly were punished and those free of wrong did not suffer."],[26,"At the command of Moses all the water in Egypt turned into blood. The fish were destroyed because the water thickened, but to the Hebrews alone the blood was water when they drew it. Found among the Hebrews this water provided an occasion for the magicians to use their art in making the water appear bloody."],[27,"Similarly frogs covered Egypt in large numbers. Their breeding in these numbers was not natural, but Moses' command changed the normal density of frogs. All the land was in a sorry state, for the Egyptians' houses were being overrun with these creatures, while the Hebrews were free of this hateful plague."],[28,"Likewise, there was no distinction between night and day to the Egyptians, who lived in unchanging gloom. To the Hebrews, however, nothing was out of the ordinary. It was the same with all the other things—the hail, the fire, the boils, the gadflies, the flies, the cloud of locusts: Each had its natural effect on the Egyptians. The Hebrews learned of the misfortune of their neighbors by report, since they experienced no similar attack themselves."],[0,"Then the death of the firstborn made the distinction between Egyptians and Hebrews still sharper. The Egyptians were dismayed, lamenting the loss of their dearest children, while the Hebrews continued to live in total serenity and safety. Salvation was assured to them by the shedding of the blood. At every entrance both the doorposts and the lintel joining them were marked with blood."]],"id":"b1-3","r":[22,28],"w":599},{"t":"The Exodus and the Red Sea","p":[[29,"While the Egyptians were downcast at the fate of their firstborn and each individual was lamenting his sufferings and those of everyone else, Moses led the exodus of the Israelites. He had previously prepared them to take away with themselves the wealth of the Egyptians on the pretext that it was a loan. The history goes on to say that when they were three days out of Egypt, the Egyptian was angry that Israel did not remain in slavery, and after mobilizing all his subjects for war, he pursued the people with his cavalry."],[0,"When they saw the deployment of the cavalry and infantry, they were panic-stricken since they were inexperienced in war and untrained in such sights, and they rose up against Moses. Then the history tells the most marvellous thing about Moses. He did two distinctly separate things at once: By spoken word he encouraged the Israelites and exhorted them not to abandon high hopes, but inwardly, in his thoughts, he pleaded with God on behalf of those who cowered in fear and he was directed by counsel from above how to escape the danger. God himself, the history says, gave ear to his voiceless cry."],[30,"By divine power a cloud led the people. This was no ordinary cloud, for it was not composed of the vapors or exhalations as normal clouds are. The winds did not press the vapors of the air into a misty composition; it was something beyond human comprehension. Scripture testifies that there was something amazing about that cloud. When the rays of the noonday sun shone with great heat, the cloud was a shelter for the people, shadowing those below it and moistening with a light dew the fiery heat of the atmosphere. During the night it became a fire, leading the Israelites as in a procession with its own light from sunset to sunrise."],[31,"Moses himself watched the cloud, and he taught the people to keep it in sight. When the cloud had guided them along their course, they came to the Red Sea, where the Egyptians coming from behind with their whole army surrounded the people. No way of escape from their terrors was open to the Israelites in any direction, because they were trapped between their enemies and the water. It was then that Moses, urged on by divine power, performed the most incredible deed of all. He approached the bank and struck the sea with his rod. The sea split at the blow, just as a crack in glass runs straight across to the edge when a break occurs at any point. The whole sea was split like that from the top by the rod, and the break in the waters reached to the opposite bank. At the place where the sea parted, Moses went down into the deep with all the people and they were in the deep without getting wet and their bodies were still in the sunlight. As they crossed the depths by foot on dry bottom, they were not alarmed at the water piled up so close to them on both sides, for the sea had been fixed like a wall on each side of them."],[32,"When Pharaoh and the Egyptians ran after them headlong into the sea along that newly cut path, the walls of water came together again and the sea rushed in upon itself to assume its previous form, becoming to the eye a single body of water. By that time the Israelites were already resting on the opposite bank from the long and strenuous march through the sea. Then they sang a victory song to God for raising a monument unstained with blood on their behalf since he destroyed in the water the whole army of the Egyptians—their horses, infantry, and chariots."]],"id":"b1-4","r":[29,32],"w":631},{"t":"The Desert and the War with Amalek","p":[[33,"After that, Moses pushed on, but when he had traveled three days without water he was at a loss how to relieve the thirst of the army. They pitched camp near a pool of salty water, more bitter than the sea itself. While they were resting close to the water and were parched with thirst, Moses, acting on the counsel of God, found a piece of wood near that place and threw it into the water. Immediately it became drinkable, for the wood by its own power changed the nature of the water from bitter to sweet."],[34,"As the cloud moved forward, the Israelites followed their guide closely. They always rested from their march wherever the cloud indicated by stopping, and they departed again whenever the cloud led the way on. By following this guide, they arrived at a place irrigated with drinkable water. It was watered all around by twelve bountiful springs and shaded by a grove of date palms. There were seventy date palms which, even though few in number, made a great impression on those who saw them, because of their exceptional beauty and height."],[35,"Again their guide, the cloud, rose up and led them forth to another place. But this was a desert with arid, scorching sand and not a drop of water to moisten the country. Here once more thirst exhausted the people. But when Moses struck a prominent rock with his rod, it gave forth water which was sweet and drinkable in greater abundance than was needed by even so large a host."],[36,"It was also there that the provisions which they had laid in for the journey out of Egypt failed, and the people were famished. Then the most incredible marvel of all occurred: Food did not grow out of the earth in the customary manner but fell like dew from heaven. For the dew was poured out upon them at daybreak and became food for those who gathered it. What was poured out was not drops of water as in the case of dew but crystal-like drops in the shape of coriander seed, tasting as sweet as honey."],[37,"With this marvel was seen also another: Those who went out to gather the food were all, as one might expect, of different ages and capacities, yet despite their differences one did not gather more or less than another. Instead, the amount gathered was measured by the need of each, so that the stronger did not have a surplus nor was the weaker deprived of his fair share. In addition, the history tells another marvel. Each one, when making provision for the day, laid up nothing for the morrow, but when some stingy person did store up some of the daily food for the next day, it became inedible, being changed into worms."],[38,"The history offers yet another astounding feature of this food, for one of the seven days of the week was observed by rest in keeping with a mystical ordinance. On the day before the day of rest, the same amount of food flowed down as on other days and the effort of those gathering it was the same, yet what was gathered was found to be double the usual amount, so that their need for food was no excuse for breaking the law of rest. Divine power was shown even more in that, whereas on other days the excess became worthless, on the day of Preparation for the Sabbath (which is the name of this day of rest) alone did what was stored up remain imperishable so that it in no way appeared to be less fresh than the new."],[39,"Then they waged war against a foreign nation. The text calls those combining against them Amalekites. For the first time the Israelites were drawn up fully armed in battle array. The full army was not moved into battle; only picked troops chosen for their merit undertook the war. Here Moses showed a new piece of strategy. While Joshua (who was to succeed Moses in leading the people) led the army out against the Amalekites, Moses, standing on a hilltop away from the furor of battle, was looking up toward heaven with a friend stationed on either side of him."],[40,"Then we hear from the history the following marvel: When Moses raised his hands to heaven, those under his command prevailed against their enemies, but when he let them down, the army began to give in to the foreigners' assault. When those who stood with him recognized this they stationed themselves on either side of him and supported his hands, which for some unknown reason had become heavy and hard to move. When his helpers became too weak to hold him in an upright position, they provided him a stone to sit on, thus helping Moses to raise his hands to heaven. From then on the foreign army was mightily defeated by the Israelites."]],"id":"b1-5","r":[33,40],"w":822},{"t":"The Mountain of Divine Knowledge","p":[[41,"When the cloud which led the people in their journey continued to remain at the same place, the people could not move on, since there was no one to lead them to depart. All the necessities of life were provided for them without toil. The air from above rained bread already prepared for them, and the rock from below provided drink. The cloud in turn tempered the unpleasantness of being out in the open, forming a shelter from the heat by day and at night dispelling the darkness by shining with a torch-like radiance. So they experienced no discomfort in that desert at the foot of the mountain where they had pitched camp."],[42,"Here Moses guided them in a most secret initiation. The divine power itself by marvels beyond description initiated all the people and their leader himself in the following manner. The people were ordered beforehand to keep themselves from defilements of all kinds which pertain to both soul and body and to purify themselves by certain lustrations. They were to keep themselves pure from intercourse for a stated number of days so that, pure of passion, they might approach the mountain to be initiated, cleansed of every emotion and bodily concern. (The name of the mountain was Sinai.) Persons alone were allowed at that time to approach the mountain, and of them men alone, and of them, in turn, those purified from every pollution. Every safeguard and precaution was taken against the approach of any animals to the mountain. If somehow it did happen that any animal at all showed itself at the mountain, it was stoned by the people."],[43,"Then the clear light of the atmosphere was darkened so that the mountain became invisible, wrapped in a dark cloud. A fire shining out of the darkness presented a fearful sight to those who saw it. It hovered all around the sides of the mountain so that everything which one could see smouldered with the smoke from the surrounding fire. Moses led the people to the slope, not without fear himself at the sight. His whole being so trembled with fright that his faintness of soul was not concealed from the Israelites, but he was terrified, as they were, at what he saw and his body shook violently."],[44,"The manifestation was of such a nature that it not only caused consternation in their souls through what they saw but it also struck fear in them through what they heard. A terrible sound ripped down from above upon everything below. Its first impact was harsh and intolerable to every ear. Its sound was like the blaring of trumpets, but the intensity and terribleness of the sound surpassed any such comparison. As it drew nearer, its blaring steadily increased to a more terrifying volume. This sound was sharp and clear, the air articulating the word by divine power without using organs of speech. The word was not articulated without purpose but was laying down divine ordinances. As the sound drew nearer, it became louder, and the trumpet surpassed itself, the successive sounds exceeding in volume the preceding ones."],[45,"The people as a whole were incapable of enduring what was seen and heard. Therefore, a general request from all was brought before Moses that the Law be mediated through him, on the ground that the people would not doubt that whatever he commanded in keeping with the teaching from above was a divine command. So when all went down to the foot of the mountain, Moses alone remained and showed the opposite of what was to be expected of him. Whereas all other men feel confidence in the face of fearful things when in the company of their associates, Moses was more courageous after he had been left by himself. From this it became clear that the fear which had encompassed him at the beginning was an emotion not in keeping with his character but was experienced out of sympathy for those who were terrified."],[46,"Since he was alone, by having been stripped as it were of the people's fear, he boldly approached the very darkness itself and entered the invisible things where he was no longer seen by those watching. After he entered the inner sanctuary of the divine mystical doctrine, there, while not being seen, he was in company with the Invisible. He teaches, I think, by the things he did that the one who is going to associate intimately with God must go beyond all that is visible and (lifting up his own mind, as to a mountaintop, to the invisible and incomprehensible) believe that the divine is there where the understanding does not reach."],[47,"While there he received the divine ordinances. These were the teachings concerning virtue, the chief of which is reverence and having the proper notions about the divine nature, inasmuch as it transcends all cognitive thought and representation and cannot be likened to anything which is known. He was commanded to heed none of those things comprehended by the notions with regard to the divine nor to liken the transcendent nature to any of the things known by comprehension. Rather, he should believe that the Divine exists, and he should not examine it with respect to quality, quantity, origin, and mode of being, since it is unattainable."],[48,"The word also adds what are right moral actions, presenting its teaching in both general and specific laws. General is the law which is destructive of all injustice, namely that one must love his neighbor. If this law were observed, it would certainly follow in consequence that no one would do any evil to his neighbor. Among the specific laws was established honor for parents, and there was listed a catalogue of prohibited deeds."]],"id":"b1-6","r":[41,48],"w":957},{"t":"The Tabernacle and the Priestly Vestments","p":[[49,"With his mind purified by these laws, as it were, he was led to the higher initiation, where a tabernacle was all at once shown to him by divine power. The tabernacle was a sanctuary with beauty of indescribable variety—entrances, pillars, and curtains, table, candlestick, and altar of incense, the altar of holocaust and the propitiatory, and the inaccessible and unapproachable holy of holies. So that their beauty and arrangement might not be forgotten and might be shown to those below, he was counseled not to represent these things in mere writing but to imitate in material construction that immaterial creation, employing the most splendid and radiant materials found on earth. Among these the most abundant was gold, with which the pillars were overlaid. With the gold, silver also made its contribution by beautifying the capitals and bases of the pillars so that by the changes of color at each end, I think, the gold might shine forth more brightly. There were also places where brass was considered useful, namely at the head and base of the silver pillars."],[50,"The draperies and the curtains and the outer wall of the sanctuary and the coverings stretched out in succession over the columns—each was finished out of an appropriate material by the weaver's art. The dye of these woven fabrics was violet, purple, and fiery scarlet, and some material had its natural brightness. For some things linen was used and for other things hair, in keeping with the purposes of the fabrics. There were also places where skins dyed red were suitable to the beauty of the structure."],[51,"After his descent from the mountain Moses, employing workmen, constructed these things according to the pattern shown to him. While he was in that sanctuary not made with hands, he was commanded how the priest should be adorned when he entered the sanctuary. The law prescribed the details of the under and outer garments."],[52,"The first in order of the garments was not the hidden but the visible. There was an ephod embroidered of different colors with gold thread predominating. (The veil was also made of these colors.) Clasps held the ephod together on both sides and provided a setting of gold for emeralds. The beauty of these stones was due partly to their natural radiance—from them a green brightness was given forth—and partly to the marvellous skill of the engraving. (This was not the skill which carves out images of idols, but the adornment was the names of the patriarchs engraved six on each stone.)"],[53,"From the clasps down the front the little shield-like ornaments hung loosely. There were also intertwined cords plaited through one another in a netlike pattern hanging from the clasps on each side. They dropped down below the shield-like ornaments so that the beauty of the plaiting might, I think, be more conspicuous being enhanced by the background."],[54,"The ornament made out of gold which hung down from the chest had on it stones of different kinds equal in number to the patriarchs. These were arranged in four rows set three to a row, with the names of the tribes written on them. The tunic beneath the ephod extended from the neck to the toes and was suitably adorned with fringes. The hem was decked out beautifully, not only by the variety of skilled weaving but also by the hanging of gold ornaments. These were golden bells and pomegranates distributed alternately along the hem."],[55,"The fillet for the head was solid violet, and the metal-leaf frontpiece was of pure gold engraved with the ineffable letters. There was also a girdle which held together the loose folds of the garment, as well as an adornment for the hidden parts of the body, and the other articles of clothing which symbolically instruct concerning priestly virtue under the form of clothing."]],"id":"b1-7","r":[49,55],"w":639},{"t":"The Tables of Stone","p":[[56,"After he was instructed in these and other such things by the ineffable teaching of God while he was surrounded by that invisible darkness, and having surpassed himself by the aid of the mystical doctrines, he emerged again out of the darkness. He then went down to his people to share with them the marvels which had been shown to him in the theophany, to deliver the laws, and to institute for them the sanctuary and priesthood according to the pattern shown to him on the mountain."],[57,"He carried in his hands the holy tablets, which were a divine invention and gift that needed no human cooperation to be brought into existence. Both the material and the writing on them were equally the work of God. The writing was the Law. But the people prevented grace: Before giving heed to the lawgiver they rebelled in idolatry."],[58,"Some considerable time had elapsed while Moses devoted himself to conversation with God in that divine initiation. He participated in that eternal life under the darkness for forty days and nights, and lived in a state beyond nature, for his body had no need of food during that time. It was then that the people, like a little child who escapes the attention of his pedagogue, were carried along into disorderliness by uncontrolled impulses, and, banding together against Aaron, forced the priest to lead them in idolatry."],[59,"When the idol had been made out of gold (it was a calf), they exulted in their impiety; but Moses came to them and broke the tablets which he had received from God so that they might suffer a punishment worthy of their transgression by having no share in the God-given grace."],[60,"He then purified his people's guilt with their own blood when the Levites slew them, and appeased the divine by his own anger against the transgressors. Thereupon he utterly destroyed the idol. Once more applying himself to the matter for forty days, he received the tablets. The writing on them was done by divine power, but the material was fashioned by the hand of Moses. He received them while for the same number of days he again lived beyond nature in a manner different from that to which we are accustomed and admitted to his body none of those sustenances which our nature requires."],[61,"Moses accordingly erected for them the tabernacle, delivered to them the laws, and established the priesthood in keeping with the teaching given to him by God. The workmanship on all the material objects was done according to the divine directions—the tabernacle, the entrances, and everything inside—the altar of incense, the altar of holocaust, the candlestick, the curtains, the propitiatory within the holy of holies; the adornment of the priesthood, the myrrh, the different sacrifices—the purifications, the thankofferings, the offerings to avert evil, the propitiations for trespasses. As he arranged everything in the required manner, among his family he aroused against himself envy, that congenital malady in the nature of man."]],"id":"b1-8","r":[56,61],"w":499},{"t":"Envy, the Spies, the Serpent, and the Priesthood","p":[[62,"Even Aaron, who was endowed with the honors of the priesthood, and his sister Miriam, driven by a most female-like jealousy against the honor given to Moses by God, so railed against him that deity was provoked to punish their trespass. Here Moses showed patience most worthy of admiration, because, when God punished the irrational envy of the woman, he made his nature prevail over anger and appeased God on behalf of his sister."],[63,"The multitude again fell into disorderliness. What led to their transgression was a lack of moderation in regard to the pleasures of the table, for they were not satisfied to live healthfully and painlessly on the food which flowed down from above, but the craving for meat made them prefer slavery in Egypt to their present good circumstances. Moses took counsel with God concerning the passion which had overcome them, and God instructed that they should not have such desires because he would give what they longed for. He sent flocks of birds like a cloud to fly close to the ground near the camp. The ease with which they could catch the birds led them in their craving for meat to stuff themselves."],[64,"Their immoderation at once became destructive to their bodies, and their satiety ended in sickness and death. This example became to them and to those watching them a sufficient cause for moderation."],[65,"Next, Moses sent spies into that region which they hoped to inhabit according to the divine promise. When not all of them reported the truth, but some gave false and discouraging information, the people again rose in anger against Moses. God decreed that those who had no confidence in divine help should not see the promised land."],[66,"As they were crossing the desert, water again failed them—as did their memory of the divine power, for the earlier miracle of the rock did not give them confidence that their present necessities would be provided for. Abandoning their hopes for better things, they reviled Moses and God himself, so that the disbelief of the people seemed to intimidate even Moses. Nevertheless he performed for them again the miracle of changing that jutting rock into water."],[67,"Again the pleasures of the table enslaved them, and their desires led them to gluttony. Although they lacked none of the necessities of life, disorderly youths were dreaming of the Egyptian plenty. They were disciplined by very severe scourges: Serpents within the encampment as they bit them injected deadly poison in them."],[68,"When deaths caused by the serpents followed in rapid succession, the lawgiver, at the urging of divine counsel, cast a bronze likeness of a serpent and placed it on a height to be seen by the whole camp. In this way he stayed the harm done among the people by the serpents and delivered them from destruction. For he who looked on the bronze image of the serpent did not fear the bite of the real serpent, since looking at it counteracted the poison by some mysterious antidote."],[69,"Some of the people again rose up against Moses' leadership and put pressure on him to transfer the priesthood to themselves. Although he made supplication to God on behalf of the rebels, the righteous judgment of God was stronger than the compassion of Moses for his people. For the earth, opening up like a chasm at the divine will and closing up again, swallowed all those who set themselves, together with all their kinsmen, against the authority of Moses. When two hundred and fifty of those who raved about the priesthood were consumed by fire, the people were brought to their senses."],[70,"In order to persuade men that the grace of the priesthood comes from God to those who are worthy, Moses received rods from the most eminent man in each tribe, each man bringing a rod marked with his own name. Aaron's rod was among them. Moses placed the rods before the sanctuary, and by them he made God's choice concerning the priesthood clear to the people. Aaron's rod alone budded and produced ripe fruit from the wood—and the fruit was the almond."],[71,"It seemed a very great marvel to the unbelievers that what was dried, polished, and rootless all at once produced the growth natural to things which are planted. Instead of earth, bark, moisture, roots, and time, it was the divine power at work in the wood."]],"id":"b1-9","r":[62,71],"w":733},{"t":"The Royal Way, Balaam, and the End of His Life","p":[[72,"Thereupon, when he led the army through foreign nations who blocked their passage, he swore an oath that the people would not pass through the fields and vineyards but would keep to the royal road, turning aside neither to the right nor to the left. When the adversaries would not make peace on these terms, he prevailed in battle against the enemy and became master of the route."],[73,"Next, a certain Balak who ruled a greater nation known as the Midianites, panic-stricken at the experience of those who were destroyed and expecting to undergo nothing less calamitous at the hands of the Israelites, brought in support not arms and men but magical arts in the person of a certain Balaam. He was commonly reputed to be skilled in these things and was believed by those who employed him to be powerful in such matters. His augury came from watching the flight of birds, yet he was a hard man to deal with, for with the cooperation of demons he could bring utter ruin on men through this magical power."],[74,"As he followed those who were leading him to the king of that nation, he learned by the voice of his ass that the way was not propitious for him. Having learned in a vision what was to be done, he found that any harm to be inflicted by working magic was impotent against those who have God as their ally. Moved by divine inspiration instead of by demonic power, he uttered such words as were a clear prophecy of better things which would later come to pass. What prevented his making use of his skill for evil also brought him an awareness of divine power. Leaving divination aside, he acted as an interpreter of the divine will."],[75,"Then the foreign nation was destroyed. The Israelites had the upper hand in the battle, but they in turn were overcome by licentious passion for their female captives. When Phineas then with one blow ran those through who were entangled in dishonor, the wrath of God against those raving for unlawful unions abated. Then the lawgiver, ascending a high mountain, surveyed from afar the land which was prepared for Israel by the divine promise made to the fathers. He departed from this human life, leaving behind no sign on the earth nor any grave as a memorial of his departure."],[76,"Time had not harmed his beauty, neither dimmed his brightness of eye nor diminished the graciousness of his appearance. Always remaining the same, he preserved in the changeableness of nature an unchangeable beauty."],[77,"Those things which we have learned from the literal history of the man we have retraced in summary for you, although we have of necessity so amplified the account as to bring out its intention. Now we must adapt the life which we have called to mind to the aim we have proposed for our study so that we might gain some benefit for the virtuous life from the things mentioned. Let us now begin the account of this life."]],"id":"b1-10","r":[72,77],"w":510}]},{"id":"b2","n":"Book II","sub":"Contemplation on the Life of Moses","s":[{"t":"Birth and Childhood","p":[[1,"Moses was born at the time Pharaoh issued the decree for male offspring to be destroyed. How shall we as a matter of choice imitate this fortuitous birth of Moses? Someone will rightly raise the objection that it does not lie within our power to imitate in our own birth that famous birth. But it is not hard to begin the imitation with this seeming difficulty."],[2,"Everyone knows that anything placed in a world of change never remains the same but is always passing from one state to another, the alteration always bringing about something better or worse. The narrative is to be understood according to its real intention. For the material and passionate disposition to which human nature is carried when it falls is the female form of life, whose birth is favored by the tyrant. The austerity and intensity of virtue is the male birth, which is hostile to the tyrant and suspected of insurrection against his rule."],[3,"Now, it is certainly required that what is subject to change be in a sense always coming to birth. In mutable nature nothing can be observed which is always the same. Being born, in the sense of constantly experiencing change, does not come about as the result of external initiative, as is the case with the birth of the body, which takes place by chance. Such a birth occurs by choice. We are in some manner our own parents, giving birth to ourselves by our own free choice in accordance with whatever we wish to be, whether male or female, moulding ourselves to the teaching of virtue or vice."],[4,"We can most certainly enter upon a better birth into the realm of light, however much the unwilling tyrant is distressed, and we can be seen with pleasure and be given life by the parents of this goodly offspring, even though it is contrary to the design of the tyrant. (The rational faculties are what become the \"parents of... virtue.\")"],[5,"When we lay bare the hidden meaning of the history, Scripture is seen to teach that the birth which distresses the tyrant is the beginning of the virtuous life. I am speaking of that kind of birth in which free will serves as the midwife, delivering the child amid great pain. For no one causes grief to his antagonist unless he exhibits in himself those marks which give proof of his victory over the other."],[6,"It is the function of the free will both to beget this virtuous male offspring and to nourish it with proper food and to take forethought how to save it unharmed from the water. For there are those who present their children to the tyrant, delivering them naked and without forethought to the stream. I am speaking of life as a stream made turbulent by the successive waves of passion, which plunge what is in the stream under the water and drown it."],[7,"Whenever life demands that the sober and provident rational thoughts which are the parents of the male child launch their good child on the billows of this life, they make him safe in an ark so that when he is given to the stream he will not be drowned. The ark, constructed out of various boards, would be education in the different disciplines, which holds what it carries above the waves of life."],[8,"Although he is borne along by the rushing of the waves, the child is not carried far by the tossing of the waters where there is education. Instead he is washed to the side and the motion of the waters naturally thrusts him on the firm bank, that is to say, outside the turmoil of life."],[9,"Experience teaches us that the restless and heaving motion of life thrusts from itself those who do not totally submerge themselves in the deceits of human affairs and it reckons as a useless burden those whose virtue is annoying. He who escapes from these things must imitate Moses and not spare his tears, even though he should be safe in the ark, for tears are the unfailing guardian of those saved by virtue."],[10,"Since the daughter of the king, being childless and barren (I think she is rightly perceived as profane philosophy), arranged to be called his mother by adopting the youngster, Scripture concedes that his relationship with her who was falsely called his mother should not be rejected until he had recognized his own immaturity. But he who has already attained maturity, as we have learned about Moses, will be ashamed to be called the son of one who is barren by nature."],[11,"For truly barren is profane education, which is always in labor but never gives birth. For what fruit worthy of such pangs does philosophy show for being so long in labor? Do not all who are full of wind and never come to term miscarry before they come to the light of the knowledge of God, although they could as well become men if they were not altogether hidden in the womb of barren wisdom?"],[12,"Now after living with the princess of the Egyptians for such a long time that he seemed to share in their honors, he must return to his natural mother. Indeed he was not separated from her while he was being brought up by the princess but was nursed by his mother's milk, as the history states. This teaches, it seems to me, that if we should be involved with profane teachings during our education, we should not separate ourselves from the nourishment of the Church's milk, which would be her laws and customs. By these the soul is nourished and matured, thus being given the means of ascending the height."],[13,"It is true that he who looks to both the profane doctrines and to the doctrines of the fathers will find himself between two antagonists. For the foreigner in worship is opposed to the Hebrew teaching, and contentiously strives to appear stronger than the Israelite. And so he seems to be to many of the more superficial who abandon the faith of their fathers and fight on the side of the enemy, becoming transgressors of the fathers' teaching. On the other hand, he who is great and noble in soul like Moses slays with his own hand the one who rises in opposition to true religion."],[14,"One may, moreover, find this same conflict in us, for man is set before competitors as the prize of their contest. He makes the one with whom he sides the victor over the other. The fight of the Egyptian against the Hebrew is like the fight of idolatry against true religion, of licentiousness against self-control, of injustice against righteousness, of arrogance against humility, and of everything against what is perceived by its opposite."],[15,"Moses teaches us by his own example to take our stand with virtue as with a kinsman and to kill virtue's adversary. The victory of true religion is the death and destruction of idolatry. So also injustice is killed by righteousness and arrogance is slain by humility."],[16,"The dispute of the two Israelites with each other occurs also in us. There would be no occasion for wicked, heretical opinions to arise unless erroneous reasonings withstood the truth. If, therefore, we by ourselves are too weak to give the victory to what is righteous, since the bad is stronger in its attacks and rejects the rule of truth, we must flee as quickly as possible (in accordance with the historical example) from the conflict to the greater and higher teaching of the mysteries."],[17,"And if we must again live with a foreigner, that is to say, if need requires us to associate with profane wisdom, let us with determination scatter the wicked shepherds from their unjust use of the wells—which means let us reprove the teachers of evil for their wicked use of instruction."],[18,"In the same way we shall live a solitary life, no longer entangled with adversaries or mediating between them, but we shall live among those of like disposition and mind who are fed by us while all the movements of our soul are shepherded, like sheep, by the will of guiding reason."]],"id":"b2-1","r":[1,18],"w":1369},{"t":"The Burning Bush","p":[[19,"It is upon us who continue in this quiet and peaceful course of life that the truth will shine, illuminating the eyes of our soul with its own rays. This truth, which was then manifested by the ineffable and mysterious illumination which came to Moses, is God."],[20,"And if the flame by which the soul of the prophet was illuminated was kindled from a thorny bush, even this fact will not be useless for our inquiry. For if truth is God and truth is light—the Gospel testifies by these sublime and divine names to the God who made himself visible to us in the flesh — such guidance of virtue leads us to know that light which has reached down even to human nature. Lest one think that the radiance did not come from a material substance, this light did not shine from some luminary among the stars but came from an earthly bush and surpassed the heavenly luminaries in brilliance."],[21,"From this we learn also the mystery of the Virgin: The light of divinity which through birth shone from her into human life did not consume the burning bush, even as the flower of her virginity was not withered by giving birth."],[22,"That light teaches us what we must do to stand within the rays of the true light: Sandaled feet cannot ascend that height where the light of truth is seen, but the dead and earthly covering of skins, which was placed around our nature at the beginning when we were found naked because of disobedience to the divine will, must be removed from the feet of the soul."],[0,"When we do this, the knowledge of the truth will result and manifest itself. The full knowledge of being comes about by purifying our opinion concerning nonbeing."],[23,"In my view the definition of truth is this: not to have a mistaken apprehension of Being. Falsehood is a kind of impression which arises in the understanding about nonbeing: as though what does not exist does, in fact, exist. But truth is the sure apprehension of real Being. So, whoever applies himself in quietness to higher philosophical matters over a long period of time will barely apprehend what true Being is, that is, what possesses existence in its own nature, and what nonbeing is, that is, what is existence only in appearance, with no self-subsisting nature."],[24,"It seems to me that at the time the great Moses was instructed in the theophany he came to know that none of those things which are apprehended by sense perception and contemplated by the understanding really subsists, but that the transcendent essence and cause of the universe, on which everything depends, alone subsists."],[25,"For even if the understanding looks upon any other existing things, reason observes in absolutely none of them the self-sufficiency by which they could exist without participating in true Being. On the other hand, that which is always the same, neither increasing nor diminishing, immutable to all change whether to better or to worse (for it is far removed from the inferior and it has no superior), standing in need of nothing else, alone desirable, participated in by all but not lessened by their participation—this is truly real Being. And the apprehension of it is the knowledge of truth."],[26,"In the same way that Moses on that occasion attained to this knowledge, so now does everyone who, like him, divests himself of the earthly covering and looks to the light shining from the bramble bush, that is, to the Radiance which shines upon us through this thorny flesh and which is (as the Gospel says) the true light and the truth itself. A person like this becomes able to help others to salvation, to destroy the tyranny which holds power wickedly, and to deliver to freedom everyone held in evil servitude."],[0,"The transformation of the right hand and the rod's changing into a snake became the first of the miracles."],[27,"These seem to me to signify in a figure the mystery of the Lord's incarnation, a manifestation of deity to men which effects the death of the tyrant and sets free those under his power."],[28,"What leads me to this understanding is the testimony of the Prophets and the Gospel. The Prophet declares: This is the change of the right hand of the most High, indicating that, although the divine nature is contemplated in its immutability, by condescension to the weakness of human nature it was changed to our shape and form."],[29,"When the hand of the lawgiver was extended from his bosom it was changed to an unnatural complexion, and when placed again in his bosom, it returned to its own natural beauty. Again, the only begotten God who is in the bosom of the Father is he who is the right hand of the most High."],[30,"When he was manifested to us from the bosom of the Father, he was changed to be like us. After he wiped away our infirmities, he again returned to his own bosom the hand which had been among us and had received our complexion. (The Father is the bosom of the right hand.) What is impassible by nature did not change into what is passible, but what is mutable and subject to passions was transformed into impassibility through its participation in the immutable."],[31,"The change from a rod into a snake should not trouble the lovers of Christ—as if we were adapting the doctrine of the incarnation to an unsuitable animal. For the Truth himself through the voice of the Gospel does not refuse a comparison like this in saying: And the Son of Man must be lifted up as Moses lifted up the serpent in the desert."],[32,"The teaching is clear. For if the father of sin is called a serpent by Holy Scripture and what is born of the serpent is certainly a serpent, it follows that sin is synonymous with the one who begot it. But the apostolic word testifies that the Lord was made into sin for our sake by being invested with our sinful nature."],[33,"This figure therefore is rightly applied to the Lord. For if sin is a serpent and the Lord became sin, the logical conclusion should be evident to all: By becoming sin he became also a serpent, which is nothing other than sin. For our sake he became a serpent that he might devour and consume the Egyptian serpents produced by the sorcerers."],[34,"This done, the serpent was changed back into a rod by which sinners are brought to their senses, and those slackening on the upward and toilsome course of virtue are given rest, the rod of faith supporting them through their high hopes. Only faith can guarantee the blessings that we hope for."],[35,"He who has some insight into these things right away becomes a god to those who resist the truth, who have been distracted to a material and unsubstantial delusion. They disdain the discussion of Being as so much idle talk, as Pharaoh says: Who is Yahweh, that I should listen to him? I do not know Yahweh. He considered valuable only the material and fleshly things which characterize lives governed by the most irrational sense."],[36,"If, on the other hand, he had been strengthened by the illumination of the light and had received such strength and power against his enemies, then, as one who has developed as an athlete by strenuous practice under his trainer, he would boldly and confidently strip for the contest with his opponents. With that rod, the word of faith, in his hand, he would prevail against the Egyptian serpents."],[37,"The foreign wife will follow him, for there are certain things derived from profane education which should not be rejected when we propose to give birth to virtue. Indeed moral and natural philosophy may become at certain times a comrade, friend, and companion of life to the higher way, provided that the offspring of this union introduce nothing of a foreign defilement."],[38,"Since his son had not been circumcised so as to cut off completely everything hurtful and impure, the angel who met them brought the fear of death. His wife appeased the angel when she presented her offspring as pure by completely removing that mark by which the foreigner was known."],[39,"I think that if someone who has been initiated under the guidance of the history follow closely the order of the historical figures, the sequence of the development in virtue marked out in our account will be clear. There is something fleshly and uncircumcised in what is taught by philosophy's generative faculty; when that has been completely removed, there remains the pure Israelite race."],[40,"For example, pagan philosophy says that the soul is immortal. This is a pious offspring. But it also says that souls pass from bodies to bodies and are changed from a rational to an irrational nature. This is a fleshly and alien foreskin. And there are many other such examples. It says there is a God, burt it thinks of him as material. It acknowledges him as Creator, but says he needed matter for creation. It affirms that he is both good and powerful, but that in all things he submits to the necessity of fate."],[41,"And one could describe in some detail how good doctrines are contaminated by profane philosophy's absurd additions. When these are completely removed, the angel of God comes to us in mercy, as if rejoicing in the true offspring of these doctrines."]],"id":"b2-2","r":[19,41],"w":1588},{"t":"The Meeting with Aaron","p":[[42,"We must return to the sequence in Scripture so that brotherly assistance might come out to meet us as we draw near the conflict with the Egyptians. For we remember the incidents of fighting and quarreling which involved Moses at the beginning of the life of virtue, the Egyptian oppressing the Hebrew and on another occasion a Hebrew disputing with his countryman."],[43,"For the one who has been lifted to the greatest virtue of soul by long training and supernatural illumination on the mountain, it is a friendly and peaceful encounter that takes place when his brother is brought by God to meet him. If this historical incident is taken in a more figurative spiritual sense, it will be found useful for our purpose."],[44,"For truly the assistance which God gives to our nature is provided to those who correctly live the life of virtue. This assistance was already there at our birth, but it is manifested and made known whenever we apply ourselves to diligent training in the higher life and strip ourselves for the more vigorous contests."],[45,"So as not to interpret the figures by our own figure, I shall set forth my understanding about this more plainly. There is a doctrine (which derives its trustworthiness from the tradition of the fathers) which says that after our nature fell into sin God did not disregard our fall and withhold his providence. No, on the one hand, he appointed an angel with an incorporeal nature to help in the life of each person and, on the other hand, he also appointed the corruptor who, by an evil and maleficent demon, afflicts the life of man and contrives against our nature."],[46,"Because man finds himself between these two who have contrary purposes for him, it is in his power to make the one prevail over the other. While the good angel by rational demonstration shows the benefits of virtue which are seen in hope by those who live aright, his opponent shows the material pleasures in which there is no hope of future benefits, but which are present, visible, can be partaken of, and enslave the senses of those who do not exercise their intellect."],[47,"If, then, one should withdraw from those who seduce him to evil and by the use of his reason turn to the better, putting evil behind him, it is as if he places his own soul, like a mirror, face to face with the hope of good things, with the result that the images and impressions of virtue, as it is shown to him by God, are imprinted on the purity of his soul. Then his brother brings him assistance and joins him, for the angel, who in a way is a brother to the rational and intellectual part of man's soul, appears, as I have said, and stands by us whenever we approach the Pharaoh."],[48,"If, while trying to parallel completely the historical account to the sequence of such intellectual contemplation, someone should somehow discover something in the account which does not coincide with our understanding, he should not reject the whole enterprise. He should always keep in mind our discussion's goal, to which we are looking while we relate these details. We have already said in our prologue that the lives of honored men would be set forth as a pattern of virtue for those who come after them."],[49,"Those who emulate their lives, however, cannot experience the identical literal events. For how could one again find the people multiplying during their sojourn in Egypt? And how again find the tyrant who enslaves the people and bears hostility to male offspring and allows the feminine and weaker to grow in numbers? And how again find all the other things which Scripture includes? Because therefore it has been shown to be impossible to imitate the marvels of these blessed men in these exact events, one might substi
